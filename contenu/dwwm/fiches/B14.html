                  enregistrer()
                  afficher()
                },
              }),
            ),
            ...pied,
          )
          return section
        }
        section.append(...pied)
        let rang = 0
        const poserLaSuivante = () => {
          const question = aPoser[rang]
          rang += 1
          if (!question) {
            // La dernière réponse est là : le cours se rouvre à la prochaine étape affichée.
            if (etat.enCours?.[serie]) {
              etat.enCours = { ...etat.enCours, [serie]: false }
              // Le retour au cours ne valait que pour cette série.
              etat.retourCours = false
              enregistrer()
            }
            // Une réponse vient d'être envoyée : la série se redessine avec toutes ses corrections.
            if (rang > 1) {
              afficher()
              remonter($('contenu'))
            }
            return
          }
          const bloc = afficherQuestion(
            serie,
            question,
            { reprise: refaire.includes(question) },
            poserLaSuivante,
          )
          if (pied.length > 0) pied[0].before(bloc)
          else section.append(bloc)
        }
        poserLaSuivante()
        return section
      }

      const LIBELLES_NIVEAU = {
        solide: 'Solide',
        partiel: 'Partiel',
        fragile: 'Fragile',
        pas_encore: 'Pas encore',
      }
      /** Hors de l'appli, la correction simulée ne juge pas : la bulle dit ce qu'elle a vu, sans niveau. */
      const LIBELLES_AUTONOME = {
        partiel: 'À comparer',
        fragile: 'Trop courte',
      }

      const LIBELLES_RAISON = {
        relance: 'Relance',
        avec_support: 'Avec support',
        recopiee: 'Recopiée',
        non_verifiee: 'Non vérifiée',
      }

      /**
       * La correction d'une réponse : BulleCorrection de l'appli, et son badge quand la réponse ne
       * compte pas pour le statut (une réponse recopiée ne referme pas d'erreur, par exemple).
       */
      /** « Avec support » dit lequel, quand la page le sait : la réponse collée, ou le cours rouvert. */
      const LIBELLES_SUPPORT = {
        colle: 'Réponse collée',
        cours: 'Cours rouvert pendant la série',
      }

      function bulleCorrection(correction) {
        return creer(
          'div',
          { className: 'correction', dataset: { niveau: correction.niveau } },
          creer('strong', {
            textContent:
              (mode === 'autonome' ? LIBELLES_AUTONOME[correction.niveau] : undefined) ??
              LIBELLES_NIVEAU[correction.niveau] ??
              correction.niveau,
          }),
          creer('p', { textContent: correction.message }),
          ...(!correction.compte && correction.raison_non_compte
            ? [
                creer('span', {
                  className: 'badge-compte',
                  textContent:
                    'Ne compte pas · ' +
                    ((correction.raison_non_compte === 'avec_support'
                      ? LIBELLES_SUPPORT[correction.support]
                      : undefined) ??
                      LIBELLES_RAISON[correction.raison_non_compte] ??
                      correction.raison_non_compte),
                }),
                // Juste mais sans effet : sans cette ligne, « Solide » laisse croire que l'erreur est refermée.
                ...(correction.niveau === 'solide'
                  ? [
                      creer('p', {
                        className: 'discret',
                        textContent:
                          'Juste, mais sans effet sur ton statut\u00a0: elle ne referme aucune erreur.',
                      }),
                    ]
                  : []),
              ]
            : []),
        )
      }

      /** Ce que la page garde d'une correction pour l'afficher plus tard, même après un rechargement. */
      const resumeCorrection = (correction, support) => ({
        id: correction.id,
        niveau: correction.niveau,
        message: correction.message,
        compte: correction.compte,
        raison_non_compte: correction.raison_non_compte ?? null,
        tour: correction.tour,
        echantillon: Boolean(correction.echantillon),
        // Le support envoyé avec la réponse, pour nommer « Avec support » dans le badge.
        support: support?.colle ? 'colle' : support?.retour_cours ? 'cours' : null,
      })

      /**
       * Une correction tirée au sort : l'apprenant dit, une fois, si le niveau lui semble juste. La
       * réponse est gardée avec la correction : l'avis n'est pas redemandé à la visite suivante.
       */
      function accordSur(correction) {
        if (!correction.echantillon || correction.avis !== undefined) return []
        const intitule = creer('span', {
          id: 'accord-' + correction.id,
          textContent: 'D’accord avec ce niveau\u00a0?',
        })
        const accord = creer(
          'div',
          { className: 'accord' },
          intitule,
          creer(
            'div',
            { className: 'actions' },
            ...[
              [true, 'Oui'],
              [false, 'Non'],
            ].map(([daccord, libelle]) =>
              creer('button', {
                type: 'button',
                className: 'bouton secondaire',
                textContent: libelle,
                onclick: () => {
                  pont.envoyer('correction.accord', { correction: correction.id, accord: daccord })
                  correction.avis = daccord
                  enregistrer()
                  accord.replaceWith(
                    creer('p', { className: 'discret', textContent: 'Merci, c’est noté.' }),
                  )
                },
              }),
            ),
          ),
        )
        accord.setAttribute('role', 'group')
        accord.setAttribute('aria-labelledby', intitule.id)
        return [accord]
      }

      /**
       * Une table de vérité à remplir (`saisie: { type: "table", entrees, colonnes }` dans le manifeste) :
       * les cas, rangés comme on compte en binaire (le premier fait change le moins souvent, FAUX avant
       * VRAI), et la réponse en texte, une ligne par cas, que lit le correcteur sans rien deviner :
       * « A FAUX, B FAUX : NON B VRAI ; A OU NON B VRAI ».
       */
      function casDeLaTable(entrees) {
        const nombre = entrees.length
        return Array.from({ length: 2 ** nombre }, (_, rang) =>
          entrees.map((_, place) => ((rang >> (nombre - 1 - place)) & 1) === 1),
        )
      }
      const enMot = (valeur) => (valeur ? 'VRAI' : 'FAUX')
      const casEnMots = (saisie, cas) =>
        saisie.entrees.map((entree, place) => entree + ' ' + enMot(cas[place])).join(', ')
      const texteDeLaTable = (saisie, valeurs) =>
        casDeLaTable(saisie.entrees)
          .map(
            (cas, ligne) =>
              casEnMots(saisie, cas) +
              ' : ' +
              saisie.colonnes
                .map((colonne, place) => colonne + ' ' + enMot(valeurs[ligne][place]))
                .join(' ; '),
          )
          .join('\n')
      /** Les valeurs d'une réponse déjà envoyée, relues dans son texte ; `null` si elle n'en vient pas. */
      function lireLaTable(saisie, texte) {
        const lignes = String(texte ?? '')
          .split('\n')
          .map((ligne) => ligne.replace(/\s+/g, ' ').trim())
        const valeurs = casDeLaTable(saisie.entrees).map((cas) => {
          const debut = casEnMots(saisie, cas) + ' : '
          const ligne = lignes.find((l) => l.startsWith(debut))
          if (ligne === undefined) return null
          const morceaux = ligne.slice(debut.length).split(' ; ')
          return saisie.colonnes.map((colonne, place) => {
            const morceau = morceaux[place]
            if (morceau === colonne + ' VRAI') return true
            if (morceau === colonne + ' FAUX') return false
            return null
          })
        })
        return valeurs.every((ligne) => ligne !== null && ligne.every((v) => v !== null))
          ? valeurs
          : null
      }
      /** Ce que dit « Écouter » de la table : son rangement et ce qu'il faut y choisir. */
      const lectureDeLaTable = (saisie) => {
        const cas = casDeLaTable(saisie.entrees)
        return (
          'Une table à remplir, une ligne par cas, de ' +
          casEnMots(saisie, cas[0]) +
          ' à ' +
          casEnMots(saisie, cas[cas.length - 1]) +
          '. Pour chaque ligne, choisis VRAI ou FAUX pour ' +
          saisie.colonnes.join(', puis pour ') +
          '.'
        )
      }

      /**
       * La table : les faits d'entrée déjà remplis, puis, pour chaque colonne demandée, un choix VRAI ou
       * FAUX par case (des radios, au clavier par les flèches). `valeurs` la préremplit ; `lue` la montre
       * en lecture seule, sans radio (une réponse envoyée).
       */
      function tableDeVerite(saisie, nom, valeurs, { lue = false } = {}) {
        const table = creer(
          'table',
          { className: 'table-saisie', dataset: { lecture: lectureDeLaTable(saisie) } },
          creer(
            'thead',
            {},
            creer(
              'tr',
              {},
              ...[...saisie.entrees, ...saisie.colonnes].map((titre, place) =>
                creer('th', {
                  scope: 'col',
                  textContent: titre,
                  className: place < saisie.entrees.length ? 'entree' : '',
                }),
              ),
            ),
          ),
        )
        const corps = creer('tbody')
        casDeLaTable(saisie.entrees).forEach((cas, ligne) => {
          const rangee = creer(
            'tr',
            {},
            ...cas.map((valeur) =>
              creer('td', { className: 'entree', textContent: enMot(valeur) }),
            ),
          )
          saisie.colonnes.forEach((colonne, place) => {
            const valeur = valeurs?.[ligne]?.[place]
            if (lue) {
              rangee.append(
                creer('td', {
                  className: 'valeur',
                  textContent: valeur === undefined || valeur === null ? '' : enMot(valeur),
                }),
              )
              return
            }
            const groupe = creer(
              'div',
              { className: 'choix' },
              ...[true, false].map((possible) =>
                creer(
                  'label',
                  {},
                  creer('input', {
                    type: 'radio',
                    name: nom + '-' + ligne + '-' + place,
                    value: possible ? 'vrai' : 'faux',
                    checked: valeur === possible,
                  }),
                  enMot(possible),
                ),
              ),
            )
            groupe.setAttribute('role', 'radiogroup')
            groupe.setAttribute('aria-label', casEnMots(saisie, cas) + ' : ' + colonne)
            rangee.append(creer('td', {}, groupe))
          })
          corps.append(rangee)
        })
        table.append(corps)
        return table
      }

      /**
       * Le champ d'une question : une zone de texte, ou la table que le manifeste déclare. Il rend
       * l'élément, son intitulé, ce qui manque avant l'envoi, la réponse en texte et de quoi le figer.
       */
      function champDeReponse(question, cle, depart) {
        const saisie = question.saisie
        if (saisie?.type !== 'table') {
          const zone = creer('textarea', { id: cle, value: depart })
          return {
            element: zone,
            intitule: (proprietes, ...enfants) =>
              creer('label', { htmlFor: zone.id, ...proprietes }, ...enfants),
            manque: () => (zone.value.trim() === '' ? 'Écris une réponse avant d’envoyer.' : ''),
            valeur: () => zone.value,
            figer: () => {
              zone.disabled = true
            },
          }
        }
        const table = tableDeVerite(saisie, cle, depart ? lireLaTable(saisie, depart) : null)
        table.id = cle
        const intituleId = cle + '-question'
        table.setAttribute('aria-labelledby', intituleId)
        const groupes = () => Array.from(table.querySelectorAll('[role="radiogroup"]'))
        const choisie = (groupe) => groupe.querySelector('input:checked')
        return {
          element: table,
          intitule: (proprietes, ...enfants) =>
            creer('p', { id: intituleId, ...proprietes }, ...enfants),
          manque: ({ montrer = false } = {}) => {
            const vides = groupes().filter((groupe) => !choisie(groupe))
            if (vides.length === 0) return ''
            if (montrer) vides[0].querySelector('input')?.focus()
            return vides.length === 1
              ? 'Choisis VRAI ou FAUX dans la dernière case vide avant d’envoyer.'
              : 'Choisis VRAI ou FAUX dans chaque case avant d’envoyer\u00a0: il en reste ' +
                  vides.length +
                  '.'
          },
          valeur: () => {
            const cases = groupes().map((groupe) => choisie(groupe)?.value === 'vrai')
            const largeur = saisie.colonnes.length
            return texteDeLaTable(
              saisie,
              casDeLaTable(saisie.entrees).map((_, ligne) =>
                cases.slice(ligne * largeur, (ligne + 1) * largeur),
              ),
            )
          },
          figer: () => {
            for (const entree of table.querySelectorAll('input')) entree.disabled = true
          },
        }
      }

      /** Une réponse envoyée, lisible : dans sa table quand la question en a une, sinon en texte. */
      function reponseLue(question, texte) {
        const valeurs =
          question.saisie?.type === 'table' ? lireLaTable(question.saisie, texte) : null
        if (valeurs === null)
          return creer('p', { className: 'reponse-envoyee', textContent: texte })
        const table = tableDeVerite(question.saisie, '', valeurs, { lue: true })
        table.classList.add('reponse-envoyee')
        // « Écouter » lit la réponse telle qu'elle est partie, une ligne par cas.
        table.dataset.lecture = 'Ta réponse\u00a0: ' + texte.split('\n').join('. ') + '.'
        return table
      }

      /**
       * Une question de la série, à répondre. `reprise` : elle a déjà sa réponse mais touche une erreur
       * critique ouverte ; on y répond de nouveau, depuis zéro (nouvelle tentative, premier tour).
       * Pendant la série, une réponse envoyée n'affiche pas sa correction (règle M01) : la page la garde
       * et la montre à la fin de la série, avec toutes les autres. `relance` : la série finie, l'apprenant
       * complète une réponse qui n'était pas Solide, après sa correction ; ce second tour ne compte pas
       * pour le statut, et sa correction s'affiche aussitôt. `apres` : ce qui suit quand elle est finie
       * (la question suivante de la série).
       */
      function afficherQuestion(
        serie,
        question,
        { reprise = false, relance = false } = {},
        apres = () => {},
      ) {
        const premiere = etat.corrigees?.[question.id]?.premiere
        const cle = (relance ? 'relance-' : 'rep-') + question.id
        const champ = champDeReponse(
          question,
          cle,
          relance ? etat.envoyees[question.id].reponse : '',
        )
        const zone = champ.element
        let colle = false
        zone.addEventListener('paste', () => {
          colle = true
          message.dataset.cause = ''
          message.textContent = AVERTIR_COLLE
        })
        // Le collage s’efface quand l’apprenant vide le champ pour écrire lui-même.
        zone.addEventListener('input', () => {
          if (!colle || (zone.value ?? '').trim() !== '') return
          colle = false
          if (message.textContent === AVERTIR_COLLE) message.textContent = ''
        })
        // Ce qui manquait se met à jour à mesure que l'apprenant remplit (les cases d'une table).
        zone.addEventListener('change', () => {
          if (message.dataset.cause === 'champ') message.textContent = champ.manque()
        })
        const radios = [
          ['sur', 'Sûr'],
          ['hesitant', 'Hésitant'],
          ['hasard', 'Au hasard'],
        ].map(([valeur, libelle]) => ({
          libelle,
          entree: creer('input', { type: 'radio', name: 'conf-' + cle, value: valeur }),
        }))
        const confiance = creer(
          'fieldset',
          { className: 'choix', dataset: { lecture: '' } },
          creer('legend', { textContent: 'Ta confiance' }),
          ...radios.map(({ libelle, entree }) => creer('label', {}, entree, libelle)),
        )
        const message = creer('p', { className: 'erreur', role: 'alert' })
        const sortie = creer('div', { className: 'sortie' })
        sortie.setAttribute('aria-live', 'polite')
        const bouton = creer('button', {
          type: 'button',
          className: 'bouton',
          textContent: relance ? 'Envoyer le complément' : 'Envoyer',
        })
        const figer = () => {
          champ.figer()
          for (const { entree } of radios) entree.disabled = true
        }
        bouton.addEventListener('click', async () => {
          const choisie = confiance.querySelector('input:checked')
          const manque = champ.manque({ montrer: true })
          message.dataset.cause = manque ? 'champ' : ''
          if (manque) return void (message.textContent = manque)
          if (!choisie) return void (message.textContent = 'Choisis ta confiance avant d’envoyer.')
          message.textContent = ''
          bouton.disabled = true
          const reponse = champ.valeur()
          try {
            const correction = await pont.demanderCorrection({
              serie,
              question: question.id,
              reponse,
              confiance: choisie.value,
              relance: relance ? premiere.message : '',
              support: { colle, retour_cours: etat.retourCours },
            })
            const support = { colle, retour_cours: etat.retourCours }
            // Une réponse nouvelle remplace ce que la précédente avait fait repérer sur cette
            // question ; un complément s'y ajoute.
            if (!relance) remplacerReperees(question.id)
            noterReperees(question.id, correction.erreurs_critiques)
            figer()
            bouton.hidden = true
            if (relance) {
              const gardee = resumeCorrection(correction, support)
              etat.corrigees = {
                ...etat.corrigees,
                [question.id]: {
                  ...etat.corrigees[question.id],
                  relance: { reponse, correction: gardee },
                },
              }
              enregistrer()
              sortie.replaceChildren(bulleCorrection(gardee), ...accordSur(gardee))
              return
            }
            etat.corrigees = {
              ...(etat.corrigees ?? {}),
              [question.id]: { premiere: resumeCorrection(correction, support), relance: null },
            }
            etat.envoyees[question.id] = { reponse, confiance: choisie.value }
            enregistrer()
            sortie.replaceChildren(
              creer('p', {
                className: 'discret',
                textContent:
                  'Envoyée. Sa correction s’affichera à la fin de la série, pour ne pas souffler les questions suivantes.',
              }),
            )
            majPied()
            apres()
          } catch (erreur) {
            message.textContent =
              'Correction impossible\u00a0: ' +
              (erreur && erreur.detail ? erreur.detail : erreur.message)
            bouton.disabled = false
          }
        })
        if (relance)
          return creer(
            'div',
            { className: 'relance' },
            champ.intitule({
              textContent:
                'Complète ta réponse, d’après sa correction. Ce complément ne compte pas pour le statut.',
            }),
            zone,
            confiance,
            creer('div', { className: 'actions' }, bouton),
            message,
            sortie,
          )
        const ouvertes = erreursOuvertes()
        const touchees = manifeste.erreurs_critiques.filter(
          (e) => (question.erreurs ?? []).includes(e.id) && ouvertes.includes(e.id),
        )
        const carte = creer(
          'div',
          { className: 'item', dataset: reprise ? { fait: 'reprise' } : {} },
          ...(reprise
            ? [
                creer('p', {
                  className: 'item-reprise',
                  textContent: 'À reprendre\u00a0: ' + touchees.map((e) => e.libelle).join(' ; '),
                }),
              ]
            : []),
          champ.intitule({}, creer('strong', { textContent: question.question })),
          zone,
          confiance,
          creer('div', { className: 'actions' }, bouton),
          message,
          sortie,
        )
        // « Écouter » lit la question, puis sa correction quand elle est là.
        carte.prepend(barreEcoute(carte))
        return carte
      }

      /** Les erreurs critiques ouvertes pour l'appli ; hors de l'appli, celles du dernier bilan. */
      function erreursOuvertes() {
        if (Array.isArray(dernierStatut?.manque))
          return dernierStatut.manque.find((m) => m.code === 'erreur_ouverte')?.erreurs ?? []
        return etat.bilan?.ids ?? []
      }

      /**
       * Les questions d'une série déjà répondues qui se reposent : en restitution, celles qui touchent
       * une erreur critique ouverte (une erreur ouverte rouvre la restitution, et une réponse solide à
       * une question qui la touche la referme). Seulement dans l'appli : hors de l'appli, rien ne
       * referme une erreur.
       */
      function aRefaire(serie) {
        if (mode !== 'appli' || !serieOuverte[serie]) return []
        if (serie !== 'restitution') return []
        const ouvertes = erreursOuvertes()
        return questions(serie).filter(
          (q) => etat.envoyees[q.id] && (q.erreurs ?? []).some((e) => ouvertes.includes(e)),
        )
      }
      /** Les erreurs ouvertes qu'une de ces questions peut refermer. */
      const erreursAReprendre = (refaire) =>
        erreursOuvertes().filter((e) => refaire.some((q) => (q.erreurs ?? []).includes(e)))

      /**
       * Le bilan : ce qui est fait dans la fiche, puis les erreurs critiques du bloc à cocher. Une
       * erreur ouverte, ou repérée par le correcteur depuis le dernier bilan, est cochée et ne se
       * décoche pas : seule une réponse solide à une question qui la touche la referme (règles P01 et
       * V01). On ne l'envoie qu'une fois la restitution faite.
       */
      function afficherBilan() {
        // Le résultat d'un bilan se lit là où on l'a envoyé : à la visite suivante, il serait périmé
        // (une réponse a pu refermer une erreur depuis). Un bilan encore en route garde sa réponse.
        if (bilanEnvoye !== null && (bilanEnvoye.statut !== null || bilanEnvoye.refus !== null))
          bilanEnvoye = null
        const totalRestitution = manifeste.restitution.length
        const restitutionFaite =
          !serieOuverte.restitution || reponsesFinies('restitution') === totalRestitution
        const ligne = (fait, texte) =>
          creer('li', { textContent: texte, dataset: { fait: fait ? 'oui' : 'non' } })
        // La ligne de la restitution change quand une erreur s'ouvre ou se ferme (statut reçu).
        const ligneRestitution = ligne(false, '')
        const direRestitution = () => {
          const aRefermer = erreursAReprendre(aRefaire('restitution')).length
          ligneRestitution.dataset.fait = restitutionFaite && aRefermer === 0 ? 'oui' : 'non'
          ligneRestitution.textContent = !restitutionFaite
            ? 'Restitution\u00a0: ' +
              pluriel(reponsesFinies('restitution'), 'question terminée', 'questions terminées') +
              ' sur\u00a0' +
              totalRestitution +
              '.'
            : aRefermer === 0
              ? 'Restitution faite.'
              : aRefermer === 1
                ? 'Restitution faite. Pour refermer l’erreur cochée, réponds de nouveau à une question qui la touche.'
                : 'Restitution faite. Pour refermer les ' +
                  aRefermer +
                  ' erreurs cochées, réponds de nouveau à une question sur chacune.'
          return aRefermer
        }
        const lignes = [ligneRestitution]
        const items = manifeste.pratique.flatMap((exercice) => exercice.items)
        if (items.length > 0) {
          const reussis = items.filter((item) => itemReussi(item.id))
          const etats = itemsPratique()
          const sansAide = reussis.filter((item) => etats.get(item.id).etat === 'reussi').length
          lignes.push(
            ligne(
              reussis.length === items.length && sansAide === items.length,
              'Pratique\u00a0: ' +
                pluriel(reussis.length, 'item réussi', 'items réussis') +
                ' sur\u00a0' +
                items.length +
                (reussis.length > 0 ? ', dont ' + sansAide + ' sans aide.' : '.'),
            ),
          )
        }
        const atelier = suiviAtelier()
        if (etapes.some((e) => e.type === 'atelier'))
          lignes.push(
            ligne(
              atelier.reussi,
              atelier.reussi
                ? 'Atelier\u00a0: réussi sans aide.'
                : !atelier.dernier
                  ? 'Atelier\u00a0: pas encore fait.'
                  : atelier.dernier.reussi
                    ? 'Atelier\u00a0: réussi avec de l’aide, à refaire sans aide.'
                    : 'Atelier\u00a0: pas réussi.',
            ),
          )

        const reperees = new Set(Object.values(etat.erreurs ?? {}).flat())
        /** Cochée d'office et verrouillée : ouverte, ou repérée depuis le dernier bilan. */
        const verrouillee = (id) =>
          erreursOuvertes().includes(id) || (etat.aCocher ?? []).includes(id)
        const cases = manifeste.erreurs_critiques.map((erreur) =>
          creer('input', {
            type: 'checkbox',
            name: 'erreur',
            value: erreur.id,
            checked: verrouillee(erreur.id),
            disabled: verrouillee(erreur.id),
          }),
        )
        const majCases = () => {
          for (const c of cases) {
            c.disabled = verrouillee(c.value)
            if (c.disabled) c.checked = true
          }
        }
        const erreurs = creer(
          'fieldset',
          { className: 'cases' },
          creer('legend', { textContent: 'Les erreurs critiques du bloc' }),
          creer('p', {
            className: 'discret',
            textContent:
              'Coche celles que tu as faites et que tu dois encore revoir. Une erreur cochée met le bloc «\u00a0À reprendre\u00a0», quel que soit le reste. Une erreur cochée, ou repérée dans tes réponses, reste cochée\u00a0: seule une réponse solide, écrite sans aide, à une question qui la touche la referme.',
          }),
          ...manifeste.erreurs_critiques.map((erreur, k) =>
            creer(
              'label',
              {},
              cases[k],
              creer(
                'span',
                {},
                erreur.libelle,
                ...(reperees.has(erreur.id)
                  ? [
                      creer('span', {
                        className: 'discret',
                        textContent: ' Repérée dans tes réponses.',
                      }),
                    ]
                  : []),
              ),
            ),
          ),
        )
        const bouton = creer('button', { type: 'button', className: 'bouton' })
        // Déjà envoyé, il ne se renvoie que si les cases disent autre chose que la référence : les
        // erreurs encore ouvertes, que donnent le dernier bilan ou le dernier statut de l'appli.
        let reference = erreursOuvertes()
        const cochees = () => cases.filter((c) => c.checked).map((c) => c.value)
        const differe = () => {
          const ids = cochees()
          return ids.length !== reference.length || ids.some((id) => !reference.includes(id))
        }
        const direBouton = () => {
          const envoye = restitutionFaite && Boolean(etat.bilan) && !differe()
          bouton.disabled = !restitutionFaite || envoye
          bouton.textContent = envoye ? 'Bilan envoyé' : 'Envoyer le bilan'
        }
        direBouton()
        const retour = creer('p', { className: 'retour', role: 'status' })
        const restitution = etapes.find((e) => e.type === 'restitution')
        const actions = creer('div', { className: 'ecran-nav pied' }, bouton)
        if (etat.bilan && restitutionFaite)
          retour.textContent =
            mode === 'appli'
              ? 'Ton dernier bilan est envoyé. Modifie les cases et renvoie-le si ça a changé.'
              : 'Ton dernier bilan est noté dans cette page (hors de l’appli, rien n’est envoyé).'
        if (!restitutionFaite) retour.textContent = 'Termine la restitution pour envoyer ton bilan.'
        // Vers la restitution : pour la finir, ou pour refermer une erreur ouverte.
        const versRestitution = creer('button', {
          type: 'button',
          className: 'bouton secondaire',
          textContent: 'Aller à la restitution',
          onclick: () => aller(restitution.id),
        })
        if (restitution) actions.prepend(versRestitution)
        const majRestitution = () => {
          const aRefermer = direRestitution()
          versRestitution.hidden = restitutionFaite && aRefermer === 0
        }
        majRestitution()
        erreurs.addEventListener('change', direBouton)
        const direStatut = () => {
          if (bilanEnvoye === null) return
          if (bilanEnvoye.refus) {
            retour.textContent = 'Le bilan n’est pas parti\u00a0: ' + bilanEnvoye.refus
            // Refusé : le bilan qui fait foi reste le précédent, et les cases cochées peuvent repartir.
            etat.bilan = bilanEnvoye.precedent
            etat.aCocher = [...new Set([...(etat.aCocher ?? []), ...bilanEnvoye.aCocher])]
            enregistrer()
            reference = erreursOuvertes()
            return
          }
          if (mode !== 'appli') {
            retour.textContent = 'Bilan noté dans cette page (hors de l’appli, rien n’est envoyé).'
            return
          }
          retour.textContent = bilanEnvoye.statut
            ? 'Statut recalculé\u00a0: ' +
              (LIBELLES_STATUT[bilanEnvoye.statut] ?? bilanEnvoye.statut) +
              '.'
            : 'Le statut se recalcule…'
        }
        bouton.addEventListener('click', () => {
          if (!restitutionFaite) return
          const ids = cochees()
          const id = pont.envoyer('bilan.erreurs', { ids })
          if (!id) {
            retour.textContent = 'Le bilan n’a pas pu partir. Réessaie dans un instant.'
            return
          }
          bilanEnvoye = {
            id,
            statut: null,
            refus: null,
            precedent: etat.bilan,
            aCocher: etat.aCocher ?? [],
          }
          etat.bilan = { ids }
          // Envoyées, les erreurs repérées sont ouvertes : c'est le statut qui les verrouille désormais.
          etat.aCocher = []
          enregistrer()
          reference = ids
          direBouton()
          direStatut()
        })
        majBilan = () => {
          // Un refus remet d'abord le bilan précédent : les cases refusées restent alors cochées.
          direStatut()
          // Des cases que l'apprenant n'a pas changées suivent les erreurs encore ouvertes.
          if (!differe()) {
            reference = erreursOuvertes()
            for (const c of cases) c.checked = reference.includes(c.value)
          }
          majCases()
          majRestitution()
          direBouton()
        }
        const section = creer(
          'section',
          {},
          creer('h2', { textContent: 'Bilan' }),
          creer('h3', { textContent: 'Ce que tu as fait' }),
          creer('ul', { className: 'bilan-liste' }, ...lignes),
          erreurs,
          actions,
          retour,
        )
        section.insertBefore(barreEcoute(section), section.children[1])
        return section
      }

      function afficher() {
        // Une lecture en cours ne déborde pas sur l'étape suivante.
        window.speechSynthesis?.cancel()
        majPied = () => {}
        majBilan = () => {}
        majEssais = () => {}
        majPratique = () => {}
        majAtelier = () => {}
        clearTimeout(minuteurAtelier)
        afficherEtapes()
        const etape = etapes.find((e) => e.id === etat.etape) ?? etapes[0]
        let vue
        if (masquee(etape)) {
          vue = creer(
            'section',
            {},
            creer('h2', { textContent: etape.titre }),
            creer('p', {
              textContent:
                'Masqué\u00a0: la restitution se fait sans le cours. Cette étape s’ouvrira après ta dernière réponse.',
            }),
            creer('button', {
              type: 'button',
              className: 'bouton secondaire',
              textContent: 'Revenir au cours',
              onclick: () => {
                etat.retourCours = true
                enregistrer()
                afficher()
                noterVue()
              },
            }),
            creer('p', {
              className: 'discret',
              textContent: 'Tes prochaines réponses seront alors marquées « retour au cours ».',
            }),
          )
        } else if (etape.type === 'aisance' && bilanAttendu())
          // L'aisance compte pour « Maîtrisé » : une erreur repérée passe d'abord par le bilan.
          vue = creer(
            'section',
            {},
            creer('h2', { textContent: etape.titre }),
            ...attenteBilan('L’aisance'),
            ...piedEtape(etape),
          )
        else
          vue =
            (ETAPES_LIBRES.includes(etape.type)
              ? () => afficherLibre(etape)
              : {
                  carte: () => afficherCarte(etape),
                  pratique: afficherPratique,
                  restitution: () => afficherSerie('restitution', 'Restitution'),
                  bilan: afficherBilan,
                }[etape.type])?.() ??
            creer('p', {
              className: 'discret',
              textContent: 'Cette étape n’est pas dans cette fiche.',
            })
        $('contenu').replaceChildren(vue)
        // Point d'accroche des fiches : le HTML libre de l'étape est en place, son script peut l'animer.
        // Les traces gardées (fiche:trace) lui reviennent avec.
        document.dispatchEvent(
          new CustomEvent('fiche:rendu', {
            detail: {
              etape,
              traces: { ...(etat.traces ?? {}) },
              aisance: [...aisanceServeur],
              // L'état des items de pratique : un outil y lit qu'un item est réussi, pour le remontrer
              // avec sa réponse, et sur quel cas le montrer (`cas`). `refaire` : il se refait sur l'autre
              // cas (réussi avec une aide éloignée, ou en relais), et ne se remontre pas.
              pratique: Object.fromEntries(
                [...itemsPratique()].map(([id, item]) => [
                  id,
                  {
                    reussi: item.etat !== 'a_faire',
                    aide: item.etat === 'reussi' ? 0 : (item.dernier?.aide ?? 0),
                    explique: itemExplique(id),
                    solutionVue: item.solutionVue,
                    refaire: item.refaire || item.relais,
                    cas: item.cas,
                  },
                ]),
              ),
            },
          }),
        )
        // Les outils montés, les essais déjà notés se figent et la série finie montre sa correction ;
        // une explication montre ce qui répond aux essais de l'apprenant.
        majEssais()
        rappelerEssais($('contenu'))
      }

      async function demarrer() {
        // Chrome charge ses voix à la première demande : on la fait tôt, « Écouter » les trouve prêtes.
        window.speechSynthesis?.getVoices()
        if (!pont) {
          $('mode').textContent = 'Pont indisponible'
          return
        }
        pont.surStatut(({ statut, manque, pratique }) => {
          dernierStatut = { statut, manque }
          recevoirPratique(pratique)
          majPratique()
          majAtelier()
          $('statut').textContent = 'Statut\u00a0: ' + (LIBELLES_STATUT[statut] ?? statut)
          if (bilanEnvoye !== null && bilanEnvoye.statut === null) bilanEnvoye.statut = statut
          majBilan()
        })
        pont.surErreur((erreur) => {
          $('statut').textContent = 'Erreur\u00a0: ' + erreur.detail
          // Un résultat de pratique refusé n'est pas gardé par le serveur : il n'attend plus.
          const refuse = essaisEnAttente.findIndex((resultat) => resultat.id === erreur.message_id)
          if (erreur.code === 'message_refuse' && refuse >= 0) {
            essaisEnAttente.splice(refuse, 1)
            majPratique()
          }
          const constatRefuse = ateliersEnAttente.findIndex(
            (constat) => constat.id === erreur.message_id,
          )
          if (erreur.code === 'message_refuse' && constatRefuse >= 0) {
            ateliersEnAttente.splice(constatRefuse, 1)
            majAtelier()
            majPied()
          }
          if (bilanEnvoye !== null && erreur.message_id === bilanEnvoye.id) {
            bilanEnvoye.refus = erreur.detail
            majBilan()
            return
          }
          // La barre est cachée dans l'appli : l'erreur s'affiche au-dessus de l'étape.
          $('avis').textContent = 'Erreur\u00a0: ' + erreur.detail
          $('avis').hidden = false
        })
        pont.surEtape((id, { retourCours }) => {
          if (!etapes.some((e) => e.id === id)) return
          // « Revoir le cours » de l'appli, pendant la série : le cours se rouvre en un clic, et les
          // réponses suivantes le disent, comme avec « Revenir au cours » de la page.
          if (retourCours && serieEnCours() !== undefined) etat.retourCours = true
          aller(id)
        })
        pont.surRejet(({ question, erreur }) => {
          if (!retirerReperee(question, erreur)) return
          // Le bilan affiché redessine ses cases ; ailleurs, seul ce qui attend le bilan change.
          if (etapes.find((e) => e.id === etat.etape)?.type === 'bilan') afficher()
          else majPied()
        })
        const depart = await pont.demarrer({
          manifeste: { bloc: manifeste.bloc, version: manifeste.version },
          autonome,
        })
        mode = depart.mode
        if (depart.init?.theme) document.documentElement.dataset.theme = depart.init.theme
        // Hors de l'appli (aperçu dans une page), le fil d'étapes de la fiche est le seul : on le rend.
        if (mode !== 'appli') delete document.documentElement.dataset.integree
        $('mode').textContent = mode === 'appli' ? 'Dans l’appli' : 'Mode autonome'
        if (depart.init) {
          recevoirPratique(depart.init.pratique)
          serieOuverte = depart.init.serie_ouverte
          aisanceServeur = depart.init.aisance ?? []
          dernierStatut ??= { statut: depart.init.statut, manque: null }
          $('statut').textContent =
            'Statut\u00a0: ' + (LIBELLES_STATUT[depart.init.statut] ?? depart.init.statut)
        }
        pont.surInit((init) => {
          aisanceServeur = init.aisance ?? []
          recevoirPratique(init.pratique)
          const serieChangee = serieOuverte.restitution !== init.serie_ouverte.restitution
          serieOuverte = init.serie_ouverte
          // Redessiner efface une réponse en cours d'écriture : seulement quand une série s'ouvre ou
          // se ferme (rien ne s'y écrit à ce moment-là).
          if (serieChangee) afficher()
          else {
            majPied()
            majBilan()
          }
        })
        if (depart.etat && typeof depart.etat === 'object') etat = { ...etat, ...depart.etat }
        reprendreAnciennePratique()
        afficher()
        // L'étape montrée à l'ouverture est vue, comme celle où l'on va (la première, sinon jamais cochée).
        noterVue()
      }
      void demarrer()
    </script>
  </body>
</html>
