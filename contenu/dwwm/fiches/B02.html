        --couleur-accent-sur-fond: light-dark(#ffffff, #0f1a28);
        --couleur-accent-douce: light-dark(#e8eff8, #1f2b3a);
        --couleur-succes: light-dark(#276f50, #5dc196);
        --couleur-alerte: light-dark(#95620a, #e0ac4a);
        --couleur-erreur: light-dark(#ae3846, #ee8591);
        --couleur-focus: light-dark(#2b6cb0, #8bb9f5);
        --effet-ombre-carte: light-dark(#1b1f24, #000000);
        --espacement-4: 0.25rem;
        --espacement-8: 0.5rem;
        --espacement-12: 0.75rem;
        --espacement-16: 1rem;
        --espacement-20: 1.25rem;
        --espacement-24: 1.5rem;
        --espacement-32: 2rem;
        --espacement-48: 3rem;
        --rayon-champ: 0.625rem;
        --rayon-carte: 0.875rem;
        --rayon-option: 0.375rem;
        --duree-transition: 160ms;
        --focus-anneau: 0 0 0 2px var(--couleur-fond), 0 0 0 4px var(--couleur-focus);
        --ombre-option: 0 2px 6px color-mix(in srgb, var(--effet-ombre-carte) 8%, transparent);
        --hauteur-champ: 48px;
        --hauteur-bouton: 48px;
        --cible-tactile-min: 44px;
        --largeur-lecture: 62ch;
        --police-texte: 'Inter', system-ui, sans-serif;
        --police-code: 'JetBrains Mono', ui-monospace, monospace;
      }
      /* Le thème choisi dans l'appli (message etat.init) l'emporte sur le réglage du téléphone. */
      :root[data-theme='clair'] {
        color-scheme: light;
      }
      :root[data-theme='sombre'] {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: var(--couleur-fond);
        color: var(--couleur-encre);
        font-family: var(--police-texte);
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5rem;
      }
      button,
      summary,
      label {
        touch-action: manipulation;
      }

      /* Barre et fil d'étapes : montrés seulement hors de l'appli (aperçu), qui a les siens. */
      .barre {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8) var(--espacement-12);
        min-height: 56px;
        padding: var(--espacement-8) var(--espacement-16);
        background: var(--couleur-surface);
        border-block-end: 1px solid var(--couleur-ligne);
      }
      .barre h1 {
        flex: 1 1 140px;
        min-width: 0;
        margin: 0;
        font-size: 1rem;
        font-weight: 500;
        line-height: 1.5rem;
      }
      .barre p {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8);
        margin: 0;
      }
      .mode {
        padding: 2px var(--espacement-8);
        border-radius: var(--rayon-option);
        background: var(--couleur-surface-douce);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .fil {
        background: var(--couleur-surface);
        border-block-end: 1px solid var(--couleur-ligne);
      }
      .bascule {
        display: none;
      }
      .etapes,
      .moment > ol {
        display: flex;
        flex-wrap: wrap;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .etapes {
        gap: var(--espacement-4) var(--espacement-16);
        justify-content: center;
        padding: 0 var(--espacement-12);
      }
      /* Un moment du cycle : son nom, puis ses étapes ; celui de l'étape courante prend l'accent. */
      .moment {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0 var(--espacement-4);
      }
      .moment > ol {
        gap: 0 var(--espacement-4);
      }
      .moment-nom {
        padding: 0 var(--espacement-8);
        color: var(--couleur-texte-discret);
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .moment[data-courant='oui'] > .moment-nom {
        color: var(--couleur-accent);
      }
      .onglet {
        position: relative;
        min-height: 44px;
        padding: 0 var(--espacement-12);
        border: 0;
        background: transparent;
        color: var(--couleur-texte-secondaire);
        font: inherit;
        font-size: 0.875rem;
        line-height: 1.25rem;
        white-space: nowrap;
        cursor: pointer;
      }
      .onglet:hover {
        color: var(--couleur-encre);
      }
      .onglet:focus-visible {
        outline: none;
        border-radius: var(--rayon-champ);
        box-shadow: var(--focus-anneau);
      }
      .onglet[aria-current='step'] {
        color: var(--couleur-accent);
        font-weight: 500;
      }
      .onglet[aria-current='step']::after {
        position: absolute;
        inset-block-end: 0;
        inset-inline: var(--espacement-12);
        block-size: 2px;
        background: var(--couleur-accent);
        content: '';
      }
      @media (max-width: 40rem) {
        .bascule {
          display: flex;
          align-items: center;
          justify-content: space-between;
          inline-size: 100%;
          min-height: 48px;
          padding: 0 var(--espacement-16);
          border: 0;
          background: transparent;
          color: var(--couleur-accent);
          font: inherit;
          font-size: 0.875rem;
          font-weight: 500;
          line-height: 1.25rem;
          cursor: pointer;
        }
        .fil[data-ouvert='false'] .etapes {
          display: none;
        }
        .etapes {
          flex-direction: column;
          gap: var(--espacement-4);
          justify-content: flex-start;
          padding-block-end: var(--espacement-8);
        }
        .moment,
        .moment > ol {
          flex-direction: column;
          align-items: stretch;
        }
        .moment-nom {
          padding: var(--espacement-8) var(--espacement-12) 0;
        }
        .onglet {
          inline-size: 100%;
          text-align: start;
        }
        .onglet[aria-current='step']::after {
          display: none;
        }
      }
      /* Dans l'appli, la barre et le fil d'étapes sont ceux de la page : la fiche n'en montre pas un second. */
      html[data-integree] .barre,
      html[data-integree] .fil {
        display: none;
      }
      html[data-integree] section > h2 {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /*
       * Dans l'appli, l'iframe prend la hauteur du contenu (message page.taille) : la fiche ne défile
       * pas seule. Elle se pose sur le fond de la page, ses cartes ont la largeur de celle du haut.
       */
      html[data-integree] {
        scrollbar-width: none;
      }
      html[data-integree]::-webkit-scrollbar {
        display: none;
      }
      html[data-integree] body {
        background: transparent;
      }
      html[data-integree] main {
        max-width: none;
        padding: 0;
      }

      /* Page : une colonne, des cartes séparées par le même intervalle que dans l'appli. */
      main {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-16);
        max-width: 760px;
        margin: 0 auto;
        padding: var(--espacement-16) var(--espacement-16) var(--espacement-48);
      }
      /* Une erreur de l'appli : la barre est cachée dans l'appli, l'avis passe au-dessus de l'étape. */
      .avis {
        margin: 0;
        padding: var(--espacement-12) var(--espacement-16);
        border: 1px solid var(--couleur-erreur);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface);
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      #contenu {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-16);
        min-width: 0;
      }
      section {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
        padding: var(--espacement-20);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-carte);
        background: var(--couleur-surface);
      }
      /* Les blocs d'une carte s'espacent par le gap, jamais par des marges qui se cumulent. */
      section :is(h2, h3, h4, p, ul, ol, dl, figure, blockquote, pre, fieldset) {
        margin: 0;
      }
      .ecran,
      .enonce {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
      }
      .ecran[hidden],
      .bouton[hidden],
      [data-si-essai][hidden] {
        display: none;
      }
      h2 {
        font-size: 1.375rem;
        font-weight: 600;
        line-height: 1.75rem;
        text-wrap: balance;
      }
      h3 {
        font-size: 1.125rem;
        font-weight: 600;
        line-height: 1.625rem;
        text-wrap: balance;
      }
      h4 {
        font-size: 1rem;
        font-weight: 600;
      }
      p,
      li {
        overflow-wrap: break-word;
      }
      .ecran p,
      .ecran li {
        max-width: var(--largeur-lecture);
      }
      .ecran .accroche {
        font-size: 1.125rem;
        line-height: 1.75rem;
      }
      ul,
      ol {
        padding-inline-start: var(--espacement-20);
      }
      /* Seulement les listes du contenu : le fil d'étapes et les autres listes d'interface ont leur propre gap. */
      section :is(ul, ol) > li + li {
        margin-top: var(--espacement-8);
      }
      ul.plain {
        padding-inline-start: var(--espacement-20);
      }
      .discret {
        color: var(--couleur-texte-secondaire);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      a {
        color: var(--couleur-encre);
        font-weight: 500;
        text-decoration: none;
        transition: color var(--duree-transition);
      }
      a:hover {
        color: var(--couleur-accent);
      }
      code,
      kbd {
        font-family: var(--police-code);
        font-size: 0.875em;
        font-variant-ligatures: none;
      }
      code {
        padding: 1px var(--espacement-4);
        border-radius: var(--rayon-option);
        background: var(--couleur-surface-douce);
      }
      pre {
        overflow-x: auto;
        padding: var(--espacement-12);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      pre code {
        padding: 0;
        background: none;
      }

      /* Boutons : Bouton.module.css (principal, secondaire). */
      button {
        font: inherit;
      }
      .bouton {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--espacement-8);
        min-height: var(--hauteur-bouton);
        min-width: var(--cible-tactile-min);
        padding: 0 var(--espacement-16);
        border: 1px solid transparent;
        border-radius: var(--rayon-champ);
        background: var(--couleur-accent);
        color: var(--couleur-accent-sur-fond);
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color var(--duree-transition) ease,
          border-color var(--duree-transition) ease,
          transform var(--duree-transition) ease;
      }
      .bouton:hover:not(:disabled) {
        background: color-mix(in srgb, var(--couleur-accent) 88%, var(--couleur-encre));
      }
      .bouton:active:not(:disabled) {
        background: color-mix(in srgb, var(--couleur-accent) 75%, var(--couleur-encre));
        transform: translateY(1px);
      }
      .bouton.secondaire {
        border-color: var(--couleur-controle);
        background: transparent;
        color: var(--couleur-encre);
      }
      .bouton.secondaire:hover:not(:disabled) {
        background: var(--couleur-surface-douce);
      }
      .bouton.secondaire:active:not(:disabled) {
        border-color: var(--couleur-accent);
        background: var(--couleur-surface-douce);
      }
      .bouton:focus-visible {
        outline: none;
        box-shadow: var(--focus-anneau);
      }
      .bouton:disabled {
        border-color: transparent;
        background: var(--couleur-surface-douce);
        color: var(--couleur-encre);
        opacity: 0.55;
        cursor: not-allowed;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-8);
      }
      @media (prefers-reduced-motion: reduce) {
        .bouton,
        a {
          transition: none;
        }
        .bouton:active:not(:disabled) {
          transform: none;
        }
      }

      /* Champs : ChampTexte, ZoneDeTexte, Selecteur. */
      textarea,
      input[type='text'],
      select {
        width: 100%;
        min-height: var(--hauteur-champ);
        padding: 0 var(--espacement-12);
        border: 1px solid var(--couleur-controle);
        border-radius: var(--rayon-champ);
        background-color: var(--couleur-fond);
        color: var(--couleur-encre);
        font: inherit;
        transition: border-color var(--duree-transition) ease;
      }
      input[type='text'] {
        width: auto;
        font-family: var(--police-code);
        font-variant-ligatures: none;
      }
      textarea {
        min-height: 7rem;
        padding: var(--espacement-12);
        resize: vertical;
        field-sizing: content;
      }
      .reponse-envoyee {
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      textarea:disabled,
      input:disabled {
        background-color: var(--couleur-surface-douce);
        opacity: 0.65;
      }
      textarea:focus-visible,
      input[type='text']:focus-visible,
      select:focus-visible {
        outline: none;
        border-color: var(--couleur-accent);
        box-shadow: var(--focus-anneau);
      }
      select {
        padding-inline-end: var(--espacement-32);
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, currentcolor 50%),
          linear-gradient(135deg, currentcolor 50%, transparent 50%);
        background-position:
          calc(100% - 1.125rem) 50%,
          calc(100% - 0.8125rem) 50%;
        background-repeat: no-repeat;
        background-size:
          0.3125rem 0.3125rem,
          0.3125rem 0.3125rem;
      }
      /* Une question : sa carte propre, sur le fond de la carte de l'étape. */
      .item {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
        padding: var(--espacement-16);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      .item > label,
      .relance > label {
        font-weight: 500;
      }
      /* Le complément d'une réponse, après sa correction, dans la carte de la question. */
      .relance {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
      }
      .item[data-fait='oui'] {
        border-color: var(--couleur-succes);
      }
      /* Une question à reprendre : la couleur du statut « À reprendre » de l'appli. */
      .item[data-fait='reprise'] {
        border-color: var(--couleur-erreur);
      }
      .item-reprise {
        margin: 0;
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1.25rem;
      }
      .erreur {
        margin: 0;
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .erreur:empty {
        display: none;
      }

      /* Confiance : GroupeSegmente. */
      fieldset {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-8);
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }
      legend {
        float: left;
        width: 100%;
        padding: 0;
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1.25rem;
        color: var(--couleur-texte-secondaire);
      }
      .choix label {
        position: relative;
        display: flex;
        flex: 1 0 auto;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding-inline: var(--espacement-8);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-option);
        background: var(--couleur-fond);
        white-space: nowrap;
        cursor: pointer;
      }
      /* La vraie radio couvre l'option et déborde du cadre : la zone tactile fait au moins 44 px. */
      .choix input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .choix label:has(input:checked) {
        border-color: var(--couleur-accent);
        background: var(--couleur-accent);
        box-shadow: var(--ombre-option);
        color: var(--couleur-accent-sur-fond);
        font-weight: 600;
      }
      .choix label:has(input:focus-visible) {
        box-shadow: var(--focus-anneau);
      }
      .choix label:has(input:disabled) {
        opacity: 0.65;
        cursor: not-allowed;
      }

      /* Correction : BulleCorrection. */
      .correction {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        padding: var(--espacement-20);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-carte);
        background: var(--couleur-surface);
      }
      .correction > strong {
        display: flex;
        align-items: center;
        gap: var(--espacement-8);
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.25rem;
        color: var(--couleur-texte-secondaire);
      }
      .correction > strong::before {
        flex: none;
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: currentcolor;
        content: '';
      }
      .correction[data-niveau='solide'] > strong {
        color: var(--couleur-succes);
      }
      .correction[data-niveau='partiel'] > strong {
        color: var(--couleur-alerte);
      }
      .correction[data-niveau='fragile'] > strong {
        color: var(--couleur-erreur);
      }
      .correction p {
        margin: 0;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      /* Sous la question : la correction, puis l'accord sur le niveau quand elle est tirée au sort. */
      .sortie {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
      }
      .sortie:empty {
        display: none;
      }
      .accord {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8) var(--espacement-12);
      }
      /* BadgeNeComptePas de l'appli : une réponse qui ne compte pas pour le statut, et pourquoi. */
      .badge-compte {
        display: inline-flex;
        align-items: center;
        align-self: flex-start;
        min-height: 1.75rem;
        padding: 0 var(--espacement-12);
        border: 1px solid var(--couleur-ligne);
        border-radius: 999px;
        background: var(--couleur-surface-douce);
        color: var(--couleur-texte-secondaire);
        font-size: 0.75rem;
        font-weight: 500;
        line-height: 1rem;
        white-space: nowrap;
      }

      /* Détails repliables ; l'objectif d'examen replié (carte, pratique) en est un. */
      details {
        padding: 0 var(--espacement-16);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      details[open] {
        padding-block-end: var(--espacement-12);
      }
      details > :not(summary) {
        margin-block-start: var(--espacement-12);
      }
      details > summary + * {
        margin-block-start: var(--espacement-4);
      }
      summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--espacement-12);
        min-height: 48px;
        font-weight: 500;
        list-style: none;
        cursor: pointer;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::after {
        flex: none;
        width: 0.5rem;
        height: 0.5rem;
        border-inline-end: 2px solid var(--couleur-texte-secondaire);
        border-block-end: 2px solid var(--couleur-texte-secondaire);
        transform: rotate(45deg) translate(-2px, -2px);
        transition: transform var(--duree-transition) ease;
        content: '';
      }
      details[open] > summary::after {
        transform: rotate(-135deg) translate(-2px, -2px);
      }
      summary:focus-visible {
        outline: none;
        border-radius: var(--rayon-champ);
        box-shadow: var(--focus-anneau);
      }

      /* Écrans : une idée à la fois, avec une barre de progression comme BarreProgression. */
      .ecran-barre {
        display: flex;
        align-items: center;
        gap: var(--espacement-12);
        min-width: 0;
      }
      .ecran-titre {
        flex: 1 1 auto;
        min-width: 0;
        margin: 0;
        color: var(--couleur-accent);
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.25rem;
      }
      .ecran-compte {
        flex: none;
        color: var(--couleur-texte-secondaire);
        font-size: 0.875rem;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .ecouter {
        flex: none;
        min-height: var(--cible-tactile-min);
        padding: 0 var(--espacement-12);
        font-size: 0.875rem;
        white-space: nowrap;
      }
      /* Un seul écran : la barre ne porte que « Écouter », à droite. */
      .ecran-barre > .ecouter:only-child {
        margin-inline-start: auto;
      }
      .ecran-progres {
        height: 0.5rem;
        border-radius: 0.25rem;
        background: var(--couleur-ligne);
        overflow: hidden;
      }
      .ecran-progres > span {
        display: block;
        height: 100%;
        border-radius: 0.25rem;
        background: var(--couleur-accent);

        grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
        gap: var(--espacement-8);
      }
      .deux-calculs > figure {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-4);

      .deux-calculs figcaption {
        color: var(--couleur-texte-secondaire);
        font-size: 0.875rem;

      .deux-calculs pre {
        margin: 0;

      /* VRAI en vert, FAUX en gris : dans les tables, le calcul pas à pas, les traces. */
      .val.v {
        color: var(--couleur-vrai);
        font-weight: 600;
      }
      .val.f {
        color: var(--couleur-faux);

      /* Le schéma du bloc : quatre boîtes ; celles que l'étape n'éclaire pas encore restent pâles. */
      .schema-bloc {

        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8);
      }
      .schema-bloc .boite-fixe.eteinte {

        width: 6rem;

      /* Le guichet : les clients, puis le prix affiché. */
      .clients {

        font-size: 1.25rem;
        font-weight: 700;
        text-align: center;

        display: none;
      }
      .guichet-sortie .message-outil {
        flex: 1 1 14rem;

      /* Les interrupteurs : un circuit, une lampe qui s'allume. */
      .circuit {
        width: 100%;
        max-width: 26rem;
        height: auto;
      }
      .circuit .fil,
      .circuit .levier,
      .circuit .plaque,
      .circuit .croix {
        stroke: var(--couleur-encre);
        stroke-width: 2.5;
        stroke-linecap: round;

      .circuit .plaque {
        stroke-width: 4;
      }
      .circuit .levier {
        stroke: var(--couleur-accent);
        stroke-width: 3.5;
      }
      .circuit .croix {
        stroke-width: 1.5;
      }
      .circuit .contact {
        fill: var(--couleur-encre);
      }
      .circuit .ampoule {
        fill: var(--couleur-fond);
        stroke: var(--couleur-encre);
        stroke-width: 2.5;
        transition: fill var(--duree-transition) ease;
      }
      .circuit.allume .ampoule {
        fill: var(--couleur-lampe);
      }
      .circuit.allume .fil {
        stroke: var(--couleur-lampe);
      }
      .circuit .etiquette {
        fill: var(--couleur-encre);
        font-family: var(--police-code);
        font-size: 16px;
        font-weight: 700;
        text-anchor: middle;
      }

      /* Le calcul pas à pas : la condition en jetons, l'opération touchée, puis l'historique. */
      .expr {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-4) var(--espacement-8);
        padding: var(--espacement-12);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface);

      .jeton {

        min-height: var(--cible-tactile-min);
        padding: 0 var(--espacement-8);
        border: 1px solid var(--couleur-controle);
        border-radius: var(--rayon-option);
        background: var(--couleur-fond);
        color: var(--couleur-accent);
        font-family: var(--police-code);

      }
      .jeton:hover:not(:disabled) {

      .jeton:focus-visible {

      .jeton:disabled {

      .choix-valeur {
        display: flex;
        flex-wrap: wrap;

      .question-valeur {
        font-family: var(--police-code);

      }
      .historique {

        gap: var(--espacement-8);
        padding-inline-start: var(--espacement-24);
      }
      .historique:empty {

      }
      section .historique > li + li {

      }
      .historique > li {
        display: flex;
        flex-direction: column;

      }
      .historique code {

      }
      .historique .pourquoi {

        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .historique > li.deja .pourquoi {
        font-style: italic;
      }

      /* Tracer : un cadre par cas, une liste par ligne de la chaîne. */
      .traces {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
        gap: var(--espacement-12);
      }
      fieldset.cas-trace {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-8);
        min-width: 0;
        padding: var(--espacement-12);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);

      fieldset.cas-trace legend {
        float: none;

        padding: 0 var(--espacement-4);
        color: var(--couleur-encre);

      }
      .ligne-trace {

      .ligne-trace label {

        font-size: 0.8125rem;
        line-height: 1.125rem;

      .ligne-trace.sortie label {
        font-family: var(--police-texte);
        font-weight: 600;
      }
      .ligne-trace select.fausse {
        border-color: var(--couleur-erreur);
        background-color: var(--couleur-erreur-douce);
      }

      /* Remettre dans l'ordre : chaque ligne avec ses flèches ; SINON reste en bas. */
      .lignes-ordre {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-8);
        padding: 0;
        list-style: none;
      }
      section .lignes-ordre > li + li {
        margin-top: 0;
      }
      .lignes-ordre > li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--espacement-8);
        padding: var(--espacement-8) var(--espacement-12);
        border: 1px solid var(--couleur-controle);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);

      .lignes-ordre > li.fixe {

      }
      .lignes-ordre .contenu {
        flex: 1 1 12rem;
        min-width: 0;
        font-family: var(--police-code);
        font-size: 0.9375rem;
      }
      .lignes-ordre .mot {
        color: var(--couleur-accent);
      }
      .fleches {
        display: flex;
        gap: var(--espacement-4);
      }

      /* Les valeurs limites : un bouton par valeur candidate. */
      .candidats {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-8);
      }
      .candidats .bouton {
        min-width: 3.5rem;
        font-family: var(--police-code);
      }

      /* Le JavaScript : le code, puis ce qu'il affiche pour chaque valeur. */
      textarea.code {
        font-family: var(--police-code);
        font-size: 0.9375rem;
        font-variant-ligatures: none;
        line-height: 1.5rem;
        tab-size: 2;
        white-space: pre;
        overflow-x: auto;
      }
      .resultats-js:empty {
        display: none;
      }
      .table-resultats tr.ok td:last-child {
        color: var(--couleur-vrai);
        font-weight: 600;
      }
      .table-resultats tr.ko td:last-child {
        color: var(--couleur-erreur);
        font-weight: 600;
      }

      /* L'organigramme de la chaîne. */
      .organigramme {
        display: block;
        width: 100%;
        max-width: 30rem;
        height: auto;
      }
      .organigramme .forme {
        fill: var(--couleur-fond);

      /* Vitesse : la ligne à juger, en grand. */
      section .q.grande {
        font-size: 1.5rem;
        line-height: 2rem;
      }
      .question-vitesse {
        display: flex;

        min-width: 7rem;
      }
      .fautes-vitesse {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-4);
        padding-inline-start: var(--espacement-20);
        font-size: 0.875rem;
      }
      section .fautes-vitesse > li + li {
        margin-top: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        pre.pseudo .l,
        .circuit .ampoule {
          transition: none;
        }
      }
    </style>

  <body>
    <header class="barre">
      <h1 id="titre"></h1>
      <p>
        <span id="mode" class="mode" role="status">Connexion à l’appli…</span>
        <span id="statut" class="discret"></span>
      </p>
    </header>
    <nav class="fil" id="fil" aria-label="Étapes de la fiche" data-ouvert="false">
      <button
        type="button"

    <main>

    </main>

    <!-- ET2, perception : le guichet du cinéma décide pour cinq clients, puis le pari, sans note. -->
    <template data-etape="ET2">
      <p class="accroche">
        Un cinéma calcule le prix de chaque place avec ces quatre lignes. Le guichet les lit de haut
        en bas.
      </p>
      <pre
        class="pseudo"
        data-pseudo="guichet"
      ><code><span class="l" data-l="1"><b>SI</b> âge &lt; 12 :</span>
<span class="l br" data-l="1">  afficher « 5 € »</span>
<span class="l" data-l="2"><b>SINON SI</b> étudiant <b>OU</b> âge &lt; 26 :</span>
<span class="l br" data-l="2">  afficher « 7 € »</span>
<span class="l" data-l="3"><b>SINON SI</b> âge ≥ 65 :</span>
<span class="l br" data-l="3">  afficher « 8 € »</span>
<span class="l" data-l="4"><b>SINON</b> :</span>
<span class="l br" data-l="4">  afficher « 10 € »</span></code></pre>
      <p class="discret">
        En mots : moins de 12 ans, 5 € ; sinon, étudiant ou moins de 26 ans, 7 € ; sinon, 65 ans ou
        plus, 8 € ; sinon, 10 €. Le signe &lt; veut dire « plus petit que », ≥ veut dire « plus
        grand ou égal à ».
      </p>
      <p>Fais passer les clients au guichet, un par un, et regarde ce qui s’allume.</p>
      <div class="outil" data-widget="guichet"></div>
      <div
        data-widget="pari"
        class="ex"
        hidden
        data-apres="Garde ta réponse en tête. Tu vas apprendre les règles qui permettent de le dire à coup sûr."
      >
        <p class="q">
          Paul a 70 ans, et il est étudiant : il suit des cours à l’université. À ton avis, que va
          afficher le guichet ?
        </p>
        <ul class="options">
          <li data-option="sept">7 €</li>
          <li data-option="huit">8 €</li>
          <li data-option="deux">7 €, puis 8 €</li>
        </ul>
      </div>
    </template>
    <!-- ET1, carte : ce que le bloc apprend, où il se place, à quoi il sert. -->
    <template data-etape="ET1">
      <p class="accroche">
        Une page web décide sans arrêt. Elle affiche « Mot de passe trop court » si tu as tapé moins
        de 8 caractères. Elle ne montre le bouton Payer que si ton panier n’est pas vide. Elle te
        fait un prix si tu as moins de 26 ans. Chaque fois, le programme pose une question à
        laquelle on répond oui ou non, puis choisit quoi faire.
      </p>
      <h3>Où tu es</h3>
      <p>Ce bloc est le deuxième de la partie La machine, qui tient en quatre idées reliées :</p>
      <ul class="carte-partie">
        <li>
          <strong>L’information en bits</strong> : tout ce que la machine range et traite est une
          suite de 0 et de 1.
        </li>
        <li class="ici">
          <strong>Décider : ET, OU, NON, SI/SINON</strong> : la machine décide avec de la logique
          sur ces 0 et ces 1. Tu es ici.
        </li>
        <li>
          <strong>L’ordinateur et ses composants</strong> : des composants rangent, transportent et
          calculent ces 0 et ces 1.
        </li>
        <li>
          <strong>Du langage machine aux langages de haut niveau</strong> : un programme, écrit dans
          un langage, devient des instructions que ces composants exécutent.
        </li>
      </ul>
      <p>
        Ce bloc repose sur le précédent : un oui ou un non, c’est un bit, 1 ou 0. Les deux suivants
        s’en servent : les composants font ces calculs avec des circuits, et dans un programme,
        c’est le code qui décide.
      </p>
      <h3>À quoi ça sert</h3>
      <p>
        Comme développeur web, tu écriras des décisions tous les jours : vérifier un formulaire,
        afficher un message d’erreur, adapter une page à la personne connectée. Ce bloc t’apprend à
        les écrire justes, et à les tester avant qu’un client ne tombe sur le cas oublié.
      </p>
      <h3>À la fin, tu sauras</h3>
      <ul>
        <li>dire de mémoire, et vite, ce que donnent ET, OU et NON dans chaque cas ;</li>
        <li>
          écrire une règle en français comme un calcul de oui et de non, en sachant si son « ou »
          accepte les deux à la fois ;
        </li>
        <li>
          calculer une décision qui mélange des comparaisons, ET, OU, NON et des parenthèses, une
          étape après l’autre, en disant pourquoi à chaque étape ;
        </li>
        <li>
          écrire une suite de SI qui choisit entre quatre cas, dans le bon ordre, et la tester sur
          les valeurs où elle change d’avis ;
        </li>
        <li>
          l’écrire en JavaScript, le langage des pages web, et la faire tourner dans ton navigateur,
          en ayant prédit ce qu’elle va afficher.
        </li>
      </ul>
      <p class="discret">
        Il te suffit d’avoir fait le bloc L’information en bits, et de savoir comparer deux nombres.
        Pour l’étape Dans la console, il te faut un ordinateur avec un navigateur.
      </p>
    </template>

    <!-- ET3, tentative : quatre décisions à l'intuition, avant toute règle. -->
    <template data-etape="ET3">
      <div data-ecran="Une porte">
        <p class="accroche">

        <div

          </p>
          <ul class="options">

              Oui.

      </div>
      <div data-ecran="Une borne de musée">
        <div
          class="ex"
          data-essai
          data-widget="choix"
          data-id="p4"
          data-reponse="doute"
          data-melanger="non"
          data-succes="C’est tout le problème : sans ordre de calcul, cette règle a deux lectures. La logique tranche par une convention, que tu vas voir. Avec elle, Léo entre gratuitement."
        >
          <p class="q">
            La borne d’un musée suit cette règle : gratuit si moins de 18 ans ET habite la ville OU
            enseignant. Léo a 30 ans, il est enseignant, et il habite une autre ville. La borne le
            laisse-t-elle entrer gratuitement ?
          </p>
          <ul class="options">
            <li
              data-option="oui"
              data-retour="C’est la lecture (moins de 18 ans ET habite la ville) OU enseignant, celle que choisit la règle de calcul que tu vas voir. Mais la phrase seule peut aussi se lire moins de 18 ans ET (habite la ville OU enseignant), et Léo paierait. Sans règle sur l’ordre, rien ne permet de trancher."
            >
              Oui.
            </li>
            <li
              data-option="non"
              data-retour="C’est la lecture moins de 18 ans ET (habite la ville OU enseignant). Mais la phrase seule peut aussi se lire (moins de 18 ans ET habite la ville) OU enseignant, et Léo entrerait. Sans règle sur l’ordre, rien ne permet de trancher."
            >
              Non : il paie.
            </li>
            <li data-option="doute">On ne peut pas trancher avec cette phrase.</li>
          </ul>
        </div>
      </div>
      <div data-ecran="Un thermostat">
        <div
          class="ex"
          data-essai
          data-widget="choix"
          data-id="p5"
          data-reponse="tiede"
          data-melanger="non"
          data-explication="Le thermostat affiche « tiède » : 30 ≥ 15 est déjà vrai à la première ligne, et il s’arrête là. La ligne « chaud » n’est jamais atteinte. L’étape 8 dit pourquoi, et comment le corriger."
        >

          ><span class="boite-fixe"

          ><span class="fleche">comparées, donnent →</span

        <p class="accroche">
          Pour décider, un programme pose des questions auxquelles on ne répond que oui ou non : le
          panier est-il vide ? L’âge est-il au moins 18 ? Chaque réponse est VRAI ou FAUX, jamais
          « un peu », jamais « peut-être ».

        <p>
          Une affirmation qui vaut VRAI ou FAUX s’appelle une <strong>condition</strong>. Sa valeur,
          VRAI ou FAUX, est une <strong>valeur booléenne</strong>, ou un <strong>booléen</strong>,
          du nom du mathématicien George Boole, qui en a fait l’algèbre au XIXᵉ siècle.
        </p>
        <p>
          Deux valeurs possibles : c’est exactement un bit. La machine range VRAI comme 1 et FAUX
          comme 0. C’est une convention, la même presque partout. En JavaScript, le langage des

        <p>

          arrives sur le site, FAUX après un ajout. Le programme recalcule sa valeur chaque fois
          qu’il la teste, avec les données du moment.

        >
          <thead>

              <th>Se lit</th>
              <th>Avec âge = 18</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="mono">&lt;</td>
              <td>strictement plus petit que</td>
              <td class="mono">18 &lt; 18 : FAUX</td>
            </tr>
            <tr>
              <td class="mono">≤</td>
              <td>plus petit ou égal à</td>
              <td class="mono">18 ≤ 18 : VRAI</td>
            </tr>
            <tr>
              <td class="mono">&gt;</td>
              <td>strictement plus grand que</td>
              <td class="mono">18 &gt; 18 : FAUX</td>
            </tr>
            <tr>
              <td class="mono">≥</td>
              <td>plus grand ou égal à</td>

            </tr>
            <tr>
              <td class="mono">=</td>
              <td>égal à</td>
              <td class="mono">18 = 18 : VRAI</td>
            </tr>
            <tr>
              <td class="mono">≠</td>
              <td>différent de</td>

          </p>
          <ul class="options">
            <li
              data-option="oui"
              data-retour="ET demande que les deux soient VRAI. Ici, stock suffisant vaut FAUX : VRAI ET FAUX donne FAUX."
            >
              Oui : une des deux conditions suffit.
            </li>
            <li data-option="non">Non : VRAI ET FAUX donne FAUX.</li>

    <!-- ET6, explication : l'ordre de calcul (priorité, parenthèses), démonstration, à compléter, seul. -->
    <template data-etape="ET6">
      <div data-ecran="ET avant OU">
        <div
          class="schema-bloc"
          data-lecture="Le même schéma du bloc : la marche éclairée est celle de la condition, où ET passe avant OU."
        >
          <span class="boite-fixe">Les données<small>âge = 23, étudiant = FAUX</small></span
          ><span class="fleche">comparées, donnent →</span
          ><span class="boite-fixe"
            >Des faits, VRAI ou FAUX<small>étudiant : FAUX ; 23 &lt; 26 : VRAI</small></span
          ><span class="fleche">combinés par NON, ET, OU, dans l’ordre →</span
          ><span class="boite-fixe"
            >Une condition, une seule valeur<small>étudiant OU âge &lt; 26 : VRAI</small></span
          ><span class="fleche">la première VRAIE choisit →</span
          ><span class="boite-fixe eteinte">Une seule branche<small>afficher « 7 € »</small></span>
        </div>
        <p class="accroche">
          À l’étape 3, la borne du musée lisait « moins de 18 ans ET habite la ville OU
          enseignant ». Deux lectures étaient possibles. Une machine ne peut pas hésiter : une règle
          fixe l’ordre de calcul.
        </p>
        <p data-si-essai="p4:juste">
          Tu l’avais vu pour Léo : sans ordre de calcul, la phrase a deux lectures. Voici la
          convention qui tranche.
        </p>
        <p data-si-essai="p4:faux">
          Pour Léo, tu avais répondu <span data-essai-rappel="p4">autre chose</span>. Tu as choisi
          une lecture sans le savoir : l’autre donnait la réponse inverse. La convention ci-dessous
          tranche, et avec elle Léo entre gratuitement.
        </p>
        <p>
          Une condition se compose de faits, reliés par NON, ET, OU. La calculer, c’est faire une
          opération à la fois, chacune avec la table de son opérateur (étape 5). Reste à savoir
          laquelle faire d’abord.
        </p>
        <div class="cadre a-retenir">
          <p>Dans une condition, on calcule dans cet ordre :</p>
          <ol>
            <li>ce qui est entre parenthèses ;</li>
            <li>les comparaisons ;</li>
            <li>NON ;</li>
            <li>ET ;</li>
            <li>OU.</li>
          </ol>
        </div>
        <p>
          C’est une convention. ET avant OU est la même dans presque tous les langages ; la place de
          NON change d’un langage à l’autre. Elle ressemble à celle du calcul, où la multiplication
          passe avant l’addition : 2 + 3 × 4 = 2 + 12 = 14. Son nom officiel : la
          <strong>priorité des opérateurs</strong>. ET a priorité sur OU.
        </p>
        <p>
          Une image pour la retenir : avec 1 pour VRAI et 0 pour FAUX, ET se calcule comme une
          multiplication, 1 × 0 = 0, et OU comme une addition, 0 + 1 = 1. Sa limite : 1 OU 1 donne
          1, pas 2. Un booléen ne dépasse jamais 1.
        </p>
        <p>
          Pour Léo, 30 ans, enseignant, d’une autre ville : (FAUX ET FAUX) OU VRAI, soit FAUX OU
          VRAI, donc VRAI. Léo entre gratuitement.
        </p>
      </div>
      <div data-ecran="Les parenthèses">
        <p class="accroche">
          Des parenthèses changent l’ordre de calcul, et peuvent changer le résultat. Compare ces
          deux calculs, faits avec les mêmes valeurs :
        </p>
        <div class="deux-calculs">
          <figure
            data-lecture="Sans parenthèses, ET passe d’abord : FAUX ET VRAI OU VRAI, c’est FAUX ET VRAI entre parenthèses, OU VRAI, soit FAUX OU VRAI, soit VRAI."
          >
            <figcaption>Sans parenthèses : ET d’abord</figcaption>
            <pre class="pseudo"><code>FAUX <b>ET</b> VRAI <b>OU</b> VRAI
= (FAUX <b>ET</b> VRAI) <b>OU</b> VRAI
= FAUX <b>OU</b> VRAI
= VRAI</code></pre>
          </figure>
          <figure
            data-lecture="Avec parenthèses, elles passent d’abord : FAUX ET, entre parenthèses, VRAI OU VRAI, c’est FAUX ET VRAI, soit FAUX."
          >
            <figcaption>Avec parenthèses : elles d’abord</figcaption>
            <pre class="pseudo"><code>FAUX <b>ET</b> (VRAI <b>OU</b> VRAI)
= FAUX <b>ET</b> VRAI
= FAUX</code></pre>
          </figure>
        </div>
        <p>
          Quand tu écris une condition, mets des parenthèses dès que ET et OU se mélangent, même si
          l’ordre de calcul te convient : la règle se relit sans hésiter.
        </p>
        <p>
          NON porte sur ce qui le suit : un fait, une comparaison ou une parenthèse. Comme les
          comparaisons passent avant lui, NON âge ≥ 18 se lit NON (âge ≥ 18). Écris quand même ces
          parenthèses : en JavaScript, l’ordre n’est pas le même (étape 9).
        </p>
        <div class="ex" data-widget="choix" data-id="r1" data-reponse="vrai" data-melanger="non">
          <p class="q">Que vaut VRAI OU VRAI ET FAUX ?</p>
          <ul class="options">
            <li data-option="vrai">VRAI</li>
            <li
              data-option="faux"
              data-erreur="E2"
              data-retour="Tu as calculé OU d’abord : (VRAI OU VRAI) ET FAUX. Or ET passe avant OU. Calcule d’abord VRAI ET FAUX, puis le OU."
            >
              FAUX
            </li>
          </ul>
        </div>
      </div>
      <div data-ecran="Pas à pas">
        <p class="accroche">
          Une salle de concert laisse entrer avec cette condition. Calculons-la ensemble pour ce
          soir, une opération à la fois.
        </p>
        <p>
          Avant chaque étape, touche l’opérateur que tu calculerais maintenant. La page te dit si
          c’est le bon, puis fait le calcul et dit pourquoi.
        </p>
        <div
          class="ex"
          data-widget="pasapas"
          data-id="r2"
          data-demo
          data-expr="âge ≥ 18 ET NON banni OU invité"
          data-valeurs="âge=16, banni=FAUX, invité=VRAI"
          data-succes="Ce soir, la salle laisse entrer : la personne est invitée, et l’invitation suffit."
        >
          <p class="q">
            La condition : âge ≥ 18 ET NON banni OU invité. Ce soir : âge = 16, banni = FAUX, invité
            = VRAI. Ordre de calcul : parenthèses, comparaisons, NON, ET, OU.
          </p>
        </div>
      </div>
      <div data-ecran="À compléter">
        <p class="accroche">
          À toi, sur un autre cas. Les deux premières étapes sont faites : continue.
        </p>
        <div
          class="ex"
          data-widget="pasapas"
          data-id="r3"
          data-fait="2"
          data-expr="prix &lt; 20 OU membre ET NON soldé"
          data-valeurs="prix=15, membre=VRAI, soldé=VRAI"
          data-autre-expr="taille ≥ 120 OU accompagné ET âge ≥ 6"
          data-autre-valeurs="taille=130, accompagné=FAUX, âge=5"
        >
          <p class="q">
            Une boutique fait une réduction SI prix &lt; 20 OU membre ET NON soldé. Avec prix = 15,
            membre = VRAI et soldé = VRAI, la réduction s’applique-t-elle ? Ordre de calcul :
            parenthèses, comparaisons, NON, ET, OU.
          </p>
        </div>
      </div>
      <div data-ecran="Sans aide">
        <div
          class="ex"
          data-widget="pasapas"
          data-id="r4"
          data-expr="(heure &lt; 9 OU heure ≥ 17) ET NON férié"
          data-valeurs="heure=18, férié=FAUX"
          data-autre-expr="NON (stock = 0) ET (carte OU espèces)"
          data-autre-valeurs="stock=0, carte=VRAI, espèces=FAUX"
        >
          <p class="q">
            Un parking est payant SI (heure &lt; 9 OU heure ≥ 17) ET NON férié. Calcule-le pour
            heure = 18 et férié = FAUX. Ordre de calcul : parenthèses, comparaisons, NON, ET, OU.
          </p>
        </div>
      </div>
    </template>

    <!-- ET7, explication : traduire une règle écrite en français ; le ou inclusif et le ou exclusif. -->
    <template data-etape="ET7">
      <div data-ecran="La méthode">
        <p class="accroche">
          Un client ne t’écrit pas des conditions : il t’écrit des phrases. Les traduire, c’est la
          moitié du travail.
        </p>
        <p>
          Traduire, c’est retrouver dans la phrase les pièces du schéma : les faits, et les mots qui
          les combinent en une condition.
        </p>
        <ol>
          <li>
            Repère les faits : chaque morceau qui peut être VRAI ou FAUX. Donne-leur un nom court.
          </li>
          <li>
            Repère les mots qui les relient : « et », « ou », « ne… pas », « sauf », « ni… ni ».
          </li>
          <li>Pour chaque « ou », demande-toi : les deux à la fois, c’est permis ?</li>
          <li>Mets des parenthèses pour garder le sens de la phrase.</li>
          <li>Vérifie sur un cas dont tu connais la réponse.</li>
        </ol>
        <p>
          Exemple : « Le code promo marche pour les nouveaux clients ou pour une commande de plus de
          50 €, sauf sur les articles soldés. »
        </p>
        <div class="ex" data-widget="choix" data-id="t7" data-reponse="trois">
          <p class="q">Avant de lire la suite : quels sont les faits de cette phrase ?</p>
          <ul class="options">
            <li data-option="trois">nouveau, commande &gt; 50, soldé</li>
            <li
              data-option="deux"
              data-retour="« Sauf sur les articles soldés » donne aussi un morceau qui peut être VRAI ou FAUX : l’article est soldé, ou pas."
            >
              nouveau, commande &gt; 50
            </li>
            <li
              data-option="code"
              data-retour="Le code promo, c’est ce que la règle décide. Les faits sont ce qu’elle teste pour le décider."
            >
              code promo, nouveau, commande &gt; 50, soldé
            </li>
          </ul>
        </div>
        <pre class="pseudo"><code>faits     : nouveau, commande &gt; 50, soldé</code></pre>
        <div class="ex" data-widget="choix" data-id="t5" data-reponse="oui" data-melanger="non">
          <p class="q">
            Avant de lire la suite : un nouveau client qui commande pour 60 €, sans article soldé,
            a-t-il droit au code ?
          </p>
          <ul class="options">
            <li data-option="oui">Oui</li>
            <li
              data-option="non"
              data-retour="Rien dans la phrase n’interdit d’être à la fois nouveau client et au-dessus de 50 €. Ce « ou » accepte les deux."
            >
              Non
            </li>
          </ul>
        </div>
        <pre
          class="pseudo"
        ><code>« ou »    : un nouveau client à 60 € y a droit, les deux sont permis : <b>OU</b></code></pre>
        <div class="ex" data-widget="choix" data-id="t8" data-reponse="etnon">
          <p class="q">
            Avant de lire la suite : comment se traduit « sauf sur les articles soldés » ?
          </p>
          <ul class="options">
            <li data-option="etnon" class="mono">ET NON soldé</li>
            <li
              data-option="ounon"
              class="mono"
              data-retour="Avec OU, un article qui n’est pas soldé suffirait à donner le code, même à un ancien client qui commande pour 20 €. « Sauf » retire des cas à ce qui précède : ET NON."
            >
              OU NON soldé
            </li>
          </ul>
        </div>
        <pre class="pseudo"><code>« sauf »  : <b>ET NON</b></code></pre>
        <div class="ex" data-widget="choix" data-id="t6" data-reponse="oui" data-melanger="non">
          <p class="q">
            Avant de lire la condition : sans parenthèses, nouveau OU commande &gt; 50 ET NON soldé,
            un nouveau client aurait-il le code sur un article soldé ? Ordre de calcul :
            parenthèses, comparaisons, NON, ET, OU.
          </p>
          <ul class="options">
            <li data-option="oui">Oui</li>
            <li
              data-option="non"
              data-retour="Sans parenthèses, ET passe avant OU : nouveau OU (commande &gt; 50 ET NON soldé). Pour un nouveau client, nouveau vaut VRAI, et VRAI OU quoi que ce soit donne VRAI."
            >
              Non
            </li>
          </ul>
        </div>
        <pre
          class="pseudo"
        ><code>condition : (nouveau <b>OU</b> commande &gt; 50) <b>ET NON</b> soldé</code></pre>
        <p>
          Sans les parenthèses, ET passerait avant OU : nouveau OU (commande &gt; 50 ET NON soldé).
          Un nouveau client aurait alors le code sur un article soldé. Les parenthèses gardent le

        </p>
        <div class="ex" data-widget="choix" data-id="t9" data-reponse="faux" data-melanger="non">
          <p class="q">
            Avant de lire la vérification : avec nouveau = VRAI, commande = 30 et soldé = VRAI, que

          </p>
          <ul class="options">
            <li
              data-option="vrai"
              data-retour="Le client est nouveau, mais l’article est soldé : NON soldé vaut FAUX, et ET demande les deux."
            >
              VRAI
            </li>
            <li data-option="faux">FAUX</li>
          </ul>
        </div>
        <p>
          Vérifie avec nouveau = VRAI, commande = 30 et soldé = VRAI : avec les parenthèses, (VRAI
          OU FAUX) ET NON VRAI donne VRAI ET FAUX, donc FAUX, comme le veut la phrase.
        </p>
        <div class="ex" data-widget="choix" data-id="t1" data-reponse="ou">
          <p class="q">
            « Le parking est gratuit le dimanche ou les jours fériés. » Quelle condition ?
          </p>
          <ul class="options">
            <li data-option="ou" class="mono">dimanche OU férié</li>
            <li
              data-option="et"
              class="mono"

            >

            <li

              class="mono"

              data-retour="Avec « mais pas les deux », un dimanche férié serait payant. Rien dans la phrase ne l’interdit : c’est le OU inclusif, qui accepte les deux. L’écran suivant montre comment écrire un « ou » qui refuse les deux."
            >
              dimanche OU férié, mais pas les deux
            </li>
          </ul>
        </div>
      </div>
      <div data-ecran="Le ou exclusif">
        <p class="accroche">
          Au restaurant, « fromage ou dessert » interdit les deux. Ce « ou »-là s’appelle le OU
          <strong>exclusif</strong> : il est VRAI quand un seul des deux est VRAI.
        </p>
        <p data-si-essai="p3:faux">
          Pour le menu, tu avais répondu <span data-essai-rappel="p3">autre chose</span>. C’est
          juste pour le OU de la logique, celui de l’attraction, qui accepte les deux. Le menu en
          emploie un autre : le OU exclusif.
        </p>
        <div
          class="defile"
          data-lecture="La table du OU exclusif, à côté du OU : un seul des deux. FAUX et FAUX donnent FAUX ; FAUX et VRAI donnent VRAI ; VRAI et FAUX donnent VRAI ; VRAI et VRAI donnent VRAI pour le OU, mais FAUX pour un seul des deux."
        >
          <table class="verite">
            <thead>
              <tr>
                <th scope="col">A</th>
                <th scope="col">B</th>
                <th scope="col">A OU B</th>
                <th scope="col">Un seul des deux</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="val f">FAUX</td>
                <td class="val f">FAUX</td>
                <td class="val f">FAUX</td>
                <td class="val f">FAUX</td>
              </tr>
              <tr>
                <td class="val f">FAUX</td>
                <td class="val v">VRAI</td>
                <td class="val v">VRAI</td>
                <td class="val v">VRAI</td>
              </tr>
              <tr>
                <td class="val v">VRAI</td>
                <td class="val f">FAUX</td>
                <td class="val v">VRAI</td>
                <td class="val v">VRAI</td>
              </tr>
              <tr>
                <td class="val v">VRAI</td>
                <td class="val v">VRAI</td>
                <td class="val v">VRAI</td>
                <td class="val f">FAUX</td>
              </tr>
            </tbody>
          </table>
        </div>
        <p>
          Seule la dernière ligne change : VRAI OU VRAI donne VRAI, mais « un seul des deux » donne
          FAUX quand les deux sont VRAI.
        </p>
        <p>
          Il n’a pas besoin d’opérateur à lui : il s’écrit avec ceux que tu connais. « Au moins un
          des deux, mais pas les deux » :
        </p>
        <pre
          class="pseudo"
        ><code>(fromage <b>OU</b> dessert) <b>ET NON</b> (fromage <b>ET</b> dessert)</code></pre>
        <p>
          La phrase française ne dit pas toujours lequel des deux elle veut. La question à poser :
          les deux à la fois, c’est permis ? Si oui, c’est le OU inclusif. Si non, c’est la forme
          exclusive ci-dessus. Pour répondre :
        </p>
        <ul>
          <li>
            Un mot qui fait choisir, « au choix », « soit… soit… », « choisis », ou un usage connu
            de tous, comme « fromage ou dessert » au restaurant : un seul des deux, c’est exclusif.
          </li>
          <li>
            Une condition pour avoir droit à quelque chose, entrer, payer moins, être recontacté :
            remplir les deux ne gêne personne, c’est le OU inclusif. C’est le sens du OU quand rien
            ne dit le contraire.
          </li>
          <li>
            Une chose offerte, sans mot qui fait choisir : seul celui qui l’offre sait s’il donne
            les deux. Tu demandes à celui qui a écrit la règle.
          </li>
        </ul>
        <div class="ex" data-widget="choix" data-id="t2" data-reponse="inclusif">

            Un formulaire dit : « Pour qu’on te recontacte, indique ton téléphone ou ton e-mail. »
            Une cliente remplit les deux. Quelle condition doit accepter son formulaire ?

              data-option="exclusif"
              class="mono"
              data-erreur="E1"
              data-retour="Cette forme est le OU exclusif : elle refuserait la cliente qui donne les deux. Ici, les deux à la fois, c’est permis : c’est le OU inclusif, téléphone OU email."
            >
              (téléphone OU email) ET NON (téléphone ET email)
            </li>
            <li
              data-option="et"
              class="mono"
              data-retour="Avec ET, il faudrait les deux : un client sans téléphone serait refusé, alors que l’e-mail suffit."
            >
              téléphone ET email
            </li>
          </ul>
        </div>
      </div>
      <div data-ecran="Les pièges du français">
        <ul>
          <li>
            <strong>Un « et » qui veut dire OU.</strong> « Réduction pour les enfants et les
            seniors. » La phrase ajoute deux groupes de clients, et chacun a droit à la réduction :
            enfant OU senior. Avec ET, il faudrait être des deux groupes à la fois : ici, personne.
          </li>
          <li>
            <strong>« Ni… ni ».</strong> « Ni carte, ni espèces » devient NON carte ET NON espèces :
            les deux manquent.
          </li>
          <li>
            <strong>« Ne… pas », « sauf », « sans ».</strong> Ils donnent un NON, souvent précédé de
            ET : « sauf les soldes » devient ET NON soldé.
          </li>
          <li>
            <strong>Quand la phrase ne permet pas de trancher.</strong> « Offert : un café ou un
            thé. » Les deux, c’est permis ? La phrase ne le dit pas. Tu ne devines pas : tu demandes
            à celui qui a écrit la règle. Dans le métier, c’est une question qu’on pose au client
            avant d’écrire le code.
          </li>
        </ul>
        <div class="ex" data-widget="choix" data-id="t3" data-reponse="ou">
          <p class="q">
            « Livraison gratuite pour les membres et pour les commandes de plus de 50 €. » Quelle
            condition ?
          </p>
          <ul class="options">
            <li data-option="ou" class="mono">membre OU commande &gt; 50</li>
            <li
              data-option="et"
              class="mono"
              data-retour="Avec ET, un membre qui commande pour 20 € paierait la livraison, alors que la phrase la lui offre. Ici, « et » ajoute un deuxième groupe de clients : c’est un OU."
            >
              membre ET commande &gt; 50
            </li>
            <li
              data-option="exclusif"
              class="mono"
              data-erreur="E1"
              data-retour="Cette forme est le OU exclusif : un membre qui commande pour 80 € paierait la livraison. Rien dans la phrase n’interdit les deux : c’est le OU inclusif."
            >
              (membre OU commande &gt; 50) ET NON (membre ET commande &gt; 50)
            </li>
          </ul>
        </div>
        <div class="ex" data-widget="choix" data-id="t4" data-reponse="ni">
          <p class="q">
            « Accès refusé si tu n’as ni badge ni code. » Quelle condition déclenche le refus ?
          </p>
          <ul class="options">
            <li data-option="ni" class="mono">NON badge ET NON code</li>
            <li
              data-option="ou"
              class="mono"
              data-retour="Avec OU, il suffirait d’oublier le badge pour être refusé, même avec le code. « Ni… ni » demande que les deux manquent."
            >
              NON badge OU NON code
            </li>
            <li
              data-option="non-et"
              class="mono"
              data-retour="NON (badge ET code) est VRAI dès qu’il en manque un seul : tu serais refusé avec le code sans le badge. « Ni… ni » demande que les deux manquent."
            >
              NON (badge ET code)
            </li>
          </ul>
        </div>
      </div>
    </template>

        </table>

            <tr>
              <td>&lt; et &gt;</td>

        <p>
          Tu n’as pas à apprendre ces deux tables par cœur : elles te seront redonnées chaque fois
          qu’une question transcrit en JavaScript. Ce qu’il faut retenir, c’est le geste : chaque
          ligne du pseudo-code devient une ligne de JavaScript, la table sous les yeux.
        </p>
        <p>
          Ces signes sont des conventions de JavaScript. Ils viennent de langages plus anciens, et
          on les retrouve dans beaucoup d’autres, comme PHP.
        </p>
        <p>
          Une différence avec l’ordre de l’étape 6 : en JavaScript, ! passe avant les comparaisons.
          <code>!age &gt;= 18</code> calcule d’abord !age, puis compare ce résultat à 18 : la
          condition vaut false pour tous les âges, même 30. Pour nier une comparaison, garde les
          parenthèses : <code>!(age &gt;= 18)</code>.
        </p>
      </div>
      <div data-ecran="Variable et égalité">
        <p class="accroche">
          Une donnée se range dans une <strong>variable</strong>, une boîte qui a un nom :
          <code>let score = 40</code> crée la variable score et y range 40. L’image a sa limite :
          une boîte ne garde qu’une valeur à la fois, et ranger une autre valeur remplace
          l’ancienne. Le signe = range, il ne compare pas : c’est l’<strong>affectation</strong>.
        </p>
        <p>
          Un nom de variable ne contient pas d’espace, et l’usage est de l’écrire sans accent : age,
          etudiant. JavaScript distingue aussi les majuscules : Age et age sont deux noms
          différents. Ce sont des conventions du langage.
        </p>
      </div>
      <div data-ecran="Comparer : ===">
        <p class="accroche">
          Puisque = range, comparer demande un autre signe. JavaScript en prend trois,
          <code>===</code> : l’<strong>égalité stricte</strong>. <code>age === 18</code> vaut true
          si age contient 18, false sinon. Elle compare aussi des textes, écrits entre apostrophes :
          <code>nom === 'Paul'</code>. Tu croiseras aussi ==, une égalité moins stricte : on s’en
          passe ici.
        </p>
        <div class="ex" data-widget="choix" data-id="j1" data-reponse="egal">
          <p class="q">Dans un if, comment écrit-on « âge égal à 18 » ?</p>
          <ul class="options">
            <li data-option="egal" class="mono">age === 18</li>
            <li
              data-option="affecte"
              class="mono"
              data-erreur="E4"
              data-retour="age = 18 range 18 dans la variable age, c’est une affectation : il ne compare rien. Pour comparer, il faut ===."
            >
              age = 18
            </li>
            <li
              data-option="et"
              class="mono"
              data-erreur="E4"
              data-retour="&& est le ET : il combine deux conditions, il ne compare pas deux nombres."
            >
              age &amp;&amp; 18
            </li>
          </ul>
        </div>
        <p>
          Un piège : <code>if (age = 18)</code> ne donne pas d’erreur. JavaScript range 18 dans age,
          puis teste la valeur rangée, 18. Une condition vaut VRAI ou FAUX, mais JavaScript accepte
          aussi un nombre à sa place : il compte alors tout nombre autre que 0 comme VRAI. C’est une
          convention du langage, utile ici seulement pour comprendre ce piège. La branche s’exécute
          donc à chaque fois, quel que soit l’âge de départ.
        </p>
      </div>

    <template data-conception>
      <h3>Une question à la fois</h3>
      <ul>
        <li>
          Dans un écran, tout ce qui suit un exercice pas encore fini reste caché jusqu’à ce qu’il
          le soit : réussi, ou solution vue puis refaite ou expliquée (voir « Les coups de pouce »).
          Un groupe de petites questions sous une même consigne compte pour une seule question. Le
          texte placé après un exercice paraît donc une fois l’exercice fini.
        </li>
        <li>
          Un exercice du cours fini garde son état d’une visite à l’autre : la réponse, le message
          et le texte qui suit restent affichés.
        </li>
      </ul>
      <h3>Le guichet et le pari (étape 2)</h3>
      <ul>
        <li>
          Cinq clients : Léa, 9 ans ; Hugo, 20 ans, étudiant ; Inès, 23 ans ; Rose, 68 ans ; Marc,
          40 ans. Quand un client passe, les lignes du pseudo-code affiché au-dessus s’allument une
          à une, dans l’ordre, avec la condition écrite sur ses valeurs et son résultat (« 20 &lt;
          12 : FAUX ») ; la première ligne VRAIE allume sa branche, les lignes suivantes restent
          pâles. Le prix s’affiche, et une phrase dit tout le parcours : « Hugo, 20 ans, étudiant.
          Ligne 1 : 20 &lt; 12, FAUX. Ligne 2 : VRAI OU 20 &lt; 26, VRAI. Le guichet affiche 7 €.
          Les lignes suivantes ne sont pas testées. » Avec le mouvement réduit, tout s’allume d’un
          coup.
        </li>
        <li>
          La question du pari paraît une fois les cinq clients passés. Le pari n’est pas noté : la
          réponse choisie est gardée, et rappelée à l’étape 12 au-dessus de la même question, « Au
          début, tu avais répondu : … ».
        </li>
      </ul>
      <h3>Les interrupteurs (étape 5)</h3>
      <ul>
        <li>
          Deux boutons ouvrent et ferment les interrupteurs A et B ; le circuit se redessine, la
          lampe s’allume ou s’éteint, et une phrase dit l’état : « A fermé, VRAI ; B ouvert, FAUX :
          A ET B vaut FAUX, la lampe est éteinte. » En ET, les interrupteurs sont sur le même fil ;
          en OU, sur deux fils qui mènent à la même lampe.
        </li>
      </ul>
      <h3>Les retours</h3>
      <ul>
        <li>
          Une réponse incomplète (une ligne de table sans valeur, une liste de trace laissée sur
          « choisis », un code vide ou pas modifié, une valeur limite qu’on n’a pas touchée) reçoit
          un message de forme et ne compte pas comme une tentative.
        </li>
        <li>
          Un choix faux reçoit le retour écrit pour cette option. Au deuxième choix faux, la bonne
          réponse est marquée, « · la bonne réponse ».
        </li>
        <li>
          Table de vérité : le retour dit combien de lignes sont à revoir, sans dire lesquelles, et
          parle de la première : pour un OU sur la ligne VRAI, VRAI, « le OU de la logique accepte
          les deux à la fois » ; pour un OU, sinon, « OU n’est FAUX que si les deux sont FAUX » ;
          pour un ET, « ET n’est VRAI que si les deux sont VRAI » ; pour une condition composée,
          « calcule d’abord « NON B », puis la suite ». À l’étape 3, rien ne s’affiche avant la fin
          de l’étape : le gabarit montre alors, sous « Tes essais », le retour écrit dans la fiche
          (data-sinon) à la place de cette phrase.
        </li>
        <li>
          Calcul pas à pas : l’apprenant touche l’opération qu’il calculerait maintenant, puis
          choisit sa valeur, VRAI ou FAUX. Une opération qui ne peut pas encore se calculer reçoit
          un retour qui nomme ce qui passe avant : « Pas encore ce OU : ET passe avant OU. Calcule
          d’abord « âge ≥ 18 ET NON banni ». » (E2), « la comparaison « âge ≥ 18 » se calcule avant
          lui », « NON passe avant ET », « la parenthèse … passe avant lui », « NON s’applique à
          toute la parenthèse qui le suit ». Une valeur fausse reçoit la règle de l’opération, pas
          sa valeur : « 16 ≥ 18 se lit : 16 est plus grand ou égal à 18. Est-ce le cas ? », « ET
          n’est VRAI que si les deux côtés sont VRAI », et pour VRAI OU VRAI jugé FAUX : « Le OU de
          la logique accepte les deux à la fois : VRAI OU VRAI ne donne pas FAUX. » (E1). Chaque
          étape juste s’ajoute sous la condition, avec la condition récrite et sa raison : « = FAUX
          ET NON banni OU invité » puis « âge vaut 16 ; 16 ≥ 18 donne FAUX : 16 est plus petit que
          18. » L’ordre de l’encadré s’applique à la lettre : une opération déjà calculable attend
          celles qui passent avant elle (« Pas encore ce NON : les comparaisons passent avant
          NON »). Seules deux opérations de même rang, au même niveau de parenthèses (deux
          comparaisons), se font dans l’ordre qu’on veut. C’est assumé : calculer NON banni avant
          âge ≥ 18 donne le même résultat, mais l’exercice entraîne l’ordre de l’encadré, une
          opération à la fois.
        </li>
        <li>
          Dans la démonstration de l’étape 6, une opération mal choisie reçoit le même retour, sans
          compter comme une faute ; la bonne est calculée par la page, avec sa raison.
        </li>
        <li>
          Tracer une chaîne : à l’étape 8, l’exercice de Tom et Nina est à compléter (data-fait) :
          la ligne 1 de Tom est remplie, VRAI, et bloquée ; pour chaque autre ligne, l’apprenant
          choisit VRAI, FAUX ou « pas testée », puis ce que la chaîne affiche. Sa variante, après
          une solution vue, n’a rien de rempli. Les réponses fausses sont bordées de rouge, et le
          retour parle de la première, cas par cas, de haut en bas. Une ligne notée alors qu’elle
          suit la première VRAIE : « Pour Tom, la ligne 2 n’est pas testée : la ligne 1 est déjà
          VRAIE, et la chaîne s’arrête à la première VRAIE. » (E3). Une ligne notée « pas testée » à
          tort : « la ligne 2 est testée : aucune ligne au-dessus n’est VRAIE. » Une valeur fausse :
          « recalcule la ligne 2 : FAUX OU 26 &lt; 26. Regarde 26 &lt; 26 : les deux nombres sont
          égaux. » Une sortie fausse : « la chaîne affiche ce que dit la première ligne VRAIE, ou
          SINON quand aucune ne l’est. »
        </li>
        <li>
          Remettre des lignes dans l’ordre : SINON reste en bas, sans flèche ; les mots SI et SINON

        <li>

          le changement et la première après ; l’outil les calcule sur la chaîne. Une valeur en
          trop : « 301 n’est pas une valeur limite : 300, 301 et 302 donnent tous « bronze ». Rien
          ne change autour de 301. » Une valeur qui manque : « Il manque une valeur limite. Autour

        <li>

          branche et le else. Un code laissé tel quel reçoit un message de forme.
        </li>
        <li>
          JavaScript : avant d’exécuter, l’outil repère ≥, ≤ ou ≠ (« En JavaScript, ≥ s’écrit
          &gt;=… »), un mot de pseudo-code (« Le mot SI est du pseudo-code… »), une variable créée
          par l’apprenant (« Ne crée pas la variable t : la page lui donne elle-même chaque valeur à
          tester… ») et un = seul dans la condition d’un if : « Dans if (t = 25), le signe = range
          une valeur au lieu de comparer. Pour comparer, écris ===. » (E4). Puis il exécute le code
          pour chaque valeur à tester, en donnant lui-même la valeur de la variable, et montre un
          tableau : la valeur, ce qui est attendu, ce que le code affiche. Le retour donne le
          premier cas qui se trompe : rien d’affiché (« Il manque une branche : else prend tous les
