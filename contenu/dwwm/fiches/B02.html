          if (bloque.t === 'et' && n.t === 'ou')
            return (
              'Pas encore ce OU : ET passe avant OU. Calcule d’abord « ' + texte(bloque) + ' ».'
            )
          return 'Pas encore ce ' + nom + ' : « ' + texte(bloque) + ' » se calcule d’abord.'
        }
        /** Ce que dit la page quand la valeur choisie pour une opération est fausse : la règle, pas la réponse. */
        function erreurValeur(n, vals) {
          const x = calcul(n, vals)
          const faits = x.faits.length ? x.faits.join(', ') + '. ' : ''
          if (n.t === 'cmp')
            return (
              faits +
              x.sur +
              ' se lit : ' +
              avecValeurs(n.g, vals) +
              ' ' +
              LECTURE[n.op] +
              ' ' +
              avecValeurs(n.d, vals) +
              '. Est-ce le cas ?'
            )
          if (n.t === 'non') return faits + 'NON inverse la valeur qui le suit : ' + x.sur + '.'
          if (n.t === 'et')
            return (
              faits +
              (x.v
                ? 'Les deux côtés valent VRAI : ' + x.sur + '. ET n’est FAUX que s’il y a un FAUX.'
                : 'ET n’est VRAI que si les deux côtés sont VRAI. Regarde : ' + x.sur + '.')
            )
          if (valeurDe(n.g, vals) && valeurDe(n.d, vals))
            return (
              faits +
              'Le OU de la logique accepte les deux à la fois : ' +
              x.sur +
              ' ne donne pas FAUX.'
            )
          return (
            faits +
            (x.v
              ? 'OU est VRAI dès qu’un des deux côtés l’est. Regarde : ' + x.sur + '.'
              : 'OU n’est FAUX que si les deux côtés sont FAUX. Regarde : ' + x.sur + '.')
          )
        }
        /** Les comparaisons d'une condition dont les deux nombres sont égaux : c'est là que < et ≤ diffèrent. */
        function egalites(n, vals, out = []) {
          if (n.t === 'cmp') {
            if (valeurDe(n.g, vals) === valeurDe(n.d, vals)) out.push(avecValeurs(n, vals))
          } else operandes(n).forEach((o) => egalites(o, vals, out))
          return out
        }

        // --- Les chaînes SI / SINON SI / SINON : « cond => sortie | … | SINON => sortie ».
        function lireChaine(s) {
          const ch = { lignes: [], sinon: null }
          for (const morceau of String(s).split('|')) {
            const [cond, sortie] = morceau.split('=>').map((x) => x.trim())
            if (cond === 'SINON') ch.sinon = sortie
            else ch.lignes.push({ cond, ast: analyser(cond), sortie })
          }
          return ch
        }
        /** La branche choisie : la première ligne VRAIE, ou SINON (i = -1). Sans SINON, la sortie est « rien ». */
        function executerChaine(ch, vals) {
          for (let i = 0; i < ch.lignes.length; i++)
            if (evaluer(ch.lignes[i].ast, vals)) return { i, sortie: ch.lignes[i].sortie }
          return { i: -1, sortie: ch.sinon ?? 'rien' }
        }
        /** « score=950 => or | … » : des cas et la sortie attendue. */
        const lireCasAttendus = (s) =>
          String(s)
            .split('|')
            .map((morceau) => {
              const [v, a] = morceau.split('=>')
              return { vals: lireValeurs(v), attendu: (a ?? '').trim() }
            })
        /** Des cas tirés autour des seuils de la chaîne, avec des sorties toutes différentes. */
        function casAuHasard(ch, n, interdit) {
          const nums = {}
          const bools = new Set()
          ch.lignes.forEach((L) => {
            ;(function voir(x) {
              if (x.t === 'cmp') {
                for (const [a, b] of [
                  [x.g, x.d],
                  [x.d, x.g],
                ])
                  if (a.t === 'var' && b.t === 'num') (nums[a.nom] ??= new Set()).add(b.v)
              } else if (x.t === 'var') bools.add(x.nom)
              else operandes(x).forEach(voir)
            })(L.ast)
          })
          const tirer = () => {
            const vals = {}
            for (const [nom, seuils] of Object.entries(nums)) {
              const t = [...seuils]
              vals[nom] = t[auHasard(0, t.length - 1)] + auHasard(-1, 0)
            }
            for (const nom of bools) vals[nom] = Math.random() < 0.5
            return vals
          }
          const ecrire = (vals) =>
            Object.entries(vals)
              .map(([k, v]) => k + '=' + ecrireValeur(v))
              .join(', ')
          let dernier = ''
          for (let essai = 0; essai < 80; essai++) {
            const liste = Array.from({ length: n }, tirer)
            dernier = liste.map(ecrire).join(' | ')
            if (
              new Set(liste.map((v) => executerChaine(ch, v).sortie)).size === n &&
              dernier !== interdit
            )
              return dernier
          }
          return dernier
        }

        // --- Les exercices. Chaque type rend un contrôleur : `solution()`, `remplir(etat, v)` (la
        // réponse posée une fois l'exercice fini), `bloquer()`, parfois `crans` (l'échelle d'aide
        // calculée sur l'état de l'exercice) et `variante()` (un autre cas, pour refaire sans regarder).
        const dansItem = (ex) => Boolean(ex.closest('.item'))
        /** Dit au gabarit qu'une réponse d'un item de pratique a été vérifiée (fiche:verification). */
        function signaler(ex, juste, aide, plus = {}) {
          if (!dansItem(ex)) return
          ex.dispatchEvent(
            new CustomEvent('fiche:verification', {
              bubbles: true,
              detail: { juste, aide, ...plus },
            }),
          )
        }
        /**
         * Une erreur critique reconnue (E1 à E4) part au bilan : `fiche:erreur`, avec l'item ou
         * l'exercice où elle a eu lieu (sa variante du cours : « r4:variante »). La tentative de
         * l'étape 3 n'en signale pas : elle vient avant les règles. Rend faux si le gabarit attend
         * d'abord le bilan.
         */
        function signalerErreur(ex, erreur) {
          if (!erreur || 'essai' in ex.dataset) return true
          const ou =
            ex.closest('.item')?.dataset.item ??
            (ex.dataset.origine
              ? ex.dataset.origine + ':variante'
              : ex.closest('[data-id]')?.dataset.id)
          if (!ou) return true
          return ex.dispatchEvent(
            new CustomEvent('fiche:erreur', {
              bubbles: true,
              cancelable: true,
              detail: { erreur, ou },
            }),
          )
        }
        function retourDe(ex) {
          let r = $(':scope > .retour', ex)
          if (!r) {
            r = el('p', { class: 'retour', 'aria-live': 'polite' })
            ex.append(r)
          }
          return r
        }
        function dire(ex, classe, texteDit) {
          const r = retourDe(ex)
          r.className = 'retour' + (classe ? ' ' + classe : '')
          r.textContent = fr(texteDit)
          return r
        }
        const fini = (ex) => ex.dataset.fini === 'oui'

        /**
         * Après une solution montrée, l'apprenant refait sans regarder puis explique (règle F03) : il
         * écrit son explication, puis la compare avec la solution de la fiche.
         */
        /** La clé de l'explication d'un exercice, pour la trace du gabarit (`explique:<cle>`). */
        function cleExplication(ex) {
          const item = ex.closest('.item')
          // Une variante du cours n'a pas d'identifiant : elle prend celui de l'exercice qu'elle refait.
          const base = item
            ? item.dataset.item
            : 'ex:' + (ex.dataset.id ?? ex.dataset.origine ?? 'x')
          return (
            base +
            (ex.dataset.variante || (item && montre[item.dataset.item] === 'variante')
              ? ':variante'
              : '')
          )
        }
        function expliquer(ex, solution, consigne, apres) {
          if ($(':scope > .expliquer', ex)) return
          const cle = cleExplication(ex)
          if (apres) {
            const fin = (e) => {
              if (e.detail?.cle !== 'explique:' + cle) return
              ex.removeEventListener('fiche:trace', fin)
              apres()
            }
            ex.addEventListener('fiche:trace', fin)
          }
          ex.dispatchEvent(
            new CustomEvent('fiche:expliquer', {
              bubbles: true,
              detail: {
                cle,
                solution: fr(ex.dataset.fiche ?? sansPoint(solution) + '.'),
                consigne: consigne ? fr(consigne) : undefined,
              },
            }),
          )
        }

        /** Un exercice fini : la réponse posée, les champs bloqués, le message, puis la suite de l'écran. */
        function appliquer(ex, c, etat, v, message) {
          ex.dataset.fini = 'oui'
          c.echelle?.maj()
          ex.classList.toggle('ok', etat !== 'vu')
          ex.classList.toggle('vu', etat === 'vu')
          c.remplir(etat, v)
          c.bloquer()
          const texteFin =
            message ??
            (etat === 'vu'
              ? c.marque
                ? 'La bonne réponse est marquée.'
                : 'Réponse : ' + sansPoint(c.solution()) + '.'
              : 'Juste.')
          dire(ex, etat === 'vu' ? '' : 'bon', texteFin)
          const explication = ex.dataset.explication
          if (explication && !$(':scope > .explication', ex))
            ex.append(el('p', { class: 'explication', text: explication }))
          devoiler(ex.closest('.ecran, [data-ecran]'))
          const parent = ex.parentElement?.closest('.ex')
          if (parent) libererApresVariante(parent, ex, c, etat)
        }

        /**
         * La variante du cours finie : réussie, elle libère la suite de l'écran, et la trace de
         * l'exercice le dit pour la visite suivante. Si c'est sa solution qui a été vue, rien n'a été
         * réussi sans regarder (règle F04) : l'apprenant explique d'abord cette solution, comme après
         * une solution vue sans autre cas, puis la suite paraît.
         */
        function libererApresVariante(parent, ex, c, etat) {
          if (parent.dataset.reprise !== 'oui') return
          if (etat === 'vu')
            return expliquer(
              ex,
              c.solution(),
              fr('Pour continuer, explique cette solution avec tes mots, en une ou deux phrases :'),
              () => libererReprise(parent),
            )
          if (parent.dataset.id)
            tracer('ex:' + parent.dataset.id, { e: 'vu', v: null, refait: true })
          libererReprise(parent)
        }

        /**
         * Dans le cours, après une solution vue (règles F03 et F04) : la suite de l'écran attend que
         * l'apprenant refasse sur un autre cas, ou, quand il n'y en a pas, qu'il explique la solution
         * avec ses mots. Pas pendant la tentative de l'étape 3, ni dans une variante.
         */
        const avecReprise = (ex) =>
          !dansItem(ex) && !ex.dataset.variante && !('essai' in ex.dataset)
        function apresSolution(ex, c) {
          if (c.variante) return proposerVariante(ex, c)
          expliquer(
            ex,
            c.solution(),
            fr('Pour continuer, explique cette solution avec tes mots, en une ou deux phrases :'),
            () => libererReprise(ex),
          )
        }
        function libererReprise(ex) {
          if (ex.dataset.reprise !== 'oui') return
          delete ex.dataset.reprise
          devoiler(ex.closest('.ecran, [data-ecran]'))
        }

        /**
         * Ce que fait une réponse. Dans le cours, l'exercice fini garde sa trace (fiche:trace). Dans un
         * item de pratique, chaque réponse vérifiée part au gabarit, avec l'aide reçue : une réussite
         * qui suit une réponse fausse compte avec l'aide 1 au moins, le retour de l'erreur a orienté
         * (règle P03).
         */
        /**
         * Une réponse à la tentative de l'étape 3 (règles C03 et M01) : elle part au gabarit, qui la garde
         * sans verdict et corrige toute la série à la fin. L'outil ne dit rien ; l'exercice est fini, la
         * suite de l'écran paraît. « Je ne sais pas » (fiche:essai-passe) est une réponse vide.
         */
        function essayer(ex, c, res) {
          ex.dataset.fini = 'oui'
          c.bloquer?.()
          const reponse = res.r ?? res.v
          ex.dispatchEvent(
            new CustomEvent('fiche:essai', {
              bubbles: true,
              detail: {
                cle: ex.dataset.id,
                reponse: reponse === undefined || reponse === null ? null : String(reponse),
                juste: Boolean(res.ok),
                attendu: typeof c.solution === 'function' ? sansPoint(c.solution()) : '',
                // Après coup, un indice pour réessayer n'a plus d'objet : ce qui cause l'erreur, ou pourquoi.
                retour: res.ok
                  ? (ex.dataset.explication ?? '')
                  : res.d?.m || ex.dataset.explication || '',
              },
            }),
          )
          devoiler(ex.closest('.ecran, [data-ecran]'))
        }

        function repondre(ex, c, res) {
          if (fini(ex)) return
          if ('essai' in ex.dataset) return essayer(ex, c, res)
          const fautes = Number(ex.dataset.fautes || 0)
          const cran = c.echelle ? c.echelle.cran() : 0
          if (res.ok) {
            const aide = Math.min(4, fautes > 0 ? Math.max(cran, 1) : cran)
            signaler(ex, true, aide)
            const etat = fautes === 0 && cran === 0 ? 'ok1' : 'ok'
            if (!dansItem(ex) && ex.dataset.id && !ex.dataset.variante)
              tracer('ex:' + ex.dataset.id, { e: etat, v: res.v ?? null })
            appliquer(
              ex,
              c,
              etat,
              res.v,
              (res.m || 'Juste.') + (ex.dataset.succes ? ' ' + ex.dataset.succes : ''),
            )
            if (ex.closest('[data-solution-vue]') || ex.dataset.variante || cran === 3)
              expliquer(ex, c.solution())
            else if (ex.dataset.justifier) expliquer(ex, c.solution(), fr(ex.dataset.justifier))
            return
          }
          ex.dataset.fautes = String(fautes + 1)
          signaler(ex, false, cran)
          const libre = signalerErreur(ex, res.d?.e)
          const m =
            (res.d && res.d.m ? res.d.m : (ex.dataset.sinon ?? 'Pas encore. Réessaie.')) +
            (libre ? '' : ' C’est une erreur critique : envoie ton bilan avant de continuer.')
          // Une valeur VRAI ou FAUX écartée laisse la bonne, donnée : c'est une solution vue, comme
          // l'option qui reste d'un choix (règle F04).
          if (res.vu) return montrerSolution(ex, c, m)
          if (c.marque) {
            dire(ex, 'faux', m)
            // Tant que plusieurs options restent, l'échelle aide (règle F03). L'option qui reste ne se
            // choisit pas : c'est une solution vue, qui se refait ou s'explique (règle F04).
            if (c.restantes() > 1) return c.echelle?.tentative()
            return montrerSolution(ex, c, m)
          }
          dire(ex, 'faux', m)
          c.echelle?.tentative()
        }

        /** La solution montrée, en bout d'échelle. */
        function montrerSolution(ex, c, avant) {
          const solution = sansPoint(c.solution()) + '.'
          if (dansItem(ex)) {
            // Le gabarit note « solution vue » tout de suite ; l'item se redessine sur « je refais ».
            signaler(ex, false, 4, { garder: true })
            ex.dataset.fini = 'oui'
            c.remplir('vu')
            c.bloquer()
            dire(ex, '', (avant ? avant + ' ' : '') + 'Solution : ' + solution)
            const refaire = el('button', {
              type: 'button',
              class: 'bouton',
              text: 'J’ai compris, je refais sans regarder',
            })
            ex.append(el('div', { class: 'actions' }, refaire))
            refaire.addEventListener('click', () => {
              // L'item se redessine pendant l'événement : on choisit d'abord le cas à refaire.
              const id = ex.closest('.item').dataset.item
              prochain[id] = montre[id] === 'variante' ? 'origine' : 'variante'
              ex.dispatchEvent(new CustomEvent('fiche:refaire', { bubbles: true }))
            })
            return
          }
          if (ex.dataset.id && !ex.dataset.variante)
            tracer('ex:' + ex.dataset.id, { e: 'vu', v: null })
          const reprise = avecReprise(ex)
          if (reprise) ex.dataset.reprise = 'oui'
          const suite =
            reprise && c.variante
              ? ' Pour continuer, refais-le sur un autre cas, sans regarder.'
              : ''
          appliquer(
            ex,
            c,
            'vu',
            null,
            (avant ? avant + ' ' : '') + 'Solution : ' + solution + suite,
          )
          if (reprise) apresSolution(ex, c)
          else proposerVariante(ex, c)
        }

        /** Dans le cours, après une solution : refaire sans regarder, sur un autre cas. */
        function proposerVariante(ex, c) {
          if (!c.variante || $(':scope > .refaire', ex)) return
          const bouton = el('button', {
            type: 'button',
            class: 'bouton secondaire petit',
            text: 'Je refais sans regarder, sur un autre cas',
          })
          const zone = el('div', { class: 'refaire' }, bouton)
          bouton.addEventListener('click', () => {
            const nouveau = c.variante()
            if (!nouveau) return
            // Sans regarder : l'exercice et sa solution se cachent, seul l'autre cas reste à l'écran.
            for (const n of Array.from(ex.children)) if (n !== zone) n.hidden = true
            nouveau.dataset.variante = 'oui'
            if (ex.dataset.id) nouveau.dataset.origine = ex.dataset.id
            zone.replaceChildren(nouveau)
            monterEx(nouveau)
          })
          ex.append(zone)
        }

        function ligneSaisie(ex) {
          const input = el('input', {
            type: 'text',
            inputmode: 'numeric',
            autocomplete: 'off',
            spellcheck: 'false',
            'aria-label': 'Ta réponse',
            id: uid('champ-' + (ex.dataset.id || 'x')),
          })
          const bouton = el('button', { type: 'button', class: 'bouton', text: 'Vérifier' })
          const ligne = el('div', { class: 'saisie' }, input, bouton)
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') bouton.click()
          })
          return { ligne, input, bouton }
        }
        /** Un nouvel exercice du même type, pour la variante du cours. */
        function nouvelEx(widget, donnees, question) {
          const ex = el('div', { class: 'ex', 'data-widget': widget })
          for (const [cle, val] of Object.entries(donnees)) ex.dataset[cle] = String(val)
          ex.append(el('p', { class: 'q', text: question }))
          return ex
        }
        const boutonVerifier = (texteBouton = 'Vérifier') =>
          el('button', { type: 'button', class: 'bouton', text: texteBouton })

        const TYPES = {
          choix(ex) {
            const rep = ex.dataset.reponse
            const liste = $('.options', ex)
            const items = $$(':scope > li', liste)
            const boutons = items.map((li) => {
              const b = el('button', { type: 'button' })
              b.append(...li.childNodes)
              li.append(b)
              return b
            })
            if (ex.dataset.melanger !== 'non') melanger(items).forEach((li) => liste.append(li))
            const juste = items.findIndex((li) => li.dataset.option === rep)
            const c = {
              marque: true,
              solution: () => items[juste].textContent.trim(),
              restantes: () => boutons.filter((b) => !b.disabled).length,
              remplir(etat) {
                boutons[juste].classList.add(etat === 'vu' ? 'montre' : 'choisi-bon')
              },
              bloquer() {
                boutons.forEach((b) => {
                  b.disabled = true
                })
              },
            }
            boutons.forEach((b, i) =>
              b.addEventListener('click', () => {
                if (fini(ex)) return
                const r = items[i].textContent.trim()
                if ('essai' in ex.dataset)
                  return essayer(ex, c, { ok: i === juste, r, d: { m: items[i].dataset.retour } })
                if (i === juste) return repondre(ex, c, { ok: true, r })
                b.classList.add('choisi-faux')
                b.disabled = true
                repondre(ex, c, {
                  ok: false,
                  r,
                  d: { m: items[i].dataset.retour || 'Pas celle-ci.', e: items[i].dataset.erreur },
                })
              }),
            )
            return c
          },

          nombre(ex) {
            const d = ex.dataset
            const rep = Number(d.reponse)
            const { ligne, input, bouton } = ligneSaisie(ex)
            ex.append(ligne)
            const c = {
              solution: () => String(rep),
              remplir() {
                input.value = String(rep)
              },
              bloquer() {
                input.disabled = bouton.disabled = true
              },
            }
            bouton.addEventListener('click', () => {
              if (input.value.trim() === '')
                return void dire(ex, '', 'Écris ta réponse dans la case.')
              const r = entier(input.value)
              if (Number.isNaN(r)) return void dire(ex, '', 'Écris un nombre entier.')
              repondre(ex, c, { ok: r === rep, v: input.value })
            })
            return c
          },

          /** La table de vérité : une ligne par cas, rangées comme on compte en binaire ; VRAI ou FAUX sur chacune. */
          table(ex) {
            const d = ex.dataset
            const noms = d.faits.split('|')
            const racine = analyser(d.expr)
            const lignes = []
            for (let k = 0; k < 2 ** noms.length; k++) {
              const vals = {}
              noms.forEach((f, i) => {
                vals[f] = Boolean((k >> (noms.length - 1 - i)) & 1)
              })
              lignes.push({ vals, attendu: evaluer(racine, vals), dit: null, boutons: [] })
            }
            const decrire = (L) => noms.map((f) => f + ' = ' + VF(L.vals[f])).join(', ')
            const peindreLigne = (L) =>
              L.boutons.forEach((b, i) =>
                b.setAttribute('aria-pressed', String(L.dit === (i === 0))),
              )
            const corps = el('tbody')
            for (const L of lignes) {
              const groupe = el('span', { class: 'vf', role: 'group', 'aria-label': decrire(L) })
              for (const v of [true, false]) {
                const b = el('button', {
                  type: 'button',
                  class: 'bouton secondaire petit',
                  'aria-pressed': 'false',
                  text: VF(v),
                })
                b.addEventListener('click', () => {
                  if (fini(ex)) return
                  L.dit = v
                  peindreLigne(L)
                })
                L.boutons.push(b)
                groupe.append(b)
              }
              corps.append(
                el(
                  'tr',
                  {},
                  ...noms.map((f) =>
                    el('td', { class: 'val ' + (L.vals[f] ? 'v' : 'f'), text: VF(L.vals[f]) }),
                  ),
                  el('td', {}, groupe),
                ),
              )
            }
            const tete = el(
              'tr',
              {},
              ...noms.map((f) => el('th', { scope: 'col', text: f })),
              el('th', { scope: 'col', text: d.titre || d.expr }),
            )
            const bouton = boutonVerifier()
            ex.append(
              el(
                'div',
                { class: 'defile' },
                el('table', { class: 'verite' }, el('thead', {}, tete), corps),
              ),
              el('div', { class: 'saisie' }, bouton),
            )
            const simple =
              (racine.t === 'et' || racine.t === 'ou') &&
              racine.g.t === 'var' &&
              racine.d.t === 'var'
            function diagLigne(L) {
              const debut = 'Regarde la ligne ' + decrire(L) + ' : '
              if (simple && racine.t === 'ou' && L.vals[racine.g.nom] && L.vals[racine.d.nom])

          /** Tracer une chaîne : pour chaque cas, la valeur de chaque ligne (ou « pas testée »), puis ce qu'elle affiche. */

          /** Remettre les lignes d'une chaîne dans l'ordre : vérifié sur ce que la chaîne affiche pour chaque cas. */

              ;(cible.disabled ? (sens < 0 ? L.bas : L.haut) : cible).focus()
            }
            const sortieAvec = (o, vals) => {
              const k = o.findIndex((L) => evaluer(L.ast, vals))
              return { k, sortie: k === -1 ? sinon : o[k].sortie }
            }
            const premierFaux = () =>
              cas.find((x) => sortieAvec(ordre, x.vals).sortie !== x.attendu)
            const bonOrdre = () => d.reponse.split(',').map((id) => lignes.find((L) => L.id === id))
            const bouton = boutonVerifier()
            ex.append(el('div', { class: 'saisie' }, bouton))
            const c = {
              solution: () =>
                bonOrdre()
                  .map((L, k) => (k === 0 ? 'SI ' : 'SINON SI ') + L.texte)
                  .concat('SINON : afficher « ' + sinon + ' »')
                  .join(', '),
              remplir(etat, v) {
                const ids = (etat === 'vu' || !v ? d.reponse : v).split(',')
                ordre = ids.map((id) => lignes.find((L) => L.id === id)).filter(Boolean)
                if (ordre.length !== lignes.length) ordre = bonOrdre()
                peindre()
              },
              bloquer() {
                peindre()
                bouton.disabled = true
              },
              crans: [
                'Laquelle de ces conditions est remplie par le moins de valeurs ?',
                'La chaîne s’arrête à la première ligne VRAIE : la condition la plus exigeante, celle que le moins de valeurs remplissent, va en haut, puis la suivante.',
                () => {
                  const x = premierFaux() ?? cas[0]
                  return (
                    'La plus exigeante ici : « ' +
                    bonOrdre()[0].cond +
                    ' ». Puis teste ton ordre avec ' +
                    texteValeurs(x.vals) +
                    ' : la chaîne doit afficher « ' +
                    x.attendu +
                    ' ». Quelle est sa première ligne VRAIE ?'
                  )
                },
              ],
            }
            bouton.addEventListener('click', () => {
              if (fini(ex)) return
              const v = ordre.map((L) => L.id).join(',')
              const x = premierFaux()
              if (!x)
                return repondre(ex, c, { ok: true, v, m: 'Juste : la plus exigeante d’abord.' })
              const r = sortieAvec(ordre, x.vals)
              const m =
                'Avec ton ordre, ' +
                texteValeurs(x.vals) +
                ' donne « ' +
                r.sortie +
                ' » au lieu de « ' +
                x.attendu +
                ' »' +
                (r.k === -1
                  ? ' : aucune ligne n’est VRAIE.'
                  : ' : la ligne « ' +
                    ordre[r.k].cond +
                    ' » est déjà VRAIE, et la chaîne s’arrête là.')
              repondre(ex, c, { ok: false, v, d: { m, e: r.k === -1 ? undefined : 'E3' } })
            })
            peindre()
            return c
          },

          /** Les valeurs limites d'une chaîne : celles où elle change de sortie, juste avant ou juste après. */
          limites(ex) {
            const d = ex.dataset
            const ch = lireChaine(d.chaine)
            const nom = d.variable
            const candidats = d.candidats.split('|').map(Number)
            const sortie = (x) => executerChaine(ch, { [nom]: x }).sortie
            const seuils = []
            for (let x = Math.min(...candidats); x <= Math.max(...candidats) + 1; x++)
              if (sortie(x) !== sortie(x - 1)) seuils.push(x)
            const limite = (x) => sortie(x) !== sortie(x - 1) || sortie(x) !== sortie(x + 1)
            const attendus = candidats.filter(limite)
            const choisis = new Set()
            const boutons = candidats.map((x) => {
              const b = el('button', {
                type: 'button',
                class: 'bouton secondaire petit',
                'aria-pressed': 'false',
                text: nombre(x),
              })
              b.addEventListener('click', () => {
                if (fini(ex)) return
                if (choisis.has(x)) choisis.delete(x)
                else choisis.add(x)
                b.setAttribute('aria-pressed', String(choisis.has(x)))
              })
              return b
            })
            const peindre = () =>
              boutons.forEach((b, i) =>
                b.setAttribute('aria-pressed', String(choisis.has(candidats[i]))),
              )
            const bouton = boutonVerifier()
            ex.append(
              el(
                'div',
                { class: 'candidats', role: 'group', 'aria-label': 'Valeurs de ' + nom },
                ...boutons,
              ),
              el('div', { class: 'saisie' }, bouton),
            )
            const paires = () =>
              seuils
                .slice()
                .sort((a, b) => a - b)
                .map((t) => nombre(t - 1) + ' et ' + nombre(t))
                .join(', ')
            const enDescendant = seuils.slice().sort((a, b) => b - a)
            const c = {
              solution: () =>
                paires() +
                ' : à chaque seuil, la dernière valeur avant le changement et la première après',
              remplir(etat, v) {
                choisis.clear()
                const liste = etat !== 'vu' && v ? String(v).split('|').map(Number) : attendus
                liste.forEach((x) => choisis.add(x))
                peindre()
              },
              bloquer() {
                boutons.forEach((b) => {
                  b.disabled = true
                })
                bouton.disabled = true
              },
              crans: [
                'Pour quelles valeurs la chaîne change-t-elle de sortie ?',
                () =>
                  'Elle change à chaque seuil : ' +
                  enDescendant.map(nombre).join(', ') +
                  '. Autour de chacun, prends la dernière valeur avant le changement et la première après.',
                () =>
                  'Pour le seuil ' +
                  nombre(enDescendant[0]) +
                  ', les valeurs limites sont ' +
                  nombre(enDescendant[0] - 1) +
                  ' et ' +
                  nombre(enDescendant[0]) +
                  '. Fais de même pour les autres.',
              ],
            }
            bouton.addEventListener('click', () => {
              if (fini(ex)) return
              if (!choisis.size)
                return void dire(ex, '', 'Touche les valeurs limites, puis vérifie.')
              const v = [...choisis].sort((a, b) => a - b).join('|')
              const enTrop = candidats.filter((x) => choisis.has(x) && !limite(x))
              const manque = attendus.filter((x) => !choisis.has(x))
              if (!enTrop.length && !manque.length)
                return repondre(ex, c, { ok: true, v, m: 'Juste : ' + paires() + '.' })
              let m
              if (enTrop.length) {
                const x = enTrop[0]
                m =
                  nombre(x) +
                  ' n’est pas une valeur limite : ' +
                  nombre(x - 1) +
                  ', ' +
                  nombre(x) +
                  ' et ' +
                  nombre(x + 1) +
                  ' donnent tous « ' +
                  sortie(x) +
                  ' ». Rien ne change autour de ' +
                  nombre(x) +
                  '.'
              } else {
                const x = manque[0]
                const s = seuils.find((t) => t === x || t === x + 1)
                m =
                  (manque.length === 1
                    ? 'Il manque une valeur limite. '
                    : 'Il manque ' + manque.length + ' valeurs limites. ') +
                  (choisis.has(s) || choisis.has(s - 1)
                    ? 'Autour de ' +
                      nombre(choisis.has(s) ? s : s - 1) +
                      ', il en faut deux : la dernière valeur avant le changement et la première après.'
                    : 'Un des seuils n’a aucune de ses deux valeurs.')
              }
              repondre(ex, c, { ok: false, v, d: { m } })
            })
            return c
          },

          /**
           * Le JavaScript : la page exécute le code de l'apprenant pour chaque valeur à tester, en donnant
           * elle-même la valeur de la variable, et compare ce que console.log affiche à ce qui est attendu.
           */
          js(ex) {
            const d = ex.dataset
            const noms = d.variables.split(',').map((s) => s.trim())
            const cas = lireCasAttendus(d.cas)
            const depart = (d.depart || '').replace(/\\n/g, '\n')
            const codeFiche = d.solution || ''
            const joli = (s) => s.replace(/\{\s*/g, '{\n  ').replace(/\s*\}/g, '\n}')
            const zone = el('textarea', {
              id: uid('code'),
              class: 'code',
              rows: String(Math.max(7, depart.split('\n').length + 2)),
              spellcheck: 'false',
              autocapitalize: 'off',
              autocomplete: 'off',
              autocorrect: 'off',
              'aria-label': 'Ton code JavaScript',
            })
            zone.value = depart
            const bouton = boutonVerifier('Exécuter et vérifier')
            const resultats = el('div', { class: 'resultats-js defile' })
            ex.append(zone, el('div', { class: 'saisie' }, bouton), resultats)
            const norm = (s) => sansAccent(s).replace(/\s+/g, ' ').trim()
            /** Le code sans ses textes ni ses commentaires : pour y chercher des signes, pas pour l'exécuter. */
            const sansTextes = (s) =>
              s
                .replace(/\/\*[\s\S]*?\*\//g, ' ')
                .replace(/\/\/.*$/gm, '')
                .replace(/'(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"|`(?:[^`\\]|\\.)*`/g, "''")
            function conditionsIf(s) {
              const out = []
              const re = /\bif\s*\(/g
              let m
              while ((m = re.exec(s))) {
                let prof = 1
                let i = re.lastIndex
                for (; i < s.length && prof > 0; i++) {
                  if (s[i] === '(') prof++
                  else if (s[i] === ')') prof--
                }
                out.push(s.slice(re.lastIndex, prof === 0 ? i - 1 : i))
              }
              return out
            }
            // L'erreur critique que `avant` ou `bilan` a reconnue dans ce code (E4, E3), pour le bilan.
            let erreurVue
            /** Ce qui se voit avant d'exécuter : du pseudo-code, un = dans un if, une valeur donnée à la variable. */
            function avant(src) {
              const s = sansTextes(src)
              if (/[≥≤≠]/.test(s))
                return 'En JavaScript, ≥ s’écrit >=, ≤ s’écrit <= et ≠ s’écrit !==.'
              const mot = s.match(/\b(SI|SINON|ALORS|ET|OU|NON|VRAI|FAUX|afficher)\b/)
              if (mot)
                return (
                  'Le mot ' +
                  mot[1] +
                  ' est du pseudo-code. En JavaScript : if, else if, else, &&, ||, !, true, false, console.log.'
                )
              for (const nom of noms)
                if (new RegExp('\\b(let|const|var)\\s+' + nom + '\\b').test(s))
                  return (
                    'Ne crée pas la variable ' +
                    nom +
                    ' : la page lui donne elle-même chaque valeur à tester. Retire let ' +
                    nom +
                    ' = ….'
                  )
              for (const cond of conditionsIf(s))
                if (/(^|[^=!<>])=(?![=>])/.test(cond)) {
                  erreurVue = 'E4'
                  return (
                    'Dans if (' +
                    cond.trim() +
                    '), le signe = range une valeur au lieu de comparer. Pour comparer, écris ===.'
                  )
                }
              for (const nom of noms)
                if (new RegExp('(^|[^.\\w])' + nom + '\\s*=(?![=>])').test(s))
                  return (
                    'Ne donne pas de valeur à ' +
                    nom +
                    ' : la page lui donne elle-même chaque valeur à tester.'
                  )
              return null
            }
            function messageErreur(e) {
              if (e.name === 'EvalError')
                return 'Cette page ne peut pas exécuter de code ici. Fais l’exercice dans la console de ton navigateur.'
              if (e.name === 'SyntaxError')
                return (
                  'Le code ne se lit pas (SyntaxError) : une parenthèse, une accolade ou une apostrophe oubliée, ou un mot mal écrit. Le navigateur dit : « ' +
                  e.message +
                  ' ».'
                )
              if (e.name === 'ReferenceError') {
                const m = String(e.message).match(/^(\S+) is not defined|variable: (\S+)/)
                const inconnu = m ? m[1] || m[2] : ''
                const vrai = noms.find((n) => n.toLowerCase() === inconnu.toLowerCase())
                if (vrai)
                  return (
                    'JavaScript distingue les majuscules : la variable s’écrit ' +
                    vrai +
                    ', pas ' +
                    inconnu +
                    '.'
                  )
                if (cas.some((x) => norm(x.attendu) === norm(inconnu)))
                  return (
                    "Pour afficher un texte, mets-le entre apostrophes : console.log('" +
                    inconnu +
                    "')."
                  )
                return (
                  '« ' +
                  inconnu +
                  ' » n’existe pas (ReferenceError). Vérifie l’orthographe et les majuscules. La seule donnée est ' +
                  noms.join(', ') +
                  '.'
                )
              }
              return (
                'Le code s’arrête sur une erreur (' +
                e.name +
                ') : « ' +
                e.message +
                ' ». Vérifie l’écriture de console.log.'
              )
            }
            function lancer(src) {
              let f
              try {
                f = new Function('console', ...noms, '"use strict";\n' + src)
              } catch (e) {
                return { erreur: e }
              }
              return cas.map((x) => {
                const sortie = []
                const console = { log: (...a) => sortie.push(a.map(String).join(' ')) }
                try {
                  f(console, ...noms.map((n) => x.vals[n]))
                } catch (e) {
                  return { x, sortie, erreur: e }
                }
                return { x, sortie }
              })
            }
            const voisin = (x) =>
              cas.some(
                (y) =>
                  y !== x &&
                  noms.some(
                    (n) => typeof x.vals[n] === 'number' && Math.abs(y.vals[n] - x.vals[n]) === 1,
                  ) &&
                  y.attendu !== x.attendu,
              )
            function bilan(r) {
              if (!Array.isArray(r)) return messageErreur(r.erreur)
              for (const R of r) {
                const avec = 'Avec ' + texteValeurs(R.x.vals)
                if (R.erreur) return avec + ' : ' + messageErreur(R.erreur)
                if (R.sortie.length === 0)
                  return (
                    avec +
                    ', ton code n’affiche rien. Il manque une branche : else prend tous les cas restants.'
                  )
                if (R.sortie.length > 1) {
                  erreurVue = 'E3'
                  return (
                    avec +
                    ', ton code affiche ' +
                    R.sortie.map((s) => '« ' + s + ' »').join(' puis ') +
                    ' : plusieurs branches s’exécutent. Relie tes conditions avec else if : seule la première VRAIE doit s’exécuter.'
                  )
                }
                if (norm(R.sortie[0]) !== norm(R.x.attendu))
                  return (
                    avec +
                    ', ton code affiche « ' +
                    R.sortie[0] +
                    ' » au lieu de « ' +
                    R.x.attendu +
                    ' ».' +
                    (voisin(R.x)
                      ? ' C’est une valeur limite : la comparaison doit-elle être stricte (< ou >), ou accepter l’égalité (<= ou >=) ?'
                      : '')
                  )
              }
              return null
            }
            function peindreResultats(r) {
              if (!Array.isArray(r)) return void resultats.replaceChildren()
              const lignes = r.map((R) => {
                const ok =
                  !R.erreur && R.sortie.length === 1 && norm(R.sortie[0]) === norm(R.x.attendu)
                return el(
                  'tr',
                  { class: ok ? 'ok' : 'ko' },
                  el('td', { class: 'mono', text: texteValeurs(R.x.vals) }),
                  el('td', { text: R.x.attendu }),
                  el('td', {
                    text: R.erreur ? 'erreur' : R.sortie.length ? R.sortie.join(' puis ') : 'rien',
                  }),
                )
              })
              resultats.replaceChildren(
                el(
                  'table',
                  { class: 'table-resultats' },
                  el(
                    'thead',
                    {},
                    el(
                      'tr',
                      {},
                      el('th', { scope: 'col', text: 'Valeur' }),
                      el('th', { scope: 'col', text: 'Attendu' }),
                      el('th', { scope: 'col', text: 'Ton code affiche' }),
                    ),
                  ),
                  el('tbody', {}, ...lignes),
                ),
              )
            }
            const c = {
              solutionFixe: true,
              solution: () =>
                'les conditions vont de la plus exigeante à la moins exigeante, reliées par else if, et else prend le reste. Le code de la fiche est dans la case',
              remplir(etat, v) {
                zone.value = etat === 'vu' || !v ? joli(codeFiche) : String(v)
                peindreResultats(lancer(zone.value))
              },
              bloquer() {
                zone.readOnly = true
                bouton.disabled = true
              },
            }
            bouton.addEventListener('click', () => {
              if (fini(ex)) return
              const src = zone.value
              if (!src.trim() || src.trim() === depart.trim())
                return void dire(ex, '', 'Complète le code avant de vérifier.')
              erreurVue = undefined
              const pb = avant(src)
              if (pb) {
                resultats.replaceChildren()
                return repondre(ex, c, { ok: false, v: src, d: { m: pb, e: erreurVue } })
              }
              const r = lancer(src)
              if (!Array.isArray(r) && r.erreur.name === 'EvalError')
                return void dire(ex, '', messageErreur(r.erreur))
              peindreResultats(r)
              const m = bilan(r)
              if (!m)
                return repondre(ex, c, {
                  ok: true,
                  v: src,
                  m:
                    'Juste : ton code affiche la bonne réponse pour les ' +
                    cas.length +
                    ' valeurs.',
                })
              repondre(ex, c, { ok: false, v: src, d: { m, e: erreurVue } })
            })
            return c
          },

          /** Le schéma du bloc, de mémoire : un ou deux mots par case, reconnus sans les accents. */
          schema(ex) {
            // L'autre essai, après une solution vue : le même schéma, vide, à refaire sans regarder.
            const modele = ex.cloneNode(true)
            modele.removeAttribute('data-id')
            const champs = []
            for (const caseVide of $$('[data-case]', ex)) {
              const consigne = caseVide.textContent.trim()
              const input = el('input', {
                type: 'text',
                autocomplete: 'off',
                spellcheck: 'false',
                'aria-label': caseVide.dataset.libelle || consigne,
                placeholder: consigne,
              })
              caseVide.replaceChildren(input)
              champs.push({
                input,
                mots: caseVide.dataset.mots.split('|'),
                montre: caseVide.dataset.case,
              })
            }
            const verifie = (ch) => {
              const v = sansAccent(ch.input.value)
              const mots = ' ' + v.replace(/[^a-z0-9]+/g, ' ') + ' '
              return v.trim().length > 1 && ch.mots.some((a) => mots.includes(' ' + sansAccent(a)))
            }
            const bouton = boutonVerifier()
            ex.append(el('div', { class: 'saisie' }, bouton))
            const peindre = () =>
              champs.map((ch) => {
                const ok = verifie(ch)
                ch.input.classList.toggle('juste', ok)
                ch.input.classList.toggle('fausse', !ok)
                return ok
              })
            const c = {
              variante: () => modele.cloneNode(true),
              solution: () =>
                'les données, comparées, donnent des faits, VRAI ou FAUX ; combinés par NON, ET, OU, ils donnent une condition, une seule valeur ; la première VRAIE de la chaîne choisit une seule branche',
              remplir(etat, v) {
                const vs = v && etat !== 'vu' ? String(v).split('|') : null
                champs.forEach((ch, i) => {
                  ch.input.value = vs ? vs[i] || '' : ch.montre
                })
                peindre()
              },
              bloquer() {
                champs.forEach((ch) => {
                  ch.input.disabled = true
                })
                bouton.disabled = true
              },
            }
            bouton.addEventListener('click', () => {
              if (fini(ex)) return
              if (champs.some((ch) => !ch.input.value.trim()))
                return void dire(ex, '', 'Remplis toutes les cases, un ou deux mots dans chacune.')
              const bons = peindre().filter(Boolean).length
              const v = champs.map((ch) => ch.input.value.replace(/\|/g, ' ')).join('|')
              if (bons === champs.length)
                return repondre(ex, c, {
                  ok: true,
                  v,
                  m: 'Juste. Les données donnent des faits, les faits une condition, et la première condition VRAIE choisit la branche.',
                })
              repondre(ex, c, {
                ok: false,
                d: {
                  m:
                    bons +
                    ' cases justes sur ' +
                    champs.length +
                    '. Les cases en rouge sont à revoir : chacune attend un mot du cours.',
                },
                v,
              })
            })
            return c
          },
        }

        /**
         * Un autre cas écrit dans la fiche, pour refaire sans regarder dans le cours (règle F03) : un
         * exercice du même outil, fait des attributs `data-variante-…` de l'exercice sans leur préfixe,
         * avec `data-variante-enonce` pour énoncé ; pour remettre dans l'ordre, ses lignes
         * (`data-variante-lignes` : « a : condition => sortie | … »).
         */
        function autreCas(ex) {
          const donnees = {}
          for (const [cle, val] of Object.entries(ex.dataset)) {
            const m = /^variante([A-Z]\w*)$/.exec(cle)
            if (!m || m[1] === 'Enonce' || m[1] === 'Lignes') continue
            donnees[m[1].charAt(0).toLowerCase() + m[1].slice(1)] = val
          }
          const nouveau = nouvelEx(ex.dataset.widget, donnees, ex.dataset.varianteEnonce)
          const lignes = ex.dataset.varianteLignes
          if (lignes)
            nouveau.append(
              el(
                'ol',
                { class: 'lignes-ordre' },
                ...lignes.split('|').map((l) => {
                  const [, id, cond, sortie] =
                    /^\s*(\w+)\s*:\s*(.+?)\s*=>\s*(.+?)\s*$/.exec(l) ?? []
                  return el('li', {
                    'data-ligne': id,
                    'data-cond': cond,
                    'data-sortie': sortie,
                    text: cond + ' : afficher « ' + sortie + ' »',
                  })
                }),
              ),
            )
          return nouveau
        }

        /** Monte un exercice : son contrôleur, son échelle d'aide, et l'état gardé d'une visite précédente. */
        function monterEx(ex) {
          const fabrique = TYPES[ex.dataset.widget]
          if (!fabrique) return
          const c = fabrique(ex)
          if (!c.variante && ex.dataset.varianteEnonce && !dansItem(ex))
            c.variante = () => autreCas(ex)
          if (ex.dataset.solution && !c.solutionFixe) c.solution = () => ex.dataset.solution
          retourDe(ex)
          if ('essai' in ex.dataset) return monterEssai(ex, c)
          if (!c.sansEchelle) {
            c.echelle = window.JanusGabarit.echelle(ex, {
              crans: (c.crans ?? []).map((t) => (typeof t === 'function' ? () => fr(t()) : fr(t))),
              fini: () => fini(ex),
              surSolution: () => montrerSolution(ex, c),
            })
            ex.append(c.echelle.zone)
          }
          if (dansItem(ex) || ex.dataset.variante) return
          const garde = traces['ex:' + ex.dataset.id]
          if (garde && typeof garde === 'object' && garde.e) {
            // Une solution vue, ni refaite ni expliquée à la visite d'avant : la suite de l'écran
            // attend encore (règle F04).
            const cle = 'explique:ex:' + ex.dataset.id
            const reprise =
              garde.e === 'vu' &&
              avecReprise(ex) &&
              !garde.refait &&
              !traces[cle] &&
              !traces[cle + ':variante']
            if (reprise) ex.dataset.reprise = 'oui'
            appliquer(ex, c, garde.e, garde.v)
            if (reprise) apresSolution(ex, c)
            else if (garde.e === 'vu') proposerVariante(ex, c)
          }
        }

        /**
         * Un essai de l'étape 3 : pas d'échelle d'aide (rien ne s'aide avant l'explication). Déjà répondu,
         * il reste fini ; « Je ne sais pas », que le gabarit ajoute, arrive ici en fiche:essai-passe.
         */
        function monterEssai(ex, c) {
          if (traces['essai:' + ex.dataset.id]) {
            ex.dataset.fini = 'oui'
            c.bloquer?.()
            return
          }
          ex.addEventListener('fiche:essai-passe', () => {
            if (!fini(ex)) essayer(ex, c, { ok: false })
          })
        }

        /**
         * Pas à pas : dans un écran, ce qui suit un exercice pas encore fini attend qu'il le soit (une
         * question à la fois, règle I01). Un groupe d'exercices compte pour une question.
         */
        function devoiler(ecran) {
          if (!ecran) return
          let attendre = false
          for (const enfant of Array.from(ecran.children)) {
            if (attendre) {
              enfant.dataset.attente = ''
              continue
            }
            delete enfant.dataset.attente
            const exercices = enfant.matches('.ex[data-id]') ? [enfant] : $$('.ex[data-id]', enfant)
            if (exercices.some((ex) => !fini(ex) || ex.dataset.reprise === 'oui')) attendre = true
          }
        }

        // --- Les outils du cours.

        /**
         * Le guichet du cinéma : un client passe, et les lignes du pseudo-code au-dessus s'allument une à
         * une, dans l'ordre, jusqu'à la première VRAIE ; les suivantes restent éteintes. Le pari paraît
         * une fois les cinq clients passés.
         */
        const GUICHET =
          'âge < 12 => 5 € | étudiant OU âge < 26 => 7 € | âge ≥ 65 => 8 € | SINON => 10 €'
        const CLIENTS = [
          { nom: 'Léa', age: 9, etudiant: false, qui: 'Léa, 9 ans' },
          { nom: 'Hugo', age: 20, etudiant: true, qui: 'Hugo, 20 ans, étudiant' },
          { nom: 'Inès', age: 23, etudiant: false, qui: 'Inès, 23 ans' },
          { nom: 'Rose', age: 68, etudiant: false, qui: 'Rose, 68 ans' },
          { nom: 'Marc', age: 40, etudiant: false, qui: 'Marc, 40 ans' },
        ]
        function guichet(n) {
          const ecran = n.closest('.ecran, [data-ecran]') ?? n.parentElement
          const pre = $('pre[data-pseudo="guichet"]', ecran)
          const pari = $('[data-widget="pari"]', ecran)
          const ch = lireChaine(GUICHET)
          const vus = new Set(Array.isArray(traces.guichet) ? traces.guichet : [])
          const message = el('p', { class: 'message-outil', 'aria-live': 'polite' })
          const ticket = el('p', { class: 'ticket', 'aria-hidden': 'true' })
          const compte = el('p', { class: 'discret' })
          let minuteurs = []
          const lignesPre = (k, branche) =>
            pre ? $$('.l[data-l="' + k + '"]' + (branche ? '.br' : ':not(.br)'), pre) : []
          function effacer() {
            if (!pre) return
            for (const s of $$('.l', pre))
              s.classList.remove('vrai', 'faux', 'pas', 'choisie', 'en-cours')
            for (const s of $$('.eval', pre)) s.remove()
          }
          function majCompte() {
            compte.textContent = fr('Clients passés : ' + vus.size + ' sur ' + CLIENTS.length + '.')
            if (pari) pari.hidden = vus.size < CLIENTS.length
          }
          const boutons = CLIENTS.map((cl) => {
            const b = el('button', { type: 'button', class: 'bouton secondaire', text: cl.qui })
            if (vus.has(cl.nom)) b.classList.add('deja-vu')
            b.addEventListener('click', () => servir(cl, b))
            return b
          })
          function servir(cl, b) {
            minuteurs.forEach(clearTimeout)
            minuteurs = []
            effacer()
            ticket.textContent = ''
            const vals = { âge: cl.age, étudiant: cl.etudiant }
            const r = executerChaine(ch, vals)
            const fin = r.i === -1 ? ch.lignes.length : r.i
            const textes = [cl.qui + '.']
            const pas = []
            ch.lignes.forEach((L, j) => {
              if (j > fin) return
              const v = evaluer(L.ast, vals)
              const sur = avecValeurs(L.ast, vals)
              textes.push('Ligne ' + (j + 1) + ' : ' + sur + ', ' + VF(v) + '.')
              pas.push(() => {
                for (const s of lignesPre(j + 1, false)) {
                  s.classList.add(v ? 'vrai' : 'faux')
                  s.append(el('span', { class: 'eval', text: '  ' + sur + ' : ' + VF(v) }))
                }
              })
            })
            textes.push(
              'Le guichet affiche ' +
                r.sortie +
                '.' +
                (r.i !== -1 && r.i < ch.lignes.length - 1
                  ? ' Les lignes suivantes ne sont pas testées.'
                  : ''),
            )
            pas.push(() => {
              for (const s of lignesPre(fin + 1, true)) s.classList.add('choisie')
              for (let k = fin + 2; k <= ch.lignes.length + 1; k++)
                for (const s of lignesPre(k, false).concat(lignesPre(k, true)))
                  s.classList.add('pas')
              ticket.textContent = r.sortie
              message.textContent = fr(textes.join(' '))
              vus.add(cl.nom)
              b.classList.add('deja-vu')
              tracer('guichet', [...vus])
              majCompte()
            })
            const delai = mouvementReduit() ? 0 : 600
            pas.forEach((f, i) => minuteurs.push(setTimeout(f, delai * i)))
          }
          n.append(
            el(
              'div',
              { class: 'clients', role: 'group', 'aria-label': 'Les clients du cinéma' },

        }

        /** Deux interrupteurs et une lampe : en série pour ET, côte à côte pour OU. */
        function interrupteurs(n) {
          const op = n.dataset.op === 'ou' ? 'ou' : 'et'
          const etat = { A: false, B: false }
          const NS = 'http://www.w3.org/2000/svg'
          const svg = document.createElementNS(NS, 'svg')
          svg.setAttribute('viewBox', '0 0 340 160')
          svg.setAttribute('role', 'img')
          svg.classList.add('circuit')
          const trait = (x1, y1, x2, y2, classe = 'fil') => {
            const l = document.createElementNS(NS, 'line')
            Object.entries({ x1, y1, x2, y2 }).forEach(([k, v]) => l.setAttribute(k, String(v)))
            l.setAttribute('class', classe)
            svg.append(l)
            return l
          }
          const point = (cx, cy) => {
            const c = document.createElementNS(NS, 'circle')
            c.setAttribute('cx', String(cx))
            c.setAttribute('cy', String(cy))
            c.setAttribute('r', '3')
            c.setAttribute('class', 'contact')
            svg.append(c)
          }
          const etiquette = (x, y, t) => {
            const e = document.createElementNS(NS, 'text')
            e.setAttribute('x', String(x))
            e.setAttribute('y', String(y))
            e.setAttribute('class', 'etiquette')
            e.textContent = t
            svg.append(e)
          }
          // La pile, à gauche ; la lampe, à droite ; le fil du bas les relie.
          trait(30, 30, 30, 80)
          trait(14, 80, 46, 80, 'plaque')
          trait(21, 92, 39, 92, 'plaque')
          trait(30, 92, 30, 140)
          trait(30, 140, 310, 140)
          trait(310, 30, 310, 69)
          trait(310, 101, 310, 140)
          const lampe = document.createElementNS(NS, 'circle')
          lampe.setAttribute('cx', '310')
          lampe.setAttribute('cy', '85')
          lampe.setAttribute('r', '16')
          lampe.setAttribute('class', 'ampoule')
          svg.append(lampe)
          trait(299, 74, 321, 96, 'croix')
          trait(321, 74, 299, 96, 'croix')
          const leviers = {}
          const interrupteur = (nom, x1, x2, y) => {
            point(x1, y)
            point(x2, y)
            leviers[nom] = { l: trait(x1, y, x2, y, 'levier'), x2, y }
          }
          if (op === 'et') {
            trait(30, 30, 110, 30)
            interrupteur('A', 110, 150, 30)
            trait(150, 30, 190, 30)
            interrupteur('B', 190, 230, 30)
            trait(230, 30, 310, 30)
            etiquette(130, 56, 'A')
            etiquette(210, 56, 'B')
          } else {
            trait(30, 30, 90, 30)
            trait(90, 30, 130, 30)
            interrupteur('A', 130, 170, 30)
            trait(170, 30, 310, 30)
            trait(90, 30, 90, 105)
            trait(90, 105, 130, 105)
            interrupteur('B', 130, 170, 105)
            trait(170, 105, 230, 105)
            trait(230, 105, 230, 30)
            etiquette(150, 56, 'A')
            etiquette(150, 131, 'B')
          }
          const texteOutil = el('p', { class: 'message-outil', 'aria-live': 'polite' })
          const boutons = ['A', 'B'].map((k) => {
            const b = el('button', {
              type: 'button',
              class: 'bouton secondaire',
              'aria-pressed': 'false',
            })
            b.addEventListener('click', () => {
              etat[k] = !etat[k]
              peindre()
            })
            return [k, b]
          })
          const mot = op.toUpperCase()
          function peindre() {
            for (const [k, b] of boutons) {
              b.setAttribute('aria-pressed', String(etat[k]))
              b.textContent = 'Interrupteur ' + k + ' : ' + (etat[k] ? 'fermé' : 'ouvert')
              const L = leviers[k]
              L.l.setAttribute('x2', String(etat[k] ? L.x2 : L.x2 - 6))
              L.l.setAttribute('y2', String(etat[k] ? L.y : L.y - 20))
            }
            const allume = op === 'et' ? etat.A && etat.B : etat.A || etat.B
            svg.classList.toggle('allume', allume)
            const dit = (k) => k + ' ' + (etat[k] ? 'fermé, VRAI' : 'ouvert, FAUX')
            const phrase =
              dit('A') +
              ' ; ' +
              dit('B') +
              ' : A ' +
              mot +
              ' B vaut ' +
              VF(allume) +
              ', la lampe est ' +
              (allume ? 'allumée.' : 'éteinte.')
            svg.setAttribute(
              'aria-label',
              'Circuit ' + (op === 'et' ? 'en série' : 'en parallèle') + '. ' + phrase,
            )
            texteOutil.textContent = fr(phrase)
          }
          n.append(svg, el('div', { class: 'rangee' }, ...boutons.map(([, b]) => b)), texteOutil)
          peindre()
        }

        /** Le pari, sans note : gardé (fiche:trace), repris à la fin du bloc. */
        function pari(n) {
          const items = $$('.options > li', n)
          const message = el('p', { class: 'retour', 'aria-live': 'polite' })
          n.append(message)
          const choisir = (option, garder) => {
            items.forEach((li) =>
              $('button', li).setAttribute('aria-pressed', String(li.dataset.option === option)),
            )
            message.textContent = fr(n.dataset.apres || '')
            if (garder) tracer('pari', option)
          }
          items.forEach((li) => {
            const b = el('button', { type: 'button' })
            b.append(...li.childNodes)
            li.append(b)
            b.addEventListener('click', () => choisir(li.dataset.option, true))
          })
          if (typeof traces.pari === 'string') choisir(traces.pari, false)
        }

        /** Le rappel du pari, au-dessus de la question qui le reprend. */
        function rappelPari(n) {
          const choisi = traces.pari
          const ex = n.closest('.ex')
          const option =
            typeof choisi === 'string' ? $('li[data-option="' + choisi + '"]', ex) : null
          if (!option) return
          n.hidden = false
          n.textContent = fr('Au début, tu avais répondu : « ' + option.textContent.trim() + ' »')
        }

        /**
         * L'aisance (étape 11) : les 10 lignes des tables NON, ET et OU, dans le désordre, VRAI ou FAUX
         * au toucher ou au clavier (V, F). Une série est réussie avec 10 justes sur 10 en 25 secondes au
         * plus. Il en faut trois, trois jours différents. Chaque série finie part au pont (aisance.resultat).
         */
        const LIGNES_AISANCE = [false, true].map((a) => ({ op: 'NON', a, v: !a }))
        for (const op of ['ET', 'OU'])
          for (const a of [false, true])
            for (const b of [false, true])
              LIGNES_AISANCE.push({ op, a, b, v: op === 'ET' ? a && b : a || b })
        const N_AISANCE = LIGNES_AISANCE.length
        // La durée du palier courant, lue dans le manifeste (aisance.paliers_s), comme le moteur.
        const PALIERS = JSON.parse(document.getElementById('bloc-manifest').textContent).aisance
          .paliers_s
        const DUREE = PALIERS[0]
        function aisance(n) {
          const reussis = Array.isArray(traces.vitesse)
            ? traces.vitesse.filter((x) => x && typeof x.jour === 'string')
            : []
          const liste = el('ol', { class: 'niveaux' })
          const info = el('p', { class: 'discret' })
          const zone = el('div', { class: 'zone-vitesse' })
          const lancer = el('button', { type: 'button', class: 'bouton', text: 'Lancer une série' })
          const aujourdhui = () => reussis.some((x) => x.jour === jourCle())
          function majInfo() {
            liste.replaceChildren(
              ...[0, 1, 2].map((k) => {
                const r = reussis[k]
                return el(
                  'li',
                  { class: r ? 'reussi' : k === reussis.length ? 'courant' : '' },
                  el('span', { text: 'Série réussie ' + (k + 1) }),
                  el('span', {
                    class: 'etat ' + (r ? 'solide' : 'attente'),
                    text: r
                      ? 'le ' + dateCourte(r.jour)
                      : k === reussis.length
                        ? 'à réussir'
                        : 'un autre jour',
                  }),
                )
              }),
            )
            if (reussis.length >= 3)
              info.textContent = fr(
                'Trois séries réussies, trois jours différents : les tables sont acquises. Tu peux continuer à t’entraîner.',
              )
            else if (aujourdhui())
              info.textContent = fr(
                'Série réussie aujourd’hui. La suivante compte à partir de demain : d’ici là, tes séries servent d’entraînement.',
              )
            else
              info.textContent = fr(
                'Ta prochaine série compte si elle est réussie : ' +
                  N_AISANCE +
                  ' justes sur ' +
                  N_AISANCE +
                  ', en ' +
                  DUREE +
                  ' secondes au plus.',
              )
          }
          const raison = (L) =>
            L.op === 'NON'
              ? 'NON inverse la valeur'
              : L.op === 'ET'
                ? L.v
                  ? 'les deux sont VRAI'
                  : 'il suffit d’un FAUX'
                : L.a && L.b
                  ? 'le OU accepte les deux à la fois'
                  : L.v
                    ? 'il suffit d’un VRAI'
                    : 'aucun des deux n’est VRAI'
          const enonce = (L) =>
            L.op === 'NON' ? 'NON ' + VF(L.a) : VF(L.a) + ' ' + L.op + ' ' + VF(L.b)
          let serie = []
          let reponses = []
          let debut = 0
          let minuteur = null
          let enCours = false
          let compte = false
          const barre = el('span')
          const chrono = el('span', { class: 'chrono', 'aria-hidden': 'true' }, barre)
          const temps = el('p', { class: 'discret', 'aria-live': 'off' })
          const question = el('div', { class: 'question-vitesse' })
          const vrai = el('button', { type: 'button', class: 'bouton', text: 'VRAI' })
          const faux = el('button', { type: 'button', class: 'bouton', text: 'FAUX' })
          vrai.addEventListener('click', () => choisir(true))
          faux.addEventListener('click', () => choisir(false))
          n.addEventListener('keydown', (e) => {
            if (!enCours || e.altKey || e.ctrlKey || e.metaKey) return
            const k = e.key.toLowerCase()
            if (k === 'v' || k === 'f') {
              e.preventDefault()
              choisir(k === 'v')
            }
          })
          function poser() {
            const L = serie[reponses.length]
            question.replaceChildren(
              el('p', {
                class: 'discret',
                text: 'Ligne ' + (reponses.length + 1) + ' sur ' + N_AISANCE,
              }),
              el('p', { class: 'q mono grande', text: enonce(L) }),
              el('div', { class: 'rangee' }, vrai, faux),
              el('p', { class: 'discret', text: 'Au clavier : V pour VRAI, F pour FAUX.' }),
            )
          }
          function choisir(v) {
            if (!enCours) return
            reponses.push(v)
            if (reponses.length === N_AISANCE) return finir(false)
            poser()
            vrai.focus()
          }
          function finir(ecoule) {
            enCours = false
            clearInterval(minuteur)
            const t = (performance.now() - debut) / 1000
            const s = nombre(Math.round(t * 10) / 10)
            const justes = reponses.filter((r, i) => r === serie[i].v).length
            const reussie = !ecoule && justes === N_AISANCE && t <= DUREE
            window.JanusPont?.envoyer('aisance.resultat', {
              reussi: reussie,
              duree_s: Math.round(Math.min(t, 600) * 10) / 10,
            })
            let texteFin
            if (reussie && compte) {
              reussis.push({ jour: jourCle() })
              tracer('vitesse', reussis.slice())
              texteFin =
                'Série réussie : ' +
                N_AISANCE +
                ' sur ' +
                N_AISANCE +
                ' en ' +
                s +
                ' s. ' +
                (reussis.length >= 3
                  ? 'C’est la troisième, un troisième jour : les tables sont acquises.'
                  : 'Elle compte : ' + reussis.length + ' sur 3, un jour différent chacune.')
            } else if (reussie)
              texteFin =
                'Série réussie : ' +
                N_AISANCE +
                ' sur ' +
                N_AISANCE +
                ' en ' +
                s +
                ' s. Elle compte comme entraînement.'
            else if (ecoule)
              texteFin =
                'Temps écoulé : ' +
                reponses.length +
                ' lignes sur ' +
                N_AISANCE +
                ', ' +
                justes +
                ' justes. Refais-en une.'
            else if (justes === N_AISANCE)
              texteFin =
                N_AISANCE +
                ' sur ' +
                N_AISANCE +
                ', mais en ' +
                s +
                ' s : il faut ' +
                DUREE +
                ' secondes au plus. Refais-en une.'
            else
              texteFin =
                justes +
                ' sur ' +
                N_AISANCE +
                ', en ' +
                s +
                ' s. Une série se réussit avec ' +
                N_AISANCE +
                ' justes sur ' +
                N_AISANCE +
                ' : refais-en une.'
            const fautes = serie
              .map((L, i) => ({ L, r: reponses[i] }))
              .filter((x) => x.r !== undefined && x.r !== x.L.v)
            question.replaceChildren(
              el('p', { class: reussie ? 'retour bon' : 'retour', text: texteFin }),
              fautes.length
                ? el(
                    'ul',
                    { class: 'fautes-vitesse' },
                    ...fautes.map((x) =>
                      el('li', {
                        text:
                          enonce(x.L) +
                          ' donne ' +
                          VF(x.L.v) +
                          ', pas ' +
                          VF(x.r) +
                          ' : ' +
                          raison(x.L) +
                          '.',
                      }),
                    ),
                  )
                : null,
            )
            chrono.hidden = true
            lancer.hidden = false
            lancer.focus()
            majInfo()
          }
          lancer.addEventListener('click', () => {
            serie = melanger(LIGNES_AISANCE)
            reponses = []
            compte = reussis.length < 3 && !aujourdhui()
            lancer.hidden = true
            chrono.hidden = false
            barre.style.transform = 'scaleX(1)'
            enCours = true
            debut = performance.now()
            poser()
            vrai.focus()
            minuteur = setInterval(() => {
              if (!n.isConnected) return void clearInterval(minuteur)
              const t = (performance.now() - debut) / 1000
              barre.style.transform = 'scaleX(' + Math.max(0, 1 - t / DUREE) + ')'
              if (t >= DUREE && enCours) finir(true)
            }, 100)
          })
          chrono.hidden = true
          zone.append(chrono, question, temps)
          n.append(liste, info, zone, el('div', { class: 'rangee' }, lancer))
          majInfo()
        }

        const OUTILS = {
          guichet,
          interrupteurs,
          pari,
          'rappel-pari': rappelPari,
          aisance,
        }

        /**
         * Après une solution montrée, l'item revient avec `data-solution-vue` sur sa boîte : on le refait
         * sur sa variante (`<template data-variante="PR1-1">`). Si c'est la solution de la variante qui a
         * été vue, on revient à l'énoncé d'origine : on ne refait jamais le cas qu'on vient de voir.
         */
        const prochain = {}
        const montre = {}
        function poserLaVariante() {
          for (const boite of $$('#contenu .item[data-item]')) {
            const id = boite.dataset.item
            const variante = $('template[data-variante="' + id + '"]')
            const choix =
              variante && boite.hasAttribute('data-solution-vue')
                ? (prochain[id] ?? 'variante')
                : 'origine'
            if (choix === 'variante')
              $('.enonce', boite).replaceChildren(variante.content.cloneNode(true))
            montre[id] = choix
          }
        }

        const montes = new WeakSet()
        document.addEventListener('fiche:rendu', (evenement) => {
          for (const [cle, val] of Object.entries(evenement.detail?.traces ?? {})) traces[cle] = val
          poserLaVariante()
          // Les outils d'abord (le guichet décide si le pari paraît), puis les exercices.
          for (const n of $$('#contenu [data-widget]')) {
            if (montes.has(n) || !OUTILS[n.dataset.widget]) continue
            montes.add(n)
            OUTILS[n.dataset.widget](n)
          }
          for (const n of $$('#contenu .ex[data-widget]')) {
            if (montes.has(n) || !TYPES[n.dataset.widget]) continue
            montes.add(n)
            monterEx(n)
          }
          for (const ecran of $$('#contenu .ecran')) devoiler(ecran)
        })
      })()
    </script>

    <script id="plomberie">
      'use strict'
      const manifeste = JSON.parse(document.getElementById('bloc-manifest').textContent)
      const CLE_ETAT = 'janus.fiche.' + manifeste.bloc + '.etat'
      /*
       * Les quatre moments du cycle de la méthode (percevoir, tenter, modéliser, faire, recevoir un
       * retour, ajuster), dans l'ordre du fil, avec les types d'étape de chacun. `ensemble`, c'est
       * ajuster : en fin de bloc, après la pratique, le pari du début repris puis le schéma refait de
       * mémoire (règle C08). `perception`, `pretest` et `ensemble` se dessinent comme une explication
       * (afficherLibre).
       */
      const MOMENTS = [
        { nom: 'Découvrir', types: ['perception', 'carte'] },
        { nom: 'Comprendre', types: ['pretest', 'explication'] },
        { nom: 'S’entraîner', types: ['pratique', 'atelier', 'aisance', 'ensemble'] },
        { nom: 'Prouver', types: ['restitution', 'bilan'] },
      ]
      const momentDe = (etape) => MOMENTS.find((moment) => moment.types.includes(etape.type))
      /** Les types d'étape que le gabarit sait dessiner : chacun a son moment. */
      const ETAPES_FICHE = MOMENTS.flatMap((moment) => moment.types)
      /** Les étapes à lire, dessinées depuis leur `<template data-etape>`. */
      const ETAPES_LIBRES = ['perception', 'pretest', 'explication', 'ensemble', 'aisance']
      const LIBELLES_STATUT = {
        non_commence: 'Non commencé',
        en_cours: 'En cours',
        vu: 'Vu',
        acquis_provisoirement: 'Acquis provisoirement',
        acquis: 'Acquis',
        maitrise: 'Maîtrisé',
        a_reprendre: 'À reprendre',
      }
      const etapes = manifeste.etapes.filter((etape) => ETAPES_FICHE.includes(etape.type))
      const $ = (id) => document.getElementById(id)
      $('titre').textContent = manifeste.titre
      document.title = manifeste.titre

      // --- Mode autonome : correction simulée et localStorage (sur claude.ai : Claude et localStorage) ---
      /** Un UUID v7, comme l'exige le schéma d'une correction. */
      function uuidV7() {
        const temps = Date.now().toString(16).padStart(12, '0')
        const h = Array.from(crypto.getRandomValues(new Uint8Array(12)), (o) =>
          o.toString(16).padStart(2, '0'),
        ).join('')
        const variante = (8 + (parseInt(h[3], 16) & 3)).toString(16)
        return (
          temps.slice(0, 8) +
          '-' +
          temps.slice(8) +
          '-7' +
          h.slice(0, 3) +
          '-' +
          variante +
          h.slice(4, 7) +
          '-' +
          h.slice(7, 19)
        )
      }
      /**
       * Hors de l'appli, personne ne juge le sens d'une réponse : compter des mots laisserait passer une
       * paraphrase vide. La page ne dit donc jamais « solide » : elle montre ce qui était attendu, et
       * l'apprenant compare. La correction n'est pas vérifiée, elle ne compte pas (le moteur dit de même
       * pour une certitude `non_verifie`) : la bulle porte le badge « Non vérifiée ».
       */
      /**
       * L'attendu d'une question est écrit pour le correcteur : il cite les étapes par leur numéro et les
       * erreurs critiques par leur code. Montré à l'apprenant, il dit le titre de l'étape et le nom de
       * l'erreur, qu'il connaît, à la place.
       */
      function attenduEnMots(texte) {
        const titre = (n) => manifeste.etapes.find((e) => e.id === 'ET' + n)?.titre
        const libelle = (code) =>
          (manifeste.erreurs_critiques ?? []).find((e) => e.id === code)?.libelle
        return String(texte)
          .replace(/\bl([’'])erreur (E\d+)\b/g, (tout, apostrophe, code) => {
            const nom = libelle(code)
            return nom ? 'l' + apostrophe + 'erreur «\u00a0' + nom + '\u00a0»' : tout
          })
          .replace(/(étapes?) (\d+(?:, \d+)*(?: et \d+)?)/g, (tout, mot, liste) => {
            return (
              mot +
              ' ' +
              liste.replace(/\d+/g, (n) => {
                const t = titre(n)
                return t ? n + ' (' + t + ')' : n
              })
            )
          })
      }
      function corrigerLocalement(demande) {
        const question = manifeste.restitution.find((q) => q.id === demande.question)
        const reponse = demande.reponse.trim()
        const message = (texte, niveau) => ({
          id: uuidV7(),
          echantillon: false,
          question: demande.question,
          tour: demande.relance === '' ? 1 : 2,
          niveau,
          message:
            'Correction simulée (mode autonome)\u00a0: ' +
            texte +
            (question
              ? ' Ce qui était attendu\u00a0: «\u00a0' + attenduEnMots(question.attendu) + '\u00a0»'
              : ''),
          erreurs_critiques: [],
          source: 'deduit',
          ref: 'autonome',
          certitude: 'non_verifie',
          compte: false,
          raison_non_compte: 'non_verifiee',
        })
        if (reponse.toLowerCase() === 'je ne sais pas')
          return message('pas encore. Relis la carte du bloc.', 'pas_encore')
        if (reponse.length < 40)
          return message('ta réponse est trop courte pour montrer une idée, développe.', 'fragile')
        return message(
