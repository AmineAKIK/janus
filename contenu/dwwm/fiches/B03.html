                if (!etat.traces?.['essai:' + cle])
                  noterEssai(cle, {
                    reponse: null,
                    juste: false,
                    attendu: attenduEcrit(ex),
                    retour: ex.dataset.explication ?? '',
                  })
              },
            })
            ex.append(creer('div', { className: 'actions essai-passe' }, bouton))
            return
          }
          passer?.remove()
          for (const champ of ex.querySelectorAll('input, button, select, textarea'))
            champ.disabled = true
          // La réponse reste visible, même après un rechargement.
          remontrerEssai(ex, essai)
          const note =
            ex.querySelector(':scope > .essai-note') ??
            ex.appendChild(creer('p', { className: 'discret essai-note', 'aria-live': 'polite' }))
          note.textContent =
            (essai.reponse === null
              ? 'Noté : tu ne sais pas encore.'
              : 'Noté : ' + entreGuillemets(essai.reponse) + '.') +
            ' La correction vient à la fin de l’étape.'
        })
        const ecrans = section.querySelectorAll('.ecran')
        const bilan =
          section.querySelector('.essais-bilan') ??
          (ecrans[ecrans.length - 1] ?? section).appendChild(
            creer('div', { className: 'essais-bilan', hidden: true }),
          )
        const fini = exercices.length > 0 && essais.every(Boolean)
        bilan.hidden = !fini
        if (fini)
          bilan.replaceChildren(
            creer('h3', { textContent: 'Tes essais' }),
            creer('p', {
              textContent:
                'Voici ce que tu as répondu, et ce qui était attendu. Les étapes suivantes expliquent pourquoi, à partir de tes réponses.',
            }),
            creer(
              'ol',
              {},
              ...exercices.map((ex, k) => {
                const essai = essais[k]
                const fin = (texte) => String(texte).replace(/[.;\s]+$/, '') + '.'
                // Juste, faux ou passé se voit d'un coup d'œil : une marque écrite et sa couleur.
                const etatEssai = essai.reponse === null ? 'passe' : essai.juste ? 'juste' : 'faux'
                const ligne = (libelle, texte) =>
                  creer(
                    'p',
                    {},
                    creer('span', { className: 'essai-libelle', textContent: libelle }),
                    texte,
                  )
                return creer(
                  'li',
                  { dataset: { etat: etatEssai } },
                  creer('span', {
                    className: 'essai-marque',
                    textContent: { juste: '✓ Juste', faux: '✗ Pas juste', passe: '? À découvrir' }[
                      etatEssai
                    ],
                  }),
                  creer('p', {}, creer('strong', { textContent: enonceEssai(ex) })),
                  // Les lignes que l'essai faisait lire (un pseudo-code) reviennent avec lui : le bilan
                  // se lit sans remonter à l'écran de l'essai (B02 v33, le thermostat).
                  ...Array.from(ex.querySelectorAll(':scope > pre'), (pre) => pre.cloneNode(true)),
                  // Sans réponse, pas de solution à garder sans l'avoir comprise (règle F04) :
                  // l'étape suivante l'explique, à partir des réponses de la série.
                  ...(essai.reponse === null
                    ? [
                        creer('p', {
                          textContent: 'Tu ne savais pas : les étapes suivantes te l’apprennent.',
                        }),
                      ]
                    : [
                        ligne('Ta réponse : ', fin(essai.reponse)),
                        ...(essai.juste || essai.attendu === ''
                          ? []
                          : [ligne('Attendu : ', fin(essai.attendu))]),
                        ...(essai.retour
                          ? [creer('p', { className: 'discret', textContent: essai.retour })]
                          : []),
                      ]),
                )
              }),
            ),
          )
        majPied()
      }
      /**
       * Une erreur critique repérée, par le correcteur dans une réponse ou par un outil : elle reste
       * connue après un rechargement, et le bilan suivant la coche d'office (`aCocher`) sans que
       * l'apprenant puisse la décocher (règle V01). `cle` dit où : l'identifiant de la question, ou
       * « outil: » suivi de l'endroit que l'outil nomme.
       */
      function noterReperees(cle, ids) {
        if (ids.length === 0) return
        const deja = etat.erreurs?.[cle] ?? []
        etat.erreurs = { ...(etat.erreurs ?? {}), [cle]: [...new Set([...deja, ...ids])] }
        etat.aCocher = [...new Set([...(etat.aCocher ?? []), ...ids])]
        enregistrer()
      }
      /**
       * Une réponse nouvelle à une question remplace ce que la précédente avait fait repérer : ces
       * erreurs ne sont plus cochées d'office, sauf si une autre réponse ou un outil les a aussi
       * repérées. Sans cela, une erreur refermée par la nouvelle réponse resterait cochée et
       * verrouillée dans le bilan, et l'envoyer la rouvrirait.
       */
      function remplacerReperees(question) {
        etat.erreurs = { ...(etat.erreurs ?? {}), [question]: [] }
        const encore = new Set(Object.values(etat.erreurs).flat())
        etat.aCocher = (etat.aCocher ?? []).filter((id) => encore.has(id))
      }
      /**
       * Amine a rejeté une erreur que le correcteur avait repérée dans la réponse à une question : le
       * bilan ne la coche plus d'office, sauf si une autre réponse ou un outil l'a aussi repérée.
       */
      function retirerReperee(question, erreur) {
        const deja = etat.erreurs?.[question] ?? []
        if (!deja.includes(erreur)) return false
        etat.erreurs = { ...etat.erreurs, [question]: deja.filter((id) => id !== erreur) }
        if (!Object.values(etat.erreurs).some((ids) => ids.includes(erreur)))
          etat.aCocher = (etat.aCocher ?? []).filter((id) => id !== erreur)
        enregistrer()
        return true
      }
      /**
       * Un outil qui reconnaît une erreur critique dans une réponse (des bits lus à l'envers, un départ
       * de 256) émet sur son élément `fiche:erreur` (`bubbles: true`, `cancelable: true`, `detail:
       * { erreur, ou }`). Une fois la restitution faite, l'erreur attend le bilan : le gabarit annule
       * l'événement, et l'outil dit d'envoyer le bilan avant de continuer.
       */
      $('contenu').addEventListener('fiche:erreur', (evenement) => {
        const { erreur, ou } = evenement.detail ?? {}
        if (typeof ou !== 'string' || ou === '') return
        if (!manifeste.erreurs_critiques.some((e) => e.id === erreur)) return
        noterReperees('outil:' + ou, [erreur])
        if (bilanAttendu()) evenement.preventDefault()
      })
      /**
       * L'étape affichée est vue : l'appli la coche. Pas une étape masquée par la restitution en cours,
       * dont l'apprenant ne lit que « Masqué » ; elle le sera quand elle se rouvrira.
       */
      function noterVue() {
        const etape = etapes.find((e) => e.id === etat.etape) ?? etapes[0]
        if (etape && !masquee(etape)) pont.envoyer('etape.vue', { etape: etape.id })
      }
      function aller(id) {
        etat.etape = id
        noterVue()
        enregistrer({ regrouper: true })
        afficher()
        remonter($('contenu'))
      }
      /**
       * Nouvel écran ou nouvelle étape : son haut revient à l'écran. Dans l'appli, la fiche ne défile
       * pas seule (l'iframe a la hauteur du contenu) : c'est l'appli qui remonte, si besoin.
       */
      function remonter(element) {
        if (mode === 'appli') pont.envoyer('page.haut', {})
        else element.scrollIntoView({ block: 'start' })
      }
      const pluriel = (nombre, singulier, plusieurs) =>
        nombre + ' ' + (nombre > 1 ? plusieurs : singulier)
      /** Le jour sur cet appareil, AAAA-MM-JJ : une solution vue ne compte plus le lendemain. */
      function aujourdhui() {
        const date = new Date()
        const deux = (nombre) => String(nombre).padStart(2, '0')
        return date.getFullYear() + '-' + deux(date.getMonth() + 1) + '-' + deux(date.getDate())
      }
      /** Le cas d'origine, la variante : ce que la page envoie avec un résultat. */
      const CAS = ['origine', 'variante']
      const idsPratique = () =>
        (manifeste.pratique ?? []).flatMap((exercice) => exercice.items.map((item) => item.id))
      /** Hors de l'appli, la page garde elle-même ses résultats et ses explications. */
      function pratiqueLocale() {
        const locale = etat.pratiqueLocale
        if (locale && Array.isArray(locale.resultats) && Array.isArray(locale.expliques))
          return locale
        etat.pratiqueLocale = { resultats: [], expliques: [] }
        return etat.pratiqueLocale
      }
      /** Les résultats de la pratique dans l'ordre : ceux du serveur, puis ceux qui l'attendent. */
      function essaisPratique() {
        if (pratiqueServeur === null) return pratiqueLocale().resultats
        const connus = new Set(pratiqueServeur.resultats.map((resultat) => resultat.id))
        return [
          ...pratiqueServeur.resultats,
          ...essaisEnAttente.filter((resultat) => !connus.has(resultat.id)),
        ]
      }
      /** Le jour de l'appli (son fuseau, son heure de bascule) ; hors de l'appli, celui de l'appareil. */
      const jourPratique = () => pratiqueServeur?.aujourdhui ?? aujourdhui()
      /**
       * Chaque item, relu de ses résultats par la règle du moteur (`suivreLaPratique` dans
       * `@janus/contrats`) : son état (à faire, réussi avec de l'aide, réussi), l'aide qu'il garde,
       * s'il se refait sur l'autre cas, les items qui débloquent son aide, le relais.
       */
      function itemsPratique() {
        return window.JanusPratique.suivre(idsPratique(), essaisPratique(), jourPratique())
      }
      const itemPratique = (id) => itemsPratique().get(id)
      function itemExplique(item) {
        if (pratiqueServeur === null) return pratiqueLocale().expliques.includes(item)
        return pratiqueServeur.expliques.includes(item) || expliquesEnAttente.has(item)
      }
      function noterExplique(item) {
        if (pratiqueServeur !== null) expliquesEnAttente.add(item)
        else if (!pratiqueLocale().expliques.includes(item)) pratiqueLocale().expliques.push(item)
      }
      /** La pratique que le serveur garde : ce qu'elle contient n'attend plus ici. */
      function recevoirPratique(pratique) {
        if (!pratique) return
        pratiqueServeur = pratique
        const connus = new Set(pratique.resultats.map((resultat) => resultat.id))
        for (let k = essaisEnAttente.length - 1; k >= 0; k -= 1) {
          if (connus.has(essaisEnAttente[k].id)) essaisEnAttente.splice(k, 1)
        }
        for (const item of pratique.expliques) expliquesEnAttente.delete(item)
      }
      /*
       * L'état d'avant la refonte gardait sa copie des items (`etat.pratique`). Dans l'appli, le serveur
       * a leurs résultats : la copie s'efface. Hors de l'appli, elle devient les résultats de la page :
       * un item réussi le reste, avec l'aide notée.
       */
      function reprendreAnciennePratique() {
        const ancienne = etat.pratique
        delete etat.pratique
        delete etat.rangPratique
        if (pratiqueServeur !== null || !ancienne || typeof ancienne !== 'object') return
        const locale = pratiqueLocale()
        for (const [item, note] of Object.entries(ancienne)) {
          if (note?.reussi === true) {
            locale.resultats.push({
              id: 'avant-' + item,
              item,
              reussi: true,
              aide: [0, 1, 2, 3, 4].includes(note.aide) ? note.aide : 0,
              brute: false,
              jour: typeof note.aideLe === 'string' ? note.aideLe : '1970-01-01',
              cas: null,
            })
          }
          if (note?.explique === true && !locale.expliques.includes(item))
            locale.expliques.push(item)
        }
      }

      const questions = (serie) => (serie === 'restitution' ? manifeste.restitution : [])
      const reponsesFinies = (serie) => questions(serie).filter((q) => etat.envoyees[q.id]).length
      /**
       * Le décompte de la pratique, le même partout : « 5 sur 14, dont 2 avec de l’aide ». Un item réussi
       * avec de l'aide compte pour avancer ; l'appli ne le compte qu'une fois refait sans aide.
       */
      function decomptePratique() {
        const items = manifeste.pratique.flatMap((exercice) => exercice.items)
        const reussis = items.filter((item) => itemReussi(item.id))
        const etats = itemsPratique()
        const avecAide = reussis.filter((item) => etats.get(item.id).etat === 'aide').length
        return (
          reussis.length +
          ' sur\u00a0' +
          items.length +
          (avecAide > 0 ? ', dont ' + avecAide + ' avec de l’aide' : '')
        )
      }
      /**
       * Ce qui retient dans une étape : les questions d'une série ouverte qui n'ont pas encore leur
       * réponse finale. On ne quitte pas une restitution à moitié faite.
       */
      function resteAFaire(etape) {
        // La pratique : chaque item réussi, avec ou sans aide (sans aide, il ne compte qu'un autre
        // jour, et l'apprenant resterait bloqué jusque-là). Une solution vue n'est pas réussie.
        if (etape.type === 'pratique') {
          const items = manifeste.pratique.flatMap((exercice) => exercice.items)
          const reussis = items.filter((item) => itemReussi(item.id)).length
          if (reussis === items.length) return ''
          return (
            'Réussis les ' +
            items.length +
            ' items avant de passer à la suite\u00a0: ' +
            decomptePratique() +
            ', pour l’instant.'
          )
        }
        if (etape.type === 'pretest') {
          const restants = Array.from(
            $('contenu').querySelectorAll('[data-essai][data-id]'),
          ).filter((ex) => !etat.traces?.['essai:' + ex.dataset.id]).length
          if (restants === 0) return ''
          return (
            'Réponds à chaque essai avant de passer à la suite, « Je ne sais pas » compris\u00a0: ' +
            (restants > 1 ? 'il en reste ' + restants : 'il en reste un') +
            '.'
          )
        }
        if (etape.type === 'atelier')
          return etat.atelier ? '' : 'Envoie ton constat avant de passer à la suite.'
        if (etape.type !== 'restitution') return ''
        if (!serieOuverte[etape.type]) return ''
        const total = questions(etape.type).length
        const finies = reponsesFinies(etape.type)
        if (finies === total) return ''
        return (
          'Termine les ' +
          total +
          ' questions avant de passer à la suite\u00a0: ' +
          finies +
          ' sur\u00a0' +
          total +
          ' pour l’instant.'
        )
      }
      /** Les questions d'une série ouverte qui attendent une réponse : pas encore répondues, ou à reprendre. */
      const aPoserDans = (serie) =>
        serieOuverte[serie]
          ? questions(serie).filter((q) => !etat.envoyees[q.id] || aRefaire(serie).includes(q))
          : []
      /** La série commencée (bouton « Commencer ») qui a encore des questions à poser, s'il y en a une. */
      const serieEnCours = () =>
        ['restitution'].find((serie) => etat.enCours?.[serie] && aPoserDans(serie).length > 0)
      /**
       * Restitution sans support : de « Commencer » à la dernière réponse, tout le reste de la fiche
       * est masqué, sauf retour au cours. Le cours, mais aussi la carte, la pratique, l'atelier,
       * l'aisance et le bilan (la liste des erreurs critiques soufflerait des réponses).
       */
      const coursMasque = () => serieEnCours() !== undefined && !etat.retourCours
      /** Une étape que la série en cours masque : toutes, sauf la série elle-même. */
      const masquee = (etape) => coursMasque() && etape.type !== serieEnCours()
      /** La restitution faite (ou fermée par l'appli) : le bilan peut partir. */
      const restitutionTerminee = () =>
        !serieOuverte.restitution || reponsesFinies('restitution') === manifeste.restitution.length
      /**
       * Une erreur critique repérée attend le bilan : la restitution est faite, et le bilan ne l'a pas
       * encore reçue. Tant qu'il n'est pas envoyé, l'aisance s'arrête : sans cela, une erreur repérée qu'on ne coche jamais n'empêcherait rien (règle V01).
       */
      const bilanAttendu = () => restitutionTerminee() && (etat.aCocher ?? []).length > 0
      /** Ce qui attend le bilan : les erreurs repérées, nommées, et le chemin vers le bilan. */
      function attenteBilan(quoi) {
        const reperees = manifeste.erreurs_critiques.filter((e) =>
          (etat.aCocher ?? []).includes(e.id),
        )
        const bilan = etapes.find((e) => e.type === 'bilan')
        return [
          creer('p', {
            textContent:
              (reperees.length > 1
                ? 'Des erreurs critiques ont été repérées dans tes réponses : '
                : 'Une erreur critique a été repérée dans tes réponses : ') +
              reperees.map((e) => e.libelle).join(' ; ') +
              '. ' +
              quoi +
              ' reprend une fois ton bilan envoyé. ' +
              (reperees.length > 1
                ? 'Elles y sont cochées d’office, et chacune se referme par une réponse solide à une question qui la touche.'
                : 'L’erreur y est cochée d’office, et une réponse solide à une question qui la touche la refermera.'),
          }),
          ...(bilan
            ? [
                creer(
                  'div',
                  { className: 'actions' },
                  creer('button', {
                    type: 'button',
                    className: 'bouton',
                    textContent: 'Aller au bilan',
                    onclick: () => aller(bilan.id),
                  }),
                ),
              ]
            : []),
        ]
      }

      function creer(balise, { dataset = {}, ...proprietes } = {}, ...enfants) {
        const element = Object.assign(document.createElement(balise), proprietes)
        Object.assign(element.dataset, dataset)
        element.append(...enfants)
        return element
      }

      /**
       * L'échelle d'aide d'un exercice (règles F03 et F04), la même pour toutes les fiches : rien avant
       * une réponse fausse ; après chacune, un cran de plus s'ouvre à la demande (une question qui
       * oriente, un indice, l'étape détaillée), puis « Voir la solution ». Les crans se lisent dans
       * `data-aide1` à `data-aide3` de l'exercice, sinon dans `crans` (des textes, ou des fonctions
       * qui rendent le texte à l'ouverture) ; sans cran, la solution attend deux réponses fausses.
       * `restantes()` (un choix) : le nombre d'options encore à choisir ; « Voir la solution » ne paraît
       * pas quand il ne pourrait jamais servir (la dernière option se montre d'office). Un choix
       * (`enchaine`) n'a qu'une ou deux tentatives avant que la dernière option se montre : après la
       * première réponse fausse, ses crans s'ouvrent l'un après l'autre à la demande (l'indice, puis
       * l'étape détaillée), sans attendre une autre réponse, qui ne laisserait plus rien à choisir.
       * `toutOuvrir()` ouvre les crans qui restent, avant une solution montrée d'office.
       * `fini()` dit que l'exercice est fini, `surSolution()` montre la solution. Rend la zone à poser
       * dans l'exercice, `tentative()` à appeler à chaque réponse fausse, `cran()` (4 : solution vue)
       * et `maj()`.
       */
      function echelle(
        ex,
        {
          crans = [],
          fini = () => false,
          surSolution = () => {},
          restantes,
          enchaine = false,
        } = {},
      ) {
        const ecrits = [ex.dataset.aide1, ex.dataset.aide2, ex.dataset.aide3].filter(Boolean)
        const textes = ecrits.length > 0 ? ecrits : crans
        let cran = 0
        let depuis = 0
        let total = 0
        let vue = false
        const liste = creer('ol', { className: 'crans' })
        const bouton = creer('button', { type: 'button', className: 'bouton secondaire petit' })
        const zone = creer('div', { className: 'pouce' }, bouton, liste)
        function maj() {
          const reste = cran < textes.length
          bouton.textContent = reste
            ? cran === 0
              ? 'Un coup de pouce'
              : 'Un autre coup de pouce'
            : 'Voir la solution'
          const seuil = !reste && textes.length === 0 ? 2 : 1
          // Un choix (`restantes`) : chaque réponse fausse retire une option, et la dernière qui reste
          // se montre d'office. « Voir la solution » ne sert que s'il reste au moins deux options quand
          // il s'ouvre ; sinon il ne paraît pas, plutôt que de rester grisé.
          const inutile =
            !reste &&
            typeof restantes === 'function' &&
            restantes() - Math.max(0, seuil - depuis) < 2
          // Une fois l'exercice fini, le bouton s'en va ; les crans déjà ouverts restent lisibles.
          zone.hidden = total === 0 || ((fini() || inutile) && liste.children.length === 0)
          bouton.hidden = vue || fini() || inutile
          bouton.disabled = depuis < seuil
        }
        bouton.addEventListener('click', () => {
          if (fini() || vue) return
          if (cran < textes.length) {
            const texte = textes[cran]
            liste.append(
              creer('li', { textContent: typeof texte === 'function' ? texte() : String(texte) }),
            )
            cran += 1
            if (!enchaine) depuis = 0
            maj()
            return
          }
          vue = true
          maj()
          surSolution()
        })
        maj()
        return {
          zone,
          tentative() {
            depuis += 1
            total += 1
            maj()
          },
          cran: () => (vue ? 4 : cran),
          toutOuvrir() {
            if (vue) return
            for (; cran < textes.length; cran += 1) {
              const texte = textes[cran]
              liste.append(
                creer('li', { textContent: typeof texte === 'function' ? texte() : String(texte) }),
              )
            }
            maj()
          },
          maj,
        }
      }
      /**
       * Le schéma du bloc, construit pour un cas nouveau (règle C08), le même pour toutes les fiches :
       * l'apprenant fait tourner le système sur ce cas, avec ses mots. Le départ est dans l'exercice
       * (`ol.depart`, caché) : des `li.boite` et des `li.fleche` dans l'ordre ; une boîte `data-pose`
       * est donnée (la première, remplie des données du cas en mots, et la dernière, posée sans sa
       * valeur) ; les autres `li` portent une question qui aide sans donner le terme. L'apprenant
       * remplit les cases, en ajoute ou en retire. `data-cas` dit la chaîne juste pour ce cas, pour le
       * correcteur. Le schéma du cours est dans l'exercice, caché (`.modele`) : des `.boite` et des
       * `.fleche` dans une `.chaine`, et peut-être des `.lecture` (ce que donne chaque règle) ; avec
       * des lectures, un champ demande de les écrire aussi (sa question : `data-regles`). Il ne sert qu'à comparer : le correcteur
       * juge la chaîne pour le cas, pas la ressemblance. Sans départ, deux boîtes vides. Rend la
       * saisie que `fiche:expliquer` pose à la place de son champ (`element`, `lire`, `manque`),
       * l'attendu pour le correcteur, la question qui se comprend sans l'écran, `montrer()` qui
       * dévoile le modèle et `bloquer()`.
       */
      function schema(ex) {
        const modele = ex.querySelector(':scope > .modele')
        const depart = ex.querySelector(':scope > .depart')
        const morceaux = modele ? [...modele.querySelectorAll(':scope .chaine > *')] : []
        const enTexte = (noeud) => noeud.textContent.replace(/\s+/g, ' ').trim()
        const ecrire = (boites, fleches) =>
          boites
            .map(
              (boite, i) =>
                '[' + boite + ']' + (i < fleches.length ? ' —' + fleches[i] + '→ ' : ''),
            )
            .join('')
        const boitesModele = morceaux.filter((m) => m.classList.contains('boite')).map(enTexte)
        const flechesModele = morceaux.filter((m) => m.classList.contains('fleche')).map(enTexte)
        const lectures = modele ? [...modele.querySelectorAll('.lecture')].map(enTexte) : []
        const cours =
          ecrire(boitesModele, flechesModele) +
          (lectures.length ? '. Les règles\u00a0: ' + lectures.join('\u00a0; ') : '') +
          '.'
        const cas = (ex.dataset.cas ?? '').trim()
        const attendu = cas ? cas + ' Le schéma du cours, pour comparer\u00a0: ' + cours : cours
        const pieces = depart
          ? [...depart.querySelectorAll(':scope > li')].map((li) => ({
              type: li.classList.contains('fleche') ? 'fleche' : 'boite',
              pose: li.hasAttribute('data-pose'),
              texte: enTexte(li),
              champ: li.dataset.champ ?? '',
            }))
          : [
              { type: 'boite', pose: false, texte: '' },
              { type: 'fleche', pose: false, texte: '' },
              { type: 'boite', pose: false, texte: '' },
            ]
        const posees = pieces.filter((p) => p.pose).map((p) => '« ' + p.texte + ' »')
        const consigne = ex.querySelector(':scope > .q')
        const question =
          (cas && consigne
            ? 'L’apprenant construit le schéma du bloc pour un cas nouveau, avec ses mots\u00a0: ' +
              enTexte(consigne) +
              (posees.length
                ? ' Ces boîtes lui sont données\u00a0: ' + posees.join(', ') + '.'
                : '')
            : 'L’apprenant construit le schéma du bloc, avec ses mots\u00a0: ses boîtes, et sur chaque flèche ce qu’elle fait.') +
          ' Il l’écrit [boîte] —flèche→ [boîte], dans l’ordre' +
          (lectures.length ? ', puis les règles qu’il connaît et ce que chacune donne' : '') +
          '. Le schéma est juste s’il enchaîne correctement les étapes du fonctionnement pour ce cas, avec ses mots\u00a0; le nombre de boîtes et les mots peuvent différer du schéma du cours. Une étape qui manque ou une relation fausse est une erreur.'
        const chaine = creer('ol', { className: 'schema-chaine' })
        const fin = pieces.length > 0 && pieces[pieces.length - 1].pose
        const boutonAjouter = creer('button', {
          type: 'button',
          className: 'bouton secondaire petit',
          textContent: fin
            ? 'Ajouter une boîte avant la dernière'
            : 'Ajouter une flèche et une boîte',
        })
        const regles = lectures.length
          ? creer('textarea', { rows: 3, id: 'schema-regles-' + (ex.dataset.id ?? '') })
          : null
        const element = creer(
          'div',
          { className: 'schema-libre' },
          chaine,
          creer('div', { className: 'actions' }, boutonAjouter),
          ...(regles
            ? [
                creer('label', {
                  htmlFor: regles.id,
                  textContent:
                    ex.dataset.regles ||
                    'Les règles que tu connais, et ce que chacune donne\u00a0:',
                }),
                regles,
              ]
            : []),
        )
        const champs = () => [...chaine.querySelectorAll('input')]
        let numero = 0
        const boites = () => [...chaine.querySelectorAll(':scope > .schema-boite')]
        /** Une case : posée (son texte), ou à écrire, sous la question qui aide. */
        function piece({ type, pose, texte, champ = '' }) {
          const li = creer('li', { className: 'schema-' + type + (pose ? ' schema-pose' : '') })
          numero += 1
          const entree = creer('input', {
            type: 'text',
            autocomplete: 'off',
            spellcheck: false,
            id: 'schema-' + (ex.dataset.id ?? '') + '-' + numero,
          })
          if (pose) {
            // Posée : son texte ; avec `data-champ`, un champ pour sa valeur, sous la question.
            li.append(creer('span', { className: 'schema-donne', textContent: texte }))
            if (champ) li.append(creer('label', { htmlFor: entree.id, textContent: champ }), entree)
            return li
          }
          if (texte) {
            li.append(creer('label', { htmlFor: entree.id, textContent: texte }))
          } else {
            entree.setAttribute(
              'aria-label',
              type === 'boite' ? 'Une boîte' : 'Une flèche\u00a0: ce qu’elle fait',
            )
            entree.placeholder = type === 'boite' ? 'une boîte' : 'ce que fait la flèche'
          }
          li.append(entree)
          if (type === 'boite') {
            const retirer = creer('button', {
              type: 'button',
              className: 'bouton secondaire petit schema-retirer',
              textContent: 'Retirer',
            })
            retirer.setAttribute('aria-label', 'Retirer cette boîte et sa flèche')
            retirer.addEventListener('click', () => {
              if (boites().length <= 2) return
              // La flèche qui y mène part avec elle ; pour la première boîte, celle qui en part.
              const fleche =
                li.previousElementSibling?.classList.contains('schema-fleche') === true
                  ? li.previousElementSibling
                  : li.nextElementSibling
              fleche?.remove()
              li.remove()
              majBoutons()
            })
            li.append(retirer)
          }
          return li
        }
        function majBoutons() {
          const seules = boites().length <= 2
          for (const b of chaine.querySelectorAll('.schema-retirer')) b.hidden = seules
        }
        for (const p of pieces) chaine.append(piece(p))
        majBoutons()
        boutonAjouter.addEventListener('click', () => {
          const fleche = piece({ type: 'fleche', pose: false, texte: '' })
          const boite = piece({ type: 'boite', pose: false, texte: '' })
          // Avant la dernière flèche quand la dernière boîte est posée ; sinon, au bout.
          const derniereFleche = fin
            ? [...chaine.querySelectorAll(':scope > .schema-fleche')].pop()
            : null
          if (derniereFleche) derniereFleche.before(fleche, boite)
          else chaine.append(fleche, boite)
          boite.querySelector('input')?.focus()
          majBoutons()
        })
        const valeurs = (type) =>
          [...chaine.querySelectorAll(':scope > .schema-' + type)].map((li) => {
            const valeur = (li.querySelector('input')?.value ?? '').trim()
            if (!li.classList.contains('schema-pose')) return valeur
            const donne = enTexte(li.querySelector('.schema-donne'))
            return li.querySelector('input') ? donne + '\u00a0: ' + valeur : donne
          })
        return {
          saisie: {
            element,
            lire: () =>
              ecrire(valeurs('boite'), valeurs('fleche')) +
              (regles && regles.value.trim() ? '. Les règles\u00a0: ' + regles.value.trim() : ''),
            manque: () =>
              champs().some((i) => i.value.trim() === '')
                ? 'Écris chaque boîte et chaque flèche, ou retire celles qui sont en trop.'
                : '',
          },
          attendu,
          question,
          montrer() {
            if (!modele) return
            // Le modèle vient en dernier, après le schéma de l'apprenant et sa correction.
            ex.append(modele)
            modele.hidden = false
          },
          bloquer() {
            for (const champ of element.querySelectorAll('input, textarea, button'))
              champ.disabled = true
          },
        }
      }
      // Ce que le gabarit prête aux outils des fiches.
      window.JanusGabarit = Object.freeze({ echelle, schema })

      /**
       * Le pied d'une étape : le bouton vers l'étape d'après. Tant qu'une série ouverte n'a pas toutes
       * ses réponses, il reste inactif et dit ce qui manque.
       */
      function piedEtape(etape, libelle = 'Étape suivante', zone = null) {
        const suivante = etapes[etapes.findIndex((e) => e.id === etape.id) + 1]
        if (!suivante) return []
        const bouton = creer('button', {
          type: 'button',
          className: 'bouton',
          textContent: libelle,
        })
        const raison = creer('p', { className: 'discret' })
        const restant = () => resteAFaire(etape) || (zone ? exercicesRestants(etape, zone) : '')
        bouton.addEventListener('click', () => {
          if (restant() === '') aller(suivante.id)
        })
        majPied = () => {
          const reste = restant()
          bouton.disabled = reste !== ''
          raison.textContent = reste
          raison.hidden = reste === ''
        }
        majPied()
        return [creer('div', { className: 'ecran-nav pied' }, bouton), raison]
      }

      /**
       * Le fil d'étapes de l'aperçu : même forme que celui de l'appli (onglets, ou liste repliable en
       * étroit). Les étapes qui se suivent dans un même moment du cycle font un groupe, sous le nom du
       * moment ; le moment de l'étape courante est marqué.
       */
      function afficherEtapes() {
        const trouvee = etapes.findIndex((etape) => etape.id === etat.etape)
        const courant = trouvee < 0 ? 0 : trouvee
        const fil = $('fil')
        const bascule = $('bascule')
        bascule.replaceChildren(
          creer('span', {
            textContent: momentDe(etapes[courant]).nom + ' · ' + etapes[courant].titre,
          }),
          creer('span', { textContent: fil.dataset.ouvert === 'true' ? '▴' : '▾' }),
        )
        bascule.lastChild.setAttribute('aria-hidden', 'true')
        bascule.setAttribute('aria-expanded', fil.dataset.ouvert)
        bascule.onclick = () => {
          fil.dataset.ouvert = String(fil.dataset.ouvert !== 'true')
          afficherEtapes()
        }
        const groupes = []
        etapes.forEach((etape, k) => {
          const moment = momentDe(etape)
          const dernier = groupes[groupes.length - 1]
          if (dernier && dernier.moment === moment) dernier.etapes.push([etape, k])
          else groupes.push({ moment, etapes: [[etape, k]] })
        })
        $('etapes').replaceChildren(
          ...groupes.map((groupe) =>
            creer(
              'li',
              {
                className: 'moment',
                dataset: { courant: groupe.etapes.some(([, k]) => k === courant) ? 'oui' : 'non' },
              },
              creer('span', { className: 'moment-nom', textContent: groupe.moment.nom }),
              creer(
                'ol',
                {},
                ...groupe.etapes.map(([etape, k]) => {
                  const onglet = creer('button', {
                    type: 'button',
                    className: 'onglet',
                    textContent: etape.titre,
                  })
                  if (k === courant) onglet.setAttribute('aria-current', 'step')
                  onglet.addEventListener('click', () => {
                    fil.dataset.ouvert = 'false'
                    aller(etape.id)
                  })
                  return creer('li', {}, onglet)
                }),
              ),
            ),
          ),
        )
      }

      /** L'objectif d'examen, replié : ce que l'épreuve vérifiera, à ouvrir quand on veut le relire. */
      function objectifReplie() {
        // Un objectif qui aligne plusieurs attendus, séparés par « ; », se lit en puces.
        const attendus = String(manifeste.objectif)
          .split(/\s*;\s+/)
          .map((a) => a.trim())
          .filter(Boolean)
        const corps =
          attendus.length >= 3
            ? creer(
                'ul',
                { className: 'objectif-liste' },
                ...attendus.map((a) =>
                  creer('li', { textContent: a[0].toUpperCase() + a.slice(1) }),
                ),
              )
            : creer('p', { textContent: manifeste.objectif })
        return creer(
          'details',
          { className: 'objectif' },
          creer('summary', { textContent: 'Ce qui sera vérifié' }),
          corps,
        )
      }

      /**
       * La carte : d'abord son `<template data-etape>` (où tu es, à quoi ça sert, ce que tu sauras
       * faire), lisible avec « Écouter », puis l'objectif d'examen replié, puis le bouton vers l'étape
       * d'après (Commencer quand la carte ouvre la fiche). Elle n'est pas forcément la première étape :
       * une perception peut la précéder. Sans template (les fiches d'avant) : l'objectif, puis la liste
       * des étapes. `contexte_ia` est destiné au correcteur : il n'est jamais affiché.
       */
      function afficherCarte(carte) {
        const section = creer('section', {}, creer('h2', { textContent: carte.titre }))
        const modele = document.querySelector('template[data-etape="' + carte.id + '"]')
        if (modele) {
          const { ecran, lu } = ecranUnique(modele)
          section.append(barreEcoute(lu), ecran, objectifReplie())
          activerLiens(section)
        } else
          section.append(
            creer('p', { textContent: manifeste.objectif }),
            creer(
              'ul',
              { className: 'plain' },
              ...etapes.map((etape) => creer('li', { textContent: etape.titre })),
            ),
          )
        section.append(
          ...piedEtape(carte, carte.id === etapes[0].id ? 'Commencer' : 'Étape suivante'),
        )
        return section
      }

      /**
       * Les voix françaises, de la meilleure à la moins bonne : Charline (Edge) d'abord, puis les voix
       * naturelles. À rang égal, une voix de France passe avant une voix de Belgique ou du Canada.
       */
      const PREFERENCES_VOIX = [
        /charline/i,
        /denise|vivienne|eloise/i,
        /natural|neural|online|enhanced|premium|améliorée/i,
        /google/i,
      ]
      function rangVoix(voix) {
        const rang = PREFERENCES_VOIX.findIndex((motif) => motif.test(voix.name))
        const france = voix.lang.toLowerCase().replace('_', '-').startsWith('fr-fr')
        return (rang < 0 ? PREFERENCES_VOIX.length : rang) * 2 + (france ? 0 : 1)
      }
      function meilleureVoix(voix) {
        return voix
          .filter((v) => v.lang.toLowerCase().startsWith('fr'))
          .sort((a, b) => rangVoix(a) - rangVoix(b))[0]
      }
      /** Les voix du navigateur : Chrome ne les donne qu'après un premier appel, d'où l'attente. */
      function voixDuNavigateur() {
        const synthese = window.speechSynthesis
        const voix = synthese.getVoices()
        if (voix.length > 0) return Promise.resolve(voix)
        return new Promise((resoudre) => {
          const fin = () => resoudre(synthese.getVoices())
          synthese.addEventListener('voiceschanged', fin, { once: true })
          setTimeout(fin, 1500)
        })
      }
      /*
       * Ce qu'« Écouter » lit dans un écran : ce que l'apprenant voit, dans l'ordre, et rien d'autre.
       * - Sauté : ce qui n'est pas encore dévoilé ([hidden], [data-attente]), les champs et les boutons
       *   (sauf les options d'un choix), ce qu'un outil ajoute pour manipuler ou après une réponse
       *   (.saisie, .retour, .actions, .echelle…), et le niveau d'aide d'un item.
       * - `data-lecture` sur un élément : lu à sa place (vide : silence voulu) ; sur l'écran : tout.
       * - Un dessin ou un groupe de lampes (role="img" ou "group" avec aria-label) se lit par sa description.
       * - Une table, un outil, un schéma, une figure (RESUMES) se lisent par leur `data-lecture`, une phrase
       *   écrite par la fiche, sinon par leur titre ; s'il reste du texte, l'élément est signalé dans
       *   `nonLus` : le contrôle de lecture des fiches le refuse.
       */
      const BALISES_MUETTES = new Set([
        'INPUT',
        'SELECT',
        'TEXTAREA',
        'TEMPLATE',
        'SCRIPT',
        'STYLE',
        'SVG',
        'CANVAS',
      ])
      const CLASSES_MUETTES = [
        'saisie',
        'retour',
        'actions',
        'expliquer',
        'refaire',
        'echelle',
        'aide',
        'ecran-barre',
        'ecran-nav',
        'ecran-progres',
      ]
      const RESUMES = 'table, .outil, .defile, figure, .schema-bloc, .hexa-table, .lampes, .octets'
      const EN_LIGNE =
        /^(P|H[1-6]|LI|DT|DD|LABEL|LEGEND|SUMMARY|SPAN|EM|STRONG|CODE|B|I|SMALL|A|SUP|SUB|Q|CITE|ABBR)$/
      const nettoyerTexte = (s) => s.replace(/\s+/g, ' ').trim()
      function muet(n) {
        if (BALISES_MUETTES.has(n.tagName)) return true
        if (n.tagName === 'BUTTON' && !n.parentElement?.hasAttribute('data-option')) return true
        if (n.hidden || n.hasAttribute('data-attente') || n.getAttribute('aria-hidden') === 'true')
          return true
        return CLASSES_MUETTES.some((c) => n.classList.contains(c))
      }
      function lireNoeud(n, morceaux, nonLus) {
        if (n.nodeType === Node.TEXT_NODE) {
          const t = nettoyerTexte(n.textContent)
          if (t) morceaux.push(t)
          return
        }
        if (n.nodeType !== Node.ELEMENT_NODE || muet(n)) return
        if (n.dataset.lecture !== undefined) {
          if (n.dataset.lecture) morceaux.push(n.dataset.lecture)
          return
        }
        const role = n.getAttribute('role')
        if (role === 'img' || (role === 'group' && n.hasAttribute('aria-label'))) {
          const description = n.getAttribute('aria-label')
          if (description) morceaux.push(description)
          else nonLus.push(n)
          return
        }
        if (n.matches(RESUMES)) {
          const titre = n.querySelector(
            ':scope > .outil-titre, :scope > caption, :scope > figcaption',
          )
          const lu = titre ? nettoyerTexte(titre.textContent) : ''
          if (lu) morceaux.push(lu)
          if (nettoyerTexte(n.textContent).length > lu.length) nonLus.push(n)
          return
        }
        // Un élément en ligne se lit d'un bloc, pour garder ses espaces ; un bloc, enfant par enfant.
        if (
          EN_LIGNE.test(n.tagName) &&
          !n.querySelector('[hidden], [data-attente], button, input, [role], [data-lecture]')
        ) {
          const t = nettoyerTexte(n.textContent)
          if (t) morceaux.push(t)
          return
        }
        for (const e of n.childNodes) lireNoeud(e, morceaux, nonLus)
      }
      /** Le texte lu dans `ecran` ; `nonLus` reçoit ce qui reste visible sans être lu. */
      function texteLu(ecran, nonLus = []) {
        if (ecran.dataset.lecture !== undefined) return ecran.dataset.lecture
        const morceaux = []
        for (const e of ecran.childNodes) lireNoeud(e, morceaux, nonLus)
        // Une ponctuation entre deux morceaux, pour que la voix marque la pause.
        return morceaux.map((m) => (/[.!?:;…»]$/.test(m) ? m : m + '.')).join(' ')
      }
      // Le contrôle de lecture des fiches (apps/web) applique la même règle aux pages du dépôt.
      window.JanusLecture = { texteLu }
      /**
       * Le bouton « Écouter » : la synthèse vocale lit l'écran que donne `source` (une fonction : l'écran
       * courant d'une étape à plusieurs écrans, ou le seul écran). `arreter` coupe la lecture.
       */
      function boutonEcouter(source) {
        const ecouter = creer('button', {
          type: 'button',
          className: 'bouton secondaire ecouter',
          textContent: 'Écouter',
        })
        ecouter.dataset.actif = 'non'
        const arreter = () => {
          window.speechSynthesis?.cancel()
          ecouter.textContent = 'Écouter'
          ecouter.dataset.actif = 'non'
        }
        const lire = (voix) => {
          const parole = new SpeechSynthesisUtterance(texteLu(source()))
          const choisie = meilleureVoix(voix)
          parole.lang = choisie?.lang ?? 'fr-FR'
          if (choisie) parole.voice = choisie
          parole.onend = arreter
          parole.onerror = arreter
          window.speechSynthesis.speak(parole)
        }
        ecouter.addEventListener('click', () => {
          if (!window.speechSynthesis) return void (ecouter.textContent = 'Lecture indisponible')
          if (ecouter.dataset.actif === 'oui') return arreter()
          ecouter.dataset.actif = 'oui'
          ecouter.textContent = 'Arrêter'
          // Lire tout de suite si les voix sont là (Safari exige le geste) ; sinon les attendre (Chrome).
          const voix = window.speechSynthesis.getVoices()
          if (voix.length > 0) lire(voix)
          else
            void voixDuNavigateur().then((chargees) => {
              if (ecouter.dataset.actif === 'oui') lire(chargees)
            })
        })
        return { ecouter, arreter }
      }
      /** La barre d'un écran seul : rien que « Écouter », qui lit `lu`. */
      const barreEcoute = (lu) =>
        creer('div', { className: 'ecran-barre' }, boutonEcouter(() => lu).ecouter)
      /**
       * Un template qui tient en un écran : son contenu d'un bloc (`ecran`), et ce qu'« Écouter » lit
       * (`lu`) : le seul `[data-ecran]` s'il y en a un, sinon le bloc entier ; `data-lecture` posé sur le
       * `<template>` l'emporte.
       */
      function ecranUnique(modele) {
        const contenu = modele.content.cloneNode(true)
        const marque = Array.from(contenu.children).find((n) => n.hasAttribute('data-ecran'))
        const ecran = creer('div', { className: 'ecran' }, contenu)
        if (modele.dataset.lecture !== undefined) ecran.dataset.lecture = modele.dataset.lecture
        return { ecran, lu: ecran.dataset.lecture !== undefined ? ecran : (marque ?? ecran) }
      }

      /**
       * Dans une étape `pretest`, un écran ne se quitte pas en avant tant qu'un de ses essais reste sans
       * réponse (règle C03) : la tentative précède l'explication, « Je ne sais pas » compris.
       */
      function essaisRestants(etape, ecran) {
        if (etape.type !== 'pretest') return ''
        const restants = Array.from(ecran.querySelectorAll('[data-essai][data-id]')).filter(
          (ex) => !etat.traces?.['essai:' + ex.dataset.id],
        ).length
        if (restants === 0) return ''
        return (
          'Réponds à chaque essai de cet écran avant de passer à la suite, « Je ne sais pas » compris\u00a0: ' +
          (restants > 1 ? 'il en reste ' + restants : 'il en reste un') +
          '.'
        )
      }

      /**
       * Hors de la tentative et de la pratique, un écran ne se quitte pas en avant tant qu'un exercice
       * du cours qu'il montre n'est pas fini (décision d'Amine du 25 octobre 2026, pour tous les blocs) :
       * réussi, ou sa solution vue au bout de l'échelle d'aide. L'outil de la fiche marque l'exercice
       * fini par `data-fini="oui"` ; un exercice encore caché (suite d'écran, encadré d'essai) attend.
       * Après une solution vue, `data-reprise="oui"` le garde à faire tant qu'il n'est pas refait sur un
       * autre cas, ou expliqué : l'écran l'annonce (« Pour continuer, refais-le… »).
       */
      function exercicesRestants(etape, zone) {
        if (etape.type === 'pretest' || etape.type === 'pratique') return ''
        const restants = Array.from(zone.querySelectorAll('.ex[data-id]')).filter(
          (ex) =>
            !('essai' in ex.dataset) &&
            !ex.closest('.item') &&
            !ex.closest('[hidden]') &&
            // Solution vue : il reste à refaire sur un autre cas, ou à expliquer (`data-reprise`).
            (ex.dataset.fini !== 'oui' || ex.dataset.reprise === 'oui'),
        ).length
        if (restants === 0) return ''
        return (
          'Termine les exercices de cet écran avant de passer à la suite\u00a0: ' +
          (restants > 1 ? 'il en reste ' + restants : 'il en reste un') +
          '.'
        )
      }
      /**
       * Le pied se remet à jour quand un exercice finit ou qu'une suite d'écran paraît. Seuls les
       * changements dans un écran comptent : le pied lui-même (sa raison cachée ou montrée) relancerait
       * l'observateur sans fin.
       */
      function suivreExercices(racine) {
        new MutationObserver((changements) => {
          if (changements.some(({ target }) => target.closest?.('.ecran'))) majPied()
        }).observe(racine, {
          subtree: true,
          attributes: true,
          attributeFilter: ['data-fini', 'data-reprise', 'hidden'],
        })
      }

      /**
       * Le contenu libre d'une étape : le `<template data-etape="ETx">` de la page, cloné tel quel.
       * Tout ce qui est dans le gabarit (pont, masquage du cours, confiance, aide, messages) est fixe ;
       * ce que dit le bloc et comment il le dit ne l'est pas.
       */
      function afficherLibre(etape) {
        const modele = document.querySelector('template[data-etape="' + etape.id + '"]')
        const section = creer('section', {}, creer('h2', { textContent: etape.titre }))
        if (etape.type === 'pretest') majEssais = () => essaisDe(section)
        // L'atelier finit sur son constat : ce que l'apprenant a fait hors de la page.
        const constat = etape.type === 'atelier' ? constatAtelier(section) : null
        if (!modele) {
          section.append(
            creer('p', { className: 'discret', textContent: 'Rien à lire dans cette étape.' }),
            ...(constat ? [constat, ...piedEtape(etape)] : []),
          )
          return section
        }
        const contenu = modele.content.cloneNode(true)
        const ecrans = Array.from(contenu.children).filter((n) => n.hasAttribute('data-ecran'))
        if (ecrans.length < 2) {
          // Un seul écran : tout le template d'un bloc, avec « Écouter ».
          const { ecran, lu } = ecranUnique(modele)
          if (constat) (ecran.querySelector('[data-ecran]') ?? ecran).append(constat)
          section.append(barreEcoute(lu), ecran)
          activerLiens(section)
          section.append(...piedEtape(etape, 'Étape suivante', ecran))
          suivreExercices(ecran)
          return section
        }
        // Plusieurs écrans : un seul visible à la fois, les autres restent dans la page (outils déjà montés).
        if (constat) ecrans[ecrans.length - 1].append(constat)
        const suivante = etapes[etapes.findIndex((e) => e.id === etape.id) + 1]
        const titre = creer('p', { className: 'ecran-titre' })
        const compte = creer('span', { className: 'ecran-compte' })
        const remplissage = creer('span')
        const progres = creer('div', { className: 'ecran-progres' }, remplissage)
        progres.setAttribute('aria-hidden', 'true')
        const precedent = creer('button', {
          type: 'button',
          className: 'bouton secondaire',
          textContent: 'Retour',
        })
        const avancer = creer('button', { type: 'button', className: 'bouton' })
        let courant = Math.min(etat.ecrans?.[etape.id] ?? 0, ecrans.length - 1)
        const { ecouter, arreter } = boutonEcouter(() => ecrans[courant])
        const montrer = (k) => {
          arreter()
          courant = k
          etat.ecrans = { ...(etat.ecrans ?? {}), [etape.id]: k }
          enregistrer({ regrouper: true })
          ecrans.forEach((e, j) => {
            e.hidden = j !== k
          })
          titre.textContent = ecrans[k].dataset.ecran
          compte.textContent = k + 1 + ' / ' + ecrans.length
          remplissage.style.width = ((k + 1) / ecrans.length) * 100 + '%'
          precedent.disabled = k === 0
          avancer.textContent =
            k < ecrans.length - 1 ? 'Suivant' : suivante ? 'Étape suivante' : 'Terminé'
          majPied()
        }
        // Le dernier écran mène à l'étape suivante quand rien ne reste à faire (la tentative finie).
        const raison = creer('p', { className: 'discret', hidden: true })
        majPied = () => {
          const dernier = courant === ecrans.length - 1
          const reste =
            (dernier ? resteAFaire(etape) : essaisRestants(etape, ecrans[courant])) ||
            exercicesRestants(etape, ecrans[courant])
          avancer.disabled = dernier ? !suivante || reste !== '' : reste !== ''
          raison.textContent = reste
          raison.hidden = reste === ''
        }
        precedent.addEventListener('click', () => {
          montrer(courant - 1)
          remonter(section)
        })
        avancer.addEventListener('click', () => {
          if (courant < ecrans.length - 1) {
            if (essaisRestants(etape, ecrans[courant]) !== '') return
            if (exercicesRestants(etape, ecrans[courant]) !== '') return
            montrer(courant + 1)
            remonter(section)
          } else if (
            suivante &&
            resteAFaire(etape) === '' &&
            exercicesRestants(etape, ecrans[courant]) === ''
          )
            aller(suivante.id)
        })
        for (const e of ecrans) e.classList.add('ecran')
        section.append(
          creer('div', { className: 'ecran-barre' }, titre, ecouter, compte),
          progres,
          ...ecrans,
          creer('div', { className: 'ecran-nav' }, precedent, avancer),
          raison,
        )
        activerLiens(section)
        suivreExercices(section)
        montrer(courant)
        return section
      }

      /**
       * Un lien externe : `<a data-lien="https://…">texte</a>`. Dans l'appli, c'est elle qui ouvre
       * l'adresse (message du pont) ; hors de l'appli, la page l'ouvre. L'adresse reste écrite à côté,
       * au cas où le navigateur bloquerait l'ouverture.
       */
      function activerLiens(racine) {
        for (const lien of racine.querySelectorAll('a[data-lien]')) {
          const url = lien.dataset.lien
          lien.setAttribute('href', url)
          lien.addEventListener('click', (evenement) => {
            evenement.preventDefault()
            if (mode === 'appli') pont.envoyer('lien.ouvrir', { url })
            else window.open(url, '_blank', 'noopener,noreferrer')
          })
          lien.after(creer('span', { className: 'discret', textContent: ' (' + url + ')' }))
        }
      }

      function afficherPratique() {
        const liste = manifeste.pratique.flatMap((exercice) =>
          exercice.items.map((item, rang) => ({ exercice, item, rang })),
        )
        const reussi = (entree) => itemReussi(entree.item.id)
        const premierRestant = liste.findIndex((entree) => !reussi(entree))
        const index = Math.min(
          Math.max(etat.itemCourant ?? (premierRestant < 0 ? 0 : premierRestant), 0),
          liste.length - 1,
        )
        const { exercice, item } = liste[index]
        let aide = 0
        const etape = etapes.find((e) => e.type === 'pratique')
        const aller_a = (k) => {
          etat.itemCourant = Math.min(Math.max(k, 0), liste.length - 1)
          enregistrer({ regrouper: true })
          afficher()
          remonter($('contenu'))
        }
        const points = creer(
          'div',
          { className: 'points', role: 'group' },
          ...liste.map((entree, k) => {
            const p = creer('button', {
              type: 'button',
              className: 'point',
              textContent: String(k + 1),
            })
            if (k === index) p.setAttribute('aria-current', 'step')
            p.addEventListener('click', () => aller_a(k))
            return p
          }),
        )
        // L'énoncé de l'item : <template data-item="PR1-1"> dans la page.
        const enonce = document.querySelector('template[data-item="' + item.id + '"]')
        // Un outil marqué data-verifie contrôle la réponse : c'est lui qui dit si l'item est réussi.
        const verifie = Boolean(enonce?.content.querySelector('[data-verifie]'))
        const consigne = creer('div', { className: 'enonce' })
        if (enonce) consigne.append(enonce.content.cloneNode(true))
        activerLiens(consigne)
        const compteur = creer('p', { className: 'discret' })
        const etatItem = creer('span', { className: 'item-etat' })
        const resultat = creer('p', { className: 'discret' })
        // Vers l'item qui débloque celui-ci : un autre item à réussir, ou un relais.
        const debloquer = creer('button', {
          type: 'button',
          className: 'bouton secondaire',
          hidden: true,
        })
        /**
         * Note un résultat avec l'aide de cet essai seul : la règle du moteur y ajoute l'aide que
         * l'item garde (`aideGardee`), ici comme sur le serveur. `vue` : l'outil vient de montrer la
         * solution (aide 4). Le cas vient de l'outil (`data-cas` sur la boîte), quand il en a un.
         */
        const noter = (ok, aideUtilisee, vue = false) => {
          const cas = CAS.includes(boite.dataset.cas) ? boite.dataset.cas : null
          const aideBrute = Math.max(aideUtilisee, vue ? 4 : 0)
          const id = pont.envoyer('pratique.resultat', {
            exercice: exercice.id,
            item: item.id,
            reussi: ok,
            aide: aideBrute,
            essais: itemPratique(item.id).essais + 1,
            ...(cas === null ? {} : { cas }),
          })
          if (id === null) return
          const resultat = {
            id,
            item: item.id,
            reussi: ok,
            aide: aideBrute,
            brute: true,
            jour: jourPratique(),
            cas,
          }
          if (pratiqueServeur !== null) essaisEnAttente.push(resultat)
          else {
            pratiqueLocale().resultats.push(resultat)
            enregistrer()
          }
        }
        const envoyer = (ok) => {
          noter(ok, aide)
          const suivant = liste.findIndex((entree, k) => k > index && !reussi(entree))
          if (ok && suivant >= 0) {
            etat.itemCourant = suivant
            enregistrer()
          }
          afficher()
          if (ok && suivant >= 0) remonter($('contenu'))
        }
        const jaiReussi = creer('button', {
          type: 'button',
          className: 'bouton',
          textContent: 'J’ai réussi',
          onclick: () => envoyer(true),
        })
        const pasReussi = creer('button', {
          type: 'button',
          className: 'bouton secondaire',
          textContent: 'Pas réussi',
          onclick: () => envoyer(false),
        })
        const attente = creer('p', {
          className: 'discret',
          textContent:
            'Réponds d’abord à la question de l’item : « J’ai réussi » attend ta réponse.',
          hidden: true,
        })
        const aides = [1, 2, 3, 4].map((cran) => {
          const b = creer('button', {
            type: 'button',
            className: 'bouton secondaire',
            textContent: 'Aide ' + cran,
          })
          b.setAttribute('aria-pressed', 'false')
          b.addEventListener('click', () => {
            aide = aide === cran ? 0 : cran
            aides.forEach((autre, k) => autre.setAttribute('aria-pressed', String(aide === k + 1)))
          })
          return b
        })
        // Après une solution montrée, ou quand l'item se refait, l'outil de la fiche le lit
        // (`data-solution-vue` sur la boîte de l'item) : il ne remontre pas la réponse, et le cas à
        // montrer lui vient de `detail.pratique` (`cas`). `data-item` nomme l'item : l'outil le donne
        // quand il repère une erreur (`fiche:erreur`).
        const boite = creer(
          'div',
          {
            className: 'item',
            dataset: {
              item: item.id,
              ...(itemPratique(item.id).marque ? { solutionVue: '' } : {}),
            },
          },
          creer(
            'div',
            { className: 'item-tete' },
            creer('span', { className: 'item-num', textContent: String(index + 1) }),
            creer('strong', { textContent: exercice.titre }),
            etatItem,
          ),
          consigne,
          creer(
            'details',
            { className: 'aide' },
            creer('summary', { textContent: 'J’ai eu besoin d’aide' }),
            creer('p', {
              className: 'discret',
              textContent:
                'Niveau d’aide utilisé\u00a0: 1 = une question qui t’oriente, 2 = un indice, 3 = l’étape détaillée, 4 = la solution complète.',
            }),
            creer('div', { className: 'actions' }, ...aides),
          ),
          // Ce que la page ne voit pas (une manipulation ailleurs), l'apprenant le déclare.
          ...(verifie
            ? []
            : [creer('div', { className: 'actions' }, jaiReussi, pasReussi), attente]),
          resultat,
          debloquer,
        )
        // Un item déclaré peut contenir une question que l'outil vérifie (une prédiction avant la
        // console) : « J'ai réussi » attend qu'elle ait sa réponse, sinon l'item réussirait sans elle.
        const questionsEnAttente = () =>
          Array.from(consigne.querySelectorAll('.ex[data-widget]')).filter(
            (ex) => ex.dataset.fini !== 'oui',
          ).length
        const majDeclaration = () => {
          const reste = questionsEnAttente()
          jaiReussi.disabled = reste > 0
          attente.hidden = reste === 0
        }
        if (!verifie) {
          majDeclaration()
          new MutationObserver(majDeclaration).observe(consigne, {
            subtree: true,
            attributes: true,
            attributeFilter: ['data-fini'],
          })
        }
        /** Le compteur, les points, l'état de l'item et la ligne du résultat, d'après l'état noté. */
        const majItem = () => {
          const etats = itemsPratique()
          const fait = etats.get(item.id)
          // Réussi avec de l'aide : l'appli ne le compte pas encore. La page le compte à part, pour ne
          // pas dire « réussi » et « ne compte pas » du même item.
          const avecAide = (entree) => reussi(entree) && etats.get(entree.item.id).etat === 'aide'
          compteur.textContent = decomptePratique() + '.'
          liste.forEach((entree, k) => {
            const p = points.children[k]
            p.dataset.etat = avecAide(entree) ? 'fait-aide' : reussi(entree) ? 'fait' : 'a-faire'
            p.setAttribute(
              'aria-label',
              'Item ' +
                (k + 1) +
                ' sur ' +
                liste.length +
                (avecAide(entree) ? ', réussi avec de l’aide' : reussi(entree) ? ', réussi' : ''),
            )
          })
          boite.dataset.fait = reussi({ item }) ? 'oui' : 'non'
          majPied()
          // La solution a été montrée et l'item n'est pas réussi depuis : on le dit, à la place du résultat.
          const aRefaire = fait.solutionVue && fait.etat !== 'reussi'
          // Réussi, mais l'explication qu'il demande n'est pas encore Solide.
          const aExpliquer = fait.etat !== 'a_faire' && !explicationFaite(item.id)
          etatItem.textContent =
            fait.dernier === null
              ? ''
              : aExpliquer
                ? 'Explication attendue'
                : fait.etat === 'reussi'
                  ? 'Réussi'
                  : fait.etat === 'aide'
                    ? 'Réussi avec de l’aide'
                    : aRefaire
                      ? 'Solution vue'
                      : 'À refaire'
          resultat.className = aRefaire ? 'item-refaire' : 'discret'
          // Les items qui débloquent l'aide de celui-ci, par leur numéro : d'autres à réussir, ou des
          // relais (chacun déjà réussi sans aide, rouvert sur son autre cas).
          const enAttente = fait.etat === 'aide' && fait.aideGardee > 0
          const cibles = enAttente
            ? liste.flatMap((entree, k) => (fait.debloquePar.includes(entree.item.id) ? [k] : []))
            : []
          const parRelais =
            cibles.length > 0 && cibles.every((k) => etats.get(liste[k].item.id).relais)
          const numeros = cibles.map((k) => String(k + 1))
          const lesItems =
            numeros.length < 2
              ? 'l’item ' + (numeros[0] ?? '')
              : 'l’item ' + numeros.slice(0, -1).join(', ') + ' ou ' + numeros.at(-1)
          const suivante = cibles.find((k) => k > index) ?? cibles[0]
          debloquer.hidden = suivante === undefined
          if (suivante !== undefined) {
            debloquer.textContent = 'Aller à l’item ' + String(suivante + 1)
            debloquer.onclick = () => aller_a(suivante)
          }
          // Réussi avec de l'aide : l'appli ne le compte pas encore, la page dit comment il comptera.
          const pourCompter =
            fait.etat !== 'aide'
              ? ''
              : enAttente
                ? (fait.aideGardee >= 4 ? '. Tu as vu la solution' : '. Tu as eu de l’aide') +
                  (parRelais
                    ? '\u00a0: les autres items sont tous réussis. Refais ' +
                      lesItems +
                      ' sur un autre cas (il reste réussi quoi qu’il arrive), puis reviens refaire celui-ci sans aide, sur un autre cas, pour qu’il compte.'
                    : '\u00a0: réussis d’abord ' +
                      lesItems +
                      ' (même avec de l’aide), puis reviens le refaire sans aide, sur un autre cas, pour qu’il compte. D’ici là, le refaire ici garde ton aide.')
                : '. Refais-le maintenant sans aide, sur un autre cas, pour qu’il compte.'
          resultat.textContent = fait.relais
            ? 'Réussi. Refais-le sur un autre cas pour qu’un item aidé compte\u00a0: celui-ci reste réussi quoi qu’il arrive.'
            : aRefaire
              ? 'Tu as vu la solution. Refais-la sans la regarder.'
              : aExpliquer
                ? 'Réussi. Explique-le maintenant\u00a0: l’item compte quand ton explication est Solide.'
                : fait.etat === 'reussi'
                  ? 'Réussi sans aide\u00a0: il compte.'
                  : fait.dernier !== null
                    ? 'Envoyé\u00a0: ' +
                      (fait.dernier.reussi ? 'réussi' : 'non réussi') +
                      ', aide ' +
                      fait.dernier.aide +
                      pourCompter
                    : ''
        }
        majPratique = majItem
        majItem()
        // L'outil émet fiche:verification à chaque réponse vérifiée. L'item se met à jour sans être
        // redessiné : la réponse et le message de l'outil restent à l'écran. Sauf quand l'outil a montré
        // la réponse (aide 4) : rien n'est réussi, l'item se note « solution vue » et se redessine à
        // neuf (l'outil se remonte sur fiche:rendu, son aide repart de zéro), pour être refait sans la
        // regarder. Avec `garder: true`, l'outil montre la solution à l'instant : l'item la note tout de
        // suite, sans se redessiner, et se redessine quand l'outil émet fiche:refaire (« je refais »).
        // Tant que l'item garde une aide (`aideGardee`), la règle du moteur la compte à chaque résultat.
        const redessiner = () => {
          etat.itemCourant = index
          enregistrer()
          afficher()
        }
        consigne.addEventListener('fiche:verification', (evenement) => {
          const detail = evenement.detail ?? {}
          if (typeof detail.juste !== 'boolean') return
          const aideOutil = [1, 2, 3, 4].includes(detail.aide) ? detail.aide : 0
          // Dans un item déclaré, seule la solution montrée compte : l'apprenant déclare le reste.
          if (!verifie && aideOutil < 4) return
          if (aideOutil >= 4) {
            noter(false, 4, true)
            if (detail.garder === true) majItem()
            else redessiner()
            return
          }
          noter(detail.juste, Math.max(aide, aideOutil))
          majItem()
        })
        consigne.addEventListener('fiche:explique', () => majItem())
        consigne.addEventListener('fiche:refaire', () => {
          if (itemPratique(item.id).solutionVue) redessiner()
        })
        return creer(
          'section',
          {},
          creer('h2', { textContent: 'Pratique guidée' }),
          objectifReplie(),
          compteur,
          points,
          // « Écouter » lit l'énoncé de l'item, et ce que l'outil y a écrit depuis.
          barreEcoute(consigne),
          boite,
          creer(
            'div',
            { className: 'ecran-nav' },
            creer('button', {
              type: 'button',
              className: 'bouton secondaire',
              textContent: 'Item précédent',
              disabled: index === 0,
              onclick: () => aller_a(index - 1),
            }),
            creer('button', {
              type: 'button',
              className: 'bouton secondaire',
              textContent: 'Item suivant',
              disabled: index === liste.length - 1,
              onclick: () => aller_a(index + 1),
            }),
          ),
          ...piedEtape(etape),
        )
      }

      /**
       * Le constat de l'atelier : ce que l'apprenant a fait hors de la page (sur sa machine, dans un
       * autre logiciel), que la page ne voit pas. Les critères sont fixés d'avance dans le manifeste
       * (`atelier.criteres`) ; il coche ceux qu'il a atteints et dit l'aide prise, de 0 (aucune) à 4
       * (la solution entière). Un coup de pouce ouvert dans l'atelier (`<details data-cran="2">`)
       * fixe l'aide au moins à son cran : elle ne se déclare pas plus basse. Réussi quand chaque
       * critère est coché ; il ne compte qu'à l'aide 0 (moteur). Il se renvoie autant de fois qu'il
       * le faut, et l'étape suivante attend un premier envoi.
       */
      const AIDES_ATELIER = [
        'Aucune aide',
        'Un indice',
        'Une piste détaillée',
        'Une partie de la solution',
        'La solution entière',
      ]
      function constatAtelier(section) {
        const criteres = manifeste.atelier?.criteres ?? ['J’ai fait l’atelier en entier.']
        const brouillon = () => etat.traces?.['atelier:constat'] ?? { coches: [], cran: 0 }
        const garder = (suite) => {
          etat.traces = { ...(etat.traces ?? {}), 'atelier:constat': { ...brouillon(), ...suite } }
          enregistrer()
        }
        const cases = criteres.map((_, k) =>
          creer('input', {
            type: 'checkbox',
            name: 'critere',
            value: String(k),
            checked: brouillon().coches.includes(k),
          }),
        )
        const radios = AIDES_ATELIER.map((_, aide) =>
          creer('input', { type: 'radio', name: 'aide-atelier', value: String(aide) }),
        )
        const note = creer('p', { className: 'discret', hidden: true })
        const bouton = creer('button', {
          type: 'button',
          className: 'bouton',
          textContent: 'Envoyer mon constat',
        })
        const resultat = creer('p', { className: 'retour', role: 'status' })
        const choisie = () => radios.findIndex((r) => r.checked)
        const maj = () => {
          const cran = brouillon().cran
          radios.forEach((r, aide) => {
            r.disabled = aide < cran
            if (r.disabled) r.checked = false
          })
          note.hidden = cran === 0
          note.textContent =
            'Tu as ouvert un coup de pouce\u00a0: ton aide part au moins à «\u00a0' +
            AIDES_ATELIER[cran] +
            '\u00a0».'
          bouton.disabled = choisie() < 0
        }
        const dire = (envoye) => {
          resultat.textContent = !envoye
            ? ''
            : !envoye.reussi
              ? 'Envoyé\u00a0: pas encore réussi. Refais ce qui manque, puis renvoie ton constat.'
              : envoye.aide === 0
                ? 'Envoyé\u00a0: réussi sans aide.'
                : 'Envoyé\u00a0: réussi, aide ' +
                  envoye.aide +
                  '. Refais-le un autre jour sans aide\u00a0: c’est là qu’il compte.'
        }
        for (const c of cases)
          c.addEventListener('change', () => {
            garder({ coches: cases.flatMap((x, k) => (x.checked ? [k] : [])) })
          })
        for (const r of radios) r.addEventListener('change', maj)
        // Un coup de pouce ouvert relève l'aide au moins à son cran, même refermé ensuite.
        section.addEventListener(
          'toggle',
          (evenement) => {
            const details = evenement.target
            if (!(details instanceof HTMLDetailsElement) || !details.open) return
            const cran = Math.min(Math.max(Number(details.dataset.cran) || 0, 0), 4)
            if (cran > brouillon().cran) {
              garder({ cran })
              maj()
            }
          },
          true,
        )
        bouton.addEventListener('click', () => {
          const aide = choisie()
          if (aide < 0) return
          const reussi = cases.every((c) => c.checked)
          const coches = cases.flatMap((x, k) => (x.checked ? [k] : []))
          pont.envoyer('atelier.resultat', { reussi, predictions_justes: reussi ? 3 : 0, aide })
          etat.atelier = { reussi, aide, coches }
          enregistrer()
          dire(etat.atelier)
          majPied()
        })
        if (etat.atelier && etat.atelier.aide >= brouillon().cran)
          radios[etat.atelier.aide].checked = true
        maj()
        dire(etat.atelier)
        const panneau = creer(
          'div',
          {
            className: 'constat',
            dataset: {
              lecture:
                'Ton constat\u00a0: coche ce que tu as fait, dis l’aide que tu as prise, puis envoie.',
            },
          },
          creer('h3', { textContent: 'Ton constat' }),
          creer('p', {
            className: 'discret',
            textContent:
              'La page ne voit pas ta machine\u00a0: c’est toi qui dis ce que tu as fait. Coche ce qui est vrai, et rien d’autre.',
          }),
          creer(
            'fieldset',
            { className: 'cases' },
            creer('legend', { textContent: 'Ce que tu as fait' }),
            ...criteres.map((critere, k) =>
              creer('label', {}, cases[k], creer('span', { textContent: critere })),
            ),
          ),
          creer(
            'fieldset',
            { className: 'choix' },
            creer('legend', { textContent: 'L’aide que tu as prise' }),
            ...AIDES_ATELIER.map((libelle, aide) => creer('label', {}, radios[aide], libelle)),
          ),
          note,
          creer('div', { className: 'actions' }, bouton),
          resultat,
        )
        return panneau
      }

      /**
       * Une réponse déjà envoyée, lisible. Sa correction n'apparaît qu'une fois la série finie (règle
       * M01) : avant, elle soufflerait les questions suivantes. Finie, une réponse qui n'est pas Solide
       * peut se compléter, une fois, après sa correction (« Compléter ma réponse ») ; ce second tour ne
       * compte pas pour le statut.
       */
      function carteEnvoyee(question, serie) {
        const carte = creer(
          'div',
          { className: 'item', dataset: { fait: 'oui' } },
          creer('strong', { textContent: question.question }),
          reponseLue(question, etat.envoyees[question.id].reponse),
        )
        const gardee = etat.corrigees?.[question.id]
        if (serieEnCours() === serie) {
          carte.append(
            creer('p', { className: 'discret', textContent: 'Corrigée à la fin de la série.' }),
          )
          return carte
        }
        if (!gardee) return carte
        const sortie = creer('div', { className: 'sortie' })
        sortie.setAttribute('aria-live', 'polite')
        sortie.append(bulleCorrection(gardee.premiere), ...accordSur(gardee.premiere))
        carte.append(sortie)
        if (gardee.relance)
          carte.append(
            reponseLue(question, gardee.relance.reponse),
            bulleCorrection(gardee.relance.correction),
            ...accordSur(gardee.relance.correction),
          )
        else if (
          gardee.premiere.niveau !== 'solide' &&
          // La série finie se ferme côté serveur dès « Vu » : le complément reste permis, une fois.
          (serieOuverte[serie] || reponsesFinies(serie) === questions(serie).length) &&
          !aRefaire(serie).includes(question)
        ) {
          // Une question à reprendre ne se complète pas : un complément (second tour) ne compte
          // jamais, il ne refermerait pas l'erreur. Seule une réponse nouvelle le peut.
          const completer = creer(
            'div',
            { className: 'actions' },
            creer('button', {
              type: 'button',
              className: 'bouton secondaire',
              textContent: 'Compléter ma réponse',
              onclick: () =>
                completer.replaceWith(afficherQuestion(serie, question, { relance: true })),
            }),
          )
          carte.append(completer)
        }
        return carte
      }

      function afficherSerie(serie, titre) {
        const etape = etapes.find((e) => e.type === serie)
        const total = questions(serie).length
        const finie = reponsesFinies(serie) === total
        const envoyees = questions(serie).filter((q) => etat.envoyees[q.id])
        if (!serieOuverte[serie]) {
          const avis = creer('p', {
            textContent: finie
              ? titre + ' terminée\u00a0: tes ' + total + ' réponses sont envoyées.'
              : 'Cette série n’est pas ouverte.',
          })
          return creer(
            'section',
            {},
            creer('h2', { textContent: titre }),
            avis,
            ...envoyees.map((question) => carteEnvoyee(question, serie)),
            ...piedEtape(etape),
          )
        }
        // Série ouverte, une question à la fois (règle I01) : les réponses envoyées se lisent, puis la
        // première question qui attend sa réponse ; la suivante paraît sous elle quand elle est finie.
        // Une question qui touche une erreur critique ouverte se repose (restitution rouverte).
        const refaire = aRefaire(serie)
        const section = creer('section', {}, creer('h2', { textContent: titre }))
        const aRefermer = erreursAReprendre(refaire).length
        if (aRefermer > 0)
          section.append(
            creer('p', {
              textContent:
                (aRefermer > 1
                  ? aRefermer +
                    ' erreurs critiques sont cochées dans ton bilan. Pour chacune, réponds'
                  : 'Une erreur critique est cochée dans ton bilan. Réponds') +
                ' de nouveau à une question marquée «\u00a0À reprendre\u00a0»\u00a0: une réponse solide, écrite sans aide, la referme.',
            }),
          )
        else if (finie)
          section.append(
            creer('p', {
              textContent: titre + ' terminée\u00a0: tes ' + total + ' réponses sont envoyées.',
            }),
          )
        for (const question of questions(serie)) {
          if (etat.envoyees[question.id] && !refaire.includes(question))
            section.append(carteEnvoyee(question, serie))
        }
        const aPoser = questions(serie).filter((q) => !etat.envoyees[q.id] || refaire.includes(q))
        const pied = piedEtape(etape)
        // Sans support : la série commence sur « Commencer », qui masque le cours jusqu'à la dernière
