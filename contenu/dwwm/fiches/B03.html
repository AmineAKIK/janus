                    cle,
                    solution: schema.attendu,
                    consigne: 'Ton schéma\u00a0:',
                    question: schema.question,
                    saisie: schema.saisie,
                    // Construit sans solution vue : pas « avec support ».
                    apresSolution: false,
                    essais: 2,
                    envoyer: 'Faire juger mon schéma',
                  },
                }),
              ),
            )
            return c
          },
        }

        /**
         * Un autre cas écrit dans la fiche, pour refaire sans regarder dans le cours (règle F03) : un
         * exercice du même outil, fait des attributs `data-variante-…` de l'exercice sans leur préfixe,
         * avec `data-variante-enonce` pour énoncé ; pour remettre dans l'ordre, ses lignes
         * (`data-variante-lignes` : « a : condition => sortie | … »).
         */
        function autreCas(ex) {
          const donnees = {}
          for (const [cle, val] of Object.entries(ex.dataset)) {
            const m = /^variante([A-Z]\w*)$/.exec(cle)
            if (!m || m[1] === 'Enonce' || m[1] === 'Lignes') continue
            donnees[m[1].charAt(0).toLowerCase() + m[1].slice(1)] = val
          }
          const nouveau = nouvelEx(ex.dataset.widget, donnees, ex.dataset.varianteEnonce)
          const lignes = ex.dataset.varianteLignes
          if (lignes)
            nouveau.append(
              el(
                'ol',
                { class: 'lignes-ordre' },
                ...lignes.split('|').map((l) => {
                  const [, id, cond, sortie] =
                    /^\s*(\w+)\s*:\s*(.+?)\s*=>\s*(.+?)\s*$/.exec(l) ?? []
                  return el('li', {
                    'data-ligne': id,
                    'data-cond': cond,
                    'data-sortie': sortie,
                    text: cond + ' : afficher « ' + sortie + ' »',
                  })
                }),
              ),
            )
          return nouveau
        }

        /** Monte un exercice : son contrôleur, son échelle d'aide, et l'état gardé d'une visite précédente. */
        function monterEx(ex) {
          const fabrique = TYPES[ex.dataset.widget]
          if (!fabrique) return
          const c = fabrique(ex)
          if (!c.variante && ex.dataset.varianteEnonce && !dansItem(ex))
            c.variante = () => autreCas(ex)
          if (ex.dataset.solution && !c.solutionFixe) c.solution = () => ex.dataset.solution
          retourDe(ex)
          if ('essai' in ex.dataset) return monterEssai(ex, c)
          if (!c.sansEchelle) {
            c.echelle = window.JanusGabarit.echelle(ex, {
              crans: (c.crans ?? []).map((t) => (typeof t === 'function' ? () => fr(t()) : fr(t))),
              fini: () => fini(ex),
              surSolution: () => montrerSolution(ex, c),
              // Un choix : « Voir la solution » ne paraît que s'il peut servir, et ses crans
              // s'enchaînent après la première réponse fausse.
              restantes: c.restantes,
              enchaine: typeof c.restantes === 'function',
            })
            ex.append(c.echelle.zone)
          }
          if (dansItem(ex)) {
            remonterItem(ex, c)
            return c
          }
          if (ex.dataset.variante) return c
          const garde = traces['ex:' + ex.dataset.id]
          if (garde && typeof garde === 'object' && garde.e) {
            // Une solution vue, ni refaite ni expliquée à la visite d'avant : la suite de l'écran
            // attend encore (règle F04).
            const cle = 'explique:ex:' + ex.dataset.id
            const reprise =
              garde.e === 'vu' &&
              avecReprise(ex) &&
              !garde.refait &&
              !traces[cle] &&
              !traces[cle + ':variante']
            if (reprise) ex.dataset.reprise = 'oui'
            appliquer(ex, c, garde.e, garde.v)
            if (reprise) apresSolution(ex, c)
            else {
              // L'explication déjà écrite revient avec sa correction, et l'autre cas refait avec sa
              // réponse : sans cela, l'exercice redemande ce qui est fait.
              if (traces[cle]) expliquer(ex, c.solution(), consigneExplication(ex, garde.e))
              if (garde.e === 'vu' && garde.variante && c.variante)
                remonterVariante(ex, c, garde.variante)
              else if (garde.e === 'vu') proposerVariante(ex, c)
            }
          }
          return c
        }

        /** La consigne d'une explication déjà demandée, pour la remontrer telle qu'elle a été posée. */
        function consigneExplication(ex, etat) {
          if (etat === 'vu') return fr(POUR_CONTINUER)
          if (ex.dataset.justifier && !ex.dataset.variante) return fr(ex.dataset.justifier)
          return undefined
        }

        /** L'autre cas d'un exercice du cours, refait à la visite d'avant : il revient fini. */
        function remonterVariante(ex, c, garde) {
          const nouveau = c.variante()
          if (!nouveau) return proposerVariante(ex, c)
          for (const n of Array.from(ex.children)) n.hidden = true
          nouveau.dataset.variante = 'oui'
          nouveau.dataset.remonte = 'oui'
          if (ex.dataset.id) nouveau.dataset.origine = ex.dataset.id
          ex.append(el('div', { class: 'refaire' }, nouveau))
          const cv = monterEx(nouveau)
          if (!cv) return
          appliquer(nouveau, cv, garde.e, garde.v)
          delete nouveau.dataset.remonte
          // Réussi, l'autre cas demande toujours son explication (comme à la réponse) ; vu, elle est faite.
          if (garde.e !== 'vu' || traces['explique:' + cleExplication(nouveau)])
            expliquer(nouveau, cv.solution(), consigneExplication(nouveau, garde.e))
        }

        /**
         * Un item de pratique déjà réussi revient avec sa réponse, et son explication avec ses
         * corrections (ou son champ, si elle attend encore) : l'apprenant ne refait pas ce qu'il a fait.
         * Sauf réussi avec de l'aide et à refaire (`refaire`, dès qu'un autre item a été fait depuis) : il
         * se refait sans aide, sur l'autre cas, pour compter, et l'outil repart à neuf. Le gabarit donne l'état des items dans `fiche:rendu` (`detail.pratique`).
         */
        function remonterItem(ex, c) {
          const id = ex.closest('.item')?.dataset.item
          const garde = id && traces['item:' + id]
          const fait = id && pratique[id]
          if (!garde || !fait?.reussi || garde.cas !== (montre[id] ?? 'origine')) return
          if (garde.e !== 'ok' && garde.e !== 'ok1') return
          if (fait.refaire) return
          appliquer(ex, c, garde.e, garde.v)
          expliquerApres(ex, c, garde.cran ?? 0)
        }

        /**
         * Un essai de l'étape 3 : pas d'échelle d'aide (rien ne s'aide avant l'explication). Déjà répondu,
         * il reste fini ; « Je ne sais pas », que le gabarit ajoute, arrive ici en fiche:essai-passe.
         */
        function monterEssai(ex, c) {
          if (traces['essai:' + ex.dataset.id]) {
            ex.dataset.fini = 'oui'
            c.bloquer?.()
            return
          }
          ex.addEventListener('fiche:essai-passe', () => {
            if (!fini(ex)) essayer(ex, c, { ok: false })
          })
        }

        /**
         * Pas à pas : dans un écran, ce qui suit un exercice pas encore fini attend qu'il le soit (une
         * question à la fois, règle I01). Un groupe d'exercices compte pour une question.
         */
        function devoiler(ecran) {
          if (!ecran) return
          let attendre = false
          for (const enfant of Array.from(ecran.children)) {
            if (attendre) {
              enfant.dataset.attente = ''
              continue
            }
            delete enfant.dataset.attente
            const exercices = enfant.matches('.ex[data-id]') ? [enfant] : $$('.ex[data-id]', enfant)
            if (exercices.some((ex) => !fini(ex) || ex.dataset.reprise === 'oui')) attendre = true
          }
        }

        // --- Les outils du cours.

        /**
         * Le portable de Yasmine : le disque, la RAM et le processeur. « Lancer VS Code » montre la
         * copie du disque vers la RAM, puis le processeur qui l'exécute ; « Ouvrir 5 onglets », jusqu'à
         * 30, fait monter la RAM ; au-delà de sa taille (`data-ram`, en Go), le surplus part dans le
         * fichier d'échange, sur le disque, et le processeur attend le disque. `data-disque` : hdd ou
         * ssd, qui change le temps de lecture annoncé. `data-sans-onglets` : seulement le lancement.
         * `data-perception` (le premier écran) : l'outil ne dit que ce qui se voit, sans flèche nommée
         * ni fichier d'échange ; le pari de l'écran paraît une fois VS Code lancé (trace lancement), et
         * les onglets s'ouvrent une fois le pari fait (trace pari).
         */
        const WINDOWS_MO = 3000
        const VSCODE_MO = 1000
        const ONGLET_MO = 150
        const ONGLETS_MAX = 30
        const mo = (x) => x.toLocaleString('fr-FR').replace(/\s/g, '\u00a0') + '\u00a0Mo'
        function lancement(n) {
          const ecran = n.closest('.ecran, [data-ecran]') ?? n.parentElement
          const pari = $('[data-widget="pari"]', ecran)
          const go = Number(n.dataset.ram) || 8
          const total = go * 1000
          const ssd = n.dataset.disque === 'ssd'
          const avecOnglets = !('sansOnglets' in n.dataset)
          const perception = 'perception' in n.dataset
          const pariFait = () => !pari || typeof traces[pari.dataset.cle || 'pari'] === 'string'
          const nomDisque = ssd ? 'SSD' : 'Disque dur'
          let lance = false
          let onglets = 0
          let minuteurs = []

          const etatDisque = el('p', { class: 'etat-composant' })
          const echange = el('p', { class: 'echange', hidden: true })
          const jauge = el('progress', { max: String(total), value: String(WINDOWS_MO) })
          const texteRam = el('p', { class: 'mono' })
          const detailRam = el('p', { class: 'discret' })
          const etatProc = el('p', { class: 'etat-composant' })
          const etatGpu = el('p', { class: 'etat-composant' })
          const ecranTexte = el('p', { class: 'etat-composant' })
          const boites = {
            disque: el(
              'div',
              { class: 'composant' },
              el('p', { class: 'nom-composant', text: nomDisque + ', 1 To' }),
              el('p', { class: 'discret', text: 'Windows, VS Code, le navigateur, tes fichiers' }),
              etatDisque,
              echange,
            ),
            ram: el(
              'div',
              { class: 'composant' },
              el('p', { class: 'nom-composant', text: 'RAM, ' + go + ' Go' }),
              jauge,
              texteRam,
              detailRam,
            ),
            proc: el(
              'div',
              { class: 'composant' },
              el('p', { class: 'nom-composant', text: 'Processeur, 4 cœurs' }),
              etatProc,
            ),
            gpu: el(
              'div',
              { class: 'composant' },
              el('p', { class: 'nom-composant', text: 'Carte graphique, intégrée' }),
              etatGpu,
            ),
          }
          const fleche = (t) =>
            el('p', { class: 'fleche-composant', 'aria-hidden': 'true', text: t })
          const journal = el('ol', { class: 'journal', 'aria-live': 'polite' })
          // Tant que le pari n'est pas fait, dire pourquoi les onglets attendent.
          const consigne = el('p', {
            class: 'discret',
            hidden: true,
            text: 'Parie d’abord, juste en dessous : les onglets s’ouvriront ensuite.',
          })
          const direConsigne = () => {
            consigne.hidden = !(lance && avecOnglets && pari && perception && !pariFait())
          }
          const bLancer = el('button', { type: 'button', class: 'bouton', text: 'Lancer VS Code' })
          const bOnglets = el('button', {
            type: 'button',
            class: 'bouton secondaire',
            text: 'Ouvrir 5 onglets',
            disabled: true,
          })
          const bRecommencer = el('button', {
            type: 'button',
            class: 'bouton secondaire petit',
            text: 'Recommencer',
          })

          const occupe = () => WINDOWS_MO + (lance ? VSCODE_MO : 0) + onglets * ONGLET_MO
          function peindre() {
            const demande = occupe()
            const dedans = Math.min(demande, total)
            const surplus = demande - dedans
            jauge.value = dedans
            texteRam.textContent = fr(mo(dedans) + ' sur ' + mo(total))
            const parts = ['Windows ' + mo(WINDOWS_MO)]
            if (lance) parts.push('VS Code ' + mo(VSCODE_MO))
            if (onglets) parts.push(onglets + ' onglets ' + mo(onglets * ONGLET_MO))
            detailRam.textContent = fr(parts.join(' · '))
            echange.hidden = surplus === 0 || perception
            echange.textContent = fr('Fichier d’échange : ' + mo(surplus))
            n.classList.toggle('pleine', surplus > 0)
            if (surplus > 0) {
              etatDisque.textContent = fr(
                perception
                  ? 'Il travaille sans arrêt.'
                  : 'Il travaille sans arrêt, pour le fichier d’échange.',
              )
              etatProc.textContent = fr(
                perception ? 'Il exécute VS Code et le navigateur.' : 'Il attend le disque.',
              )
              ecranTexte.textContent = fr(
                'Écran : des fenêtres qui mettent des secondes à répondre.',
              )
            }
          }
          function dire(texte) {
            journal.append(el('li', { text: texte }))
          }
          function auRepos() {
            etatDisque.textContent = fr('Au repos.')
            etatProc.textContent = fr(lance ? 'Il exécute VS Code et le navigateur.' : 'Au repos.')
            etatGpu.textContent = fr(
              lance ? 'Elle dessine les fenêtres.' : 'Elle dessine le bureau.',
            )
            ecranTexte.textContent = fr(
              lance ? 'Écran : la fenêtre de VS Code, et le navigateur.' : 'Écran : le bureau.',
            )
          }
          function etapes(pas) {
            minuteurs.forEach(clearTimeout)
            minuteurs = []
            const delai = mouvementReduit() ? 0 : ssd ? 400 : 1400
            pas.forEach((f, i) => minuteurs.push(setTimeout(f, delai * i)))
          }
          function lancer() {
            if (lance) return
            bLancer.disabled = true
            etapes([
              () => {
                etatDisque.textContent = fr('Il lit les fichiers de VS Code.')
                dire(
                  (ssd ? 'Le SSD' : 'Le disque dur') +
                    (perception ? ' travaille : ' : ' lit les fichiers de VS Code : ') +
                    (ssd ? 'moins d’une seconde.' : 'une dizaine de secondes.'),
                )
              },
              () => {
                lance = true
                peindre()
                dire(
                  perception
                    ? 'La RAM occupée passe de ' +
                        mo(WINDOWS_MO) +
                        ' à ' +
                        mo(WINDOWS_MO + VSCODE_MO) +
                        '.'
                    : 'Ils sont copiés dans la RAM : de ' +
                        mo(WINDOWS_MO) +
                        ' à ' +
                        mo(WINDOWS_MO + VSCODE_MO) +
                        '. Le disque garde son exemplaire.',
                )
              },
              () => {
                etatDisque.textContent = fr('Au repos.')
                etatProc.textContent = fr('Il exécute VS Code.')
                dire(
                  perception
                    ? 'Le processeur exécute VS Code.'
                    : 'Le processeur lit les instructions de VS Code dans la RAM, et les exécute.',
                )
              },
              () => {
                auRepos()
                dire('La carte graphique dessine la fenêtre de VS Code, et l’écran l’affiche.')
                bOnglets.disabled = !avecOnglets || !pariFait()
                direConsigne()
                if (pari && perception) {
                  pari.hidden = false
                  tracer('lancement', true)
                }
              },
            ])
          }
          function ouvrir() {
            if (!lance || onglets >= ONGLETS_MAX) return
            onglets += 5
            const demande = occupe()
            auRepos()
            peindre()
            if (demande > total && perception)
              dire(
                onglets +
                  ' onglets : la RAM occupée est au maximum, ' +
                  mo(total) +
                  ', et le disque dur travaille sans arrêt. Les fenêtres mettent des secondes à répondre.',
              )
            else if (demande > total)
              dire(
                onglets +
                  ' onglets : il faudrait ' +
                  mo(demande) +
                  ' pour ' +
                  mo(total) +
                  ' de RAM. Windows range ' +
                  mo(demande - total) +
                  ' dans le fichier d’échange, sur le disque. Le processeur attend le disque : tout rame.',
              )
            else
              dire(
                onglets +
                  ' onglets : la RAM monte à ' +
                  mo(demande) +
                  ' sur ' +
                  mo(total) +
                  '. Tout tient : le portable reste rapide.',
              )
            if (onglets >= ONGLETS_MAX) bOnglets.disabled = true
          }
          function recommencer() {
            minuteurs.forEach(clearTimeout)
            minuteurs = []
            lance = false
            onglets = 0
            bLancer.disabled = false
            bOnglets.disabled = true
            consigne.hidden = true
            journal.replaceChildren()
            auRepos()
            peindre()
          }
          bLancer.addEventListener('click', lancer)
          bOnglets.addEventListener('click', ouvrir)
          bRecommencer.addEventListener('click', recommencer)
          n.append(
            el(
              'div',
              { class: 'machine' },
              boites.disque,
              fleche(perception ? '' : 'copié vers'),
              boites.ram,
              fleche(perception ? '' : 'lu par'),
              boites.proc,
              fleche(perception ? '' : 'confie l’image à'),
              boites.gpu,
            ),
            ecranTexte,
            el('div', { class: 'rangee' }, bLancer, avecOnglets ? bOnglets : null, bRecommencer),
            consigne,
            journal,
          )
          auRepos()
          peindre()
          if (pari) pari.hidden = traces.lancement !== true
          // Le pari fait, les onglets s'ouvrent.
          document.addEventListener('fiche:trace', () => {
            if (lance && avecOnglets && onglets < ONGLETS_MAX) bOnglets.disabled = !pariFait()
            direConsigne()
          })
        }

        /**
         * La fiche de sa machine (pratique, item déclaré) : l'apprenant écrit ce qu'il relève. Une fois
         * enregistrée (trace machine), l'item est fini, et la page compare chaque relevé aux repères
         * du bloc. Elle ne vérifie pas les valeurs : elle ne voit pas la machine.
         */
        const CHAMPS_MACHINE = [
          { cle: 'systeme', label: 'Système', options: ['Windows', 'macOS', 'Autre'] },
          { cle: 'processeur', label: 'Processeur ou puce (son nom)', type: 'texte' },
          { cle: 'coeurs', label: 'Nombre de cœurs', type: 'entier' },
          { cle: 'frequence', label: 'Vitesse de base, en GHz', type: 'decimal', facultatif: true },
          { cle: 'ram', label: 'RAM, en Go', type: 'entier' },
          { cle: 'stockage', label: 'Sorte de stockage', options: ['SSD', 'Disque dur'] },
          { cle: 'taille', label: 'Taille du stockage, en Go', type: 'entier' },
          { cle: 'famille', label: 'Famille du processeur', options: ['x64', 'ARM64'] },
          {
            cle: 'virtualisation',
            label: 'Virtualisation',
            options: ['Activé', 'Désactivé', 'Mac : toujours en service'],
          },
        ]
        /** Le second temps de l'item : juger sa machine, une fois la fiche enregistrée. */
        const JUGEMENT = {
          cle: 'jugement',
          label: 'Pour développer, à changer en premier',
          options: ['Rien d’obligatoire', 'Le stockage', 'La RAM', 'Le processeur'],
        }
        /** Ce que les repères du bloc font changer en premier : la même règle que la page dit. */
        function premierAChanger(v) {
          const ram = Number(v.ram)
          if (v.stockage === 'Disque dur') return 'Le stockage'
          if (ram < 8) return 'La RAM'
          if (Number(v.taille) < 238) return 'Le stockage'
          if (Number(v.coeurs) < 4) return 'Le processeur'
          return 'Rien d’obligatoire'
        }
        function bilanMachine(v) {
          const lignes = []
          const ram = Number(v.ram)
          lignes.push(
            'RAM, ' +
              ram +
              ' Go : ' +
              (ram < 8
                ? 'sous le minimum de 8 Go.'
                : ram < 16
                  ? 'le minimum ; 16 Go te mettraient à l’aise.'
                  : 'à l’aise.'),
          )
          const taille = Number(v.taille)
          lignes.push(
            v.stockage === 'Disque dur'
              ? 'Stockage : un disque dur, sous le minimum ; un SSD changerait le plus de choses.'
              : 'Stockage : un SSD de ' +
                  taille +
                  ' Go, ' +
                  (taille < 238
                    ? 'sous le minimum de 256 Go.'
                    : taille < 476
                      ? 'le minimum ; 512 Go te mettraient à l’aise.'
                      : 'à l’aise.'),
          )
          const coeurs = Number(v.coeurs)
          lignes.push(
            'Processeur, ' +
              coeurs +
              ' cœurs : ' +
              (coeurs < 4 ? 'sous le minimum de 4.' : coeurs < 6 ? 'le minimum.' : 'à l’aise.'),
          )
          lignes.push(
            v.famille === 'ARM64'
              ? 'Famille ARM64 : prends les versions ARM64 de tes logiciels, Apple silicon sur un Mac.'
              : 'Famille x64 : prends les versions x64 de tes logiciels, Intel sur un Mac.',
          )
          if (v.virtualisation)
            lignes.push(
              v.virtualisation === 'Désactivé'
                ? 'Virtualisation désactivée : rien à acheter ; tu l’activeras dans le BIOS ou l’UEFI quand tu installeras WSL 2.'
                : 'Virtualisation en service : WSL 2 et Docker pourront tourner.',
            )
          const cle = premierAChanger(v)
          const premier =
            cle === 'Le stockage'
              ? v.stockage === 'Disque dur'
                ? 'le disque dur, par un SSD'
                : 'le stockage, pour un SSD d’au moins 256 Go'
              : cle === 'La RAM'
                ? 'la RAM, pour au moins 8 Go'
                : cle === 'Le processeur'
                  ? 'le processeur'
                  : ram < 16
                    ? 'rien d’obligatoire ; 16 Go de RAM te mettraient à l’aise'
                    : 'rien : ta machine convient pour développer'
          lignes.push('À changer en premier : ' + premier + '.')
          if (v.jugement)
            lignes.push(
              v.jugement === cle
                ? 'Ton jugement, « ' + v.jugement + ' », est celui des repères.'
                : 'Tu avais jugé « ' + v.jugement + ' » : relis chaque ligne face à son minimum.',
            )
          return lignes
        }
        function mamachine(ex) {
          const champs = {}
          const grille = el('div', { class: 'fiche-machine' })
          for (const ch of CHAMPS_MACHINE) {
            const id = uid('machine-' + ch.cle)
            let champ
            if (ch.options) {
              champ = el('select', { id })
              champ.append(el('option', { value: '', text: 'Choisis' }))
              for (const o of ch.options) champ.append(el('option', { value: o, text: o }))
            } else
              champ = el('input', {
                id,
                type: 'text',
                autocomplete: 'off',
                spellcheck: 'false',
                inputmode:
                  ch.type === 'entier' ? 'numeric' : ch.type === 'decimal' ? 'decimal' : 'text',
              })
            champs[ch.cle] = champ
            const ligne = el(
              'div',
              { class: 'ligne-machine' },
              el('label', { for: id, text: ch.label }),
              champ,
            )
            if (ch.cle === 'frequence') {
              const idCase = uid('machine-sans-frequence')
              const caseNon = el('input', { type: 'checkbox', id: idCase })
              champs.sansFrequence = caseNon
              caseNon.addEventListener('change', () => {
                champ.disabled = caseNon.checked
                if (caseNon.checked) champ.value = ''
              })
              ligne.append(
                el(
                  'span',
                  { class: 'case-machine' },
                  caseNon,
                  el('label', { for: idCase, text: 'Non affichée' }),
                ),
              )
            }
            grille.append(ligne)
          }
          const bouton = el('button', {
            type: 'button',
            class: 'bouton',
            text: 'Enregistrer ma fiche',
          })
          const retour = retourDe(ex)
          const bilan = el('ul', { class: 'bilan-machine' })
          const idJuge = uid('machine-jugement')
          const juge = el('select', { id: idJuge })
          juge.append(el('option', { value: '', text: 'Choisis' }))
          for (const o of JUGEMENT.options) juge.append(el('option', { value: o, text: o }))
          const boutonJuge = el('button', {
            type: 'button',
            class: 'bouton',
            text: 'Valider mon jugement',
          })
          const retourJuge = el('p', { class: 'retour', 'aria-live': 'polite' })
          const blocJuge = el(
            'div',
            { class: 'jugement-machine', hidden: true },
            el('p', {
              class: 'q',
              text: 'Face aux repères de l’encadré, que changerais-tu en premier sur ta machine pour développer ?',
            }),
            el(
              'div',
              { class: 'ligne-machine' },
              el('label', { for: idJuge, text: JUGEMENT.label }),
              juge,
            ),
            el('div', { class: 'actions' }, boutonJuge),
            retourJuge,
          )
          function valeurs() {
            const v = {}
            for (const ch of CHAMPS_MACHINE) v[ch.cle] = champs[ch.cle].value.trim()
            v.sansFrequence = champs.sansFrequence.checked
            return v
          }
          function remplir(v) {
            for (const ch of CHAMPS_MACHINE) champs[ch.cle].value = v[ch.cle] ?? ''
            champs.sansFrequence.checked = Boolean(v.sansFrequence)
            champs.frequence.disabled = Boolean(v.sansFrequence)
          }
          /** Premier temps fini : la fiche est gardée, le jugement reste à faire. */
          function demanderJugement() {
            retour.className = 'retour bon'
            retour.textContent = fr('Ta fiche est enregistrée.')
            blocJuge.hidden = false
          }
          function montrer(v) {
            ex.dataset.fini = 'oui'
            blocJuge.hidden = false
            juge.value = v.jugement
            retour.className = 'retour bon'
            retour.textContent = fr('Ta fiche est enregistrée.')
            retourJuge.className = 'retour bon'
            retourJuge.textContent = fr('Ton jugement est noté. Face aux repères du bloc :')
            bilan.replaceChildren(...bilanMachine(v).map((t) => el('li', { text: t })))
          }
          bouton.addEventListener('click', () => {
            const v = valeurs()
            const manque = CHAMPS_MACHINE.find(
              (ch) => !v[ch.cle] && !(ch.facultatif && v.sansFrequence),
            )
            if (manque) {
              retour.className = 'retour'
              retour.textContent = fr('Il manque : ' + manque.label.toLowerCase() + '.')
              return
            }
            for (const cle of ['coeurs', 'ram', 'taille'])
              if (Number.isNaN(entier(v[cle]))) {
                const ch = CHAMPS_MACHINE.find((c) => c.cle === cle)
                retour.className = 'retour'
                retour.textContent = fr(ch.label + ' : écris un nombre entier.')
                return
              }
            if (!v.sansFrequence && !/^\d+([.,]\d+)?$/.test(v.frequence)) {
              retour.className = 'retour'
              retour.textContent = fr(
                'Vitesse de base : écris un nombre, comme 1,6, ou coche « Non affichée ».',
              )
              return
            }
            for (const cle of ['coeurs', 'ram', 'taille']) v[cle] = String(entier(v[cle]))
            if (juge.value && ex.dataset.fini === 'oui') {
              v.jugement = juge.value
              tracer('machine', v)
              montrer(v)
              return
            }
            tracer('machine', v)
            demanderJugement()
          })
          boutonJuge.addEventListener('click', () => {
            const garde = traces.machine
            if (!garde || typeof garde !== 'object') return
            if (!juge.value) {
              retourJuge.className = 'retour'
              retourJuge.textContent = fr('Choisis d’abord ce que tu changerais en premier.')
              return
            }
            const v = { ...garde, jugement: juge.value }
            tracer('machine', v)
            montrer(v)
          })
          ex.append(grille, el('div', { class: 'actions' }, bouton), retour, blocJuge, bilan)
          const garde = traces.machine
          if (garde && typeof garde === 'object') {
            remplir(garde)
            if (garde.jugement) montrer(garde)
            else demanderJugement()
          }
        }

        /** Le pari, sans note : gardé (fiche:trace), repris à la fin du bloc. */
        function pari(n) {
          const cle = n.dataset.cle || 'pari'
          const items = $$('.options > li', n)
          const message = el('p', { class: 'retour', 'aria-live': 'polite' })
          n.append(message)
          const choisir = (option, garder) => {
            items.forEach((li) =>
              $('button', li).setAttribute('aria-pressed', String(li.dataset.option === option)),
            )
            message.textContent = fr(n.dataset.apres || '')
            if (garder) tracer(cle, option)
          }
          items.forEach((li) => {
            const b = el('button', { type: 'button' })
            b.append(...li.childNodes)
            li.append(b)
            b.addEventListener('click', () => choisir(li.dataset.option, true))
          })
          if (typeof traces[cle] === 'string') choisir(traces[cle], false)
        }

        /** La correction du pari (étape 12) : les deux réponses rappelées, sous le schéma refait. */
        function bilanPari(n) {
          const libelles = Object.fromEntries(
            (n.dataset.options || '').split('|').map((x) => x.split('=')),
          )
          const peindre = () => {
            const dits = []
            if (libelles[traces.pari])
              dits.push('Au début, tu avais répondu : « ' + libelles[traces.pari] + ' ».')
            if (libelles[traces['pari-fin']])
              dits.push(
                'Avant le schéma, tu as répondu : « ' + libelles[traces['pari-fin']] + ' ».',
              )
            n.hidden = !dits.length
            n.textContent = fr(dits.join(' '))
          }
          peindre()
          document.addEventListener('fiche:trace', peindre)
        }

        /** Le rappel du pari, au-dessus de la question qui le reprend. */
        function rappelPari(n) {
          const choisi = traces.pari
          const ex = n.closest('.ex')
          const option =
            typeof choisi === 'string' ? $('li[data-option="' + choisi + '"]', ex) : null
          if (!option) return
          n.hidden = false
          n.textContent = fr('Au début, tu avais répondu : « ' + option.textContent.trim() + ' »')
        }

        /**
         * L'aisance : ouvrir l'outil qui décrit sa machine, vite. Une série, ce sont 3 ouvertures :
         * « Prêt » lance le chrono, puis la page dit quoi lire (la RAM, les cœurs, ou sur un Mac le nom
         * de la puce ou du processeur, tirés au sort) ; l'apprenant ouvre l'outil, y lit la valeur et l'écrit ici ; le
         * chrono s'arrête quand il valide. La valeur se compare à la fiche de sa machine (trace machine). Trois
         * niveaux, les paliers du manifeste ; un niveau se réussit avec 3 ouvertures justes dans le
         * temps, un jour différent du précédent. Chaque série finie part au pont (aisance.resultat),
         * avec la durée de la plus lente.
         */
        const NIVEAUX = JSON.parse(document.getElementById('bloc-manifest').textContent).aisance
          .paliers_s
        const PAR_SERIE = 3
        /** Les séries d'aisance réussies que le serveur garde (fiche:rendu, detail.aisance). */
        let aisanceServeur = []
        function dateCourte(cle) {
          const [a, m, j] = cle.split('-').map(Number)
          return new Date(a, m - 1, j).toLocaleDateString('fr-FR', {
            day: 'numeric',
            month: 'long',
          })
        }
        /** Les niveaux relus dans les séries réussies du serveur : la même règle que le moteur. */
        function niveauxDuServeur() {
          const niveaux = []
          for (const serie of aisanceServeur) {
            if (niveaux.length >= NIVEAUX.length) break
            const jour = jourCle(new Date(serie.le))
            if (serie.duree_s > NIVEAUX[niveaux.length]) continue
            if (niveaux.at(-1)?.jour === jour) continue
            niveaux.push({ niveau: niveaux.length + 1, jour })
          }
          return niveaux
        }
        /** Un nombre de Go écrit par l'apprenant (« 16 », « 15,8 », « 16 Go ») ; sinon NaN. */
        function go(s) {
          const t = String(s).replace(/\s|go/gi, '').replace(',', '.')
          return /^\d+(\.\d+)?$/.test(t) ? Number(t) : NaN
        }
        /** Une valeur à lire dans l'outil, comparée à la fiche de la machine. */
        const A_LIRE = {
          ram: {
            libelle: 'La RAM que l’outil affiche, en Go',
            consigne: 'Lis la RAM.',
            mode: 'decimal',
            juste: (lu, m) => Math.abs(go(lu) - Number(m.ram)) <= 0.5,
            fiche: (m) => m.ram + ' Go de RAM',
          },
          coeurs: {
            libelle: 'Le nombre de cœurs que l’outil affiche',
            consigne: 'Lis le nombre de cœurs.',
            mode: 'numeric',
            juste: (lu, m) => Number(String(lu).trim()) === Number(m.coeurs),
            fiche: (m) => m.coeurs + ' cœurs',
          },
          puce: {
            libelle: 'Le nom de la puce ou du processeur que l’outil affiche',
            consigne: 'Lis le nom de la puce ou du processeur.',
            mode: 'text',
            juste: (lu, m) => {
              const net = (x) =>
                String(x)
                  .toLowerCase()
                  .replace(/apple|puce|\s/g, '')
              return net(lu).length >= 2 && net(m.processeur).includes(net(lu))
            },
            fiche: (m) => '« ' + m.processeur + ' »',
          },
        }
        function ouvrir(n) {
          const machine = traces.machine
          if (!machine || typeof machine !== 'object' || Number.isNaN(Number(machine.ram))) {
            n.append(
              el('p', {
                class: 'retour',
                text: 'Remplis d’abord la fiche de ta machine, dans « Entraînement » : la page y compare ce que tu lis.',
              }),
            )
            return
          }
          // Sur un Mac, À propos de ce Mac montre la puce et la RAM ; ailleurs, l'onglet Performance montre la RAM et les cœurs.
          const valeurs = machine.systeme === 'macOS' ? ['ram', 'puce'] : ['ram', 'coeurs']
          const locaux = Array.isArray(traces.ouvrir)
            ? traces.ouvrir.filter((x) => x && typeof x.jour === 'string')
            : []
          // Le serveur l'emporte quand il en sait plus : après un recommencement, les traces sont vides.
          const duServeur = niveauxDuServeur()
          const reussis = duServeur.length > locaux.length ? duServeur : locaux
          const liste = el('ol', { class: 'niveaux' })
          const info = el('p', { class: 'discret' })
          const zone = el('div', { class: 'zone-vitesse' })
          const lancer = el('button', { type: 'button', class: 'bouton' })
          const aujourdhui = () => reussis.some((x) => x.jour === jourCle())
          const limite = () => NIVEAUX[Math.min(reussis.length, NIVEAUX.length - 1)]
          function majInfo() {
            liste.replaceChildren(
              ...NIVEAUX.map((s, k) => {
                const r = reussis[k]
                return el(
                  'li',
                  { class: r ? 'reussi' : k === reussis.length ? 'courant' : '' },
                  el('span', { text: 'Niveau ' + (k + 1) + ' : ' + s + ' secondes par ouverture' }),
                  el('span', {
                    class: 'etat ' + (r ? 'solide' : 'attente'),
                    text: r
                      ? 'réussi le ' + dateCourte(r.jour)
                      : k === reussis.length
                        ? 'à réussir'
                        : 'plus tard',
                  }),
                )
              }),
            )
            if (reussis.length >= NIVEAUX.length)
              info.textContent = fr(
                'Les ' +
                  NIVEAUX.length +
                  ' niveaux sont réussis. Tu peux continuer à t’entraîner, à ' +
                  limite() +
                  ' secondes.',
              )
            else if (aujourdhui())
              info.textContent = fr(
                'Niveau ' +
                  reussis.length +
                  ' réussi aujourd’hui. Le niveau ' +
                  (reussis.length + 1) +
                  ' compte à partir de demain : d’ici là, tes séries servent d’entraînement, à ' +
                  limite() +
                  ' secondes.',
              )
            else
              info.textContent = fr(
                'Ta prochaine série compte pour le niveau ' +
                  (reussis.length + 1) +
                  ' : ' +
                  PAR_SERIE +
                  ' ouvertures justes, en ' +
                  limite() +
                  ' secondes chacune au plus.',
              )
            lancer.textContent =
              'Lancer une série de ' + PAR_SERIE + ', à ' + limite() + ' secondes'
          }
          let k = 0
          let justes = 0
          let plusLente = 0
          let s = NIVEAUX[0]
          let compte = false
          let enCours = false
          // L'aide prise : ouvrir « Si tu as oublié le chemin » pendant une série la fait compter
          // comme entraînement, jamais comme une réussite sans aide.
          let aidee = false
          const etape = n.closest('[data-etape], section') || n.parentElement
          for (const d of etape ? etape.querySelectorAll('details[data-aide-aisance]') : [])
            d.addEventListener('toggle', () => {
              if (d.open && enCours) aidee = true
            })
          function finSerie() {
            enCours = false
            const juste = justes === PAR_SERIE
            const reussie = juste && !aidee
            window.JanusPont?.envoyer('aisance.resultat', {
              reussi: reussie,
              duree_s: Math.round(plusLente * 10) / 10,
            })
            let texte =
              'Série : ' +
              justes +
              ' sur ' +
              PAR_SERIE +
              '. Un niveau se réussit avec ' +
              PAR_SERIE +
              ' sur ' +
              PAR_SERIE +
              ' : refais-en une.'
            if (juste && aidee)
              texte =
                'Série juste, mais le chemin était ouvert : elle compte comme entraînement. Refais-en une sans l’ouvrir.'
            else if (reussie && compte) {
              reussis.push({ niveau: reussis.length + 1, jour: jourCle() })
              tracer('ouvrir', reussis.slice())
              texte =
                'Série réussie : ' +
                PAR_SERIE +
                ' sur ' +
                PAR_SERIE +
                '. Niveau ' +
                reussis.length +
                ' réussi.'
            } else if (reussie)
              texte =
                'Série réussie : ' +
                PAR_SERIE +
                ' sur ' +
                PAR_SERIE +
                '. Elle compte comme entraînement.'
            majInfo()
            return el('p', { class: reussie ? 'retour bon' : 'discret', text: texte })
          }
          /** Une ouverture : d'abord « Prêt », l'outil fermé ; puis le chrono, jusqu'à la RAM validée. */
          function pret() {
            const go1 = el('button', {
              type: 'button',
              class: 'bouton',
              text: 'Prêt : je lance le chrono',
            })
            zone.replaceChildren(
              el(
                'div',
                { class: 'ex' },
                el('p', {
                  class: 'discret',
                  text:
                    'Ouverture ' + (k + 1) + ' sur ' + PAR_SERIE + ' · ' + s + ' secondes au plus',
                }),
                el('p', { text: 'Ferme d’abord l’outil s’il est ouvert, puis appuie sur Prêt.' }),
                el('div', { class: 'saisie' }, go1),
              ),
            )
            go1.focus()
            go1.addEventListener('click', chrono)
          }
          function chrono() {
            const lire = A_LIRE[valeurs[Math.floor(Math.random() * valeurs.length)]]
            const debut = performance.now()
            const temps = el('p', { class: 'temps', 'aria-hidden': 'true', text: '0 s' })
            const id = uid('ouvrir-ram')
            const champ = el('input', {
              type: 'text',
              id,
              inputmode: lire.mode,
              autocomplete: 'off',
            })
            const valider = el('button', { type: 'button', class: 'bouton', text: 'Valider' })
            const retour = el('p', { class: 'retour', 'aria-live': 'polite' })
            const bloc = el(
              'div',
              { class: 'ex' },
              el('p', {
                class: 'discret',
                text: 'Ouverture ' + (k + 1) + ' sur ' + PAR_SERIE + ' · le chrono tourne',
              }),
              el('p', { class: 'q', text: fr(lire.consigne) }),
              temps,
              el('label', { for: id, text: lire.libelle }),
              el('div', { class: 'saisie' }, champ, valider),
              retour,
            )
            zone.replaceChildren(bloc)
            const minuteur = setInterval(() => {
              if (!n.isConnected) return void clearInterval(minuteur)
              temps.textContent = Math.floor((performance.now() - debut) / 1000) + ' s'
            }, 250)
            let termine = false
            function finir() {
              if (termine) return
              const lu = champ.value
              if (lire.mode !== 'text' && Number.isNaN(go(lu))) {
                retour.className = 'retour'
                retour.textContent = fr('Écris un nombre, comme 16 ou 15,8.')
                return
              }
              if (!lu.trim()) return
              termine = true
              clearInterval(minuteur)
              const t = (performance.now() - debut) / 1000
              plusLente = Math.max(plusLente, t)
              temps.textContent = Math.max(1, Math.round(t)) + ' s'
              champ.disabled = valider.disabled = true
              const juste = lire.juste(lu, machine)
              if (juste && t <= s) {
                justes += 1
                retour.className = 'retour bon'
                retour.textContent = fr('Juste, en ' + Math.max(1, Math.round(t)) + ' s.')
              } else {
                retour.className = 'retour faux'
                retour.textContent = fr(
                  juste
                    ? 'Juste, mais en ' + Math.round(t) + ' s : plus de ' + s + ' secondes.'
                    : 'La fiche de ta machine dit ' +
                        lire.fiche(machine) +
                        '. Relis l’outil, ou corrige ta fiche dans « Entraînement » si elle se trompe.',
                )
              }
              k += 1
              if (k === PAR_SERIE) bloc.append(finSerie())
              const suite = el('button', {
                type: 'button',
                class: 'bouton secondaire',
                text: k < PAR_SERIE ? 'Ouverture suivante' : 'Terminer la série',
              })
              suite.addEventListener('click', () => {
                if (k < PAR_SERIE) pret()
                else {
                  zone.replaceChildren()
                  lancer.hidden = false
                  lancer.focus()
                }
              })
              bloc.append(el('div', { class: 'saisie' }, suite))
              setTimeout(() => suite.focus(), 0)
            }
            valider.addEventListener('click', finir)
            champ.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') finir()
            })
          }
          lancer.addEventListener('click', () => {
            k = 0
            justes = 0
            plusLente = 0
            s = limite()
            compte = reussis.length < NIVEAUX.length && !aujourdhui()
            enCours = true
            aidee = false
            for (const d of etape ? etape.querySelectorAll('details[data-aide-aisance][open]') : [])
              aidee = true
            lancer.hidden = true
            pret()
          })
          n.append(liste, info, zone, el('div', { class: 'rangee' }, lancer))
          majInfo()
        }

        const OUTILS = {
          lancement,
          mamachine,
          pari,
          'rappel-pari': rappelPari,
          'bilan-pari': bilanPari,
          ouvrir,
        }

        /**
         * Le cas de chaque item, celui que le gabarit donne (`cas` dans `detail.pratique`), relu des
         * résultats par la règle du moteur : après une solution vue ou une aide éloignée, l'autre cas
         * (la variante, `<template data-variante>`, ou l'énoncé d'origine si c'est la variante qui a été
         * aidée) ; un item réussi revient sur le cas réussi. La boîte le dit au gabarit (`data-cas`),
         * qui l'envoie avec chaque résultat. Sans variante, l'item garde son énoncé d'origine.
         */
        const montre = {}
        function poserLaVariante() {
          for (const boite of $$('#contenu .item[data-item]')) {
            const id = boite.dataset.item
            const variante = $('template[data-variante="' + id + '"]')
            const choix = variante && pratique[id]?.cas === 'variante' ? 'variante' : 'origine'
            if (choix === 'variante')
              $('.enonce', boite).replaceChildren(variante.content.cloneNode(true))
            montre[id] = choix
            boite.dataset.cas = choix
          }
        }

        const montes = new WeakSet()
        /** L'état des items de pratique que le gabarit a noté (réussi, aide, jour), à chaque rendu. */
        let pratique = {}
        document.addEventListener('fiche:rendu', (evenement) => {
          for (const [cle, val] of Object.entries(evenement.detail?.traces ?? {})) traces[cle] = val
          pratique = evenement.detail?.pratique ?? {}
          if (Array.isArray(evenement.detail?.aisance)) aisanceServeur = evenement.detail.aisance
          poserLaVariante()
          // Les outils d'abord (le guichet décide si le pari paraît), puis les exercices.
          for (const n of $$('#contenu [data-widget]')) {
            if (montes.has(n) || !OUTILS[n.dataset.widget]) continue
            montes.add(n)
            OUTILS[n.dataset.widget](n)
          }
          for (const n of $$('#contenu .ex[data-widget]')) {
            if (montes.has(n) || !TYPES[n.dataset.widget]) continue
            montes.add(n)
            monterEx(n)
          }
          for (const ecran of $$('#contenu .ecran')) devoiler(ecran)
        })
      })()
    </script>

    <!--
      PLOMBERIE : ne pas toucher. Ce bloc est celui du gabarit, octet pour octet, comme <style id="polices">
      et <style id="styles-gabarit"> : fiches:verifier les compare, fiches:assembler --forcer les réécrit.
    -->
    <script id="plomberie">
      'use strict'
      const manifeste = JSON.parse(document.getElementById('bloc-manifest').textContent)
      const CLE_ETAT = 'janus.fiche.' + manifeste.bloc + '.etat'
      /*
       * Les quatre moments du cycle de la méthode (percevoir, tenter, modéliser, faire, recevoir un
       * retour, ajuster), dans l'ordre du fil, avec les types d'étape de chacun. `ensemble`, c'est
       * ajuster : en fin de bloc, après la pratique, le pari du début repris puis le schéma refait de
       * mémoire (règle C08). `perception`, `pretest` et `ensemble` se dessinent comme une explication
       * (afficherLibre).
       */
      const MOMENTS = [
        { nom: 'Découvrir', types: ['perception', 'carte'] },
        { nom: 'Comprendre', types: ['pretest', 'explication'] },
        { nom: 'S’entraîner', types: ['pratique', 'atelier', 'aisance', 'ensemble'] },
        { nom: 'Prouver', types: ['restitution', 'bilan'] },
      ]
      const momentDe = (etape) => MOMENTS.find((moment) => moment.types.includes(etape.type))
      /** Les types d'étape que le gabarit sait dessiner : chacun a son moment. */
      const ETAPES_FICHE = MOMENTS.flatMap((moment) => moment.types)
      /** Les étapes à lire, dessinées depuis leur `<template data-etape>`. */
      const ETAPES_LIBRES = [
        'perception',
        'pretest',
        'explication',
        'ensemble',
        'atelier',
        'aisance',
      ]
      const LIBELLES_STATUT = {
        non_commence: 'Non commencé',
        en_cours: 'En cours',
        vu: 'Vu',
        acquis_provisoirement: 'Acquis provisoirement',
        acquis: 'Acquis',
        maitrise: 'Maîtrisé',
        a_reprendre: 'À reprendre',
      }
      const etapes = manifeste.etapes.filter((etape) => ETAPES_FICHE.includes(etape.type))
      const $ = (id) => document.getElementById(id)
      $('titre').textContent = manifeste.titre
      document.title = manifeste.titre

      // --- Mode autonome : correction simulée et localStorage (sur claude.ai : Claude et localStorage) ---
      /** Un UUID v7, comme l'exige le schéma d'une correction. */
      function uuidV7() {
        const temps = Date.now().toString(16).padStart(12, '0')
        const h = Array.from(crypto.getRandomValues(new Uint8Array(12)), (o) =>
          o.toString(16).padStart(2, '0'),
        ).join('')
        const variante = (8 + (parseInt(h[3], 16) & 3)).toString(16)
        return (
          temps.slice(0, 8) +
          '-' +
          temps.slice(8) +
          '-7' +
          h.slice(0, 3) +
          '-' +
          variante +
          h.slice(4, 7) +
          '-' +
          h.slice(7, 19)
        )
      }
      /**
       * Hors de l'appli, personne ne juge le sens d'une réponse : compter des mots laisserait passer une
       * paraphrase vide. La page ne dit donc jamais « solide » : elle montre ce qui était attendu, et
       * l'apprenant compare. La correction n'est pas vérifiée, elle ne compte pas (le moteur dit de même
       * pour une certitude `non_verifie`) : la bulle porte le badge « Non vérifiée ».
       */
      /**
       * L'attendu d'une question est écrit pour le correcteur : il cite les étapes par leur numéro et les
       * erreurs critiques par leur code. Montré à l'apprenant, il dit le titre de l'étape et le nom de
       * l'erreur, qu'il connaît, à la place.
       */
      function attenduEnMots(texte) {
        const titre = (n) => manifeste.etapes.find((e) => e.id === 'ET' + n)?.titre
        const libelle = (code) =>
          (manifeste.erreurs_critiques ?? []).find((e) => e.id === code)?.libelle
        return String(texte)
          .replace(/\bl([’'])erreur (E\d+)\b/g, (tout, apostrophe, code) => {
            const nom = libelle(code)
            return nom ? 'l' + apostrophe + 'erreur «\u00a0' + nom + '\u00a0»' : tout
          })
          .replace(/(étapes?) (\d+(?:, \d+)*(?: et \d+)?)/g, (tout, mot, liste) => {
            // Les onglets n'ont pas de numéro : on nomme l'onglet, comme `etapesEnMots` côté appli.
            const noms = (liste.match(/\d+/g) ?? []).map(titre)
            if (noms.some((nom) => !nom)) return tout
            const cites = noms.map((nom) => '«\u00a0' + nom + '\u00a0»')
            const dernier = cites.pop()
            return mot + ' ' + (cites.length ? cites.join(', ') + ' et ' + dernier : dernier)
          })
      }
      function corrigerLocalement(demande) {
        const question =
          demande.serie === 'explication'
            ? (explicationDeclaree(demande.question) ?? demande.libre)
            : manifeste.restitution.find((q) => q.id === demande.question)
        const reponse = demande.reponse.trim()
        const message = (texte, niveau) => ({
          id: uuidV7(),
          echantillon: false,
          question: demande.question,
          tour: demande.relance === '' ? 1 : 2,
          niveau,
          message:
            'Correction simulée (mode autonome)\u00a0: ' +
            texte +
            (question
              ? ' Ce qui était attendu\u00a0: «\u00a0' + attenduEnMots(question.attendu) + '\u00a0»'
              : ''),
          erreurs_critiques: [],
          source: 'deduit',
          ref: 'autonome',
          certitude: 'non_verifie',
          compte: false,
          raison_non_compte: 'non_verifiee',
        })
        if (reponse.toLowerCase() === 'je ne sais pas')
          return message('pas encore. Relis la carte du bloc.', 'pas_encore')
        if (reponse.length < 40)
          return message('ta réponse est trop courte pour montrer une idée, développe.', 'fragile')
        return message(
          'la page ne juge pas le sens de ta réponse. Compare-la avec l’attendu, et complète-la avec tes mots s’il te manque une idée.',
          'partiel',
        )
      }
      const autonome = {
        ask: (demande) =>
          new Promise((resoudre) => setTimeout(() => resoudre(corrigerLocalement(demande)), 800)),
        sauver: (etat) => {
          try {
            localStorage.setItem(CLE_ETAT, JSON.stringify(etat))
          } catch {
            /* stockage indisponible */
          }
        },
        charger: () => {
          try {
            return JSON.parse(localStorage.getItem(CLE_ETAT) ?? 'null')
          } catch {
            return null
          }
        },
      }

      // --- État de la page ---
      let mode = 'autonome'
      let serieOuverte = { restitution: true }
      let etat = { etape: etapes[0].id, envoyees: {}, retourCours: false }
      const pont = window.JanusPont
      if (window.parent !== window) document.documentElement.dataset.integree = ''
      /** Le dernier statut reçu de l'appli : `manque` dit, entre autres, les erreurs encore ouvertes. */
      let dernierStatut = null
      /** Remet à jour le bouton « Étape suivante » de l'étape affichée (après une réponse envoyée). */
      let majPied = () => {}
      /** Remet à jour le bilan affiché quand un statut arrive. */
      let majBilan = () => {}
      /** Remet à jour l'item de pratique affiché quand la pratique du serveur arrive, sans le redessiner. */
      let majPratique = () => {}
      /** La tentative de l'étape `pretest` affichée : ses essais notés se figent, la série finie se corrige. */
      let majEssais = () => {}
      /** Le dernier bilan envoyé depuis cette page : son identifiant, pour reconnaître un refus. */
      let bilanEnvoye = null
      /**
       * Les séries d'aisance réussies que l'appli connaît (`etat.init`), `{ le, duree_s }` de la plus
       * ancienne à la plus récente : elles reviennent à l'outil dans `fiche:rendu` (`detail.aisance`),
       * pour qu'il relise ses niveaux même quand l'état de la page a été vidé. Vide hors de l'appli.
       */
      let aisanceServeur = []
      /*
       * La pratique : ses résultats sont sa seule mémoire. Dans l'appli, c'est le serveur qui les garde
       * (`pratique` de `etat.init`, puis de chaque `statut.maj`) ; la page relit chaque item avec la
       * règle du moteur (`JanusPratique.suivre`, embarquée dans le pont) et n'en garde aucune copie.
       * Seuls les résultats et les explications notés depuis le dernier statut attendent ici, le temps
       * que l'appli réponde. Hors de l'appli, la page est seule : ils vont dans son état
       * (`etat.pratiqueLocale`).
       */
      let pratiqueServeur = null
      const essaisEnAttente = []
      const expliquesEnAttente = new Set()

      /**
       * L'état part à l'appli tout de suite : une réponse, une trace ou un résultat ne se perd pas si
       * l'apprenant quitte la fiche juste après. Seuls les déplacements (étape, écran, item), qui
       * peuvent se suivre vite, se regroupent (`regrouper`, au plus un envoi toutes les 2 secondes).
       */
      function enregistrer({ regrouper = false } = {}) {
        pont.sauver(etat, { immediat: !regrouper })
      }
      /**
       * Les traces de la fiche : un outil émet `fiche:trace` (`detail: { cle, valeur }`) pour garder ce
       * que l'apprenant a fait sans note (un pari, une reprise, un schéma refait). Elles vont dans l'état
       * de la page, que l'appli enregistre, et reviennent à l'outil dans `fiche:rendu` (`detail.traces`).
       */
      document.addEventListener('fiche:trace', (evenement) => {
        const { cle, valeur } = evenement.detail ?? {}
        if (typeof cle !== 'string' || cle === '' || valeur === undefined) return
        etat.traces = { ...(etat.traces ?? {}), [cle]: JSON.parse(JSON.stringify(valeur)) }
        enregistrer()
      })
      /*
       * Expliquer (règle F03) : un outil émet `fiche:expliquer` sur l'exercice, avec `detail: { cle,
       * solution, consigne }`. L'IA juge l'explication comme une réponse de restitution, dans la série
       * `explication`. Une explication que le manifeste déclare (`explication`, par sa clé) se juge sur
       * son attendu, et son item n'est réussi qu'avec une explication Solide qui compte ; après deux
       * explications qui ne le sont pas, la page émet `fiche:explication-ratee` sur l'exercice : l'outil
       * montre la solution, et l'item se refait sur sa variante. Une explication que le manifeste ne
       * déclare pas (après une solution vue) se juge sur la solution de la page et ce que montre l'écran (voir `libre`), une fois, et ne compte
       * jamais ; l'outil peut lui permettre plus d'un essai (`essais`), jusqu'à une correction Solide.
       * Un outil qui a sa propre saisie (un schéma refait de mémoire) la donne dans `saisie` :
       * `{ element, lire, manque }`, l'élément à poser à la place du champ, son texte pour le
       * correcteur, et ce qui manque avant l'envoi (vide : rien) ; `envoyer` nomme le bouton, et
       * `question`, la question pour le correcteur quand la consigne de l'écran ne suffit pas ;
       * `apresSolution: false` dit qu'elle ne suit pas une solution vue (un schéma refait de mémoire) :
       * elle n'est alors pas faite avec support. Sans
       * correcteur, l'explication attend qu'on la renvoie : la page ne juge rien à la place de l'IA. Hors de l'appli, la correction est simulée et ne retient rien. La trace
       * `explique:<cle>` garde les essais et leur correction ; elle est émise quand l'explication est
       * finie, pour l'outil qui attend la suite.
       */
      const ESSAIS_D_EXPLICATION = 2
      /** Dit dès le collage ce qu'il coûte, plutôt qu'après la correction. */
      const AVERTIR_COLLE =
        'Réponse collée\u00a0: elle sera corrigée, mais ne comptera pas. Écris-la ici pour qu’elle compte.'
      const explicationDeclaree = (cle) => (manifeste.explication ?? []).find((e) => e.id === cle)
      /** L'item n'a pas d'explication à donner, ou elle est faite. */
      const explicationFaite = (item) =>
        !(manifeste.explication ?? []).some((e) => e.item === item) || itemExplique(item)
      /** Un item de pratique réussi : sa réponse, puis son explication quand il en demande une. */
      const itemReussi = (item) => itemPratique(item).etat !== 'a_faire' && explicationFaite(item)
      // Sur #contenu, qui porte tous les exercices de la page.
      $('contenu').addEventListener('fiche:expliquer', (evenement) => {
        const {
          cle,
          solution,
          consigne,
          question,
          saisie,
          essais: permis,
          envoyer,
          apresSolution,
        } = evenement.detail ?? {}
        const exercice = evenement.target
        if (!(exercice instanceof HTMLElement) || typeof cle !== 'string' || cle === '') return
        if (exercice.querySelector(':scope > .expliquer')) return
        const declaree = explicationDeclaree(cle)
        // Une explication déclarée a deux essais ; une autre, un seul, sauf si l'outil en permet plus.
        const maximum = declaree
          ? ESSAIS_D_EXPLICATION
          : Number.isInteger(permis) && permis > 0
            ? permis
            : 1
        // La page montre la consigne de l'outil ; le correcteur lit la question du manifeste, qui se
        // comprend sans l'écran. Sans consigne, l'exercice qui déclare sa demande (`data-justifier`)
        // la montre : sinon l'apprenant explique autre chose que ce que le correcteur juge.
        const intitule =
          typeof consigne === 'string' && consigne !== ''
            ? consigne
            : exercice.dataset.justifier ||
              'Explique pourquoi c’est juste, en une ou deux phrases\u00a0:'
        /*
         * Une explication libre se juge sur ce que l'écran montre : la consigne et la question de
         * l'exercice, le texte de l'écran qui le précède (la règle dont il parle), et pour l'attendu,
         * la solution avec le retour affiché (`.retour`, `.explication`), qui dit pourquoi. Sans eux, le
         * correcteur ne lit que « Oui » et ne peut rien vérifier. Avec un seul essai, il ne demande pas
         * de refaire.
         */
        const enLigne = (texte) => (texte ?? '').replace(/\s+/g, ' ').trim()
        const CONTEXTE_MAX = 1500
        const libre = () => {
          const ecran = exercice.closest('[data-ecran], .ecran')
          let avant = ''
          if (ecran) {
            const portee = document.createRange()
            portee.setStart(ecran, 0)
            portee.setEndBefore(exercice)
            avant = enLigne(portee.toString())
            if (avant.length > CONTEXTE_MAX) avant = '…' + avant.slice(-CONTEXTE_MAX)
          }
          const lire = (selecteur) => enLigne(exercice.querySelector(selecteur)?.textContent)
          const enonce = lire(':scope > .q') || lire('.q')
          const retour = [lire(':scope > .retour'), lire(':scope > .explication')]
            .filter(Boolean)
            .join(' ')
          return {
            question: [
              typeof question === 'string' && question !== '' ? question : intitule,
              enonce && 'Exercice\u00a0: ' + enonce,
              avant && 'Ce que l’écran montre avant l’exercice\u00a0: ' + avant,
              maximum === 1 &&
                'L’apprenant n’écrit qu’une explication\u00a0: dis ce qui est juste et ce qui manquait, sans lui demander de la refaire.',
            ]
              .filter(Boolean)
              .join('\n'),
            attendu: [String(solution ?? ''), retour].filter(Boolean).join(' '),
          }
        }
        // Une explication déclarée ratée a montré la solution : l'outil ne la redemande qu'une fois
        // l'item refait sans regarder, et elle repart à neuf. Sinon l'item ne pourrait plus réussir.
        const gardee = etat.traces?.['explique:' + cle]
        const ancienne = declaree && gardee?.fin === 'ratee' ? undefined : gardee
        const essais = Array.isArray(ancienne?.essais) ? ancienne.essais : []
        const zone = creer('div', { className: 'expliquer' })
        zone.setAttribute('aria-live', 'polite')
        const lue = (essai) => [
          creer('p', { className: 'explication-envoyee', textContent: essai.texte }),
          bulleCorrection(essai.correction),
          ...accordSur(essai.correction),
        ]
        /** L'explication est finie : la trace part, l'outil et l'item lisent la suite. */
        const finir = (fin) => {
          if (declaree && (fin === 'solide' || fin === 'simulee')) noterExplique(declaree.item)
          exercice.dispatchEvent(
            new CustomEvent('fiche:trace', {
              bubbles: true,
              detail: { cle: 'explique:' + cle, valeur: { essais, fin, le: aujourdhui() } },
            }),
          )
          exercice.dispatchEvent(new CustomEvent('fiche:explique', { bubbles: true }))
        }
        const formulaire = (rang) => {
          const id = 'explique-' + cle.replace(/[^\w-]/g, '_') + '-' + rang
          // L'outil peut donner sa saisie (un schéma à refaire) : la page la lit en texte.
          const champ = saisie
            ? saisie.element
            : creer('textarea', {
                id,
                rows: 3,
                value: rang === 0 && typeof ancienne?.texte === 'string' ? ancienne.texte : '',
              })
          const lireChamp = () => (saisie ? saisie.lire() : champ.value)
          let colle = false
          champ.addEventListener('paste', () => {
            colle = true
            message.textContent = AVERTIR_COLLE
          })
          // Le collage s’efface quand l’apprenant vide le champ pour écrire lui-même.
          champ.addEventListener('input', () => {
            if (!colle || lireChamp().trim() !== '') return
            colle = false
            if (message.textContent === AVERTIR_COLLE) message.textContent = ''
          })
          const radios = [
            ['sur', 'Sûr'],
            ['hesitant', 'Hésitant'],
            ['hasard', 'Au hasard'],
          ].map(([valeur, libelle]) => ({
            libelle,
            entree: creer('input', { type: 'radio', name: 'conf-' + id, value: valeur }),
          }))
          const confiance = creer(
            'fieldset',
            { className: 'choix', dataset: { lecture: '' } },
            creer('legend', { textContent: 'Ta confiance' }),
            ...radios.map(({ libelle, entree }) => creer('label', {}, entree, libelle)),
          )
          const message = creer('p', { className: 'erreur', role: 'alert' })
          const bouton = creer('button', {
            type: 'button',
            className: 'bouton secondaire petit',
            textContent:
              typeof envoyer === 'string' && envoyer !== '' ? envoyer : 'Envoyer mon explication',
          })
          const bloc = creer(
            'div',
            { className: 'expliquer-essai' },
            creer(saisie ? 'p' : 'label', {
              ...(saisie ? {} : { htmlFor: id }),
              textContent:
                rang === 0
                  ? intitule
                  : saisie
                    ? 'Reprends-le, d’après la correction\u00a0:'
                    : 'Reprends ton explication, d’après la correction\u00a0:',
            }),
            champ,
            confiance,
            creer('div', { className: 'actions' }, bouton),
            message,
          )
          bouton.addEventListener('click', async () => {
            const choisie = confiance.querySelector('input:checked')
            const manque = saisie ? saisie.manque() : ''
            if (manque) return void (message.textContent = manque)
            if (lireChamp().trim() === '')
              return void (message.textContent = 'Écris d’abord ton explication.')
            if (!choisie)
              return void (message.textContent = 'Choisis ta confiance avant d’envoyer.')
            message.textContent = ''
            bouton.disabled = true
            let support
            try {
              const correction = await pont.demanderCorrection({
                serie: 'explication',
                question: cle,
                reponse: lireChamp(),
                confiance: choisie.value,
                relance: '',
                // « Revenir au cours » ne marque que les réponses données pendant la restitution
                // commencée : pas une explication de la pratique faite après, la série finie.
                support: (support = {
                  colle,
                  retour_cours: etat.retourCours && serieEnCours() !== undefined,
                }),
                // Une explication libre suit une solution vue (avec support), sauf quand l'outil dit
                // le contraire (`apresSolution: false`, un schéma refait de mémoire).
                ...(declaree
                  ? {}
                  : {
                      libre: {
                        ...libre(),
                        ...(apresSolution === false ? { apres_solution: false } : {}),
                      },
                    }),
              })
              noterReperees('explique:' + cle, correction.erreurs_critiques)
              essais.push({ texte: lireChamp(), correction: resumeCorrection(correction, support) })
              const fin =
                mode === 'autonome'
                  ? 'simulee'
                  : !declaree
                    ? correction.niveau === 'solide' || essais.length >= maximum
                      ? 'jugee'
                      : null
                    : correction.niveau === 'solide' && correction.compte
                      ? 'solide'
                      : essais.length >= maximum
                        ? 'ratee'
                        : null
              if (fin === null) {
                etat.traces = {
                  ...(etat.traces ?? {}),
                  ['explique:' + cle]: { essais, fin, le: aujourdhui() },
                }
                enregistrer()
              } else finir(fin)
              // La correction affichée est celle que la trace garde : l'avis demandé s'y enregistre.
              const gardees = etat.traces['explique:' + cle].essais
              bloc.replaceWith(...lue(gardees[gardees.length - 1]))
              if (fin === null) zone.append(formulaire(rang + 1))
              if (fin === 'ratee') {
                const raison =
                  (correction.niveau === 'solide'
                    ? 'Ton explication est Solide, mais elle ne compte pas'
                    : 'Ton explication n’est pas encore Solide') +
                  '\u00a0: voici la solution de l’item, puis tu le refais sur un autre cas.'
                zone.append(creer('p', { className: 'discret', textContent: raison }))
                exercice.dispatchEvent(
                  new CustomEvent('fiche:explication-ratee', {
                    bubbles: true,
                    detail: { message: raison },
                  }),
                )
              }
            } catch (erreur) {
              message.textContent =
                'Correction impossible\u00a0: ' +
                (erreur && erreur.detail ? erreur.detail : erreur.message) +
                ' Ton explication attend\u00a0: renvoie-la.'
              bouton.disabled = false
            }
          })
          return bloc
        }
        if (essais.length > 0) zone.append(creer('p', { textContent: intitule }))
        for (const essai of essais) zone.append(...lue(essai))
        if (ancienne?.fin === undefined || ancienne.fin === null)
          zone.append(formulaire(essais.length))
        exercice.append(zone)
        // De retour sur la page, l'outil qui attend la fin de l'explication la relit.
        if (typeof ancienne?.fin === 'string' && ancienne.fin !== 'ratee') {
          exercice.dispatchEvent(
            new CustomEvent('fiche:trace', {
              bubbles: true,
              detail: { cle: 'explique:' + cle, valeur: ancienne },
            }),
          )
        }
      })
      /*
       * La tentative avant l'explication (règles C03 et M01) : dans une étape `pretest`, chaque exercice
       * `data-essai` (avec son `data-id`) émet `fiche:essai`, avec `detail: { cle, reponse, juste,
       * attendu, retour }`. La page garde la première réponse (trace `essai:<cle>`), l'envoie une fois à
       * l'appli (`pretest.reponse`), ne dit ni juste ni faux, et corrige toute la série à la fin de
       * l'étape, sous « Tes essais ». « Je ne sais pas » est une réponse : la page émet
       * `fiche:essai-passe` sur l'exercice, et l'outil y répond par `fiche:essai`, sa réponse attendue
       * avec ; sans outil qui réponde, la page lit l'attendu dans les attributs de l'exercice.
       */
      document.addEventListener('fiche:essai', (evenement) => {
        const { cle, reponse, juste, attendu, retour } = evenement.detail ?? {}
        if (typeof cle !== 'string' || cle === '' || etat.traces?.['essai:' + cle]) return
        noterEssai(cle, {
          reponse: typeof reponse === 'string' && reponse.trim() !== '' ? reponse.trim() : null,
          juste: juste === true,
          attendu: typeof attendu === 'string' ? attendu : '',
          retour: typeof retour === 'string' ? retour : '',
          vue: vueDeLEssai(evenement.target),
        })
      })
      /**
       * Ce que l'apprenant voyait en répondant, pour le lui remontrer au retour sur la page : la valeur
       * de chaque champ, et chaque bouton enfoncé (son rang et son texte, un bouton déplacé ne se
       * rallume pas à tort).
       */
      function vueDeLEssai(ex) {
        if (!(ex instanceof Element)) return undefined
        return {
          champs: Array.from(ex.querySelectorAll('input, textarea'), (c) => c.value),
          enfonces: Array.from(ex.querySelectorAll('button'))
            .map((b, k) => [k, b.textContent.trim(), b.getAttribute('aria-pressed')])
            .filter(([, , presse]) => presse === 'true')
            .map(([k, texte]) => [k, texte]),
        }
      }
      function remontrerEssai(ex, essai) {
        const vue = essai.vue
        if (vue) {
          const champs = ex.querySelectorAll('input, textarea')
          if (Array.isArray(vue.champs) && vue.champs.length === champs.length)
            champs.forEach((c, k) => {
              if (c.value === '' && typeof vue.champs[k] === 'string') c.value = vue.champs[k]
            })
          const boutons = ex.querySelectorAll('button')
          for (const [k, texte] of Array.isArray(vue.enfonces) ? vue.enfonces : [])
            if (boutons[k]?.textContent.trim() === texte)
              boutons[k].setAttribute('aria-pressed', 'true')
        }
        if (essai.reponse === null) return
        // Une option mélangée change de rang : elle se retrouve par son texte.
        for (const b of ex.querySelectorAll('.options button'))
          if (b.textContent.trim() === essai.reponse) b.setAttribute('aria-pressed', 'true')
        if (vue) return
        // Un essai noté avant que la page ne garde sa vue : son champ unique reprend la réponse.
        const champs = ex.querySelectorAll(
          'input:not([type]), input[type="text"], input[type="number"], textarea',
        )
        if (champs.length === 1 && champs[0].value === '') champs[0].value = essai.reponse
      }
      function noterEssai(cle, essai) {
        etat.traces = { ...(etat.traces ?? {}), ['essai:' + cle]: { ...essai, le: aujourdhui() } }
        pont.envoyer('pretest.reponse', {
          question: cle,
          reponse: (essai.reponse ?? 'Je ne sais pas').slice(0, 2000),
        })
        enregistrer()
        majEssais()
        rappelerEssais($('contenu'))
      }
      /**
       * Une explication qui part des essais (règle C03) : `data-essai-rappel="c2"` affiche la réponse
       * notée à l'essai c2 (son texte reste tant qu'il n'y en a pas) ; `data-si-essai="c2:faux"` ne
       * montre l'élément que si l'essai c2 est dans cet état : `juste`, `faux`, `passe` (« Je ne sais
       * pas ») ou `absent` (pas encore fait), plusieurs séparés par `|`.
       */
      function rappelerEssais(racine) {
        for (const el of racine.querySelectorAll('[data-essai-rappel]')) {
          const essai = etat.traces?.['essai:' + el.dataset.essaiRappel]
          if (essai?.reponse) el.textContent = entreGuillemets(essai.reponse)
        }
        for (const el of racine.querySelectorAll('[data-si-essai]')) {
          const [cle, etats = ''] = el.dataset.siEssai.split(':')
          const essai = etat.traces?.['essai:' + cle]
          const etatEssai = !essai
            ? 'absent'
            : essai.reponse === null
              ? 'passe'
              : essai.juste
                ? 'juste'
                : 'faux'
          el.hidden = !etats.split('|').includes(etatEssai)
        }
      }
      /** Ce qu'un exercice attend, quand aucun outil ne le dit : l'option juste, la solution, la réponse. */
      function attenduEcrit(ex) {
        const juste = ex.dataset.reponse
        const option = juste
          ? Array.from(ex.querySelectorAll('[data-option]')).find((o) => o.dataset.option === juste)
          : undefined
        return (option?.textContent ?? ex.dataset.solution ?? juste ?? '')
          .replace(/\s+/g, ' ')
          .trim()
      }
      /** Une réponse citée : sans point final, et sans doubler des guillemets qu'elle porte déjà. */
      function entreGuillemets(texte) {
        const t = texte.replace(/[.;\s]+$/, '')
        return /^«.*»$/.test(t) ? t : '« ' + t + ' »'
      }
      /** L'énoncé d'un essai, avec la question de son groupe quand il en fait partie (« 1 lampe »). */
      function enonceEssai(ex) {
        const propre = ex.querySelector('.q')?.textContent ?? ''
        const groupe = ex.closest('.groupe')?.querySelector(':scope > .q')?.textContent
        return ((groupe ? groupe + ' ' : '') + propre).replace(/\s+/g, ' ').trim()
      }
      function essaisDe(section) {
        const exercices = Array.from(section.querySelectorAll('[data-essai][data-id]'))
        const essais = exercices.map((ex) => etat.traces?.['essai:' + ex.dataset.id])
        exercices.forEach((ex, k) => {
          const essai = essais[k]
          const passer = ex.querySelector(':scope > .essai-passe')
          // Un essai ne se vérifie pas sur le moment : son bouton dit ce qu'il fait, il garde la réponse.
          for (const b of ex.querySelectorAll('button'))
            if (b.textContent.trim() === 'Vérifier') b.textContent = 'Enregistrer'
          if (!essai) {
            if (passer) return
            const bouton = creer('button', {
              type: 'button',
              className: 'bouton secondaire petit',
              textContent: 'Je ne sais pas',
              onclick: () => {
                const cle = ex.dataset.id
                ex.dispatchEvent(new CustomEvent('fiche:essai-passe'))
