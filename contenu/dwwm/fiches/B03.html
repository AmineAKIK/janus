        --couleur-accent-sur-fond: light-dark(#ffffff, #0f1a28);
        --couleur-accent-douce: light-dark(#e8eff8, #1f2b3a);
        --couleur-succes: light-dark(#276f50, #5dc196);
        --couleur-alerte: light-dark(#95620a, #e0ac4a);
        --couleur-erreur: light-dark(#ae3846, #ee8591);
        --couleur-focus: light-dark(#2b6cb0, #8bb9f5);
        --effet-ombre-carte: light-dark(#1b1f24, #000000);
        --espacement-4: 0.25rem;
        --espacement-8: 0.5rem;
        --espacement-12: 0.75rem;
        --espacement-16: 1rem;
        --espacement-20: 1.25rem;
        --espacement-24: 1.5rem;
        --espacement-32: 2rem;
        --espacement-48: 3rem;
        --rayon-champ: 0.625rem;
        --rayon-carte: 0.875rem;
        --rayon-option: 0.375rem;
        --duree-transition: 160ms;
        --focus-anneau: 0 0 0 2px var(--couleur-fond), 0 0 0 4px var(--couleur-focus);
        --ombre-option: 0 2px 6px color-mix(in srgb, var(--effet-ombre-carte) 8%, transparent);
        --hauteur-champ: 48px;
        --hauteur-bouton: 48px;
        --cible-tactile-min: 44px;
        --largeur-lecture: 62ch;
        --police-texte: 'Inter', system-ui, sans-serif;
        --police-code: 'JetBrains Mono', ui-monospace, monospace;
      }
      /* Le thème choisi dans l'appli (message etat.init) l'emporte sur le réglage du téléphone. */
      :root[data-theme='clair'] {
        color-scheme: light;
      }
      :root[data-theme='sombre'] {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: var(--couleur-fond);
        color: var(--couleur-encre);
        font-family: var(--police-texte);
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5rem;
      }
      button,
      summary,
      label {
        touch-action: manipulation;
      }

      /* Barre et fil d'étapes : montrés seulement hors de l'appli (aperçu), qui a les siens. */
      .barre {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8) var(--espacement-12);
        min-height: 56px;
        padding: var(--espacement-8) var(--espacement-16);
        background: var(--couleur-surface);
        border-block-end: 1px solid var(--couleur-ligne);
      }
      .barre h1 {
        flex: 1 1 140px;
        min-width: 0;
        margin: 0;
        font-size: 1rem;
        font-weight: 500;
        line-height: 1.5rem;
      }
      .barre p {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8);
        margin: 0;
      }
      .mode {
        padding: 2px var(--espacement-8);
        border-radius: var(--rayon-option);
        background: var(--couleur-surface-douce);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .fil {
        background: var(--couleur-surface);
        border-block-end: 1px solid var(--couleur-ligne);
      }
      .bascule {
        display: none;
      }
      .etapes,
      .moment > ol {
        display: flex;
        flex-wrap: wrap;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .etapes {
        gap: var(--espacement-4) var(--espacement-16);
        justify-content: center;
        padding: 0 var(--espacement-12);
      }
      /* Un moment du cycle : son nom, puis ses étapes ; celui de l'étape courante prend l'accent. */
      .moment {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0 var(--espacement-4);
      }
      .moment > ol {
        gap: 0 var(--espacement-4);
      }
      .moment-nom {
        padding: 0 var(--espacement-8);
        color: var(--couleur-texte-discret);
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .moment[data-courant='oui'] > .moment-nom {
        color: var(--couleur-accent);
      }
      .onglet {
        position: relative;
        min-height: 44px;
        padding: 0 var(--espacement-12);
        border: 0;
        background: transparent;
        color: var(--couleur-texte-secondaire);
        font: inherit;
        font-size: 0.875rem;
        line-height: 1.25rem;
        white-space: nowrap;
        cursor: pointer;
      }
      .onglet:hover {
        color: var(--couleur-encre);
      }
      .onglet:focus-visible {
        outline: none;
        border-radius: var(--rayon-champ);
        box-shadow: var(--focus-anneau);
      }
      .onglet[aria-current='step'] {
        color: var(--couleur-accent);
        font-weight: 500;
      }
      .onglet[aria-current='step']::after {
        position: absolute;
        inset-block-end: 0;
        inset-inline: var(--espacement-12);
        block-size: 2px;
        background: var(--couleur-accent);
        content: '';
      }
      @media (max-width: 40rem) {
        .bascule {
          display: flex;
          align-items: center;
          justify-content: space-between;
          inline-size: 100%;
          min-height: 48px;
          padding: 0 var(--espacement-16);
          border: 0;
          background: transparent;
          color: var(--couleur-accent);
          font: inherit;
          font-size: 0.875rem;
          font-weight: 500;
          line-height: 1.25rem;
          cursor: pointer;
        }
        .fil[data-ouvert='false'] .etapes {
          display: none;
        }
        .etapes {
          flex-direction: column;
          gap: var(--espacement-4);
          justify-content: flex-start;
          padding-block-end: var(--espacement-8);
        }
        .moment,
        .moment > ol {
          flex-direction: column;
          align-items: stretch;
        }
        .moment-nom {
          padding: var(--espacement-8) var(--espacement-12) 0;
        }
        .onglet {
          inline-size: 100%;
          text-align: start;
        }
        .onglet[aria-current='step']::after {
          display: none;
        }
      }
      /* Dans l'appli, la barre et le fil d'étapes sont ceux de la page : la fiche n'en montre pas un second. */
      html[data-integree] .barre,
      html[data-integree] .fil {
        display: none;
      }
      html[data-integree] section > h2 {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /*
       * Dans l'appli, l'iframe prend la hauteur du contenu (message page.taille) : la fiche ne défile
       * pas seule. Elle se pose sur le fond de la page, ses cartes ont la largeur de celle du haut.
       */
      html[data-integree] {
        scrollbar-width: none;
      }
      html[data-integree]::-webkit-scrollbar {
        display: none;
      }
      html[data-integree] body {
        background: transparent;
      }
      html[data-integree] main {
        max-width: none;
        padding: 0;
      }

      /* Page : une colonne, des cartes séparées par le même intervalle que dans l'appli. */
      main {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-16);
        max-width: 760px;
        margin: 0 auto;
        padding: var(--espacement-16) var(--espacement-16) var(--espacement-48);
      }
      /* Une erreur de l'appli : la barre est cachée dans l'appli, l'avis passe au-dessus de l'étape. */
      .avis {
        margin: 0;
        padding: var(--espacement-12) var(--espacement-16);
        border: 1px solid var(--couleur-erreur);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface);
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      #contenu {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-16);
        min-width: 0;
      }
      section {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
        padding: var(--espacement-20);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-carte);
        background: var(--couleur-surface);
      }
      /* Les blocs d'une carte s'espacent par le gap, jamais par des marges qui se cumulent. */
      section :is(h2, h3, h4, p, ul, ol, dl, figure, blockquote, pre, fieldset) {
        margin: 0;
      }
      .ecran,
      .enonce {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
      }
      .ecran[hidden],
      .bouton[hidden],
      [data-si-essai][hidden] {
        display: none;
      }
      h2 {
        font-size: 1.375rem;
        font-weight: 600;
        line-height: 1.75rem;
        text-wrap: balance;
      }
      h3 {
        font-size: 1.125rem;
        font-weight: 600;
        line-height: 1.625rem;
        text-wrap: balance;
      }
      h4 {
        font-size: 1rem;
        font-weight: 600;
      }
      p,
      li {
        overflow-wrap: break-word;
      }
      .ecran p,
      .ecran li {
        max-width: var(--largeur-lecture);
      }
      .ecran .accroche {
        font-size: 1.125rem;
        line-height: 1.75rem;
      }
      ul,
      ol {
        padding-inline-start: var(--espacement-20);
      }
      /* Seulement les listes du contenu : le fil d'étapes et les autres listes d'interface ont leur propre gap. */
      section :is(ul, ol) > li + li {
        margin-top: var(--espacement-8);
      }
      ul.plain {
        padding-inline-start: var(--espacement-20);
      }
      .discret {
        color: var(--couleur-texte-secondaire);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      a {
        color: var(--couleur-encre);
        font-weight: 500;
        text-decoration: none;
        transition: color var(--duree-transition);
      }
      a:hover {
        color: var(--couleur-accent);
      }
      code,
      kbd {
        font-family: var(--police-code);
        font-size: 0.875em;
        font-variant-ligatures: none;
      }
      code {
        padding: 1px var(--espacement-4);
        border-radius: var(--rayon-option);
        background: var(--couleur-surface-douce);
      }
      pre {
        overflow-x: auto;
        padding: var(--espacement-12);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      pre code {
        padding: 0;
        background: none;
      }

      /* Boutons : Bouton.module.css (principal, secondaire). */
      button {
        font: inherit;
      }
      .bouton {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--espacement-8);
        min-height: var(--hauteur-bouton);
        min-width: var(--cible-tactile-min);
        padding: 0 var(--espacement-16);
        border: 1px solid transparent;
        border-radius: var(--rayon-champ);
        background: var(--couleur-accent);
        color: var(--couleur-accent-sur-fond);
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color var(--duree-transition) ease,
          border-color var(--duree-transition) ease,
          transform var(--duree-transition) ease;
      }
      .bouton:hover:not(:disabled) {
        background: color-mix(in srgb, var(--couleur-accent) 88%, var(--couleur-encre));
      }
      .bouton:active:not(:disabled) {
        background: color-mix(in srgb, var(--couleur-accent) 75%, var(--couleur-encre));
        transform: translateY(1px);
      }
      .bouton.secondaire {
        border-color: var(--couleur-controle);
        background: transparent;
        color: var(--couleur-encre);
      }
      .bouton.secondaire:hover:not(:disabled) {
        background: var(--couleur-surface-douce);
      }
      .bouton.secondaire:active:not(:disabled) {
        border-color: var(--couleur-accent);
        background: var(--couleur-surface-douce);
      }
      .bouton:focus-visible {
        outline: none;
        box-shadow: var(--focus-anneau);
      }
      .bouton:disabled {
        border-color: transparent;
        background: var(--couleur-surface-douce);
        color: var(--couleur-encre);
        opacity: 0.55;
        cursor: not-allowed;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-8);
      }
      @media (prefers-reduced-motion: reduce) {
        .bouton,
        a {
          transition: none;
        }
        .bouton:active:not(:disabled) {
          transform: none;
        }
      }

      /* Champs : ChampTexte, ZoneDeTexte, Selecteur. */
      textarea,
      input[type='text'],
      select {
        width: 100%;
        min-height: var(--hauteur-champ);
        padding: 0 var(--espacement-12);
        border: 1px solid var(--couleur-controle);
        border-radius: var(--rayon-champ);
        background-color: var(--couleur-fond);
        color: var(--couleur-encre);
        font: inherit;
        transition: border-color var(--duree-transition) ease;
      }
      input[type='text'] {
        width: auto;
        font-family: var(--police-code);
        font-variant-ligatures: none;
      }
      textarea {
        min-height: 7rem;
        padding: var(--espacement-12);
        resize: vertical;
        field-sizing: content;
      }
      .reponse-envoyee {
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      textarea:disabled,
      input:disabled {
        background-color: var(--couleur-surface-douce);
        opacity: 0.65;
      }
      textarea:focus-visible,
      input[type='text']:focus-visible,
      select:focus-visible {
        outline: none;
        border-color: var(--couleur-accent);
        box-shadow: var(--focus-anneau);
      }
      select {
        padding-inline-end: var(--espacement-32);
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, currentcolor 50%),
          linear-gradient(135deg, currentcolor 50%, transparent 50%);
        background-position:
          calc(100% - 1.125rem) 50%,
          calc(100% - 0.8125rem) 50%;
        background-repeat: no-repeat;
        background-size:
          0.3125rem 0.3125rem,
          0.3125rem 0.3125rem;
      }
      /* Une question : sa carte propre, sur le fond de la carte de l'étape. */
      .item {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
        padding: var(--espacement-16);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      .item > label,
      .relance > label {
        font-weight: 500;
      }
      /* Le complément d'une réponse, après sa correction, dans la carte de la question. */
      .relance {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
      }
      .item[data-fait='oui'] {
        border-color: var(--couleur-succes);
      }
      /* Une question à reprendre : la couleur du statut « À reprendre » de l'appli. */
      .item[data-fait='reprise'] {
        border-color: var(--couleur-erreur);
      }
      .item-reprise {
        margin: 0;
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1.25rem;
      }
      .erreur {
        margin: 0;
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .erreur:empty {
        display: none;
      }

      /* Confiance : GroupeSegmente. */
      fieldset {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-8);
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }
      legend {
        float: left;
        width: 100%;
        padding: 0;
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1.25rem;
        color: var(--couleur-texte-secondaire);
      }
      .choix label {
        position: relative;
        display: flex;
        flex: 1 0 auto;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding-inline: var(--espacement-8);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-option);
        background: var(--couleur-fond);
        white-space: nowrap;
        cursor: pointer;
      }
      /* La vraie radio couvre l'option et déborde du cadre : la zone tactile fait au moins 44 px. */
      .choix input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .choix label:has(input:checked) {
        border-color: var(--couleur-accent);
        background: var(--couleur-accent);
        box-shadow: var(--ombre-option);
        color: var(--couleur-accent-sur-fond);
        font-weight: 600;
      }
      .choix label:has(input:focus-visible) {
        box-shadow: var(--focus-anneau);
      }
      .choix label:has(input:disabled) {
        opacity: 0.65;
        cursor: not-allowed;
      }
      /* Une table de vérité à remplir : les faits donnés, puis VRAI ou FAUX à choisir dans chaque case. */
      .table-saisie {
        display: table;
        width: 100%;
        white-space: normal;
      }
      .table-saisie th,
      .table-saisie td {
        padding: var(--espacement-4);
        text-align: center;
        vertical-align: middle;
      }
      .table-saisie td.entree {
        color: var(--couleur-texte-secondaire);
      }
      .table-saisie td.valeur {
        font-weight: 600;
      }
      .table-saisie .choix {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-4);
      }
      .table-saisie .choix label {
        min-height: 44px;
        padding-inline: var(--espacement-4);
      }

      /* L'option choisie d'un essai : marquée, la correction viendra à la fin de l'étape. */
      [data-essai] button[aria-pressed='true']:disabled {
        border-color: var(--couleur-accent);
        background: var(--couleur-accent-douce);
        color: var(--couleur-encre);
        font-weight: 600;
        opacity: 1;
      }
      [data-essai] .options button[aria-pressed='true']::after {
        content: ' · ta réponse';
        color: var(--couleur-accent);
        font-weight: 600;
      }

      /* Correction : BulleCorrection. */
      .correction {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        padding: var(--espacement-20);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-carte);
        background: var(--couleur-surface);
      }
      .correction > strong {
        display: flex;
        align-items: center;
        gap: var(--espacement-8);
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.25rem;
        color: var(--couleur-texte-secondaire);
      }
      .correction > strong::before {
        flex: none;
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: currentcolor;
        content: '';
      }
      .correction[data-niveau='solide'] > strong {
        color: var(--couleur-succes);
      }
      .correction[data-niveau='partiel'] > strong {
        color: var(--couleur-alerte);
      }
      .correction[data-niveau='fragile'] > strong {
        color: var(--couleur-erreur);
      }
      .correction p {
        margin: 0;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      /* Sous la question : la correction, puis l'accord sur le niveau quand elle est tirée au sort. */
      .sortie {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
      }
      .sortie:empty {
        display: none;
      }
      .accord {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8) var(--espacement-12);
      }
      /* BadgeNeComptePas de l'appli : une réponse qui ne compte pas pour le statut, et pourquoi. */
      .badge-compte {
        display: inline-flex;
        align-items: center;
        align-self: flex-start;
        min-height: 1.75rem;
        padding: 0 var(--espacement-12);
        border: 1px solid var(--couleur-ligne);
        border-radius: 999px;
        background: var(--couleur-surface-douce);
        color: var(--couleur-texte-secondaire);
        font-size: 0.75rem;
        font-weight: 500;
        line-height: 1rem;
        white-space: nowrap;
      }

      /* Détails repliables ; l'objectif d'examen replié (carte, pratique) en est un. */
      details {
        padding: 0 var(--espacement-16);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      details[open] {
        padding-block-end: var(--espacement-12);
      }
      details > :not(summary) {
        margin-block-start: var(--espacement-12);
      }
      details > summary + * {
        margin-block-start: var(--espacement-4);
      }
      summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--espacement-12);
        min-height: 48px;
        font-weight: 500;
        list-style: none;
        cursor: pointer;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::after {
        flex: none;
        width: 0.5rem;
        height: 0.5rem;
        border-inline-end: 2px solid var(--couleur-texte-secondaire);
        border-block-end: 2px solid var(--couleur-texte-secondaire);
        transform: rotate(45deg) translate(-2px, -2px);
        transition: transform var(--duree-transition) ease;
        content: '';
      }
      details[open] > summary::after {
        transform: rotate(-135deg) translate(-2px, -2px);
      }
      summary:focus-visible {
        outline: none;
        border-radius: var(--rayon-champ);
        box-shadow: var(--focus-anneau);
      }

      .defile {
        max-width: 100%;
        overflow-x: auto;
      }

      /* Le schéma du bloc : les boîtes en colonne, une flèche légendée entre deux ; celles que l'étape n'éclaire pas encore restent pâles. */
      .schema-bloc {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: var(--espacement-4);
      }
      .schema-bloc .fleche {
        display: flex;
        align-items: baseline;
        gap: var(--espacement-8);
        padding-inline: var(--espacement-12);
        line-height: 1.25rem;
      }
      .schema-bloc .boite-fixe.eteinte {
        border-color: var(--couleur-ligne);
        color: var(--couleur-texte-discret);
      }
      .schema-bloc .boite-fixe.eteinte small {
        color: var(--couleur-texte-discret);
      }
      .schema-bloc .fleche::before {
        content: '↓';
        flex: none;
        color: var(--couleur-accent);
      }

      /* La machine de Yasmine : quatre boîtes et trois flèches sur une ligne (sept colonnes) ; empilées sous 720 px. */
      .machine {
        display: grid;
        grid-template-columns:
          minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr) auto
          minmax(0, 1fr);
        align-items: stretch;
        gap: var(--espacement-8);
      }
      .composant {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-4);
        min-width: 0;
        padding: var(--espacement-8);
        border: 1px solid var(--couleur-accent);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface);
      }
      section .composant > p + p {
        margin-top: 0;
      }
      section .nom-composant {
        font-size: 0.875rem;
        line-height: 1.25rem;
        font-weight: 600;
      }
      section .etat-composant {
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      section .echange {
        padding: var(--espacement-4) var(--espacement-8);
        border-radius: var(--rayon-champ);
        background: var(--couleur-erreur-douce);
        color: var(--couleur-encre);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .fleche-composant {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: min-content;
        margin-inline: auto;
        color: var(--couleur-texte-secondaire);
        font-size: 0.8125rem;
        line-height: 1rem;
        text-align: center;
      }
      .composant .mono {
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .fleche-composant::after {
        content: '→';
      }
      .composant progress,
      .jauges progress {
        width: 100%;
        height: 0.75rem;
        accent-color: var(--couleur-accent);
      }
      .journal {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-4);
        padding-inline-start: var(--espacement-20);
        color: var(--couleur-texte-secondaire);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .journal:empty {
        display: none;
      }
      section .journal > li + li {
        margin-top: 0;
      }
      @media (max-width: 720px) {
        .machine {
          grid-template-columns: minmax(0, 1fr);
        }
        .fleche-composant {
          width: auto;
        }
        .fleche-composant::after {
          content: '↓';
        }
      }

      /* Un écran de Windows ou de macOS, recopié : sa barre de titre, puis ses valeurs. */
      .ecran-simule {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
        padding: var(--espacement-12) var(--espacement-16) var(--espacement-16);
        border: 1px solid var(--couleur-controle);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      section .ecran-simule > * + * {
        margin-top: 0;
      }
      section .titre-simule {
        margin-inline: calc(-1 * var(--espacement-16));
        margin-top: calc(-1 * var(--espacement-12));
        padding: var(--espacement-8) var(--espacement-16);
        border-bottom: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ) var(--rayon-champ) 0 0;
        background: var(--couleur-surface-douce);
        font-weight: 600;
      }
      .panneaux-simules {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
        gap: var(--espacement-12);
      }
      .panneau-simule {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-4);
        min-width: 0;
      }
      section .sous-titre-simule {
        font-weight: 600;
      }
      .ecran-simule dl {
        display: flex;
        flex-direction: column;
        margin: 0;
      }
      .ecran-simule dl > div {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 0 var(--espacement-12);
        padding: 2px 0;
        border-bottom: 1px solid var(--couleur-ligne);
      }
      .ecran-simule dt {
        color: var(--couleur-texte-secondaire);
      }
      .ecran-simule dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
        font-weight: 500;
      }
      .jauges {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-8);
        padding: 0;
        list-style: none;
      }
      section .jauges > li + li {
        margin-top: 0;
      }
      .jauges > li {
        display: grid;
        grid-template-columns: 7.5rem minmax(0, 1fr) 3rem;
        align-items: center;
        gap: var(--espacement-8);
        font-variant-numeric: tabular-nums;
      }

      /* La page de téléchargement : une version par famille de processeurs et par système. */
      .telechargement {
        display: flex;
        padding: 0;
        list-style: none;
        flex-wrap: wrap;
        gap: var(--espacement-8);
      }
      .version {
        padding: var(--espacement-8) var(--espacement-12);
        border: 1px solid var(--couleur-controle);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface);
        font-size: 0.875rem;
        font-weight: 500;
      }

      section .telechargement > li + li {
        margin-top: 0;
      }

      /* Un compte posé en colonne. */
      pre.calcul {
        max-width: 100%;
        overflow-x: auto;
        padding: var(--espacement-12) var(--espacement-16);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface-douce);
        font-family: var(--police-code);
        font-size: 0.875rem;
        line-height: 1.375rem;
        font-variant-ligatures: none;
        font-variant-numeric: tabular-nums;
      }

      /* La fiche de ta machine : un champ par ligne, puis le bilan. */
      .fiche-machine {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
      }
      .ligne-machine {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-4) var(--espacement-12);
      }
      .ligne-machine > label {
        flex: 1 1 12rem;
        min-width: 0;
      }
      .ligne-machine input[type='text'],
      .ligne-machine select {
        flex: 1 1 10rem;
        min-width: 0;
        max-width: 16rem;
      }
      .case-machine {
        display: inline-flex;
        align-items: center;
        gap: var(--espacement-8);
        min-height: var(--cible-tactile-min);
        font-size: 0.875rem;
      }
      .case-machine input {
        width: 1.25rem;
        height: 1.25rem;
        accent-color: var(--couleur-accent);
      }
      .bilan-machine {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-8);
        padding-inline-start: var(--espacement-20);
      }
      .bilan-machine:empty {
        display: none;
      }
      section .bilan-machine > li + li {
        margin-top: 0;
      }
      .bilan-machine > li:last-child {
        font-weight: 600;
      }

      /* L'aisance : les trois niveaux, la série en cours. */
      .niveaux {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-8);
        padding: 0;
        list-style: none;
      }
      section .niveaux > li + li {
        margin-top: 0;
      }
      .niveaux > li {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: var(--espacement-4) var(--espacement-16);
        padding: var(--espacement-8) var(--espacement-12);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
      }
      .niveaux > li.courant {
        border-color: var(--couleur-accent);
        background: var(--couleur-accent-douce);
      }
      .etat {
        font-size: 0.875rem;
        font-weight: 600;
      }
      .etat.solide {
        color: var(--couleur-succes);
      }
      .etat.attente {
        color: var(--couleur-texte-secondaire);
      }
      .zone-vitesse:empty {
        display: none;
      }
      .temps {
        font-variant-numeric: tabular-nums;
        font-size: 1.5rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header class="barre">
      <h1 id="titre"></h1>
      <p>
        <span id="mode" class="mode" role="status">Connexion à l’appli…</span>
        <span id="statut" class="discret"></span>
      </p>
    </header>
    <nav class="fil" id="fil" aria-label="Étapes de la fiche" data-ouvert="false">
      <button
        type="button"
        class="bascule"
        id="bascule"
        aria-expanded="false"
        aria-controls="etapes"
      ></button>
      <ol id="etapes" class="etapes"></ol>
    </nav>
    <main>
      <p id="avis" class="avis" role="alert" hidden></p>
      <div id="contenu"></div>
    </main>

    <!-- ET1, perception : le portable de Yasmine lance VS Code, puis ouvre des onglets jusqu'à 30. -->
    <template data-etape="ET1">
      <p class="accroche">
        Yasmine, 34 ans, apprend le développement web sur le portable que lui a donné son frère.
        Elle lance VS Code, le logiciel où elle écrit son code, puis ouvre des onglets dans son
        navigateur. Regarde ce qui se passe dans l’ordinateur.
      </p>
      <div class="cadre pour-lire">
        <p class="discret">Le portable de Yasmine, pour lire :</p>
        <ul>
          <li>Un disque dur de 1 To.</li>
          <li>La RAM : 8 Go.</li>
          <li>Un processeur à 4 cœurs, annoncé à 1,6 GHz.</li>
        </ul>
      </div>
      <div
        class="outil"
        data-widget="lancement"
        data-ram="8"
        data-disque="hdd"
        data-perception
        data-lecture="Le portable de Yasmine, en trois boîtes : le disque dur, la RAM, le processeur et la carte graphique. Un bouton lance VS Code ; un autre ouvre 5 onglets de plus, jusqu’à 30. Une jauge montre la RAM occupée, et une phrase dit ce qui se voit."
      >
        <p class="outil-titre">Le portable de Yasmine</p>
      </div>
      <p>
        Ce que montre le portable quand Yasmine lance VS Code : le disque dur travaille une dizaine
        de secondes, la RAM occupée passe de 3 000 à 4 000 Mo, puis le processeur exécute VS Code.
      </p>
      <div
        data-widget="pari"
        class="ex"
        hidden
        data-apres="Garde ta réponse en tête, et ouvre maintenant les onglets, 5 par 5. Les étapes suivantes expliquent ce que tu vois."
      >
        <p class="q">
          Yasmine va ouvrir 30 onglets, et son portable va ramer. À ton avis, que faudrait-il
          changer en premier pour qu’il reste rapide ?
        </p>
        <ul class="options">
          <li data-option="ghz">Un processeur avec plus de GHz</li>
          <li data-option="ram">Plus de RAM</li>
          <li data-option="disque">Un disque dur plus grand</li>
        </ul>
      </div>
      <p>
        Puis les onglets : chaque onglet ajoute environ 150 Mo de RAM occupée. À 25 onglets, tout
        reste rapide ; à 30, tout ralentit.
      </p>
    </template>

    <!-- ET2, carte : où est le bloc dans la partie La machine, à quoi il sert, ce que l'apprenant saura faire. -->
    <template data-etape="ET2">
      <p class="accroche">
        Un ordinateur est fait de plusieurs composants, et c’est en les distinguant qu’on comprend
        pourquoi il rame, ou lequel acheter. Le portable de Yasmine, que tu viens de voir, en est un
        exemple.
      </p>
      <h3>Où tu es</h3>
      <p>Ce bloc est le troisième de la partie La machine, qui tient en quatre idées reliées :</p>
      <ul class="carte-partie">
        <li>
          <strong>L’information en bits</strong> : tout ce que la machine range et traite est une
          suite de 0 et de 1.
        </li>
        <li>
          <strong>Décider : ET, OU, NON, SI/SINON</strong> : la machine décide avec de la logique
          sur ces 0 et ces 1.
        </li>
        <li class="ici">
          <strong>L’ordinateur et ses composants</strong> : des composants rangent, transportent et
          calculent ces 0 et ces 1. Tu es ici.
        </li>
        <li>
          <strong>Du langage machine aux langages de haut niveau</strong> : un programme, écrit dans
          un langage, devient des instructions que ces composants exécutent : c’est là que le
          processeur de ce bloc et les décisions du bloc Décider se rejoignent.
        </li>
      </ul>
      <p>
        Ce bloc repose sur le bloc L’information en bits : les composants rangent et calculent des
        octets, des paquets de 8 bits. Le bloc suivant montre comment un programme devient les
        instructions que le processeur exécute. Plus loin, ce bloc te servira à chaque installation
        d’un outil de développeur : choisir la version qui va à ton processeur, vérifier que ton
        ordinateur peut le faire tourner.
      </p>
      <h3>À quoi ça sert</h3>
      <p>
        Comme développeur web, tu installeras sans arrêt des outils : un éditeur de code, un
        navigateur, des logiciels pour tester tes sites. Il faut savoir lesquels installer. Tu
        choisiras aussi ton ordinateur de travail, et tu sauras dire pourquoi il rame, avant
        d’accuser ton code.
      </p>
      <h3>À la fin, tu sauras</h3>
      <ul>
        <li>
          dire à quoi sert chaque partie d’un ordinateur, et suivre un programme du disque jusqu’au
          processeur ;
        </li>
        <li>choisir la version d’un logiciel qui va à ton processeur ;</li>
        <li>
          relever ce qu’a ton ordinateur, et vérifier qu’il peut faire tourner tes outils de
          développeur ;
        </li>
        <li>ouvrir en quelques secondes l’outil qui décrit ton ordinateur ;</li>
        <li>
          trouver pourquoi un ordinateur rame : mémoire pleine, processeur occupé, surchauffe ;
        </li>
        <li>entretenir ton ordinateur : la poussière, les mises à jour ;</li>
        <li>dire si un ordinateur convient pour développer, et ce qu’il faudrait y changer.</li>
      </ul>
      <p class="discret">
        Il te faudra ton ordinateur, rien d’autre : tu t’y enregistreras aussi, pour t’écouter
        expliquer.
      </p>
    </template>

    <!-- ET3, tentative : cinq questions à l'intuition, avant toute explication. -->
    <template data-etape="ET3">
      <div data-ecran="Une coupure">
        <p class="accroche">
          Essaie avec ton bon sens. Personne ne te note : réponds comme tu penses, ou « Je ne sais
          pas ». À la fin de l’étape, la page te montre tes réponses et ce qui était attendu ; les
          étapes suivantes expliquent pourquoi.
        </p>
        <div
          class="ex"
          data-essai
          data-widget="choix"
          data-id="p1"
          data-reponse="perdu"
          data-melanger="non"
          data-explication="Le texte en cours n’existe que dans la RAM, qui se vide quand le courant s’arrête. Seul ce qui est enregistré sur le disque reste."
        >
          <p class="q">
            Yasmine tape un long texte dans un logiciel qui n’enregistre pas tout seul. Le courant
            est coupé avant qu’elle ait enregistré. Quand elle rallume, son texte est-il là ?
          </p>
          <ul class="options">
            <li data-option="perdu">Non, il est perdu.</li>
            <li
              data-option="garde"
              data-retour="Ce qui n’est pas enregistré n’est pas encore sur le disque : il n’est que dans la RAM, qui se vide sans courant."
            >
              Oui, l’ordinateur l’a gardé.
            </li>
            <li
              data-option="taille"
              data-retour="La taille du disque n’y change rien : un texte pas encore enregistré n’est pas sur le disque."
            >
              Oui, si le disque est assez grand.
            </li>
          </ul>
        </div>
      </div>
      <div data-ecran="Une annonce">
        <div
          class="ex"
          data-essai
          data-widget="choix"
          data-id="p2"
          data-reponse="stockage"
          data-melanger="non"
          data-explication="512 Go, c’est la place pour ranger des fichiers : le stockage. La RAM d’un portable se compte en quelques Go, 8 ou 16 le plus souvent."
        >
          <p class="q">
            Une annonce dit : « Portable, 512 Go de mémoire ». À quoi servent ces 512 Go ?
          </p>
          <ul class="options">
            <li
              data-option="ram"
              data-retour="512 Go, c’est bien plus que la RAM d’un portable, qui se compte en quelques Go : ici, « mémoire » veut dire stockage."
            >
              À faire tourner les programmes ouverts.
            </li>
            <li data-option="stockage">À ranger les fichiers et les logiciels.</li>
            <li
              data-option="vitesse"
              data-retour="Un nombre de Go dit une quantité de place, pas une vitesse."
            >
              À rendre le portable rapide.
            </li>
          </ul>
        </div>
      </div>
      <div data-ecran="Deux processeurs">
        <div
          class="ex"
          data-essai
          data-widget="choix"
          data-id="p3"
          data-reponse="pas-assez"
          data-melanger="non"
          data-explication="Les GHz ne disent pas, à eux seuls, combien de travail fait le processeur : deux processeurs d’époques différentes ne se comparent pas par leurs GHz. L’étape Le processeur explique pourquoi."
        >
          <p class="q">
            Un processeur de 2014 tourne à 3,0 GHz, un autre de 2023 à 2,4 GHz. Lequel exécute le
            plus d’instructions par seconde ?
          </p>
          <ul class="options">
            <li
              data-option="ancien"
              data-retour="Les GHz comptent des cycles par seconde, pas des instructions : un processeur récent peut finir plus d’instructions à chaque cycle, et en faire plus qu’un ancien avec moins de GHz."
            >
              Celui de 2014 : il a plus de GHz.
            </li>
            <li
              data-option="recent"
              data-retour="Le plus récent l’emporte souvent, mais l’année ne suffit pas à le dire non plus."
            >
              Celui de 2023 : il est plus récent.
            </li>
            <li data-option="pas-assez">On ne peut pas le dire avec ces deux chiffres.</li>
          </ul>
        </div>
      </div>
      <div data-ecran="Combien d’onglets">
        <div class="cadre pour-lire">
          <p class="discret">La RAM de Yasmine, pour lire :</p>
          <ul>
            <li>
              Elle a 8 Go, soit environ 8 000 Mo : ce bloc compte 1 Go pour 1 000 Mo, c’est une
              convention.
            </li>
            <li>Windows en occupe 3 000 Mo, VS Code 1 000 Mo, chaque onglet environ 150 Mo.</li>
          </ul>
        </div>
        <div
          class="ex"
          data-essai
          data-widget="nombre"
          data-id="p4"
          data-reponse="26"
          data-solution="26 onglets : 8 000 − 3 000 − 1 000 = 4 000 Mo restent pour les onglets, et 26 × 150 = 3 900 Mo ; un 27ᵉ ferait 4 050 Mo"
          data-explication="8 000 − 3 000 − 1 000 = 4 000 Mo restent pour les onglets. 26 onglets prennent 3 900 Mo ; le 27ᵉ dépasserait de 50 Mo."
        >
          <p class="q">
            Windows et VS Code sont ouverts. Combien d’onglets Yasmine peut-elle ouvrir en plus, au
            plus, sans dépasser sa RAM ?
          </p>
        </div>
      </div>
      <div data-ecran="Un logiciel pour Mac">
        <div
          class="ex"
          data-essai
          data-widget="choix"
          data-id="p5"
          data-reponse="traduit"
          data-melanger="non"
          data-explication="Un logiciel est du code machine, écrit pour une famille de processeurs. Une puce Apple M2 est de la famille ARM : la version Intel n’est pas écrite pour elle. Le Mac la fait tourner en la traduisant, plus lentement."
        >
          <p class="q">
            Farid a un Mac avec une puce Apple M2. Sur le site d’un logiciel, il télécharge la
            version « Mac Intel ». Que se passe-t-il ?
          </p>
          <ul class="options">
            <li
              data-option="pareil"
              data-retour="Un logiciel est écrit pour une famille de processeurs, et la puce M2 n’est pas de la famille d’Intel."
            >
              Il marche aussi bien que l’autre version : un Mac est un Mac.
            </li>
            <li data-option="traduit">Il marche, mais traduit par le Mac, et plus lentement.</li>
            <li
              data-option="abime"
              data-retour="Un logiciel ne peut pas abîmer le processeur : au pire, il ne se lance pas, ou il tourne moins vite."
            >
              Il risque d’abîmer le processeur.
            </li>
          </ul>
        </div>
      </div>

    <!-- ET4, explication : le schéma du bloc rempli pour le lancement de VS Code, puis le stockage, la RAM, le trajet d'un fichier et les deux sens de « mémoire ». -->
    <template data-etape="ET4">
      <div data-ecran="Le schéma du bloc">
        <p class="accroche">
          Quand Yasmine a lancé VS Code, plusieurs composants ont travaillé, chacun à son tour. Tout
          ce bloc tient dans ce schéma. Le voici rempli pour ce lancement :
        </p>
        <div
          class="schema-bloc"
          data-lecture="Le schéma du bloc, pour Yasmine qui lance VS Code. Le stockage, son disque dur, garde VS Code, même éteint. Au lancement, VS Code est copié vers la RAM, où il prend 1 000 Mo à côté des 3 000 de Windows. Le processeur le lit dans la RAM, instruction après instruction, et l’exécute. Il confie l’image à la carte graphique, qui la dessine et l’envoie à l’écran : la fenêtre de VS Code."

        </p>

            <li data-option="cache">Dans son cache.</li>
            <li
              data-option="ram"

        <p>

    <!-- ET16, atelier : sur sa machine, la virtualisation, la chaleur, les grilles d'aération, les mises à jour ; puis le constat. -->
    <template data-etape="ET16">
      <div data-ecran="La virtualisation">
        <p class="discret">Tu es ici : quatre gestes sur ta machine, avant de développer.</p>
        <p class="accroche">
          Dans « Ta machine », tu as vu ce que demandent WSL 2 et Docker : la virtualisation.
        </p>
        <p>
          Sous Windows, lis si la virtualisation est en service sur ta machine. Sur un Mac, rien à
          lire : elle y est toujours en service.
        </p>
        <details data-cran="1">
          <summary>Un indice</summary>
          <p>
            La virtualisation est une capacité du processeur : quel outil de Windows montre ton
            processeur en direct ?
          </p>
          <details data-cran="2">
            <summary>Une piste détaillée</summary>
            <p>Le gestionnaire des tâches : son onglet Performance a un panneau par composant.</p>
            <details data-cran="3">
              <summary>Une partie de la solution</summary>
              <p>
                Ctrl+Maj+Échap ouvre le gestionnaire des tâches ; passe à son onglet Performance. Il
                te reste à choisir le panneau, puis la ligne.
              </p>
              <details data-cran="4">
                <summary>La solution entière</summary>
                <p>
                  Ctrl+Maj+Échap, l’onglet Performance, puis le panneau Processeur : sous la courbe,
                  la ligne Virtualisation. Si le gestionnaire s’ouvre en petit, clique sur Plus de
                  détails. Si tu lis « Un hyperviseur a été détecté » à la place de la ligne, la
                  virtualisation est déjà en service : c’est bon.
                </p>
              </details>
            </details>
          </details>
        </details>
        <p>
          Si tu lis Désactivé, ne change rien aujourd’hui : tu l’activeras dans le BIOS ou l’UEFI
          quand tu installeras WSL 2.
        </p>
      </div>
      <div data-ecran="La chaleur">
        <p class="accroche">
          Un processeur trop chaud baisse sa fréquence pour se protéger. Sur ta machine, vois si le
          tien chauffe trop pendant cinq minutes de travail lourd, une vidéo en très haute
          définition ou un jeu.
        </p>
        <details data-cran="1">
          <summary>Un indice</summary>
          <p>
            Quelle ligne du panneau Processeur montre sa vitesse du moment, et à quoi la comparer ?
          </p>
          <details data-cran="2">
            <summary>Une piste détaillée</summary>
            <p>
              La ligne Vitesse du panneau Processeur, comparée à la vitesse de base, juste en
              dessous. Sur un Mac, qui n’affiche pas la vitesse, ce sont les signes qui parlent.
            </p>
            <details data-cran="3">
              <summary>Une partie de la solution</summary>
              <p>
                Windows : lance le travail lourd, attends cinq minutes, puis ouvre le panneau
                Processeur du gestionnaire des tâches ; il te reste à comparer deux de ses lignes.
                Mac : pendant ces cinq minutes, observe la machine.
              </p>
              <details data-cran="4">
                <summary>La solution entière</summary>
                <p>
                  Windows : lance le travail lourd, attends cinq minutes, puis Ctrl+Maj+Échap,
                  l’onglet Performance et le panneau Processeur. Si la Vitesse est sous la Vitesse
                  de base alors que le travail continue, ton processeur chauffe trop : dégage ses
                  grilles, dans « Les grilles ». Mac : pendant les cinq minutes, note s’il ralentit,
                  si le dessous devient très chaud et si le ventilateur souffle fort ; un MacBook
                  Air, sans ventilateur, ne fait que chauffer et ralentir.
                </p>
              </details>
            </details>
          </details>
        </details>
      </div>
      <div data-ecran="Les grilles">
        <p class="accroche">
          Retire la poussière des grilles d’aération de ta machine, puis choisis où la poser pour
          travailler : la poussière bloque l’air qui refroidit le processeur.
        </p>
        <details data-cran="1">
          <summary>Un indice</summary>
          <p>
            Que faut-il couper avant de toucher à un appareil électrique ? Et l’eau est-elle bonne
            pour l’électronique ?
          </p>
          <details data-cran="2">
            <summary>Une piste détaillée</summary>
            <p>
              Machine éteinte et débranchée. Les grilles sont là où l’air chaud sort : dessous, sur
              les côtés ou à l’arrière.
            </p>
            <details data-cran="3">
              <summary>Une partie de la solution</summary>
              <p>
                Éteins ta machine, débranche-la, puis repère ses grilles : dessous, sur les côtés ou
                à l’arrière. Il te reste à choisir avec quoi retirer la poussière, puis où poser la
                machine.
              </p>
              <details data-cran="4">
                <summary>La solution entière</summary>
                <ol>
                  <li>Éteins ton ordinateur et débranche-le.</li>
                  <li>
                    Repère ses grilles d’aération : dessous, sur les côtés ou à l’arrière. Un
                    MacBook Air n’en a pas : vérifie-le, puis passe au dernier point.
                  </li>
                  <li>
                    Si elles sont grises de poussière, retire-la de l’extérieur, avec un chiffon sec
                    ou un pinceau propre. N’ouvre pas la machine : la poussière de l’intérieur se
                    fait retirer par un réparateur.
                  </li>
                  <li>
                    Pour travailler, pose-la sur une surface dure, jamais sur un coussin ou une
                    couverture.
                  </li>
                </ol>
              </details>
            </details>
          </details>
        </details>
      </div>
      <div data-ecran="Les mises à jour">
        <p class="accroche">
          Dans « Diagnostiquer », tu as vu pourquoi installer au plus tôt les mises à jour de

              et Arm64 ou AArch64 pour ARM64.
            </dd>
          </div>
          <div>
            <dt>Émulateur</dt>
            <dd>
              Un programme qui traduit le code machine d’une architecture pour une autre, comme
              Rosetta 2 sur Mac.
            </dd>
          </div>
          <div>
            <dt>Carte mère</dt>
            <dd>La plaque qui porte et relie le processeur, la RAM, le stockage et le reste.</dd>

      <h3>Les coups de pouce</h3>
      <ul>
        <li>
          L’échelle est celle du gabarit. Un choix : chaque option fausse est retirée, avec son
          retour ; tant que plusieurs options restent, « Un coup de pouce » donne l’indice écrit
          dans la fiche, un par réponse fausse possible avant la dernière option (un seul pour un
          choix à trois options). Un nombre : rien avant une réponse fausse, puis les indices
          data-aide1 et data-aide2, l’étape détaillée data-aide3 quand l’exercice l’a (r22, r22b),
          puis la solution. Après une solution vue, l’apprenant refait sur un autre cas
          (data-variante-…), ou explique la solution avec ses mots ; l’IA juge son explication. Une
          prédiction (data-prediction : r3p, r3e, r7b, r10, r15a, r15b, r26b, r26c, r30c, r34, r35,
          r36, r42, r43, r44, chacune avec sa question qui oriente) montre la bonne réponse sans
          explication à écrire, car le texte qui suit l’explique.
        </li>
        <li>
          Dans la pratique, après une solution vue, l’item se refait sur sa variante, puis
          l’apprenant explique. Trois items sur dix de PR1 portent une demande d’explication
          (data-justifier : PR1-5, PR1-6, PR1-7), sur ce que l’écran ne montre pas ; la leçon « On

          la déclare, l’IA la juge, et l’item n’est réussi qu’avec une explication Solide.
        </li>
        <li>
          Chaque réponse vérifiée d’un item part au gabarit avec l’aide reçue : 0 du premier coup, 1
          au moins après une réponse fausse, le numéro du dernier cran ouvert, et 4 pour une
          solution vue.
        </li>
      </ul>

        "contexte_ia": "Bloc B03 du module « Écosystème et outils du développeur » (DWWM), troisième bloc de la partie La machine. Le modèle du bloc : le stockage (SSD ou disque dur) garde les fichiers et les logiciels, même éteint ; au lancement, ce qu’il garde est copié dans la RAM, volatile, qui tient prêt ce qui tourne ; le processeur l’y lit, par son cache, et l’exécute sur ses cœurs ; la carte graphique dessine l’image, que l’écran affiche ; la carte mère relie le tout, et le refroidissement évacue la chaleur. Ordres de grandeur du bloc : RAM 0,0001 ms, SSD 0,1 ms, disque dur 10 ms par accès ; 1 Go compté comme 1 000 Mo ; Windows 3 000 Mo, VS Code 1 000 Mo, un onglet 150 Mo, une journée de développement environ 8 000 Mo. La RAM pleine, une partie part dans le fichier d’échange, sur le disque, et tout ralentit. Les GHz comptent les cycles par seconde ; les instructions par seconde sont les GHz multipliés par les instructions par cycle, qui changent d’une génération à l’autre. Deux familles de processeurs : x64 (Intel, AMD) et ARM64 (puces M d’Apple, certains PC) ; un logiciel se prend dans la version de sa famille ; un Mac ARM fait tourner une version Intel traduite par Rosetta 2, moins vite, et un PC Windows ARM une version x64 traduite par Windows ; sur un PC x64 ou un Mac Intel, une version ARM64 ne se lance pas ; « 64 bits » ne dit pas la famille ; la famille s’appelle aussi l’architecture ; les processeurs Snapdragon sont ARM64. Diagnostic : la jauge au maximum du gestionnaire des tâches (processeur, mémoire, disque) désigne la cause ; un disque à 100 % est occupé, pas plein ; un processeur à 100 % est occupé par un travail lourd (le laisser finir, sans rien lancer à côté) ou par un programme bloqué (Fin de tâche) ; un portable qui chauffe baisse sa fréquence, et sa vitesse affichée tombe ; la vitesse du moment peut dépasser la vitesse de base quand le processeur reste frais, et descend sous elle quand il a peu à faire. À génération et conception égales, plus de GHz veut bien dire plus rapide. Une carte graphique dédiée sert aux jeux, à la 3D et au montage vidéo. Repères pour développer : RAM 8 Go au minimum, 16 Go à l’aise ; un SSD, 256 Go au minimum, 512 Go à l’aise ; 4 cœurs au minimum, 6 à l’aise ; x64 ou ARM64 ; carte graphique intégrée. Notations à accepter comme équivalentes : CPU et processeur, GPU et carte graphique, HDD et disque dur, mémoire vive et RAM ; x64, x86-64 et AMD64 ; ARM64, Arm64 et AArch64 ; Apple silicon et puce M. Accepte des ordres de grandeur voisins (un SSD de 0,05 à 0,1 ms, par exemple) et une conversion de 1 Go en 1 024 Mo. Virtualisation : la capacité du processeur à faire tourner un second système à côté du sien, une machine virtuelle ; WSL 2 et Docker en ont besoin ; « Désactivé » dans le gestionnaire des tâches veut dire éteinte dans le BIOS ou l’UEFI de la carte mère, où elle s’active ; sur un Mac, elle est toujours en service. Entretien : retirer la poussière des grilles ; installer au plus tôt les mises à jour de sécurité, qui corrigent des failles connues de tous une fois corrigées. Surchauffe : elle se lit à la vitesse du processeur qui tombe sous sa vitesse de base pendant un travail lourd, avec la machine chaude et le ventilateur fort ; aucune jauge n’est forcément au maximum. Sur un Mac, qui n’affiche pas la vitesse, ce sont ces signes. La fiche ne fait pas relever de température. La fiche n’enseigne ni comment créer une machine virtuelle, ni les tests de performance, ni les générations de RAM (DDR4, DDR5) ni les types de SSD (NVMe, SATA), ni Linux, ni les portes logiques : ne pénalise pas leur absence, et accepte une réponse juste qui les emploie. Pièges à repérer : E1, confondre RAM et stockage (prendre 512 Go de SSD pour de la mémoire vive, croire que la RAM garde ce qui n’est pas enregistré ou qu’elle range les fichiers) ; E2, croire que plus de GHz veut toujours dire plus rapide ; E3, ignorer la famille du processeur au téléchargement (x64 pour une puce ARM64, ARM64 pour un processeur Intel ou AMD), ou croire que « 64 bits » dit la famille ; E4, faire lire ou écrire au processeur un programme ou un fichier directement sur le stockage, sans la copie en RAM. Accepté sans être exigé : proposer l’action qui agit sur la cause d’une lenteur (fermer des programmes, laisser finir un travail lourd, dégager les grilles) ; nommer le cache ou les cœurs dans un trajet ; comparer deux processeurs de la même génération par leurs GHz ; évoquer, sans la détailler, une machine virtuelle pour faire tourner Windows sur un Mac. Pour PR2-2 : les deux observations, une attente ou non, sont justes si l’explication va avec ; un navigateur qui met des onglets en veille et les recharge, ce qui libère de la RAM, est une explication juste.  Une réponse à moitié juste est notée à moitié juste, avec ce qui manque. Pour examiner une explication, la grille de compréhension : l’idée en mots simples, le mécanisme ou la raison au niveau de la fiche, la condition d’application, le terme exact, la relation avec une autre notion du modèle, un exemple ou une limite ; dire ce qui manque et ce que ça implique. Chaque attendu vient de la fiche : les étapes 3 à 12 et 14 (sources S1 à S11) ; ce qui est marqué « D’après » y est écrit ; ce qui est marqué « Déduit » s’obtient en appliquant une règle de la fiche à un autre cas. Les conventions dont une question se sert (1 GHz, les Mo d’une journée) sont redonnées avec elle : ce qui compte, c’est le raisonnement, pas de réciter les nombres.",

            "question": "Manon double-clique sur une vidéo rangée sur le SSD de son PC, pour la monter. Décris le chemin de la vidéo jusqu’au processeur, composant par composant. Puis le courant est coupé avant qu’elle ait enregistré son montage : qu’est-ce qui est perdu ?",

            "question": "Pour lire : 1 GHz veut dire un milliard de cycles par seconde. Victor hésite entre deux processeurs. L’un, de 2013, tourne à 3,5 GHz et finit 2 instructions par cycle ; l’autre, de 2023, tourne à 3,0 GHz et en finit 4. Il prend celui de 2013 : « plus de GHz, donc plus rapide ». Combien d’instructions par seconde finit chacun, et a-t-il raison ?",

        /**
         * Une erreur critique reconnue (E1 à E4) part au bilan : `fiche:erreur`, avec l'item ou
         * l'exercice où elle a eu lieu (sa variante du cours : « r4:variante »). La tentative de
         * l'étape 3 n'en signale pas : elle vient avant les règles. Rend faux si le gabarit attend
         * d'abord le bilan.
         */
        function signalerErreur(ex, erreur) {
          if (!erreur || 'essai' in ex.dataset) return true
          const ou =
            ex.closest('.item')?.dataset.item ??
            (ex.dataset.origine
              ? ex.dataset.origine + ':variante'
              : ex.closest('[data-id]')?.dataset.id)
          if (!ou) return true
          return ex.dispatchEvent(
            new CustomEvent('fiche:erreur', {
              bubbles: true,
              cancelable: true,
              detail: { erreur, ou },
            }),
          )
        }
        function retourDe(ex) {
          let r = $(':scope > .retour', ex)
          if (!r) {
            r = el('p', { class: 'retour', 'aria-live': 'polite' })
            ex.append(r)
          }
          return r
        }
        function dire(ex, classe, texteDit) {
          const r = retourDe(ex)
          r.className = 'retour' + (classe ? ' ' + classe : '')
          r.textContent = fr(texteDit)
          return r
        }
        const fini = (ex) => ex.dataset.fini === 'oui'

        /**
         * Après une solution montrée, l'apprenant refait sans regarder puis explique (règle F03) : il
         * écrit son explication, et l'IA la juge.
         */
        /** La clé de l'explication d'un exercice, pour la trace du gabarit (`explique:<cle>`). */
        function cleExplication(ex) {
          const item = ex.closest('.item')
          // Une variante du cours n'a pas d'identifiant : elle prend celui de l'exercice qu'elle refait.
          const base = item
            ? item.dataset.item
            : 'ex:' + (ex.dataset.id ?? ex.dataset.origine ?? 'x')
          return (
            base +
            (ex.dataset.variante || (item && montre[item.dataset.item] === 'variante')
              ? ':variante'
              : '')
          )
        }
        function expliquer(ex, solution, consigne, apres) {
          if ($(':scope > .expliquer', ex)) return
          const cle = cleExplication(ex)
          if (apres) {
            const fin = (e) => {
              if (e.detail?.cle !== 'explique:' + cle) return
              ex.removeEventListener('fiche:trace', fin)
              apres()
            }
            ex.addEventListener('fiche:trace', fin)
          }
          ex.dispatchEvent(
            new CustomEvent('fiche:expliquer', {
              bubbles: true,
              detail: {
                cle,
                solution: fr(sansPoint(solution) + '.'),
                consigne: consigne ? fr(consigne) : undefined,
              },
            }),
          )
        }

        /** Un exercice fini : la réponse posée, les champs bloqués, le message, puis la suite de l'écran. */
        function appliquer(ex, c, etat, v, message) {
          ex.dataset.fini = 'oui'
          c.echelle?.maj()
          ex.classList.toggle('ok', etat !== 'vu')
          ex.classList.toggle('vu', etat === 'vu')
          c.remplir(etat, v)
          c.bloquer()
          const texteFin =
            message ??
            (etat === 'vu'
              ? c.marque
                ? 'La bonne réponse est marquée.'
                : 'Réponse : ' + sansPoint(c.solution()) + '.'
              : 'Juste.')
          dire(ex, etat === 'vu' ? '' : 'bon', texteFin)
          const explication = ex.dataset.explication
          if (explication && !$(':scope > .explication', ex))
            ex.append(el('p', { class: 'explication', text: explication }))
          devoiler(ex.closest('.ecran, [data-ecran]'))
          const parent = ex.parentElement?.closest('.ex')
          // Remontée d'une visite précédente : la trace est déjà là, rien ne se relâche.
          if (parent && ex.dataset.remonte !== 'oui') libererApresVariante(parent, ex, c, etat, v)
        }

        /**
         * La variante du cours finie : réussie, elle libère la suite de l'écran, et la trace de
         * l'exercice le dit pour la visite suivante. Si c'est sa solution qui a été vue, rien n'a été
         * réussi sans regarder (règle F04) : l'apprenant explique d'abord cette solution, comme après
         * une solution vue sans autre cas, puis la suite paraît.
         */
        function libererApresVariante(parent, ex, c, etat, v) {
          // La trace garde aussi l'autre cas et sa réponse : il revient fini à la visite suivante.
          const garder = () => {
            if (parent.dataset.id)
              tracer('ex:' + parent.dataset.id, {
                e: 'vu',
                v: null,
                refait: true,
                variante: { e: etat, v: v ?? null },
              })
          }
          if (parent.dataset.reprise !== 'oui') return garder()
          // Refait sur l'autre cas, il l'explique encore (règle F03) : les deux, pas l'un ou l'autre.
          expliquer(ex, c.solution(), fr(POUR_CONTINUER), () => {
            garder()
            libererReprise(parent)
          })
        }
        const POUR_CONTINUER =
          'Pour continuer, explique cette solution avec tes mots, en une ou deux phrases :'

        /**
         * Dans le cours, après une solution vue (règles F03 et F04) : la suite de l'écran attend que
         * l'apprenant refasse sur un autre cas puis l'explique, ou, quand il n'y en a pas, qu'il
         * explique la solution avec ses mots. Pas pendant la tentative de l'étape 3, ni dans une variante, ni pour une
         * prédiction (`data-prediction`), posée avant le texte qui l'explique.
         */
        const avecReprise = (ex) =>
          !dansItem(ex) &&
          !ex.dataset.variante &&
          !('essai' in ex.dataset) &&
          !('prediction' in ex.dataset)
        function apresSolution(ex, c) {
          if (c.variante) return proposerVariante(ex, c)
          expliquer(
            ex,
            c.solution(),
            fr('Pour continuer, explique cette solution avec tes mots, en une ou deux phrases :'),
            () => libererReprise(ex),
          )
        }
        function libererReprise(ex) {
          if (ex.dataset.reprise !== 'oui') return
          delete ex.dataset.reprise
          devoiler(ex.closest('.ecran, [data-ecran]'))
        }

        /**
         * Ce que fait une réponse. Dans le cours, l'exercice fini garde sa trace (fiche:trace). Dans un
         * item de pratique, chaque réponse vérifiée part au gabarit, avec l'aide reçue : une réussite
         * qui suit une réponse fausse compte avec l'aide 1 au moins, le retour de l'erreur a orienté
         * (règle P03).
         */
        /**
         * Une réponse à la tentative de l'étape 3 (règles C03 et M01) : elle part au gabarit, qui la garde
         * sans verdict et corrige toute la série à la fin. L'outil ne dit rien ; l'exercice est fini, la
         * suite de l'écran paraît. « Je ne sais pas » (fiche:essai-passe) est une réponse vide.
         */
        function essayer(ex, c, res) {
          ex.dataset.fini = 'oui'
          c.bloquer?.()
          const reponse = res.r ?? res.v
          ex.dispatchEvent(
            new CustomEvent('fiche:essai', {
              bubbles: true,
              detail: {
                cle: ex.dataset.id,
                reponse: reponse === undefined || reponse === null ? null : String(reponse),
                juste: Boolean(res.ok),
                attendu: typeof c.solution === 'function' ? sansPoint(c.solution()) : '',
                // Après coup, un indice pour réessayer n'a plus d'objet : ce qui cause l'erreur, ou pourquoi.
                retour: res.ok
                  ? (ex.dataset.explication ?? '')
                  : res.d?.m || ex.dataset.explication || '',
              },
            }),
          )
          devoiler(ex.closest('.ecran, [data-ecran]'))
        }

        function repondre(ex, c, res) {
          if (fini(ex)) return
          if ('essai' in ex.dataset) return essayer(ex, c, res)
          const fautes = Number(ex.dataset.fautes || 0)
          const cran = c.echelle ? c.echelle.cran() : 0
          if (res.ok) {
            const aide = Math.min(4, fautes > 0 ? Math.max(cran, 1) : cran)
            signaler(ex, true, aide)
            const etat = fautes === 0 && cran === 0 ? 'ok1' : 'ok'
            if (!dansItem(ex) && ex.dataset.id && !ex.dataset.variante)
              tracer('ex:' + ex.dataset.id, { e: etat, v: res.v ?? null })
            // Dans un item, la réponse juste se garde aussi : elle revient au retour sur l'item.
            if (dansItem(ex)) tracerItem(ex, { e: etat, v: res.v ?? null, cran })
            appliquer(
              ex,
              c,
              etat,
              res.v,
              (res.m || 'Juste.') + (ex.dataset.succes ? ' ' + ex.dataset.succes : ''),
            )
            expliquerApres(ex, c, cran)
            return
          }
          ex.dataset.fautes = String(fautes + 1)
          signaler(ex, false, cran)
          const libre = signalerErreur(ex, res.d?.e)
          const m =
            (res.d && res.d.m ? res.d.m : (ex.dataset.sinon ?? 'Pas encore. Réessaie.')) +
            (libre ? '' : ' C’est une erreur critique : envoie ton bilan avant de continuer.')
          // Une valeur VRAI ou FAUX écartée laisse la bonne, donnée : c'est une solution vue, comme
          // l'option qui reste d'un choix (règle F04).
          if (res.vu) return montrerSolution(ex, c, m)
          if (c.marque) {
            dire(ex, 'faux', m)
            // Tant que plusieurs options restent, l'échelle aide (règle F03). L'option qui reste ne se
            // choisit pas : c'est une solution vue, qui se refait ou s'explique (règle F04).
            if (c.restantes() > 1) return c.echelle?.tentative()
            // Plus rien à choisir : les crans qui restent s'ouvrent, puis la solution (règle F03).
            c.echelle?.toutOuvrir()
            return montrerSolution(ex, c, m)
          }
          dire(ex, 'faux', m)
          c.echelle?.tentative()
        }

        /**
         * Après une réponse juste, l'explication que l'exercice demande. Après une solution vue, sur
         * une variante ou au dernier cran, il explique la solution ; sinon, `data-justifier` pose sa
         * question. Une explication déclarée qui n'est pas Solide deux fois (ou ne compte pas) montre
         * la solution, puis l'item se refait sur l'autre cas, dans les deux branches : sans cela,
         * l'item resterait ni réussi ni à refaire.
         */
        function expliquerApres(ex, c, cran) {
          const libre = ex.closest('[data-solution-vue]') || ex.dataset.variante || cran === 3
          if (!libre && !ex.dataset.justifier) return
          ex.addEventListener(
            'fiche:explication-ratee',
            (e) => montrerSolution(ex, c, e.detail?.message),
            { once: true },
          )
          if (libre) expliquer(ex, c.solution())
          else expliquer(ex, c.solution(), fr(ex.dataset.justifier))
        }

        /** L'état gardé d'un item de pratique : le cas montré (`origine` ou `variante`) et sa fin. */
        function tracerItem(ex, val) {
          const id = ex.closest('.item')?.dataset.item
          if (id) tracer('item:' + id, { cas: montre[id] ?? 'origine', ...val, le: jourCle() })
        }

        /** La solution montrée, en bout d'échelle. */
        function montrerSolution(ex, c, avant) {
          const solution = sansPoint(c.solution()) + '.'
          if (dansItem(ex)) {
            tracerItem(ex, { e: 'vu', v: null })
            // Le gabarit note « solution vue » tout de suite ; l'item se redessine sur « je refais ».
            signaler(ex, false, 4, { garder: true })
            ex.dataset.fini = 'oui'
            c.remplir('vu')
            c.bloquer()
            dire(ex, '', (avant ? avant + ' ' : '') + 'Solution : ' + solution)
            const refaire = el('button', {
              type: 'button',
              class: 'bouton',
              text: 'J’ai compris, je refais sans regarder',
            })
            ex.append(el('div', { class: 'actions' }, refaire))
            refaire.addEventListener('click', () => {
              // Le gabarit note la solution vue avec son cas : l'item revient sur l'autre.
              ex.dispatchEvent(new CustomEvent('fiche:refaire', { bubbles: true }))
            })
            return
          }
          if (ex.dataset.id && !ex.dataset.variante)
            tracer('ex:' + ex.dataset.id, { e: 'vu', v: null })
          const reprise = avecReprise(ex)
          if (reprise) ex.dataset.reprise = 'oui'
          const suite =
            reprise && c.variante
              ? ' Pour continuer, refais-le sur un autre cas, sans regarder, puis explique-le.'
              : ''
          appliquer(
            ex,
            c,
            'vu',
            null,
            (avant ? avant + ' ' : '') + 'Solution : ' + solution + suite,
          )
          if (reprise) apresSolution(ex, c)
          else proposerVariante(ex, c)
        }

        /** Dans le cours, après une solution : refaire sans regarder, sur un autre cas. */
        function proposerVariante(ex, c) {
          if (!c.variante || $(':scope > .refaire', ex)) return
          const bouton = el('button', {
            type: 'button',
            class: 'bouton secondaire petit',
            text: 'Je refais sans regarder, sur un autre cas',
          })
          const zone = el('div', { class: 'refaire' }, bouton)
          bouton.addEventListener('click', () => {
            const nouveau = c.variante()
            if (!nouveau) return
            // Sans regarder : l'exercice et sa solution se cachent, seul l'autre cas reste à l'écran.
            for (const n of Array.from(ex.children)) if (n !== zone) n.hidden = true
            nouveau.dataset.variante = 'oui'
            if (ex.dataset.id) nouveau.dataset.origine = ex.dataset.id
            zone.replaceChildren(nouveau)
            monterEx(nouveau)
          })
          ex.append(zone)
        }

        function ligneSaisie(ex) {
          const input = el('input', {
            type: 'text',
            inputmode: 'numeric',
            autocomplete: 'off',
            spellcheck: 'false',
            'aria-label': 'Ta réponse',
            id: uid('champ-' + (ex.dataset.id || 'x')),
          })
          const bouton = el('button', { type: 'button', class: 'bouton', text: 'Vérifier' })
          const ligne = el('div', { class: 'saisie' }, input, bouton)
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') bouton.click()
          })
          return { ligne, input, bouton }
        }
        /** Un nouvel exercice du même type, pour la variante du cours. */
        function nouvelEx(widget, donnees, question) {
          const ex = el('div', { class: 'ex', 'data-widget': widget })
          for (const [cle, val] of Object.entries(donnees)) ex.dataset[cle] = String(val)
          ex.append(el('p', { class: 'q', text: question }))
          return ex
        }

        const TYPES = {
          choix(ex) {
            const rep = ex.dataset.reponse
            const liste = $('.options', ex)
            const items = $$(':scope > li', liste)
            const boutons = items.map((li) => {
              const b = el('button', { type: 'button' })
              b.append(...li.childNodes)
              li.append(b)
              return b
            })
            if (ex.dataset.melanger !== 'non') melanger(items).forEach((li) => liste.append(li))
            const juste = items.findIndex((li) => li.dataset.option === rep)
            const c = {
              marque: true,
              solution: () => items[juste].textContent.trim(),
              restantes: () => boutons.filter((b) => !b.disabled).length,
              remplir(etat) {
                boutons[juste].classList.add(etat === 'vu' ? 'montre' : 'choisi-bon')
              },
              bloquer() {
                boutons.forEach((b) => {
                  b.disabled = true
                })
              },
            }
            boutons.forEach((b, i) =>
              b.addEventListener('click', () => {
                if (fini(ex)) return
                const r = items[i].textContent.trim()
                if ('essai' in ex.dataset)
                  return essayer(ex, c, { ok: i === juste, r, d: { m: items[i].dataset.retour } })
                if (i === juste) return repondre(ex, c, { ok: true, r })
                b.classList.add('choisi-faux')
                b.disabled = true
                repondre(ex, c, {
                  ok: false,
                  r,
                  d: { m: items[i].dataset.retour || 'Pas celle-ci.', e: items[i].dataset.erreur },
                })
              }),
            )
            return c
          },

          nombre(ex) {
            const d = ex.dataset
            const rep = Number(d.reponse)
            const { ligne, input, bouton } = ligneSaisie(ex)
            ex.append(ligne)
            const c = {
              solution: () => String(rep),
              remplir() {
                input.value = String(rep)
              },
              bloquer() {
                input.disabled = bouton.disabled = true
              },
            }
            bouton.addEventListener('click', () => {
              if (input.value.trim() === '')
                return void dire(ex, '', 'Écris ta réponse dans la case.')
              const r = entier(input.value)
              if (Number.isNaN(r)) return void dire(ex, '', 'Écris un nombre entier.')
              repondre(ex, c, { ok: r === rep, v: input.value })
            })
            return c
          },
          /** Le schéma du bloc, construit pour un cas nouveau et jugé par l'IA. */
          schema(ex) {
            // Le schéma construit pour un cas nouveau, jugé par l'IA sur la chaîne (règle C08) : l'éditeur
            // et le modèle caché sont ceux du gabarit. Solide, il est réussi ; sinon, après deux essais,
            // le schéma du cours paraît, pour comparer.
            const schema = window.JanusGabarit.schema(ex)
            const cle = 'ex:' + ex.dataset.id
            const c = {
              sansEchelle: true,
              solution: () => schema.attendu,
              remplir() {
                schema.montrer()
              },
              bloquer() {
                schema.bloquer()
              },
            }
            ex.addEventListener('fiche:trace', (e) => {
              const trace = e.detail?.valeur
              if (e.detail?.cle !== 'explique:' + cle || typeof trace?.fin !== 'string') return
              if (fini(ex)) return
              const derniere = trace.essais?.[trace.essais.length - 1]?.correction
              const solide = derniere?.niveau === 'solide'
              const etat = trace.fin === 'simulee' || solide ? 'ok' : 'vu'
              tracer(cle, { e: etat, v: null })
              appliquer(
                ex,
                c,
                etat,
                null,
                solide
                  ? 'Ton schéma est Solide. Voici celui du cours, pour comparer.'
                  : 'Voici le schéma du cours\u00a0: compare-le au tien, étape par étape. Tes mots et ton nombre de boîtes peuvent différer.',
              )
            })
            queueMicrotask(() =>
              ex.dispatchEvent(
                new CustomEvent('fiche:expliquer', {
                  bubbles: true,
                  detail: {
