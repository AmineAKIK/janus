          const parent = ex.parentElement?.closest('.ex')
          // Remontée d'une visite précédente : la trace est déjà là, rien ne se relâche.
          if (parent && ex.dataset.remonte !== 'oui') libererApresVariante(parent, ex, c, etat, v)
        }

        /**
         * La variante du cours finie : réussie, elle libère la suite de l'écran, et la trace de
         * l'exercice le dit pour la visite suivante. Si c'est sa solution qui a été vue, rien n'a été
         * réussi sans regarder (règle F04) : l'apprenant explique d'abord cette solution, comme après
         * une solution vue sans autre cas, puis la suite paraît.
         */
        function libererApresVariante(parent, ex, c, etat, v) {
          // La trace garde aussi l'autre cas et sa réponse : il revient fini à la visite suivante.
          const garder = () => {
            if (parent.dataset.id)
              tracer('ex:' + parent.dataset.id, {
                e: 'vu',
                v: null,
                refait: true,
                variante: { e: etat, v: v ?? null },
              })
          }
          if (parent.dataset.reprise !== 'oui') return garder()
          // Refait sur l'autre cas, il l'explique encore (règle F03) : les deux, pas l'un ou l'autre.
          expliquer(ex, c.solution(), fr(POUR_CONTINUER), () => {
            garder()
            libererReprise(parent)
          })
        }
        const POUR_CONTINUER =
          'Pour continuer, explique cette solution avec tes mots, en une ou deux phrases :'

        /**
         * Dans le cours, après une solution vue (règles F03 et F04) : la suite de l'écran attend que
         * l'apprenant refasse sur un autre cas puis l'explique, ou, quand il n'y en a pas, qu'il
         * explique la solution avec ses mots. Pas pendant la tentative de l'étape 3, ni dans une variante, ni pour une
         * prédiction (`data-prediction`), posée avant le texte qui l'explique.
         */
        const avecReprise = (ex) =>
          !dansItem(ex) &&
          !ex.dataset.variante &&
          !('essai' in ex.dataset) &&
          !('prediction' in ex.dataset)
        function apresSolution(ex, c) {
          if (c.variante) return proposerVariante(ex, c)
          expliquer(
            ex,
            c.solution(),
            fr('Pour continuer, explique cette solution avec tes mots, en une ou deux phrases :'),
            () => libererReprise(ex),
          )
        }
        function libererReprise(ex) {
          if (ex.dataset.reprise !== 'oui') return
          delete ex.dataset.reprise
          devoiler(ex.closest('.ecran, [data-ecran]'))
        }

        /**
         * Ce que fait une réponse. Dans le cours, l'exercice fini garde sa trace (fiche:trace). Dans un
         * item de pratique, chaque réponse vérifiée part au gabarit, avec l'aide reçue : une réussite
         * qui suit une réponse fausse compte avec l'aide 1 au moins, le retour de l'erreur a orienté
         * (règle P03).
         */
        /**
         * Une réponse à la tentative de l'étape 3 (règles C03 et M01) : elle part au gabarit, qui la garde
         * sans verdict et corrige toute la série à la fin. L'outil ne dit rien ; l'exercice est fini, la
         * suite de l'écran paraît. « Je ne sais pas » (fiche:essai-passe) est une réponse vide.
         */
        function essayer(ex, c, res) {
          ex.dataset.fini = 'oui'
          c.bloquer?.()
          const reponse = res.r ?? res.v
          ex.dispatchEvent(
            new CustomEvent('fiche:essai', {
              bubbles: true,
              detail: {
                cle: ex.dataset.id,
                reponse: reponse === undefined || reponse === null ? null : String(reponse),
                juste: Boolean(res.ok),
                attendu: typeof c.solution === 'function' ? sansPoint(c.solution()) : '',
                // Après coup, un indice pour réessayer n'a plus d'objet : ce qui cause l'erreur, ou pourquoi.
                retour: res.ok
                  ? (ex.dataset.explication ?? '')
                  : res.d?.m || ex.dataset.explication || '',
              },
            }),
          )
          devoiler(ex.closest('.ecran, [data-ecran]'))
        }

        function repondre(ex, c, res) {
          if (fini(ex)) return
          if ('essai' in ex.dataset) return essayer(ex, c, res)
          const fautes = Number(ex.dataset.fautes || 0)
          const cran = c.echelle ? c.echelle.cran() : 0
          if (res.ok) {
            const aide = Math.min(4, fautes > 0 ? Math.max(cran, 1) : cran)
            signaler(ex, true, aide)
            const etat = fautes === 0 && cran === 0 ? 'ok1' : 'ok'
            if (!dansItem(ex) && ex.dataset.id && !ex.dataset.variante)
              tracer('ex:' + ex.dataset.id, { e: etat, v: res.v ?? null })
            // Dans un item, la réponse juste se garde aussi : elle revient au retour sur l'item.
            if (dansItem(ex)) tracerItem(ex, { e: etat, v: res.v ?? null, cran })
            appliquer(
              ex,
              c,
              etat,
              res.v,
              (res.m || 'Juste.') + (ex.dataset.succes ? ' ' + ex.dataset.succes : ''),
            )
            expliquerApres(ex, c, cran)
            return
          }
          ex.dataset.fautes = String(fautes + 1)
          signaler(ex, false, cran)
          const libre = signalerErreur(ex, res.d?.e)
          const m =
            (res.d && res.d.m ? res.d.m : (ex.dataset.sinon ?? 'Pas encore. Réessaie.')) +
            (libre ? '' : ' C’est une erreur critique : envoie ton bilan avant de continuer.')
          // Une valeur VRAI ou FAUX écartée laisse la bonne, donnée : c'est une solution vue, comme
          // l'option qui reste d'un choix (règle F04).
          if (res.vu) return montrerSolution(ex, c, m)
          if (c.marque) {
            dire(ex, 'faux', m)
            // Tant que plusieurs options restent, l'échelle aide (règle F03). L'option qui reste ne se
            // choisit pas : c'est une solution vue, qui se refait ou s'explique (règle F04).
            if (c.restantes() > 1) return c.echelle?.tentative()
            // Plus rien à choisir : les crans qui restent s'ouvrent, puis la solution (règle F03).
            c.echelle?.toutOuvrir()
            return montrerSolution(ex, c, m)
          }
          dire(ex, 'faux', m)
          c.echelle?.tentative()
        }

        /**
         * Après une réponse juste, l'explication que l'exercice demande. Après une solution vue, sur
         * une variante ou au dernier cran, il explique la solution ; sinon, `data-justifier` pose sa
         * question. Une explication déclarée qui n'est pas Solide deux fois (ou ne compte pas) montre
         * la solution, puis l'item se refait sur l'autre cas, dans les deux branches : sans cela,
         * l'item resterait ni réussi ni à refaire.
         */
        function expliquerApres(ex, c, cran) {
          const libre = ex.closest('[data-solution-vue]') || ex.dataset.variante || cran === 3
          if (!libre && !ex.dataset.justifier) return
          ex.addEventListener(
            'fiche:explication-ratee',
            (e) => montrerSolution(ex, c, e.detail?.message),
            { once: true },
          )
          if (libre) expliquer(ex, c.solution())
          else expliquer(ex, c.solution(), fr(ex.dataset.justifier))
        }

        /** L'état gardé d'un item de pratique : le cas montré (`origine` ou `variante`) et sa fin. */
        function tracerItem(ex, val) {
          const id = ex.closest('.item')?.dataset.item
          if (id) tracer('item:' + id, { cas: montre[id] ?? 'origine', ...val, le: jourCle() })
        }

        /** La solution montrée, en bout d'échelle. */
        function montrerSolution(ex, c, avant) {
          const solution = sansPoint(c.solution()) + '.'
          if (dansItem(ex)) {
            tracerItem(ex, { e: 'vu', v: null })
            // Le gabarit note « solution vue » tout de suite ; l'item se redessine sur « je refais ».
            signaler(ex, false, 4, { garder: true })
            ex.dataset.fini = 'oui'
            c.remplir('vu')
            c.bloquer()
            dire(ex, '', (avant ? avant + ' ' : '') + 'Solution : ' + solution)
            const refaire = el('button', {
              type: 'button',
              class: 'bouton',
              text: 'J’ai compris, je refais sans regarder',
            })
            ex.append(el('div', { class: 'actions' }, refaire))
            refaire.addEventListener('click', () => {
              // Le gabarit note la solution vue avec son cas : l'item revient sur l'autre.
              ex.dispatchEvent(new CustomEvent('fiche:refaire', { bubbles: true }))
            })
            return
          }
          if (ex.dataset.id && !ex.dataset.variante)
            tracer('ex:' + ex.dataset.id, { e: 'vu', v: null })
          const reprise = avecReprise(ex)
          if (reprise) ex.dataset.reprise = 'oui'
          const suite =
            reprise && c.variante
              ? ' Pour continuer, refais-le sur un autre cas, sans regarder, puis explique-le.'
              : ''
          appliquer(
            ex,
            c,
            'vu',
            null,
            (avant ? avant + ' ' : '') + 'Solution : ' + solution + suite,
          )
          if (reprise) apresSolution(ex, c)
          else proposerVariante(ex, c)
        }

        /** Dans le cours, après une solution : refaire sans regarder, sur un autre cas. */
        function proposerVariante(ex, c) {
          if (!c.variante || $(':scope > .refaire', ex)) return
          const bouton = el('button', {
            type: 'button',
            class: 'bouton secondaire petit',
            text: 'Je refais sans regarder, sur un autre cas',
          })
          const zone = el('div', { class: 'refaire' }, bouton)
          bouton.addEventListener('click', () => {
            const nouveau = c.variante()
            if (!nouveau) return
            // Sans regarder : l'exercice et sa solution se cachent, seul l'autre cas reste à l'écran.
            for (const n of Array.from(ex.children)) if (n !== zone) n.hidden = true
            nouveau.dataset.variante = 'oui'
            if (ex.dataset.id) nouveau.dataset.origine = ex.dataset.id
            zone.replaceChildren(nouveau)
            monterEx(nouveau)
          })
          ex.append(zone)
        }

        function ligneSaisie(ex) {
          const input = el('input', {
            type: 'text',
            inputmode: 'numeric',
            autocomplete: 'off',
            spellcheck: 'false',
            'aria-label': 'Ta réponse',
            id: uid('champ-' + (ex.dataset.id || 'x')),
          })
          const bouton = el('button', { type: 'button', class: 'bouton', text: 'Vérifier' })
          const ligne = el('div', { class: 'saisie' }, input, bouton)
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') bouton.click()
          })
          return { ligne, input, bouton }
        }
        /** Un nouvel exercice du même type, pour la variante du cours. */
        function nouvelEx(widget, donnees, question) {
          const ex = el('div', { class: 'ex', 'data-widget': widget })
          for (const [cle, val] of Object.entries(donnees)) ex.dataset[cle] = String(val)
          ex.append(el('p', { class: 'q', text: question }))
          return ex
        }

        const TYPES = {
          choix(ex) {
            const rep = ex.dataset.reponse
            const liste = $('.options', ex)
            const items = $$(':scope > li', liste)
            const boutons = items.map((li) => {
              const b = el('button', { type: 'button' })
              b.append(...li.childNodes)
              li.append(b)
              return b
            })
            if (ex.dataset.melanger !== 'non') melanger(items).forEach((li) => liste.append(li))
            const juste = items.findIndex((li) => li.dataset.option === rep)
            const c = {
              marque: true,
              solution: () => items[juste].textContent.trim(),
              restantes: () => boutons.filter((b) => !b.disabled).length,
              remplir(etat) {
                boutons[juste].classList.add(etat === 'vu' ? 'montre' : 'choisi-bon')
              },
              bloquer() {
                boutons.forEach((b) => {
                  b.disabled = true
                })
              },
            }
            boutons.forEach((b, i) =>
              b.addEventListener('click', () => {
                if (fini(ex)) return
                const r = items[i].textContent.trim()
                if ('essai' in ex.dataset)
                  return essayer(ex, c, { ok: i === juste, r, d: { m: items[i].dataset.retour } })
                if (i === juste) return repondre(ex, c, { ok: true, r })
                b.classList.add('choisi-faux')
                b.disabled = true
                repondre(ex, c, {
                  ok: false,
                  r,
                  d: { m: items[i].dataset.retour || 'Pas celle-ci.', e: items[i].dataset.erreur },
                })
              }),
            )
            return c
          },

          nombre(ex) {
            const d = ex.dataset
            const rep = Number(d.reponse)
            const { ligne, input, bouton } = ligneSaisie(ex)
            ex.append(ligne)
            const c = {
              solution: () => String(rep),
              remplir() {
                input.value = String(rep)
              },
              bloquer() {
                input.disabled = bouton.disabled = true
              },
            }
            bouton.addEventListener('click', () => {
              if (input.value.trim() === '')
                return void dire(ex, '', 'Écris ta réponse dans la case.')
              const r = entier(input.value)
              if (Number.isNaN(r)) return void dire(ex, '', 'Écris un nombre entier.')
              repondre(ex, c, { ok: r === rep, v: input.value })
            })
            return c
          },
          /** Le schéma du bloc, construit pour un cas nouveau et jugé par l'IA. */
          schema(ex) {
            // Le schéma construit pour un cas nouveau, jugé par l'IA sur la chaîne (règle C08) : l'éditeur
            // et le modèle caché sont ceux du gabarit. Solide, il est réussi ; sinon, après deux essais,
            // le schéma du cours paraît, pour comparer.
            const schema = window.JanusGabarit.schema(ex)
            const cle = 'ex:' + ex.dataset.id
            const c = {
              sansEchelle: true,
              solution: () => schema.attendu,
              remplir() {
                schema.montrer()
              },
              bloquer() {
                schema.bloquer()
              },
            }
            ex.addEventListener('fiche:trace', (e) => {
              const trace = e.detail?.valeur
              if (e.detail?.cle !== 'explique:' + cle || typeof trace?.fin !== 'string') return
              if (fini(ex)) return
              const derniere = trace.essais?.[trace.essais.length - 1]?.correction
              const solide = derniere?.niveau === 'solide'
              const etat = trace.fin === 'simulee' || solide ? 'ok' : 'vu'
              tracer(cle, { e: etat, v: null })
              appliquer(
                ex,
                c,
                etat,
                null,
                solide
                  ? 'Ton schéma est Solide. Voici celui du cours, pour comparer.'
                  : 'Voici le schéma du cours\u00a0: compare-le au tien, étape par étape. Tes mots et ton nombre de boîtes peuvent différer.',
              )
            })
            queueMicrotask(() =>
              ex.dispatchEvent(
                new CustomEvent('fiche:expliquer', {
                  bubbles: true,
                  detail: {
                    cle,
                    solution: schema.attendu,
                    consigne: 'Ton schéma\u00a0:',
                    question: schema.question,
                    saisie: schema.saisie,
                    // Construit sans solution vue : pas « avec support ».
                    apresSolution: false,
                    essais: 2,
                    envoyer: 'Faire juger mon schéma',
                  },
                }),
              ),
            )
            return c
          },
        }

        /**
         * Un autre cas écrit dans la fiche, pour refaire sans regarder dans le cours (règle F03) : un
         * exercice du même outil, fait des attributs `data-variante-…` de l'exercice sans leur préfixe,
         * avec `data-variante-enonce` pour énoncé ; une chaîne lit ses pièces dans `data-variante-pieces`,
         * un classement ses éléments dans `data-variante-elements` et `data-variante-retours`.
         */
        function autreCas(ex) {
          const donnees = {}
          for (const [cle, val] of Object.entries(ex.dataset)) {
            const m = /^variante([A-Z]\w*)$/.exec(cle)
            if (!m || m[1] === 'Enonce') continue
            donnees[m[1].charAt(0).toLowerCase() + m[1].slice(1)] = val
          }
          return nouvelEx(ex.dataset.widget, donnees, ex.dataset.varianteEnonce)
        }

        /** Monte un exercice : son contrôleur, son échelle d'aide, et l'état gardé d'une visite précédente. */
        function monterEx(ex) {
          const fabrique = TYPES[ex.dataset.widget]
          if (!fabrique) return
          const c = fabrique(ex)
          if (!c.variante && ex.dataset.varianteEnonce && !dansItem(ex))
            c.variante = () => autreCas(ex)
          if (ex.dataset.solution && !c.solutionFixe) c.solution = () => ex.dataset.solution
          retourDe(ex)
          if ('essai' in ex.dataset) return monterEssai(ex, c)
          if (!c.sansEchelle) {
            c.echelle = window.JanusGabarit.echelle(ex, {
              crans: (c.crans ?? []).map((t) => (typeof t === 'function' ? () => fr(t()) : fr(t))),
              fini: () => fini(ex),
              surSolution: () => montrerSolution(ex, c),
              // Un choix : « Voir la solution » ne paraît que s'il peut servir, et ses crans
              // s'enchaînent après la première réponse fausse.
              restantes: c.restantes,
              enchaine: typeof c.restantes === 'function',
            })
            ex.append(c.echelle.zone)
          }
          if (dansItem(ex)) {
            remonterItem(ex, c)
            return c
          }
          if (ex.dataset.variante) return c
          const garde = traces['ex:' + ex.dataset.id]
          if (garde && typeof garde === 'object' && garde.e) {
            // Une solution vue, ni refaite ni expliquée à la visite d'avant : la suite de l'écran
            // attend encore (règle F04).
            const cle = 'explique:ex:' + ex.dataset.id
            const reprise =
              garde.e === 'vu' &&
              avecReprise(ex) &&
              !garde.refait &&
              !traces[cle] &&
              !traces[cle + ':variante']
            if (reprise) ex.dataset.reprise = 'oui'
            appliquer(ex, c, garde.e, garde.v)
            if (reprise) apresSolution(ex, c)
            else {
              // L'explication déjà écrite revient avec sa correction, et l'autre cas refait avec sa
              // réponse : sans cela, l'exercice redemande ce qui est fait.
              if (traces[cle]) expliquer(ex, c.solution(), consigneExplication(ex, garde.e))
              if (garde.e === 'vu' && garde.variante && c.variante)
                remonterVariante(ex, c, garde.variante)
              else if (garde.e === 'vu') proposerVariante(ex, c)
            }
          }
          return c
        }

        /** La consigne d'une explication déjà demandée, pour la remontrer telle qu'elle a été posée. */
        function consigneExplication(ex, etat) {
          if (etat === 'vu') return fr(POUR_CONTINUER)
          if (ex.dataset.justifier && !ex.dataset.variante) return fr(ex.dataset.justifier)
          return undefined
        }

        /** L'autre cas d'un exercice du cours, refait à la visite d'avant : il revient fini. */
        function remonterVariante(ex, c, garde) {
          const nouveau = c.variante()
          if (!nouveau) return proposerVariante(ex, c)
          for (const n of Array.from(ex.children)) n.hidden = true
          nouveau.dataset.variante = 'oui'
          nouveau.dataset.remonte = 'oui'
          if (ex.dataset.id) nouveau.dataset.origine = ex.dataset.id
          ex.append(el('div', { class: 'refaire' }, nouveau))
          const cv = monterEx(nouveau)
          if (!cv) return
          appliquer(nouveau, cv, garde.e, garde.v)
          delete nouveau.dataset.remonte
          // Réussi, l'autre cas demande toujours son explication (comme à la réponse) ; vu, elle est faite.
          if (garde.e !== 'vu' || traces['explique:' + cleExplication(nouveau)])
            expliquer(nouveau, cv.solution(), consigneExplication(nouveau, garde.e))
        }

        /**
         * Un item de pratique déjà réussi revient avec sa réponse, et son explication avec ses
         * corrections (ou son champ, si elle attend encore) : l'apprenant ne refait pas ce qu'il a fait.
         * Sauf réussi avec de l'aide et à refaire (`refaire`, dès qu'un autre item a été fait depuis) : il
         * se refait sans aide, sur l'autre cas, pour compter, et l'outil repart à neuf. Le gabarit donne l'état des items dans `fiche:rendu` (`detail.pratique`).
         */
        function remonterItem(ex, c) {
          const id = ex.closest('.item')?.dataset.item
          const garde = id && traces['item:' + id]
          const fait = id && pratique[id]
          if (!garde || !fait?.reussi || garde.cas !== (montre[id] ?? 'origine')) return
          if (garde.e !== 'ok' && garde.e !== 'ok1') return
          if (fait.refaire) return
          appliquer(ex, c, garde.e, garde.v)
          expliquerApres(ex, c, garde.cran ?? 0)
        }

        /**
         * Un essai de l'étape 3 : pas d'échelle d'aide (rien ne s'aide avant l'explication). Déjà répondu,
         * il reste fini ; « Je ne sais pas », que le gabarit ajoute, arrive ici en fiche:essai-passe.
         */
        function monterEssai(ex, c) {
          if (traces['essai:' + ex.dataset.id]) {
            ex.dataset.fini = 'oui'
            c.bloquer?.()
            return
          }
          ex.addEventListener('fiche:essai-passe', () => {
            if (!fini(ex)) essayer(ex, c, { ok: false })
          })
        }

        /**
         * Pas à pas : dans un écran, ce qui suit un exercice pas encore fini attend qu'il le soit (une
         * question à la fois, règle I01). Un groupe d'exercices compte pour une question.
         */
        function devoiler(ecran) {
          if (!ecran) return
          let attendre = false
          for (const enfant of Array.from(ecran.children)) {
            if (attendre) {
              enfant.dataset.attente = ''
              continue
            }
            delete enfant.dataset.attente
            const exercices = enfant.matches('.ex[data-id]') ? [enfant] : $$('.ex[data-id]', enfant)
            if (exercices.some((ex) => !fini(ex) || ex.dataset.reprise === 'oui')) attendre = true
          }
        }

        function pari(n) {
          const cle = n.dataset.cle || 'pari'
          const items = $$('.options > li', n)
          const message = el('p', { class: 'retour', 'aria-live': 'polite' })
          n.append(message)
          const choisir = (option, garder) => {
            items.forEach((li) =>
              $('button', li).setAttribute('aria-pressed', String(li.dataset.option === option)),
            )
            message.textContent = fr(n.dataset.apres || '')
            if (garder) tracer(cle, option)
          }
          items.forEach((li) => {
            const b = el('button', { type: 'button' })
            b.append(...li.childNodes)
            li.append(b)
            b.addEventListener('click', () => choisir(li.dataset.option, true))
          })
          if (typeof traces[cle] === 'string') choisir(traces[cle], false)
        }

        /** La correction du pari (étape 12) : les deux réponses rappelées, sous le schéma refait. */
        function bilanPari(n) {
          const libelles = Object.fromEntries(
            (n.dataset.options || '').split('|').map((x) => x.split('=')),
          )
          const peindre = () => {
            const dits = []
            if (libelles[traces.pari])
              dits.push('Au début, tu avais répondu : « ' + libelles[traces.pari] + ' ».')
            if (libelles[traces['pari-fin']])
              dits.push(
                'Avant le schéma, tu as répondu : « ' + libelles[traces['pari-fin']] + ' ».',
              )
            n.hidden = !dits.length
            n.textContent = fr(dits.join(' '))
          }
          peindre()
          document.addEventListener('fiche:trace', peindre)
        }

        /** Le rappel du pari, au-dessus de la question qui le reprend. */
        function rappelPari(n) {
          const choisi = traces.pari
          const ex = n.closest('.ex')
          const option =
            typeof choisi === 'string' ? $('li[data-option="' + choisi + '"]', ex) : null
          if (!option) return
          n.hidden = false
          n.textContent = fr('Au début, tu avais répondu : « ' + option.textContent.trim() + ' »')
        }

        // --- Les outils propres au bloc.

        /**
         * Classer : chaque élément (une ligne) va dans l'une des deux colonnes, par un bouton par
         * colonne (`data-colonnes` : « cle=Libellé|cle=Libellé »). La réponse attendue :
         * `data-reponse` « C=fichier,Java=fichier,… ». Les lignes sont les <li> de `.a-classer`
         * (`data-element`, et `data-retour` pour la ligne mal classée, `data-erreur` quand c'est une
         * erreur critique) ; sans liste, elles viennent de `data-elements` (« C|Java ») et
         * `data-retours` (« C=…|Java=… »), pour l'autre cas d'une variante. « Vérifier » attend que
         * chaque ligne soit classée ; une ligne fausse donne son retour, et compte pour une réponse
         * fausse ; l'échelle d'aide est celle du gabarit (data-aide1, data-aide2).
         */
        function classer(ex) {
          const d = ex.dataset
          const colonnes = (d.colonnes || '').split('|').map((x) => x.split('='))
          const attendu = Object.fromEntries((d.reponse || '').split(',').map((x) => x.split('=')))
          let liste = $('.a-classer', ex)
          if (!liste) {
            const retours = Object.fromEntries(
              (d.retours || '').split('|').map((x) => x.split('=')),
            )
            liste = el(
              'ul',
              { class: 'a-classer' },
              ...(d.elements || '')
                .split('|')
                .map((nom) =>
                  el('li', { 'data-element': nom, 'data-retour': retours[nom], text: nom }),
                ),
            )
            ex.append(liste)
          }
          const lignes = $$(':scope > li', liste).map((li) => {
            const nom = li.dataset.element
            const titre = el('span', { class: 'contenu' })
            titre.append(...li.childNodes)
            const boutons = colonnes.map(([cle, libelle]) => {
              const b = el('button', {
                type: 'button',
                class: 'colonne',
                'data-cle': cle,
                'aria-pressed': 'false',
                'aria-label': nom + ' : ' + libelle,
                text: libelle,
              })
              b.addEventListener('click', () => {
                if (fini(ex)) return
                boutons.forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
              })
              return b
            })
            li.replaceChildren(titre, el('span', { class: 'colonnes' }, ...boutons))
            return { li, nom, boutons, retour: li.dataset.retour, erreur: li.dataset.erreur }
          })
          const choisie = (L) =>
            L.boutons.find((b) => b.getAttribute('aria-pressed') === 'true')?.dataset.cle
          const poser = (L, cle, classe) =>
            L.boutons.forEach((b) => {
              b.setAttribute('aria-pressed', String(b.dataset.cle === cle))
              if (classe && b.dataset.cle === cle) b.classList.add(classe)
            })
          const libelle = (cle) => colonnes.find(([k]) => k === cle)?.[1] ?? cle
          const bouton = el('button', { type: 'button', class: 'bouton', text: 'Vérifier' })
          ex.append(el('div', { class: 'saisie' }, bouton))
          const c = {
            solution: () =>
              colonnes
                .map(([cle, lib]) => {
                  const noms = lignes.filter((L) => attendu[L.nom] === cle).map((L) => L.nom)
                  return noms.length ? noms.join(', ') + ' : ' + lib.toLowerCase() : ''
                })
                .filter(Boolean)
                .join(' ; '),
            remplir(etat, v) {
              const donne =
                etat === 'vu' || !v
                  ? attendu
                  : Object.fromEntries(v.split(',').map((x) => x.split('=')))
              lignes.forEach((L) => poser(L, donne[L.nom], etat === 'vu' ? 'montre' : 'choisi-bon'))
            },
            bloquer() {
              bouton.disabled = true
              lignes.forEach((L) => L.boutons.forEach((b) => (b.disabled = true)))
            },
          }
          bouton.addEventListener('click', () => {
            if (fini(ex)) return
            const manque = lignes.filter((L) => !choisie(L))
            if (manque.length)
              return void dire(
                ex,
                '',
                'Classe chaque ligne : il reste ' + manque.map((L) => L.nom).join(', ') + '.',
              )
            const v = lignes.map((L) => L.nom + '=' + choisie(L)).join(',')
            const fausse = lignes.find((L) => choisie(L) !== attendu[L.nom])
            if (!fausse) return repondre(ex, c, { ok: true, v })
            lignes.forEach((L) => {
              if (choisie(L) !== attendu[L.nom]) {
                L.boutons.forEach((b) =>
                  b.classList.toggle('choisi-faux', b.dataset.cle === choisie(L)),
                )
              }
            })
            const m =
              (fausse.retour ||
                'Regarde « ' +
                  fausse.nom +
                  ' » : ' +
                  libelle(choisie(fausse)).toLowerCase() +
                  ', vraiment ?') +
              (lignes.filter((L) => choisie(L) !== attendu[L.nom]).length > 1
                ? ' D’autres lignes sont à revoir.'
                : '')
            repondre(ex, c, { ok: false, v, d: { m, e: fausse.erreur } })
          })
          return c
        }

        /**
         * Une chaîne à remettre dans l'ordre : les pièces (<li data-piece> de `.lignes-ordre`, ou
         * `data-pieces` « a : texte | b : texte » pour l'autre cas) se montent et se descendent avec
         * les flèches ; `data-reponse` « a,c,b » est l'ordre juste ; `data-fixe`, une pièce déjà
         * placée en tête et bloquée. Le retour nomme la première place fausse et demande ce qui vient
         * juste après la pièce d'avant, sans la nommer.
         */
        function chaine(ex) {
          const d = ex.dataset
          let liste = $('.lignes-ordre', ex)
          if (!liste) {
            liste = el(
              'ol',
              { class: 'lignes-ordre' },
              ...(d.pieces || '').split('|').map((l) => {
                const [, id, texte] = /^\s*(\w+)\s*:\s*(.+?)\s*$/.exec(l) ?? []
                return el('li', { 'data-piece': id, text: texte })
              }),
            )
            ex.append(liste)
          }
          const pieces = $$(':scope > li', liste).map((li) => ({
            li,
            id: li.dataset.piece,
            texte: li.textContent.trim(),
          }))
          const fixee = pieces.find((P) => P.id === d.fixe)
          let ordre = fixee
            ? [fixee, ...melanger(pieces.filter((P) => P !== fixee))]
            : melanger(pieces)
          for (const P of pieces) {
            P.haut = el('button', {
              type: 'button',
              class: 'bouton secondaire petit',
              'aria-label': 'Monter « ' + P.texte + ' »',
              text: '↑',
            })
            P.bas = el('button', {
              type: 'button',
              class: 'bouton secondaire petit',
              'aria-label': 'Descendre « ' + P.texte + ' »',
              text: '↓',
            })
            P.li.replaceChildren(
              el('span', { class: 'contenu', text: P.texte }),
              el('span', { class: 'fleches' }, P.haut, P.bas),
            )
            P.haut.addEventListener('click', () => bouger(P, -1))
            P.bas.addEventListener('click', () => bouger(P, 1))
          }
          function peindre() {
            ordre.forEach((P, k) => {
              liste.append(P.li)
              P.haut.disabled = fini(ex) || k <= (fixee ? 1 : 0) || P === fixee
              P.bas.disabled = fini(ex) || k === ordre.length - 1 || P === fixee
              P.li.classList.toggle('placee', P === fixee)
            })
          }
          function bouger(P, sens) {
            if (fini(ex)) return
            const k = ordre.indexOf(P)
            const l = k + sens
            if (P === fixee || ordre[l] === fixee || l < 0 || l >= ordre.length) return
            ;[ordre[k], ordre[l]] = [ordre[l], ordre[k]]
            peindre()
            const cible = sens < 0 ? P.haut : P.bas
            ;(cible.disabled ? (sens < 0 ? P.bas : P.haut) : cible).focus()
          }
          const bonOrdre = () => d.reponse.split(',').map((id) => pieces.find((P) => P.id === id))
          const bouton = el('button', { type: 'button', class: 'bouton', text: 'Vérifier' })
          ex.append(el('div', { class: 'saisie' }, bouton))
          const c = {
            solution: () =>
              bonOrdre()
                .map((P) => P.texte)
                .join(', puis '),
            remplir(etat, v) {
              const ids = (etat === 'vu' || !v ? d.reponse : v).split(',')
              ordre = ids.map((id) => pieces.find((P) => P.id === id)).filter(Boolean)
              if (ordre.length !== pieces.length) ordre = bonOrdre()
              peindre()
            },
            bloquer() {
              peindre()
              bouton.disabled = true
            },
          }
          bouton.addEventListener('click', () => {
            if (fini(ex)) return
            const v = ordre.map((P) => P.id).join(',')
            const bon = bonOrdre()
            const k = ordre.findIndex((P, i) => P !== bon[i])
            if (k === -1)
              return repondre(ex, c, { ok: true, v, m: 'Juste : la chaîne est dans l’ordre.' })
            const m =
              k === 0
                ? 'Par quoi tout commence-t-il, avant toute traduction ?'
                : 'Après « ' +
                  ordre[k - 1].texte +
                  ' », tu as mis « ' +
                  ordre[k].texte +
                  ' ». Qu’est-ce qui en sort directement ?'
            repondre(ex, c, { ok: false, v, d: { m } })
          })
          peindre()
          return c
        }

        TYPES.classer = classer
        TYPES.chaine = chaine

        const OUTILS = {
          pari,
          'rappel-pari': rappelPari,
          'bilan-pari': bilanPari,
        }

        /**
         * Le cas de chaque item, celui que le gabarit donne (`cas` dans `detail.pratique`), relu des
         * résultats par la règle du moteur : après une solution vue ou une aide éloignée, l'autre cas
         * (la variante, `<template data-variante>`, ou l'énoncé d'origine si c'est la variante qui a été
         * aidée) ; un item réussi revient sur le cas réussi. La boîte le dit au gabarit (`data-cas`),
         * qui l'envoie avec chaque résultat. Sans variante, l'item garde son énoncé d'origine.
         */
        const montre = {}
        function poserLaVariante() {
          for (const boite of $$('#contenu .item[data-item]')) {
            const id = boite.dataset.item
            const variante = $('template[data-variante="' + id + '"]')
            const choix = variante && pratique[id]?.cas === 'variante' ? 'variante' : 'origine'
            if (choix === 'variante')
              $('.enonce', boite).replaceChildren(variante.content.cloneNode(true))
            montre[id] = choix
            boite.dataset.cas = choix
          }
        }

        const montes = new WeakSet()
        /** L'état des items de pratique que le gabarit a noté (réussi, aide, jour), à chaque rendu. */
        let pratique = {}
        document.addEventListener('fiche:rendu', (evenement) => {
          for (const [cle, val] of Object.entries(evenement.detail?.traces ?? {})) traces[cle] = val
          pratique = evenement.detail?.pratique ?? {}
          poserLaVariante()
          // Les outils d'abord (le guichet décide si le pari paraît), puis les exercices.
          for (const n of $$('#contenu [data-widget]')) {
            if (montes.has(n) || !OUTILS[n.dataset.widget]) continue
            montes.add(n)
            OUTILS[n.dataset.widget](n)
          }
          for (const n of $$('#contenu .ex[data-widget]')) {
            if (montes.has(n) || !TYPES[n.dataset.widget]) continue
            montes.add(n)
            monterEx(n)
          }
          for (const ecran of $$('#contenu .ecran')) devoiler(ecran)
        })
      })()
    </script>

    <!--
      PLOMBERIE : ne pas toucher. Ce bloc est celui du gabarit, octet pour octet, comme <style id="polices">
      et <style id="styles-gabarit"> : fiches:verifier les compare, fiches:assembler --forcer les réécrit.
    -->
    <script id="plomberie">
      'use strict'
      const manifeste = JSON.parse(document.getElementById('bloc-manifest').textContent)
      const CLE_ETAT = 'janus.fiche.' + manifeste.bloc + '.etat'
      /*
       * Les quatre moments du cycle de la méthode (percevoir, tenter, modéliser, faire, recevoir un
       * retour, ajuster), dans l'ordre du fil, avec les types d'étape de chacun. `ensemble`, c'est
       * ajuster : en fin de bloc, après la pratique, le pari du début repris puis le schéma refait de
       * mémoire (règle C08). `perception`, `pretest` et `ensemble` se dessinent comme une explication
       * (afficherLibre).
       */
      const MOMENTS = [
        { nom: 'Découvrir', types: ['perception', 'carte'] },
        { nom: 'Comprendre', types: ['pretest', 'explication'] },
        { nom: 'S’entraîner', types: ['pratique', 'atelier', 'aisance', 'ensemble'] },
        { nom: 'Prouver', types: ['restitution', 'bilan'] },
      ]
      const momentDe = (etape) => MOMENTS.find((moment) => moment.types.includes(etape.type))
      /** Les types d'étape que le gabarit sait dessiner : chacun a son moment. */
      const ETAPES_FICHE = MOMENTS.flatMap((moment) => moment.types)
      /** Les étapes à lire, dessinées depuis leur `<template data-etape>`. */
      const ETAPES_LIBRES = [
        'perception',
        'pretest',
        'explication',
        'ensemble',
        'atelier',
        'aisance',
      ]
      const LIBELLES_STATUT = {
        non_commence: 'Non commencé',
        en_cours: 'En cours',
        vu: 'Vu',
        acquis_provisoirement: 'Acquis provisoirement',
        acquis: 'Acquis',
        maitrise: 'Maîtrisé',
        a_reprendre: 'À reprendre',
      }
      const etapes = manifeste.etapes.filter((etape) => ETAPES_FICHE.includes(etape.type))
      const $ = (id) => document.getElementById(id)
      $('titre').textContent = manifeste.titre
      document.title = manifeste.titre

      // --- Mode autonome : correction simulée et localStorage (sur claude.ai : Claude et localStorage) ---
      /** Un UUID v7, comme l'exige le schéma d'une correction. */
      function uuidV7() {
        const temps = Date.now().toString(16).padStart(12, '0')
        const h = Array.from(crypto.getRandomValues(new Uint8Array(12)), (o) =>
          o.toString(16).padStart(2, '0'),
        ).join('')
        const variante = (8 + (parseInt(h[3], 16) & 3)).toString(16)
        return (
          temps.slice(0, 8) +
          '-' +
          temps.slice(8) +
          '-7' +
          h.slice(0, 3) +
          '-' +
          variante +
          h.slice(4, 7) +
          '-' +
          h.slice(7, 19)
        )
      }
      /**
       * Hors de l'appli, personne ne juge le sens d'une réponse : compter des mots laisserait passer une
       * paraphrase vide. La page ne dit donc jamais « solide » : elle montre ce qui était attendu, et
       * l'apprenant compare. La correction n'est pas vérifiée, elle ne compte pas (le moteur dit de même
       * pour une certitude `non_verifie`) : la bulle porte le badge « Non vérifiée ».
       */
      /**
       * L'attendu d'une question est écrit pour le correcteur : il cite les étapes par leur numéro et les
       * erreurs critiques par leur code. Montré à l'apprenant, il dit le titre de l'étape et le nom de
       * l'erreur, qu'il connaît, à la place.
       */
      function attenduEnMots(texte) {
        const titre = (n) => manifeste.etapes.find((e) => e.id === 'ET' + n)?.titre
        const libelle = (code) =>
          (manifeste.erreurs_critiques ?? []).find((e) => e.id === code)?.libelle
        return String(texte)
          .replace(/\bl([’'])erreur (E\d+)\b/g, (tout, apostrophe, code) => {
            const nom = libelle(code)
            return nom ? 'l' + apostrophe + 'erreur «\u00a0' + nom + '\u00a0»' : tout
          })
          .replace(/(étapes?) (\d+(?:, \d+)*(?: et \d+)?)/g, (tout, mot, liste) => {
            // Les onglets n'ont pas de numéro : on nomme l'onglet, comme `etapesEnMots` côté appli.
            const noms = (liste.match(/\d+/g) ?? []).map(titre)
            if (noms.some((nom) => !nom)) return tout
            const cites = noms.map((nom) => '«\u00a0' + nom + '\u00a0»')
            const dernier = cites.pop()
            return mot + ' ' + (cites.length ? cites.join(', ') + ' et ' + dernier : dernier)
          })
      }
      function corrigerLocalement(demande) {
        const question =
          demande.serie === 'explication'
            ? (explicationDeclaree(demande.question) ?? demande.libre)
            : manifeste.restitution.find((q) => q.id === demande.question)
        const reponse = demande.reponse.trim()
        const message = (texte, niveau) => ({
          id: uuidV7(),
          echantillon: false,
          question: demande.question,
          tour: demande.relance === '' ? 1 : 2,
          niveau,
          message:
            'Correction simulée (mode autonome)\u00a0: ' +
            texte +
            (question
              ? ' Ce qui était attendu\u00a0: «\u00a0' + attenduEnMots(question.attendu) + '\u00a0»'
              : ''),
          erreurs_critiques: [],
          source: 'deduit',
          ref: 'autonome',
          certitude: 'non_verifie',
          compte: false,
          raison_non_compte: 'non_verifiee',
        })

          return message('pas encore. Relis la carte du bloc.', 'pas_encore')
        if (reponse.length < 40)
          return message('ta réponse est trop courte pour montrer une idée, développe.', 'fragile')
        return message(
          'la page ne juge pas le sens de ta réponse. Compare-la avec l’attendu, et complète-la avec tes mots s’il te manque une idée.',

        charger: () => {

          } catch {
            return null
          }

      let serieOuverte = { restitution: true }
      let etat = { etape: etapes[0].id, envoyees: {}, retourCours: false }
      const pont = window.JanusPont
      if (window.parent !== window) document.documentElement.dataset.integree = ''
      /** Le dernier statut reçu de l'appli : `manque` dit, entre autres, les erreurs encore ouvertes. */
      let dernierStatut = null
      /** Remet à jour le bouton « Étape suivante » de l'étape affichée (après une réponse envoyée). */
      let majPied = () => {}
      /** Remet à jour le bilan affiché quand un statut arrive. */
      let majBilan = () => {}
      /** Remet à jour l'item de pratique affiché quand la pratique du serveur arrive, sans le redessiner. */
      let majPratique = () => {}
      /** La tentative de l'étape `pretest` affichée : ses essais notés se figent, la série finie se corrige. */
      let majEssais = () => {}
      /** Le dernier bilan envoyé depuis cette page : son identifiant, pour reconnaître un refus. */
      let bilanEnvoye = null
      /**
       * Les séries d'aisance réussies que l'appli connaît (`etat.init`), `{ le, duree_s }` de la plus
       * ancienne à la plus récente : elles reviennent à l'outil dans `fiche:rendu` (`detail.aisance`),
       * pour qu'il relise ses niveaux même quand l'état de la page a été vidé. Vide hors de l'appli.
       */
      let aisanceServeur = []

      let pratiqueServeur = null
      const essaisEnAttente = []
      const expliquesEnAttente = new Set()

      let majAtelier = () => {}

      function enregistrer({ regrouper = false } = {}) {

      document.addEventListener('fiche:trace', (evenement) => {

      /*

       * déclare pas (après une solution vue) se juge sur la solution de la page et ce que montre l'écran (voir `libre`), une fois, et ne compte
       * jamais ; l'outil peut lui permettre plus d'un essai (`essais`), jusqu'à une correction Solide.
       * Un outil qui a sa propre saisie (un schéma refait de mémoire) la donne dans `saisie` :
       * `{ element, lire, manque }`, l'élément à poser à la place du champ, son texte pour le
       * correcteur, et ce qui manque avant l'envoi (vide : rien) ; `envoyer` nomme le bouton, et
       * `question`, la question pour le correcteur quand la consigne de l'écran ne suffit pas ;
       * `apresSolution: false` dit qu'elle ne suit pas une solution vue (un schéma refait de mémoire) :
       * elle n'est alors pas faite avec support. Sans
       * correcteur, l'explication attend qu'on la renvoie : la page ne juge rien à la place de l'IA. Hors de l'appli, la correction est simulée et ne retient rien. La trace
       * `explique:<cle>` garde les essais et leur correction ; elle est émise quand l'explication est
       * finie, pour l'outil qui attend la suite.
       */
      const ESSAIS_D_EXPLICATION = 2
      /** Dit dès le collage ce qu'il coûte, plutôt qu'après la correction. */
      const AVERTIR_COLLE =
        'Réponse collée\u00a0: elle sera corrigée, mais ne comptera pas. Écris-la ici pour qu’elle compte.'
      const explicationDeclaree = (cle) => (manifeste.explication ?? []).find((e) => e.id === cle)
      /** L'item n'a pas d'explication à donner, ou elle est faite. */
      const explicationFaite = (item) =>
        !(manifeste.explication ?? []).some((e) => e.item === item) || itemExplique(item)
      /** Un item de pratique réussi : sa réponse, puis son explication quand il en demande une. */
      const itemReussi = (item) => itemPratique(item).etat !== 'a_faire' && explicationFaite(item)
      // Sur #contenu, qui porte tous les exercices de la page.
      $('contenu').addEventListener('fiche:expliquer', (evenement) => {
        const {
          cle,
          solution,
          consigne,
          question,
          saisie,
          essais: permis,
          envoyer,
          apresSolution,
        } = evenement.detail ?? {}
        const exercice = evenement.target
        if (!(exercice instanceof HTMLElement) || typeof cle !== 'string' || cle === '') return
        if (exercice.querySelector(':scope > .expliquer')) return
        const declaree = explicationDeclaree(cle)
        // Une explication déclarée a deux essais ; une autre, un seul, sauf si l'outil en permet plus.
        const maximum = declaree
          ? ESSAIS_D_EXPLICATION
          : Number.isInteger(permis) && permis > 0
            ? permis
            : 1
        // La page montre la consigne de l'outil ; le correcteur lit la question du manifeste, qui se
        // comprend sans l'écran. Sans consigne, l'exercice qui déclare sa demande (`data-justifier`)
        // la montre : sinon l'apprenant explique autre chose que ce que le correcteur juge.
        const intitule =
          typeof consigne === 'string' && consigne !== ''
            ? consigne
            : exercice.dataset.justifier ||
              'Explique pourquoi c’est juste, en une ou deux phrases\u00a0:'
        /*
         * Une explication libre se juge sur ce que l'écran montre : la consigne et la question de
         * l'exercice, le texte de l'écran qui le précède (la règle dont il parle), et pour l'attendu,
         * la solution avec le retour affiché (`.retour`, `.explication`), qui dit pourquoi. Sans eux, le
         * correcteur ne lit que « Oui » et ne peut rien vérifier. Avec un seul essai, il ne demande pas
         * de refaire.
         */
        const enLigne = (texte) => (texte ?? '').replace(/\s+/g, ' ').trim()
        const CONTEXTE_MAX = 1500
        const libre = () => {
          const ecran = exercice.closest('[data-ecran], .ecran')
          let avant = ''
          if (ecran) {
            const portee = document.createRange()
            portee.setStart(ecran, 0)
            portee.setEndBefore(exercice)
            avant = enLigne(portee.toString())
            if (avant.length > CONTEXTE_MAX) avant = '…' + avant.slice(-CONTEXTE_MAX)
          }
          const lire = (selecteur) => enLigne(exercice.querySelector(selecteur)?.textContent)
          const enonce = lire(':scope > .q') || lire('.q')
          const retour = [lire(':scope > .retour'), lire(':scope > .explication')]
            .filter(Boolean)
            .join(' ')
          return {
            question: [
              typeof question === 'string' && question !== '' ? question : intitule,
              enonce && 'Exercice\u00a0: ' + enonce,
              avant && 'Ce que l’écran montre avant l’exercice\u00a0: ' + avant,
              maximum === 1 &&
                'L’apprenant n’écrit qu’une explication\u00a0: dis ce qui est juste et ce qui manquait, sans lui demander de la refaire.',
            ]
              .filter(Boolean)
              .join('\n'),
            attendu: [String(solution ?? ''), retour].filter(Boolean).join(' '),
          }
        }
        // Une explication déclarée ratée a montré la solution : l'outil ne la redemande qu'une fois
        // l'item refait sans regarder, et elle repart à neuf. Sinon l'item ne pourrait plus réussir.
        const gardee = etat.traces?.['explique:' + cle]
        const ancienne = declaree && gardee?.fin === 'ratee' ? undefined : gardee
        const essais = Array.isArray(ancienne?.essais) ? ancienne.essais : []
        const zone = creer('div', { className: 'expliquer' })
        zone.setAttribute('aria-live', 'polite')
        const lue = (essai) => [
          creer('p', { className: 'explication-envoyee', textContent: essai.texte }),
          bulleCorrection(essai.correction),
          ...accordSur(essai.correction),
        ]
        /** L'explication est finie : la trace part, l'outil et l'item lisent la suite. */
        const finir = (fin) => {
          if (declaree && (fin === 'solide' || fin === 'simulee')) noterExplique(declaree.item)
          exercice.dispatchEvent(
            new CustomEvent('fiche:trace', {
              bubbles: true,
              detail: { cle: 'explique:' + cle, valeur: { essais, fin, le: aujourdhui() } },
            }),
          )
          exercice.dispatchEvent(new CustomEvent('fiche:explique', { bubbles: true }))
        }
        const formulaire = (rang) => {
          const id = 'explique-' + cle.replace(/[^\w-]/g, '_') + '-' + rang
          // L'outil peut donner sa saisie (un schéma à refaire) : la page la lit en texte.
          const champ = saisie
            ? saisie.element
            : creer('textarea', {
                id,
                rows: 3,
                value: rang === 0 && typeof ancienne?.texte === 'string' ? ancienne.texte : '',
              })
          const lireChamp = () => (saisie ? saisie.lire() : champ.value)
          let colle = false
          champ.addEventListener('paste', () => {
            colle = true
            message.textContent = AVERTIR_COLLE
          })
          // Le collage s’efface quand l’apprenant vide le champ pour écrire lui-même.
          champ.addEventListener('input', () => {
            if (!colle || lireChamp().trim() !== '') return
            colle = false
            if (message.textContent === AVERTIR_COLLE) message.textContent = ''
          })
          const radios = [
            ['sur', 'Sûr'],
            ['hesitant', 'Hésitant'],
            ['hasard', 'Au hasard'],
          ].map(([valeur, libelle]) => ({
            libelle,
            entree: creer('input', { type: 'radio', name: 'conf-' + id, value: valeur }),
          }))
          const confiance = creer(
            'fieldset',
            { className: 'choix', dataset: { lecture: '' } },
            creer('legend', { textContent: 'Ta confiance' }),
            ...radios.map(({ libelle, entree }) => creer('label', {}, entree, libelle)),
          )
          const message = creer('p', { className: 'erreur', role: 'alert' })
          const bouton = creer('button', {
            type: 'button',
            className: 'bouton secondaire petit',
            textContent:
              typeof envoyer === 'string' && envoyer !== '' ? envoyer : 'Envoyer mon explication',
          })
          const bloc = creer(
            'div',
            { className: 'expliquer-essai' },
            creer(saisie ? 'p' : 'label', {
              ...(saisie ? {} : { htmlFor: id }),
              textContent:
                rang === 0
                  ? intitule
                  : saisie
                    ? 'Reprends-le, d’après la correction\u00a0:'
                    : 'Reprends ton explication, d’après la correction\u00a0:',
            }),
            champ,
            confiance,
            creer('div', { className: 'actions' }, bouton),
            message,
          )
          bouton.addEventListener('click', async () => {
            const choisie = confiance.querySelector('input:checked')
            const manque = saisie ? saisie.manque() : ''
            if (manque) return void (message.textContent = manque)
            if (lireChamp().trim() === '')
              return void (message.textContent = 'Écris d’abord ton explication.')
            if (!choisie)
              return void (message.textContent = 'Choisis ta confiance avant d’envoyer.')
            message.textContent = ''
            bouton.disabled = true
            let support
            try {
              const correction = await pont.demanderCorrection({
                serie: 'explication',
                question: cle,
                reponse: lireChamp(),
                confiance: choisie.value,
                relance: '',
                // « Revenir au cours » ne marque que les réponses données pendant la restitution
                // commencée : pas une explication de la pratique faite après, la série finie.
                support: (support = {
                  colle,
                  retour_cours: etat.retourCours && serieEnCours() !== undefined,
                }),
                // Une explication libre suit une solution vue (avec support), sauf quand l'outil dit
                // le contraire (`apresSolution: false`, un schéma refait de mémoire).
                ...(declaree
                  ? {}
                  : {
                      libre: {
                        ...libre(),
                        ...(apresSolution === false ? { apres_solution: false } : {}),
                      },
                    }),
              })
              noterReperees('explique:' + cle, correction.erreurs_critiques)
              essais.push({ texte: lireChamp(), correction: resumeCorrection(correction, support) })
              const fin =
                mode === 'autonome'
                  ? 'simulee'
                  : !declaree
                    ? correction.niveau === 'solide' || essais.length >= maximum
                      ? 'jugee'
                      : null
                    : correction.niveau === 'solide' && correction.compte
                      ? 'solide'
                      : essais.length >= maximum
                        ? 'ratee'
                        : null
              if (fin === null) {
                etat.traces = {
                  ...(etat.traces ?? {}),
                  ['explique:' + cle]: { essais, fin, le: aujourdhui() },
                }
                enregistrer()
              } else finir(fin)
              // La correction affichée est celle que la trace garde : l'avis demandé s'y enregistre.
              const gardees = etat.traces['explique:' + cle].essais
              bloc.replaceWith(...lue(gardees[gardees.length - 1]))
              if (fin === null) zone.append(formulaire(rang + 1))
              if (fin === 'ratee') {
                const raison =
                  (correction.niveau === 'solide'
                    ? 'Ton explication est Solide, mais elle ne compte pas'
                    : 'Ton explication n’est pas encore Solide') +
                  '\u00a0: voici la solution de l’item, puis tu le refais sur un autre cas.'
                zone.append(creer('p', { className: 'discret', textContent: raison }))
                exercice.dispatchEvent(
                  new CustomEvent('fiche:explication-ratee', {
                    bubbles: true,
                    detail: { message: raison },
                  }),
                )
              }
            } catch (erreur) {
              message.textContent =
                'Correction impossible\u00a0: ' +
                (erreur && erreur.detail ? erreur.detail : erreur.message) +
                ' Ton explication attend\u00a0: renvoie-la.'
              bouton.disabled = false
            }
          })
          return bloc
        }
        if (essais.length > 0) zone.append(creer('p', { textContent: intitule }))
        for (const essai of essais) zone.append(...lue(essai))
        if (ancienne?.fin === undefined || ancienne.fin === null)
          zone.append(formulaire(essais.length))
        exercice.append(zone)
        // De retour sur la page, l'outil qui attend la fin de l'explication la relit.
        if (typeof ancienne?.fin === 'string' && ancienne.fin !== 'ratee') {
          exercice.dispatchEvent(
            new CustomEvent('fiche:trace', {
              bubbles: true,
              detail: { cle: 'explique:' + cle, valeur: ancienne },
            }),
          )
        }
      })
      /*
       * La tentative avant l'explication (règles C03 et M01) : dans une étape `pretest`, chaque exercice
       * `data-essai` (avec son `data-id`) émet `fiche:essai`, avec `detail: { cle, reponse, juste,
       * attendu, retour }`. La page garde la première réponse (trace `essai:<cle>`), l'envoie une fois à
       * l'appli (`pretest.reponse`), ne dit ni juste ni faux, et corrige toute la série à la fin de
       * l'étape, sous « Tes essais ». « Je ne sais pas » est une réponse : la page émet
       * `fiche:essai-passe` sur l'exercice, et l'outil y répond par `fiche:essai`, sa réponse attendue
       * avec ; sans outil qui réponde, la page lit l'attendu dans les attributs de l'exercice.
       */
      document.addEventListener('fiche:essai', (evenement) => {
        const { cle, reponse, juste, attendu, retour } = evenement.detail ?? {}
        if (typeof cle !== 'string' || cle === '' || etat.traces?.['essai:' + cle]) return
        noterEssai(cle, {
          reponse: typeof reponse === 'string' && reponse.trim() !== '' ? reponse.trim() : null,
          juste: juste === true,
          attendu: typeof attendu === 'string' ? attendu : '',
          retour: typeof retour === 'string' ? retour : '',
          vue: vueDeLEssai(evenement.target),
        })
      })
      /**
       * Ce que l'apprenant voyait en répondant, pour le lui remontrer au retour sur la page : la valeur
       * de chaque champ, et chaque bouton enfoncé (son rang et son texte, un bouton déplacé ne se
       * rallume pas à tort).
       */
      function vueDeLEssai(ex) {
        if (!(ex instanceof Element)) return undefined
        return {
          champs: Array.from(ex.querySelectorAll('input, textarea'), (c) => c.value),
          enfonces: Array.from(ex.querySelectorAll('button'))
            .map((b, k) => [k, b.textContent.trim(), b.getAttribute('aria-pressed')])
            .filter(([, , presse]) => presse === 'true')
            .map(([k, texte]) => [k, texte]),
        }
      }
      function remontrerEssai(ex, essai) {
        const vue = essai.vue
        if (vue) {
          const champs = ex.querySelectorAll('input, textarea')
          if (Array.isArray(vue.champs) && vue.champs.length === champs.length)
            champs.forEach((c, k) => {
              if (c.value === '' && typeof vue.champs[k] === 'string') c.value = vue.champs[k]
            })
          const boutons = ex.querySelectorAll('button')
          for (const [k, texte] of Array.isArray(vue.enfonces) ? vue.enfonces : [])
            if (boutons[k]?.textContent.trim() === texte)
              boutons[k].setAttribute('aria-pressed', 'true')
        }
        if (essai.reponse === null) return
        // Une option mélangée change de rang : elle se retrouve par son texte.
        for (const b of ex.querySelectorAll('.options button'))
          if (b.textContent.trim() === essai.reponse) b.setAttribute('aria-pressed', 'true')
        if (vue) return
        // Un essai noté avant que la page ne garde sa vue : son champ unique reprend la réponse.
        const champs = ex.querySelectorAll(
          'input:not([type]), input[type="text"], input[type="number"], textarea',
        )
        if (champs.length === 1 && champs[0].value === '') champs[0].value = essai.reponse
      }
      function noterEssai(cle, essai) {
        etat.traces = { ...(etat.traces ?? {}), ['essai:' + cle]: { ...essai, le: aujourdhui() } }
        pont.envoyer('pretest.reponse', {
          question: cle,
          reponse: (essai.reponse ?? 'Je ne sais pas').slice(0, 2000),
        })
        enregistrer()
        majEssais()
        rappelerEssais($('contenu'))
      }
      /**
       * Une explication qui part des essais (règle C03) : `data-essai-rappel="c2"` affiche la réponse
       * notée à l'essai c2 (son texte reste tant qu'il n'y en a pas) ; `data-si-essai="c2:faux"` ne
       * montre l'élément que si l'essai c2 est dans cet état : `juste`, `faux`, `passe` (« Je ne sais
       * pas ») ou `absent` (pas encore fait), plusieurs séparés par `|`.
       */
      function rappelerEssais(racine) {
        for (const el of racine.querySelectorAll('[data-essai-rappel]')) {
          const essai = etat.traces?.['essai:' + el.dataset.essaiRappel]
          if (essai?.reponse) el.textContent = entreGuillemets(essai.reponse)
        }
        for (const el of racine.querySelectorAll('[data-si-essai]')) {
          const [cle, etats = ''] = el.dataset.siEssai.split(':')
          const essai = etat.traces?.['essai:' + cle]
          const etatEssai = !essai
            ? 'absent'
            : essai.reponse === null
              ? 'passe'
              : essai.juste
                ? 'juste'
                : 'faux'
          el.hidden = !etats.split('|').includes(etatEssai)
        }
      }
      /** Ce qu'un exercice attend, quand aucun outil ne le dit : l'option juste, la solution, la réponse. */
      function attenduEcrit(ex) {
        const juste = ex.dataset.reponse
        const option = juste
          ? Array.from(ex.querySelectorAll('[data-option]')).find((o) => o.dataset.option === juste)
          : undefined
        return (option?.textContent ?? ex.dataset.solution ?? juste ?? '')
          .replace(/\s+/g, ' ')
          .trim()
      }
      /** Une réponse citée : sans point final, et sans doubler des guillemets qu'elle porte déjà. */
      function entreGuillemets(texte) {
        const t = texte.replace(/[.;\s]+$/, '')
        return /^«.*»$/.test(t) ? t : '« ' + t + ' »'
      }
      /** L'énoncé d'un essai, avec la question de son groupe quand il en fait partie (« 1 lampe »). */
      function enonceEssai(ex) {
        const propre = ex.querySelector('.q')?.textContent ?? ''
        const groupe = ex.closest('.groupe')?.querySelector(':scope > .q')?.textContent
        return ((groupe ? groupe + ' ' : '') + propre).replace(/\s+/g, ' ').trim()
      }
      function essaisDe(section) {
        const exercices = Array.from(section.querySelectorAll('[data-essai][data-id]'))
        const essais = exercices.map((ex) => etat.traces?.['essai:' + ex.dataset.id])
        exercices.forEach((ex, k) => {
          const essai = essais[k]
          const passer = ex.querySelector(':scope > .essai-passe')
          // Un essai ne se vérifie pas sur le moment : son bouton dit ce qu'il fait, il garde la réponse.
          for (const b of ex.querySelectorAll('button'))
            if (b.textContent.trim() === 'Vérifier') b.textContent = 'Enregistrer'
          if (!essai) {
            if (passer) return
            const bouton = creer('button', {
              type: 'button',
              className: 'bouton secondaire petit',
              textContent: 'Je ne sais pas',
              onclick: () => {
                const cle = ex.dataset.id
                ex.dispatchEvent(new CustomEvent('fiche:essai-passe'))
                if (!etat.traces?.['essai:' + cle])
                  noterEssai(cle, {
                    reponse: null,
                    juste: false,
                    attendu: attenduEcrit(ex),
                    retour: ex.dataset.explication ?? '',
                  })
              },
            })
            ex.append(creer('div', { className: 'actions essai-passe' }, bouton))
            return
          }
          passer?.remove()
          for (const champ of ex.querySelectorAll('input, button, select, textarea'))
            champ.disabled = true
          // La réponse reste visible, même après un rechargement.
          remontrerEssai(ex, essai)
          const note =
            ex.querySelector(':scope > .essai-note') ??
            ex.appendChild(creer('p', { className: 'discret essai-note', 'aria-live': 'polite' }))
          note.textContent =
            (essai.reponse === null
              ? 'Noté : tu ne sais pas encore.'
              : 'Noté : ' + entreGuillemets(essai.reponse) + '.') +
            ' La correction vient à la fin de l’étape.'
        })
        const ecrans = section.querySelectorAll('.ecran')
        const bilan =
          section.querySelector('.essais-bilan') ??
          (ecrans[ecrans.length - 1] ?? section).appendChild(
            creer('div', { className: 'essais-bilan', hidden: true }),
          )
        const fini = exercices.length > 0 && essais.every(Boolean)
        bilan.hidden = !fini
        if (fini)
          bilan.replaceChildren(
            creer('h3', { textContent: 'Tes essais' }),
            creer('p', {
              textContent:
                'Voici ce que tu as répondu, et ce qui était attendu. Les étapes suivantes expliquent pourquoi, à partir de tes réponses.',
            }),
            creer(
              'ol',
              {},
              ...exercices.map((ex, k) => {
                const essai = essais[k]
                const fin = (texte) => String(texte).replace(/[.;\s]+$/, '') + '.'
                // Juste, faux ou passé se voit d'un coup d'œil : une marque écrite et sa couleur.
                const etatEssai = essai.reponse === null ? 'passe' : essai.juste ? 'juste' : 'faux'
                const ligne = (libelle, texte) =>
                  creer(
                    'p',
                    {},
                    creer('span', { className: 'essai-libelle', textContent: libelle }),
                    texte,
                  )
                return creer(
                  'li',
                  { dataset: { etat: etatEssai } },
                  creer('span', {
                    className: 'essai-marque',
                    textContent: { juste: '✓ Juste', faux: '✗ Pas juste', passe: '? À découvrir' }[
                      etatEssai
                    ],
                  }),
                  creer('p', {}, creer('strong', { textContent: enonceEssai(ex) })),
                  // Les lignes que l'essai faisait lire (un pseudo-code) reviennent avec lui : le bilan
                  // se lit sans remonter à l'écran de l'essai (B02 v33, le thermostat).
                  ...Array.from(ex.querySelectorAll(':scope > pre'), (pre) => pre.cloneNode(true)),
                  // Sans réponse, pas de solution à garder sans l'avoir comprise (règle F04) :
                  // l'étape suivante l'explique, à partir des réponses de la série.
                  ...(essai.reponse === null
                    ? [
                        creer('p', {
                          textContent: 'Tu ne savais pas : les étapes suivantes te l’apprennent.',
                        }),
                      ]
                    : [
                        ligne('Ta réponse : ', fin(essai.reponse)),
                        ...(essai.juste || essai.attendu === ''
                          ? []
                          : [ligne('Attendu : ', fin(essai.attendu))]),
                        ...(essai.retour
                          ? [creer('p', { className: 'discret', textContent: essai.retour })]
                          : []),
                      ]),
                )
              }),
            ),
          )
        majPied()
      }
      /**
       * Une erreur critique repérée, par le correcteur dans une réponse ou par un outil : elle reste
       * connue après un rechargement, et le bilan suivant la coche d'office (`aCocher`) sans que
       * l'apprenant puisse la décocher (règle V01). `cle` dit où : l'identifiant de la question, ou
       * « outil: » suivi de l'endroit que l'outil nomme.
       */
      function noterReperees(cle, ids) {
        if (ids.length === 0) return
        const deja = etat.erreurs?.[cle] ?? []
        etat.erreurs = { ...(etat.erreurs ?? {}), [cle]: [...new Set([...deja, ...ids])] }
        etat.aCocher = [...new Set([...(etat.aCocher ?? []), ...ids])]
        enregistrer()
      }
      /**
       * Une réponse nouvelle à une question remplace ce que la précédente avait fait repérer : ces
       * erreurs ne sont plus cochées d'office, sauf si une autre réponse ou un outil les a aussi
       * repérées. Sans cela, une erreur refermée par la nouvelle réponse resterait cochée et
       * verrouillée dans le bilan, et l'envoyer la rouvrirait.
       */
      function remplacerReperees(question) {
        etat.erreurs = { ...(etat.erreurs ?? {}), [question]: [] }
        const encore = new Set(Object.values(etat.erreurs).flat())
        etat.aCocher = (etat.aCocher ?? []).filter((id) => encore.has(id))
      }
      /**
       * Amine a rejeté une erreur que le correcteur avait repérée dans la réponse à une question : le
       * bilan ne la coche plus d'office, sauf si une autre réponse ou un outil l'a aussi repérée.
       */
      function retirerReperee(question, erreur) {
        const deja = etat.erreurs?.[question] ?? []
        if (!deja.includes(erreur)) return false
        etat.erreurs = { ...etat.erreurs, [question]: deja.filter((id) => id !== erreur) }
        if (!Object.values(etat.erreurs).some((ids) => ids.includes(erreur)))
          etat.aCocher = (etat.aCocher ?? []).filter((id) => id !== erreur)
        enregistrer()
        return true
      }
      /**
       * Un outil qui reconnaît une erreur critique dans une réponse (des bits lus à l'envers, un départ
       * de 256) émet sur son élément `fiche:erreur` (`bubbles: true`, `cancelable: true`, `detail:
       * { erreur, ou }`). Une fois la restitution faite, l'erreur attend le bilan : le gabarit annule
       * l'événement, et l'outil dit d'envoyer le bilan avant de continuer.
       */
      $('contenu').addEventListener('fiche:erreur', (evenement) => {
        const { erreur, ou } = evenement.detail ?? {}
        if (typeof ou !== 'string' || ou === '') return
        if (!manifeste.erreurs_critiques.some((e) => e.id === erreur)) return
        noterReperees('outil:' + ou, [erreur])
        if (bilanAttendu()) evenement.preventDefault()
      })
      /**
       * L'étape affichée est vue : l'appli la coche. Pas une étape masquée par la restitution en cours,
       * dont l'apprenant ne lit que « Masqué » ; elle le sera quand elle se rouvrira.
       */
      function noterVue() {
        const etape = etapes.find((e) => e.id === etat.etape) ?? etapes[0]
        if (etape && !masquee(etape)) pont.envoyer('etape.vue', { etape: etape.id })
      }
      function aller(id) {
        etat.etape = id
        noterVue()
        enregistrer({ regrouper: true })
        afficher()
        remonter($('contenu'))
      }
      /**
       * Nouvel écran ou nouvelle étape : son haut revient à l'écran. Dans l'appli, la fiche ne défile
       * pas seule (l'iframe a la hauteur du contenu) : c'est l'appli qui remonte, si besoin.
       */
      function remonter(element) {
        if (mode === 'appli') pont.envoyer('page.haut', {})
        else element.scrollIntoView({ block: 'start' })
      }
      const pluriel = (nombre, singulier, plusieurs) =>
        nombre + ' ' + (nombre > 1 ? plusieurs : singulier)
      /** Le jour sur cet appareil, AAAA-MM-JJ : une solution vue ne compte plus le lendemain. */
      function aujourdhui() {
        const date = new Date()
        const deux = (nombre) => String(nombre).padStart(2, '0')
        return date.getFullYear() + '-' + deux(date.getMonth() + 1) + '-' + deux(date.getDate())
      }
      /** Le cas d'origine, la variante : ce que la page envoie avec un résultat. */
      const CAS = ['origine', 'variante']
      const idsPratique = () =>
        (manifeste.pratique ?? []).flatMap((exercice) => exercice.items.map((item) => item.id))
      /** Hors de l'appli, la page garde elle-même ses résultats et ses explications. */
      function pratiqueLocale() {
        const locale = etat.pratiqueLocale
        if (locale && Array.isArray(locale.resultats) && Array.isArray(locale.expliques))
          return locale
        etat.pratiqueLocale = { resultats: [], expliques: [] }
        return etat.pratiqueLocale
      }
      /** Les résultats de la pratique dans l'ordre : ceux du serveur, puis ceux qui l'attendent. */
      function essaisPratique() {
        if (pratiqueServeur === null) return pratiqueLocale().resultats
        const connus = new Set(pratiqueServeur.resultats.map((resultat) => resultat.id))
        return [
          ...pratiqueServeur.resultats,
          ...essaisEnAttente.filter((resultat) => !connus.has(resultat.id)),
        ]
      }
      /** Le jour de l'appli (son fuseau, son heure de bascule) ; hors de l'appli, celui de l'appareil. */
      const jourPratique = () => pratiqueServeur?.aujourdhui ?? aujourdhui()
      /**
       * Chaque item, relu de ses résultats par la règle du moteur (`suivreLaPratique` dans
       * `@janus/contrats`) : son état (à faire, réussi avec de l'aide, réussi), l'aide qu'il garde,
       * s'il se refait sur l'autre cas, les items qui débloquent son aide, le relais.
       */
      function itemsPratique() {
        return window.JanusPratique.suivre(idsPratique(), essaisPratique(), jourPratique())
      }
      const itemPratique = (id) => itemsPratique().get(id)
      function itemExplique(item) {
        if (pratiqueServeur === null) return pratiqueLocale().expliques.includes(item)
        return pratiqueServeur.expliques.includes(item) || expliquesEnAttente.has(item)
      }
      function noterExplique(item) {
        if (pratiqueServeur !== null) expliquesEnAttente.add(item)
        else if (!pratiqueLocale().expliques.includes(item)) pratiqueLocale().expliques.push(item)
      }
      /** Hors de l'appli, la page garde elle-même les constats de l'atelier. */
      function atelierLocal() {
        if (!Array.isArray(etat.atelierLocal)) etat.atelierLocal = []
        return etat.atelierLocal
      }
      /** Les constats de l'atelier dans l'ordre : ceux du serveur, puis ceux qui l'attendent. */
      function constatsAtelier() {
        if (pratiqueServeur === null) return atelierLocal()
        const connus = new Set(pratiqueServeur.atelier.map((constat) => constat.id))
        return [
          ...pratiqueServeur.atelier,
          ...ateliersEnAttente.filter((constat) => !connus.has(constat.id)),
        ]
      }
      /**
       * L'atelier relu de ses constats par la règle du moteur (`suivreLAtelier`) : réussi sans aide (il
       * compte), le dernier constat, l'aide qu'il garde aujourd'hui.
       */
      const suiviAtelier = () => window.JanusPratique.atelier(constatsAtelier(), jourPratique())
      /** La pratique que le serveur garde : ce qu'elle contient n'attend plus ici. */
      function recevoirPratique(pratique) {
        if (!pratique) return
        pratiqueServeur = pratique
        const connus = new Set(pratique.resultats.map((resultat) => resultat.id))
        for (let k = essaisEnAttente.length - 1; k >= 0; k -= 1) {
          if (connus.has(essaisEnAttente[k].id)) essaisEnAttente.splice(k, 1)
        }
        for (const item of pratique.expliques) expliquesEnAttente.delete(item)
        const constats = new Set(pratique.atelier.map((constat) => constat.id))
        for (let k = ateliersEnAttente.length - 1; k >= 0; k -= 1) {
          if (constats.has(ateliersEnAttente[k].id)) ateliersEnAttente.splice(k, 1)
        }
      }
      /*
       * L'état d'avant gardait le dernier constat de l'atelier (`etat.atelier`). Dans l'appli, le
       * serveur a les constats : la copie s'efface. Hors de l'appli, elle devient le premier constat
       * de la page, daté d'un jour passé : son aide ne pèse plus aujourd'hui.
       */
      function reprendreAncienAtelier() {
        const ancien = etat.atelier
        delete etat.atelier
        if (pratiqueServeur !== null || !ancien || typeof ancien !== 'object') return
        if (atelierLocal().length > 0) return
        atelierLocal().push({
          id: 'avant-atelier',
          reussi: ancien.reussi === true,
          aide: [0, 1, 2, 3, 4].includes(ancien.aide) ? ancien.aide : 4,
          jour: '1970-01-01',
        })
      }
      /*
       * L'état d'avant la refonte gardait sa copie des items (`etat.pratique`). Dans l'appli, le serveur
       * a leurs résultats : la copie s'efface. Hors de l'appli, elle devient les résultats de la page :
       * un item réussi le reste, avec l'aide notée.
       */
      function reprendreAnciennePratique() {
        reprendreAncienAtelier()
        const ancienne = etat.pratique
        delete etat.pratique
        delete etat.rangPratique
        if (pratiqueServeur !== null || !ancienne || typeof ancienne !== 'object') return
        const locale = pratiqueLocale()
        for (const [item, note] of Object.entries(ancienne)) {
          if (note?.reussi === true) {
            locale.resultats.push({
              id: 'avant-' + item,
              item,
              reussi: true,
              aide: [0, 1, 2, 3, 4].includes(note.aide) ? note.aide : 0,
              brute: false,
              jour: typeof note.aideLe === 'string' ? note.aideLe : '1970-01-01',
              cas: null,
