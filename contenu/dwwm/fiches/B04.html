        --couleur-accent-sur-fond: light-dark(#ffffff, #0f1a28);
        --couleur-accent-douce: light-dark(#e8eff8, #1f2b3a);
        --couleur-succes: light-dark(#276f50, #5dc196);
        --couleur-alerte: light-dark(#95620a, #e0ac4a);
        --couleur-erreur: light-dark(#ae3846, #ee8591);
        --couleur-focus: light-dark(#2b6cb0, #8bb9f5);
        --effet-ombre-carte: light-dark(#1b1f24, #000000);
        --espacement-4: 0.25rem;
        --espacement-8: 0.5rem;
        --espacement-12: 0.75rem;
        --espacement-16: 1rem;
        --espacement-20: 1.25rem;
        --espacement-24: 1.5rem;
        --espacement-32: 2rem;
        --espacement-48: 3rem;
        --rayon-champ: 0.625rem;
        --rayon-carte: 0.875rem;
        --rayon-option: 0.375rem;
        --duree-transition: 160ms;
        --focus-anneau: 0 0 0 2px var(--couleur-fond), 0 0 0 4px var(--couleur-focus);
        --ombre-option: 0 2px 6px color-mix(in srgb, var(--effet-ombre-carte) 8%, transparent);
        --hauteur-champ: 48px;
        --hauteur-bouton: 48px;
        --cible-tactile-min: 44px;
        --largeur-lecture: 62ch;
        --police-texte: 'Inter', system-ui, sans-serif;
        --police-code: 'JetBrains Mono', ui-monospace, monospace;
      }
      /* Le thème choisi dans l'appli (message etat.init) l'emporte sur le réglage du téléphone. */
      :root[data-theme='clair'] {
        color-scheme: light;
      }
      :root[data-theme='sombre'] {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: var(--couleur-fond);
        color: var(--couleur-encre);
        font-family: var(--police-texte);
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5rem;
      }
      button,
      summary,
      label {
        touch-action: manipulation;
      }

      /* Barre et fil d'étapes : montrés seulement hors de l'appli (aperçu), qui a les siens. */
      .barre {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8) var(--espacement-12);
        min-height: 56px;
        padding: var(--espacement-8) var(--espacement-16);
        background: var(--couleur-surface);
        border-block-end: 1px solid var(--couleur-ligne);
      }
      .barre h1 {
        flex: 1 1 140px;
        min-width: 0;
        margin: 0;
        font-size: 1rem;
        font-weight: 500;
        line-height: 1.5rem;
      }
      .barre p {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8);
        margin: 0;
      }
      .mode {
        padding: 2px var(--espacement-8);
        border-radius: var(--rayon-option);
        background: var(--couleur-surface-douce);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .fil {
        background: var(--couleur-surface);
        border-block-end: 1px solid var(--couleur-ligne);
      }
      .bascule {
        display: none;
      }
      .etapes,
      .moment > ol {
        display: flex;
        flex-wrap: wrap;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .etapes {
        gap: var(--espacement-4) var(--espacement-16);
        justify-content: center;
        padding: 0 var(--espacement-12);
      }
      /* Un moment du cycle : son nom, puis ses étapes ; celui de l'étape courante prend l'accent. */
      .moment {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0 var(--espacement-4);
      }
      .moment > ol {
        gap: 0 var(--espacement-4);
      }
      .moment-nom {
        padding: 0 var(--espacement-8);
        color: var(--couleur-texte-discret);
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .moment[data-courant='oui'] > .moment-nom {
        color: var(--couleur-accent);
      }
      .onglet {
        position: relative;
        min-height: 44px;
        padding: 0 var(--espacement-12);
        border: 0;
        background: transparent;
        color: var(--couleur-texte-secondaire);
        font: inherit;
        font-size: 0.875rem;
        line-height: 1.25rem;
        white-space: nowrap;
        cursor: pointer;
      }
      .onglet:hover {
        color: var(--couleur-encre);
      }
      .onglet:focus-visible {
        outline: none;
        border-radius: var(--rayon-champ);
        box-shadow: var(--focus-anneau);
      }
      .onglet[aria-current='step'] {
        color: var(--couleur-accent);
        font-weight: 500;
      }
      .onglet[aria-current='step']::after {
        position: absolute;
        inset-block-end: 0;
        inset-inline: var(--espacement-12);
        block-size: 2px;
        background: var(--couleur-accent);
        content: '';
      }
      @media (max-width: 40rem) {
        .bascule {
          display: flex;
          align-items: center;
          justify-content: space-between;
          inline-size: 100%;
          min-height: 48px;
          padding: 0 var(--espacement-16);
          border: 0;
          background: transparent;
          color: var(--couleur-accent);
          font: inherit;
          font-size: 0.875rem;
          font-weight: 500;
          line-height: 1.25rem;
          cursor: pointer;
        }
        .fil[data-ouvert='false'] .etapes {
          display: none;
        }
        .etapes {
          flex-direction: column;
          gap: var(--espacement-4);
          justify-content: flex-start;
          padding-block-end: var(--espacement-8);
        }
        .moment,
        .moment > ol {
          flex-direction: column;
          align-items: stretch;
        }
        .moment-nom {
          padding: var(--espacement-8) var(--espacement-12) 0;
        }
        .onglet {
          inline-size: 100%;
          text-align: start;
        }
        .onglet[aria-current='step']::after {
          display: none;
        }
      }
      /* Dans l'appli, la barre et le fil d'étapes sont ceux de la page : la fiche n'en montre pas un second. */
      html[data-integree] .barre,
      html[data-integree] .fil {
        display: none;
      }
      html[data-integree] section > h2 {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /*
       * Dans l'appli, l'iframe prend la hauteur du contenu (message page.taille) : la fiche ne défile
       * pas seule. Elle se pose sur le fond de la page, ses cartes ont la largeur de celle du haut.
       */
      html[data-integree] {
        scrollbar-width: none;
      }
      html[data-integree]::-webkit-scrollbar {
        display: none;
      }
      html[data-integree] body {
        background: transparent;
      }
      html[data-integree] main {
        max-width: none;
        padding: 0;
      }

      /* Page : une colonne, des cartes séparées par le même intervalle que dans l'appli. */
      main {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-16);
        max-width: 760px;
        margin: 0 auto;
        padding: var(--espacement-16) var(--espacement-16) var(--espacement-48);
      }
      /* Une erreur de l'appli : la barre est cachée dans l'appli, l'avis passe au-dessus de l'étape. */
      .avis {
        margin: 0;
        padding: var(--espacement-12) var(--espacement-16);
        border: 1px solid var(--couleur-erreur);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface);
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      #contenu {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-16);
        min-width: 0;
      }
      section {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
        padding: var(--espacement-20);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-carte);
        background: var(--couleur-surface);
      }
      /* Les blocs d'une carte s'espacent par le gap, jamais par des marges qui se cumulent. */
      section :is(h2, h3, h4, p, ul, ol, dl, figure, blockquote, pre, fieldset) {
        margin: 0;
      }
      .ecran,
      .enonce {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
      }
      .ecran[hidden],
      .bouton[hidden],
      [data-si-essai][hidden] {
        display: none;
      }
      h2 {
        font-size: 1.375rem;
        font-weight: 600;
        line-height: 1.75rem;
        text-wrap: balance;
      }
      h3 {
        font-size: 1.125rem;
        font-weight: 600;
        line-height: 1.625rem;
        text-wrap: balance;
      }
      h4 {
        font-size: 1rem;
        font-weight: 600;
      }
      p,
      li {
        overflow-wrap: break-word;
      }
      .ecran p,
      .ecran li {
        max-width: var(--largeur-lecture);
      }
      .ecran .accroche {
        font-size: 1.125rem;
        line-height: 1.75rem;
      }
      ul,
      ol {
        padding-inline-start: var(--espacement-20);
      }
      /* Seulement les listes du contenu : le fil d'étapes et les autres listes d'interface ont leur propre gap. */
      section :is(ul, ol) > li + li {
        margin-top: var(--espacement-8);
      }
      ul.plain {
        padding-inline-start: var(--espacement-20);
      }
      .discret {
        color: var(--couleur-texte-secondaire);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      a {
        color: var(--couleur-encre);
        font-weight: 500;
        text-decoration: none;
        transition: color var(--duree-transition);
      }
      a:hover {
        color: var(--couleur-accent);
      }
      code,
      kbd {
        font-family: var(--police-code);
        font-size: 0.875em;
        font-variant-ligatures: none;
      }
      code {
        padding: 1px var(--espacement-4);
        border-radius: var(--rayon-option);
        background: var(--couleur-surface-douce);
      }
      pre {
        overflow-x: auto;
        padding: var(--espacement-12);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      pre code {
        padding: 0;
        background: none;
      }

      /* Boutons : Bouton.module.css (principal, secondaire). */
      button {
        font: inherit;
      }
      .bouton {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--espacement-8);
        min-height: var(--hauteur-bouton);
        min-width: var(--cible-tactile-min);
        padding: 0 var(--espacement-16);
        border: 1px solid transparent;
        border-radius: var(--rayon-champ);
        background: var(--couleur-accent);
        color: var(--couleur-accent-sur-fond);
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color var(--duree-transition) ease,
          border-color var(--duree-transition) ease,
          transform var(--duree-transition) ease;
      }
      .bouton:hover:not(:disabled) {
        background: color-mix(in srgb, var(--couleur-accent) 88%, var(--couleur-encre));
      }
      .bouton:active:not(:disabled) {
        background: color-mix(in srgb, var(--couleur-accent) 75%, var(--couleur-encre));
        transform: translateY(1px);
      }
      .bouton.secondaire {
        border-color: var(--couleur-controle);
        background: transparent;
        color: var(--couleur-encre);
      }
      .bouton.secondaire:hover:not(:disabled) {
        background: var(--couleur-surface-douce);
      }
      .bouton.secondaire:active:not(:disabled) {
        border-color: var(--couleur-accent);
        background: var(--couleur-surface-douce);
      }
      .bouton:focus-visible {
        outline: none;
        box-shadow: var(--focus-anneau);
      }
      .bouton:disabled {
        border-color: transparent;
        background: var(--couleur-surface-douce);
        color: var(--couleur-encre);
        opacity: 0.55;
        cursor: not-allowed;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-8);
      }
      @media (prefers-reduced-motion: reduce) {
        .bouton,
        a {
          transition: none;
        }
        .bouton:active:not(:disabled) {
          transform: none;
        }
      }

      /* Champs : ChampTexte, ZoneDeTexte, Selecteur. */
      textarea,
      input[type='text'],
      select {
        width: 100%;
        min-height: var(--hauteur-champ);
        padding: 0 var(--espacement-12);
        border: 1px solid var(--couleur-controle);
        border-radius: var(--rayon-champ);
        background-color: var(--couleur-fond);
        color: var(--couleur-encre);
        font: inherit;
        transition: border-color var(--duree-transition) ease;
      }
      input[type='text'] {
        width: auto;
        font-family: var(--police-code);
        font-variant-ligatures: none;
      }
      textarea {
        min-height: 7rem;
        padding: var(--espacement-12);
        resize: vertical;
        field-sizing: content;
      }
      .reponse-envoyee {
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      textarea:disabled,
      input:disabled {
        background-color: var(--couleur-surface-douce);
        opacity: 0.65;
      }
      textarea:focus-visible,
      input[type='text']:focus-visible,
      select:focus-visible {
        outline: none;
        border-color: var(--couleur-accent);
        box-shadow: var(--focus-anneau);
      }
      select {
        padding-inline-end: var(--espacement-32);
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, currentcolor 50%),
          linear-gradient(135deg, currentcolor 50%, transparent 50%);
        background-position:
          calc(100% - 1.125rem) 50%,
          calc(100% - 0.8125rem) 50%;
        background-repeat: no-repeat;
        background-size:
          0.3125rem 0.3125rem,
          0.3125rem 0.3125rem;
      }
      /* Une question : sa carte propre, sur le fond de la carte de l'étape. */
      .item {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
        padding: var(--espacement-16);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      .item > label,
      .relance > label {
        font-weight: 500;
      }
      /* Le complément d'une réponse, après sa correction, dans la carte de la question. */
      .relance {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
      }
      .item[data-fait='oui'] {
        border-color: var(--couleur-succes);
      }
      /* Une question à reprendre : la couleur du statut « À reprendre » de l'appli. */
      .item[data-fait='reprise'] {
        border-color: var(--couleur-erreur);
      }
      .item-reprise {
        margin: 0;
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1.25rem;
      }
      .erreur {
        margin: 0;
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .erreur:empty {
        display: none;
      }

      /* Confiance : GroupeSegmente. */
      fieldset {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-8);
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }
      legend {
        float: left;
        width: 100%;
        padding: 0;
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1.25rem;
        color: var(--couleur-texte-secondaire);
      }
      .choix label {
        position: relative;
        display: flex;
        flex: 1 0 auto;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding-inline: var(--espacement-8);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-option);
        background: var(--couleur-fond);
        white-space: nowrap;
        cursor: pointer;
      }
      /* La vraie radio couvre l'option et déborde du cadre : la zone tactile fait au moins 44 px. */
      .choix input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .choix label:has(input:checked) {
        border-color: var(--couleur-accent);
        background: var(--couleur-accent);
        box-shadow: var(--ombre-option);
        color: var(--couleur-accent-sur-fond);
        font-weight: 600;
      }
      .choix label:has(input:focus-visible) {
        box-shadow: var(--focus-anneau);
      }
      .choix label:has(input:disabled) {
        opacity: 0.65;
        cursor: not-allowed;
      }
      /* Une table de vérité à remplir : les faits donnés, puis VRAI ou FAUX à choisir dans chaque case. */
      .table-saisie {
        display: table;
        width: 100%;
        white-space: normal;
      }
      .table-saisie th,
      .table-saisie td {
        padding: var(--espacement-4);
        text-align: center;
        vertical-align: middle;
      }
      .table-saisie td.entree {
        color: var(--couleur-texte-secondaire);
      }
      .table-saisie td.valeur {
        font-weight: 600;
      }
      .table-saisie .choix {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-4);
      }
      .table-saisie .choix label {
        min-height: 44px;
        padding-inline: var(--espacement-4);
      }

      /* L'option choisie d'un essai : marquée, la correction viendra à la fin de l'étape. */
      [data-essai] button[aria-pressed='true']:disabled {
        border-color: var(--couleur-accent);
        background: var(--couleur-accent-douce);
        color: var(--couleur-encre);
        font-weight: 600;
        opacity: 1;
      }
      [data-essai] .options button[aria-pressed='true']::after {
        content: ' · ta réponse';
        color: var(--couleur-accent);
        font-weight: 600;
      }

      /* Correction : BulleCorrection. */
      .correction {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        padding: var(--espacement-20);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-carte);
        background: var(--couleur-surface);
      }
      .correction > strong {
        display: flex;
        align-items: center;
        gap: var(--espacement-8);
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.25rem;
        color: var(--couleur-texte-secondaire);
      }
      .correction > strong::before {
        flex: none;
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: currentcolor;
        content: '';
      }
      .correction[data-niveau='solide'] > strong {
        color: var(--couleur-succes);
      }
      .correction[data-niveau='partiel'] > strong {
        color: var(--couleur-alerte);
      }
      .correction[data-niveau='fragile'] > strong {
        color: var(--couleur-erreur);
      }
      .correction p {
        margin: 0;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      /* Sous la question : la correction, puis l'accord sur le niveau quand elle est tirée au sort. */
      .sortie {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
      }
      .sortie:empty {
        display: none;
      }
      .accord {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8) var(--espacement-12);
      }
      /* BadgeNeComptePas de l'appli : une réponse qui ne compte pas pour le statut, et pourquoi. */
      .badge-compte {
        display: inline-flex;
        align-items: center;
        align-self: flex-start;
        min-height: 1.75rem;
        padding: 0 var(--espacement-12);
        border: 1px solid var(--couleur-ligne);
        border-radius: 999px;
        background: var(--couleur-surface-douce);
        color: var(--couleur-texte-secondaire);
        font-size: 0.75rem;
        font-weight: 500;
        line-height: 1rem;
        white-space: nowrap;
      }

      /* Détails repliables ; l'objectif d'examen replié (carte, pratique) en est un. */
      details {
        padding: 0 var(--espacement-16);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      details[open] {
        padding-block-end: var(--espacement-12);
      }
      details > :not(summary) {
        margin-block-start: var(--espacement-12);
      }
      details > summary + * {
        margin-block-start: var(--espacement-4);
      }
      summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--espacement-12);
        min-height: 48px;
        font-weight: 500;
        list-style: none;
        cursor: pointer;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::after {
        flex: none;
        width: 0.5rem;
        height: 0.5rem;
        border-inline-end: 2px solid var(--couleur-texte-secondaire);
        border-block-end: 2px solid var(--couleur-texte-secondaire);
        transform: rotate(45deg) translate(-2px, -2px);
        transition: transform var(--duree-transition) ease;
        content: '';
      }
      details[open] > summary::after {
        transform: rotate(-135deg) translate(-2px, -2px);
      }
      summary:focus-visible {
        outline: none;
        border-radius: var(--rayon-champ);
        box-shadow: var(--focus-anneau);
      }

      .defile {
        max-width: 100%;
        overflow-x: auto;
      }

      /* Le schéma du bloc : les boîtes en colonne, une flèche légendée entre deux ; celles que l'étape n'éclaire pas encore restent pâles. */
      .schema-bloc {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: var(--espacement-4);
      }
      .schema-bloc .fleche {
        display: flex;
        align-items: baseline;
        gap: var(--espacement-8);
        padding-inline: var(--espacement-12);
        line-height: 1.25rem;
      }
      .schema-bloc .boite-fixe.eteinte {
        border-color: var(--couleur-ligne);
        color: var(--couleur-texte-discret);
      }
      .schema-bloc .boite-fixe.eteinte small {
        color: var(--couleur-texte-discret);
      }
      .schema-bloc .fleche::before {
        content: '↓';
        flex: none;
        color: var(--couleur-accent);
      }

      /* La machine de Yasmine : quatre boîtes et trois flèches sur une ligne (sept colonnes) ; empilées sous 720 px. */
      /* Un écran de Windows ou de macOS, recopié : sa barre de titre, puis ses valeurs. */
      .ecran-simule {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
        padding: var(--espacement-12) var(--espacement-16) var(--espacement-16);
        border: 1px solid var(--couleur-controle);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      section .ecran-simule > * + * {
        margin-top: 0;
      }
      section .titre-simule {
        margin-inline: calc(-1 * var(--espacement-16));
        margin-top: calc(-1 * var(--espacement-12));
        padding: var(--espacement-8) var(--espacement-16);
        border-bottom: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ) var(--rayon-champ) 0 0;
        background: var(--couleur-surface-douce);
        font-weight: 600;
      }
      .panneaux-simules {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
        gap: var(--espacement-12);
      }
      .panneau-simule {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-4);
        min-width: 0;
      }
      section .sous-titre-simule {
        font-weight: 600;
      }
      .ecran-simule dl {
        display: flex;
        flex-direction: column;
        margin: 0;
      }
      .ecran-simule dl > div {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 0 var(--espacement-12);
        padding: 2px 0;
        border-bottom: 1px solid var(--couleur-ligne);
      }
      .ecran-simule dt {
        color: var(--couleur-texte-secondaire);
      }
      .ecran-simule dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
        font-weight: 500;
      }
      .jauges {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-8);
        padding: 0;
        list-style: none;
      }
      section .jauges > li + li {
        margin-top: 0;
      }
      .jauges > li {
        display: grid;
        grid-template-columns: 7.5rem minmax(0, 1fr) 3rem;
        align-items: center;
        gap: var(--espacement-8);
        font-variant-numeric: tabular-nums;
      }

      /* Un compte posé en colonne. */
      pre.calcul {
        max-width: 100%;
        overflow-x: auto;
        padding: var(--espacement-12) var(--espacement-16);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface-douce);
        font-family: var(--police-code);
        font-size: 0.875rem;
        line-height: 1.375rem;
        font-variant-ligatures: none;
        font-variant-numeric: tabular-nums;
      }


      /* Un listing : le code C, le langage d'assemblage, les lignes JavaScript. */
      pre.listing {
        max-width: 100%;
        overflow-x: auto;
        margin: 0;
        padding: var(--espacement-12) var(--espacement-16);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface-douce);
        font-family: var(--police-code);
        font-size: 0.875rem;
        line-height: 1.375rem;
        font-variant-ligatures: none;
        font-variant-numeric: tabular-nums;
        tab-size: 4;
      }
      pre.listing mark {
        padding: 0 2px;
        border-radius: 2px;
        background: var(--couleur-accent-douce);
        color: inherit;
      }
      .deux-listings {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
        gap: var(--espacement-12);
      }
      .deux-listings > figure {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-8);
        min-width: 0;
        margin: 0;
      }
      section .deux-listings figcaption {
        color: var(--couleur-texte-secondaire);
        font-size: 0.8125rem;
        font-weight: 600;
      }
      /* La console du navigateur, recopiée : une ligne tapée (›), une ligne affichée (‹), une erreur en rouge. */
      .console-simulee {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        margin: 0;
        padding: var(--espacement-12) var(--espacement-16);
        border: 1px solid var(--couleur-controle);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface);
        font-family: var(--police-code);
        font-size: 0.875rem;
        line-height: 1.375rem;
        font-variant-ligatures: none;
        overflow-x: auto;
      }
      .console-simulee > li {
        list-style: none;
        white-space: pre-wrap;
      }
      section .console-simulee > li + li {
        margin-top: 0;
      }
      .console-simulee .tape::before {
        content: '› ';
        color: var(--couleur-accent);
      }
      .console-simulee .affiche::before {
        content: '‹ ';
        color: var(--couleur-texte-discret);
      }
      .console-simulee .erreur {
        color: var(--couleur-erreur);
      }
      .console-simulee .erreur::before {
        content: '⊗ ';
      }
      /* La page de téléchargement de PHP : une version par couple architecture et système. */
      .versions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-8);
        padding: 0;
        list-style: none;
      }
      section .versions > li + li {
        margin-top: 0;
      }
      .versions > li {
        padding: var(--espacement-8) var(--espacement-12);
        border: 1px solid var(--couleur-controle);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface);
        font-size: 0.875rem;
        font-weight: 500;
      }
      /* Classer : une ligne par élément, deux boutons de colonne. */
      .a-classer {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-8);
        padding: 0;
        list-style: none;
      }
      section .a-classer > li + li {
        margin-top: 0;
      }
      .a-classer > li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--espacement-8);
        padding: var(--espacement-8) var(--espacement-12);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
      }
      .a-classer .contenu {
        font-weight: 600;
      }
      .a-classer .colonnes {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-8);
      }
      .a-classer button.colonne {
        min-height: var(--cible-tactile-min);
        padding: var(--espacement-4) var(--espacement-12);
        border: 1px solid var(--couleur-controle);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
        color: var(--couleur-encre);
        font-size: 0.875rem;
        cursor: pointer;
      }
      .a-classer button.colonne[aria-pressed='true'] {
        border-color: var(--couleur-accent);
        background: var(--couleur-accent-douce);
      }
      .a-classer button.colonne.choisi-bon {
        border-color: var(--couleur-succes);
        background: var(--couleur-succes-douce);
      }
      .a-classer button.colonne.choisi-faux {
        border-color: var(--couleur-erreur);
        background: var(--couleur-erreur-douce);
      }
      .a-classer button.colonne.montre {
        border-style: dashed;
        border-color: var(--couleur-succes);
      }
      .a-classer button.colonne:disabled {
        color: var(--couleur-encre);
        cursor: default;
      }
      .a-classer button.colonne:focus-visible {
        outline: none;
        box-shadow: var(--focus-anneau);
      }
      /* La chaîne à ranger : une pièce par ligne, ses flèches à droite. */
      .lignes-ordre {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-8);
        margin: 0;
        padding: 0;
        list-style: none;
        counter-reset: piece;
      }
      section .lignes-ordre > li + li {
        margin-top: 0;
      }
      .lignes-ordre > li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--espacement-8);
        padding: var(--espacement-8) var(--espacement-12);
        border: 1px solid var(--couleur-accent);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
        counter-increment: piece;
      }
      .lignes-ordre > li::before {
        content: counter(piece) '.';
        flex: none;
        color: var(--couleur-texte-secondaire);
        font-variant-numeric: tabular-nums;
      }
      .lignes-ordre .contenu {
        flex: 1;
        min-width: 0;
      }
      .lignes-ordre > li.placee {
        border-style: dashed;
        background: var(--couleur-surface-douce);
      }
      .lignes-ordre .fleches {
        display: flex;
        flex: none;
        gap: var(--espacement-4);
      }
      .lignes-ordre .fleches button {
        min-width: var(--cible-tactile-min);
      }
      /* Deux chaînes côte à côte, empilées sur un téléphone. */
      .deux-chaines {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
        gap: var(--espacement-16);
      }
      .deux-chaines > div {
        min-width: 0;
      }
      section .deux-chaines h4 {
        margin: 0 0 var(--espacement-8);
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--couleur-texte-secondaire);
      }
    </style>
  </head>
  <body>
    <header class="barre">
      <h1 id="titre"></h1>
      <p>
        <span id="mode" class="mode" role="status">Connexion à l’appli…</span>
        <span id="statut" class="discret"></span>
      </p>
    </header>
    <nav class="fil" id="fil" aria-label="Étapes de la fiche" data-ouvert="false">
      <button
        type="button"
        class="bascule"
        id="bascule"
        aria-expanded="false"
        aria-controls="etapes"
      ></button>
      <ol id="etapes" class="etapes"></ol>
    </nav>
    <main>
      <p id="avis" class="avis" role="alert" hidden></p>
      <div id="contenu"></div>
    </main>

    <!-- ET1, perception : le dossier du formateur, les deux fichiers qui tournent chez Yasmine, l'un des deux qui refuse chez Farid, puis un pari. -->
    <template data-etape="ET1">
      <p class="accroche">
        Yasmine, 34 ans, apprend le développement web sur son PC Windows. Son formateur lui envoie
        un dossier avec deux fichiers, compte.exe et compte.php, qui font la même chose : afficher «
        Total : 5 ». Regarde comment il les a fabriqués, puis ce qui se passe chez Yasmine et chez
        Farid.
      </p>
      <div class="cadre pour-lire">
        <p class="discret">Les deux machines, pour lire :</p>
        <ul>
          <li>Yasmine : un PC sous Windows, processeur x64.</li>
          <li>Farid : un Mac à puce Apple M2.</li>
        </ul>
      </div>
      <div
        class="schema-bloc"
        data-lecture="Chez le formateur : il tape un texte en C, lance un programme appelé compilateur, qui fabrique compte.exe. Il tape un autre texte, compte.php, et ne fabrique rien de plus. Chez Yasmine, sur son PC Windows x64 : compte.exe affiche Total : 5 ; compte.php affiche Total : 5 une fois le programme PHP installé. Chez Farid, sur son Mac M2 : compte.exe refuse de s’ouvrir ; compte.php affiche Total : 5 une fois le programme PHP installé."
      >
        <span class="boite-fixe"
          >Chez le formateur<small
            >il tape un texte en C, lance un programme appelé compilateur, qui fabrique compte.exe ;
            il tape un autre texte, compte.php, et ne fabrique rien de plus</small
          ></span
        ><span class="fleche">il envoie les deux fichiers à</span
        ><span class="boite-fixe"
          >Yasmine, PC Windows x64<small
            >compte.exe affiche « Total : 5 » ; compte.php affiche « Total : 5 » une fois le
            programme PHP installé</small
          ></span
        ><span class="fleche">Yasmine les transmet à</span
        ><span class="boite-fixe"
          >Farid, Mac M2<small
            >compte.exe refuse de s’ouvrir ; compte.php affiche « Total : 5 » une fois le programme
            PHP installé</small
          ></span
        >
      </div>
      <div
        data-widget="pari"
        class="ex"
        data-apres="Garde ta réponse en tête : la fiche y revient à la fin, et tu verras si ton pari tenait."
      >
        <p class="q">
          Même dossier, même formateur. À ton avis, pourquoi compte.exe refuse-t-il de s’ouvrir sur
          le Mac de Farid, alors que compte.php y tourne ?
        </p>
        <ul class="options">
          <li data-option="abime">Le fichier compte.exe s’est abîmé pendant l’envoi.</li>
          <li data-option="machine">
            compte.exe a été fabriqué pour une autre machine que celle de Farid.
          </li>
          <li data-option="php">Il manque PHP sur le Mac de Farid pour ouvrir compte.exe.</li>
        </ul>
      </div>
      <p>
        Deux fichiers qui disent la même chose, et qui ne voyagent pas de la même façon : c’est tout
        ce bloc.
      </p>
    </template>

    <!-- ET2, carte : où est le bloc dans la partie La machine, à quoi il sert, ce que l'apprenant saura faire. -->
    <template data-etape="ET2">
      <p class="accroche">
        Un programme, c’est un texte écrit par une personne, et des instructions que le processeur
        exécute. Entre les deux, une traduction : c’est elle qui décide si un fichier tourne sur une
        machine ou pas. Le dossier du formateur, que tu viens de voir, en est un exemple.
      </p>
      <h3>Où tu es</h3>
      <p>
        Ce bloc est le quatrième et dernier de la partie La machine, qui tient en quatre idées
        reliées :
      </p>
      <ul class="carte-partie">
        <li>
          <strong>L’information en bits</strong> : tout ce que la machine range et traite est une
          suite de 0 et de 1.
        </li>
        <li>
          <strong>Décider : ET, OU, NON, SI/SINON</strong> : la machine décide avec de la logique
          sur ces 0 et ces 1.
        </li>
        <li>
          <strong>L’ordinateur et ses composants</strong> : des composants rangent, transportent et
          calculent ces 0 et ces 1.
        </li>
        <li class="ici">
          <strong>Du langage machine aux langages de haut niveau</strong> : un programme, écrit dans
          un langage, devient des instructions que le processeur exécute. Tu es ici.
        </li>
      </ul>
      <p>
        Ce bloc relie deux choses que tu as vues : le processeur du bloc L’ordinateur et ses
        composants, qui exécute des instructions, et les décisions du bloc Décider, que tu as
        écrites en JavaScript dans la console du navigateur. Il repose aussi sur L’information en
        bits : le programme de quelques octets que tu y as lu était déjà du code machine. Plus loin,
        tu installeras PHP et un serveur, tu liras des messages d’erreur dans la console : ce bloc
        te dit d’où ils viennent.
      </p>
      <h3>À quoi ça sert</h3>
      <p>
        Comme développeur web, tu écriras du PHP et du JavaScript : des textes qu’une machine doit
        traduire avant de les exécuter. Savoir quand et comment elle les traduit, c’est savoir
        pourquoi un site a besoin de PHP installé sur son serveur, pourquoi un fichier reçu d’un
        collègue ne s’ouvre pas sur ton Mac, et ce qu’un message d’erreur te dit vraiment : une
        faute de frappe, ou un programme qui a planté en route.
      </p>
      <h3>À la fin, tu sauras</h3>
      <ul>
        <li>
          dessiner sans support les deux chemins d’un programme, de son texte jusqu’au processeur :
          la traduction faite avant, et la traduction faite pendant ;
        </li>
        <li>
          lire une fonction C de trois lignes et reconnaître, dans ce que le compilateur en fait,
          les instructions du processeur ;
        </li>
        <li>
          classer C, PHP, JavaScript, Python et Java d’après ce que le développeur fait avant de
          lancer ;
        </li>
        <li>
          dire pourquoi un fichier compilé sur une machine ne tourne pas tel quel sur une autre,
          alors qu’un texte tourne partout où le programme qui le lit est installé ;
        </li>
        <li>
          reconnaître une erreur trouvée avant que le programme démarre et une erreur survenue en
          route, et dire ce qui les sépare.
        </li>
      </ul>
      <p class="discret">
        Il te faudra ton ordinateur et un navigateur, rien d’autre : le code à lire est dans la
        fiche, tu n’en écriras pas.
      </p>
    </template>

    <!-- ET3, tentative : quatre questions à l'intuition, avant toute explication. -->
    <template data-etape="ET3">
      <div data-ecran="Le texte du formateur">
        <p class="accroche">
          Essaie avec ton bon sens. Personne ne te note : réponds comme tu penses, ou « Je ne sais
          pas ». À la fin de l’étape, la page te montre tes réponses et ce qui était attendu ; les
          étapes suivantes expliquent pourquoi.
        </p>
        <div
          class="ex"
          data-essai
          data-widget="choix"
          data-id="p1"
          data-reponse="traduit"
          data-melanger="non"
          data-explication="Le processeur n’exécute que des instructions machine, des octets. Le texte en C est traduit en instructions machine par le compilateur, avant d’être exécuté."
        >
          <p class="q">
            Le formateur a tapé un texte en C, puis fabriqué compte.exe. Quand Yasmine lance
            compte.exe, que lit son processeur ?
          </p>
          <ul class="options">
            <li
              data-option="texte"
              data-retour="Le processeur ne lit que des octets qui sont des ordres pour lui, pas un texte écrit pour un humain."
            >
              Le texte en C, tel que le formateur l’a tapé.
            </li>
            <li data-option="traduit">
              Des instructions machine, fabriquées à partir de ce texte.
            </li>
            <li
              data-option="php"
              data-retour="compte.exe ne passe pas par PHP : il a été fabriqué avant, d’un coup, par un autre programme."
            >
              Le texte en C, lu et exécuté par PHP.
            </li>
          </ul>
        </div>
      </div>
      <div data-ecran="Le fichier de Farid">
        <div
          class="ex"
          data-essai
          data-widget="choix"
          data-id="p2"
          data-reponse="pas"
          data-melanger="non"
          data-explication="compte.exe est fait d’instructions machine pour un processeur x64 sous Windows. Le Mac de Farid a un processeur ARM64 et un autre système : il ne peut pas les exécuter telles quelles."
        >
          <p class="q">
            compte.exe tourne sur le PC Windows x64 de Yasmine. Que fait-il sur le Mac M2 de Farid ?
          </p>
          <ul class="options">
            <li
              data-option="pareil"
              data-retour="Un fichier compilé est fait d’instructions pour un processeur et un système donnés ; ceux de Farid sont différents."
            >
              Il tourne pareil : un programme est un programme.
            </li>
            <li data-option="pas">Il ne se lance pas tel quel.</li>
            <li
              data-option="lent"
              data-retour="Ce n’est pas une question de vitesse : les octets de compte.exe ne sont pas des instructions pour le processeur du Mac."
            >
              Il tourne, mais plus lentement.
            </li>
          </ul>
        </div>
      </div>
      <div data-ecran="Un langage interprété">
        <div
          class="ex"
          data-essai
          data-widget="choix"
          data-id="p3"
          data-reponse="outil"
          data-melanger="non"
          data-explication="« Interprété » décrit l’outil avec lequel on exécute le programme d’habitude, pas le langage : un même langage peut être interprété par un outil et compilé par un autre."
        >
          <p class="q">
            On lit souvent « PHP est un langage interprété ». Qu’est-ce que cette phrase décrit ?
          </p>
          <ul class="options">
            <li
              data-option="langage"
              data-retour="Un langage est une façon d’écrire ; c’est l’outil qu’on emploie qui compile ou qui interprète."
            >
              Une propriété du langage PHP, vraie pour toujours.
            </li>
            <li data-option="outil">L’outil avec lequel on exécute PHP d’habitude.</li>
            <li
              data-option="vitesse"
              data-retour="« Interprété » ne mesure pas une vitesse : il dit comment le texte est traduit."
            >
              La vitesse à laquelle PHP s’exécute.
            </li>
          </ul>
        </div>
      </div>
      <div data-ecran="Une parenthèse oubliée">
        <div
          class="ex"
          data-essai
          data-widget="choix"
          data-id="p4"
          data-reponse="rien"
          data-melanger="non"
          data-explication="Une parenthèse oubliée est une erreur de syntaxe : elle est trouvée à la lecture du texte, avant que la première ligne s’exécute. Rien ne s’exécute."
        >
          <p class="q">
            Le formateur réécrit compte.php en trois lignes et oublie une parenthèse à la troisième.
            Yasmine lance le fichier. Que se passe-t-il ?
          </p>
          <ul class="options">
            <li
              data-option="deux"
              data-retour="Avant d’exécuter la première ligne, le programme PHP lit tout le texte : la parenthèse manquante est trouvée à ce moment-là."
            >
              Les deux premières lignes s’exécutent, puis une erreur s’affiche.
            </li>
            <li data-option="rien">Rien ne s’exécute : une erreur s’affiche tout de suite.</li>
            <li
              data-option="saute"
              data-retour="Un programme ne saute pas une ligne qu’il ne comprend pas : il refuse tout le texte."
            >

          toi-même dans <a data-lien="https://godbolt.org/">Compiler Explorer</a>, en suivant ces
          gestes.
        </p>
        <ol>
          <li>Ouvre godbolt.org.</li>
          <li>
            Dans la liste des langages, au-dessus du volet de gauche, choisis C (pas C++, proposé
            par défaut), puis remplace le texte du volet par la fonction ci-dessous.
          </li>
          <li>

            laisse vide la case des options : le listing x64 paraît.
          </li>
          <li>

            « ARM64 gcc » n’est pas dans la liste, tape « ARM64 » et prends le gcc le plus récent.

        <pre
          class="listing"
          data-lecture="La fonction à coller : int add, parenthèse, int a, virgule, int b, parenthèse, accolade ; return a plus b ; accolade fermante."
        >
int add(int a, int b) {
  return a + b;
}</pre>
        <p>
          À lire dans le listing x64 : les lignes add eax, edx et ret. Puis, pour ARM64 : les
          registres w0, w1 et les instructions str, ldr, qui n’étaient pas dans le listing x64.
        </p>
        <details data-cran="1">
          <summary>Un indice</summary>
          <p>
            Les lignes qui comptent commencent par un mnémonique, comme mov ou add. Celles qui
            commencent par un point, ou qui ne sont qu’un nom suivi de deux-points, ne sont pas des
            instructions.

            <summary>Une piste détaillée</summary>

                <summary>La solution entière</summary>
                <p>
                  godbolt.org ; volet gauche, liste des langages, C ; colle les trois lignes. Volet
                  droit, liste des compilateurs, « x86-64 gcc » (le numéro de version le plus
                  élevé), options vides : neuf lignes, dont add eax, edx et ret vers la fin. Puis
                  liste des compilateurs, « ARM64 gcc » : huit lignes, avec str w0, str w1, ldr w1,
                  ldr w0, add w0, w1, w0 et ret. Si des lignes commençant par un point ou des
                  couleurs te gênent, ignore-les : seules les lignes à mnémonique comptent.
                </p>
              </details>
            </details>
          </details>
        </details>
        <p>

          changent pas.

          <summary>Un indice</summary>
          <p>
            Si « Bonjour » s’affiche aussi avec le premier bloc, les deux lignes sont parties l’une
            après l’autre. Comment les envoyer ensemble ?

            <summary>Une piste détaillée</summary>

          </details>

        <p class="accroche">
          Dernier geste, sans la fiche. Inès écrit facture.c, qu’elle compile avec gcc pour son PC
          Linux x64, et facture.js, qu’elle lance dans la console de son navigateur. Prends une

      <div data-ecran="À retenir">
        <div class="cadre a-retenir">
          <p>
            <strong>Le processeur n’exécute que son code machine</strong>, des instructions propres
            à son architecture. Tout texte écrit par un humain est traduit, avant ou pendant. Le
            langage d’assemblage nomme ces instructions ; l’assembleur est le programme qui le
            traduit en octets.
          </p>
          <p>
            Compiler : traduire avant, une fois ; ce qui voyage est l’exécutable, fait pour un
            couple architecture et système, et il ne tourne pas ailleurs. Interpréter : traduire
            pendant, à chaque lancement ; ce qui voyage est le texte, et il faut le moteur sur
            place. Compilé ou interprété qualifie l’outil, pas le langage ; le bytecode exécuté par
            une machine virtuelle est la troisième voie, et le JIT accélère un moteur de
            l’intérieur.
          </p>
          <p>
            Pour classer C, PHP, JavaScript, Python et Java : le développeur produit-il un fichier à
            part avant de lancer ? Une erreur de syntaxe est trouvée à la lecture du source, avant
            la première instruction ; une erreur d’exécution survient pendant, et ce qui précède a
            eu son effet.
          </p>
        </div>

      <div data-ecran="Les mots du bloc">
        <dl class="cartes">
          <div>
            <dt>Code machine, instruction machine</dt>
            <dd>
              Les octets que le processeur exécute ; chaque ordre est une instruction. Propres à une
              architecture : x64 (dite aussi x86-64) ou ARM64.
            </dd>
          </div>
          <div>
            <dt>Langage d’assemblage</dt>
            <dd>
              Un texte où chaque ligne nomme une instruction machine par un mnémonique (mov, add,
              ret) et ses registres, les petites cases nommées du processeur.
            </dd>
          </div>
          <div>
            <dt>Assembleur</dt>
            <dd>Le programme qui traduit le langage d’assemblage en code machine.</dd>
          </div>
          <div>
            <dt>Code source, langage de haut niveau</dt>
            <dd>
              Le texte que le développeur écrit, dans un langage fait pour l’humain, qui décrit le
              calcul sans parler du processeur ; une ligne vaut plusieurs instructions.
            </dd>
          </div>
          <div>
            <dt>Compilateur, exécutable</dt>
            <dd>
              Le programme qui traduit tout le source avant, une fois ; ce qu’il produit, un fichier
              de code machine fait pour une architecture et un système.
            </dd>
          </div>
          <div>
            <dt>Interpréteur, moteur</dt>
            <dd>
              Le programme installé qui lit le source et l’exécute pendant, à chaque lancement.
            </dd>
          </div>
          <div>
            <dt>Bytecode, machine virtuelle</dt>
            <dd>
              Un fichier intermédiaire produit avant, ni source ni code machine ; le programme qui
              l’exécute, installé sur la machine.
            </dd>
          </div>
          <div>
            <dt>JIT</dt>
            <dd>
              Dans un moteur : traduit pendant l’exécution les parties qui reviennent souvent en
              instructions machine gardées en mémoire, sans fichier.
            </dd>
          </div>
          <div>
            <dt>Système d’exploitation</dt>
            <dd>
              Windows, macOS ou Linux : le programme qui démarre la machine, lance les autres et
              leur donne accès à l’écran, au disque, au réseau.
            </dd>
          </div>
          <div>
            <dt>Erreur de syntaxe, erreur d’exécution</dt>
            <dd>
              La première : le texte ne suit pas la grammaire, trouvée à la lecture, rien ne
              s’exécute. La seconde : une instruction échoue pendant que le programme tourne.
            </dd>
          </div>
        </dl>

    <template data-conception>
      <h3>Une question à la fois</h3>
      <ul>
        <li>
          Dans un écran, tout ce qui suit un exercice pas encore fini reste caché jusqu’à ce qu’il
          le soit : réussi, ou solution vue puis refaite ou expliquée (voir « Les coups de pouce »).
          Le texte placé après un exercice paraît donc une fois l’exercice fini ; c’est là que vont
          les reprises d’un essai du prétest (data-si-essai) et, dans « Deux sortes d’erreurs », la
          console recopiée qui donne la réponse de la prédiction.
        </li>
        <li>
          Le gabarit mélange les options de chaque choix à l’affichage, à chaque visite : l’ordre
          écrit dans la page n’est pas celui que voit l’apprenant, et la bonne option n’a pas de
          place fixe. Seuls les essais du prétest p1 à p4 (data-melanger="non") gardent leur ordre.
          Les pièces d’une chaîne à ranger sont mélangées au montage, la pièce fixe en tête.
        </li>
        <li>
          Un exercice du cours fini garde son état d’une visite à l’autre : la réponse, le message
          et le texte qui suit restent affichés.
        </li>
      </ul>
      <h3>Le dossier du formateur et le pari (étape 1)</h3>
      <ul>
        <li>
          À l’étape 1, le schéma ne dit que ce qui se voit chez le formateur, chez Yasmine et chez
          Farid, sans nommer la traduction. Le pari n’est pas noté : la réponse est gardée (trace
          pari) et la question reste visible aux visites suivantes. À l’étape « Le dossier du
          formateur, enfin », « Ton pari, repris » redonne le dossier et la même question, la
          première réponse rappelée au-dessus (« Au début, tu avais répondu : … ») ; la nouvelle
          réponse est gardée (trace pari-fin), sans correction. Puis « Le schéma, pour Nour » ; une
          fois le schéma jugé, les deux réponses sont rappelées et la correction écrite du pari
          paraît. Rien ne part au bilan du pari.
        </li>
      </ul>
      <h3>Les listings et la console recopiés</h3>
      <ul>
        <li>
          Les listings de Compiler Explorer sont recopiés en texte, tels que gcc 13 les produit sans
          option pour x86-64 et pour ARM64 (vérifiés en compilant la fonction avec gcc) ; les deux
          lignes à repérer sont surlignées dans le premier. La console du navigateur est recopiée
          ligne à ligne : ce qui est tapé, ce qui s’affiche, l’erreur en rouge avec le message exact
          de Chrome. Chacun porte une lecture pour qui ne voit pas l’écran.
        </li>
      </ul>
      <h3>Les encadrés « pour lire »</h3>
      <ul>
        <li>
          Les conventions dont un écran se sert (les deux machines, les mnémoniques et registres du
          listing, ce que fait console.log, les outils habituels des cinq langages, la page de
          téléchargement) sont dans un encadré titré « …, pour lire : », placé au-dessus de
          l’exercice. La consigne ne garde que la situation et la question. Les écrans des étapes 5
          à 10 s’ouvrent sur une ligne « Tu es ici : … » ; le schéma des deux chaînes reparaît en
          règle à la fin de « Interpréter », puis se range dans l’ordre (r13).
        </li>
      </ul>
      <h3>Classer et ranger une chaîne (outils du bloc)</h3>
      <ul>
        <li>
          Classer (r16, PR1-5) : une ligne par élément, deux boutons de colonne ; « Vérifier »
          refuse tant qu’une ligne n’est pas classée (« Classe chaque ligne : il reste … »). Une
          ligne mal classée donne son retour écrit dans la fiche, une question sur cet élément, et «
          D’autres lignes sont à revoir. » s’il y en a plusieurs ; les boutons faux passent en
          rouge, et la réponse compte pour une réponse fausse. À la solution vue, la bonne colonne
          de chaque ligne est marquée en pointillé, et la solution s’écrit « C, Java : un fichier
          produit à part ; PHP, JavaScript, Python : le texte donné au moteur ».
        </li>
        <li>
          Ranger une chaîne (r13, PR1-4) : les pièces se montent et se descendent avec les flèches,
          la première pièce est fixe. Un ordre faux donne, pour la première place fausse, « Après «
          … », tu as mis « … ». Qu’est-ce qui en sort directement ? » (ou « Par quoi tout
          commence-t-il…» si la première pièce libre est fausse), sans nommer la bonne pièce. La
          solution s’écrit « Le texte en C, puis Le compilateur, puis … ».
        </li>
      </ul>
      <h3>Sur ta machine (atelier, AT1)</h3>
      <ul>
        <li>
          L’atelier se fait hors de la page : Compiler Explorer dans le navigateur (godbolt.org, le
          lien est ouvert par l’appli), la console du navigateur, une feuille de papier. Chaque
          écran ne donne que la consigne et ce qu’il faut constater ; le geste est replié dans les
          crans. À la fin de l’étape, le gabarit affiche le constat : les quatre critères du
          manifeste (atelier.criteres) à cocher, et le niveau d’aide reçu. L’aide se monte cran par
          cran, chaque cran replié dans le précédent, titrés « Un indice » (data-cran 1), « Une
          piste détaillée » (2), « Une partie de la solution » (3), « La solution entière » (4) ; un
          cran ouvert fixe l’aide au moins à son niveau. L’atelier n’est réussi qu’avec les quatre
          critères cochés, sans aide (reussite_aide_max 0). Rien à installer : le site, le
          navigateur et une feuille.
        </li>
      </ul>
      <h3>Les retours</h3>
      <ul>
        <li>
          Le retour d’une option fausse nomme l’élément du modèle en cause et pose une question,
          sans désigner la bonne option : « Le processeur ne lit que des octets. Ce texte, qui le
          lit ? »
        </li>
      </ul>
      <h3>Les erreurs critiques et le prétest</h3>
      <ul>
        <li>
          E1 (interprété, propriété figée du langage) est marquée par une option en ET9 (r14) et en
          pratique (PR1-2 et sa variante) ; E2 (binaire portable) en ET5 (r2), ET6 (r7), ET7 (r10)
          et en pratique (PR1-1 et sa variante) ; E3 (assembleur et langage d’assemblage) en ET5
          (r4) et en pratique (PR1-3 et sa variante) ; E4 (erreur de syntaxe détectée à l’exécution)
          en ET10 (r19) et en pratique (PR1-6 et sa variante) ; le schéma de l’étape d’ensemble,
          jugé par l’IA, relève une traduction avant inventée pour un texte interprété. Le prétest
          (étape 3) touche les quatre avant toute explication : le texte du formateur (ce que lit le
          processeur), le fichier de Farid (E2), un langage interprété (E1), une parenthèse oubliée
          (E4) ; chaque essai est repris au moment où le cours y répond (data-si-essai).
        </li>
      </ul>
      <h3>Les coups de pouce</h3>
      <ul>
        <li>
          L’échelle est celle du gabarit. Un choix : chaque option fausse est retirée, avec son
          retour ; tant que plusieurs options restent, « Un coup de pouce » donne l’indice écrit
          dans la fiche (data-aide1), puis un second indice, une question qui oriente (data-aide2),
          puis l’étape détaillée (data-aide3), puis la solution. Classer et ranger : rien avant une
          réponse fausse, puis data-aide1, data-aide2, data-aide3, puis la solution. Après une
          solution vue dans le cours, l’apprenant explique la solution avec ses mots, et l’IA juge
          son explication. Une prédiction (data-prediction : r17, r18, chacune avec sa question qui
          oriente) montre la bonne réponse sans explication à écrire, car la console qui suit
          l’explique.
        </li>
        <li>
          Dans la pratique, après une solution vue, l’item se refait sur sa variante, puis
          l’apprenant explique. Deux items sur huit portent une demande d’explication
          (data-justifier : PR1-6, PR1-7), sur ce que l’écran ne montre pas ; le manifeste la
          déclare, l’IA la juge, et l’item n’est réussi qu’avec une explication Solide.
        </li>
        <li>
          Chaque réponse vérifiée d’un item part au gabarit avec l’aide reçue : 0 du premier coup, 1
          au moins après une réponse fausse, le numéro du dernier cran ouvert, et 4 pour une
          solution vue.
        </li>
      </ul>

        "contexte_ia": "Bloc B04 du module « Écosystème et outils du développeur » (DWWM), quatrième et dernier bloc de la partie La machine. Le modèle du bloc : le processeur n’exécute que du code machine, des octets qui sont des instructions propres à son architecture, x64 (dite aussi x86-64 ou AMD64 : Intel, AMD) ou ARM64 (puces Apple M1, M2, M3, certains PC) ; les registres et une partie des instructions diffèrent d’une architecture à l’autre. Le langage d’assemblage est un texte où chaque ligne nomme une instruction machine par un mnémonique (mov, add, ret) et ses registres, les petites cases nommées du processeur (eax, edi, rbp pour x64 ; w0, w1, sp pour ARM64) ; l’assembleur est le programme qui traduit ce texte en octets : deux choses distinctes. Un langage de haut niveau (C, PHP, JavaScript, Python, Java) décrit le calcul pour l’humain sans désigner le processeur ; une ligne donne plusieurs instructions machine ; tout source est traduit, avant ou pendant. Chaîne compilée : source C, compilateur, langage d’assemblage, assembleur, exécutable ; gcc enchaîne ces étapes et Compiler Explorer (godbolt.org) affiche le langage d’assemblage que gcc produit ; pour la fonction add fournie (int add(int a, int b) { return a + b; }), sans option, x64 donne neuf lignes dont add eax, edx et ret, ARM64 huit lignes dont str w0, str w1, ldr w1, ldr w0, add w0, w1, w0 et ret ; les octets 01 d0 valent add eax, edx et c3 vaut ret. L’exécutable se lance ensuite sans le compilateur et il est fabriqué pour un couple architecture + système d’exploitation ; le système d’exploitation (Windows, macOS, Linux) est le programme qui démarre la machine, lance les autres et leur donne accès au disque, à l’écran, au réseau. Un exécutable Windows x64 ne tourne pas tel quel sur un Mac M2 pour deux raisons, dont une seule suffirait : ARM64 au lieu de x64, macOS au lieu de Windows ; il faut recompiler le source pour la machine d’arrivée. Chaîne interprétée : le source est donné tel quel au moteur, l’interpréteur, installé dans la version faite pour la machine, qui le lit et l’exécute à chaque lancement ; ce qui voyage est le texte ; aucun texte d’assemblage n’est produit : soit le moteur exécute lui-même le programme, soit, s’il a un JIT, il fabrique des instructions machine directement en mémoire, sans fichier ; le processeur exécute le moteur, jamais le texte. PHP est aussi le nom du programme interpréteur ; le moteur JavaScript est dans chaque navigateur. Nuance : compilé ou interprété qualifie l’outil, pas le langage ; un même langage peut avoir un compilateur et un interpréteur. Troisième voie : le bytecode, un fichier intermédiaire ni source ni code machine, produit avant (javac pour Java) et exécuté par une machine virtuelle installée sur la machine. Critère de classement du bloc : le développeur produit-il un fichier à part avant de lancer ? Oui pour C (exécutable natif) et Java (bytecode) ; non pour PHP, JavaScript et Python (source donné au moteur ; le programme Python fabrique un bytecode interne, mais le développeur ne produit rien). Erreurs : une erreur de syntaxe est trouvée à la lecture du source, avant la première instruction, et rien ne s’exécute (dans la console du navigateur : un seul message rouge SyntaxError, rien d’affiché avant) ; une erreur d’exécution survient pendant que le programme tourne, parfois pour certaines données seulement, et ce qui précède a eu son effet (« Bonjour » affiché, puis ReferenceError ou TypeError). Les blocs de la fiche sont collés en une seule fois dans la console, deux lignes ensemble. Pièges à repérer : E1, croire qu’un langage est compilé ou interprété par nature, ou classer sans le critère du bloc ; E2, croire qu’un exécutable passe d’une machine à l’autre comme un texte, ou n’en voir qu’une raison quand les deux manquent ; E3, confondre l’assembleur (programme) et le langage d’assemblage (texte), dire « écrit en assembleur » ; E4, croire qu’une erreur de syntaxe se découvre pendant l’exécution, ou qu’une
