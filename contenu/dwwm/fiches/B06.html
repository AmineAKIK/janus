        --couleur-accent-sur-fond: light-dark(#ffffff, #0f1a28);
        --couleur-accent-douce: light-dark(#e8eff8, #1f2b3a);
        --couleur-succes: light-dark(#276f50, #5dc196);
        --couleur-alerte: light-dark(#95620a, #e0ac4a);
        --couleur-erreur: light-dark(#ae3846, #ee8591);
        --couleur-focus: light-dark(#2b6cb0, #8bb9f5);
        --effet-ombre-carte: light-dark(#1b1f24, #000000);
        --espacement-4: 0.25rem;
        --espacement-8: 0.5rem;
        --espacement-12: 0.75rem;
        --espacement-16: 1rem;
        --espacement-20: 1.25rem;
        --espacement-24: 1.5rem;
        --espacement-32: 2rem;
        --espacement-48: 3rem;
        --rayon-champ: 0.625rem;
        --rayon-carte: 0.875rem;
        --rayon-option: 0.375rem;
        --duree-transition: 160ms;
        --focus-anneau: 0 0 0 2px var(--couleur-fond), 0 0 0 4px var(--couleur-focus);
        --ombre-option: 0 2px 6px color-mix(in srgb, var(--effet-ombre-carte) 8%, transparent);
        --hauteur-champ: 48px;
        --hauteur-bouton: 48px;
        --cible-tactile-min: 44px;
        --largeur-lecture: 62ch;
        --police-texte: 'Inter', system-ui, sans-serif;
        --police-code: 'JetBrains Mono', ui-monospace, monospace;
      }
      /* Le thème choisi dans l'appli (message etat.init) l'emporte sur le réglage du téléphone. */
      :root[data-theme='clair'] {
        color-scheme: light;
      }
      :root[data-theme='sombre'] {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: var(--couleur-fond);
        color: var(--couleur-encre);
        font-family: var(--police-texte);
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5rem;
      }
      button,
      summary,
      label {
        touch-action: manipulation;
      }

      /* Barre et fil d'étapes : montrés seulement hors de l'appli (aperçu), qui a les siens. */
      .barre {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8) var(--espacement-12);
        min-height: 56px;
        padding: var(--espacement-8) var(--espacement-16);
        background: var(--couleur-surface);
        border-block-end: 1px solid var(--couleur-ligne);
      }
      .barre h1 {
        flex: 1 1 140px;
        min-width: 0;
        margin: 0;
        font-size: 1rem;
        font-weight: 500;
        line-height: 1.5rem;
      }
      .barre p {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8);
        margin: 0;
      }
      .mode {
        padding: 2px var(--espacement-8);
        border-radius: var(--rayon-option);
        background: var(--couleur-surface-douce);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .fil {
        background: var(--couleur-surface);
        border-block-end: 1px solid var(--couleur-ligne);
      }
      .bascule {
        display: none;
      }
      .etapes,
      .moment > ol {
        display: flex;
        flex-wrap: wrap;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .etapes {
        gap: var(--espacement-4) var(--espacement-16);
        justify-content: center;
        padding: 0 var(--espacement-12);
      }
      /* Un moment du cycle : son nom, puis ses étapes ; celui de l'étape courante prend l'accent. */
      .moment {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0 var(--espacement-4);
      }
      .moment > ol {
        gap: 0 var(--espacement-4);
      }
      .moment-nom {
        padding: 0 var(--espacement-8);
        color: var(--couleur-texte-discret);
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .moment[data-courant='oui'] > .moment-nom {
        color: var(--couleur-accent);
      }
      .onglet {
        position: relative;
        min-height: 44px;
        padding: 0 var(--espacement-12);
        border: 0;
        background: transparent;
        color: var(--couleur-texte-secondaire);
        font: inherit;
        font-size: 0.875rem;
        line-height: 1.25rem;
        white-space: nowrap;
        cursor: pointer;
      }
      .onglet:hover {
        color: var(--couleur-encre);
      }
      .onglet:focus-visible {
        outline: none;
        border-radius: var(--rayon-champ);
        box-shadow: var(--focus-anneau);
      }
      .onglet[aria-current='step'] {
        color: var(--couleur-accent);
        font-weight: 500;
      }
      .onglet[aria-current='step']::after {
        position: absolute;
        inset-block-end: 0;
        inset-inline: var(--espacement-12);
        block-size: 2px;
        background: var(--couleur-accent);
        content: '';
      }
      @media (max-width: 40rem) {
        .bascule {
          display: flex;
          align-items: center;
          justify-content: space-between;
          inline-size: 100%;
          min-height: 48px;
          padding: 0 var(--espacement-16);
          border: 0;
          background: transparent;
          color: var(--couleur-accent);
          font: inherit;
          font-size: 0.875rem;
          font-weight: 500;
          line-height: 1.25rem;
          cursor: pointer;
        }
        .fil[data-ouvert='false'] .etapes {
          display: none;
        }
        .etapes {
          flex-direction: column;
          gap: var(--espacement-4);
          justify-content: flex-start;
          padding-block-end: var(--espacement-8);
        }
        .moment,
        .moment > ol {
          flex-direction: column;
          align-items: stretch;
        }
        .moment-nom {
          padding: var(--espacement-8) var(--espacement-12) 0;
        }
        .onglet {
          inline-size: 100%;
          text-align: start;
        }
        .onglet[aria-current='step']::after {
          display: none;
        }
      }
      /* Dans l'appli, la barre et le fil d'étapes sont ceux de la page : la fiche n'en montre pas un second. */
      html[data-integree] .barre,
      html[data-integree] .fil {
        display: none;
      }
      html[data-integree] section > h2 {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /*
       * Dans l'appli, l'iframe prend la hauteur du contenu (message page.taille) : la fiche ne défile
       * pas seule. Elle se pose sur le fond de la page, ses cartes ont la largeur de celle du haut.
       */
      html[data-integree] {
        scrollbar-width: none;
      }
      html[data-integree]::-webkit-scrollbar {
        display: none;
      }
      html[data-integree] body {
        background: transparent;
      }
      html[data-integree] main {
        max-width: none;
        padding: 0;
      }

      /* Page : une colonne, des cartes séparées par le même intervalle que dans l'appli. */
      main {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-16);
        max-width: 760px;
        margin: 0 auto;
        padding: var(--espacement-16) var(--espacement-16) var(--espacement-48);
      }
      /* Une erreur de l'appli : la barre est cachée dans l'appli, l'avis passe au-dessus de l'étape. */
      .avis {
        margin: 0;
        padding: var(--espacement-12) var(--espacement-16);
        border: 1px solid var(--couleur-erreur);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface);
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      #contenu {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-16);
        min-width: 0;
      }
      section {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
        padding: var(--espacement-20);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-carte);
        background: var(--couleur-surface);
      }
      /* Les blocs d'une carte s'espacent par le gap, jamais par des marges qui se cumulent. */
      section :is(h2, h3, h4, p, ul, ol, dl, figure, blockquote, pre, fieldset) {
        margin: 0;
      }
      .ecran,
      .enonce {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
      }
      .ecran[hidden],
      .bouton[hidden],
      [data-si-essai][hidden] {
        display: none;
      }
      h2 {
        font-size: 1.375rem;
        font-weight: 600;
        line-height: 1.75rem;
        text-wrap: balance;
      }
      h3 {
        font-size: 1.125rem;
        font-weight: 600;
        line-height: 1.625rem;
        text-wrap: balance;
      }
      h4 {
        font-size: 1rem;
        font-weight: 600;
      }
      p,
      li {
        overflow-wrap: break-word;
      }
      .ecran p,
      .ecran li {
        max-width: var(--largeur-lecture);
      }
      .ecran .accroche {
        font-size: 1.125rem;
        line-height: 1.75rem;
      }
      ul,
      ol {
        padding-inline-start: var(--espacement-20);
      }
      /* Seulement les listes du contenu : le fil d'étapes et les autres listes d'interface ont leur propre gap. */
      section :is(ul, ol) > li + li {
        margin-top: var(--espacement-8);
      }
      ul.plain {
        padding-inline-start: var(--espacement-20);
      }
      .discret {
        color: var(--couleur-texte-secondaire);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      a {
        color: var(--couleur-encre);
        font-weight: 500;
        text-decoration: none;
        transition: color var(--duree-transition);
      }
      a:hover {
        color: var(--couleur-accent);
      }
      code,
      kbd {
        font-family: var(--police-code);
        font-size: 0.875em;
        font-variant-ligatures: none;
      }
      code {
        padding: 1px var(--espacement-4);
        border-radius: var(--rayon-option);
        background: var(--couleur-surface-douce);
      }
      pre {
        overflow-x: auto;
        padding: var(--espacement-12);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      pre code {
        padding: 0;
        background: none;
      }

      /* Boutons : Bouton.module.css (principal, secondaire). */
      button {
        font: inherit;
      }
      .bouton {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--espacement-8);
        min-height: var(--hauteur-bouton);
        min-width: var(--cible-tactile-min);
        padding: 0 var(--espacement-16);
        border: 1px solid transparent;
        border-radius: var(--rayon-champ);
        background: var(--couleur-accent);
        color: var(--couleur-accent-sur-fond);
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color var(--duree-transition) ease,
          border-color var(--duree-transition) ease,
          transform var(--duree-transition) ease;
      }
      .bouton:hover:not(:disabled) {
        background: color-mix(in srgb, var(--couleur-accent) 88%, var(--couleur-encre));
      }
      .bouton:active:not(:disabled) {
        background: color-mix(in srgb, var(--couleur-accent) 75%, var(--couleur-encre));
        transform: translateY(1px);
      }
      .bouton.secondaire {
        border-color: var(--couleur-controle);
        background: transparent;
        color: var(--couleur-encre);
      }
      .bouton.secondaire:hover:not(:disabled) {
        background: var(--couleur-surface-douce);
      }
      .bouton.secondaire:active:not(:disabled) {
        border-color: var(--couleur-accent);
        background: var(--couleur-surface-douce);
      }
      .bouton:focus-visible {
        outline: none;
        box-shadow: var(--focus-anneau);
      }
      .bouton:disabled {
        border-color: transparent;
        background: var(--couleur-surface-douce);
        color: var(--couleur-encre);
        opacity: 0.55;
        cursor: not-allowed;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-8);
      }
      @media (prefers-reduced-motion: reduce) {
        .bouton,
        a {
          transition: none;
        }
        .bouton:active:not(:disabled) {
          transform: none;
        }
      }

      /* Champs : ChampTexte, ZoneDeTexte, Selecteur. */
      textarea,
      input[type='text'],
      select {
        width: 100%;
        min-height: var(--hauteur-champ);
        padding: 0 var(--espacement-12);
        border: 1px solid var(--couleur-controle);
        border-radius: var(--rayon-champ);
        background-color: var(--couleur-fond);
        color: var(--couleur-encre);
        font: inherit;
        transition: border-color var(--duree-transition) ease;
      }
      input[type='text'] {
        width: auto;
        font-family: var(--police-code);
        font-variant-ligatures: none;
      }
      textarea {
        min-height: 7rem;
        padding: var(--espacement-12);
        resize: vertical;
        field-sizing: content;
      }
      .reponse-envoyee {
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      textarea:disabled,
      input:disabled {
        background-color: var(--couleur-surface-douce);
        opacity: 0.65;
      }
      textarea:focus-visible,
      input[type='text']:focus-visible,
      select:focus-visible {
        outline: none;
        border-color: var(--couleur-accent);
        box-shadow: var(--focus-anneau);
      }
      select {
        padding-inline-end: var(--espacement-32);
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, currentcolor 50%),
          linear-gradient(135deg, currentcolor 50%, transparent 50%);
        background-position:
          calc(100% - 1.125rem) 50%,
          calc(100% - 0.8125rem) 50%;
        background-repeat: no-repeat;
        background-size:
          0.3125rem 0.3125rem,
          0.3125rem 0.3125rem;
      }
      /* Une question : sa carte propre, sur le fond de la carte de l'étape. */
      .item {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
        padding: var(--espacement-16);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      .item > label,
      .relance > label {
        font-weight: 500;
      }
      /* Le complément d'une réponse, après sa correction, dans la carte de la question. */
      .relance {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
      }
      .item[data-fait='oui'] {
        border-color: var(--couleur-succes);
      }
      /* Une question à reprendre : la couleur du statut « À reprendre » de l'appli. */
      .item[data-fait='reprise'] {
        border-color: var(--couleur-erreur);
      }
      .item-reprise {
        margin: 0;
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1.25rem;
      }
      .erreur {
        margin: 0;
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .erreur:empty {
        display: none;
      }

      /* Confiance : GroupeSegmente. */
      fieldset {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-8);
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }
      legend {
        float: left;
        width: 100%;
        padding: 0;
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1.25rem;
        color: var(--couleur-texte-secondaire);
      }
      .choix label {
        position: relative;
        display: flex;
        flex: 1 0 auto;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding-inline: var(--espacement-8);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-option);
        background: var(--couleur-fond);
        white-space: nowrap;
        cursor: pointer;
      }
      /* La vraie radio couvre l'option et déborde du cadre : la zone tactile fait au moins 44 px. */
      .choix input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .choix label:has(input:checked) {
        border-color: var(--couleur-accent);
        background: var(--couleur-accent);
        box-shadow: var(--ombre-option);
        color: var(--couleur-accent-sur-fond);
        font-weight: 600;
      }
      .choix label:has(input:focus-visible) {
        box-shadow: var(--focus-anneau);
      }
      .choix label:has(input:disabled) {
        opacity: 0.65;
        cursor: not-allowed;
      }
      /* Une table de vérité à remplir : les faits donnés, puis VRAI ou FAUX à choisir dans chaque case. */
      .table-saisie {
        display: table;
        width: 100%;
        white-space: normal;
      }
      .table-saisie th,
      .table-saisie td {
        padding: var(--espacement-4);
        text-align: center;
        vertical-align: middle;
      }
      .table-saisie td.entree {
        color: var(--couleur-texte-secondaire);
      }
      .table-saisie td.valeur {
        font-weight: 600;
      }
      .table-saisie .choix {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-4);
      }
      .table-saisie .choix label {
        min-height: 44px;
        padding-inline: var(--espacement-4);
      }

      /* L'option choisie d'un essai : marquée, la correction viendra à la fin de l'étape. */
      [data-essai] button[aria-pressed='true']:disabled {
        border-color: var(--couleur-accent);
        background: var(--couleur-accent-douce);
        color: var(--couleur-encre);
        font-weight: 600;
        opacity: 1;
      }
      [data-essai] .options button[aria-pressed='true']::after {
        content: ' · ta réponse';
        color: var(--couleur-accent);
        font-weight: 600;
      }

      /* Correction : BulleCorrection. */
      .correction {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        padding: var(--espacement-20);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-carte);
        background: var(--couleur-surface);
      }
      .correction > strong {
        display: flex;
        align-items: center;
        gap: var(--espacement-8);
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.25rem;
        color: var(--couleur-texte-secondaire);
      }
      .correction > strong::before {
        flex: none;
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: currentcolor;
        content: '';
      }
      .correction[data-niveau='solide'] > strong {
        color: var(--couleur-succes);
      }
      .correction[data-niveau='partiel'] > strong {
        color: var(--couleur-alerte);
      }
      .correction[data-niveau='fragile'] > strong {
        color: var(--couleur-erreur);
      }
      .correction p {
        margin: 0;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      /* Sous la question : la correction, puis l'accord sur le niveau quand elle est tirée au sort. */
      .sortie {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
      }
      .sortie:empty {
        display: none;
      }
      .accord {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8) var(--espacement-12);
      }
      /* BadgeNeComptePas de l'appli : une réponse qui ne compte pas pour le statut, et pourquoi. */
      .badge-compte {
        display: inline-flex;
        align-items: center;
        align-self: flex-start;
        min-height: 1.75rem;
        padding: 0 var(--espacement-12);
        border: 1px solid var(--couleur-ligne);
        border-radius: 999px;
        background: var(--couleur-surface-douce);
        color: var(--couleur-texte-secondaire);
        font-size: 0.75rem;
        font-weight: 500;
        line-height: 1rem;
        white-space: nowrap;
      }

      /* Détails repliables ; l'objectif d'examen replié (carte, pratique) en est un. */
      details {
        padding: 0 var(--espacement-16);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      details[open] {
        padding-block-end: var(--espacement-12);
      }
      details > :not(summary) {
        margin-block-start: var(--espacement-12);
      }
      details > summary + * {
        margin-block-start: var(--espacement-4);
      }
      summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--espacement-12);
        min-height: 48px;
        font-weight: 500;
        list-style: none;
        cursor: pointer;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::after {
        flex: none;
        width: 0.5rem;
        height: 0.5rem;
        border-inline-end: 2px solid var(--couleur-texte-secondaire);
        border-block-end: 2px solid var(--couleur-texte-secondaire);
        transform: rotate(45deg) translate(-2px, -2px);
        transition: transform var(--duree-transition) ease;
        content: '';
      }
      details[open] > summary::after {
        transform: rotate(-135deg) translate(-2px, -2px);
      }
      summary:focus-visible {
        outline: none;
        border-radius: var(--rayon-champ);
        box-shadow: var(--focus-anneau);
      }

      /* Classer : une ligne par élément, deux boutons de colonne. */
      .a-classer {

      /* La box ouverte : ses fonctions et ce que chacune fait. */
      .fonctions-rangee {

      .fonction-detail p {

      /* Une sortie de terminal, montrée pour être lue : monospace, sans retour à la ligne. */
      .sim-sortie {
        display: flex;

        gap: var(--espacement-8);

      }
      .sim-sortie pre.listing {

      }
      pre.listing {
        max-width: 100%;
        overflow-x: auto;
        margin: 0;
        padding: var(--espacement-12) var(--espacement-16);

      /* Relever une information dans une sortie : une ligne = un bouton. */
      .cibles button[aria-pressed='true'] {
        border-color: var(--couleur-accent);

      .lignes-sortie {

        max-width: 100%;
        overflow-x: auto;

        border-radius: var(--rayon-champ);

      .lignes-sortie button.ligne:focus-visible {

      .lignes-sortie button.ligne[aria-pressed='true'] {

      .lignes-sortie button.ligne.choisi-bon {

      /* Un petit tableau lu avec la fiche : adresses, fonctions, deux rôles côte à côte. */
      .table-lue {

      /* Le calcul d'une conversion, écrit en lignes. */

      }
      [data-os] {

      }

  <body>
    <header class="barre">
      <h1 id="titre"></h1>
      <p>
        <span id="mode" class="mode" role="status">Connexion à l’appli…</span>

    <nav class="fil" id="fil" aria-label="Étapes de la fiche" data-ouvert="false">

    <main>
      <p id="avis" class="avis" role="alert" hidden></p>

    <!-- ET1, perception : trois gestes de la soirée de Yasmine sur le même chemin, puis un pari sans note. -->
    <template data-etape="ET1">
      <div data-ecran="Trois gestes">
        <p class="accroche">
          Yasmine, 34 ans, rentre chez elle. Ce soir, elle fait trois gestes avec sa tablette, son
          PC et son téléphone. Pour chacun, regarde ce qui part, par où cela passe, ce qui arrive et
          ce qui revient.
        </p>
        <div class="cadre pour-lire">
          <p class="discret">Les trois gestes et les mots de la soirée, pour lire :</p>
          <ul>
            <li>
              La box : le boîtier branché à la ligne qui entre chez Yasmine. Tout ce qui sort de la
              maison passe par elle.
            </li>
            <li>Le Wi-Fi : le lien sans fil entre un appareil et la box.</li>
            <li>Internet : le grand réseau où se trouvent les sites, au-delà de la box.</li>
            <li>Premier geste : sa tablette rejoint le Wi-Fi de la maison.</li>
            <li>Deuxième geste : son PC ouvre une page du site de la formation.</li>
            <li>
              Troisième geste : son PC, puis son téléphone, demandent chacun « quel est mon numéro ?
              ».
            </li>
          </ul>
        </div>
        <div
          class="outil ex"
          data-widget="maison"
          data-id="maison"
          data-maillons="L’appareil de Yasmine|Le Wi-Fi ou le câble|La box|Internet|Le site de la formation"
          data-apres="Trois gestes très différents. Pour chacun, quelque chose est parti de chez Yasmine, est arrivé quelque part, et une réponse est revenue."
          data-lecture="Les trois gestes de la soirée de Yasmine. Sa tablette rejoint le Wi-Fi : la tablette parle à la box, qui lui répond avec un numéro pour elle et de quoi trouver les sites. Son PC ouvre une page du site de la formation : la demande traverse le Wi-Fi ou le câble, la box et Internet jusqu'au site, et la page revient par le même chemin. Son PC puis son téléphone demandent chacun leur numéro : la box en donne un à chacun dans la maison, mais un site sur Internet les voit tous les deux sous un seul numéro."
        >
          <p class="outil-titre">Les trois gestes</p>
          <p class="discret">Joue les trois, dans l’ordre que tu veux.</p>
          <ul class="gestes" hidden>
            <li
              data-geste="wifi"
              data-nom="La tablette rejoint le Wi-Fi"
              data-chemin="0,1,2"
              data-part="la tablette, qui cherche le Wi-Fi de la maison"
              data-arrive="la box, qui répond sans que Yasmine tape quoi que ce soit"
              data-revient="un numéro pour la tablette, et de quoi parler à la box et trouver les sites"
            ></li>
            <li
              data-geste="page"
              data-nom="Le PC ouvre une page"
              data-chemin="0,1,2,3,4"
              data-part="la demande d’une page, avec le nom du site"
              data-arrive="la machine qui garde le site, quelque part sur Internet"
              data-revient="la page, avec ses textes et ses images, par le même chemin"
            ></li>
            <li
              data-geste="numero"
              data-nom="Demander son numéro"
              data-chemin="0,2,3,4"
              data-part="la question « quel est mon numéro ? », posée par le PC puis par le téléphone"
              data-arrive="la box, pour le numéro dans la maison, puis un site qui dit quel numéro il voit"
              data-revient="deux numéros différents dans la maison, mais un seul numéro vu depuis Internet pour les deux"
            ></li>
          </ul>
        </div>
      </div>
      <div data-ecran="Ton pari">
        <p class="accroche">
          Un autre soir, Yasmine allume sa tablette. Elle affiche « connectée au Wi-Fi », mais
          aucune page ne s’ouvre.
        </p>
        <div
          data-widget="pari"
          class="ex"
          data-apres="Ta réponse est gardée. La fiche y revient à la fin du bloc, pour voir si ton pari tenait."
        >
          <p class="q">À ton avis, où est le problème ?</p>
          <ul class="options">
            <li data-option="lien">
              Entre la tablette et la box : malgré l’affichage « connectée », la tablette n’est pas
              vraiment reliée à la box.
            </li>
            <li data-option="chemin">
              Le long du chemin : la tablette est bien reliée à la box, mais une étape plus loin
              peut être coupée.
            </li>
            <li data-option="site">
              Au bout du chemin : « connectée » veut dire qu’Internet marche, donc c’est le site
              lui-même qui est en panne.
            </li>
          </ul>
        </div>
      </div>
    </template>
    <!-- ET2, carte : où est le bloc dans la partie Internet et le Web, à quoi il sert, l’idée du bloc, ce que l’apprenant saura faire. -->
    <template data-etape="ET2">
      <p class="accroche">
        Pourquoi la page ne s’ouvre-t-elle pas sur la tablette de Yasmine alors que le Wi-Fi affiche
        « connectée » ? Ce bloc ouvre la box de chez toi pour que tu saches où chercher.
      </p>
      <h3>Où tu es</h3>
      <p>
        Ce bloc est le deuxième de la partie Internet et le Web, qui tient en trois idées reliées :
      </p>
      <ul class="carte-partie">
        <li>
          <strong>Internet, réseau de réseaux</strong> : Internet transporte des messages d’une
          adresse à une autre.
        </li>
        <li class="ici">
          <strong>Le réseau local et l’accès à Internet</strong> : chez toi, une box relie tes
          appareils à Internet. C’est le cas concret du bloc précédent. Tu es ici.
        </li>
        <li>
          <strong>Le Web en action</strong> : le Web est un service qui tourne sur Internet, où un
          navigateur demande une page à un serveur. Il s’appuie sur Internet, donc sur ce bloc.
        </li>
      </ul>
      <h3>À quoi ça sert</h3>
      <p>
        Quand une page ne s’ouvre pas, tu sais dans quel ordre tester ce qui est en cause : ton
        appareil, ta box, ta ligne ou le site. Tu sais aussi lire ce que ton ordinateur dit de son
        réseau. Pour un développeur web, c’est le premier réflexe quand un site ne répond pas :
        savoir si la panne est chez lui, sur le chemin ou sur le serveur.
      </p>
      <p>
        <strong>L’idée du bloc.</strong> Entre ton appareil et un site, la page traverse une chaîne
        d’étapes, et ta box en marque la frontière : tu vas découvrir ce que « connecté » prouve
        vraiment, et comment trouver l’étape qui casse.
      </p>
      <h3>Ce que tu connais déjà</h3>
      <p>
        Ce bloc reprend deux choses vues avant. Dans « L’information en bits » : un octet est fait
        de 8 bits. Dans « Internet, réseau de réseaux » : un message voyage en paquets, de petits
        morceaux de message, chacun avec l’adresse IP de sa destination.
      </p>
      <h3>À la fin, tu sauras</h3>
      <ul>
        <li>
          dessiner le réseau de ta maison, de tes appareils jusqu’à Internet, et dire ce que fait
          chaque partie de ta box ;
        </li>
        <li>
          ne pas confondre des mots voisins, comme l’adresse d’un appareil chez toi et celle que
          voit Internet, ou la quantité de données qui arrive chaque seconde et le temps que met une
          réponse à revenir ;
        </li>
        <li>
          relever tes réglages réseau, tester le chemin jusqu’à un site, et lire les pages de ta box
          sans rien changer.
        </li>
      </ul>
      <p class="discret">
        Il te faudra ton ordinateur, un navigateur, et ta box branchée chez toi. Tu n’as rien à
        installer : la fenêtre où l’on tape des commandes, le terminal, est déjà dans ton
        ordinateur.
      </p>
    </template>
    <!-- ET3, tentative : cinq questions à l’intuition avant toute explication, une par erreur critique (deux pour la confusion entre rôles voisins), sans note. -->
    <template data-etape="ET3">
      <div data-ecran="La tablette de Yasmine">
        <p class="accroche">
          Essaie avec ton bon sens. Personne ne te note : réponds comme tu penses, ou « Je ne sais

        </p>
        <div
          class="ex"
          data-widget="choix"
          data-essai
          data-id="p1"
          data-reponse="lien"
          data-melanger="non"
          data-explication="« Connectée au Wi-Fi » dit seulement que le lien entre la tablette et la box marche. Le reste du chemin jusqu’au site peut être coupé : le Wi-Fi n’est pas l’accès à Internet."

          <p class="q">
            La tablette de Yasmine affiche « connectée au Wi-Fi ». Que peut-on en conclure à coup

          <ul class="options">
            <li data-option="lien">

            <li

    <!-- ET8, explication : débit contre latence, le temps d’un fichier, puis le passage des Mbit/s aux Mo/s. -->
    <template data-etape="ET8">
      <div data-ecran="Débit et latence">
        <p class="accroche">
          Un autre soir, la tablette de Yasmine ouvre bien ses pages, mais un fichier de la
          formation met du temps à arriver. Deux mesures différentes décrivent ce qu’elle vit : la
          quantité de données qui arrive, et le temps que met une réponse à revenir.
        </p>
        <p class="discret">
          Pour te représenter la différence : un tuyau d’eau. Sa largeur donne la quantité d’eau qui
          passe chaque seconde, sa longueur donne le temps que met la première goutte à arriver. Ce
          que l’image ne dit pas : un tuyau a une longueur fixe, alors que sur un réseau très
          chargé, le temps d’aller-retour peut aussi monter.
        </p>
        <p>
          Sur un réseau, la largeur s’appelle le <strong>débit</strong> : la quantité de données qui
          arrivent chaque seconde. Il se mesure en Mbit/s, des mégabits par seconde. La longueur
          s’appelle la <strong>latence</strong> : le temps d’un aller-retour entre ton appareil et
          une autre machine. Elle se mesure en millisecondes (ms) : c’est elle qui fait qu’une page
          réagit vite, ou lentement, à un clic.
        </p>
        <p>
          Un fort débit n’implique pas une faible latence. Avec une fibre, comme celle de Yasmine,
          les deux sont bons : l’aller-retour vers le site de la formation dure une quinzaine de ms.
          Avec une liaison par satellite, le débit peut être grand alors que l’aller-retour dépasse
          souvent 500 ms.
        </p>
        <p>
          Ce sont deux mesures de toute la chaîne : le débit est limité par le maillon le plus
          étroit, et la latence s’additionne d’un maillon à l’autre, de la tablette au serveur.
        </p>
        <div
          class="ex"
          data-widget="choix"
          data-id="latence"
          data-reponse="rien"
          data-aide1="Les Mbit/s mesurent-ils un temps d’aller-retour ?"
          data-aide2="Quelle unité utilise-t-on pour la latence, et la voit-on dans l’annonce de cette offre ?"
          data-aide3="Le débit et la latence ont chacun leur unité. L’annonce ne donne qu’une des deux, donc elle ne permet rien de conclure sur l’autre."
          data-explication="Le débit (Mbit/s) et la latence (ms) sont deux mesures différentes. Une annonce en Mbit/s ne dit rien du temps d’aller-retour."
        >
          <p class="q">
            Une publicité que reçoit Yasmine vante une offre à 500 Mbit/s. Que peut-on dire de la
            latence de cette offre ?
          </p>
          <ul class="options">
            <li data-option="rien">Rien : l’offre ne donne pas de temps d’aller-retour.</li>
            <li
              data-option="faible"
              data-retour="Une liaison large peut-elle être longue ? Que mesure la latence qui ne dépend pas de la largeur ?"
            >
              Qu’elle est faible, puisque le débit est fort.
            </li>
            <li
              data-option="forte"
              data-retour="Un gros débit suffit-il à dire combien de temps met un aller-retour ?"
            >
              Qu’elle est forte.
            </li>
          </ul>
        </div>
      </div>
      <div data-ecran="Du fichier au temps">
        <p class="accroche">
          L’offre de Yasmine annonce 100 Mbit/s. Elle télécharge un fichier de 300 Mo.
        </p>
        <div
          class="ex"
          data-widget="choix"
          data-id="duree"
          data-reponse="vingtquatre"
          data-prediction
          data-aide1="Les Mo et les Mbit/s ne comptent pas la même chose. Qu’est-ce qui change entre les deux ?"
          data-aide2="Un octet est fait de 8 bits. Que change ce nombre au temps d’arrivée ?"
          data-aide3="Le fichier compte des octets, l’offre compte des bits. Convertis l’un dans l’unité de l’autre avant de comparer."
        >
          <div class="cadre pour-lire">
            <p class="discret">Deux unités, pour lire :</p>
            <ul>
              <li>Mbit/s : des mégabits par seconde (un bit est un 0 ou un 1).</li>
              <li>Mo/s : des mégaoctets par seconde. Un octet est fait de 8 bits.</li>
            </ul>
          </div>
          <p class="q">
            Avec une offre de 100 Mbit/s, combien de temps met un fichier de 300 Mo à arriver, au
            mieux ?
          </p>
          <ul class="options">
            <li data-option="vingtquatre">Environ 24 secondes.</li>
            <li
              data-option="trois"
              data-retour="Un fichier compté en Mo et une offre comptée en Mbit/s mesurent-ils avec la même unité ?"
            >
              Environ 3 secondes.
            </li>
            <li
              data-option="minutes"
              data-retour="Combien de fois faut-il corriger l’écart entre les deux unités, une fois ou plusieurs ?"
            >
              Environ 5 minutes.
            </li>
          </ul>
        </div>
        <p>
          Un octet fait 8 bits. Un débit en Mbit/s compte des bits, un fichier en Mo compte des
          octets. Pour passer des Mbit/s aux Mo/s, on divise par 8.
        </p>
        <ul class="calcul">
          <li>100 Mbit/s ÷ 8 = 12,5 Mo/s</li>
          <li>300 Mo ÷ 12,5 Mo/s = 24 secondes</li>
        </ul>
        <p>
          Ce calcul donne le meilleur cas : le débit annoncé par l’offre est un maximum, et le débit
          mesuré pendant un téléchargement est souvent plus bas.
        </p>
        <p data-si-essai="p5:faux">
          À la question sur le fichier de 100 Mo avec une offre de 100 Mbit/s, tu avais répondu
          <span data-essai-rappel="p5">autre chose</span>. Un octet compte 8 bits : un fichier
          contient huit fois plus de bits que son nombre de Mo, donc il arrive moins vite que le
          nombre de Mbit/s ne le laisse croire.
        </p>
      </div>

          data-pieges="80=Les bits et les octets sont-ils en même nombre ? Combien de bits y a-t-il dans un octet ?|640=Passer de bits à octets doit-il rendre le nombre plus grand ou plus petit ?"

          data-aide2="Une même quantité compte plus de bits que d’octets. Le nombre de Mo/s sera-t-il plus petit ou plus grand que celui de Mbit/s ?"
          data-aide3="Divise le nombre de Mbit/s par le nombre de bits d’un octet."
          data-explication="Un octet fait 8 bits : 80 Mbit/s font 80 ÷ 8 = 10 Mo/s. Un nombre de Mo/s est huit fois plus petit que le nombre de Mbit/s correspondant."
          data-sinon="Combien de bits y a-t-il dans un octet ? Le nombre de Mo/s sera-t-il plus petit ou plus grand que celui de Mbit/s ?"
          data-erreur="E4"
        >
          <div class="cadre pour-lire">
            <p class="discret">Deux unités, pour lire :</p>
            <ul>
              <li>Mbit/s : des mégabits par seconde (un bit est un 0 ou un 1).</li>
              <li>Mo/s : des mégaoctets par seconde. Un octet est fait de 8 bits.</li>
            </ul>
          </div>
          <p class="q">Combien cela fait-il de Mo par seconde ?</p>
        </div>
      </div>

    <!-- ET10, explication : ping et ce qu’il écrit, les trois tests de proche en proche, le premier maillon muet, tracert et traceroute. -->
    <template data-etape="ET10">
      <div data-ecran="Ping">
        <p class="accroche">
          Un soir, le PC de Yasmine affiche « Ethernet connecté », mais le site de la formation ne
          s’ouvre pas. Elle veut savoir jusqu’où la chaîne tient. Elle utilise
          <span class="mono">ping</span>.
        </p>
        <p>
          <span class="mono">ping</span> envoie de petits paquets à une adresse ou à un nom, et
          attend une réponse. Il écrit le <strong>temps</strong> de chaque aller-retour, en ms («
          temps= » sous Windows, « time= » sous macOS) : c’est la latence. Il écrit aussi la
          <strong>perte</strong> : la part des paquets envoyés qui n’ont pas eu de réponse. Les
          autres mots de la sortie (TTL, octets, icmp_seq) ne servent pas ici : tu n’as pas à les
          lire.
        </p>
      </div>
      <div data-ecran="Quand ping s’arrête">
        <p class="accroche">
          Avant de lancer ping, Yasmine doit savoir quand il s’arrêtera : cela dépend du système.
        </p>
        <p>
          Combien de paquets ping envoie, et quand il s’arrête, est une convention propre à chaque
          système. Sous Windows, ping envoie quatre paquets, puis s’arrête. Sous macOS, il continue
          jusqu’à ce que tu tapes Ctrl+C. Pour qu’il s’arrête seul, tape
          <span class="mono">ping -c 4</span> suivi de l’adresse.
        </p>
      </div>
      <div data-ecran="De proche en proche">
        <p class="accroche">

          lointaine.

      <div data-ecran="À retenir">
        <div class="cadre a-retenir">
          <p>
            <strong>L’idée du bloc.</strong> La box sépare ton réseau local d’Internet : « connecté
            » ne prouve que ce qui est de ton côté, donc on teste la chaîne de proche en proche, de
            la box vers le site, jusqu’au premier maillon qui casse.
          </p>
          <p><strong>Quatre confusions à éviter.</strong></p>
          <ul>
            <li>
              Le Wi-Fi n’est qu’un lien : « connecté » ne dit rien de la box, du FAI, du DNS ni du
              site.
            </li>
            <li>
              Une adresse privée ne vaut que dans la maison : la box met son adresse publique sur ce
              qui sort (NAT), une adresse IP n’est donc pas unique au monde.
            </li>
            <li>
              Le routeur relie des réseaux, le switch des appareils d’un même réseau ; le DNS
              traduit un nom en adresse, le DHCP distribue les réglages.
            </li>
            <li>
              Le débit se mesure en Mbit/s, la latence en ms ; pour passer de Mbit/s à Mo/s, on
              divise par 8.
            </li>
          </ul>
          <p>
            <strong>Tester, et la box.</strong> Ping vers la passerelle, puis vers une adresse
            publique, puis vers un nom : le premier qui échoue situe la panne, et un ping muet ne
            prouve pas toujours une panne. Le premier saut de tracert ou traceroute est la box, et «
            * * * » est normal. La box regroupe six fonctions : modem (ONT avec la fibre), routeur,
            switch, point d’accès Wi-Fi, DHCP et pare-feu ; le DHCP et le pare-feu sont des
            programmes, pas des pièces.
          </p>
        </div>
      </div>

          que le navigateur affiche. Chaque demande et chaque réponse y passent par la chaîne que tu
          viens de voir : ton appareil, ta box, ton FAI, Internet, puis le serveur du site.
        </p>
        <h3>À explorer plus tard</h3>

          <li>
            Pourquoi, chez certaines box, l’adresse vue d’Internet ressemble à une adresse privée.
          </li>
        </ul>

    <template data-conception>
      <h3>Une question à la fois</h3>
      <ul>
        <li>
          Dans un écran, tout ce qui suit un exercice pas encore fini reste caché jusqu’à ce qu’il
          le soit. Le texte placé après un exercice paraît donc une fois l’exercice fini ; c’est là
          que vont les reprises d’un essai du prétest (data-si-essai) : p1 après lien, p3 après
          switch, p2 après nat, p4 après dnsdhcp, p5 après duree.
        </li>
        <li>
          Le gabarit mélange les options de chaque choix à l’affichage, à chaque visite : l’ordre
          écrit dans la page n’est pas celui que voit l’apprenant. Seuls les essais du prétest p1 à
          p5 gardent leur ordre. Les lignes d’un classement ou d’un appariement ne changent pas
          d’ordre ; les rôles proposés dans une liste déroulante, eux, sont mélangés.
        </li>
        <li>
          Un exercice du cours fini garde son état d’une visite à l’autre : la réponse, le message
          et le texte qui suit restent affichés.
        </li>
      </ul>
      <h3>Les trois gestes et le pari (première étape)</h3>
      <ul>
        <li>
          Les deux écrans de la première étape n’emploient aucun mot du modèle (ni passerelle, ni
          DHCP, ni NAT). Le premier montre trois gestes de la soirée de Yasmine : chaque bouton joue
          un geste, allume les maillons qu’il traverse (l’appareil, le lien, la box, Internet, le
          site), dit ce qui part, où cela arrive et ce qui revient, et marque d’un « ✓ » le geste
          vu. L’outil garde les gestes vus (trace maison) ; il est fini quand les trois ont été
          joués. Le second écran pose le pari, sans note : la réponse est gardée (trace pari) et
          reste visible aux visites suivantes.
        </li>
        <li>
          À l’étape d’ensemble, « Ton pari, repris » redonne la question et rappelle la première
          réponse ; la nouvelle réponse est gardée (trace pari-fin), sans correction. Juste après, «
          Ton pari, corrigé » rappelle les deux réponses et donne la correction écrite, avant le
          schéma de Karim.
        </li>
      </ul>
      <h3>Anticiper avant de voir</h3>
      <ul>
        <li>
          Onze moments demandent à l'apprenant de prévoir avant l'explication, sans note
          (data-prediction) : par où la page revient à la tablette (retour, avant la phrase qui le
          dit), d'où vient l'adresse de la tablette (dhcp0, avant la définition du DHCP), quelle
          adresse voit un site (predpub, avant le tableau du NAT), l'ordre du DHCP, du DNS et du NAT
          (ordre, avant le schéma qui le montre), le temps d'un fichier de 300 Mo à 100 Mbit/s
          (duree, avant la conversion), ce que liste la commande (predsortie, avant ses sorties),
          l’adresse de la passerelle à lire (predpass, avant de la relever), ce que dit un ping vers
          la passerelle (predping, avant le schéma des trois tests), ce que donne le test du nom
          quand l’adresse du site se tait (predtrois, avant de jouer les trois tests), la machine du
          premier saut (predsaut, avant tracert) et où taper l'adresse de la passerelle
          (adressebox). Les options de ces prévisions n'ont aucune marque d'erreur critique, parce
          que la règle n'a pas encore été donnée ; mais deux options sont une erreur en substance :
          « Environ 3 secondes » (duree) est la confusion de Mbit/s et de Mo/s, « Que la ligne du
          FAI marche aussi » (predping) est de croire que le Wi-Fi ou la box prouve la ligne. Deux
          autres questions, la passerelle (ET6) et la carte qui sert (ET9), viennent après la
          définition ou le critère : ce sont des exercices d'application avec coups de pouce, pas
          des prévisions.
        </li>
      </ul>
      <h3>Le choix du système</h3>
      <ul>
        <li>
          Un bouton « Je suis sur Windows » et un bouton « Je suis sur macOS » (outil systeme)
          paraissent dans l’étape « Le terminal » et dans l’atelier. Le choix est gardé (trace os)
          et cache partout dans la page ce qui ne concerne pas l’autre système : les consignes, les
          sorties de terminal et les coups de pouce de l’atelier. Tant que l’apprenant n’a pas
          choisi, tout se voit. Les boutons des deux endroits se suivent.
        </li>
        <li>
          Les exercices de lecture d’une sortie (relever, choisir) restent visibles pour les deux
          systèmes : lire les deux écritures fait partie du métier.
        </li>
      </ul>
      <h3>La box ouverte, les trois tests</h3>
      <ul>
        <li>
          Charge, comptée sur la page : 54 écrans titrés ; dans le cours, 31 exercices, dont dix
          prévisions sans note, plus le pari et sa reprise, un schéma à remplir et deux outils à
          manipuler (la box ouverte, les trois tests) ; en pratique, dix items, une variante
          seulement après une solution vue, et trois explications ; cinq questions de restitution.
          L’atelier se fait hors de la page (six écrans, neuf critères). Hors séance : huit rappels,
          cinq vérifications différées, trois transferts et dix-sept cartes.
        </li>
        <li>
          L’écriture du masque (255 marque un nombre du réseau, 0 un nombre de l’appareil) est une
          convention, dite comme telle en ET6 et redonnée avec chaque question qui l’emploie : Q7
          (avec l’hexadécimal) et K11 (« Le masque, pour lire : »). L’apprenant l’applique à un cas,
          il ne la récite pas.
        </li>
        <li>
          La box ouverte (outil fonctions, étape « Dans la box ») : six boutons, un par fonction.
          Chacun montre ce que fait la fonction et ce qu’elle fait chez Yasmine, et se marque d’un «
          ✓ » une fois vu. Rien n’est noté ; l’outil est fini quand les six ont été vus. Les
          fonctions sont interrogées ensuite en pratique (PR1-7) et dans le rappel B06-Q4.
        </li>
        <li>
          Les trois tests de ping (outil sim-ping, étape « Tester la chaîne ») : trois boutons, un
          par test. Chacun montre la sortie du terminal dans le système choisi, puis ce qu’elle
          prouve ; l’outil garde les tests joués (trace sim-ping) et finit quand les trois l’ont
          été. Rien n’est noté.
        </li>
      </ul>
      <h3>Les nombres, les relevés, les classements</h3>
      <ul>
        <li>
          Un nombre (outil nombre) se saisit avec une virgule ou un point ; une unité est écrite à
          côté du champ. Un champ vide n’est pas une réponse : l’outil le refuse sans rien noter.
          Une valeur piégée porte un retour qui pose une question sur le calcul, sans donner le
          résultat. Un nombre faux sans retour prévu reçoit le message écrit dans la fiche pour tout
          autre nombre, qui nomme l’unité en cause sans donner la valeur. Retours de conv (ET8) : 80
          donne « Les bits et les octets sont-ils en même nombre ? Combien de bits y a-t-il dans un
          octet ? », 640 donne « Passer de bits à octets doit-il rendre le nombre plus grand ou plus
          petit ? », tout autre nombre donne « Combien de bits y a-t-il dans un octet ? Le nombre de
          Mo/s sera-t-il plus petit ou plus grand que celui de Mbit/s ? ». PR1-3 : 2,5 et 160
          portent chacun un retour qui nomme les deux unités, tout autre nombre le même message
          général.
        </li>
        <li>
          Un relevé (outil releve) : chaque ligne de la sortie est un bouton. L’apprenant touche une
          information à relever (adresse IPv4, masque, passerelle, DNS), puis la ligne qui la donne
          ; la même ligne peut servir à deux informations. « Vérifier » refuse tant qu’une
          information n’a pas de ligne. La première information fausse donne le retour écrit sur la
          ligne choisie, ou le retour par défaut de l’outil ; les lignes fausses passent en rouge. À
          la solution vue, les bonnes lignes sont entourées en pointillé.
        </li>
        <li>
          Associer, classer : une ligne par élément ; « Vérifier » refuse tant qu’une ligne n’a pas
          de rôle ou de colonne. La première ligne fausse donne son retour écrit dans la fiche, une
          question sur cet élément, et « D’autres lignes sont à revoir. » s’il y en a plusieurs. À
          la solution vue, la bonne valeur est posée dans chaque ligne, en pointillé.
        </li>
      </ul>
      <h3>Le schéma de la maison</h3>
      <ul>
        <li>
          Le schéma rempli (ET4, ET7) est montré avec sa description. Celui de fin de bloc est
          construit pour Karim, dont l’ordinateur câblé perd son appel en visioconférence (la
          passerelle répond, deux adresses publiques ne répondent pas) : seule la première boîte est
          donnée ; l’apprenant remplit la première flèche, la boîte du milieu et la flèche suivante,
          chacune avec une question qui aide sans donner le terme, et répond sous la dernière boîte.
          L’IA le juge sur la chaîne du cas (data-cas), puis le schéma de la fiche s’affiche pour
          comparer. Il ne compte pas pour le statut.
        </li>
      </ul>
      <h3>Les retours</h3>
      <ul>
        <li>
          Le retour d’une option fausse nomme l’élément du modèle en cause et pose une question,
          sans désigner la bonne option. Le retour d’une erreur critique nomme le maillon, la
          fonction ou l’unité en cause.
        </li>
      </ul>
      <h3>Les erreurs critiques et le prétest</h3>
      <ul>
        <li>
          E1 (le Wi-Fi pris pour l’accès à Internet) est marquée par une option en p1, dans « Le
          Wi-Fi n’est qu’un lien » (lien) et en pratique (PR1-1 et sa variante). E2 (une IP unique
          au monde) par une option en p2, dans nat et boxpage, et en pratique (PR1-8 et sa
          variante). E3 (routeur et switch, DNS et DHCP) par une option en p3 et p4, dans switch et
          dnsdhcp, et en pratique par les deux lignes de PR1-7 qui opposent le switch et le routeur
          (l'outil marque la ligne, quelle que soit la mauvaise réponse) et par les lignes du DNS,
          du DHCP, du routeur et du switch en PR1-9. Les relevés ne portent aucune erreur critique :
          une ligne mal choisie y est un retour, pas une confusion de rôles. E4 (Mbit/s et Mo/s) par
          une option en p5, par les valeurs piégées de conv et en pratique (PR1-3 et sa variante).
          Le prétest touche les quatre avant toute explication, chaque essai est repris au moment où
          le cours y répond (data-si-essai).
        </li>
      </ul>
      <h3>Les coups de pouce</h3>
      <ul>
        <li>
          L’échelle est celle du gabarit. Un choix : chaque option fausse est retirée, avec son
          retour ; tant que plusieurs options restent, « Un coup de pouce » donne l’indice écrit
          dans la fiche (data-aide1), puis un second indice qui oriente (data-aide2), puis l’étape
          détaillée (data-aide3), puis la solution. Associer, classer, relever et le nombre : rien
          avant une réponse fausse, puis data-aide1, data-aide2, data-aide3, puis la solution. Après
          une solution vue, l’apprenant refait sur un autre cas quand l’exercice en a un, puis
          explique la solution avec ses mots.
        </li>
        <li>
          Dans la pratique, après une solution vue, l’item se refait sur sa variante, puis
          l’apprenant explique. L’ordre des items va du plus guidé au plus seul : PR1-1 à PR1-6 ont
          un encadré « pour lire » qui redonne les mots ou la convention, PR1-7 et PR1-8 n’en ont
          plus, PR1-9 et PR1-10 n’ont aucune définition et ne redonnent que la liste de leurs six
          mots. Le geste (convertir, relever) ne prend que trois items sur dix, PR1-3, PR1-4 et
          PR1-5 ; PR1-2 range des adresses selon trois plages données, ce qui est une lecture ;
          compté comme geste, il ferait quatre sur dix. Trois items sur dix portent une demande
          d’explication (data-justifier : PR1-6, PR1-9, PR1-10), sur ce que l’écran ne montre pas ;
          en PR1-9 et PR1-10, elle fait justifier les trois paires que l’appariement ne fait que
          nommer : LAN et WAN, débit et latence, FAI et hébergeur ; PR1-10 en porte donc deux, en
          deux questions qui se suivent, parce que les demandes d’explication sont limitées à un
          tiers des items ; les paires de PR1-8 (IP privée et publique), ainsi que DNS et DHCP, sont
          justifiées en restitution (B06-R3, B06-R2) ; le manifeste la déclare, l’IA la juge, et
          l’item n’est réussi qu’avec une explication Solide.
        </li>
        <li>
          L’atelier se fait sur la machine de l’apprenant, hors de la page : six écrans de guidage
          (les réglages, la comparaison avec les plages, les trois pings, le chemin d’un paquet, les
          pages de la box, le schéma de son réseau dessiné sur papier), chacun avec quatre crans
          d’aide emboîtés (un indice, une piste détaillée, une partie de la solution, la solution
          entière). Le constat porte sur neuf critères observables fixés d’avance, et l’atelier ne
          compte réussi que sans aide.
        </li>
      </ul>

        "contexte_ia": "Bloc B06 du module « Écosystème et outils du développeur » (DWWM), deuxième bloc de la partie Internet et le Web, après « Internet, réseau de réseaux » et avant le Web en action. Le modèle du bloc : chez toi, la box est la frontière entre ton réseau local (adresses privées, distribuées par le DHCP) et Internet (une adresse publique, partagée par NAT) ; la chaîne appareil, lien, box, FAI, Internet, serveur du site fonctionne maillon par maillon, donc un test de proche en proche (la passerelle, puis une adresse publique, puis un nom) situe où elle casse. La relation centrale, annoncée dans la carte sans sa conclusion (pour ne pas souffler le premier essai), puis dite en une seule phrase dans la correction du pari et dans « À retenir » : la box sépare le réseau local d’Internet, « connecté » ne prouve que ce qui est de son côté, donc on teste de proche en proche, de la box vers le site, et le premier test qui échoue situe la panne.\nLes éléments. Un appareil se relie à la box par le Wi-Fi (radio) ou par Ethernet (câble) : c’est le lien. La box regroupe six fonctions : un modem (avec la fibre, un ONT, souvent un boîtier séparé), un routeur, un switch, un point d’accès Wi-Fi, un DHCP et un pare-feu. La formule « box = modem + routeur + switch + point d’accès + DHCP + pare-feu » est une formule de fonctions : le DHCP et le pare-feu sont des programmes, pas des pièces ; modem et point d’accès sont des composants. Le FAI est l’entreprise qui fournit l’accès à Internet ; l’hébergeur fait tourner les serveurs d’un site ; ce sont deux rôles, une même entreprise peut tenir les deux. Les six paires : DNS et DHCP (le DNS traduit un nom en adresse IP, le DHCP distribue les réglages : adresse IP, masque, passerelle et adresse du DNS) ; routeur et switch (le routeur relie des réseaux différents, le switch relie des appareils d’un même réseau) ; LAN et WAN (le réseau local de la maison, et le réseau étendu du FAI et d’Internet, la box étant à la frontière) ; débit et latence (quantité de données par seconde en Mbit/s, temps d’un aller-retour en ms ; l’un n’implique pas l’autre, une fibre a les deux bons, un satellite géostationnaire peut avoir un grand débit et plus de 500 ms) ; IP privée et publique ; FAI et hébergeur.\nLes adresses. Une IPv4 s’écrit avec quatre nombres de 0 à 255 séparés par des points (un nombre par octet) ; l’IPv6 existe, plus longue, en hexadécimal ; on relève l’IPv4. Plages privées : 10.0.0.0 à 10.255.255.255, 172.16.0.0 à 172.31.255.255, 192.168.0.0 à 192.168.255.255 ; elles sont redonnées à chaque exercice qui les emploie et ne s’apprennent pas par cœur. Une adresse privée ne vaut que dans un réseau local : deux maisons peuvent avoir la même. La box remplace l’adresse privée par son adresse publique à l’aller et la rétablit au retour (NAT) : plusieurs appareils partagent une adresse publique, une IP n’est donc pas unique au monde. Les adresses de documentation 203.0.113.x et 198.51.100.x sont les adresses publiques des exemples. Le masque 255.255.255.0 dit que les trois premiers nombres désignent le réseau et le dernier l’appareil ; sous macOS, ifconfig l’écrit 0xffffff00 (ff vaut 255). La passerelle est l’adresse de la box vue de la maison : par là sort tout paquet destiné à un autre réseau. Sous macOS, les réglages réseau l’appellent « Routeur » : même adresse, autre nom.\nLe terminal. Windows : Invite de commandes, ipconfig /all liste toutes les cartes ; la bonne est celle qui a une IPv4 et une « Passerelle par défaut » renseignée, et le DNS est la ligne « Serveurs DNS ». macOS : Terminal, ifconfig liste toutes les interfaces ; l’active porte « status: active » et une ligne inet, et il ne faut pas présumer en0 ; ifconfig ne donne ni la passerelle ni le DNS, qui se lisent dans Réglages Système, Réseau, Détails (onglets TCP/IP et DNS). Les sorties sont fournies, fictives, et se lisent : l’apprenant n’écrit pas de code. Ping envoie de petits paquets et mesure le temps de réponse (la latence, en ms) et la perte ; Windows en envoie quatre puis s’arrête, macOS continue jusqu’à Ctrl+C ou ping -c 4. Un ping sans réponse ne prouve pas toujours une panne : un pare-feu peut refuser de répondre. Un ping vers une IP qui répond et vers un nom qui échoue situe le problème dans le DNS. Le premier test qui échoue, dans l’ordre passerelle, adresse publique, nom, situe la panne ; les suivants échouent par conséquence. tracert (Windows) et traceroute (macOS) listent les machines traversées : le premier saut est la box, et « * * * » est fréquent et normal.\nLes conversions. Un octet fait 8 bits : 100 Mbit/s = 12,5 Mo/s, on divise par 8. Piège : confondre Mbit/s et Mo/s donne un temps huit fois trop court (diviser le fichier par le débit sans convertir) ou huit fois trop long (multiplier deux fois).\nL’atelier se fait sur la machine de l’apprenant : le terminal, les réglages, trois pings, un tracert ou traceroute, l’interface de la box à l’adresse de la passerelle, lue sans rien modifier. Les cibles réelles de l’atelier sont 1.1.1.1 et wikipedia.org. Si la box affiche comme adresse publique une adresse qui semble privée (chez certains fournisseurs), l’atelier dit de la noter telle quelle comme un résultat ; le cas n’est ni expliqué ni interrogé.\nLes pièges à repérer : croire que « connecté au Wi-Fi » prouve l’accès à Internet (E1) ; croire qu’une adresse IP est unique au monde, ou qu’un site voit l’adresse privée d’un appareil (E2) ; confondre routeur et switch, ou DNS et DHCP (E3) ; confondre Mbit/s et Mo/s (E4). Ce que la fiche exige comme réponse Solide : la relation est retrouvée avec ses mots, appliquée au cas posé, sans erreur critique ; une réponse qui récite des définitions sans les relier au cas est Partielle. Les personnages sont Yasmine (son PC est relié à la box par un câble Ethernet, sa tablette et son téléphone par le Wi-Fi), Farid (un ami de Yasmine, qui habite un autre appartement, chez lui toujours, avec un Mac, un téléphone, une imprimante et une console de jeu ; sa box a l’adresse publique 198.51.100.7 et son réseau est en 192.168.1.x) et, au cas inédit de l’étape d’ensemble seulement, Karim. L’offre de Yasmine est de 100 Mbit/s, celle de Farid de 200 Mbit/s, toutes deux avec la fibre. Les salles de formation sont des cas sans personnage. L’adresse 203.0.113.20 est partout celle du site de la formation (203.0.113.25 son serveur de messagerie, 203.0.113.30 le serveur de ses documents) et 198.51.100.9 celle d’un autre service. Pour examiner une explication, la grille de compréhension : l’idée en mots simples, le mécanisme ou la raison au niveau de la fiche, la condition d’application, le terme exact, la relation avec une autre notion du modèle, un exemple ou une limite ; dire ce qui manque et ce que ça implique. Une réponse à moitié juste est notée à moitié juste, avec ce qui manque.",
