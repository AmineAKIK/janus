              enchaine: typeof c.restantes === 'function',
            })
            ex.append(c.echelle.zone)
          }
          if (dansItem(ex)) {
            remonterItem(ex, c)
            return c
          }
          if (ex.dataset.variante) return c
          const garde = traces['ex:' + ex.dataset.id]
          if (garde && typeof garde === 'object' && garde.e) {
            // Une solution vue, ni refaite ni expliquée à la visite d'avant : la suite de l'écran
            // attend encore (règle F04).
            const cle = 'explique:ex:' + ex.dataset.id
            const reprise =
              garde.e === 'vu' &&
              avecReprise(ex) &&
              !garde.refait &&
              !traces[cle] &&
              !traces[cle + ':variante']
            if (reprise) ex.dataset.reprise = 'oui'
            appliquer(ex, c, garde.e, garde.v)
            if (reprise) apresSolution(ex, c)
            else {
              // L'explication déjà écrite revient avec sa correction, et l'autre cas refait avec sa
              // réponse : sans cela, l'exercice redemande ce qui est fait.
              if (traces[cle]) expliquer(ex, c.solution(), consigneExplication(ex, garde.e))
              if (garde.e === 'vu' && garde.variante && c.variante)
                remonterVariante(ex, c, garde.variante)
              else if (garde.e === 'vu') proposerVariante(ex, c)
            }
          }
          return c
        }

        /** La consigne d'une explication déjà demandée, pour la remontrer telle qu'elle a été posée. */
        function consigneExplication(ex, etat) {
          if (etat === 'vu') return fr(POUR_CONTINUER)
          if (ex.dataset.justifier && !ex.dataset.variante) return fr(ex.dataset.justifier)
          return undefined
        }

        /** L'autre cas d'un exercice du cours, refait à la visite d'avant : il revient fini. */
        function remonterVariante(ex, c, garde) {
          const nouveau = c.variante()
          if (!nouveau) return proposerVariante(ex, c)
          for (const n of Array.from(ex.children)) n.hidden = true
          nouveau.dataset.variante = 'oui'
          nouveau.dataset.remonte = 'oui'
          if (ex.dataset.id) nouveau.dataset.origine = ex.dataset.id
          ex.append(el('div', { class: 'refaire' }, nouveau))
          const cv = monterEx(nouveau)
          if (!cv) return
          appliquer(nouveau, cv, garde.e, garde.v)
          delete nouveau.dataset.remonte
          // Réussi, l'autre cas demande toujours son explication (comme à la réponse) ; vu, elle est faite.
          if (garde.e !== 'vu' || traces['explique:' + cleExplication(nouveau)])
            expliquer(nouveau, cv.solution(), consigneExplication(nouveau, garde.e))
        }

        /**
         * Un item de pratique déjà réussi revient avec sa réponse, et son explication avec ses
         * corrections (ou son champ, si elle attend encore) : l'apprenant ne refait pas ce qu'il a fait.
         * Sauf réussi avec de l'aide et à refaire (`refaire`, dès qu'un autre item a été fait depuis) : il
         * se refait sans aide, sur l'autre cas, pour compter, et l'outil repart à neuf. Le gabarit donne l'état des items dans `fiche:rendu` (`detail.pratique`).
         */
        function remonterItem(ex, c) {
          const id = ex.closest('.item')?.dataset.item
          const garde = id && traces['item:' + id]
          const fait = id && pratique[id]
          if (!garde || !fait?.reussi || garde.cas !== (montre[id] ?? 'origine')) return
          if (garde.e !== 'ok' && garde.e !== 'ok1') return
          if (fait.refaire) return
          appliquer(ex, c, garde.e, garde.v)
          expliquerApres(ex, c, garde.cran ?? 0)
        }

        /**
         * Un essai de la tentative : pas d'échelle d'aide (rien ne s'aide avant l'explication). Déjà répondu,
         * il reste fini ; « Je ne sais pas », que le gabarit ajoute, arrive ici en fiche:essai-passe.
         */
        function monterEssai(ex, c) {
          if (traces['essai:' + ex.dataset.id]) {
            ex.dataset.fini = 'oui'
            c.bloquer?.()
            return
          }
          ex.addEventListener('fiche:essai-passe', () => {
            if (!fini(ex)) essayer(ex, c, { ok: false })
          })
        }

        /**
         * Pas à pas : dans un écran, ce qui suit un exercice pas encore fini attend qu'il le soit (une
         * question à la fois, règle I01). Un groupe d'exercices compte pour une question.
         */
        function devoiler(ecran) {
          if (!ecran) return
          let attendre = false
          for (const enfant of Array.from(ecran.children)) {
            if (attendre) {
              enfant.dataset.attente = ''
              continue
            }
            delete enfant.dataset.attente
            const exercices = enfant.matches('.ex[data-id]') ? [enfant] : $$('.ex[data-id]', enfant)
            if (exercices.some((ex) => !fini(ex) || ex.dataset.reprise === 'oui')) attendre = true
          }
        }

        function pari(n) {
          const cle = n.dataset.cle || 'pari'
          const items = $$('.options > li', n)
          const message = el('p', { class: 'retour', 'aria-live': 'polite' })
          n.append(message)
          const choisir = (option, garder) => {
            items.forEach((li) =>
              $('button', li).setAttribute('aria-pressed', String(li.dataset.option === option)),
            )
            message.textContent = fr(n.dataset.apres || '')
            if (garder) tracer(cle, option)
          }
          items.forEach((li) => {
            const b = el('button', { type: 'button' })
            b.append(...li.childNodes)
            li.append(b)
            b.addEventListener('click', () => choisir(li.dataset.option, true))
          })
          if (typeof traces[cle] === 'string') choisir(traces[cle], false)
        }

        /** La correction du pari : les deux réponses rappelées, sous le schéma refait. */
        function bilanPari(n) {
          const libelles = Object.fromEntries(
            (n.dataset.options || '').split('|').map((x) => x.split('=')),
          )
          const peindre = () => {
            const dits = []
            if (libelles[traces.pari])
              dits.push('Au début, tu avais répondu : « ' + libelles[traces.pari] + ' ».')
            if (libelles[traces['pari-fin']])
              dits.push(
                'Avant le schéma, tu as répondu : « ' + libelles[traces['pari-fin']] + ' ».',
              )
            n.hidden = !dits.length
            n.textContent = fr(dits.join(' '))
          }
          peindre()
          document.addEventListener('fiche:trace', peindre)
        }

        /** Le rappel du pari, au-dessus de la question qui le reprend. */
        function rappelPari(n) {
          const choisi = traces.pari
          const ex = n.closest('.ex')
          const option =
            typeof choisi === 'string' ? $('li[data-option="' + choisi + '"]', ex) : null
          if (!option) return
          n.hidden = false
          n.textContent = fr('Au début, tu avais répondu : « ' + option.textContent.trim() + ' »')
        }

        // --- Les outils propres au bloc.

        /**
         * Classer : chaque élément (une ligne) va dans l'une des deux colonnes, par un bouton par
         * colonne (`data-colonnes` : « cle=Libellé|cle=Libellé »). La réponse attendue :
         * `data-reponse` « C=fichier,Java=fichier,… ». Les lignes sont les <li> de `.a-classer`
         * (`data-element`, et `data-retour` pour la ligne mal classée, `data-erreur` quand c'est une
         * erreur critique) ; sans liste, elles viennent de `data-elements` (« C|Java ») et
         * `data-retours` (« C=…|Java=… »), pour l'autre cas d'une variante. « Vérifier » attend que
         * chaque ligne soit classée ; une ligne fausse donne son retour, et compte pour une réponse
         * fausse ; l'échelle d'aide est celle du gabarit (data-aide1, data-aide2).
         */
        /** Les éléments d'un autre cas : « cle~texte|cle~texte » (sans ~, la clé est le texte). */
        const elementsDe = (s) =>
          (s || '')
            .split('|')
            .filter(Boolean)
            .map((x) => {
              const k = x.indexOf('~')
              return k < 0 ? [x, x] : [x.slice(0, k), x.slice(k + 1)]
            })
        function classer(ex) {
          const d = ex.dataset
          const colonnes = (d.colonnes || '').split('|').map((x) => x.split('='))
          const attendu = Object.fromEntries((d.reponse || '').split(',').map((x) => x.split('=')))
          let liste = $('.a-classer', ex)
          if (!liste) {
            const retours = Object.fromEntries(
              (d.retours || '').split('|').map((x) => x.split('=')),
            )
            liste = el(
              'ul',
              { class: 'a-classer' },
              ...elementsDe(d.elements).map(([nom, texte]) =>
                el('li', { 'data-element': nom, 'data-retour': retours[nom], text: texte }),
              ),
            )
            ex.append(liste)
          }
          const lignes = $$(':scope > li', liste).map((li) => {
            const nom = li.dataset.element
            const texte = li.textContent.trim().replace(/\s+/g, ' ')
            const titre = el('span', { class: 'contenu' })
            titre.append(...li.childNodes)
            const boutons = colonnes.map(([cle, libelle]) => {
              const b = el('button', {
                type: 'button',
                class: 'colonne',
                'data-cle': cle,
                'aria-pressed': 'false',
                'aria-label': texte + ' : ' + libelle,
                text: libelle,
              })
              b.addEventListener('click', () => {
                if (fini(ex)) return
                boutons.forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
              })
              return b
            })
            li.replaceChildren(titre, el('span', { class: 'colonnes' }, ...boutons))
            return { li, nom, texte, boutons, retour: li.dataset.retour, erreur: li.dataset.erreur }
          })
          const choisie = (L) =>
            L.boutons.find((b) => b.getAttribute('aria-pressed') === 'true')?.dataset.cle
          const poser = (L, cle, classe) =>
            L.boutons.forEach((b) => {
              b.setAttribute('aria-pressed', String(b.dataset.cle === cle))
              if (classe && b.dataset.cle === cle) b.classList.add(classe)
            })
          const libelle = (cle) => colonnes.find(([k]) => k === cle)?.[1] ?? cle
          const bouton = el('button', { type: 'button', class: 'bouton', text: 'Vérifier' })
          ex.append(el('div', { class: 'saisie' }, bouton))
          const c = {
            solution: () =>
              colonnes
                .map(([cle, lib]) => {
                  const noms = lignes.filter((L) => attendu[L.nom] === cle).map((L) => L.texte)
                  return noms.length ? noms.join(', ') + ' : ' + lib.toLowerCase() : ''
                })
                .filter(Boolean)
                .join(' ; '),
            remplir(etat, v) {
              const donne =
                etat === 'vu' || !v
                  ? attendu
                  : Object.fromEntries(v.split(',').map((x) => x.split('=')))
              lignes.forEach((L) => poser(L, donne[L.nom], etat === 'vu' ? 'montre' : 'choisi-bon'))
            },
            bloquer() {
              bouton.disabled = true
              lignes.forEach((L) => L.boutons.forEach((b) => (b.disabled = true)))
            },
          }
          bouton.addEventListener('click', () => {
            if (fini(ex)) return
            const manque = lignes.filter((L) => !choisie(L))
            if (manque.length)
              return void dire(
                ex,
                '',
                'Classe chaque ligne : il reste ' +
                  manque.map((L) => '« ' + L.texte + ' »').join(' ; ') +
                  '.',
              )
            const v = lignes.map((L) => L.nom + '=' + choisie(L)).join(',')
            const fausse = lignes.find((L) => choisie(L) !== attendu[L.nom])
            if (!fausse) return repondre(ex, c, { ok: true, v })
            lignes.forEach((L) => {
              if (choisie(L) !== attendu[L.nom]) {
                L.boutons.forEach((b) =>
                  b.classList.toggle('choisi-faux', b.dataset.cle === choisie(L)),
                )
              }
            })
            const m =
              (fausse.retour ||
                'Regarde « ' +
                  fausse.texte +
                  ' » : ' +
                  libelle(choisie(fausse)).toLowerCase() +
                  ', vraiment ?') +
              (lignes.filter((L) => choisie(L) !== attendu[L.nom]).length > 1
                ? ' D’autres lignes sont à revoir.'
                : '')
            repondre(ex, c, { ok: false, v, d: { m, e: fausse.erreur } })
          })
          return c
        }

        /**
         * Une chaîne à remettre dans l'ordre : les pièces (<li data-piece> de `.lignes-ordre`, ou
         * `data-pieces` « a : texte | b : texte » pour l'autre cas) se montent et se descendent avec
         * les flèches ; `data-reponse` « a,c,b » est l'ordre juste ; `data-fixe`, une pièce déjà
         * placée en tête et bloquée. Le retour nomme la première place fausse et demande ce qui vient
         * juste après la pièce d'avant, sans la nommer.
         */
        function chaine(ex) {
          const d = ex.dataset
          let liste = $('.lignes-ordre', ex)
          if (!liste) {
            liste = el(
              'ol',
              { class: 'lignes-ordre' },
              ...(d.pieces || '').split('|').map((l) => {
                const [, id, texte] = /^\s*(\w+)\s*:\s*(.+?)\s*$/.exec(l) ?? []
                return el('li', { 'data-piece': id, text: texte })
              }),
            )
            ex.append(liste)
          }
          const pieces = $$(':scope > li', liste).map((li) => ({
            li,
            id: li.dataset.piece,
            texte: li.textContent.trim(),
          }))
          const fixee = pieces.find((P) => P.id === d.fixe)
          let ordre = fixee
            ? [fixee, ...melanger(pieces.filter((P) => P !== fixee))]
            : melanger(pieces)
          for (const P of pieces) {
            P.haut = el('button', {
              type: 'button',
              class: 'bouton secondaire petit',
              'aria-label': 'Monter « ' + P.texte + ' »',
              text: '↑',
            })
            P.bas = el('button', {
              type: 'button',
              class: 'bouton secondaire petit',
              'aria-label': 'Descendre « ' + P.texte + ' »',
              text: '↓',
            })
            P.li.replaceChildren(
              el('span', { class: 'contenu', text: P.texte }),
              el('span', { class: 'fleches' }, P.haut, P.bas),
            )
            P.haut.addEventListener('click', () => bouger(P, -1))
            P.bas.addEventListener('click', () => bouger(P, 1))
          }
          function peindre() {
            ordre.forEach((P, k) => {
              liste.append(P.li)
              P.haut.disabled = fini(ex) || k <= (fixee ? 1 : 0) || P === fixee
              P.bas.disabled = fini(ex) || k === ordre.length - 1 || P === fixee
              P.li.classList.toggle('placee', P === fixee)
            })
          }
          function bouger(P, sens) {
            if (fini(ex)) return
            const k = ordre.indexOf(P)
            const l = k + sens
            if (P === fixee || ordre[l] === fixee || l < 0 || l >= ordre.length) return
            ;[ordre[k], ordre[l]] = [ordre[l], ordre[k]]
            peindre()
            const cible = sens < 0 ? P.haut : P.bas
            ;(cible.disabled ? (sens < 0 ? P.bas : P.haut) : cible).focus()
          }
          const bonOrdre = () => d.reponse.split(',').map((id) => pieces.find((P) => P.id === id))
          const bouton = el('button', { type: 'button', class: 'bouton', text: 'Vérifier' })
          ex.append(el('div', { class: 'saisie' }, bouton))
          const c = {
            solution: () =>
              bonOrdre()
                .map((P) => P.texte)
                .join(', puis '),
            remplir(etat, v) {
              const ids = (etat === 'vu' || !v ? d.reponse : v).split(',')
              ordre = ids.map((id) => pieces.find((P) => P.id === id)).filter(Boolean)
              if (ordre.length !== pieces.length) ordre = bonOrdre()
              peindre()
            },
            bloquer() {
              peindre()
              bouton.disabled = true
            },
          }
          bouton.addEventListener('click', () => {
            if (fini(ex)) return
            const v = ordre.map((P) => P.id).join(',')
            const bon = bonOrdre()
            const k = ordre.findIndex((P, i) => P !== bon[i])
            if (k === -1)
              return repondre(ex, c, { ok: true, v, m: 'Juste : la chaîne est dans l’ordre.' })
            // L'erreur critique (`data-erreur`) n'est marquée que si l'ordre la commet : une pièce de
            // `data-erreur-avant` « x,y|x,z » placée avant l'autre.
            const place = (id) => ordre.findIndex((P) => P.id === id)
            const commise = (d.erreurAvant || '')
              .split('|')
              .filter(Boolean)
              .some((paire) => {
                const [x, y] = paire.split(',')
                return place(x) >= 0 && place(y) >= 0 && place(x) < place(y)
              })
            // L'erreur critique commise a son retour écrit (`data-retour-erreur`), qui nomme le modèle.
            const m =
              commise && d.retourErreur
                ? d.retourErreur
                : k === 0
                  ? 'Qu’est-ce qui vient en premier, avant tout le reste ?'
                  : 'Après « ' +
                    ordre[k - 1].texte +
                    ' », tu as mis « ' +
                    ordre[k].texte +
                    ' ». Qu’est-ce qui vient juste après « ' +
                    ordre[k - 1].texte +
                    ' » ?'
            repondre(ex, c, { ok: false, v, d: { m, e: commise ? d.erreur : undefined } })
          })
          peindre()
          return c
        }

        /**
         * Apparier : chaque ligne (`.a-apparier > li[data-element]`) reçoit son rôle dans une liste
         * déroulante native (au clavier, au lecteur d'écran). `data-options` « cle=Libellé|cle=Libellé »,
         * `data-reponse` « SMTP=smtp,FTP=ftp ». Une ligne fausse donne son retour (`data-retour`) et,
         * si c'est une erreur critique, `data-erreur`. L'autre cas d'une variante du cours vient de
         * `data-elements` et `data-retours`, comme pour classer.
         */
        function apparier(ex) {
          const d = ex.dataset
          const options = (d.options || '').split('|').map((x) => x.split('='))
          const attendu = Object.fromEntries((d.reponse || '').split(',').map((x) => x.split('=')))
          let liste = $('.a-apparier', ex)
          if (!liste) {
            const retours = Object.fromEntries(
              (d.retours || '').split('|').map((x) => x.split('=')),
            )
            liste = el(
              'ul',
              { class: 'a-apparier' },
              ...elementsDe(d.elements).map(([nom, texte]) =>
                el('li', { 'data-element': nom, 'data-retour': retours[nom], text: texte }),
              ),
            )
            ex.append(liste)
          }
          const libelle = (cle) => options.find(([k]) => k === cle)?.[1] ?? cle
          const lignes = $$(':scope > li', liste).map((li) => {
            const nom = li.dataset.element
            const texte = li.textContent.trim().replace(/\s+/g, ' ')
            const titre = el('span', { class: 'contenu' })
            titre.append(...li.childNodes)
            const id = uid('role')
            const select = el('select', { id, 'aria-label': texte + ' : choisis la réponse' })
            select.append(
              el('option', { value: '', text: 'Choisis…' }),
              ...melanger(options).map(([cle, lib]) => el('option', { value: cle, text: lib })),
            )
            select.addEventListener('change', () => {
              li.classList.remove('choisi-faux')
            })
            li.replaceChildren(titre, select)
            return { li, nom, texte, select, retour: li.dataset.retour, erreur: li.dataset.erreur }
          })
          const bouton = el('button', { type: 'button', class: 'bouton', text: 'Vérifier' })
          ex.append(el('div', { class: 'saisie' }, bouton))
          const c = {
            solution: () =>
              lignes.map((L) => sansPoint(L.texte) + ' : ' + libelle(attendu[L.nom])).join(' ; '),
            remplir(etat, v) {
              const donne =
                etat === 'vu' || !v
                  ? attendu
                  : Object.fromEntries(v.split(',').map((x) => x.split('=')))
              lignes.forEach((L) => {
                L.select.value = donne[L.nom] ?? ''
                L.li.classList.remove('choisi-faux')
                L.li.classList.add(etat === 'vu' ? 'montre' : 'choisi-bon')
              })
            },
            bloquer() {
              bouton.disabled = true
              lignes.forEach((L) => (L.select.disabled = true))
            },
          }
          bouton.addEventListener('click', () => {
            if (fini(ex)) return
            const manque = lignes.filter((L) => !L.select.value)
            if (manque.length)
              return void dire(
                ex,
                '',
                'Choisis une réponse pour chaque ligne : il reste ' +
                  manque.map((L) => '« ' + L.texte + ' »').join(' ; ') +
                  '.',
              )
            const v = lignes.map((L) => L.nom + '=' + L.select.value).join(',')
            const fausses = lignes.filter((L) => L.select.value !== attendu[L.nom])
            if (!fausses.length) return repondre(ex, c, { ok: true, v })
            lignes.forEach((L) => L.li.classList.toggle('choisi-faux', fausses.includes(L)))
            const fausse = fausses[0]
            const m =
              (fausse.retour || 'Regarde « ' + fausse.texte + ' » : cette réponse, vraiment ?') +
              (fausses.length > 1 ? ' D’autres lignes sont à revoir.' : '')
            fausse.select.focus()
            repondre(ex, c, { ok: false, v, d: { m, e: fausse.erreur } })
          })
          return c
        }
        /**
         * Le système de la machine de l'apprenant (Windows ou macOS) : un choix gardé en trace (`os`),
         * qui cache partout dans la page ce qui ne le concerne pas (`[data-os="windows"]`,
         * `[data-os="macos"]`). Tant qu'il n'a pas choisi, tout se voit. Plusieurs boutons de choix
         * peuvent se trouver dans la page : ils se suivent.
         */
        const choixSysteme = []
        function appliquerSysteme() {
          const os = typeof traces.os === 'string' ? traces.os : ''
          for (const n of $$('#contenu [data-os]')) n.hidden = Boolean(os) && n.dataset.os !== os
          for (const { boutons } of choixSysteme)
            for (const b of boutons)
              b.setAttribute('aria-pressed', String(b.dataset.osChoix === os))
        }
        function systeme(n) {
          const boutons = [
            ['windows', 'Je suis sur Windows'],
            ['macos', 'Je suis sur macOS'],
          ].map(([cle, lib]) => {
            const b = el('button', {
              type: 'button',
              class: 'bouton secondaire petit',
              'data-os-choix': cle,
              'aria-pressed': 'false',
              text: lib,
            })
            b.addEventListener('click', () => {
              tracer('os', cle)
              appliquerSysteme()
            })
            return b
          })
          n.append(
            el('p', {
              class: 'discret',
              text: n.dataset.invite || 'Sur quel système travailles-tu ?',
            }),
            el('div', { class: 'rangee' }, ...boutons),
          )
          choixSysteme.push({ boutons })
          appliquerSysteme()
        }

        /**
         * Une seconde au ralenti (perception) : les moments de `.pas-donnees > li`, dévoilés un par un
         * par le bouton « Voir le moment suivant ». Le moment atteint est gardé (trace du `data-id`) ;
         * quand le dernier est vu, l'outil est fini, dit `data-apres` et laisse paraître la suite.
         */
        function deroule(n) {
          const pas = $$('.pas-donnees > li', n).map((li) =>
            li.textContent.trim().replace(/\s+/g, ' '),
          )
          const cle = n.dataset.id || 'deroule'
          let vus = Math.min(pas.length, Math.max(0, Number(traces[cle]) || 0))
          const liste = el('ol', { class: 'deroule-pas', 'aria-live': 'polite' })
          const suivant = el('button', {
            type: 'button',
            class: 'bouton',
            text: 'Voir le moment suivant',
          })
          const mot = el('p', { class: 'message-outil', 'aria-live': 'polite' })
          function peindre() {
            liste.replaceChildren(
              ...pas
                .slice(0, vus)
                .map((t, k) => el('li', { class: k === vus - 1 ? 'pas-actif' : '', text: t })),
            )
            suivant.hidden = vus >= pas.length
            suivant.textContent =
              vus === 0
                ? 'Voir le premier moment'
                : 'Voir le moment suivant (' + (vus + 1) + ' sur ' + pas.length + ')'
            // Avant chaque moment, une question fait anticiper le suivant, sans note (règle F01).
            if (vus > 0 && vus < pas.length)
              mot.textContent = 'Que se passe-t-il ensuite, à ton avis ? Pense-le, puis vérifie.'
            if (vus >= pas.length) {
              n.dataset.fini = 'oui'
              n.classList.add('ok')
              mot.textContent = fr(n.dataset.apres || '')
              devoiler(n.closest('.ecran, [data-ecran]'))
            }
          }
          suivant.addEventListener('click', () => {
            if (vus >= pas.length) return
            vus += 1
            tracer(cle, vus)
            peindre()
            if (vus < pas.length) suivant.focus()
          })
          n.append(liste, el('div', { class: 'rangee' }, suivant), mot)
          peindre()
        }

        /**
         * L'aisance (étape « Les codes, sans réfléchir ») : les six codes et les quatre familles, dans le
         * désordre, chacun avec ses sens à toucher (ou leur numéro au clavier, 1 à 6). Une série est
         * réussie avec 10 justes sur 10 en moins de la durée du palier, toute la série comprise. Il en
         * faut une par palier du manifeste, chacune un jour différent. Chaque série finie part au pont
         * (aisance.resultat). Les séries réussies que garde le serveur (`detail.aisance`) l'emportent
         * sur les traces quand elles en disent plus.
         */
        const SENS_CODES = [
          ['réussite', '200'],
          ['déplacée définitivement', '301'],
          ['accès refusé', '403'],
          ['ressource introuvable', '404'],
          ['erreur interne du serveur', '500'],
          ['service momentanément indisponible', '503'],
        ]
        const SENS_FAMILLES = [
          ['réussite', '2xx'],
          ['redirection', '3xx'],
          ['erreur côté client', '4xx'],
          ['erreur côté serveur', '5xx'],
        ]
        const QUESTIONS_AISANCE = [
          ...SENS_CODES.map(([sens, code]) => ({ code, sens, choix: SENS_CODES.map((x) => x[0]) })),
          ...SENS_FAMILLES.map(([sens, code]) => ({
            code,
            sens,
            choix: SENS_FAMILLES.map((x) => x[0]),
          })),
        ]
        const N_AISANCE = QUESTIONS_AISANCE.length
        const PALIERS = JSON.parse(document.getElementById('bloc-manifest').textContent).aisance
          .paliers_s
        const nombreFr = (x) => String(x).replace('.', ',')
        function dateCourte(cle) {
          const [a, m, j] = cle.split('-').map(Number)
          return new Date(a, m - 1, j).toLocaleDateString('fr-FR', {
            day: 'numeric',
            month: 'long',
          })
        }
        /** Les séries réussies relues dans ce que garde le serveur, avec la même règle : une par jour. */
        function reussisDuServeur() {
          const reussis = []
          for (const serie of aisanceServeur) {
            if (reussis.length >= PALIERS.length) break
            const jour = jourCle(new Date(serie.le))
            if (!(serie.duree_s < PALIERS[reussis.length])) continue
            if (reussis.at(-1)?.jour === jour) continue
            reussis.push({ jour })
          }
          return reussis
        }
        function aisance(n) {
          const locaux = Array.isArray(traces.vitesse)
            ? traces.vitesse.filter((x) => x && typeof x.jour === 'string')
            : []
          const duServeur = reussisDuServeur()
          const reussis = duServeur.length > locaux.length ? duServeur : locaux
          const liste = el('ol', { class: 'niveaux' })
          const info = el('p', { class: 'discret' })
          const zone = el('div', { class: 'zone-vitesse' })
          const lancer = el('button', { type: 'button', class: 'bouton', text: 'Lancer une série' })
          const aujourdhui = () => reussis.some((x) => x.jour === jourCle())
          const limite = () => PALIERS[Math.min(reussis.length, PALIERS.length - 1)]
          let duree = limite()
          function majInfo() {
            liste.replaceChildren(
              ...PALIERS.map((_, k) => {
                const r = reussis[k]
                return el(
                  'li',
                  { class: r ? 'reussi' : k === reussis.length ? 'courant' : '' },
                  el('span', { text: 'Série réussie ' + (k + 1) }),
                  el('span', {
                    class: 'etat ' + (r ? 'solide' : 'attente'),
                    text: r
                      ? 'le ' + dateCourte(r.jour)
                      : k === reussis.length
                        ? 'à réussir'
                        : 'un autre jour',
                  }),
                )
              }),
            )
            if (reussis.length >= PALIERS.length)
              info.textContent = fr(
                'Tes ' +
                  PALIERS.length +
                  ' séries réussies, chacune un jour différent : les codes sont acquis. Tu peux continuer à t’entraîner.',
              )
            else if (aujourdhui())
              info.textContent = fr(
                'Série réussie aujourd’hui. La suivante compte à partir de demain : d’ici là, tes séries servent d’entraînement.',
              )
            else
              info.textContent = fr(
                'Ta prochaine série compte si elle est réussie : ' +
                  N_AISANCE +
                  ' justes sur ' +
                  N_AISANCE +
                  ', en moins de ' +
                  limite() +
                  ' secondes.',
              )
          }
          let serie = []
          let reponses = []
          let debut = 0
          let minuteur = null
          let enCours = false
          let compte = false
          let boutons = []
          const barre = el('span')
          const chrono = el('span', { class: 'chrono', 'aria-hidden': 'true' }, barre)
          const question = el('div', { class: 'question-vitesse' })
          n.addEventListener('keydown', (e) => {
            if (!enCours || e.altKey || e.ctrlKey || e.metaKey) return
            const k = Number(e.key)
            if (Number.isInteger(k) && k >= 1 && k <= boutons.length) {
              e.preventDefault()
              choisir(boutons[k - 1].dataset.sens)
            }
          })
          function poser() {
            const Q = serie[reponses.length]
            boutons = Q.choix.map((sens, k) => {
              const b = el('button', {
                type: 'button',
                class: 'bouton secondaire',
                'data-sens': sens,
                text: k + 1 + '. ' + sens,
              })
              b.addEventListener('click', () => choisir(sens))
              return b
            })
            question.replaceChildren(
              el('p', {
                class: 'discret',
                text: 'Question ' + (reponses.length + 1) + ' sur ' + N_AISANCE,
              }),
              el('p', { class: 'q mono grande', text: Q.code }),
              el('div', { class: 'sens-vitesse' }, ...boutons),
              el('p', {
                class: 'discret',
                text: 'Au clavier : le numéro du sens, de 1 à ' + boutons.length + '.',
              }),
            )
            boutons[0].focus()
          }
          function choisir(sens) {
            if (!enCours) return
            reponses.push(sens)
            if (reponses.length === N_AISANCE) return finir(false)
            poser()
          }
          function finir(ecoule) {
            enCours = false
            clearInterval(minuteur)
            const t = (performance.now() - debut) / 1000
            const s = nombreFr(Math.round(t * 10) / 10)
            const justes = reponses.filter((r, i) => r === serie[i].sens).length
            const reussie = !ecoule && justes === N_AISANCE && t < duree
            window.JanusPont?.envoyer('aisance.resultat', {
              reussi: reussie,
              duree_s: Math.round(Math.min(t, 600) * 10) / 10,
            })
            let texteFin
            if (reussie && compte) {
              reussis.push({ jour: jourCle() })
              tracer('vitesse', reussis.slice())
              texteFin =
                'Série réussie : ' +
                N_AISANCE +
                ' sur ' +
                N_AISANCE +
                ' en ' +
                s +
                ' s. ' +
                'Elle compte : ' +
                reussis.length +
                ' sur ' +
                PALIERS.length +
                ', un jour différent chacune.'
            } else if (reussie)
              texteFin =
                'Série réussie : ' +
                N_AISANCE +
                ' sur ' +
                N_AISANCE +
                ' en ' +
                s +
                ' s. Elle compte comme entraînement.'
            else if (ecoule)
              texteFin =
                'Temps écoulé : ' +
                reponses.length +
                ' réponses sur ' +
                N_AISANCE +
                ', ' +
                justes +
                ' justes. Refais-en une.'
            else if (justes === N_AISANCE)
              texteFin =
                N_AISANCE +
                ' sur ' +
                N_AISANCE +
                ', mais en ' +
                s +
                ' s : il faut moins de ' +
                duree +
                ' secondes. Refais-en une.'
            else
              texteFin =
                justes +
                ' sur ' +
                N_AISANCE +
                ', en ' +
                s +
                ' s. Une série se réussit avec ' +
                N_AISANCE +
                ' justes sur ' +
                N_AISANCE +
                ' : refais-en une.'
            const fautes = serie
              .map((Q, i) => ({ Q, r: reponses[i] }))
              .filter((x) => x.r !== undefined && x.r !== x.Q.sens)
            question.replaceChildren(
              el('p', { class: reussie ? 'retour bon' : 'retour', text: texteFin }),
              ...(fautes.length
                ? [
                    el(
                      'ul',
                      { class: 'fautes-vitesse' },
                      ...fautes.map((x) =>
                        el('li', { text: x.Q.code + ' : ' + x.Q.sens + ', pas « ' + x.r + ' ».' }),
                      ),
                    ),
                  ]
                : []),
            )
            boutons = []
            chrono.hidden = true
            lancer.hidden = false
            lancer.focus()
            majInfo()
          }
          lancer.addEventListener('click', () => {
            serie = melanger(QUESTIONS_AISANCE)
            reponses = []
            compte = reussis.length < PALIERS.length && !aujourdhui()
            duree = limite()
            lancer.hidden = true
            chrono.hidden = false
            barre.style.transform = 'scaleX(1)'
            enCours = true
            debut = performance.now()
            poser()
            minuteur = setInterval(() => {
              if (!n.isConnected) return void clearInterval(minuteur)
              const t = (performance.now() - debut) / 1000
              barre.style.transform = 'scaleX(' + Math.max(0, 1 - t / duree) + ')'
              if (t >= duree && enCours) finir(true)
            }, 100)
          })
          chrono.hidden = true
          zone.append(chrono, question)
          n.append(liste, info, zone, el('div', { class: 'rangee' }, lancer))
          majInfo()
        }

        /**
         * Un nombre à écrire (`data-reponse`, décimale avec virgule ou point, `data-unite`). Une valeur
         * piégée (`data-pieges` « 100=retour|800=retour ») a son retour, et `data-erreur-pieges` dit
         * l'erreur critique qu'elle commet. Un champ vide n'est pas une réponse.
         */
        TYPES.nombre = function nombre(ex) {
          const d = ex.dataset
          const lire = (s) => Number(String(s).trim().replace(/\s/g, '').replace(',', '.'))
          const attendu = lire(d.reponse)
          const pieges = (d.pieges || '')
            .split('|')
            .filter(Boolean)
            .map((x) => {
              const k = x.indexOf('=')
              return { valeur: lire(x.slice(0, k)), retour: x.slice(k + 1) }
            })
          const id = uid('nb')
          const champ = el('input', {
            type: 'text',
            id,
            inputmode: 'decimal',
            autocomplete: 'off',
            'aria-label': d.etiquette || 'Ta réponse en ' + (d.unite || 'nombre'),
          })
          const bouton = el('button', { type: 'button', class: 'bouton', text: 'Vérifier' })
          ex.append(
            el(
              'div',
              { class: 'saisie' },
              champ,
              el('span', { class: 'discret', text: d.unite || '' }),
              bouton,
            ),
          )
          const c = {
            solution: () => d.reponse + ' ' + (d.unite || ''),
            remplir(etat, v) {
              champ.value = etat === 'vu' || !v ? d.reponse : v
            },
            bloquer() {
              champ.disabled = true
              bouton.disabled = true
            },
          }
          const verifier = () => {
            if (fini(ex)) return
            const brut = champ.value.trim()
            if (!brut) return void dire(ex, '', 'Écris un nombre avant de vérifier.')
            const n = lire(brut)
            if (!Number.isFinite(n)) return void dire(ex, '', 'Écris un nombre, par exemple 12,5.')
            if (Math.abs(n - attendu) < 1e-9) return repondre(ex, c, { ok: true, v: brut })
            const piege = pieges.find((p) => Math.abs(p.valeur - n) < 1e-9)
            repondre(ex, c, {
              ok: false,
              v: brut,
              d: {
                m: piege?.retour || d.sinon || 'Pas encore. Réessaie.',
                e: piege ? d.erreurPieges : undefined,
              },
            })
          }
          bouton.addEventListener('click', verifier)
          champ.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') verifier()
          })
          return c
        }

        /**
         * Relever dans une sortie de terminal fournie : les lignes de `.sortie` (`<span data-l>` ; un
         * `data-retour` oriente quand la ligne est mal choisie, `data-erreur` quand c'est une erreur
         * critique) deviennent des boutons. L'apprenant choisit une information à relever
         * (`data-cibles` « ip=Libellé|masque=Libellé »), puis la ligne qui la donne ; la même ligne peut
         * servir à deux informations. `data-reponse` « ip=a3,masque=a3 », `data-valeurs` « ip=192…|… »
         * pour la solution. « Vérifier » attend que chaque information ait sa ligne.
         */
        TYPES.releve = function releve(ex) {
          const d = ex.dataset
          const cibles = (d.cibles || '').split('|').map((x) => {
            const k = x.indexOf('=')
            return { cle: x.slice(0, k), lib: x.slice(k + 1) }
          })
          const attendu = Object.fromEntries((d.reponse || '').split(',').map((x) => x.split('=')))
          const valeurs = Object.fromEntries(
            (d.valeurs || '').split('|').map((x) => {
              const k = x.indexOf('=')
              return [x.slice(0, k), x.slice(k + 1)]
            }),
          )
          const sortie = $('.sortie', ex)
          const lignes = $$('[data-l]', sortie).map((s) => ({
            id: s.dataset.l,
            texte: s.textContent,
            retour: s.dataset.retour,
            erreur: s.dataset.erreur,
          }))
          const choisies = {}
          let courante = cibles[0]?.cle
          const boutonsCibles = cibles.map((t) => {
            const b = el('button', {
              type: 'button',
              class: 'bouton secondaire petit cible',
              'aria-pressed': 'false',
            })
            b.addEventListener('click', () => {
              if (fini(ex)) return
              courante = t.cle
              peindre()
            })
            return b
          })
          const boutonsLignes = lignes.map((L) => {
            const b = el('button', { type: 'button', class: 'ligne', 'aria-pressed': 'false' })
            const texte = el('span', { class: 'texte' })
            texte.textContent = L.texte || ' '
            b.append(texte, el('span', { class: 'etiquette' }))
            b.addEventListener('click', () => {
              if (fini(ex) || !courante) return
              choisies[courante] = L.id
              const suivante = cibles.find((t) => !choisies[t.cle])
              if (suivante) courante = suivante.cle
              peindre()
            })
            return b
          })
          const verifier = el('button', { type: 'button', class: 'bouton', text: 'Vérifier' })
          const pre = el('div', {
            class: 'lignes-sortie',
            role: 'group',
            'aria-label': sortie.getAttribute('aria-label') || 'Sortie du terminal',
          })
          for (const fils of $$(':scope > span', sortie)) {
            if (fils.dataset.l)
              pre.append(boutonsLignes[lignes.findIndex((L) => L.id === fils.dataset.l)])
            else pre.append(el('span', { class: 'vide' }))
          }
          sortie.replaceChildren(pre)
          const barre = el(
            'div',
            { class: 'rangee cibles', role: 'group', 'aria-label': 'Ce que tu relèves' },
            ...boutonsCibles,
          )
          sortie.before(
            el('p', {
              class: 'discret',
              text: 'Touche une information, puis la ligne qui la donne.',
            }),
            barre,
          )
          ex.append(el('div', { class: 'saisie' }, verifier))
          function peindre() {
            cibles.forEach((t, i) => {
              const L = lignes.find((x) => x.id === choisies[t.cle])
              boutonsCibles[i].textContent = fr(t.lib + ' : ' + (L ? 'choisie' : 'à choisir'))
              boutonsCibles[i].setAttribute('aria-pressed', String(t.cle === courante && !fini(ex)))
            })
            lignes.forEach((L, i) => {
              const quoi = cibles.filter((t) => choisies[t.cle] === L.id).map((t) => t.lib)
              boutonsLignes[i].setAttribute('aria-pressed', String(quoi.length > 0))
              boutonsLignes[i].lastChild.textContent = fr(quoi.length ? quoi.join(' · ') : '')
              boutonsLignes[i].setAttribute(
                'aria-label',
                (L.texte.trim() || 'ligne vide') +
                  (quoi.length ? ' (choisie pour : ' + quoi.join(', ') + ')' : ''),
              )
            })
          }
          const c = {
            solution: () => cibles.map((t) => t.lib + ' : ' + (valeurs[t.cle] ?? '')).join(' ; '),
            remplir(etat, v) {
              const donne =
                etat === 'vu' || !v
                  ? attendu
                  : Object.fromEntries(v.split(',').map((x) => x.split('=')))
              for (const t of cibles) choisies[t.cle] = donne[t.cle]
              peindre()
              boutonsLignes.forEach((b, i) => {
                const juste = cibles.some(
                  (t) => attendu[t.cle] === lignes[i].id && choisies[t.cle] === lignes[i].id,
                )
                b.classList.toggle(etat === 'vu' ? 'montre' : 'choisi-bon', juste)
              })
            },
            bloquer() {
              verifier.disabled = true
              boutonsCibles.forEach((b) => (b.disabled = true))
              boutonsLignes.forEach((b) => (b.disabled = true))
              peindre()
            },
          }
          verifier.addEventListener('click', () => {
            if (fini(ex)) return
            const manque = cibles.filter((t) => !choisies[t.cle])
            if (manque.length)
              return void dire(
                ex,
                '',
                'Choisis une ligne pour chaque information : il reste ' +
                  manque.map((t) => t.lib).join(', ') +
                  '.',
              )
            const v = cibles.map((t) => t.cle + '=' + choisies[t.cle]).join(',')
            const fausses = cibles.filter((t) => choisies[t.cle] !== attendu[t.cle])
            boutonsLignes.forEach((b) => b.classList.remove('choisi-faux'))
            if (!fausses.length) return repondre(ex, c, { ok: true, v })
            for (const t of fausses) {
              const i = lignes.findIndex((L) => L.id === choisies[t.cle])
              if (i >= 0) boutonsLignes[i].classList.add('choisi-faux')
            }
            const t = fausses[0]
            const L = lignes.find((x) => x.id === choisies[t.cle])
            courante = t.cle
            peindre()
            const m =
              (L?.retour ||
                'Regarde la ligne que tu as choisie pour « ' + t.lib + ' » : est-ce la bonne ?') +
              (fausses.length > 1 ? ' D’autres informations sont à revoir.' : '')
            repondre(ex, c, { ok: false, v, d: { m, e: L?.erreur } })
          })
          peindre()
          return c
        }
        TYPES.classer = classer
        TYPES.apparier = apparier
        TYPES.chaine = chaine

        const OUTILS = {
          pari,
          'rappel-pari': rappelPari,
          'bilan-pari': bilanPari,
          systeme,
          deroule,
          aisance,
        }

        /**
         * Le cas de chaque item, celui que le gabarit donne (`cas` dans `detail.pratique`), relu des
         * résultats par la règle du moteur : après une solution vue ou une aide éloignée, l'autre cas
         * (la variante, `<template data-variante>`, ou l'énoncé d'origine si c'est la variante qui a été
         * aidée) ; un item réussi revient sur le cas réussi. La boîte le dit au gabarit (`data-cas`),
         * qui l'envoie avec chaque résultat. Sans variante, l'item garde son énoncé d'origine.
         */
        const montre = {}
        function poserLaVariante() {
          for (const boite of $$('#contenu .item[data-item]')) {
            const id = boite.dataset.item
            const variante = $('template[data-variante="' + id + '"]')
            const choix = variante && pratique[id]?.cas === 'variante' ? 'variante' : 'origine'
            if (choix === 'variante')
              $('.enonce', boite).replaceChildren(variante.content.cloneNode(true))
            montre[id] = choix
            boite.dataset.cas = choix
          }
        }

        const montes = new WeakSet()
        /** L'état des items de pratique que le gabarit a noté (réussi, aide, jour), à chaque rendu. */
        let pratique = {}
        document.addEventListener('fiche:rendu', (evenement) => {
          for (const [cle, val] of Object.entries(evenement.detail?.traces ?? {})) traces[cle] = val
          pratique = evenement.detail?.pratique ?? {}
          if (Array.isArray(evenement.detail?.aisance)) aisanceServeur = evenement.detail.aisance
          poserLaVariante()
          // Les outils d'abord (le système choisi, le pari), puis les exercices.
          for (const n of $$('#contenu [data-widget]')) {
            if (montes.has(n) || !OUTILS[n.dataset.widget]) continue
            montes.add(n)
            OUTILS[n.dataset.widget](n)
          }
          for (const n of $$('#contenu .ex[data-widget]')) {
            if (montes.has(n) || !TYPES[n.dataset.widget]) continue
            montes.add(n)

      function uuidV7() {

      function attenduEnMots(texte) {

      })

       * La tentative avant l'explication (règles C03 et M01) : dans une étape `pretest`, chaque exercice
       * `data-essai` (avec son `data-id`) émet `fiche:essai`, avec `detail: { cle, reponse, juste,
       * attendu, retour }`. La page garde la première réponse (trace `essai:<cle>`), l'envoie une fois à
       * l'appli (`pretest.reponse`), ne dit ni juste ni faux, et corrige toute la série à la fin de
       * l'étape, sous « Tes essais ». « Je ne sais pas » est une réponse : la page émet
       * `fiche:essai-passe` sur l'exercice, et l'outil y répond par `fiche:essai`, sa réponse attendue
       * avec ; sans outil qui réponde, la page lit l'attendu dans les attributs de l'exercice.
       */
      document.addEventListener('fiche:essai', (evenement) => {
        const { cle, reponse, juste, attendu, retour } = evenement.detail ?? {}
        if (typeof cle !== 'string' || cle === '' || etat.traces?.['essai:' + cle]) return
        noterEssai(cle, {
          reponse: typeof reponse === 'string' && reponse.trim() !== '' ? reponse.trim() : null,
          juste: juste === true,
          attendu: typeof attendu === 'string' ? attendu : '',
          retour: typeof retour === 'string' ? retour : '',
          vue: vueDeLEssai(evenement.target),
        })
      })
      /**
       * Ce que l'apprenant voyait en répondant, pour le lui remontrer au retour sur la page : la valeur
       * de chaque champ, et chaque bouton enfoncé (son rang et son texte, un bouton déplacé ne se
       * rallume pas à tort).
       */
      function vueDeLEssai(ex) {
        if (!(ex instanceof Element)) return undefined
        return {
          champs: Array.from(ex.querySelectorAll('input, textarea'), (c) => c.value),
          enfonces: Array.from(ex.querySelectorAll('button'))
            .map((b, k) => [k, b.textContent.trim(), b.getAttribute('aria-pressed')])
            .filter(([, , presse]) => presse === 'true')
            .map(([k, texte]) => [k, texte]),
        }
      }
      function remontrerEssai(ex, essai) {
        const vue = essai.vue
        if (vue) {
          const champs = ex.querySelectorAll('input, textarea')
          if (Array.isArray(vue.champs) && vue.champs.length === champs.length)
            champs.forEach((c, k) => {
              if (c.value === '' && typeof vue.champs[k] === 'string') c.value = vue.champs[k]
            })
          const boutons = ex.querySelectorAll('button')
          for (const [k, texte] of Array.isArray(vue.enfonces) ? vue.enfonces : [])
            if (boutons[k]?.textContent.trim() === texte)
              boutons[k].setAttribute('aria-pressed', 'true')
        }
        if (essai.reponse === null) return
        // Une option mélangée change de rang : elle se retrouve par son texte.
        for (const b of ex.querySelectorAll('.options button'))
          if (b.textContent.trim() === essai.reponse) b.setAttribute('aria-pressed', 'true')
        if (vue) return
        // Un essai noté avant que la page ne garde sa vue : son champ unique reprend la réponse.
        const champs = ex.querySelectorAll(
          'input:not([type]), input[type="text"], input[type="number"], textarea',
        )
        if (champs.length === 1 && champs[0].value === '') champs[0].value = essai.reponse
      }
      function noterEssai(cle, essai) {
        etat.traces = { ...(etat.traces ?? {}), ['essai:' + cle]: { ...essai, le: aujourdhui() } }
        pont.envoyer('pretest.reponse', {
          question: cle,
          reponse: (essai.reponse ?? 'Je ne sais pas').slice(0, 2000),
        })
        enregistrer()
        majEssais()
        rappelerEssais($('contenu'))
      }
      /**
       * Une explication qui part des essais (règle C03) : `data-essai-rappel="c2"` affiche la réponse
       * notée à l'essai c2 (son texte reste tant qu'il n'y en a pas) ; `data-si-essai="c2:faux"` ne
       * montre l'élément que si l'essai c2 est dans cet état : `juste`, `faux`, `passe` (« Je ne sais
       * pas ») ou `absent` (pas encore fait), plusieurs séparés par `|`.
       */
      function rappelerEssais(racine) {
        for (const el of racine.querySelectorAll('[data-essai-rappel]')) {
          const essai = etat.traces?.['essai:' + el.dataset.essaiRappel]
          if (essai?.reponse) el.textContent = entreGuillemets(essai.reponse)
        }
        for (const el of racine.querySelectorAll('[data-si-essai]')) {
          const [cle, etats = ''] = el.dataset.siEssai.split(':')
          const essai = etat.traces?.['essai:' + cle]
          const etatEssai = !essai
            ? 'absent'
            : essai.reponse === null
              ? 'passe'
              : essai.juste
                ? 'juste'
                : 'faux'
          el.hidden = !etats.split('|').includes(etatEssai)
        }
      }
      /** Ce qu'un exercice attend, quand aucun outil ne le dit : l'option juste, la solution, la réponse. */
      function attenduEcrit(ex) {
        const juste = ex.dataset.reponse
        const option = juste
          ? Array.from(ex.querySelectorAll('[data-option]')).find((o) => o.dataset.option === juste)
          : undefined
        return (option?.textContent ?? ex.dataset.solution ?? juste ?? '')
          .replace(/\s+/g, ' ')
          .trim()
      }
      /** Une réponse citée : sans point final, et sans doubler des guillemets qu'elle porte déjà. */
      function entreGuillemets(texte) {
        const t = texte.replace(/[.;\s]+$/, '')
        return /^«.*»$/.test(t) ? t : '« ' + t + ' »'
      }
      /** L'énoncé d'un essai, avec la question de son groupe quand il en fait partie (« 1 lampe »). */
      function enonceEssai(ex) {
        const propre = ex.querySelector('.q')?.textContent ?? ''
        const groupe = ex.closest('.groupe')?.querySelector(':scope > .q')?.textContent
        return ((groupe ? groupe + ' ' : '') + propre).replace(/\s+/g, ' ').trim()
      }
      function essaisDe(section) {
        const exercices = Array.from(section.querySelectorAll('[data-essai][data-id]'))
        const essais = exercices.map((ex) => etat.traces?.['essai:' + ex.dataset.id])
        exercices.forEach((ex, k) => {
          const essai = essais[k]
          const passer = ex.querySelector(':scope > .essai-passe')
          // Un essai ne se vérifie pas sur le moment : son bouton dit ce qu'il fait, il garde la réponse.
          for (const b of ex.querySelectorAll('button'))
            if (b.textContent.trim() === 'Vérifier') b.textContent = 'Enregistrer'
          if (!essai) {
            if (passer) return
            const bouton = creer('button', {
              type: 'button',
              className: 'bouton secondaire petit',
              textContent: 'Je ne sais pas',
              onclick: () => {
                const cle = ex.dataset.id
                ex.dispatchEvent(new CustomEvent('fiche:essai-passe'))
                if (!etat.traces?.['essai:' + cle])
                  noterEssai(cle, {
                    reponse: null,
                    juste: false,
                    attendu: attenduEcrit(ex),
                    retour: ex.dataset.explication ?? '',
                  })
              },
            })
            ex.append(creer('div', { className: 'actions essai-passe' }, bouton))
            return
          }
          passer?.remove()
          for (const champ of ex.querySelectorAll('input, button, select, textarea'))
            champ.disabled = true
          // La réponse reste visible, même après un rechargement.
          remontrerEssai(ex, essai)
          const note =
            ex.querySelector(':scope > .essai-note') ??
            ex.appendChild(creer('p', { className: 'discret essai-note', 'aria-live': 'polite' }))
          note.textContent =
            (essai.reponse === null
              ? 'Noté : tu ne sais pas encore.'
              : 'Noté : ' + entreGuillemets(essai.reponse) + '.') +
            ' La correction vient à la fin de l’étape.'
        })
        const ecrans = section.querySelectorAll('.ecran')
        const bilan =
          section.querySelector('.essais-bilan') ??
          (ecrans[ecrans.length - 1] ?? section).appendChild(
            creer('div', { className: 'essais-bilan', hidden: true }),
          )
        const fini = exercices.length > 0 && essais.every(Boolean)
        bilan.hidden = !fini
        if (fini)
          bilan.replaceChildren(
            creer('h3', { textContent: 'Tes essais' }),
            creer('p', {
              textContent:
                'Voici ce que tu as répondu, et ce qui était attendu. Les étapes suivantes expliquent pourquoi, à partir de tes réponses.',
            }),
            creer(
              'ol',
              {},
              ...exercices.map((ex, k) => {
                const essai = essais[k]
                const fin = (texte) => String(texte).replace(/[.;\s]+$/, '') + '.'
                // Juste, faux ou passé se voit d'un coup d'œil : une marque écrite et sa couleur.
                const etatEssai = essai.reponse === null ? 'passe' : essai.juste ? 'juste' : 'faux'
                const ligne = (libelle, texte) =>
                  creer(
                    'p',
                    {},
                    creer('span', { className: 'essai-libelle', textContent: libelle }),
                    texte,
                  )
                return creer(
                  'li',
                  { dataset: { etat: etatEssai } },
                  creer('span', {
                    className: 'essai-marque',
                    textContent: { juste: '✓ Juste', faux: '✗ Pas juste', passe: '? À découvrir' }[
                      etatEssai
                    ],
                  }),
                  creer('p', {}, creer('strong', { textContent: enonceEssai(ex) })),
                  // Les lignes que l'essai faisait lire (un pseudo-code) reviennent avec lui : le bilan
                  // se lit sans remonter à l'écran de l'essai (B02 v33, le thermostat).
                  ...Array.from(ex.querySelectorAll(':scope > pre'), (pre) => pre.cloneNode(true)),
                  // Sans réponse, pas de solution à garder sans l'avoir comprise (règle F04) :
                  // l'étape suivante l'explique, à partir des réponses de la série.
                  ...(essai.reponse === null
                    ? [
                        creer('p', {
                          textContent: 'Tu ne savais pas : les étapes suivantes te l’apprennent.',
                        }),
                      ]
                    : [
                        ligne('Ta réponse : ', fin(essai.reponse)),
                        ...(essai.juste || essai.attendu === ''
                          ? []
                          : [ligne('Attendu : ', fin(essai.attendu))]),
                        ...(essai.retour
                          ? [creer('p', { className: 'discret', textContent: essai.retour })]
                          : []),
                      ]),
                )
              }),
            ),
          )
        majPied()
      }
      /**
       * Une erreur critique repérée, par le correcteur dans une réponse ou par un outil : elle reste
       * connue après un rechargement, et le bilan suivant la coche d'office (`aCocher`) sans que
       * l'apprenant puisse la décocher (règle V01). `cle` dit où : l'identifiant de la question, ou
       * « outil: » suivi de l'endroit que l'outil nomme.
       */
      function noterReperees(cle, ids) {
        if (ids.length === 0) return
        const deja = etat.erreurs?.[cle] ?? []
        etat.erreurs = { ...(etat.erreurs ?? {}), [cle]: [...new Set([...deja, ...ids])] }
        etat.aCocher = [...new Set([...(etat.aCocher ?? []), ...ids])]
        enregistrer()
      }
      /**
       * Une réponse nouvelle à une question remplace ce que la précédente avait fait repérer : ces
       * erreurs ne sont plus cochées d'office, sauf si une autre réponse ou un outil les a aussi
       * repérées. Sans cela, une erreur refermée par la nouvelle réponse resterait cochée et
       * verrouillée dans le bilan, et l'envoyer la rouvrirait.
       */
      function remplacerReperees(question) {
        etat.erreurs = { ...(etat.erreurs ?? {}), [question]: [] }
        const encore = new Set(Object.values(etat.erreurs).flat())
        etat.aCocher = (etat.aCocher ?? []).filter((id) => encore.has(id))
      }
      /**
       * Amine a rejeté une erreur que le correcteur avait repérée dans la réponse à une question : le
       * bilan ne la coche plus d'office, sauf si une autre réponse ou un outil l'a aussi repérée.
       */
      function retirerReperee(question, erreur) {
        const deja = etat.erreurs?.[question] ?? []
        if (!deja.includes(erreur)) return false
        etat.erreurs = { ...etat.erreurs, [question]: deja.filter((id) => id !== erreur) }
        if (!Object.values(etat.erreurs).some((ids) => ids.includes(erreur)))
          etat.aCocher = (etat.aCocher ?? []).filter((id) => id !== erreur)
        enregistrer()
        return true
      }
      /**
       * Un outil qui reconnaît une erreur critique dans une réponse (des bits lus à l'envers, un départ
       * de 256) émet sur son élément `fiche:erreur` (`bubbles: true`, `cancelable: true`, `detail:
       * { erreur, ou }`). Dans l'appli, l'erreur part aussitôt au serveur (`erreur.reperee`), qui
       * l'ouvre : quitter la page sans envoyer le bilan ne la fait pas oublier (règle V01). Une fois
       * la restitution faite, l'erreur attend aussi le bilan : le gabarit annule l'événement, et
       * l'outil dit d'envoyer le bilan avant de continuer.
       */
      $('contenu').addEventListener('fiche:erreur', (evenement) => {
        const { erreur, ou } = evenement.detail ?? {}
        if (typeof ou !== 'string' || ou.trim() === '') return
        if (!manifeste.erreurs_critiques.some((e) => e.id === erreur)) return
        noterReperees('outil:' + ou, [erreur])
        if (mode === 'appli')
          pont.envoyer('erreur.reperee', { erreur, ou: ou.trim().slice(0, 200) })
        if (bilanAttendu()) evenement.preventDefault()
      })
      /**
       * L'étape affichée est vue : l'appli la coche. Pas une étape masquée par la restitution en cours,
       * dont l'apprenant ne lit que « Masqué » ; elle le sera quand elle se rouvrira.
       */
      function noterVue() {
        const etape = etapes.find((e) => e.id === etat.etape) ?? etapes[0]
        if (etape && !masquee(etape)) pont.envoyer('etape.vue', { etape: etape.id })
      }
      function aller(id) {
        etat.etape = id
        noterVue()
        enregistrer({ regrouper: true })
        afficher()
        remonter($('contenu'))
      }
      /**
       * Nouvel écran ou nouvelle étape : son haut revient à l'écran. Dans l'appli, la fiche ne défile
       * pas seule (l'iframe a la hauteur du contenu) : c'est l'appli qui remonte, si besoin.
       */
      function remonter(element) {
        if (mode === 'appli') pont.envoyer('page.haut', {})
        else element.scrollIntoView({ block: 'start' })
      }
      const pluriel = (nombre, singulier, plusieurs) =>
        nombre + ' ' + (nombre > 1 ? plusieurs : singulier)
      /** Le jour sur cet appareil, AAAA-MM-JJ : une solution vue ne compte plus le lendemain. */
      function aujourdhui() {
        const date = new Date()
        const deux = (nombre) => String(nombre).padStart(2, '0')
        return date.getFullYear() + '-' + deux(date.getMonth() + 1) + '-' + deux(date.getDate())
      }
      /** Le cas d'origine, la variante : ce que la page envoie avec un résultat. */
      const CAS = ['origine', 'variante']
      const idsPratique = () =>
        (manifeste.pratique ?? []).flatMap((exercice) => exercice.items.map((item) => item.id))
      /** Hors de l'appli, la page garde elle-même ses résultats et ses explications. */
      function pratiqueLocale() {
        const locale = etat.pratiqueLocale
        if (locale && Array.isArray(locale.resultats) && Array.isArray(locale.expliques))
          return locale
        etat.pratiqueLocale = { resultats: [], expliques: [] }
        return etat.pratiqueLocale
      }
      /** Les résultats de la pratique dans l'ordre : ceux du serveur, puis ceux qui l'attendent. */
      function essaisPratique() {
        if (pratiqueServeur === null) return pratiqueLocale().resultats
        const connus = new Set(pratiqueServeur.resultats.map((resultat) => resultat.id))
        return [
          ...pratiqueServeur.resultats,
          ...essaisEnAttente.filter((resultat) => !connus.has(resultat.id)),
        ]
      }
      /** Le jour de l'appli (son fuseau, son heure de bascule) ; hors de l'appli, celui de l'appareil. */
      const jourPratique = () => pratiqueServeur?.aujourdhui ?? aujourdhui()
      /**
       * Chaque item, relu de ses résultats par la règle du moteur (`suivreLaPratique` dans
       * `@janus/contrats`) : son état (à faire, réussi avec de l'aide, réussi), l'aide qu'il garde,
       * s'il se refait sur l'autre cas, les items qui débloquent son aide, le relais.
       */
      function itemsPratique() {
        return window.JanusPratique.suivre(idsPratique(), essaisPratique(), jourPratique())
      }
      const itemPratique = (id) => itemsPratique().get(id)
      function itemExplique(item) {
        if (pratiqueServeur === null) return pratiqueLocale().expliques.includes(item)
        return pratiqueServeur.expliques.includes(item) || expliquesEnAttente.has(item)
      }
      function noterExplique(item) {
        if (pratiqueServeur !== null) expliquesEnAttente.add(item)
        else if (!pratiqueLocale().expliques.includes(item)) pratiqueLocale().expliques.push(item)
      }
      /** Hors de l'appli, la page garde elle-même les constats de l'atelier. */
      function atelierLocal() {
        if (!Array.isArray(etat.atelierLocal)) etat.atelierLocal = []
        return etat.atelierLocal
      }
      /** Les constats de l'atelier dans l'ordre : ceux du serveur, puis ceux qui l'attendent. */
      function constatsAtelier() {
        if (pratiqueServeur === null) return atelierLocal()
        const connus = new Set(pratiqueServeur.atelier.map((constat) => constat.id))
        return [
          ...pratiqueServeur.atelier,
          ...ateliersEnAttente.filter((constat) => !connus.has(constat.id)),
        ]
      }
      /** L'instant présent à l'horloge du serveur (ms) : le délai de l'aide de l'atelier s'y compte. */
      const instantServeur = () => Date.now() + decalageServeur
      /**
       * L'atelier relu de ses constats par la règle du moteur (`suivreLAtelier`) : réussi sans aide (il
       * compte), le dernier constat, l'aide qu'il garde encore et l'instant où elle tombe. `en_plus` :
       * un constat qui n'est pas envoyé, le coup de pouce ouvert, compté comme une aide déclarée.
       */
      function suiviAtelier(enPlus = []) {
        const constats = [...constatsAtelier(), ...enPlus].sort(
          (a, b) => Date.parse(a.le) - Date.parse(b.le),
        )
        return window.JanusPratique.atelier(constats, instantServeur())
      }
      /** La pratique que le serveur garde : ce qu'elle contient n'attend plus ici. */
      function recevoirPratique(pratique) {
        if (!pratique) return
        pratiqueServeur = pratique
        decalageServeur = Date.parse(pratique.maintenant) - Date.now()
        const connus = new Set(pratique.resultats.map((resultat) => resultat.id))
        for (let k = essaisEnAttente.length - 1; k >= 0; k -= 1) {
          if (connus.has(essaisEnAttente[k].id)) essaisEnAttente.splice(k, 1)
        }
        for (const item of pratique.expliques) expliquesEnAttente.delete(item)
        const constats = new Set(pratique.atelier.map((constat) => constat.id))
        for (let k = ateliersEnAttente.length - 1; k >= 0; k -= 1) {
          if (constats.has(ateliersEnAttente[k].id)) ateliersEnAttente.splice(k, 1)
        }
      }
      /*
       * L'état d'avant gardait le dernier constat de l'atelier (`etat.atelier`). Dans l'appli, le
       * serveur a les constats : la copie s'efface. Hors de l'appli, elle devient le premier constat
       * de la page, daté du passé : son aide ne pèse plus.
       */
      function reprendreAncienAtelier() {
        const ancien = etat.atelier
        delete etat.atelier
        if (pratiqueServeur !== null || !ancien || typeof ancien !== 'object') return
        if (atelierLocal().length > 0) return
        atelierLocal().push({
          id: 'avant-atelier',
          reussi: ancien.reussi === true,
          aide: [0, 1, 2, 3, 4].includes(ancien.aide) ? ancien.aide : 4,
          le: '1970-01-01T00:00:00.000Z',
        })
      }
      /*
       * L'état d'avant la refonte gardait sa copie des items (`etat.pratique`). Dans l'appli, le serveur
       * a leurs résultats : la copie s'efface. Hors de l'appli, elle devient les résultats de la page :
       * un item réussi le reste, avec l'aide notée.
       */
      function reprendreAnciennePratique() {
        reprendreAncienAtelier()
        const ancienne = etat.pratique
        delete etat.pratique
        delete etat.rangPratique
        if (pratiqueServeur !== null || !ancienne || typeof ancienne !== 'object') return
        const locale = pratiqueLocale()
        for (const [item, note] of Object.entries(ancienne)) {
          if (note?.reussi === true) {
            locale.resultats.push({
              id: 'avant-' + item,
              item,
              reussi: true,
              aide: [0, 1, 2, 3, 4].includes(note.aide) ? note.aide : 0,
              brute: false,
              jour: typeof note.aideLe === 'string' ? note.aideLe : '1970-01-01',
              cas: null,
            })
          }
          if (note?.explique === true && !locale.expliques.includes(item))
            locale.expliques.push(item)
        }
      }

      const questions = (serie) => (serie === 'restitution' ? manifeste.restitution : [])
      const reponsesFinies = (serie) => questions(serie).filter((q) => etat.envoyees[q.id]).length
      /**
       * Le décompte de la pratique, le même partout : « 5 sur 14, dont 2 avec de l’aide ». Un item réussi
       * avec de l'aide compte pour avancer ; l'appli ne le compte qu'une fois refait sans aide.
       */
      function decomptePratique() {
        const items = manifeste.pratique.flatMap((exercice) => exercice.items)
        const reussis = items.filter((item) => itemReussi(item.id))
        const etats = itemsPratique()
        const avecAide = reussis.filter((item) => etats.get(item.id).etat === 'aide').length
        return (
          reussis.length +
          ' sur\u00a0' +
          items.length +
          (avecAide > 0 ? ', dont ' + avecAide + ' avec de l’aide' : '')
        )
      }
      /**
       * Ce qui retient dans une étape : les questions d'une série ouverte qui n'ont pas encore leur
       * réponse finale. On ne quitte pas une restitution à moitié faite.
       */
      function resteAFaire(etape) {
        // La pratique : chaque item réussi, avec ou sans aide (sans aide, il ne compte qu'un autre
        // jour, et l'apprenant resterait bloqué jusque-là). Une solution vue n'est pas réussie.
        if (etape.type === 'pratique') {
          const items = manifeste.pratique.flatMap((exercice) => exercice.items)
          const reussis = items.filter((item) => itemReussi(item.id)).length
          if (reussis === items.length) return ''
          return (
            'Réussis les ' +
            items.length +
            ' items avant de passer à la suite\u00a0: ' +
            decomptePratique() +
            ', pour l’instant.'
          )
        }
        if (etape.type === 'pretest') {
          const restants = Array.from(
            $('contenu').querySelectorAll('[data-essai][data-id]'),
          ).filter((ex) => !etat.traces?.['essai:' + ex.dataset.id]).length
          if (restants === 0) return ''
          return (
            'Réponds à chaque essai avant de passer à la suite, « Je ne sais pas » compris\u00a0: ' +
            (restants > 1 ? 'il en reste ' + restants : 'il en reste un') +
            '.'
          )
        }
        if (etape.type === 'atelier')
          return constatsAtelier().length > 0
            ? ''
            : 'Envoie ton constat avant de passer à la suite.'
        if (etape.type !== 'restitution') return ''
        if (!serieOuverte[etape.type]) return ''
        const total = questions(etape.type).length
        const finies = reponsesFinies(etape.type)
        if (finies === total) return ''
        return (
          'Termine les ' +
          total +
          ' questions avant de passer à la suite\u00a0: ' +
          finies +
          ' sur\u00a0' +
          total +
          ' pour l’instant.'
        )
      }
      /** Les questions d'une série ouverte qui attendent une réponse : pas encore répondues, ou à reprendre. */
      const aPoserDans = (serie) =>
        serieOuverte[serie]
          ? questions(serie).filter((q) => !etat.envoyees[q.id] || aRefaire(serie).includes(q))
          : []
      /** La série commencée (bouton « Commencer ») qui a encore des questions à poser, s'il y en a une. */
      const serieEnCours = () =>
        ['restitution'].find((serie) => etat.enCours?.[serie] && aPoserDans(serie).length > 0)
      /**
       * Restitution sans support : de « Commencer » à la dernière réponse, tout le reste de la fiche
       * est masqué, sauf retour au cours. Le cours, mais aussi la carte, la pratique, l'atelier,
       * l'aisance et le bilan (la liste des erreurs critiques soufflerait des réponses).
       */
      const coursMasque = () => serieEnCours() !== undefined && !etat.retourCours
      /** Une étape que la série en cours masque : toutes, sauf la série elle-même. */
      const masquee = (etape) => coursMasque() && etape.type !== serieEnCours()
      /** La restitution faite (ou fermée par l'appli) : le bilan peut partir. */
      const restitutionTerminee = () =>
        !serieOuverte.restitution || reponsesFinies('restitution') === manifeste.restitution.length
      /**
       * Une erreur critique repérée attend le bilan : la restitution est faite, et le bilan ne l'a pas
       * encore reçue. Tant qu'il n'est pas envoyé, l'aisance s'arrête : sans cela, une erreur repérée qu'on ne coche jamais n'empêcherait rien (règle V01).
       */
      const bilanAttendu = () => restitutionTerminee() && (etat.aCocher ?? []).length > 0
      /** Ce qui attend le bilan : les erreurs repérées, nommées, et le chemin vers le bilan. */
      function attenteBilan(quoi) {
        const reperees = manifeste.erreurs_critiques.filter((e) =>
          (etat.aCocher ?? []).includes(e.id),
        )
        const bilan = etapes.find((e) => e.type === 'bilan')
        return [
          creer('p', {
            textContent:
              (reperees.length > 1
                ? 'Des erreurs critiques ont été repérées dans tes réponses : '
                : 'Une erreur critique a été repérée dans tes réponses : ') +
              reperees.map((e) => e.libelle).join(' ; ') +
              '. ' +
              quoi +
              ' reprend une fois ton bilan envoyé. ' +
              (reperees.length > 1
                ? 'Elles y sont cochées d’office, et chacune se referme par une réponse solide à une question qui la touche.'
                : 'L’erreur y est cochée d’office, et une réponse solide à une question qui la touche la refermera.'),
          }),
          ...(bilan
            ? [
                creer(
                  'div',
                  { className: 'actions' },
                  creer('button', {
                    type: 'button',
                    className: 'bouton',
                    textContent: 'Aller au bilan',
                    onclick: () => aller(bilan.id),
                  }),
                ),
              ]
            : []),
        ]
      }

      function creer(balise, { dataset = {}, ...proprietes } = {}, ...enfants) {
        const element = Object.assign(document.createElement(balise), proprietes)
        Object.assign(element.dataset, dataset)
        element.append(...enfants)
        return element
      }

      /**
       * L'échelle d'aide d'un exercice (règles F03 et F04), la même pour toutes les fiches : rien avant
       * une réponse fausse ; après chacune, un cran de plus s'ouvre à la demande (une question qui
       * oriente, un indice, l'étape détaillée), puis « Voir la solution ». Les crans se lisent dans
       * `data-aide1` à `data-aide3` de l'exercice, sinon dans `crans` (des textes, ou des fonctions
       * qui rendent le texte à l'ouverture) ; sans cran, la solution attend deux réponses fausses.
       * `restantes()` (un choix) : le nombre d'options encore à choisir ; « Voir la solution » ne paraît
       * pas quand il ne pourrait jamais servir (la dernière option se montre d'office). Un choix
       * (`enchaine`) n'a qu'une ou deux tentatives avant que la dernière option se montre : après la
       * première réponse fausse, ses crans s'ouvrent l'un après l'autre à la demande (l'indice, puis
       * l'étape détaillée), sans attendre une autre réponse, qui ne laisserait plus rien à choisir.
       * `toutOuvrir()` ouvre les crans qui restent, avant une solution montrée d'office.
       * `fini()` dit que l'exercice est fini, `surSolution()` montre la solution. Rend la zone à poser
       * dans l'exercice, `tentative()` à appeler à chaque réponse fausse, `cran()` (4 : solution vue)
       * et `maj()`.
       */
      function echelle(
        ex,
        {
          crans = [],
          fini = () => false,
          surSolution = () => {},
          restantes,
          enchaine = false,
        } = {},
      ) {
        const ecrits = [ex.dataset.aide1, ex.dataset.aide2, ex.dataset.aide3].filter(Boolean)
        const textes = ecrits.length > 0 ? ecrits : crans
        let cran = 0
        let depuis = 0
        let total = 0
        let vue = false
        const liste = creer('ol', { className: 'crans' })
        const bouton = creer('button', { type: 'button', className: 'bouton secondaire petit' })
        const zone = creer('div', { className: 'pouce' }, bouton, liste)
        function maj() {
          const reste = cran < textes.length
          bouton.textContent = reste
            ? cran === 0
              ? 'Un coup de pouce'
              : 'Un autre coup de pouce'
            : 'Voir la solution'
          const seuil = !reste && textes.length === 0 ? 2 : 1
          // Un choix (`restantes`) : chaque réponse fausse retire une option, et la dernière qui reste
