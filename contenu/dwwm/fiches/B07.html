        --couleur-accent-sur-fond: light-dark(#ffffff, #0f1a28);
        --couleur-accent-douce: light-dark(#e8eff8, #1f2b3a);
        --couleur-succes: light-dark(#276f50, #5dc196);
        --couleur-alerte: light-dark(#95620a, #e0ac4a);
        --couleur-erreur: light-dark(#ae3846, #ee8591);
        --couleur-focus: light-dark(#2b6cb0, #8bb9f5);
        --effet-ombre-carte: light-dark(#1b1f24, #000000);
        --espacement-4: 0.25rem;
        --espacement-8: 0.5rem;
        --espacement-12: 0.75rem;
        --espacement-16: 1rem;
        --espacement-20: 1.25rem;
        --espacement-24: 1.5rem;
        --espacement-32: 2rem;
        --espacement-48: 3rem;
        --rayon-champ: 0.625rem;
        --rayon-carte: 0.875rem;
        --rayon-option: 0.375rem;
        --duree-transition: 160ms;
        --focus-anneau: 0 0 0 2px var(--couleur-fond), 0 0 0 4px var(--couleur-focus);
        --ombre-option: 0 2px 6px color-mix(in srgb, var(--effet-ombre-carte) 8%, transparent);
        --hauteur-champ: 48px;
        --hauteur-bouton: 48px;
        --cible-tactile-min: 44px;
        --largeur-lecture: 62ch;
        --police-texte: 'Inter', system-ui, sans-serif;
        --police-code: 'JetBrains Mono', ui-monospace, monospace;
      }
      /* Le thème choisi dans l'appli (message etat.init) l'emporte sur le réglage du téléphone. */
      :root[data-theme='clair'] {
        color-scheme: light;
      }
      :root[data-theme='sombre'] {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: var(--couleur-fond);
        color: var(--couleur-encre);
        font-family: var(--police-texte);
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5rem;
      }
      button,
      summary,
      label {
        touch-action: manipulation;
      }

      /* Barre et fil d'étapes : montrés seulement hors de l'appli (aperçu), qui a les siens. */
      .barre {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8) var(--espacement-12);
        min-height: 56px;
        padding: var(--espacement-8) var(--espacement-16);
        background: var(--couleur-surface);
        border-block-end: 1px solid var(--couleur-ligne);
      }
      .barre h1 {
        flex: 1 1 140px;
        min-width: 0;
        margin: 0;
        font-size: 1rem;
        font-weight: 500;
        line-height: 1.5rem;
      }
      .barre p {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8);
        margin: 0;
      }
      .mode {
        padding: 2px var(--espacement-8);
        border-radius: var(--rayon-option);
        background: var(--couleur-surface-douce);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .fil {
        background: var(--couleur-surface);
        border-block-end: 1px solid var(--couleur-ligne);
      }
      .bascule {
        display: none;
      }
      .etapes,
      .moment > ol {
        display: flex;
        flex-wrap: wrap;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .etapes {
        gap: var(--espacement-4) var(--espacement-16);
        justify-content: center;
        padding: 0 var(--espacement-12);
      }
      /* Un moment du cycle : son nom, puis ses étapes ; celui de l'étape courante prend l'accent. */
      .moment {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0 var(--espacement-4);
      }
      .moment > ol {
        gap: 0 var(--espacement-4);
      }
      .moment-nom {
        padding: 0 var(--espacement-8);
        color: var(--couleur-texte-discret);
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .moment[data-courant='oui'] > .moment-nom {
        color: var(--couleur-accent);
      }
      .onglet {
        position: relative;
        min-height: 44px;
        padding: 0 var(--espacement-12);
        border: 0;
        background: transparent;
        color: var(--couleur-texte-secondaire);
        font: inherit;
        font-size: 0.875rem;
        line-height: 1.25rem;
        white-space: nowrap;
        cursor: pointer;
      }
      .onglet:hover {
        color: var(--couleur-encre);
      }
      .onglet:focus-visible {
        outline: none;
        border-radius: var(--rayon-champ);
        box-shadow: var(--focus-anneau);
      }
      .onglet[aria-current='step'] {
        color: var(--couleur-accent);
        font-weight: 500;
      }
      .onglet[aria-current='step']::after {
        position: absolute;
        inset-block-end: 0;
        inset-inline: var(--espacement-12);
        block-size: 2px;
        background: var(--couleur-accent);
        content: '';
      }
      @media (max-width: 40rem) {
        .bascule {
          display: flex;
          align-items: center;
          justify-content: space-between;
          inline-size: 100%;
          min-height: 48px;
          padding: 0 var(--espacement-16);
          border: 0;
          background: transparent;
          color: var(--couleur-accent);
          font: inherit;
          font-size: 0.875rem;
          font-weight: 500;
          line-height: 1.25rem;
          cursor: pointer;
        }
        .fil[data-ouvert='false'] .etapes {
          display: none;
        }
        .etapes {
          flex-direction: column;
          gap: var(--espacement-4);
          justify-content: flex-start;
          padding-block-end: var(--espacement-8);
        }
        .moment,
        .moment > ol {
          flex-direction: column;
          align-items: stretch;
        }
        .moment-nom {
          padding: var(--espacement-8) var(--espacement-12) 0;
        }
        .onglet {
          inline-size: 100%;
          text-align: start;
        }
        .onglet[aria-current='step']::after {
          display: none;
        }
      }
      /* Dans l'appli, la barre et le fil d'étapes sont ceux de la page : la fiche n'en montre pas un second. */
      html[data-integree] .barre,
      html[data-integree] .fil {
        display: none;
      }
      html[data-integree] section > h2 {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /*
       * Dans l'appli, l'iframe prend la hauteur du contenu (message page.taille) : la fiche ne défile
       * pas seule. Elle se pose sur le fond de la page, ses cartes ont la largeur de celle du haut.
       */
      html[data-integree] {
        scrollbar-width: none;
      }
      html[data-integree]::-webkit-scrollbar {
        display: none;
      }
      html[data-integree] body {
        background: transparent;
      }
      html[data-integree] main {
        max-width: none;
        padding: 0;
      }

      /* Page : une colonne, des cartes séparées par le même intervalle que dans l'appli. */
      main {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-16);
        max-width: 760px;
        margin: 0 auto;
        padding: var(--espacement-16) var(--espacement-16) var(--espacement-48);
      }
      /* Une erreur de l'appli : la barre est cachée dans l'appli, l'avis passe au-dessus de l'étape. */
      .avis {
        margin: 0;
        padding: var(--espacement-12) var(--espacement-16);
        border: 1px solid var(--couleur-erreur);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface);
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      #contenu {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-16);
        min-width: 0;
      }
      section {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
        padding: var(--espacement-20);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-carte);
        background: var(--couleur-surface);
      }
      /* Les blocs d'une carte s'espacent par le gap, jamais par des marges qui se cumulent. */
      section :is(h2, h3, h4, p, ul, ol, dl, figure, blockquote, pre, fieldset) {
        margin: 0;
      }
      .ecran,
      .enonce {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
      }
      .ecran[hidden],
      .bouton[hidden],
      [data-si-essai][hidden] {
        display: none;
      }
      h2 {
        font-size: 1.375rem;
        font-weight: 600;
        line-height: 1.75rem;
        text-wrap: balance;
      }
      h3 {
        font-size: 1.125rem;
        font-weight: 600;
        line-height: 1.625rem;
        text-wrap: balance;
      }
      h4 {
        font-size: 1rem;
        font-weight: 600;
      }
      p,
      li {
        overflow-wrap: break-word;
      }
      .ecran p,
      .ecran li {
        max-width: var(--largeur-lecture);
      }
      .ecran .accroche {
        font-size: 1.125rem;
        line-height: 1.75rem;
      }
      ul,
      ol {
        padding-inline-start: var(--espacement-20);
      }
      /* Seulement les listes du contenu : le fil d'étapes et les autres listes d'interface ont leur propre gap. */
      section :is(ul, ol) > li + li {
        margin-top: var(--espacement-8);
      }
      ul.plain {
        padding-inline-start: var(--espacement-20);
      }
      .discret {
        color: var(--couleur-texte-secondaire);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      a {
        color: var(--couleur-encre);
        font-weight: 500;
        text-decoration: none;
        transition: color var(--duree-transition);
      }
      a:hover {
        color: var(--couleur-accent);
      }
      code,
      kbd {
        font-family: var(--police-code);
        font-size: 0.875em;
        font-variant-ligatures: none;
      }
      code {
        padding: 1px var(--espacement-4);
        border-radius: var(--rayon-option);
        background: var(--couleur-surface-douce);
      }
      pre {
        overflow-x: auto;
        padding: var(--espacement-12);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      pre code {
        padding: 0;
        background: none;
      }

      /* Boutons : Bouton.module.css (principal, secondaire). */
      button {
        font: inherit;
      }
      .bouton {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--espacement-8);
        min-height: var(--hauteur-bouton);
        min-width: var(--cible-tactile-min);
        padding: 0 var(--espacement-16);
        border: 1px solid transparent;
        border-radius: var(--rayon-champ);
        background: var(--couleur-accent);
        color: var(--couleur-accent-sur-fond);
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color var(--duree-transition) ease,
          border-color var(--duree-transition) ease,
          transform var(--duree-transition) ease;
      }
      .bouton:hover:not(:disabled) {
        background: color-mix(in srgb, var(--couleur-accent) 88%, var(--couleur-encre));
      }
      .bouton:active:not(:disabled) {
        background: color-mix(in srgb, var(--couleur-accent) 75%, var(--couleur-encre));
        transform: translateY(1px);
      }
      .bouton.secondaire {
        border-color: var(--couleur-controle);
        background: transparent;
        color: var(--couleur-encre);
      }
      .bouton.secondaire:hover:not(:disabled) {
        background: var(--couleur-surface-douce);
      }
      .bouton.secondaire:active:not(:disabled) {
        border-color: var(--couleur-accent);
        background: var(--couleur-surface-douce);
      }
      .bouton:focus-visible {
        outline: none;
        box-shadow: var(--focus-anneau);
      }
      .bouton:disabled {
        border-color: transparent;
        background: var(--couleur-surface-douce);
        color: var(--couleur-encre);
        opacity: 0.55;
        cursor: not-allowed;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-8);
      }
      @media (prefers-reduced-motion: reduce) {
        .bouton,
        a {
          transition: none;
        }
        .bouton:active:not(:disabled) {
          transform: none;
        }
      }

      /* Champs : ChampTexte, ZoneDeTexte, Selecteur. */
      textarea,
      input[type='text'],
      select {
        width: 100%;
        min-height: var(--hauteur-champ);
        padding: 0 var(--espacement-12);
        border: 1px solid var(--couleur-controle);
        border-radius: var(--rayon-champ);
        background-color: var(--couleur-fond);
        color: var(--couleur-encre);
        font: inherit;
        transition: border-color var(--duree-transition) ease;
      }
      input[type='text'] {
        width: auto;
        font-family: var(--police-code);
        font-variant-ligatures: none;
      }
      textarea {
        min-height: 7rem;
        padding: var(--espacement-12);
        resize: vertical;
        field-sizing: content;
      }
      .reponse-envoyee {
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      textarea:disabled,
      input:disabled {
        background-color: var(--couleur-surface-douce);
        opacity: 0.65;
      }
      textarea:focus-visible,
      input[type='text']:focus-visible,
      select:focus-visible {
        outline: none;
        border-color: var(--couleur-accent);
        box-shadow: var(--focus-anneau);
      }
      select {
        padding-inline-end: var(--espacement-32);
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, currentcolor 50%),
          linear-gradient(135deg, currentcolor 50%, transparent 50%);
        background-position:
          calc(100% - 1.125rem) 50%,
          calc(100% - 0.8125rem) 50%;
        background-repeat: no-repeat;
        background-size:
          0.3125rem 0.3125rem,
          0.3125rem 0.3125rem;
      }
      /* Une question : sa carte propre, sur le fond de la carte de l'étape. */
      .item {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
        padding: var(--espacement-16);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      .item > label,
      .relance > label {
        font-weight: 500;
      }
      /* Le complément d'une réponse, après sa correction, dans la carte de la question. */
      .relance {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
      }
      .item[data-fait='oui'] {
        border-color: var(--couleur-succes);
      }
      /* Une question à reprendre : la couleur du statut « À reprendre » de l'appli. */
      .item[data-fait='reprise'] {
        border-color: var(--couleur-erreur);
      }
      .item-reprise {
        margin: 0;
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1.25rem;
      }
      .erreur {
        margin: 0;
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .erreur:empty {
        display: none;
      }

      /* Confiance : GroupeSegmente. */
      fieldset {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-8);
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }
      legend {
        float: left;
        width: 100%;
        padding: 0;
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1.25rem;
        color: var(--couleur-texte-secondaire);
      }
      .choix label {
        position: relative;
        display: flex;
        flex: 1 0 auto;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding-inline: var(--espacement-8);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-option);
        background: var(--couleur-fond);
        white-space: nowrap;
        cursor: pointer;
      }
      /* La vraie radio couvre l'option et déborde du cadre : la zone tactile fait au moins 44 px. */
      .choix input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .choix label:has(input:checked) {
        border-color: var(--couleur-accent);
        background: var(--couleur-accent);
        box-shadow: var(--ombre-option);
        color: var(--couleur-accent-sur-fond);
        font-weight: 600;
      }
      .choix label:has(input:focus-visible) {
        box-shadow: var(--focus-anneau);
      }
      .choix label:has(input:disabled) {
        opacity: 0.65;
        cursor: not-allowed;
      }
      /* Une table de vérité à remplir : les faits donnés, puis VRAI ou FAUX à choisir dans chaque case. */
      .table-saisie {
        display: table;
        width: 100%;
        white-space: normal;
      }
      .table-saisie th,
      .table-saisie td {
        padding: var(--espacement-4);
        text-align: center;
        vertical-align: middle;
      }
      .table-saisie td.entree {
        color: var(--couleur-texte-secondaire);
      }
      .table-saisie td.valeur {
        font-weight: 600;
      }
      .table-saisie .choix {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-4);
      }
      .table-saisie .choix label {
        min-height: 44px;
        padding-inline: var(--espacement-4);
      }

      /* L'option choisie d'un essai : marquée, la correction viendra à la fin de l'étape. */
      [data-essai] button[aria-pressed='true']:disabled {
        border-color: var(--couleur-accent);
        background: var(--couleur-accent-douce);
        color: var(--couleur-encre);
        font-weight: 600;
        opacity: 1;
      }
      [data-essai] .options button[aria-pressed='true']::after {
        content: ' · ta réponse';
        color: var(--couleur-accent);
        font-weight: 600;
      }

      /* Correction : BulleCorrection. */
      .correction {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        padding: var(--espacement-20);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-carte);
        background: var(--couleur-surface);
      }
      .correction > strong {
        display: flex;
        align-items: center;
        gap: var(--espacement-8);
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.25rem;
        color: var(--couleur-texte-secondaire);
      }
      .correction > strong::before {
        flex: none;
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: currentcolor;
        content: '';
      }
      .correction[data-niveau='solide'] > strong {
        color: var(--couleur-succes);
      }
      .correction[data-niveau='partiel'] > strong {
        color: var(--couleur-alerte);
      }
      .correction[data-niveau='fragile'] > strong {
        color: var(--couleur-erreur);
      }
      .correction p {
        margin: 0;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      /* Sous la question : la correction, puis l'accord sur le niveau quand elle est tirée au sort. */
      .sortie {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
      }
      .sortie:empty {
        display: none;
      }
      .accord {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8) var(--espacement-12);
      }
      /* BadgeNeComptePas de l'appli : une réponse qui ne compte pas pour le statut, et pourquoi. */
      .badge-compte {
        display: inline-flex;
        align-items: center;
        align-self: flex-start;
        min-height: 1.75rem;
        padding: 0 var(--espacement-12);
        border: 1px solid var(--couleur-ligne);
        border-radius: 999px;
        background: var(--couleur-surface-douce);
        color: var(--couleur-texte-secondaire);
        font-size: 0.75rem;
        font-weight: 500;
        line-height: 1rem;
        white-space: nowrap;
      }

      /* Détails repliables ; l'objectif d'examen replié (carte, pratique) en est un. */
      details {
        padding: 0 var(--espacement-16);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      details[open] {
        padding-block-end: var(--espacement-12);
      }
      details > :not(summary) {
        margin-block-start: var(--espacement-12);
      }
      details > summary + * {
        margin-block-start: var(--espacement-4);
      }
      summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--espacement-12);
        min-height: 48px;
        font-weight: 500;
        list-style: none;
        cursor: pointer;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::after {
        flex: none;
        width: 0.5rem;
        height: 0.5rem;
        border-inline-end: 2px solid var(--couleur-texte-secondaire);
        border-block-end: 2px solid var(--couleur-texte-secondaire);
        transform: rotate(45deg) translate(-2px, -2px);
        transition: transform var(--duree-transition) ease;
        content: '';
      }
      details[open] > summary::after {
        transform: rotate(-135deg) translate(-2px, -2px);
      }
      summary:focus-visible {
        outline: none;
        border-radius: var(--rayon-champ);
        box-shadow: var(--focus-anneau);
      }

  <body>
    <header class="barre">
      <h1 id="titre"></h1>

        <span id="mode" class="mode" role="status">Connexion à l’appli…</span>
        <span id="statut" class="discret"></span>

    <nav class="fil" id="fil" aria-label="Étapes de la fiche" data-ouvert="false">

        type="button"

    <main>

    <!-- ET1, perception : la page du planning qui s’ouvre, déroulée pas à pas, puis un pari sans note. -->
    <template data-etape="ET1">
      <div data-ecran="Le planning s’ouvre">
        <p class="accroche">
          Yasmine, 34 ans, suit une formation pour devenir développeuse web. Ce matin, sur son PC,
          elle tape l’adresse du planning de la formation dans son navigateur. La page s’affiche en
          moins d’une seconde. Déroule ce qui s’est passé pendant cette seconde.
        </p>
        <div class="cadre pour-lire">
          <p class="discret">Deux mots, pour lire :</p>
          <ul>
            <li>Le navigateur : le logiciel avec lequel Yasmine ouvre les pages web.</li>
            <li>
              Le serveur : la machine du site, quelque part sur Internet, qui garde les pages et
              répond quand on les demande.
            </li>
          </ul>
        </div>
        <div
          class="outil ex"
          data-widget="deroule"
          data-id="planning"
          data-apres="Une seule seconde, et huit moments, toujours dans le même ordre. La suite du bloc les reprend un par un."
          data-lecture="Ce qui se passe quand Yasmine ouvre le planning. Elle tape formation.example.org/planning. Le navigateur demande quel numéro porte ce nom, et reçoit 203.0.113.20. Il ouvre une liaison avec la machine qui porte ce numéro, puis la protège. Il demande la page du planning. La machine du site prépare la page. Elle répond que tout va bien, avec le nombre 200, et envoie la page. Le navigateur dessine la page et s’aperçoit qu’il lui manque des fichiers, qu’il demande à leur tour. La page est complète."
        >
          <p class="outil-titre">Une seconde au ralenti</p>
          <ol class="pas-donnees" hidden>
            <li>Yasmine tape formation.example.org/planning, puis Entrée.</li>
            <li>
              Le navigateur ne sait pas où est ce site. Il demande quel numéro porte le nom
              formation.example.org, et reçoit une réponse : 203.0.113.20.
            </li>
            <li>
              Il ouvre une liaison avec la machine qui porte ce numéro, puis il la protège, pour que
              personne en chemin ne puisse lire l’échange.
            </li>
            <li>Sur cette liaison, il demande la page du planning.</li>
            <li>
              La machine du site prépare la page : elle va chercher le planning de la semaine.
            </li>
            <li>Elle répond « tout va bien », avec le nombre 200, et envoie la page.</li>
            <li>
              Le navigateur dessine la page. Il voit qu’il lui manque la feuille des couleurs, le
              logo et un petit programme pour le menu : il les demande à leur tour.
            </li>
            <li>La page est complète, avec ses couleurs, son logo et son menu.</li>
          </ol>
        </div>
      </div>
      <div data-ecran="Ton pari">
        <p class="accroche">
          Le lendemain, Yasmine tape de nouveau formation.example.org/planning. Cette fois, la page
          ne s’ouvre pas : le navigateur affiche un message à la place.
        </p>
        <div
          data-widget="pari"
          class="ex"
          data-apres="Ta réponse est gardée. La fiche y revient à la fin du bloc, pour voir si ton pari tenait."
        >
          <p class="q">À ton avis, que fait Yasmine en premier ?</p>
          <ul class="options">
            <li data-option="message">
              Elle lit le message : il dit à quel moment l’échange s’est arrêté, donc où chercher.
            </li>
            <li data-option="pc">
              Elle redémarre son PC : quand une page ne s’ouvre pas, le problème vient presque
              toujours de l’ordinateur.
            </li>
            <li data-option="site">
              Elle prévient le formateur que le site est en panne : si la page ne vient pas, c’est
              que le site ne marche pas.
            </li>
          </ul>
        </div>
      </div>
    </template>
    <!-- ET2, carte : la partie Internet et le Web, à quoi sert le bloc, ce que l’apprenant sait déjà, ce qu’il saura faire. -->
    <template data-etape="ET2">
      <p class="accroche">
        Pourquoi la page du planning s’est-elle ouverte en une seconde un jour, et pas le lendemain
        ? Ce bloc déroule ce qui se passe entre l’adresse tapée et la page affichée, pour que tu
        saches où chercher quand ça bloque.
      </p>
      <h3>Où tu es</h3>
      <p>
        Ce bloc est le dernier de la partie Internet et le Web, qui tient en trois idées reliées :
      </p>
      <ul class="carte-partie">
        <li>
          <strong>Internet, réseau de réseaux</strong> : Internet transporte des paquets d’une
          adresse à une autre.
        </li>
        <li>
          <strong>Le réseau local et l’accès à Internet</strong> : chez toi, une box relie ton
          réseau local à celui de ton fournisseur d’accès.
        </li>
        <li class="ici">
          <strong>Le Web en action</strong> : le Web est un service qui tourne sur Internet, où un
          navigateur demande une page à un serveur. Il a besoin des deux blocs d’avant pour
          fonctionner. Tu es ici.
        </li>
      </ul>
      <h3>À quoi ça sert</h3>
      <p>
        Quand quelqu’un te dit « mon site ne marche pas », tu sauras demander ce qu’il voit, et en
        déduire où chercher : le nom du site, le chemin jusqu’à lui, le site lui-même, ou le
        navigateur. Tu sauras aussi vérifier avec des outils, au lieu de deviner. Pour un
        développeur web, c’est le quotidien : chaque page que tu fabriqueras passera par là.
      </p>
      <p>
        <strong>L’idée du bloc.</strong> Ouvrir une page, c’est une suite d’étapes dans un ordre qui
        ne change jamais : tu vas découvrir ce que fait chacune, et ce qu’elle laisse voir quand
        elle casse.
      </p>
      <h3>Ce que tu connais déjà</h3>
      <p>
        Des deux blocs d’avant, ce bloc ne reprend que quatre idées, redites ici en mots simples :
      </p>
      <ul>
        <li>chaque machine sur Internet a un numéro, son adresse IP ;</li>
        <li>un service, le DNS, donne l’adresse IP qui correspond à un nom de site ;</li>
        <li>
          chez toi, tous tes appareils sortent sur Internet par ta box, avec la même adresse
          publique ;
        </li>
        <li>le terminal est la fenêtre où l’on tape des commandes.</li>
      </ul>
      <p>
        Les autres mots que tu croiseras, comme ceux de l’objectif replié sous « Ce qui sera vérifié
        », sont expliqués un par un dans les étapes qui suivent, au moment où Yasmine en a besoin.
      </p>
      <h3>À la fin, tu sauras</h3>
      <ul>
        <li>raconter, dans l’ordre, ce qui se passe entre l’adresse tapée et la page affichée ;</li>
        <li>
          lire une adresse web morceau par morceau, et ne plus confondre le nom d’un site, l’adresse
          d’une page et le numéro d’une machine ;
        </li>
        <li>
          comprendre les nombres que renvoie un site, le cadenas du navigateur et les cookies ;
        </li>
        <li>
          partir de ce que tu vois pour trouver où chercher, et le vérifier dans ton navigateur et
          dans ton terminal.
        </li>
      </ul>
      <p class="discret">
        Il te faudra ton ordinateur, le terminal et un navigateur Chrome, Edge ou Firefox : si tu
        n’as que Safari, installe l’un des trois avant l’atelier. Le terminal et ses commandes sont
        déjà sur ta machine.
      </p>
    </template>
    <!-- ET3, tentative : six essais à l’intuition, un par erreur critique, sans note. -->
    <template data-etape="ET3">

        <div

          <p class="q">
            Quand Yasmine tape formation.example.org/planning, son navigateur fait deux choses :
            trouver l’adresse IP du site, et demander la page. Dans quel ordre ?
          </p>
          <ul class="options">
            <li data-option="adresse">D’abord l’adresse IP du site, ensuite la page.</li>
            <li
              data-option="page"
              data-retour="Une demande de page part vers une machine. Sans son adresse IP, vers où partirait-elle ?"

              D’abord la page, ensuite l’adresse IP, pour savoir quel site doit répondre.
            </li>

              data-option="ensemble"

      <div data-ecran="Un nom, un numéro">
        <div

              data-retour="Une adresse IP désigne-t-elle un site, ou une machine qui peut en porter plusieurs ?"

              Oui : chaque site a son adresse IP, et ce qu’on tape en est la version lisible.
            </li>

              data-option="https"

          <strong>durée de vie</strong>, en secondes, qu’on appelle aussi <strong>TTL</strong>. Tant

          changement.

          précis. Et c’est cet arbre que suit le DNS quand aucun cache ne connaît encore un nom : le

          le fournisseur d’accès ou plus loin. <strong>HTTPS</strong>, c’est HTTP dans une connexion

    <!-- ET14, atelier : dans le navigateur et le terminal de l’apprenant, l’onglet Réseau, un 404, les cookies, nslookup, curl -I, le WHOIS de l’AFNIC. -->
    <template data-etape="ET14">
      <div data-ecran="L’onglet Réseau, chez toi">
        <p class="discret">Tu es ici : sur ta machine, dans ton navigateur et ton terminal.</p>
        <p class="accroche">
          Jusqu’ici, tu as lu les écrans de Yasmine et de Farid. Cette fois, ce sont les tiens. Tu
          vas regarder une vraie page se charger, et noter ce que tu vois sur un papier.
        </p>
        <div
          class="outil"
          data-widget="systeme"
          data-invite="Choisis ton système : la page ne te montrera que ce qui le concerne."
        ></div>
        <p>
          Cet atelier suppose Chrome, Edge ou Firefox : les noms des menus y sont proches. Safari
          cache ses outils tant qu’on n’a pas coché, dans ses réglages, l’option qui affiche le menu
          Développement, et ses noms diffèrent : prends plutôt l’un des trois autres.
        </p>
        <p>
          Ouvre <a data-lien="https://fr.wikipedia.org">l’accueil de Wikipédia en français</a>. Puis
          ouvre les outils de développement :
        </p>
        <div data-os="windows">
          <p>
            <strong>Sous Windows :</strong> touche F12, ou Ctrl + Maj + I. Clique sur l’onglet
            Réseau (« Network » si ton navigateur est en anglais), puis recharge la page avec F5.
          </p>
        </div>
        <div data-os="macos">
          <p>
            <strong>Sous macOS :</strong> Cmd + Option + I. Clique sur l’onglet Réseau (« Network »
            si ton navigateur est en anglais), puis recharge la page avec Cmd + R.
          </p>
        </div>
        <p>Note sur ton papier le nombre de requêtes, écrit en bas du panneau.</p>
        <details data-cran="1">
          <summary>Un indice</summary>
          <p>Le panneau s’ouvre sur le côté ou en bas de la fenêtre. Où sont ses onglets ?</p>
          <details data-cran="2">
            <summary>Une piste détaillée</summary>
            <p>
              Les onglets forment une rangée en haut du panneau : Éléments, Console, Sources,
              Réseau… S’il est étroit, certains sont cachés derrière « » ».
            </p>
            <details data-cran="3">
              <summary>Une partie de la solution</summary>
              <p>
                Dans l’onglet Réseau, la liste est vide tant que la page n’a pas été rechargée.
                Recharge-la, outils ouverts : les lignes arrivent. Le compte des requêtes est dans
                la barre tout en bas du panneau.
              </p>
              <details data-cran="4">
                <summary>La solution entière</summary>
                <p>
                  Outils ouverts, onglet Réseau, recharge. En bas, une ligne comme « 42 requêtes »
                  (« 42 requests ») donne le compte : le tien sera différent, il change d’un jour à
                  l’autre.
                </p>
              </details>
            </details>
          </details>
        </details>
      </div>
      <div data-ecran="Refaire sans hésiter">
        <p class="accroche">
          Ouvrir l’onglet Réseau et n’y garder qu’un type de fichier est un geste de tous les jours
          : il doit venir sans y penser.
        </p>
        <p>
          Les outils ouverts, clique sur le bouton CSS de la barre de filtres, en haut du panneau :
          ne restent que les feuilles de style. Reviens sur « Tout » (« All ») et ferme les outils.
          Puis recommence, en comptant, jusqu’à ouvrir l’onglet Réseau et filtrer sur CSS en moins
          de 10 secondes.
        </p>
        <details data-cran="1">
          <summary>Un indice</summary>
          <p>La barre de filtres est dans le panneau, au-dessus de la liste. La vois-tu ?</p>
          <details data-cran="2">
            <summary>Une piste détaillée</summary>
            <p>
              Elle aligne des boutons par type de fichier : Tout, Doc ou HTML, CSS, JS, images… Si
              tu ne la vois pas dans Chrome ou Edge, clique sur l’entonnoir du panneau.
            </p>
            <details data-cran="3">
              <summary>Une partie de la solution</summary>
              <p>
                Le raccourci qui ouvre les outils te fait gagner le plus de temps : F12, ou Cmd +
                Option + I sous macOS. Le panneau rouvre souvent sur le dernier onglet utilisé.
              </p>
              <details data-cran="4">
                <summary>La solution entière</summary>
                <p>
                  Raccourci, onglet Réseau s’il n’est pas déjà ouvert, clic sur le bouton CSS :
                  trois gestes. Refais-les trois ou quatre fois, et ils passent sous les 10
                  secondes.
                </p>
              </details>
            </details>
          </details>
        </details>
      </div>
      <div data-ecran="Une requête en détail">
        <p class="accroche">
          Dans la liste, la première ligne est la page elle-même ; les autres sont les requêtes
          secondaires.
        </p>
        <p>
          Clique sur la première ligne. Un détail s’ouvre, avec un onglet En-têtes (« Headers »).
          Note sur ton papier :
        </p>
        <ul>
          <li>la méthode de la requête ;</li>
          <li>son code ;</li>
          <li>l’adresse distante, l’adresse IP et le port du serveur ;</li>
          <li>dans les en-têtes de la réponse, la valeur de Content-Type ;</li>
          <li>s’il y a une ou plusieurs lignes Set-Cookie, et le nom du premier cookie.</li>
        </ul>
        <p>
          S’il n’y a aucune ligne Set-Cookie sur cette requête, clique sur d’autres lignes : un site
          n’en envoie pas forcément à chaque requête, et le jour où tu fais l’atelier il peut n’en
          envoyer aucune. Note alors simplement que tu n’en as pas trouvé.
        </p>
        <details data-cran="1">
          <summary>Un indice</summary>
          <p>
            Le détail de la requête se partage entre ce que le navigateur a envoyé et ce que le
            serveur a répondu. Où sont-ils ?
          </p>
          <details data-cran="2">
            <summary>Une piste détaillée</summary>
            <p>
              L’onglet En-têtes a trois parties : un résumé (« Général » dans Chrome), les en-têtes
              de la réponse, les en-têtes de la requête. La méthode, le code et l’adresse distante
              sont dans le résumé.
            </p>
            <details data-cran="3">
              <summary>Une partie de la solution</summary>
              <p>
                Dans Chrome ou Edge, le résumé dit « Méthode de requête », « Code d’état » et «
                Adresse distante ». Il te reste Content-Type et Set-Cookie, dans les en-têtes de la
                réponse.
              </p>
              <details data-cran="4">
                <summary>La solution entière</summary>
                <p>
                  Pour la page d’accueil, la méthode est GET et le code, en général, 200. L’adresse
                  distante finit par :443, le port de HTTPS. Content-Type commence par text/html.
                  Les lignes Set-Cookie, s’il y en a, sont parmi les en-têtes de la réponse, rangés
                  par ordre alphabétique dans Chrome.
                </p>
              </details>
            </details>
          </details>
        </details>
      </div>
      <div data-ecran="Une page qui n’existe pas">
        <p class="accroche">Provoque toi-même une erreur, et lis-la dans l’onglet Réseau.</p>
        <p>
          Outils ouverts sur l’onglet Réseau, tape dans la barre d’adresse
          <span class="mono">https://fr.wikipedia.org/wiki/Page_qui_nexiste_pas_du_tout</span>, puis
          Entrée. La page affiche que l’article n’existe pas. Note le code de la première ligne de
          l’onglet Réseau, et écris à côté l’étage de la chaîne où ce code est né.
        </p>
        <div class="cadre pour-lire">
          <p class="discret">Les quatre étages, pour lire :</p>
          <ul>
            <li>Le DNS : le nom devient une adresse IP.</li>
            <li>Le réseau : la connexion s’ouvre jusqu’au serveur.</li>
            <li>Le serveur : il reçoit la requête, la traite et répond.</li>
            <li>Le navigateur : il affiche la page et demande les fichiers qui manquent.</li>
          </ul>
        </div>
        <p>
          Si Wikipédia a changé sa façon de répondre ce jour-là, essaie
          <span class="mono">https://example.com/rien-ici</span>, et note le code que tu obtiens,
          quel qu’il soit.
        </p>
        <details data-cran="1">
          <summary>Un indice</summary>
          <p>Le serveur a affiché une page. A-t-il reçu la requête ?</p>
          <details data-cran="2">
            <summary>Une piste détaillée</summary>
            <p>
              Le premier chiffre du code dit sa famille : 4 pour une erreur côté client, 5 pour une
              erreur côté serveur.
            </p>
            <details data-cran="3">
              <summary>Une partie de la solution</summary>
              <p>
                Le code est de la famille 4xx : le nom a donné son adresse, la connexion s’est
                ouverte, le serveur a reçu la requête et a répondu. Il te reste à dire quel code
                exactement, et à quel étage.
              </p>
              <details data-cran="4">
                <summary>La solution entière</summary>
                <p>
                  Le code attendu est 404, ressource introuvable : l’étage est le serveur, joint et
                  qui marche, qui ne trouve pas ce chemin. Rien n’est en panne.
                </p>
              </details>
            </details>
          </details>
        </details>
      </div>
      <div data-ecran="Les cookies d’un site">
        <p class="accroche">Ton navigateur garde des cookies de Wikipédia. Va les lire.</p>
        <p>
          Reviens sur <a data-lien="https://fr.wikipedia.org">l’accueil de Wikipédia</a>, outils
          ouverts. Ouvre l’onglet Application dans Chrome ou Edge, ou l’onglet Stockage dans
          Firefox. Dans la colonne de gauche, ouvre Cookies, puis https://fr.wikipedia.org.
        </p>
        <p>
          Pour au moins trois cookies, note leur nom et range-les sur ton papier en deux colonnes :
          de session, ou persistant. Si la liste est vide, ton navigateur bloque peut-être les
          cookies de ce site : note-le, puis fais la même chose sur un site où tu t’identifies
          d’habitude.
        </p>
        <div class="cadre pour-lire">
          <p class="discret">Deux sortes de cookies, pour lire :</p>
          <ul>
            <li>De session : sans date d’expiration.</li>
            <li>Persistant : avec une date (Expires) ou une durée (Max-Age).</li>
          </ul>
        </div>
        <details data-cran="1">
          <summary>Un indice</summary>
          <p>
            Le tableau des cookies a une colonne qui dit jusqu’à quand chacun est gardé. Laquelle ?
          </p>
          <details data-cran="2">
            <summary>Une piste détaillée</summary>
            <p>
              Dans Chrome ou Edge, la colonne s’appelle « Expires / Max-Age » ; dans Firefox, «
              Expire ». Elle donne soit une date, soit un mot.
            </p>
            <details data-cran="3">
              <summary>Une partie de la solution</summary>
              <p>
                Une date dans cette colonne : le cookie reste jusqu’à cette date. Il te reste à
                ranger ceux qui ont un mot à la place.
              </p>
              <details data-cran="4">
                <summary>La solution entière</summary>
                <p>
                  Le mot « Session » dans cette colonne : c’est un cookie de session, effacé à la
                  fermeture du navigateur. Une date : un cookie persistant.
                </p>
              </details>
            </details>
          </details>
        </details>
      </div>
      <div data-ecran="nslookup, chez toi">
        <p class="accroche">Demande toi-même au DNS l’adresse de deux noms.</p>
        <div data-os="windows">
          <p>
            <strong>Sous Windows :</strong> ouvre PowerShell (touche Windows, tape « PowerShell »,
            puis Entrée). Tape <span class="mono">nslookup fr.wikipedia.org</span>, puis Entrée.
            Puis <span class="mono">nslookup example.com</span>.
          </p>
        </div>
        <div data-os="macos">
          <p>
            <strong>Sous macOS :</strong> ouvre le Terminal (Cmd + Espace, tape « Terminal », puis
            Entrée). Tape <span class="mono">nslookup fr.wikipedia.org</span>, puis
            <span class="mono">nslookup -type=AAAA fr.wikipedia.org</span>. Puis les deux mêmes
            commandes pour example.com.
          </p>
        </div>
        <p>
          Pour chaque nom, note sur ton papier l’adresse IP du résolveur interrogé, une adresse IPv4
          et une adresse IPv6, si la sortie en donne une. Les adresses changent d’un jour et d’un
          lieu à l’autre : seule compte leur écriture. Une ligne « canonical name » ou « Aliases »
          peut s’afficher : le nom demandé renvoie à un autre nom, qui porte les adresses ; ne t’y
          arrête pas.
        </p>
        <div class="cadre pour-lire">
          <p class="discret">Trois mots, pour lire :</p>
          <ul>
            <li>Le résolveur : le serveur DNS que ta machine interroge.</li>
            <li>IPv4 : quatre nombres séparés par des points.</li>
            <li>
              IPv6 : des groupes de chiffres et de lettres de a à f, séparés par des deux-points.
            </li>
          </ul>
        </div>
        <details data-cran="1">
          <summary>Un indice</summary>
          <p>La sortie a deux parties. Laquelle parle du résolveur, laquelle du nom ?</p>
          <details data-cran="2">
            <summary>Une piste détaillée</summary>
            <p>
              Le résolveur vient en tête (« Serveur » ou « Server »). Les adresses du nom viennent
              après la ligne qui le nomme. Une IPv4 a quatre nombres et des points ; une IPv6, des
              deux-points.
            </p>
            <details data-cran="3">
              <summary>Une partie de la solution</summary>
              <p>
                Le résolveur est souvent ta box, 192.168.1.1 ou 192.168.0.1 par exemple. Il te reste
                à recopier les adresses du nom.
              </p>
              <details data-cran="4">
                <summary>La solution entière</summary>
                <p>
                  Sous Windows, « Addresses » donne l’IPv6 et l’IPv4 l’une sous l’autre. Sous macOS,
                  « Address » donne l’IPv4, et la commande avec -type=AAAA l’IPv6 (« has AAAA
                  address »).
                </p>
              </details>
            </details>
          </details>
        </details>
      </div>
      <div data-ecran="La durée de vie, chez toi">
        <p class="accroche">
          Chaque réponse du DNS reste en cache le temps de sa durée de vie. Va lire combien de temps
          il reste à celle de fr.wikipedia.org, puis regarde ce temps baisser.
        </p>
        <div data-os="windows">
          <p>
            <strong>Sous Windows :</strong> dans PowerShell, tape
            <span class="mono">ipconfig /displaydns</span> : la liste des réponses que ta machine
            garde dans son propre cache. Cherche fr.wikipedia.org dans la liste, et note la durée de
            vie qui lui reste, en secondes. Relance la commande une minute plus tard, et note la
            nouvelle valeur.
          </p>
        </div>
        <div data-os="macos">
          <p>
            <strong>Sous macOS :</strong> aucune commande simple ne liste le cache de la machine ;
            tu lis celui du résolveur. Dans le Terminal, tape
            <span class="mono">nslookup -debug fr.wikipedia.org</span>. La sortie est longue : dans
            la partie « ANSWERS », la première ligne « ttl = » donne, en secondes, le temps qu’il
            reste à cette réponse dans le cache du résolveur. Note-le, relance la commande une
            minute plus tard, et note la nouvelle valeur.
          </p>
        </div>
        <details data-cran="1">
          <summary>Un indice</summary>
          <p>La sortie est longue. Comment y retrouver un seul nom, ou une seule ligne ?</p>
          <details data-cran="2">
            <summary>Une piste détaillée</summary>
            <p>
              Sous Windows, chaque bloc de la liste commence par le nom demandé ; la durée de vie
              est quelques lignes plus bas. Sous macOS, cherche le mot « ANSWERS » : les lignes «
              ttl = » viennent juste sous les noms qu’il annonce.
            </p>
            <details data-cran="3">
              <summary>Une partie de la solution</summary>
              <p>
                Si fr.wikipedia.org n’est pas dans la liste de Windows, ouvre la page dans ton
                navigateur, puis relance la commande. Sous macOS, si plusieurs lignes « ttl = »
                paraissent, le nom renvoie à un autre nom, ou la réponse est donnée deux fois :
                prends la première.
              </p>
              <details data-cran="4">
                <summary>La solution entière</summary>
                <p>
                  La ligne « Durée de vie » (Windows) ou « ttl = » (macOS) donne le temps qui reste,
                  en secondes ; une minute plus tard, elle a en général baissé d’une soixantaine. Si
                  elle est remontée, la réponse a expiré entre-temps et le cache en a reçu une neuve
                  : note-le, c’est aussi un résultat.
                </p>
              </details>
            </details>
          </details>
        </details>
      </div>
      <div data-ecran="curl -I, chez toi">
        <p class="accroche">
          Demande une adresse en http, sans s, et lis ce que répond le serveur.
        </p>
        <div data-os="windows">
          <p>
            <strong>Sous Windows :</strong> dans PowerShell, tape
            <span class="mono">curl.exe -I http://wikipedia.org</span>. Écris bien curl.exe : dans
            PowerShell, curl seul désigne une autre commande.
          </p>
        </div>
        <div data-os="macos">
          <p>
            <strong>Sous macOS :</strong> dans le Terminal, tape
            <span class="mono">curl -I http://wikipedia.org</span>.
          </p>
        </div>
        <p>
          Note sur ton papier la ligne de statut et, s’il y en a une, la valeur de l’en-tête
          Location. Si le code n’est pas de la famille 3xx ce jour-là, refais la même commande avec
          http://github.com.
        </p>
        <div class="cadre pour-lire">
          <p class="discret">Deux mots, pour lire :</p>
          <ul>
            <li>3xx : la famille des redirections ; la ressource est ailleurs.</li>
            <li>Location : l’en-tête qui donne la nouvelle adresse.</li>
          </ul>
        </div>
        <details data-cran="1">
          <summary>Un indice</summary>
          <p>Quelle ligne de la sortie porte le code ?</p>
          <details data-cran="2">
            <summary>Une piste détaillée</summary>
            <p>
              La première ligne est la ligne de statut : la version de HTTP, le code, puis son nom
              en anglais. L’en-tête Location peut être écrit en minuscules.
            </p>
            <details data-cran="3">
              <summary>Une partie de la solution</summary>
              <p>
                Un code qui commence par 3 est une redirection : la réponse dit où est la ressource.
                Il te reste à lire où.
              </p>
              <details data-cran="4">
                <summary>La solution entière</summary>
                <p>
                  Attendu : 301 Moved Permanently, avec Location qui donne la même adresse en https.
                  Le serveur renvoie toute demande en http vers sa version protégée.
                </p>
              </details>
            </details>
          </details>
        </details>
      </div>
      <div data-ecran="Deux pannes, provoquées">
        <p class="accroche">
          Une page qui n’existe pas, tu l’as déjà provoquée. Provoque maintenant deux vraies pannes,
          à deux autres étages, et lis ce qu’elles laissent voir.
        </p>

          Le nom nexistepas.example ne peut exister nulle part : l’extension .example est réservée
          aux exemples. Le port 81 de example.com n’offre aucun service web.

          <p>
            <strong>Sous Windows :</strong> dans PowerShell, tape
            <span class="mono">nslookup nexistepas.example</span>. Puis tape
            <span class="mono">curl.exe -I --connect-timeout 10 http://example.com:81</span> : la
            commande abandonne au bout de 10 secondes.
          </p>
        </div>
        <div data-os="macos">
          <p>
            <strong>Sous macOS :</strong> dans le Terminal, tape
            <span class="mono">nslookup nexistepas.example</span>. Puis tape
            <span class="mono">curl -I --connect-timeout 10 http://example.com:81</span> : la
            commande abandonne au bout de 10 secondes.
          </p>
        </div>
        <p>
          Pour chaque commande, note sur ton papier le message obtenu et, à côté, l’étage de la
          chaîne où elle s’est arrêtée.
        </p>
        <div class="cadre pour-lire">
          <p class="discret">Les quatre étages, pour lire :</p>
          <ul>
            <li>Le DNS : le nom devient une adresse IP.</li>
            <li>Le réseau : la connexion s’ouvre jusqu’au serveur.</li>
            <li>Le serveur : il reçoit la requête, la traite et répond.</li>
            <li>Le navigateur : il affiche la page et demande les fichiers qui manquent.</li>
          </ul>
        </div>
        <details data-cran="1">
          <summary>Un indice</summary>
          <p>Dans chaque cas, la commande a-t-elle reçu une adresse ? Et un code ?</p>
          <details data-cran="2">
            <summary>Une piste détaillée</summary>
            <p>
              nslookup ne demande qu’une adresse : s’il n’en reçoit pas, la chaîne n’a même pas
              commencé. curl -I a besoin d’une connexion avant de pouvoir envoyer sa requête.
            </p>
            <details data-cran="3">
              <summary>Une partie de la solution</summary>
              <p>
                nslookup répond que le nom n’existe pas (« Non-existent domain », ou « NXDOMAIN ») :
                aucune adresse. Il te reste l’étage où curl -I s’est arrêté.
              </p>
              <details data-cran="4">
                <summary>La solution entière</summary>
                <p>
                  nslookup : aucune adresse, l’étage est le DNS. curl -I : le nom a donné son
                  adresse, mais la connexion ne s’ouvre pas (« timed out », ou « Failed to connect
                  », selon le jour) et aucun code ne revient : l’étage est le réseau, la connexion
                  jusqu’au serveur.
                </p>
              </details>
            </details>
          </details>
        </details>

        <p class="accroche">Lis la fiche publique d’un nom en .fr, chez son registre.</p>
        <p>
          Ouvre
          <a
            data-lien="https://www.afnic.fr/noms-de-domaine/tout-savoir/whois-trouver-un-nom-de-domaine/"
            >le service WHOIS de l’AFNIC</a

          d’enregistrement, la date de création et l’état du nom.
        </p>
        <div class="cadre pour-lire">
          <p class="discret">Deux mots, pour lire :</p>
          <ul>
            <li>Le registre : l’organisme qui tient la liste des noms d’une extension.</li>
            <li>
              Le bureau d’enregistrement (registrar) : le revendeur chez qui l’on a réservé le nom.
            </li>
          </ul>
        </div>
        <p>
          Pour une personne, les coordonnées sont masquées ; pour une entreprise, il en reste
          davantage. C’est cette fiche que tu lirais si un site entier disparaissait d’un coup : un
          nom expiré ne donne plus d’adresse IP. Si la page de l’AFNIC a changé d’adresse, cherche «
          WHOIS AFNIC » dans un moteur de recherche. Si une rubrique manque, note-le : c’est aussi
          un résultat.
        </p>
        <details data-cran="1">
          <summary>Un indice</summary>
          <p>La fiche a plusieurs rubriques. Laquelle parle de qui a vendu le nom ?</p>
          <details data-cran="2">
            <summary>Une piste détaillée</summary>
            <p>
              Le bureau d’enregistrement s’appelle aussi « registrar » ou « bureau d’enregistrement
              » selon la page. Les dates et l’état sont près du nom.
            </p>
            <details data-cran="3">
              <summary>Une partie de la solution</summary>
              <p>
                Le registre est l’AFNIC elle-même, pour tout nom en .fr. Il te reste à trouver le
                revendeur.
              </p>
              <details data-cran="4">
                <summary>La solution entière</summary>
                <p>
                  Recopie le nom de l’entreprise donnée comme bureau d’enregistrement (registrar),
                  la date de création, et l’état du nom (par exemple « actif »). Le registre,
                  l’AFNIC, tient la liste ; le bureau d’enregistrement a inscrit le nom pour son
                  titulaire.
                </p>
              </details>
            </details>
          </details>
        </details>
      </div>

        <div class="cadre a-retenir">
          <p>
            <strong>L’idée du bloc.</strong> Une page se charge étage par étage, dans un ordre fixe
            : l’URL, le DNS, la connexion TCP, puis TLS en https, la requête, le traitement par le
            serveur, la réponse avec son code, le rendu, puis les requêtes secondaires. Chaque étage
            a ses symptômes : le symptôme dit l’étage, donc où chercher.
          </p>
          <p><strong>Six confusions à éviter.</strong></p>
          <ul>
            <li>
              Pas de requête avant la connexion, pas de connexion avant l’adresse donnée par le DNS.
            </li>
            <li>
              Un nom de domaine nomme, une URL désigne une ressource, une adresse IP désigne une
              machine, qui peut servir plusieurs sites.
            </li>
            <li>
              Un code 4xx est une réponse : le serveur marche, c’est la requête qui est refusée ou
              introuvable.
            </li>
            <li>
              Le cadenas dit que l’échange est chiffré avec le détenteur du nom affiché, rien de son
              honnêteté.
            </li>
            <li>Un cookie porte un jeton ou une préférence, jamais le mot de passe.</li>
            <li>
              Le deep web est ce qui n’est pas indexé ; un darknet, un réseau à part qui demande un
              logiciel dédié.
            </li>
          </ul>
          <p>
            <strong>Vérifier.</strong> nslookup donne le résolveur et les adresses d’un nom (A pour
            l’IPv4, AAAA pour l’IPv6) ; curl -I donne la ligne de statut et les en-têtes ; l’onglet
            Réseau montre chaque requête d’une page. Un changement de DNS met le temps de la durée
            de vie des caches à atteindre tout le monde ; un site neuf qui marche peut ne pas encore
            être indexé.
          </p>
        </div>

        "contexte_ia": "Bloc B07 du module « Écosystème et outils du développeur » (DWWM), troisième bloc de la partie Internet et le Web, après « Internet, réseau de réseaux » et « Le réseau local et l’accès à Internet », avant « Serveur local ». Le fil : Yasmine, 34 ans, en formation de développeuse web sur un PC Windows, ouvre le planning du site de la formation (formation.example.org, adresse 203.0.113.20, IPv6 2001:db8::20) ; Farid, un ami qui suit la même formation, est sur Mac ; le formateur ; Bruno, 52 ans, boulanger, n’apparaît qu’au cas de l’étape d’ensemble.\nLe modèle du bloc : ouvrir une page est une conversation en étapes dans un ordre imposé. Le navigateur, le client, demande l’adresse IP du nom à un résolveur DNS ; il ouvre une connexion TCP vers cette adresse, sur le port du service (80 pour http, 443 pour https, omis de l’URL quand c’est celui par défaut) ; en https, il convient avec le serveur de chiffrer l’échange (TLS) ; il envoie la requête HTTP ; le serveur la traite (lit un fichier ou fait tourner un programme) et renvoie une réponse avec un code ; le navigateur affiche la page (le rendu) puis envoie les requêtes secondaires pour les fichiers qu’elle nomme (CSS pour la présentation, JavaScript pour le comportement, images). Sans adresse IP, pas de connexion ; sans connexion, pas de requête. Ces moments forment quatre étages : le DNS, le réseau (la connexion jusqu’au serveur), le serveur, le navigateur. Relation centrale : la page se charge étage par étage dans un ordre fixe et chaque étage a ses symptômes ; le symptôme dit l’étage, donc où chercher, et on le vérifie (nslookup, curl -I, l’onglet Réseau) au lieu de deviner.\nLes notions. Une URL : schéma, identifiants éventuels suivis de @, hôte, port, chemin, paramètres après ?, fragment après # ; le fragment ne part jamais au serveur. L’hôte se lit de droite à gauche : extension, nom de domaine, sous-domaines ; www n’est qu’un sous-domaine habituel ; dans un nom en .gouv.fr, l’extension est . mande. L’indexation est le recensement des pages par un moteur de recherche : un site neuf qui marche peut ne pas être indexé, ce qui n’a rien à voir avec la propagation DNS. Le deep web est tout ce qui n’est pas indexé (messageries, espaces derrière un mot de passe), ni illégal ni dangereux en soi ; un darknet est un réseau bâti par-dessus Internet qu’on ne rejoint qu’avec un logiciel dédié comme Tor ; le dark web, les sites de ces réseaux. Symptômes : « Impossible de trouver l’adresse IP du serveur », le DNS (vérifier avec nslookup) ; « Délai de connexion dépassé » ou « Connexion refusée » alors que le nom a une adresse IP, le réseau (d’autres sites, puis curl -I) ; un 4xx, le serveur joint qui refuse ou ne trouve pas ; un 5xx, le serveur joint mais en défaut ; une page ancienne ou un fichier bloqué alors que le serveur répond, le navigateur (son cache, une extension).\nLe vocabulaire : « connexion » désigne la connexion TCP, pas le fait de saisir son mot de passe (on dit « s’identifier ») ; « session » ne sert qu’au cookie de session ; « client » désigne le navigateur ou la machine, jamais une personne ; « étage » désigne l’un des quatre groupes.\nLes pièges : un 4xx est une réponse, le serveur marche ; le cadenas ne dit rien de l’honnêteté du site, n’importe quel propriétaire d’un nom obtient un certificat pour ce nom ; le cookie ne garde pas le mot de passe ; la propagation n’est pas l’indexation ; le port écrit dans l’URL l’emporte sur celui du schéma ; la durée de vie se compte depuis la réception, pas depuis le changement.\nUne réponse Solide retrouve la relation en jeu dans le cas posé (l’ordre et la condition de la chaîne, l’étage qu’un symptôme désigne, ce qu’un code dit du serveur, ce que prouve un cadenas, ce que contient un cookie), avec les mots du bloc ou des mots équivalents, sans exiger une formule. Une réponse qui énumère des notions sans les relier au cas n’est pas Solide. Les commandes, les noms d’en-têtes et les codes s’écrivent exactement.",
