      /** Une étape que la série en cours masque : toutes, sauf la série elle-même. */
      const masquee = (etape) => coursMasque() && etape.type !== serieEnCours()
      /** La restitution faite (ou fermée par l'appli) : le bilan peut partir. */
      const restitutionTerminee = () =>
        !serieOuverte.restitution || reponsesFinies('restitution') === manifeste.restitution.length
      /**
       * Une erreur critique repérée attend le bilan : la restitution est faite, et le bilan ne l'a pas
       * encore reçue. Tant qu'il n'est pas envoyé, la consolidation ne commence pas et l'aisance
       * s'arrête : sans cela, une erreur repérée qu'on ne coche jamais n'empêcherait rien (règle V01).
       */
      const bilanAttendu = () => restitutionTerminee() && (etat.aCocher ?? []).length > 0
      /** Ce qui attend le bilan : les erreurs repérées, nommées, et le chemin vers le bilan. */
      function attenteBilan(quoi) {
        const reperees = manifeste.erreurs_critiques.filter((e) =>
          (etat.aCocher ?? []).includes(e.id),
        )
        const bilan = etapes.find((e) => e.type === 'bilan')
        return [
          creer('p', {
            textContent:
              (reperees.length > 1
                ? 'Des erreurs critiques ont été repérées dans tes réponses : '
                : 'Une erreur critique a été repérée dans tes réponses : ') +
              reperees.map((e) => e.libelle).join(' ; ') +
              '. ' +
              quoi +
              ' reprend une fois ton bilan envoyé. ' +
              (reperees.length > 1
                ? 'Elles y sont cochées d’office, et chacune se referme par une réponse solide à une question qui la touche.'
                : 'L’erreur y est cochée d’office, et une réponse solide à une question qui la touche la refermera.'),
          }),
          ...(bilan
            ? [
                creer(
                  'div',
                  { className: 'actions' },
                  creer('button', {
                    type: 'button',
                    className: 'bouton',
                    textContent: 'Aller au bilan',
                    onclick: () => aller(bilan.id),
                  }),
                ),
              ]
            : []),
        ]
      }

      function creer(balise, { dataset = {}, ...proprietes } = {}, ...enfants) {
        const element = Object.assign(document.createElement(balise), proprietes)
        Object.assign(element.dataset, dataset)
        element.append(...enfants)
        return element
      }

      /**
       * Le pied d'une étape : le bouton vers l'étape d'après. Tant qu'une série ouverte n'a pas toutes
       * ses réponses, il reste inactif et dit ce qui manque.
       */
      function piedEtape(etape, libelle = 'Étape suivante') {
        const suivante = etapes[etapes.findIndex((e) => e.id === etape.id) + 1]
        if (!suivante) return []
        const bouton = creer('button', {
          type: 'button',
          className: 'bouton',
          textContent: libelle,
        })
        const raison = creer('p', { className: 'discret' })
        bouton.addEventListener('click', () => {
          if (resteAFaire(etape) === '') aller(suivante.id)
        })
        majPied = () => {
          const reste = resteAFaire(etape)
          bouton.disabled = reste !== ''
          raison.textContent = reste
          raison.hidden = reste === ''
        }
        majPied()
        return [creer('div', { className: 'ecran-nav pied' }, bouton), raison]
      }

      /**
       * Le fil d'étapes de l'aperçu : même forme que celui de l'appli (onglets, ou liste repliable en
       * étroit). Les étapes qui se suivent dans un même moment du cycle font un groupe, sous le nom du
       * moment ; le moment de l'étape courante est marqué.
       */
      function afficherEtapes() {
        const trouvee = etapes.findIndex((etape) => etape.id === etat.etape)
        const courant = trouvee < 0 ? 0 : trouvee
        const fil = $('fil')
        const bascule = $('bascule')
        bascule.replaceChildren(
          creer('span', {
            textContent: momentDe(etapes[courant]).nom + ' · ' + etapes[courant].titre,
          }),
          creer('span', { textContent: fil.dataset.ouvert === 'true' ? '▴' : '▾' }),
        )
        bascule.lastChild.setAttribute('aria-hidden', 'true')
        bascule.setAttribute('aria-expanded', fil.dataset.ouvert)
        bascule.onclick = () => {
          fil.dataset.ouvert = String(fil.dataset.ouvert !== 'true')
          afficherEtapes()
        }
        const groupes = []
        etapes.forEach((etape, k) => {
          const moment = momentDe(etape)
          const dernier = groupes[groupes.length - 1]
          if (dernier && dernier.moment === moment) dernier.etapes.push([etape, k])
          else groupes.push({ moment, etapes: [[etape, k]] })
        })
        $('etapes').replaceChildren(
          ...groupes.map((groupe) =>
            creer(
              'li',
              {
                className: 'moment',
                dataset: { courant: groupe.etapes.some(([, k]) => k === courant) ? 'oui' : 'non' },
              },
              creer('span', { className: 'moment-nom', textContent: groupe.moment.nom }),
              creer(
                'ol',
                {},
                ...groupe.etapes.map(([etape, k]) => {
                  const onglet = creer('button', {
                    type: 'button',
                    className: 'onglet',
                    textContent: etape.titre,
                  })
                  if (k === courant) onglet.setAttribute('aria-current', 'step')
                  onglet.addEventListener('click', () => {
                    fil.dataset.ouvert = 'false'
                    aller(etape.id)
                  })
                  return creer('li', {}, onglet)
                }),
              ),
            ),
          ),
        )
      }

      /** L'objectif d'examen, replié : ce que l'épreuve vérifiera, à ouvrir quand on veut le relire. */
      function objectifReplie() {
        return creer(
          'details',
          { className: 'objectif' },
          creer('summary', { textContent: 'Ce qui sera vérifié' }),
          creer('p', { textContent: manifeste.objectif }),
        )
      }

      /**
       * La carte : d'abord son `<template data-etape>` (où tu es, à quoi ça sert, ce que tu sauras
       * faire), lisible avec « Écouter », puis l'objectif d'examen replié, puis le bouton vers l'étape
       * d'après (Commencer quand la carte ouvre la fiche). Elle n'est pas forcément la première étape :
       * une perception peut la précéder. Sans template (les fiches d'avant) : l'objectif, puis la liste
       * des étapes. `contexte_ia` est destiné au correcteur : il n'est jamais affiché.
       */
      function afficherCarte(carte) {
        const section = creer('section', {}, creer('h2', { textContent: carte.titre }))
        const modele = document.querySelector('template[data-etape="' + carte.id + '"]')
        if (modele) {
          const { ecran, lu } = ecranUnique(modele)
          section.append(barreEcoute(lu), ecran, objectifReplie())
          activerLiens(section)
        } else
          section.append(
            creer('p', { textContent: manifeste.objectif }),
            creer(
              'ul',
              { className: 'plain' },
              ...etapes.map((etape) => creer('li', { textContent: etape.titre })),
            ),
          )
        section.append(
          ...piedEtape(carte, carte.id === etapes[0].id ? 'Commencer' : 'Étape suivante'),
        )
        return section
      }

      /**
       * Les voix françaises, de la meilleure à la moins bonne : Charline (Edge) d'abord, puis les voix
       * naturelles. À rang égal, une voix de France passe avant une voix de Belgique ou du Canada.
       */
      const PREFERENCES_VOIX = [
        /charline/i,
        /denise|vivienne|eloise/i,
        /natural|neural|online|enhanced|premium|améliorée/i,
        /google/i,
      ]
      function rangVoix(voix) {
        const rang = PREFERENCES_VOIX.findIndex((motif) => motif.test(voix.name))
        const france = voix.lang.toLowerCase().replace('_', '-').startsWith('fr-fr')
        return (rang < 0 ? PREFERENCES_VOIX.length : rang) * 2 + (france ? 0 : 1)
      }
      function meilleureVoix(voix) {
        return voix
          .filter((v) => v.lang.toLowerCase().startsWith('fr'))
          .sort((a, b) => rangVoix(a) - rangVoix(b))[0]
      }
      /** Les voix du navigateur : Chrome ne les donne qu'après un premier appel, d'où l'attente. */
      function voixDuNavigateur() {
        const synthese = window.speechSynthesis
        const voix = synthese.getVoices()
        if (voix.length > 0) return Promise.resolve(voix)
        return new Promise((resoudre) => {
          const fin = () => resoudre(synthese.getVoices())
          synthese.addEventListener('voiceschanged', fin, { once: true })
          setTimeout(fin, 1500)
        })
      }
      /** Ce qu'« Écouter » lit dans un écran : son `data-lecture`, sinon ses h3, p et li de premier niveau. */
      const texteLu = (ecran) =>
        ecran.dataset.lecture ??
        Array.from(ecran.querySelectorAll(':scope > h3, :scope > p, :scope > ul > li'))
          .map((n) => n.textContent.replace(/\s+/g, ' ').trim())
          .join(' ')
      /**
       * Le bouton « Écouter » : la synthèse vocale lit l'écran que donne `source` (une fonction : l'écran
       * courant d'une étape à plusieurs écrans, ou le seul écran). `arreter` coupe la lecture.
       */
      function boutonEcouter(source) {
        const ecouter = creer('button', {
          type: 'button',
          className: 'bouton secondaire ecouter',
          textContent: 'Écouter',
        })
        ecouter.dataset.actif = 'non'
        const arreter = () => {
          window.speechSynthesis?.cancel()
          ecouter.textContent = 'Écouter'
          ecouter.dataset.actif = 'non'
        }
        const lire = (voix) => {
          const parole = new SpeechSynthesisUtterance(texteLu(source()))
          const choisie = meilleureVoix(voix)
          parole.lang = choisie?.lang ?? 'fr-FR'
          if (choisie) parole.voice = choisie
          parole.onend = arreter
          parole.onerror = arreter
          window.speechSynthesis.speak(parole)
        }
        ecouter.addEventListener('click', () => {
          if (!window.speechSynthesis) return void (ecouter.textContent = 'Lecture indisponible')
          if (ecouter.dataset.actif === 'oui') return arreter()
          ecouter.dataset.actif = 'oui'
          ecouter.textContent = 'Arrêter'
          // Lire tout de suite si les voix sont là (Safari exige le geste) ; sinon les attendre (Chrome).
          const voix = window.speechSynthesis.getVoices()
          if (voix.length > 0) lire(voix)
          else
            void voixDuNavigateur().then((chargees) => {
              if (ecouter.dataset.actif === 'oui') lire(chargees)
            })
        })
        return { ecouter, arreter }
      }
      /** La barre d'un écran seul : rien que « Écouter », qui lit `lu`. */
      const barreEcoute = (lu) =>
        creer('div', { className: 'ecran-barre' }, boutonEcouter(() => lu).ecouter)
      /**
       * Un template qui tient en un écran : son contenu d'un bloc (`ecran`), et ce qu'« Écouter » lit
       * (`lu`) : le seul `[data-ecran]` s'il y en a un, sinon le bloc entier ; `data-lecture` posé sur le
       * `<template>` l'emporte.
       */
      function ecranUnique(modele) {
        const contenu = modele.content.cloneNode(true)
        const marque = Array.from(contenu.children).find((n) => n.hasAttribute('data-ecran'))
        const ecran = creer('div', { className: 'ecran' }, contenu)
        if (modele.dataset.lecture !== undefined) ecran.dataset.lecture = modele.dataset.lecture
        return { ecran, lu: ecran.dataset.lecture !== undefined ? ecran : (marque ?? ecran) }
      }

      /**
       * Le contenu libre d'une étape : le `<template data-etape="ETx">` de la page, cloné tel quel.
       * Tout ce qui est dans le gabarit (pont, masquage du cours, confiance, aide, messages) est fixe ;
       * ce que dit le bloc et comment il le dit ne l'est pas.
       */
      function afficherLibre(etape) {
        const modele = document.querySelector('template[data-etape="' + etape.id + '"]')
        const section = creer('section', {}, creer('h2', { textContent: etape.titre }))
        if (!modele) {
          section.append(
            creer('p', { className: 'discret', textContent: 'Rien à lire dans cette étape.' }),
          )
          return section
        }
        const contenu = modele.content.cloneNode(true)
        const ecrans = Array.from(contenu.children).filter((n) => n.hasAttribute('data-ecran'))
        if (ecrans.length < 2) {
          // Un seul écran : tout le template d'un bloc, avec « Écouter ».
          const { ecran, lu } = ecranUnique(modele)
          section.append(barreEcoute(lu), ecran)
          activerLiens(section)
          section.append(...piedEtape(etape))
          return section
        }
        // Plusieurs écrans : un seul visible à la fois, les autres restent dans la page (outils déjà montés).
        const suivante = etapes[etapes.findIndex((e) => e.id === etape.id) + 1]
        const titre = creer('p', { className: 'ecran-titre' })
        const compte = creer('span', { className: 'ecran-compte' })
        const remplissage = creer('span')
        const progres = creer('div', { className: 'ecran-progres' }, remplissage)
        progres.setAttribute('aria-hidden', 'true')
        const precedent = creer('button', {
          type: 'button',
          className: 'bouton secondaire',
          textContent: 'Retour',
        })
        const avancer = creer('button', { type: 'button', className: 'bouton' })
        let courant = Math.min(etat.ecrans?.[etape.id] ?? 0, ecrans.length - 1)
        const { ecouter, arreter } = boutonEcouter(() => ecrans[courant])
        const montrer = (k) => {
          arreter()
          courant = k
          etat.ecrans = { ...(etat.ecrans ?? {}), [etape.id]: k }
          enregistrer()
          ecrans.forEach((e, j) => {
            e.hidden = j !== k
          })
          titre.textContent = ecrans[k].dataset.ecran
          compte.textContent = k + 1 + ' / ' + ecrans.length
          remplissage.style.width = ((k + 1) / ecrans.length) * 100 + '%'
          precedent.disabled = k === 0
          avancer.textContent =
            k < ecrans.length - 1 ? 'Suivant' : suivante ? 'Étape suivante' : 'Terminé'
          avancer.disabled = k === ecrans.length - 1 && !suivante
        }
        precedent.addEventListener('click', () => {
          montrer(courant - 1)
          remonter(section)
        })
        avancer.addEventListener('click', () => {
          if (courant < ecrans.length - 1) {
            montrer(courant + 1)
            remonter(section)
          } else if (suivante) aller(suivante.id)
        })
        for (const e of ecrans) e.classList.add('ecran')
        section.append(
          creer('div', { className: 'ecran-barre' }, titre, ecouter, compte),
          progres,
          ...ecrans,
          creer('div', { className: 'ecran-nav' }, precedent, avancer),
        )
        activerLiens(section)
        montrer(courant)
        return section
      }

      /**
       * Un lien externe : `<a data-lien="https://…">texte</a>`. Dans l'appli, c'est elle qui ouvre
       * l'adresse (message du pont) ; hors de l'appli, la page l'ouvre. L'adresse reste écrite à côté,
       * au cas où le navigateur bloquerait l'ouverture.
       */
      function activerLiens(racine) {
        for (const lien of racine.querySelectorAll('a[data-lien]')) {
          const url = lien.dataset.lien
          lien.setAttribute('href', url)
          lien.addEventListener('click', (evenement) => {
            evenement.preventDefault()
            if (mode === 'appli') pont.envoyer('lien.ouvrir', { url })
            else window.open(url, '_blank', 'noopener,noreferrer')
          })
          lien.after(creer('span', { className: 'discret', textContent: ' (' + url + ')' }))
        }
      }

      function afficherPratique() {
        const liste = manifeste.pratique.flatMap((exercice) =>
          exercice.items.map((item, rang) => ({ exercice, item, rang })),
        )
        const reussi = (entree) => Boolean(etat.pratique[entree.item.id]?.reussi)
        const premierRestant = liste.findIndex((entree) => !reussi(entree))
        const index = Math.min(
          Math.max(etat.itemCourant ?? (premierRestant < 0 ? 0 : premierRestant), 0),
          liste.length - 1,
        )
        const { exercice, item } = liste[index]
        let aide = 0
        const etape = etapes.find((e) => e.type === 'pratique')
        const aller_a = (k) => {
          etat.itemCourant = Math.min(Math.max(k, 0), liste.length - 1)
          enregistrer()
          afficher()
          remonter($('contenu'))
        }
        const points = creer(
          'div',
          { className: 'points', role: 'group' },
          ...liste.map((entree, k) => {
            const p = creer('button', {
              type: 'button',
              className: 'point',
              textContent: String(k + 1),
            })
            if (k === index) p.setAttribute('aria-current', 'step')
            p.addEventListener('click', () => aller_a(k))
            return p
          }),
        )
        // L'énoncé de l'item : <template data-item="PR1-1"> dans la page.
        const enonce = document.querySelector('template[data-item="' + item.id + '"]')
        // Un outil marqué data-verifie contrôle la réponse : c'est lui qui dit si l'item est réussi.
        const verifie = Boolean(enonce?.content.querySelector('[data-verifie]'))
        const consigne = creer('div', { className: 'enonce' })
        if (enonce) consigne.append(enonce.content.cloneNode(true))
        activerLiens(consigne)
        const compteur = creer('p', { className: 'discret' })
        const etatItem = creer('span', { className: 'item-etat' })
        const resultat = creer('p', { className: 'discret' })
        const solutionVue = () => Boolean(etat.pratique[item.id]?.solutionVue)
        // La solution vue garde son jour : ce jour-là, l'item ne peut pas compter sans aide ; un autre
        // jour, il repart sans aide (une marque d'avant, sans jour, ne retient plus rien).
        const vueAujourdhui = () => etat.pratique[item.id]?.solutionVue === aujourdhui()
        // Toute aide garde de même son jour : refait le même jour, l'item part avec l'aide la plus forte
        // reçue ce jour-là. On ne le refait pas sans aide dans la foulée, la réponse encore sous les yeux.
        const aideDuJour = () =>
          etat.pratique[item.id]?.aideLe === aujourdhui()
            ? (etat.pratique[item.id].aideMax ?? 0)
            : 0
        /** Note un résultat ; `vue` : l'outil vient de montrer la solution, et l'item s'en souvient. */
        const noter = (ok, aideUtilisee, vue = false) => {
          const avant = etat.pratique[item.id]
          const essais = (avant?.essais ?? 0) + 1
          const aideNotee = Math.max(aideUtilisee, aideDuJour(), vue ? 4 : 0)
          pont.envoyer('pratique.resultat', {
            exercice: exercice.id,
            item: item.id,
            reussi: ok,
            aide: aideNotee,
            essais,
          })
          etat.pratique[item.id] = {
            reussi: ok,
            aide: aideNotee,
            essais,
            solutionVue: vue ? aujourdhui() : (avant?.solutionVue ?? false),
            ...(aideNotee > 0
              ? { aideLe: aujourdhui(), aideMax: aideNotee }
              : { aideLe: avant?.aideLe ?? null, aideMax: avant?.aideMax ?? 0 }),
          }
          enregistrer()
        }
        const envoyer = (ok) => {
          noter(ok, aide)
          const suivant = liste.findIndex((entree, k) => k > index && !reussi(entree))
          if (ok && suivant >= 0) {
            etat.itemCourant = suivant
            enregistrer()
          }
          afficher()
          if (ok && suivant >= 0) remonter($('contenu'))
        }
        const aides = [1, 2, 3, 4].map((cran) => {
          const b = creer('button', {
            type: 'button',
            className: 'bouton secondaire',
            textContent: 'Aide ' + cran,
          })
          b.setAttribute('aria-pressed', 'false')
          b.addEventListener('click', () => {
            aide = aide === cran ? 0 : cran
            aides.forEach((autre, k) => autre.setAttribute('aria-pressed', String(aide === k + 1)))
          })
          return b
        })
        // Après une solution montrée, l'outil de la fiche le lit (`data-solution-vue` sur la boîte de
        // l'item) pour proposer une variante : on refait un cas comparable, pas celui qu'on a vu.
        // `data-item` nomme l'item : l'outil le donne quand il repère une erreur (`fiche:erreur`).
        const boite = creer(
          'div',
          {
            className: 'item',
            dataset: { item: item.id, ...(solutionVue() ? { solutionVue: '' } : {}) },
          },
          creer(
            'div',
            { className: 'item-tete' },
            creer('span', { className: 'item-num', textContent: String(index + 1) }),
            creer('strong', { textContent: exercice.titre }),
            etatItem,
          ),
          consigne,
          creer(
            'details',
            { className: 'aide' },
            creer('summary', { textContent: 'J’ai eu besoin d’aide' }),
            creer('p', {
              className: 'discret',
              textContent:
                'Niveau d’aide utilisé\u00a0: 1 = une question qui t’oriente, 2 = un indice, 3 = l’étape détaillée, 4 = la solution complète.',
            }),
            creer('div', { className: 'actions' }, ...aides),
          ),
          // Ce que la page ne voit pas (une manipulation ailleurs), l'apprenant le déclare.
          ...(verifie
            ? []
            : [
                creer(
                  'div',
                  { className: 'actions' },
                  creer('button', {
                    type: 'button',
                    className: 'bouton',
                    textContent: 'J’ai réussi',
                    onclick: () => envoyer(true),
                  }),
                  creer('button', {
                    type: 'button',
                    className: 'bouton secondaire',
                    textContent: 'Pas réussi',
                    onclick: () => envoyer(false),
                  }),
                ),
              ]),
          resultat,
        )
        /** Le compteur, les points, l'état de l'item et la ligne du résultat, d'après l'état noté. */
        const majItem = () => {
          const fait = etat.pratique[item.id]
          const nbReussis = liste.filter(reussi).length
          compteur.textContent =
            nbReussis + ' réussi' + (nbReussis > 1 ? 's' : '') + ' sur\u00a0' + liste.length + '.'
          liste.forEach((entree, k) => {
            const p = points.children[k]
            p.dataset.etat = reussi(entree) ? 'fait' : 'a-faire'
            p.setAttribute(
              'aria-label',
              'Item ' + (k + 1) + ' sur ' + liste.length + (reussi(entree) ? ', réussi' : ''),
            )
          })
          boite.dataset.fait = fait?.reussi ? 'oui' : 'non'
          // La solution a été montrée et l'item n'est pas refait : on le dit, à la place du résultat.
          const aRefaire = Boolean(fait?.solutionVue) && !fait.reussi
          etatItem.textContent = fait
            ? fait.reussi
              ? 'Réussi'
              : aRefaire
                ? 'Solution vue'
                : 'À refaire'
            : ''
          resultat.className = aRefaire ? 'item-refaire' : 'discret'
          // Réussi avec de l'aide : l'appli ne le compte pas encore, la page dit comment il comptera.
          const pourCompter =
            !fait?.reussi || fait.aide === 0
              ? ''
              : vueAujourdhui()
                ? '. Tu as vu la solution aujourd’hui\u00a0: refais-le un autre jour, sans aide, pour qu’il compte.'
                : aideDuJour() > 0
                  ? '. Tu as eu de l’aide aujourd’hui\u00a0: refais-le un autre jour, sans aide, pour qu’il compte.'
                  : '. Refais-le sans aide pour qu’il compte.'
          resultat.textContent = aRefaire
            ? 'Tu as vu la solution. Refais-la sans la regarder.'
            : fait
              ? 'Envoyé\u00a0: ' +
                (fait.reussi ? 'réussi' : 'non réussi') +
                ', aide ' +
                fait.aide +
                pourCompter
              : ''
        }
        majItem()
        // L'outil émet fiche:verification à chaque réponse vérifiée. L'item se met à jour sans être
        // redessiné : la réponse et le message de l'outil restent à l'écran. Sauf quand l'outil a montré
        // la réponse (aide 4) : rien n'est réussi, l'item se note « solution vue » et se redessine à
        // neuf (l'outil se remonte sur fiche:rendu, son aide repart de zéro), pour être refait sans la
        // regarder. Avec `garder: true`, l'outil montre la solution à l'instant : l'item la note tout de
        // suite, sans se redessiner, et se redessine quand l'outil émet fiche:refaire (« je refais »).
        // Le jour où une aide est reçue, chaque résultat de l'item part avec l'aide la plus forte du jour.
        const redessiner = () => {
          etat.itemCourant = index
          enregistrer()
          afficher()
        }
        consigne.addEventListener('fiche:verification', (evenement) => {
          const detail = evenement.detail ?? {}
          if (!verifie || typeof detail.juste !== 'boolean') return
          const aideOutil = [1, 2, 3, 4].includes(detail.aide) ? detail.aide : 0
          if (aideOutil >= 4) {
            noter(false, 4, true)
            if (detail.garder === true) majItem()
            else redessiner()
            return
          }
          noter(detail.juste, Math.max(aide, aideOutil))
          majItem()
        })
        consigne.addEventListener('fiche:refaire', () => {
          if (verifie && solutionVue()) redessiner()
        })
        return creer(
          'section',
          {},
          creer('h2', { textContent: 'Pratique guidée' }),
          objectifReplie(),
          compteur,
          points,
          boite,
          creer(
            'div',
            { className: 'ecran-nav' },
            creer('button', {
              type: 'button',
              className: 'bouton secondaire',
              textContent: 'Item précédent',
              disabled: index === 0,
              onclick: () => aller_a(index - 1),
            }),
            creer('button', {
              type: 'button',
              className: 'bouton secondaire',
              textContent: 'Item suivant',
              disabled: index === liste.length - 1,
              onclick: () => aller_a(index + 1),
            }),
          ),
          ...piedEtape(etape),
        )
      }

      function afficherAtelier() {
        const section = creer(
          'section',
          {},
          creer('h2', { textContent: 'Atelier' }),
          creer('p', {
            className: 'discret',
            textContent: 'Dis si tu as réussi l’atelier, sans aide ou avec le cran d’aide utilisé.',
          }),
        )
        const resultat = creer('p', {
          className: 'discret',
          textContent: etat.atelier
            ? 'Envoyé\u00a0: ' +
              (etat.atelier.reussi ? 'réussi' : 'non réussi') +
              ', aide ' +
              etat.atelier.aide
            : '',
        })
        const envoyer = (reussi, aide) => {
          pont.envoyer('atelier.resultat', { reussi, predictions_justes: reussi ? 3 : 0, aide })
          etat.atelier = { reussi, aide }
          enregistrer()
          resultat.textContent =
            'Envoyé\u00a0: ' + (reussi ? 'réussi' : 'non réussi') + ', aide ' + aide
        }
        section.append(
          creer(
            'div',
            { className: 'actions' },
            creer('button', {
              type: 'button',
              className: 'bouton',
              textContent: 'Atelier réussi sans aide',
              onclick: () => envoyer(true, 0),
            }),
            creer('button', {
              type: 'button',
              className: 'bouton secondaire',
              textContent: 'Atelier pas réussi',
              onclick: () => envoyer(false, 0),
            }),
          ),
          resultat,
          ...piedEtape(etapes.find((e) => e.type === 'atelier')),
        )
        return section
      }

      /**
       * Une réponse déjà envoyée, lisible. Sa correction n'apparaît qu'une fois la série finie (règle
       * M01) : avant, elle soufflerait les questions suivantes. Finie, une réponse qui n'est pas Solide
       * peut se compléter, une fois, après sa correction (« Compléter ma réponse ») ; ce second tour ne
       * compte pas pour le statut.
       */
      function carteEnvoyee(question, serie) {
        const carte = creer(
          'div',
          { className: 'item', dataset: { fait: 'oui' } },
          creer('strong', { textContent: question.question }),
          creer('p', {
            className: 'reponse-envoyee',
            textContent: etat.envoyees[question.id].reponse,
          }),
        )
        const gardee = etat.corrigees?.[question.id]
        if (serieEnCours() === serie) {
          carte.append(
            creer('p', { className: 'discret', textContent: 'Corrigée à la fin de la série.' }),
          )
          return carte
        }
        if (!gardee) return carte
        const sortie = creer('div', { className: 'sortie' })
        sortie.setAttribute('aria-live', 'polite')
        sortie.append(bulleCorrection(gardee.premiere), ...accordSur(gardee.premiere))
        carte.append(sortie)
        if (gardee.relance)
          carte.append(
            creer('p', { className: 'reponse-envoyee', textContent: gardee.relance.reponse }),
            bulleCorrection(gardee.relance.correction),
            ...accordSur(gardee.relance.correction),
          )
        else if (gardee.premiere.niveau !== 'solide' && serieOuverte[serie]) {
          const completer = creer(
            'div',
            { className: 'actions' },
            creer('button', {
              type: 'button',
              className: 'bouton secondaire',
              textContent: 'Compléter ma réponse',
              onclick: () =>
                completer.replaceWith(afficherQuestion(serie, question, { relance: true })),
            }),
          )
          carte.append(completer)
        }
        return carte
      }

      /** Quand la consolidation s'ouvre, d'après le dernier statut de l'appli : l'heure, et le jour s'il change. */
      function quandConsolidation() {
        const apres = Array.isArray(dernierStatut?.manque)
          ? dernierStatut.manque.find((m) => m.code === 'consolidation_trop_tot')?.apres
          : undefined
        const date = apres ? new Date(apres) : null
        if (!date || Number.isNaN(date.getTime()))
          return 'La consolidation n’est pas encore ouverte\u00a0: elle s’ouvre un moment après ta restitution, reviens plus tard.'
        const heure = date.getHours() + '\u00a0h\u00a0' + String(date.getMinutes()).padStart(2, '0')
        const jour =
          date.toDateString() === new Date().toDateString()
            ? ''
            : 'le ' +
              date.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) +
              ' '
        return 'La consolidation s’ouvre ' + jour + 'à ' + heure + '\u00a0: reviens à ce moment-là.'
      }

      function afficherSerie(serie, titre) {
        const etape = etapes.find((e) => e.type === serie)
        const total = questions(serie).length
        const finie = reponsesFinies(serie) === total
        const envoyees = questions(serie).filter((q) => etat.envoyees[q.id])
        if (!serieOuverte[serie]) {
          const dire = () =>
            finie
              ? titre + ' terminée\u00a0: tes ' + total + ' réponses sont envoyées.'
              : serie === 'consolidation'
                ? quandConsolidation()
                : 'Cette série n’est pas ouverte.'
          const avis = creer('p', { textContent: dire() })
          // L'heure d'ouverture vient du statut, qui arrive juste après le premier affichage.
          majQuand = () => {
            avis.textContent = dire()
          }
          return creer(
            'section',
            {},
            creer('h2', { textContent: titre }),
            avis,
            ...envoyees.map((question) => carteEnvoyee(question, serie)),
            ...piedEtape(etape),
          )
        }
        // Série ouverte, une question à la fois (règle I01) : les réponses envoyées se lisent, puis la
        // première question qui attend sa réponse ; la suivante paraît sous elle quand elle est finie.
        // Une question qui touche une erreur critique ouverte se repose (restitution rouverte).
        const refaire = aRefaire(serie)
        const section = creer('section', {}, creer('h2', { textContent: titre }))
        const aRefermer = erreursAReprendre(refaire).length
        if (aRefermer > 0)
          section.append(
            creer('p', {
              textContent:
                (aRefermer > 1
                  ? aRefermer +
                    ' erreurs critiques sont cochées dans ton bilan. Pour chacune, réponds'
                  : 'Une erreur critique est cochée dans ton bilan. Réponds') +
                ' de nouveau à une question marquée «\u00a0À reprendre\u00a0»\u00a0: une réponse solide la referme.',
            }),
          )
        else if (finie)
          section.append(
            creer('p', {
              textContent: titre + ' terminée\u00a0: tes ' + total + ' réponses sont envoyées.',
            }),
          )
        for (const question of questions(serie)) {
          if (etat.envoyees[question.id] && !refaire.includes(question))
            section.append(carteEnvoyee(question, serie))
        }
        const aPoser = questions(serie).filter((q) => !etat.envoyees[q.id] || refaire.includes(q))
        const pied = piedEtape(etape)
        // Sans support : la série commence sur « Commencer », qui masque le cours jusqu'à la dernière
        // réponse. Une erreur rouverte se reprend de même, quand l'apprenant a revu le cours. Une erreur
        // repérée depuis la restitution passe d'abord par le bilan.
        if (
          aPoser.length > 0 &&
          !etat.enCours?.[serie] &&
          serie === 'consolidation' &&
          bilanAttendu()
        ) {
          section.append(...attenteBilan('La consolidation'), ...pied)
          return section
        }
        if (aPoser.length > 0 && !etat.enCours?.[serie]) {
          section.append(
            creer('p', {
              textContent:
                (serie === 'restitution' ? 'La restitution' : 'La consolidation') +
                ' se fait sans le cours : dès que tu commences, il est masqué jusqu’à ta dernière réponse, comme le reste de la fiche. Tes réponses sont corrigées à la fin de la série, pour qu’une correction ne souffle pas la question suivante.',
            }),
            creer(
              'div',
              { className: 'actions' },
              creer('button', {
                type: 'button',
                className: 'bouton',
                textContent: 'Commencer',
                onclick: () => {
                  etat.enCours = { ...(etat.enCours ?? {}), [serie]: true }
                  etat.retourCours = false
                  enregistrer()
                  afficher()
                },
              }),
            ),
            ...pied,
          )
          return section
        }
        section.append(...pied)
        let rang = 0
        const poserLaSuivante = () => {
          const question = aPoser[rang]
          rang += 1
          if (!question) {
            // La dernière réponse est là : le cours se rouvre à la prochaine étape affichée.
            if (etat.enCours?.[serie]) {
              etat.enCours = { ...etat.enCours, [serie]: false }
              enregistrer()
            }
            // Une réponse vient d'être envoyée : la série se redessine avec toutes ses corrections.
            if (rang > 1) {
              afficher()
              remonter($('contenu'))
            }
            return
          }
          const bloc = afficherQuestion(
            serie,
            question,
            { reprise: refaire.includes(question) },
            poserLaSuivante,
          )
          if (pied.length > 0) pied[0].before(bloc)
          else section.append(bloc)
        }
        poserLaSuivante()
        return section
      }

      const LIBELLES_NIVEAU = {
        solide: 'Solide',
        partiel: 'Partiel',
        fragile: 'Fragile',
        pas_encore: 'Pas encore',
      }

      const LIBELLES_RAISON = {
        relance: 'Relance',
        avec_support: 'Avec support',
        recopiee: 'Recopiée',
        non_verifiee: 'Non vérifiée',
      }

      /**
       * La correction d'une réponse : BulleCorrection de l'appli, et son badge quand la réponse ne
       * compte pas pour le statut (une réponse recopiée ne referme pas d'erreur, par exemple).
       */
      function bulleCorrection(correction) {
        return creer(
          'div',
          { className: 'correction', dataset: { niveau: correction.niveau } },
          creer('strong', {
            textContent: LIBELLES_NIVEAU[correction.niveau] ?? correction.niveau,
          }),
          creer('p', { textContent: correction.message }),
          ...(!correction.compte && correction.raison_non_compte
            ? [
                creer('span', {
                  className: 'badge-compte',
                  textContent:
                    'Ne compte pas · ' +
                    (LIBELLES_RAISON[correction.raison_non_compte] ?? correction.raison_non_compte),
                }),
              ]
            : []),
        )
      }

      /** Ce que la page garde d'une correction pour l'afficher plus tard, même après un rechargement. */
      const resumeCorrection = (correction) => ({
        id: correction.id,
        niveau: correction.niveau,
        message: correction.message,
        compte: correction.compte,
        raison_non_compte: correction.raison_non_compte ?? null,
        tour: correction.tour,
        echantillon: Boolean(correction.echantillon),
      })

      /**
       * Une correction tirée au sort : l'apprenant dit, une fois, si le niveau lui semble juste. La
       * réponse est gardée avec la correction : l'avis n'est pas redemandé à la visite suivante.
       */
      function accordSur(correction) {
        if (!correction.echantillon || correction.avis !== undefined) return []
        const intitule = creer('span', {
          id: 'accord-' + correction.id,
          textContent: 'D’accord avec ce niveau\u00a0?',
        })
        const accord = creer(
          'div',
          { className: 'accord' },
          intitule,
          creer(
            'div',
            { className: 'actions' },
            ...[
              [true, 'Oui'],
              [false, 'Non'],
            ].map(([daccord, libelle]) =>
              creer('button', {
                type: 'button',
                className: 'bouton secondaire',
                textContent: libelle,
                onclick: () => {
                  pont.envoyer('correction.accord', { correction: correction.id, accord: daccord })
                  correction.avis = daccord
                  enregistrer()
                  accord.replaceWith(
                    creer('p', { className: 'discret', textContent: 'Merci, c’est noté.' }),
                  )
                },
              }),
            ),
          ),
        )
        accord.setAttribute('role', 'group')
        accord.setAttribute('aria-labelledby', intitule.id)
        return [accord]
      }

      /**
       * Une question de la série, à répondre. `reprise` : elle a déjà sa réponse mais touche une erreur
       * critique ouverte ; on y répond de nouveau, depuis zéro (nouvelle tentative, premier tour).
       * Pendant la série, une réponse envoyée n'affiche pas sa correction (règle M01) : la page la garde
       * et la montre à la fin de la série, avec toutes les autres. `relance` : la série finie, l'apprenant
       * complète une réponse qui n'était pas Solide, après sa correction ; ce second tour ne compte pas
       * pour le statut, et sa correction s'affiche aussitôt. `apres` : ce qui suit quand elle est finie
       * (la question suivante de la série).
       */
      function afficherQuestion(
        serie,
        question,
        { reprise = false, relance = false } = {},
        apres = () => {},
      ) {
        const premiere = etat.corrigees?.[question.id]?.premiere
        const cle = (relance ? 'relance-' : 'rep-') + question.id
        const zone = creer('textarea', {
          id: cle,
          value: relance ? etat.envoyees[question.id].reponse : '',
        })
        let colle = false
        zone.addEventListener('paste', () => {
          colle = true
        })
        const radios = [
          ['sur', 'Sûr'],
          ['hesitant', 'Hésitant'],
          ['hasard', 'Au hasard'],
        ].map(([valeur, libelle]) => ({
          libelle,
          entree: creer('input', { type: 'radio', name: 'conf-' + cle, value: valeur }),
        }))
        const confiance = creer(
          'fieldset',
          { className: 'choix' },
          creer('legend', { textContent: 'Ta confiance' }),
          ...radios.map(({ libelle, entree }) => creer('label', {}, entree, libelle)),
        )
        const message = creer('p', { className: 'erreur', role: 'alert' })
        const sortie = creer('div', { className: 'sortie' })
        sortie.setAttribute('aria-live', 'polite')
        const bouton = creer('button', {
          type: 'button',
          className: 'bouton',
          textContent: relance ? 'Envoyer le complément' : 'Envoyer',
        })
        const figer = () => {
          zone.disabled = true
          for (const { entree } of radios) entree.disabled = true
        }
        bouton.addEventListener('click', async () => {
          const choisie = confiance.querySelector('input:checked')
          if (zone.value.trim() === '')
            return void (message.textContent = 'Écris une réponse avant d’envoyer.')
          if (!choisie) return void (message.textContent = 'Choisis ta confiance avant d’envoyer.')
          message.textContent = ''
          bouton.disabled = true
          try {
            const correction = await pont.demanderCorrection({
              serie,
              question: question.id,
              reponse: zone.value,
              confiance: choisie.value,
              relance: relance ? premiere.message : '',
              support: { colle, retour_cours: etat.retourCours },
            })
            noterReperees(question.id, correction.erreurs_critiques)
            figer()
            bouton.hidden = true
            if (relance) {
              const gardee = resumeCorrection(correction)
              etat.corrigees = {
                ...etat.corrigees,
                [question.id]: {
                  ...etat.corrigees[question.id],
                  relance: { reponse: zone.value, correction: gardee },
                },
              }
              enregistrer()
              sortie.replaceChildren(bulleCorrection(gardee), ...accordSur(gardee))
              return
            }
            etat.corrigees = {
              ...(etat.corrigees ?? {}),
              [question.id]: { premiere: resumeCorrection(correction), relance: null },
            }
            etat.envoyees[question.id] = { reponse: zone.value, confiance: choisie.value }
            enregistrer()
            sortie.replaceChildren(
              creer('p', {
                className: 'discret',
                textContent:
                  'Envoyée. Sa correction s’affichera à la fin de la série, pour ne pas souffler les questions suivantes.',
              }),
            )
            majPied()
            apres()
          } catch (erreur) {
            message.textContent =
              'Correction impossible\u00a0: ' +
              (erreur && erreur.detail ? erreur.detail : erreur.message)
            bouton.disabled = false
          }
        })
        if (relance)
          return creer(
            'div',
            { className: 'relance' },
            creer('label', {
              htmlFor: zone.id,
              textContent:
                'Complète ta réponse, d’après sa correction. Ce complément ne compte pas pour le statut.',
            }),
            zone,
            confiance,
            creer('div', { className: 'actions' }, bouton),
            message,
            sortie,
          )
        const ouvertes = erreursOuvertes()
        const touchees = manifeste.erreurs_critiques.filter(
          (e) => (question.erreurs ?? []).includes(e.id) && ouvertes.includes(e.id),
        )
        return creer(
          'div',
          { className: 'item', dataset: reprise ? { fait: 'reprise' } : {} },
          ...(reprise
            ? [
                creer('p', {
                  className: 'item-reprise',
                  textContent: 'À reprendre\u00a0: ' + touchees.map((e) => e.libelle).join(' ; '),
                }),
              ]
            : []),
          creer('label', { htmlFor: zone.id }, creer('strong', { textContent: question.question })),
          zone,
          confiance,
          creer('div', { className: 'actions' }, bouton),
          message,
          sortie,
        )
      }

      /** Les erreurs critiques ouvertes pour l'appli ; hors de l'appli, celles du dernier bilan. */
      function erreursOuvertes() {
        if (Array.isArray(dernierStatut?.manque))
          return dernierStatut.manque.find((m) => m.code === 'erreur_ouverte')?.erreurs ?? []
        return etat.bilan?.ids ?? []
      }

      /**
       * Les questions de restitution déjà répondues qui touchent une erreur critique ouverte. Une erreur
       * ouverte rouvre la restitution, et une réponse solide à une question qui la touche la referme.
       * Seulement dans l'appli : hors de l'appli, rien ne referme une erreur.
       */
      function aRefaire(serie) {
        if (mode !== 'appli' || serie !== 'restitution' || !serieOuverte.restitution) return []
        const ouvertes = erreursOuvertes()
        return questions(serie).filter(
          (q) => etat.envoyees[q.id] && (q.erreurs ?? []).some((e) => ouvertes.includes(e)),
        )
      }
      /** Les erreurs ouvertes qu'une de ces questions peut refermer. */
      const erreursAReprendre = (refaire) =>
        erreursOuvertes().filter((e) => refaire.some((q) => (q.erreurs ?? []).includes(e)))

      /**
       * Le bilan : ce qui est fait dans la fiche, puis les erreurs critiques du bloc à cocher. Une
       * erreur ouverte, ou repérée par le correcteur depuis le dernier bilan, est cochée et ne se
       * décoche pas : seule une réponse solide à une question qui la touche la referme (règles P01 et
       * V01). On ne l'envoie qu'une fois la restitution faite.
       */
      function afficherBilan() {
        // Le résultat d'un bilan se lit là où on l'a envoyé : à la visite suivante, il serait périmé
        // (une réponse a pu refermer une erreur depuis). Un bilan encore en route garde sa réponse.
        if (bilanEnvoye !== null && (bilanEnvoye.statut !== null || bilanEnvoye.refus !== null))
          bilanEnvoye = null
        const totalRestitution = manifeste.restitution.length
        const restitutionFaite =
          !serieOuverte.restitution || reponsesFinies('restitution') === totalRestitution
        const ligne = (fait, texte) =>
          creer('li', { textContent: texte, dataset: { fait: fait ? 'oui' : 'non' } })
        // La ligne de la restitution change quand une erreur s'ouvre ou se ferme (statut reçu).
        const ligneRestitution = ligne(false, '')
        const direRestitution = () => {
          const aRefermer = erreursAReprendre(aRefaire('restitution')).length
          ligneRestitution.dataset.fait = restitutionFaite && aRefermer === 0 ? 'oui' : 'non'
          ligneRestitution.textContent = !restitutionFaite
            ? 'Restitution\u00a0: ' +
              pluriel(reponsesFinies('restitution'), 'question terminée', 'questions terminées') +
              ' sur\u00a0' +
              totalRestitution +
              '.'
            : aRefermer === 0
              ? 'Restitution faite.'
              : aRefermer === 1
                ? 'Restitution faite. Pour refermer l’erreur cochée, réponds de nouveau à une question qui la touche.'
                : 'Restitution faite. Pour refermer les ' +
                  aRefermer +
                  ' erreurs cochées, réponds de nouveau à une question sur chacune.'
          return aRefermer
        }
        const lignes = [ligneRestitution]
        const totalConsolidation = manifeste.consolidation.length
        if (totalConsolidation > 0) {
          const finies = reponsesFinies('consolidation')
          lignes.push(
            serieOuverte.consolidation || finies > 0
              ? ligne(
                  finies === totalConsolidation,
                  finies === totalConsolidation
                    ? 'Consolidation faite.'
                    : 'Consolidation\u00a0: ' + finies + ' sur\u00a0' + totalConsolidation + '.',
                )
              : ligne(false, 'Consolidation\u00a0: pas encore ouverte.'),
          )
        }
        const items = manifeste.pratique.flatMap((exercice) => exercice.items)
        if (items.length > 0) {
          const reussis = items.filter((item) => etat.pratique[item.id]?.reussi)
          const sansAide = reussis.filter((item) => etat.pratique[item.id].aide === 0).length
          lignes.push(
            ligne(
              reussis.length === items.length && sansAide === items.length,
              'Pratique\u00a0: ' +
                pluriel(reussis.length, 'item réussi', 'items réussis') +
                ' sur\u00a0' +
                items.length +
                (reussis.length > 0 ? ', dont ' + sansAide + ' sans aide.' : '.'),
            ),
          )
        }
        if (etapes.some((e) => e.type === 'atelier'))
          lignes.push(
            ligne(
              Boolean(etat.atelier?.reussi),
              etat.atelier
                ? 'Atelier\u00a0: ' + (etat.atelier.reussi ? 'réussi.' : 'pas réussi.')
                : 'Atelier\u00a0: pas encore fait.',
            ),
          )

        const reperees = new Set(Object.values(etat.erreurs ?? {}).flat())
        /** Cochée d'office et verrouillée : ouverte, ou repérée depuis le dernier bilan. */
        const verrouillee = (id) =>
          erreursOuvertes().includes(id) || (etat.aCocher ?? []).includes(id)
        const cases = manifeste.erreurs_critiques.map((erreur) =>
          creer('input', {
            type: 'checkbox',
            name: 'erreur',
            value: erreur.id,
            checked: verrouillee(erreur.id),
            disabled: verrouillee(erreur.id),
          }),
        )
        const majCases = () => {
          for (const c of cases) {
            c.disabled = verrouillee(c.value)
            if (c.disabled) c.checked = true
          }
        }
        const erreurs = creer(
          'fieldset',
          { className: 'cases' },
          creer('legend', { textContent: 'Les erreurs critiques du bloc' }),
          creer('p', {
            className: 'discret',
            textContent:
              'Coche celles que tu as faites et que tu dois encore revoir. Une erreur cochée met le bloc «\u00a0À reprendre\u00a0», quel que soit le reste. Une erreur cochée, ou repérée dans tes réponses, reste cochée\u00a0: seule une réponse solide à une question qui la touche la referme.',
          }),
          ...manifeste.erreurs_critiques.map((erreur, k) =>
            creer(
              'label',
              {},
              cases[k],
              creer(
                'span',
                {},
                erreur.libelle,
                ...(reperees.has(erreur.id)
                  ? [
                      creer('span', {
                        className: 'discret',
                        textContent: ' Repérée dans tes réponses.',
                      }),
                    ]
                  : []),
              ),
            ),
          ),
        )
        const bouton = creer('button', { type: 'button', className: 'bouton' })
        // Déjà envoyé, il ne se renvoie que si les cases disent autre chose que la référence : les
        // erreurs encore ouvertes, que donnent le dernier bilan ou le dernier statut de l'appli.
        let reference = erreursOuvertes()
        const cochees = () => cases.filter((c) => c.checked).map((c) => c.value)
        const differe = () => {
          const ids = cochees()
          return ids.length !== reference.length || ids.some((id) => !reference.includes(id))
        }
        const direBouton = () => {
          const envoye = restitutionFaite && Boolean(etat.bilan) && !differe()
          bouton.disabled = !restitutionFaite || envoye
          bouton.textContent = envoye ? 'Bilan envoyé' : 'Envoyer le bilan'
        }
        direBouton()
        const retour = creer('p', { className: 'retour', role: 'status' })
        const restitution = etapes.find((e) => e.type === 'restitution')
        const actions = creer('div', { className: 'ecran-nav pied' }, bouton)
        if (etat.bilan && restitutionFaite)
          retour.textContent =
            mode === 'appli'
              ? 'Ton dernier bilan est envoyé. Modifie les cases et renvoie-le si ça a changé.'
              : 'Ton dernier bilan est noté dans cette page (hors de l’appli, rien n’est envoyé).'
        if (!restitutionFaite) retour.textContent = 'Termine la restitution pour envoyer ton bilan.'
        // Vers la restitution : pour la finir, ou pour refermer une erreur ouverte.
        const versRestitution = creer('button', {
          type: 'button',
          className: 'bouton secondaire',
          textContent: 'Aller à la restitution',
          onclick: () => aller(restitution.id),
        })
        if (restitution) actions.prepend(versRestitution)
        const majRestitution = () => {
          const aRefermer = direRestitution()
          versRestitution.hidden = restitutionFaite && aRefermer === 0
        }
        majRestitution()
        erreurs.addEventListener('change', direBouton)
        const direStatut = () => {
          if (bilanEnvoye === null) return
          if (bilanEnvoye.refus) {
            retour.textContent = 'Le bilan n’est pas parti\u00a0: ' + bilanEnvoye.refus
            // Refusé : le bilan qui fait foi reste le précédent, et les cases cochées peuvent repartir.
            etat.bilan = bilanEnvoye.precedent
            etat.aCocher = [...new Set([...(etat.aCocher ?? []), ...bilanEnvoye.aCocher])]
            enregistrer()
            reference = erreursOuvertes()
            return
          }
          if (mode !== 'appli') {
            retour.textContent = 'Bilan noté dans cette page (hors de l’appli, rien n’est envoyé).'
            return
          }
          retour.textContent = bilanEnvoye.statut
            ? 'Statut recalculé\u00a0: ' +
              (LIBELLES_STATUT[bilanEnvoye.statut] ?? bilanEnvoye.statut) +
              '.'
            : 'Le statut se recalcule…'
        }
        bouton.addEventListener('click', () => {
          if (!restitutionFaite) return
          const ids = cochees()
          const id = pont.envoyer('bilan.erreurs', { ids })
          if (!id) {
            retour.textContent = 'Le bilan n’a pas pu partir. Réessaie dans un instant.'
            return
          }
          bilanEnvoye = {
            id,
            statut: null,
            refus: null,
            precedent: etat.bilan,
            aCocher: etat.aCocher ?? [],
          }
          etat.bilan = { ids }
          // Envoyées, les erreurs repérées sont ouvertes : c'est le statut qui les verrouille désormais.
          etat.aCocher = []
          enregistrer()
          reference = ids
          direBouton()
          direStatut()
        })
        majBilan = () => {
          // Un refus remet d'abord le bilan précédent : les cases refusées restent alors cochées.
          direStatut()
          // Des cases que l'apprenant n'a pas changées suivent les erreurs encore ouvertes.
          if (!differe()) {
            reference = erreursOuvertes()
            for (const c of cases) c.checked = reference.includes(c.value)
          }
          majCases()
          majRestitution()
          direBouton()
        }
        return creer(
          'section',
          {},
          creer('h2', { textContent: 'Bilan' }),
          creer('h3', { textContent: 'Ce que tu as fait' }),
          creer('ul', { className: 'bilan-liste' }, ...lignes),
          erreurs,
          actions,
          retour,
        )
      }

      function afficher() {
        // Une lecture en cours ne déborde pas sur l'étape suivante.
        window.speechSynthesis?.cancel()
        majPied = () => {}
        majBilan = () => {}
        majQuand = () => {}
        afficherEtapes()
        const etape = etapes.find((e) => e.id === etat.etape) ?? etapes[0]
        let vue
        if (masquee(etape)) {
          vue = creer(
            'section',
            {},
            creer('h2', { textContent: etape.titre }),
            creer('p', {
              textContent:
                'Masqué\u00a0: ' +
                (serieEnCours() === 'consolidation' ? 'la consolidation' : 'la restitution') +
                ' se fait sans le cours. Cette étape s’ouvrira après ta dernière réponse.',
            }),
            creer('button', {
              type: 'button',
              className: 'bouton secondaire',
              textContent: 'Revenir au cours',
              onclick: () => {
                etat.retourCours = true
                enregistrer()
                afficher()
              },
            }),
            creer('p', {
              className: 'discret',
              textContent: 'Tes prochaines réponses seront alors marquées « retour au cours ».',
            }),
          )
        } else if (etape.type === 'aisance' && bilanAttendu())
          // L'aisance compte pour « Maîtrisé » : une erreur repérée passe d'abord par le bilan.
          vue = creer(
            'section',
            {},
            creer('h2', { textContent: etape.titre }),
            ...attenteBilan('L’aisance'),
            ...piedEtape(etape),
          )
        else
          vue =
            (ETAPES_LIBRES.includes(etape.type)
              ? () => afficherLibre(etape)
              : {
                  carte: () => afficherCarte(etape),
                  pratique: afficherPratique,
                  atelier: afficherAtelier,
                  restitution: () => afficherSerie('restitution', 'Restitution'),
                  consolidation: () => afficherSerie('consolidation', 'Consolidation'),
                  bilan: afficherBilan,
                }[etape.type])?.() ??
            creer('p', {
              className: 'discret',
              textContent: 'Cette étape n’est pas dans cette fiche.',
            })
        $('contenu').replaceChildren(vue)
        // Point d'accroche des fiches : le HTML libre de l'étape est en place, son script peut l'animer.
        // Les traces gardées (fiche:trace) lui reviennent avec.
        document.dispatchEvent(
          new CustomEvent('fiche:rendu', { detail: { etape, traces: { ...(etat.traces ?? {}) } } }),
        )
      }

      async function demarrer() {
        // Chrome charge ses voix à la première demande : on la fait tôt, « Écouter » les trouve prêtes.
        window.speechSynthesis?.getVoices()
        if (!pont) {
          $('mode').textContent = 'Pont indisponible'
          return
        }
        pont.surStatut(({ statut, manque }) => {
          dernierStatut = { statut, manque }
          $('statut').textContent = 'Statut\u00a0: ' + (LIBELLES_STATUT[statut] ?? statut)
          if (bilanEnvoye !== null && bilanEnvoye.statut === null) bilanEnvoye.statut = statut
          majBilan()
          majQuand()
        })
        pont.surErreur((erreur) => {
          $('statut').textContent = 'Erreur\u00a0: ' + erreur.detail
          if (bilanEnvoye !== null && erreur.message_id === bilanEnvoye.id) {
            bilanEnvoye.refus = erreur.detail
            majBilan()
            return
          }
          // La barre est cachée dans l'appli : l'erreur s'affiche au-dessus de l'étape.
          $('avis').textContent = 'Erreur\u00a0: ' + erreur.detail
          $('avis').hidden = false
        })
        pont.surEtape((id) => {
          if (etapes.some((e) => e.id === id)) aller(id)
        })
        const depart = await pont.demarrer({
          manifeste: { bloc: manifeste.bloc, version: manifeste.version },
          autonome,
        })
        mode = depart.mode
        if (depart.init?.theme) document.documentElement.dataset.theme = depart.init.theme
        // Hors de l'appli (aperçu dans une page), le fil d'étapes de la fiche est le seul : on le rend.
        if (mode !== 'appli') delete document.documentElement.dataset.integree
        $('mode').textContent = mode === 'appli' ? 'Dans l’appli' : 'Mode autonome'
        if (depart.init) {
          serieOuverte = depart.init.serie_ouverte
          dernierStatut ??= { statut: depart.init.statut, manque: null }
          $('statut').textContent =
            'Statut\u00a0: ' + (LIBELLES_STATUT[depart.init.statut] ?? depart.init.statut)
        }
        pont.surInit((init) => {
          const consolidationChangee =
            serieOuverte.consolidation !== init.serie_ouverte.consolidation
          serieOuverte = init.serie_ouverte
          // Redessiner efface une réponse en cours d'écriture : seulement quand la consolidation s'ouvre.
          if (consolidationChangee) afficher()
          else {
            majPied()
            majBilan()
          }
        })
        if (depart.etat && typeof depart.etat === 'object') etat = { ...etat, ...depart.etat }
        afficher()
      }
      void demarrer()
    </script>
  </body>
</html>
