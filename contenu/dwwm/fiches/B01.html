        --couleur-accent-sur-fond: light-dark(#ffffff, #0f1a28);
        --couleur-accent-douce: light-dark(#e8eff8, #1f2b3a);
        --couleur-succes: light-dark(#276f50, #5dc196);
        --couleur-alerte: light-dark(#95620a, #e0ac4a);
        --couleur-erreur: light-dark(#ae3846, #ee8591);
        --couleur-focus: light-dark(#2b6cb0, #8bb9f5);
        --effet-ombre-carte: light-dark(#1b1f24, #000000);
        --espacement-4: 0.25rem;
        --espacement-8: 0.5rem;
        --espacement-12: 0.75rem;
        --espacement-16: 1rem;
        --espacement-20: 1.25rem;
        --espacement-24: 1.5rem;
        --espacement-32: 2rem;
        --espacement-48: 3rem;
        --rayon-champ: 0.625rem;
        --rayon-carte: 0.875rem;
        --rayon-option: 0.375rem;
        --duree-transition: 160ms;
        --focus-anneau: 0 0 0 2px var(--couleur-fond), 0 0 0 4px var(--couleur-focus);
        --ombre-option: 0 2px 6px color-mix(in srgb, var(--effet-ombre-carte) 8%, transparent);
        --hauteur-champ: 48px;
        --hauteur-bouton: 48px;
        --cible-tactile-min: 44px;
        --largeur-lecture: 62ch;
        --police-texte: 'Inter', system-ui, sans-serif;
        --police-code: 'JetBrains Mono', ui-monospace, monospace;
      }
      /* Le thème choisi dans l'appli (message etat.init) l'emporte sur le réglage du téléphone. */
      :root[data-theme='clair'] {
        color-scheme: light;
      }
      :root[data-theme='sombre'] {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: var(--couleur-fond);
        color: var(--couleur-encre);
        font-family: var(--police-texte);
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5rem;
      }
      button,
      summary,
      label {
        touch-action: manipulation;
      }

      /* Barre et fil d'étapes : montrés seulement hors de l'appli (aperçu), qui a les siens. */
      .barre {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8) var(--espacement-12);
        min-height: 56px;
        padding: var(--espacement-8) var(--espacement-16);
        background: var(--couleur-surface);
        border-block-end: 1px solid var(--couleur-ligne);
      }
      .barre h1 {
        flex: 1 1 140px;
        min-width: 0;
        margin: 0;
        font-size: 1rem;
        font-weight: 500;
        line-height: 1.5rem;
      }
      .barre p {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8);
        margin: 0;
      }
      .mode {
        padding: 2px var(--espacement-8);
        border-radius: var(--rayon-option);
        background: var(--couleur-surface-douce);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .fil {
        background: var(--couleur-surface);
        border-block-end: 1px solid var(--couleur-ligne);
      }
      .bascule {
        display: none;
      }
      .etapes,
      .moment > ol {
        display: flex;
        flex-wrap: wrap;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .etapes {
        gap: var(--espacement-4) var(--espacement-16);
        justify-content: center;
        padding: 0 var(--espacement-12);
      }
      /* Un moment du cycle : son nom, puis ses étapes ; celui de l'étape courante prend l'accent. */
      .moment {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0 var(--espacement-4);
      }
      .moment > ol {
        gap: 0 var(--espacement-4);
      }
      .moment-nom {
        padding: 0 var(--espacement-8);
        color: var(--couleur-texte-discret);
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .moment[data-courant='oui'] > .moment-nom {
        color: var(--couleur-accent);
      }
      .onglet {
        position: relative;
        min-height: 44px;
        padding: 0 var(--espacement-12);
        border: 0;
        background: transparent;
        color: var(--couleur-texte-secondaire);
        font: inherit;
        font-size: 0.875rem;
        line-height: 1.25rem;
        white-space: nowrap;
        cursor: pointer;
      }
      .onglet:hover {
        color: var(--couleur-encre);
      }
      .onglet:focus-visible {
        outline: none;
        border-radius: var(--rayon-champ);
        box-shadow: var(--focus-anneau);
      }
      .onglet[aria-current='step'] {
        color: var(--couleur-accent);
        font-weight: 500;
      }
      .onglet[aria-current='step']::after {
        position: absolute;
        inset-block-end: 0;
        inset-inline: var(--espacement-12);
        block-size: 2px;
        background: var(--couleur-accent);
        content: '';
      }
      @media (max-width: 40rem) {
        .bascule {
          display: flex;
          align-items: center;
          justify-content: space-between;
          inline-size: 100%;
          min-height: 48px;
          padding: 0 var(--espacement-16);
          border: 0;
          background: transparent;
          color: var(--couleur-accent);
          font: inherit;
          font-size: 0.875rem;
          font-weight: 500;
          line-height: 1.25rem;
          cursor: pointer;
        }
        .fil[data-ouvert='false'] .etapes {
          display: none;
        }
        .etapes {
          flex-direction: column;
          gap: var(--espacement-4);
          justify-content: flex-start;
          padding-block-end: var(--espacement-8);
        }
        .moment,
        .moment > ol {
          flex-direction: column;
          align-items: stretch;
        }
        .moment-nom {
          padding: var(--espacement-8) var(--espacement-12) 0;
        }
        .onglet {
          inline-size: 100%;
          text-align: start;
        }
        .onglet[aria-current='step']::after {
          display: none;
        }
      }
      /* Dans l'appli, la barre et le fil d'étapes sont ceux de la page : la fiche n'en montre pas un second. */
      html[data-integree] .barre,
      html[data-integree] .fil {
        display: none;
      }
      html[data-integree] section > h2 {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /*
       * Dans l'appli, l'iframe prend la hauteur du contenu (message page.taille) : la fiche ne défile
       * pas seule. Elle se pose sur le fond de la page, ses cartes ont la largeur de celle du haut.
       */
      html[data-integree] {
        scrollbar-width: none;
      }
      html[data-integree]::-webkit-scrollbar {
        display: none;
      }
      html[data-integree] body {
        background: transparent;
      }
      html[data-integree] main {
        max-width: none;
        padding: 0;
      }

      /* Page : une colonne, des cartes séparées par le même intervalle que dans l'appli. */
      main {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-16);
        max-width: 760px;
        margin: 0 auto;
        padding: var(--espacement-16) var(--espacement-16) var(--espacement-48);
      }
      /* Une erreur de l'appli : la barre est cachée dans l'appli, l'avis passe au-dessus de l'étape. */
      .avis {
        margin: 0;
        padding: var(--espacement-12) var(--espacement-16);
        border: 1px solid var(--couleur-erreur);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface);
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      #contenu {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-16);
        min-width: 0;
      }
      section {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
        padding: var(--espacement-20);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-carte);
        background: var(--couleur-surface);
      }
      /* Les blocs d'une carte s'espacent par le gap, jamais par des marges qui se cumulent. */
      section :is(h2, h3, h4, p, ul, ol, dl, figure, blockquote, pre, fieldset) {
        margin: 0;
      }
      .ecran,
      .enonce {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
      }
      .ecran[hidden],
      .bouton[hidden],
      [data-si-essai][hidden] {
        display: none;
      }
      h2 {
        font-size: 1.375rem;
        font-weight: 600;
        line-height: 1.75rem;
        text-wrap: balance;
      }
      h3 {
        font-size: 1.125rem;
        font-weight: 600;
        line-height: 1.625rem;
        text-wrap: balance;
      }
      h4 {
        font-size: 1rem;
        font-weight: 600;
      }
      p,
      li {
        overflow-wrap: break-word;
      }
      .ecran p,
      .ecran li {
        max-width: var(--largeur-lecture);
      }
      .ecran .accroche {
        font-size: 1.125rem;
        line-height: 1.75rem;
      }
      ul,
      ol {
        padding-inline-start: var(--espacement-20);
      }
      /* Seulement les listes du contenu : le fil d'étapes et les autres listes d'interface ont leur propre gap. */
      section :is(ul, ol) > li + li {
        margin-top: var(--espacement-8);
      }
      ul.plain {
        padding-inline-start: var(--espacement-20);
      }
      .discret {
        color: var(--couleur-texte-secondaire);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      a {
        color: var(--couleur-encre);
        font-weight: 500;
        text-decoration: none;
        transition: color var(--duree-transition);
      }
      a:hover {
        color: var(--couleur-accent);
      }
      code,
      kbd {
        font-family: var(--police-code);
        font-size: 0.875em;
        font-variant-ligatures: none;
      }
      code {
        padding: 1px var(--espacement-4);
        border-radius: var(--rayon-option);
        background: var(--couleur-surface-douce);
      }
      pre {
        overflow-x: auto;
        padding: var(--espacement-12);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      pre code {
        padding: 0;
        background: none;
      }

      /* Boutons : Bouton.module.css (principal, secondaire). */
      button {
        font: inherit;
      }
      .bouton {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--espacement-8);
        min-height: var(--hauteur-bouton);
        min-width: var(--cible-tactile-min);
        padding: 0 var(--espacement-16);
        border: 1px solid transparent;
        border-radius: var(--rayon-champ);
        background: var(--couleur-accent);
        color: var(--couleur-accent-sur-fond);
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color var(--duree-transition) ease,
          border-color var(--duree-transition) ease,
          transform var(--duree-transition) ease;
      }
      .bouton:hover:not(:disabled) {
        background: color-mix(in srgb, var(--couleur-accent) 88%, var(--couleur-encre));
      }
      .bouton:active:not(:disabled) {
        background: color-mix(in srgb, var(--couleur-accent) 75%, var(--couleur-encre));
        transform: translateY(1px);
      }
      .bouton.secondaire {
        border-color: var(--couleur-controle);
        background: transparent;
        color: var(--couleur-encre);
      }
      .bouton.secondaire:hover:not(:disabled) {
        background: var(--couleur-surface-douce);
      }
      .bouton.secondaire:active:not(:disabled) {
        border-color: var(--couleur-accent);
        background: var(--couleur-surface-douce);
      }
      .bouton:focus-visible {
        outline: none;
        box-shadow: var(--focus-anneau);
      }
      .bouton:disabled {
        border-color: transparent;
        background: var(--couleur-surface-douce);
        color: var(--couleur-encre);
        opacity: 0.55;
        cursor: not-allowed;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-8);
      }
      @media (prefers-reduced-motion: reduce) {
        .bouton,
        a {
          transition: none;
        }
        .bouton:active:not(:disabled) {
          transform: none;
        }
      }

      /* Champs : ChampTexte, ZoneDeTexte, Selecteur. */
      textarea,
      input[type='text'],
      select {
        width: 100%;
        min-height: var(--hauteur-champ);
        padding: 0 var(--espacement-12);
        border: 1px solid var(--couleur-controle);
        border-radius: var(--rayon-champ);
        background-color: var(--couleur-fond);
        color: var(--couleur-encre);
        font: inherit;
        transition: border-color var(--duree-transition) ease;
      }
      input[type='text'] {
        width: auto;
        font-family: var(--police-code);
        font-variant-ligatures: none;
      }
      textarea {
        min-height: 7rem;
        padding: var(--espacement-12);
        resize: vertical;
        field-sizing: content;
      }
      .reponse-envoyee {
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      textarea:disabled,
      input:disabled {
        background-color: var(--couleur-surface-douce);
        opacity: 0.65;
      }
      textarea:focus-visible,
      input[type='text']:focus-visible,
      select:focus-visible {
        outline: none;
        border-color: var(--couleur-accent);
        box-shadow: var(--focus-anneau);
      }
      select {
        padding-inline-end: var(--espacement-32);
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, currentcolor 50%),
          linear-gradient(135deg, currentcolor 50%, transparent 50%);
        background-position:
          calc(100% - 1.125rem) 50%,
          calc(100% - 0.8125rem) 50%;
        background-repeat: no-repeat;
        background-size:
          0.3125rem 0.3125rem,
          0.3125rem 0.3125rem;
      }
      /* Une question : sa carte propre, sur le fond de la carte de l'étape. */
      .item {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
        padding: var(--espacement-16);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      .item > label,
      .relance > label {
        font-weight: 500;
      }
      /* Le complément d'une réponse, après sa correction, dans la carte de la question. */
      .relance {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
      }
      .item[data-fait='oui'] {
        border-color: var(--couleur-succes);
      }
      /* Une question à reprendre : la couleur du statut « À reprendre » de l'appli. */
      .item[data-fait='reprise'] {
        border-color: var(--couleur-erreur);
      }
      .item-reprise {
        margin: 0;
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1.25rem;
      }
      .erreur {
        margin: 0;
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .erreur:empty {
        display: none;
      }

      /* Confiance : GroupeSegmente. */
      fieldset {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-8);
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }
      legend {
        float: left;
        width: 100%;
        padding: 0;
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1.25rem;
        color: var(--couleur-texte-secondaire);
      }
      .choix label {
        position: relative;
        display: flex;
        flex: 1 0 auto;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding-inline: var(--espacement-8);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-option);
        background: var(--couleur-fond);
        white-space: nowrap;
        cursor: pointer;
      }
      /* La vraie radio couvre l'option et déborde du cadre : la zone tactile fait au moins 44 px. */
      .choix input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .choix label:has(input:checked) {
        border-color: var(--couleur-accent);
        background: var(--couleur-accent);
        box-shadow: var(--ombre-option);
        color: var(--couleur-accent-sur-fond);
        font-weight: 600;
      }
      .choix label:has(input:focus-visible) {
        box-shadow: var(--focus-anneau);
      }
      .choix label:has(input:disabled) {
        opacity: 0.65;
        cursor: not-allowed;
      }

      /* Correction : BulleCorrection. */
      .correction {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        padding: var(--espacement-20);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-carte);
        background: var(--couleur-surface);
      }
      .correction > strong {
        display: flex;
        align-items: center;
        gap: var(--espacement-8);
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.25rem;
        color: var(--couleur-texte-secondaire);
      }
      .correction > strong::before {
        flex: none;
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: currentcolor;
        content: '';
      }
      .correction[data-niveau='solide'] > strong {
        color: var(--couleur-succes);
      }
      .correction[data-niveau='partiel'] > strong {
        color: var(--couleur-alerte);
      }
      .correction[data-niveau='fragile'] > strong {
        color: var(--couleur-erreur);
      }
      .correction p {
        margin: 0;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      /* Sous la question : la correction, puis l'accord sur le niveau quand elle est tirée au sort. */
      .sortie {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
      }
      .sortie:empty {
        display: none;
      }
      .accord {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8) var(--espacement-12);
      }
      /* BadgeNeComptePas de l'appli : une réponse qui ne compte pas pour le statut, et pourquoi. */
      .badge-compte {
        display: inline-flex;
        align-items: center;
        align-self: flex-start;
        min-height: 1.75rem;
        padding: 0 var(--espacement-12);
        border: 1px solid var(--couleur-ligne);
        border-radius: 999px;
        background: var(--couleur-surface-douce);
        color: var(--couleur-texte-secondaire);
        font-size: 0.75rem;
        font-weight: 500;
        line-height: 1rem;
        white-space: nowrap;
      }

      /* Détails repliables ; l'objectif d'examen replié (carte, pratique) en est un. */
      details {
        padding: 0 var(--espacement-16);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      details[open] {
        padding-block-end: var(--espacement-12);
      }
      details > :not(summary) {
        margin-block-start: var(--espacement-12);
      }
      details > summary + * {
        margin-block-start: var(--espacement-4);
      }
      summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--espacement-12);
        min-height: 48px;
        font-weight: 500;
        list-style: none;
        cursor: pointer;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::after {
        flex: none;
        width: 0.5rem;
        height: 0.5rem;
        border-inline-end: 2px solid var(--couleur-texte-secondaire);
        border-block-end: 2px solid var(--couleur-texte-secondaire);
        transform: rotate(45deg) translate(-2px, -2px);
        transition: transform var(--duree-transition) ease;
        content: '';
      }
      details[open] > summary::after {
        transform: rotate(-135deg) translate(-2px, -2px);
      }
      summary:focus-visible {
        outline: none;
        border-radius: var(--rayon-champ);
        box-shadow: var(--focus-anneau);
      }

      /* Écrans : une idée à la fois, avec une barre de progression comme BarreProgression. */
      .ecran-barre {
        display: flex;
        align-items: center;
        gap: var(--espacement-12);
        min-width: 0;
      }
      .ecran-titre {
        flex: 1 1 auto;
        min-width: 0;
        margin: 0;
        color: var(--couleur-accent);
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.25rem;
      }
      .ecran-compte {
        flex: none;
        color: var(--couleur-texte-secondaire);
        font-size: 0.875rem;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .ecouter {
        flex: none;
        min-height: var(--cible-tactile-min);
        padding: 0 var(--espacement-12);
        font-size: 0.875rem;
        white-space: nowrap;
      }
      /* Un seul écran : la barre ne porte que « Écouter », à droite. */
      .ecran-barre > .ecouter:only-child {
        margin-inline-start: auto;
      }
      .ecran-progres {
        height: 0.5rem;
        border-radius: 0.25rem;
        background: var(--couleur-ligne);
        overflow: hidden;
      }
      .ecran-progres > span {
        display: block;
        height: 100%;
        border-radius: 0.25rem;
        background: var(--couleur-accent);

    <!-- ET2, perception : un même fichier ouvert par deux programmes, puis le pari, sans note. -->
    <template data-etape="ET2">
      <p class="accroche">
        Voici un tout petit fichier, <span class="mono">fichier.dat</span>. Son contenu complet

      </p>

        class="octets"

      >
        <span>01001100</span><span>01101001</span><span>01110011</span><span>00101101</span
        ><span>01101101</span><span>01101111</span><span>01101001</span><span>00100000</span
        ><span>01100010</span><span>01101001</span><span>01100101</span><span>01101110</span>
      </div>
      <p>Ouvre-le avec deux programmes différents.</p>
      <div data-widget="fichier" class="fenetres">
        <div class="fenetre">
          <p class="fenetre-barre">Visionneuse d’images · fichier.dat</p>

              Ouvrir avec le Bloc-notes
            </button>
          </div>
        </div>
      </div>
      <div
        data-widget="pari"
        class="ex"
        data-apres="Ce pari n’est pas noté. Garde ta réponse en tête : tu vas apprendre à faire ces deux lectures toi-même, à la main."
      >
        <p class="q">
          Les deux programmes ont lu exactement les mêmes 96 chiffres. À ton avis, pourquoi deux
          résultats si différents ?
        </p>
        <ul class="options">
          <li data-option="abime">Le fichier est abîmé : une des deux fenêtres le lit mal.</li>
          <li data-option="regle">Chaque fenêtre lit la même suite avec sa propre règle.</li>
          <li data-option="deux">
            Le fichier contient deux parties : une pour l’image, une pour le texte.
          </li>
        </ul>
      </div>

    <!-- ET1, carte : ce que le bloc apprend, où il se place, à quoi il sert. -->
    <template data-etape="ET1">
      <p class="accroche">
        Une photo, un message, une page web, une application : dans un ordinateur, tout est rangé
        avec deux signes seulement, 0 et 1. Les circuits de la machine, et tous les programmes
        qu’elle exécute, ne manipulent que ces 0 et ces 1. On dit qu’ils sont écrits en
        <strong>binaire</strong>, avec deux signes.
      </p>
      <p>
        Comme développeur web, tu les croiseras souvent : quand tu écris une couleur comme
        <code>rgb(255, 136, 0)</code>, quand tu estimes la taille d’une image avant de la mettre en
        ligne, quand un « é » s’affiche « Ã© » sur ta page.
      </p>
      <h3>Où tu es</h3>
      <p>Ce bloc ouvre la partie La machine, qui tient en quatre idées reliées :</p>
      <ul class="carte-partie">
        <li class="ici">
          <strong>L’information en bits</strong> : tout ce que la machine range et traite est une
          suite de 0 et de 1. Tu es ici.
        </li>
        <li>
          <strong>Décider : ET, OU, NON, SI/SINON</strong> : la machine décide avec de la logique
          sur ces 0 et ces 1.
        </li>
        <li>
          <strong>L’ordinateur et ses composants</strong> : des composants rangent, transportent et
          calculent ces 0 et ces 1.
        </li>
        <li>
          <strong>Du langage machine aux langages de haut niveau</strong> : un programme, écrit dans
          un langage, devient des instructions que ces composants exécutent.
        </li>
      </ul>
      <p>Les trois blocs suivants reposent sur celui-ci.</p>
      <h3>À la fin, tu sauras</h3>
      <ul>
        <li>
          écrire un nombre de 0 à 255 avec des 0 et des 1, et relire des 0 et des 1 comme un nombre,
          à la main, juste puis vite ;
        </li>
        <li>
          expliquer pourquoi huit 0 ou 1 donnent 256 nombres possibles alors que le plus grand est
          255, et ce que deviennent ces deux nombres avec plus ou moins de chiffres ;
        </li>
        <li>lire les mêmes 0 et 1 comme un nombre, une lettre ou une couleur ;</li>
        <li>
          écrire la couleur <code>rgb(255, 136, 0)</code> en 0 et 1, et dire ce que règle chacun de
          ses trois nombres ;
        </li>
        <li>écrire une couleur CSS en hexadécimal, comme <code>#ff8800</code>, et la relire ;</li>
        <li>comprendre pourquoi un « é » devient « Ã© », et l’éviter ;</li>
        <li>
          calculer la taille d’une photo, et expliquer en quatre phrases comment elle devient un
          fichier ;
        </li>
        <li>
          lire quelques octets comme les instructions d’un processeur, et dire pourquoi le binaire
          n’est pas un langage de programmation.
        </li>
      </ul>
      <p class="discret">
        Il te suffit de savoir additionner, soustraire, multiplier, et lire 345 comme 3 centaines, 4
        dizaines et 5 unités.
      </p>
    </template>

    <!-- ET3, tentative : le compteur à lampes, et ce que l'apprenant y trouve avant toute explication. -->
    <template data-etape="ET3">
      <div data-ecran="Le compteur">
        <p class="accroche">

          distinguer, même quand le courant est un peu perturbé. C’est pour ça que la machine écrit
          tout avec deux chiffres : 1 quand le courant passe, 0 quand il ne passe pas. Ici, des
          lampes jouent ce rôle : allumée, c’est 1 ; éteinte, c’est 0. Chaque lampe est un
          <strong>bit</strong> : un chiffre qui vaut 0 ou 1.
        </p>
        <p>
          Ce compteur avance de 1 à chaque clic, et montre le nombre avec ses lampes. Cherche
          comment il s’y prend.
        </p>

    <!-- ET4, explication : bit, octet, nombre de valeurs, poids ; ce que l'apprenant vient de trouver. -->
    <template data-etape="ET4">
      <div data-ecran="Bit et octet">
        <p class="accroche">
          Ce que tu as cherché avec le compteur a des noms. Les encadrés reprennent tes essais, là
          où ta réponse s’écartait.
        </p>
        <ul>
          <li>
            Chaque lampe du compteur est un bit. Huit bits à la suite forment un
            <strong>octet</strong>. Huit, c’est une convention, que presque toutes les machines
            suivent aujourd’hui. Le fichier du début fait 12 octets.
          </li>
        </ul>
        <p>
          Dans la machine, il n’y a pas de lampes. Un bit, c’est n’importe quel état physique à deux
          valeurs : une tension haute ou basse dans un circuit, un point aimanté dans un sens ou
          dans l’autre sur un disque.
        </p>
      </div>
      <div data-ecran="Combien de valeurs">
        <ul>
          <li>
            Chaque bit ajouté double le nombre de valeurs : à 0, le nouveau bit laisse toutes les
            valeurs d’avant ; à 1, il les donne une seconde fois. Avec <em>n</em> bits, il y a 2<sup
              >n</sup
            >
            valeurs : <em>n</em> fois le chiffre 2, multipliés entre eux, 2 × 2 × … × 2. Avec un
            octet : 2<sup>8</sup> = 256.
          </li>
          <li>
            On compte à partir de 0, et 0 est une valeur. Le plus grand nombre est donc 2<sup
              >n</sup
            >
            − 1 : 255 pour un octet, 15 pour 4 bits.
          </li>
        </ul>
        <p data-si-essai="c2:faux">
          Avec 3 lampes, tu avais compté <span data-essai-rappel="c2">autre chose</span> valeurs. Il
          y en a 8 : 0, 1, 2, 3, 4, 5, 6 et 7. Le 0 est une valeur comme les autres, c’est lui qu’on
          oublie le plus souvent.
        </p>
        <p data-si-essai="c3b:faux">
          Avec 2 lampes, tu avais compté <span data-essai-rappel="c3b">autre chose</span> valeurs.
          Il y en a 4 : 0, 1, 2 et 3.
        </p>
        <p data-si-essai="c3c:faux">
          Avec 4 lampes, tu avais compté <span data-essai-rappel="c3c">autre chose</span> valeurs.
          Il y en a 16, de 0 à 15. Si tu as trouvé 15, c’est le plus grand nombre, pas le nombre de
          valeurs : le 0 en est une.
        </p>
        <p data-si-essai="c1:faux">
          Pour le plus grand nombre avec 3 lampes, tu avais répondu
          <span data-essai-rappel="c1">autre chose</span>. C’est 7 : il y a 8 valeurs, la première
          est 0, la dernière est donc 8 − 1.
        </p>
        <p data-si-essai="c4:faux">
          Tu avais répondu <span data-essai-rappel="c4">autre chose</span> quand on ajoute une
          lampe. Reprends tes comptes : 2, 4, 8, 16. Chaque fois, le nombre double.
        </p>
        <p data-si-essai="c5:faux">
          Pour 8 lampes, tu avais répondu <span data-essai-rappel="c5">autre chose</span> valeurs.
          En doublant 8 fois depuis 1 : 2, 4, 8, 16, 32, 64, 128, 256.
        </p>
        <p data-si-essai="c6:faux">
          Tu avais donné <span data-essai-rappel="c6">autre chose</span> comme plus grand nombre sur
          8 lampes. C’est 256 − 1 = 255 : le 0 prend l’une des 256 valeurs.
        </p>
        <p>Les puissances de 2 à connaître. Par convention, 2<sup>0</sup> vaut 1.</p>
        <ul class="puissances">
          <li>2<sup>0</sup> = 1</li>
          <li>2<sup>1</sup> = 2</li>
          <li>2<sup>2</sup> = 4</li>
          <li>2<sup>3</sup> = 8</li>
          <li>2<sup>4</sup> = 16</li>
          <li>2<sup>5</sup> = 32</li>
          <li>2<sup>6</sup> = 64</li>
          <li>2<sup>7</sup> = 128</li>
          <li>2<sup>8</sup> = 256</li>
          <li>2<sup>9</sup> = 512</li>
          <li>2<sup>10</sup> = 1 024</li>
        </ul>
      </div>
      <div data-ecran="Combien de bits">
        <p class="accroche">
          Dans l’autre sens : pour écrire 100 valeurs différentes, combien faut-il de bits ? Cherche

        </p>
        <div class="ex" data-widget="choix" data-id="b1" data-reponse="non">
          <p class="q">
            Avec 6 bits, il y a 2<sup>6</sup> = 64 valeurs. Est-ce assez pour 100 valeurs ?
          </p>
          <ul class="options">
            <li data-option="non">Non : 64 est plus petit que 100.</li>
            <li
              data-option="oui"
              data-retour="Avec 64 valeurs, tu écris 64 choses différentes, pas plus. Il en manque 36 pour en écrire 100."

            </li>
            <li
              data-option="cinq"

        </div>
        <div
          class="ex"
          data-widget="nombre"
          data-id="b2"
          data-reponse="7"
          data-diag="bitsmin"
          data-valeurs="100"
        >
          <p class="q">Ajoute un bit à la fois. Combien de bits faut-il pour 100 valeurs ?</p>
        </div>
        <p>2<sup>7</sup> = 128, c’est assez : il faut 7 bits.</p>
        <div
          class="ex"
          data-widget="nombre"
          data-id="b3"
          data-reponse="9"
          data-diag="bitsmin"
          data-valeurs="300"

          <p class="q">
            À compléter : pour 300 valeurs, 2<sup>8</sup> = 256, ce n’est pas assez. Combien faut-il
            de bits ?
          </p>
        </div>
        <div
          class="ex"
          data-widget="nombre"
          data-id="b4"
          data-reponse="10"
          data-diag="bitsmin"
          data-valeurs="1000"

        </div>
      </div>
      <div data-ecran="Les poids">
        <ul>
          <li>
            Chaque bit a un <strong>poids</strong> : 1, 2, 4, 8, 16, 32, 64, 128, en partant de la
            droite. Mettre le plus petit poids à droite est une convention, la même qu’en décimal,
            où les unités sont à droite. Un nombre vaut la somme des poids de ses bits à 1. Cette
            façon d’écrire les nombres s’appelle le <strong>système binaire</strong>, ou base 2.
          </li>
        </ul>
        <p data-si-essai="c7c:faux">
          Pour la 3e lampe, tu avais noté <span data-essai-rappel="c7c">autre chose</span>. Elle
          s’allume pour la première fois à 4 : le double de la précédente, pas la suivante.
        </p>
        <p data-si-essai="c7d:faux">
          Pour la 4e lampe, tu avais noté <span data-essai-rappel="c7d">autre chose</span>. Elle
          s’allume pour la première fois à 8, le double de 4. Les poids ne vont pas de 1 en 1, ils
          doublent.
        </p>
        <p data-si-essai="c7e:faux">
          La 5e, la 2e et la 1re lampe allumées : tu avais répondu
          <span data-essai-rappel="c7e">autre chose</span>. Avec les poids, 16 + 2 + 1 = 19. Le
          compteur n’affiche rien d’autre que cette somme.
        </p>
        <p data-si-essai="c8a:faux">
          Pour la 5e lampe, tu avais répondu <span data-essai-rappel="c8a">autre chose</span>.

        </p>
        <p data-si-essai="c8b:faux">
          Pour la 8e lampe, tu avais répondu <span data-essai-rappel="c8b">autre chose</span>. En
          doublant depuis 16 : 32, 64, puis 128. C’est le poids du bit de gauche d’un octet.
        </p>
        <p>
          Les poids des bits sont les puissances de 2 : 1 = 2<sup>0</sup> pour le bit de droite,
          jusqu’à 128 = 2<sup>7</sup> pour le bit de gauche d’un octet.
        </p>
        <p>C’est le principe du décimal, avec deux différences. Côte à côte :</p>
        <div
          class="defile"
          data-lecture="Le tableau compare les deux écritures. En décimal, dix chiffres, de 0 à 9, et des poids qui valent 1, 10, 100 : chacun vaut dix fois le précédent. En binaire, deux chiffres, 0 et 1, et des poids qui valent 1, 2, 4, 8 : chacun vaut le double du précédent. Exemple : 345, c’est 3 fois 100 plus 4 fois 10 plus 5 fois 1. Et 1101, c’est 1 fois 8 plus 1 fois 4 plus 0 fois 2 plus 1 fois 1, soit 13."
        >
          <table>
            <thead>
              <tr>
                <td></td>
                <th scope="col">Décimal</th>
                <th scope="col">Binaire</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row">Chiffres</th>
                <td>dix : de 0 à 9</td>
                <td>deux : 0 et 1</td>
              </tr>
              <tr>
                <th scope="row">Poids, depuis la droite</th>
                <td>1, 10, 100 : chacun vaut 10 fois le précédent</td>
                <td>1, 2, 4, 8 : chacun vaut le double du précédent</td>
              </tr>
              <tr>
                <th scope="row">Exemple</th>
                <td>345 = 3 × 100 + 4 × 10 + 5 × 1</td>
                <td>1101 = 1 × 8 + 1 × 4 + 0 × 2 + 1 × 1, soit 13</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div
          class="ex"
          data-widget="choix"
          data-id="c9"
          data-reponse="deux"
          data-explication="Deux écritures pour un même nombre, c’est une valeur gâchée. Avec un poids de 9, à l’inverse, le nombre 8 ne pourrait pas s’écrire. En doublant, chaque nombre a exactement une écriture."
        >
          <p class="q">
            Pourquoi les poids doublent-ils ? Imagine des poids 1, 2, 4, puis 7 au lieu de 8. Que se
            passerait-il ?
          </p>
          <ul class="options">
            <li
              data-option="rien"

          lui : 64 + 32 + 16 + 8 + 4 + 2 + 1 = 127. Si 128 rentre, aucun autre poids ne peut le
          remplacer. Chaque décision est donc sûre, et les bits s’écrivent dans l’ordre, de gauche à
          droite.

    <!-- ET10, explication : les pixels à la suite, l'en-tête qui dit où couper, la taille sans compression. -->
    <template data-etape="ET10">
      <div data-ecran="Pixels et en-tête">
        <p class="accroche">
          Une photo est une grille de <strong>pixels</strong>, de tout petits carrés de couleur.
          Dans le cas le plus simple, celui de cette page, chaque pixel prend trois octets, un par
          lumière. Le fichier range ces octets à la suite, pixel après pixel, ligne après ligne.
        </p>
        <p>
          Mais une suite d’octets n’a pas de lignes. Au début du fichier, un
          <strong>en-tête</strong> indique au programme la largeur et la hauteur de l’image : il
          sait ainsi où couper les lignes. Le petit fichier du début n’en avait pas : la visionneuse
          a supposé une image carrée, de 2 pixels sur 2. Un vrai fichier d’image commence presque
          toujours par un en-tête.
        </p>
        <p>
          Ici, tu choisis toi-même où couper les lignes. Essaie d’autres largeurs que celle de
          l’en-tête.
        </p>
        <div class="outil" data-widget="image">
          <p class="outil-titre">Une image de 24 pixels : 72 octets de pixels</p>
        </div>
        <div class="ex" data-widget="choix" data-id="h1" data-reponse="rien">
          <p class="q">
            Coupe les lignes à une autre largeur. Qu’est-ce qui change dans les octets du fichier ?
          </p>
          <ul class="options">
            <li data-option="rien">Rien : seule la lecture change.</li>
            <li
              data-option="couleurs"
              data-retour="Regarde la suite d’octets sous l’image : elle ne bouge pas."
            >
              Les couleurs de certains pixels.
            </li>
            <li
              data-option="nombre"
              data-retour="Les octets des pixels restent les mêmes 72, quelle que soit la coupe."
            >
              Le nombre d’octets.
            </li>
          </ul>
        </div>
      </div>
      <div data-ecran="La taille d’une photo">
        <p class="accroche">
          Si on range chaque pixel tel quel, sans le compresser, ses pixels prennent donc : largeur
          × hauteur × 3 octets. L’en-tête ajoute quelques octets, presque rien.
        </p>
        <p>
          Pas à pas, avec une photo de 4 000 × 3 000 pixels. Réponds à chaque question avant de
          passer à la suivante.
        </p>

          class="ex"

          data-aide3="4 000 × 3 000 : calcule 4 × 3, puis ajoute les six zéros."
          data-sinon="Pas encore : ce n’est pas le nombre de pixels de cette photo."
          data-solution="4 000 × 3 000 = 12 000 000 pixels"
        >
          <p class="q">D’abord, combien de pixels en tout ?</p>
        </div>

          class="ex"

          data-diag="pixels"
          data-pixels-connus
          data-largeur="4000"
          data-hauteur="3000"
        >
          <p class="q">Combien d’octets pour ses pixels, sans compression ?</p>
        </div>
        <p>12 000 000 pixels, 3 octets par pixel : 36 000 000 octets.</p>
      </div>
      <div data-ecran="Une autre photo">
        <div
          class="ex"
          data-widget="nombre"
          data-id="s3"
          data-reponse="2400000"
          data-diag="pixels"
          data-pixels-connus
          data-largeur="1000"
          data-hauteur="800"

          <p class="q">
            À compléter : une photo de 1 000 × 800 pixels a 1 000 × 800 = 800 000 pixels. Combien
            d’octets pour ses pixels, sans compression ?

        <div
          class="ex"
          data-widget="nombre"
          data-id="s4"
          data-reponse="5760000"
          data-diag="pixels"
          data-largeur="1600"

          <p class="q">
            Sans aide : une photo fait 1 600 × 1 200 pixels. Combien d’octets pour ses pixels, sans
            compression ?
          </p>

      </div>
      <div data-ecran="Ko, Mo, Go">
        <p class="accroche">
          On compte les octets par milliers : 1 kilooctet (ko, souvent écrit Ko) vaut 1 000 octets,
          1 mégaoctet (Mo) 1 000 000, 1 gigaoctet (Go) 1 000 Mo, 1 téraoctet (To) 1 000 Go. La photo
          de 36 000 000 octets prend donc 36 Mo. Compter 1 ko pour 1 000 octets est une convention,
          celle du système international.
        </p>

          Attention : Windows suit une autre convention. Il compte par 1 024, soit 2<sup>10</sup>,
          au lieu de 1 000, et l’écart grandit à chaque unité. Un disque vendu 1 To y affiche
          environ 931 Go.

          <strong>compressées</strong>. Un format comme JPEG réécrit les pixels avec beaucoup moins
          d’octets, en acceptant de perdre de petits détails.

          est lue avec sa table de caractères. La plupart des octets tombent sur des signes sans
          suite ou sur des codes invisibles : d’où le charabia.

    <!-- ET11, explication : la quatrième lecture, un processeur à trois instructions ; le binaire n'est pas un langage. -->
    <template data-etape="ET11">
      <div data-ecran="Le processeur">
        <p class="accroche">
          Il existe une quatrième lecture. Le <strong>processeur</strong>, le composant qui exécute
          les programmes, lit certains octets comme des <strong>instructions</strong> : additionner
          deux nombres, copier une valeur, comparer, sauter à un autre endroit du programme. Chaque
          famille de processeurs, comme x86 ou ARM, a son propre
          <strong>jeu d’instructions</strong> : la table qui dit ce que fait chaque instruction. Une
          instruction occupe un ou plusieurs octets. Les octets d’un programme prêt à s’exécuter,
          lus avec ce jeu d’instructions, forment le <strong>code machine</strong>.
        </p>
        <h3>Un processeur à trois instructions</h3>
        <p>
          Les vrais processeurs ont des centaines d’instructions. Celui-ci, imaginaire, n’en a que
          trois. Chaque instruction tient sur deux octets : le premier dit quoi faire, le second
          donne un nombre. Le processeur garde un nombre en mémoire de travail, dans son
          <strong>registre</strong>.
        </p>

        >

    <!-- Pour le gardien de la méthode : ce que les outils de cette fiche font d'eux-mêmes. La page ne le montre pas. -->
    <template data-conception>
      <h3>Une question à la fois</h3>
      <ul>
        <li>
          Dans un écran, tout ce qui suit un exercice pas encore fini reste caché jusqu’à ce qu’il
          le soit : réussi, ou solution vue puis refaite ou expliquée (voir « Les coups de pouce »).
          Un groupe de petites questions sous une même consigne compte pour une seule question. Le
          texte d’explication placé après un exercice paraît donc seulement une fois l’exercice
          fini.
        </li>
        <li>
          À l’étape 2, la question du pari paraît une fois le fichier ouvert avec les deux
          programmes. Le pari n’est pas noté : la réponse choisie est gardée, et rappelée à l’étape
          14 au-dessus de la même question, « Au début, tu avais répondu : … ».
        </li>
        <li>
          Un exercice du cours fini garde son état d’une visite à l’autre : la réponse, le message
          et le texte qui suit restent affichés.
        </li>
      </ul>
      <h3>Les retours</h3>
      <ul>
        <li>
          Une réponse vide, ou qui n’a pas la forme attendue (un octet qui n’a pas exactement 8
          chiffres 0 ou 1, un nombre qui n’est pas un entier, une couleur sans #), reçoit un message
          de forme et ne compte pas comme une tentative.
        </li>
        <li>
          Une réponse fausse reçoit un retour calculé qui nomme ce qui est en cause : bits à 1
          comptés au lieu d’additionner leurs poids, poids lus à l’envers, poids 1 oublié, bits
          rangés à l’envers à l’écriture, octet qui vaut un autre nombre (avec sa valeur), nombre de
          valeurs donné pour le plus grand nombre et l’inverse, nombre de pixels donné pour le
          nombre d’octets, un nombre de bits qui ne suffit pas ou qui est plus grand que nécessaire,
          chiffre hexadécimal lu en décimal ou chiffres inversés, moitié de gauche d’un octet lue
          avec les poids de l’octet entier (« 240 15 » pour ff), rouge et bleu échangés dans une
          couleur CSS, octets additionnés au lieu d’être lus deux par deux par le processeur,
          majuscule ou minuscule de la table ASCII. Sinon, le retour écrit dans la fiche pour cet
          exercice (data-sinon), qui dit seulement que ce n’est pas encore ça : l’indice vient avec
          « Un coup de pouce », un cran après l’autre.
        </li>
        <li>
          Les retours calculés des erreurs critiques, mot pour mot. E4, à la lecture : « Tu as lu
          les poids à l’envers. Le poids 128 est tout à gauche, le poids 1 tout à droite. » E4, à
          l’écriture : « Tes bits sont rangés à l’envers : le bit de poids 128 se place tout à
          gauche. » E1, quand le nombre de valeurs est donné pour le plus grand nombre : « Ça, c’est
          le nombre de valeurs. Comme on compte à partir de 0, le plus grand nombre est un de
          moins. » E1, dans l’autre sens : « Ça, c’est le plus grand nombre. Le 0 compte aussi comme
          une valeur : il y en a une de plus. » Bits à 1 comptés : « Tu as compté les bits à 1.
          Chacun compte pour son poids : additionne les poids des bits à 1. »
        </li>
        <li>
          Un choix faux reçoit le retour écrit pour cette option. Au deuxième choix faux, la bonne
          réponse est marquée, « · la bonne réponse ».
        </li>
        <li>
          Dans la démonstration de l’étape 6 (109), chaque ligne demande si le poids rentre ; une
          réponse fausse dit pourquoi (« 32 rentre dans 45 : 32 est plus petit ou égal »), et la
          ligne attend la bonne réponse.
        </li>
      </ul>
      <h3>Les coups de pouce</h3>
      <ul>
        <li>
          Rien n’est proposé avant une première réponse fausse. Ensuite, « Un coup de pouce » montre
          le cran suivant : une question qui oriente, puis un indice sur la notion, puis l’étape
          détaillée, puis « Voir la solution ». Chaque cran demande une nouvelle réponse fausse
          avant le suivant. Les crans sont écrits dans la fiche (data-aide1 à data-aide3) ou, à
          défaut, calculés à partir des nombres de l’exercice : par exemple, pour lire 10010110,
          « Quel poids a chaque bit à 1 ? », puis « Écris les poids sous les bits… », puis « Le
          premier bit à 1 de cet octet, en partant de la gauche, a le poids 128. Trouve le poids de
          chacun des autres bits à 1, puis additionne. ». Le troisième cran ne donne jamais toute la
          réponse : il fait un pas de plus et laisse le reste (le premier poids d’une lecture, les
          premiers pas d’une écriture arrêtés avant que le reste ne tombe à 0, la moitié de gauche
          d’un octet hexadécimal, à moitié, les instructions d’un programme sans les nombres
          qu’elles reçoivent), ou laisse le dernier calcul (les nombres d’une photo sans leurs
          zéros, à multiplier), ou la recherche dans la table. Sans cran, la solution vient après
          deux réponses fausses.
        </li>
        <li>
          La solution est écrite avec sa raison : « 128 + 16 + 4 + 2 = 150 », « 77 = 64 + 8 + 4 + 1,
          donc 01001101 », « 2 puissance 6 = 64 valeurs, de 0 à 63 », « 800 × 600 = 480 000 pixels,
          × 3 octets = 1 440 000 octets », la trace du registre pour un programme.
        </li>
        <li>
          Dans le cours, après une solution vue, la suite de l’écran attend. Quand l’exercice a un
          autre cas possible, « Je refais sans regarder, sur un autre cas » propose un nouvel
          exercice du même genre, tiré au hasard (un autre octet à lire ou à écrire, un autre nombre
          de bits, de 2 à 12, un autre nombre de valeurs à écrire en bits, une autre couleur à
          écrire en trois octets, un autre octet hexadécimal, une autre couleur CSS, une autre
          moitié de 4 bits, un autre programme, une autre taille de photo), et la suite paraît une
          fois ce nouvel exercice réussi. Réussi, il demande d’expliquer pourquoi c’est juste, en
          une ou deux phrases, jugées par l’IA. Si c’est la solution de ce nouvel exercice qui est
          vue, rien n’a été réussi sans regarder : la page demande d’abord d’expliquer cette
          solution avec ses mots, et la suite paraît une fois l’explication jugée par l’IA. À la
          visite suivante, une solution vue qui n’a été ni refaite ni expliquée fait encore attendre
          la suite de l’écran. Sans autre cas possible (un choix, les caractères de « Lis- », la
          différence entre majuscule et minuscule), la page demande d’expliquer la solution avec ses
          mots, et la suite paraît une fois l’explication jugée par l’IA.
        </li>
        <li>
          Un choix a la même échelle (celle du gabarit) : chaque option fausse est retirée, avec son
          retour, qui oriente ; en pratique, « Un coup de pouce » donne ensuite l’indice écrit dans
          la fiche. Quand une seule option reste, elle est marquée : c’est une solution vue, traitée
          comme ci-dessus, même pour un choix à deux options.
        </li>
        <li>
          Exception : l’étape 3 est une tentative, sans note, avant toute explication. Chaque essai
          prend une réponse, ou « Je ne sais pas », sans retour ni coup de pouce ; le gabarit
          corrige toute la série à la fin de l’étape (« Tes essais »), avec le retour écrit dans la
          fiche. Rien ne s’y refait ni ne s’y explique : l’étape 4 part de ces essais.
        </li>
        <li>
          Le même cadre « Explique maintenant pourquoi c’est juste » suit une réussite obtenue au
          troisième cran.
        </li>
      </ul>
      <h3>L’entraînement</h3>
      <ul>
        <li>
          Chaque item est vérifié par la page. Chaque réponse vérifiée part à l’appli avec l’aide
          reçue : 0 si l’item est réussi du premier coup sans coup de pouce, sinon le cran atteint,
          1 au moins quand une réponse fausse a précédé (son retour a orienté), 4 quand la solution
          a été vue.
        </li>
        <li>
          Après une solution vue, l’item revient avec « J’ai compris, je refais sans regarder » et
          se refait sur sa variante, un cas comparable écrit dans la fiche (par exemple 166 au lieu
          de 150, 9 bits au lieu de 6). Si c’est la solution de la variante qui est vue, il revient
          à l’énoncé d’origine. Réussi après une solution vue, il demande aussi d’expliquer.
        </li>
        <li>
          Quatre items sur treize demandent une explication après la réussite (data-justifier), sur
          ce que l’écran ne montre pas : pourquoi un bit à 1 compte pour son poids (PR7-1), avec
          quel codage le Bloc-notes lit l’octet (PR7-5), ce qui décide du sens des octets (PR8-2),
          ce qui distingue le binaire d’un langage (PR8-8). Le manifeste déclare chaque explication
          (explication : la question, qui se comprend sans l’écran, et l’attendu, le pourquoi et
          jamais le seul résultat). L’IA la juge (série explication) : l’item n’est réussi qu’avec
          une explication Solide ; après deux explications qui ne le sont pas, la solution s’affiche
          et l’item revient sur sa variante. Sans correcteur, l’explication attend d’être renvoyée.
          L’énoncé de PR7-5 ne nomme pas la table : « Le Bloc-notes ouvre un fichier qui contient
          cet octet. », et son extrait s’intitule « Un extrait de table : un numéro, un caractère ».
        </li>
        <li>
          Les autres items (PR7-2, PR7-3, PR7-4, PR7-6, PR8-1, PR8-3, PR8-4, PR8-5, PR8-6) ne
          demandent rien après la réussite : le geste qu’ils vérifient est à l’écran, la question en
          redemanderait la recopie.
        </li>
        <li>
          Cinq items sont des choix à trois options (PR7-3, PR7-4, PR8-2, PR8-6, PR8-8) : trouver
          l’erreur d’un camarade, dire ce que devient un nombre de valeurs quand un bit s’ajoute ou
          s’enlève, dire ce que sont des octets sans leur codage, dire pourquoi deux processeurs
          font deux choses des mêmes octets. Une option fausse reçoit son retour et ne se choisit
          plus ; une réussite après une option fausse compte avec l’aide 1. À la deuxième option
          fausse, la bonne réponse est marquée : c’est une solution vue (aide 4), et l’item revient
          sur sa variante. PR8-2 et PR8-8 demandent ensuite de justifier, en une ou deux phrases
          (data-justifier), et l’IA juge l’explication.
        </li>
      </ul>
      <h3>Vitesse</h3>
      <ul>
        <li>
          Une série : 10 octets différents tirés au hasard de 0 à 255, 5 à lire et 5 à écrire, dans
          un ordre mélangé. Une barre montre le temps qui reste pour chaque conversion. Une réponse
          vide ou mal formée reçoit le même message de forme, qu’elle soit juste ou fausse sur le
          fond (« Un octet s’écrit avec exactement 8 chiffres, des 0 et des 1. »), ne consomme pas
          la conversion, et le temps continue de courir.
        </li>
        <li>
          Une réponse validée est juste si elle est exacte et donnée dans le temps ; sinon, la page
          donne la bonne réponse et, quand l’erreur se reconnaît, son retour (poids à l’envers…).
          Une réponse exacte mais trop lente compte comme « Temps écoulé ».
        </li>
        <li>
          Trois niveaux : 30, puis 20, puis 10 secondes par conversion. Une série de 10 justes sur
