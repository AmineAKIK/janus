        /**
         * L'échelle d'aide d'un exercice dont la page sait calculer les crans : une question qui
         * oriente, un indice sur la notion, l'étape détaillée (règle F03). Les crans écrits dans la
         * fiche (`data-aide1` à `data-aide3`) passent avant.
         */
        /**
         * Le troisième cran d'une lecture avec les poids : un pas de plus, pas toute la lecture
         * (règle F04). Le poids du premier bit à 1 est donné ; ceux des autres et la somme restent
         * à faire. `poids` : 128 à 1 pour un octet, 8 à 1 pour une moitié.
         */
        function premierPoids(bits, poids, sujet) {
          const p = poids.filter((w, i) => bits[i] === '1')
          const ecrire =
            poids.length === 8 ? 'en doublant depuis 1, de droite à gauche' : '8, 4, 2, 1'
          if (!p.length) return sujet + ' n’a aucun bit à 1 : combien ajoute un bit à 0 ?'
          if (p.length === 1)
            return (
              sujet +
              ' n’a qu’un bit à 1. Écris les poids sous ses bits, ' +
              ecrire +
              ' : le poids de ce bit est sa valeur.'
            )
          return (
            'Le premier bit à 1 de ' +
            sujet.charAt(0).toLowerCase() +
            sujet.slice(1) +
            ', en partant de la gauche, a le poids ' +
            p[0] +
            '. Trouve le poids de chacun des autres bits à 1, puis additionne.'
          )
        }
        /** Un nombre sans ses zéros de droite, et combien il en avait : 1 600 donne 16 et 2. */
        function sansZeros(n) {
          let x = n
          let z = 0
          while (x >= 10 && x % 10 === 0) {
            x /= 10
            z += 1
          }
          return [x, z]
        }
        const ZEROS = [
          '',
          'le zéro',
          'les deux zéros',
          'les trois zéros',
          'les quatre zéros',
          'les cinq zéros',
          'les six zéros',
          'les sept zéros',
          'les huit zéros',
          'les neuf zéros',
          'les dix zéros',
        ]
        function cransCalcules(ex) {
          const d = ex.dataset
          const type = d.widget
          if (type === 'nombre' && d.diag === 'lire')
            return [
              'Quel poids a chaque bit à 1 ?',
              'Écris les poids sous les bits : 128 tout à gauche, puis 64, 32, 16, 8, 4, 2, et 1 tout à droite. Garde ceux des bits à 1.',
              premierPoids(d.bits, POIDS, 'Cet octet'),
            ]
          if (type === 'octet' || (type === 'nombre' && d.diag === 'ecrire')) {
            const n = Number(d.reponse)
            return [
              'Quel est le plus grand poids qui rentre dans ' + n + ' ?',
              'Pars de 128. Si le poids rentre dans ce qui reste, écris 1 et retire-le ; sinon, écris 0. Puis passe au poids suivant.',
              debutEcrire(n),
            ]
          }
          if (type === 'octets') {
            const reps = d.reponse.split(',').map(Number)
            const noms = (d.noms || '').split(',')
            return [
              'Combien de chiffres pour chaque octet, et dans quel ordre les écrire ?',
              'Écris chaque nombre en binaire, l’un après l’autre, sur 8 chiffres : pars de 128, écris 1 quand le poids rentre dans ce qui reste.',
              // Le début du premier octet seulement : l'octet entier serait déjà une partie de la
              // réponse (règle F04).
              (noms[0] || 'Le premier') +
                ', ' +
                reps[0] +
                ' : ' +
                debutEcrire(reps[0], true) +
                ' Puis fais de même pour les autres.',
            ]
          }
          if (type === 'nombre' && (d.diag === 'valeurs' || d.diag === 'max') && d.n) {
            const k = Number(d.n)
            const v = 2 ** k
            if (d.diag === 'valeurs')
              return [
                'Avec 1 bit, combien de valeurs ? Que fait chaque bit ajouté ?',
                'Chaque bit ajouté double le nombre de valeurs : avec ' +
                  k +
                  ' bits, multiplie ' +
                  k +
                  ' fois le chiffre 2.',
                k <= 4
                  ? Array(k).fill('2').join(' × ') + ' = ?'
                  : '2 multiplié par lui-même, ' +
                    k +
                    ' fois : 2, 4, 8, 16… Continue jusqu’au ' +
                    k +
                    'e.',
              ]
            return [
              'Combien de valeurs avec ' + k + ' bits ? Par quel nombre commence-t-on à compter ?',
              'On compte à partir de 0, qui est une valeur : le plus grand nombre est le nombre de valeurs moins 1.',
              'Avec ' +
                k +
                ' bits : 2 puissance ' +
                k +
                ' = ' +
                milliers(v) +
                ' valeurs, de 0 à… ?',
            ]
          }
          if (type === 'nombre' && d.diag === 'bitsmin') {
            const v = Number(d.valeurs)
            return [
              'Combien de valeurs donne chaque nombre de bits ? Lequel est le premier à atteindre ' +
                milliers(v) +
                ' ?',
              'Avec n bits, il y a 2 puissance n valeurs. Cherche le premier n pour lequel 2 puissance n atteint ' +
                milliers(v) +
                '.',
              'Écris les puissances de 2 en doublant : 2, 4, 8, 16, 32, 64… en comptant les bits à chaque fois. Arrête-toi au premier nombre qui atteint ' +
                milliers(v) +
                '.',
            ]
          }
          if (type === 'nombre' && d.diag === 'hexa16') {
            const h = d.hex
            return [
              'Que vaut chaque chiffre ? Lequel compte 16 fois ?',
              'Remplace chaque chiffre par sa valeur, de a = 10 à f = 15. Le chiffre de gauche compte 16 fois, celui de droite une fois.',
              h[0] +
                ' vaut ' +
                parseInt(h[0], 16) +
                ', ' +
                h[1] +
                ' vaut ' +
                parseInt(h[1], 16) +
                ' : calcule ' +
                parseInt(h[0], 16) +
                ' × 16 + ' +
                parseInt(h[1], 16) +
                '.',
            ]
          }
          if (type === 'nombre' && d.diag === 'pixels') {
            const w = Number(d.largeur)
            const h = Number(d.hauteur)
            // Le troisième cran laisse la multiplication à faire : les nombres sans leurs zéros,
            // puis les zéros à remettre (règle F04).
            const [a, za] = sansZeros(w)
            const [b, zb] = sansZeros(h)
            const [p, zp] = sansZeros(w * h)
            return [
              'Combien de pixels en tout ? Combien d’octets par pixel ?',
              'Les pixels : largeur × hauteur. Chacun prend 3 octets, un par lumière.',
              'pixelsConnus' in d
                ? 'Tu as les pixels : ' +
                  milliers(w * h) +
                  '. Chacun prend 3 octets : calcule ' +
                  milliers(p) +
                  ' × 3' +
                  (zp ? ', puis remets ' + ZEROS[zp] + '.' : '.')
                : 'Multiplie ' +
                  milliers(a) +
                  ' × ' +
                  milliers(b) +
                  (za + zb ? ', puis ajoute ' + ZEROS[za + zb] : '') +
                  ' : ce sont les pixels. Ensuite, 3 octets chacun.',
            ]
          }
          if (type === 'nombre' && d.diag === 'programme') {
            // Le troisième cran lit les instructions, pas les nombres qu'elles reçoivent (règle F04).
            const o = octetsDe(ex)
            const RANG = ['premier', 'troisième', 'cinquième', 'septième']
            const FAIT = {
              1: 'dans la table, il range l’octet qui le suit dans le registre',
              2: 'dans la table, il ajoute l’octet qui le suit au registre',
            }
            const k = o.findIndex((x, i) => i % 2 === 0 && x === 2)
            const paires = []
            for (let i = 0; i <= (k === -1 ? 0 : k); i += 2)
              if (FAIT[o[i]])
                paires.push(
                  'Le ' +
                    RANG[i / 2] +
                    ' octet, ' +
                    binaire(o[i]) +
                    ', vaut ' +
                    o[i] +
                    ' : ' +
                    FAIT[o[i]] +
                    '.',
                )
            return [
              'Que dit le premier octet de chaque paire ?',
              'Lis deux octets à la fois. Le premier, cherché dans la table, dit quoi faire ; le second donne le nombre. Suis le registre.',
              paires.join(' ') +
                (paires.length > 1
                  ? ' Que valent les octets qui les suivent ?'
                  : ' Que vaut l’octet qui le suit ?'),
            ]
          }
          if (type === 'texte' && d.diag === 'css') {
            const r = parseInt(d.reponse.slice(1, 3), 16)
            return [
              'Combien de chiffres hexadécimaux par octet, et dans quel ordre ?',
              'Écris chaque octet en binaire, coupe-le en deux moitiés, puis écris chaque moitié avec son chiffre. Deux chiffres par octet, dans l’ordre rouge, vert, bleu.',
              // Le début du rouge en binaire seulement, comme pour un octet seul (règle F04).
              'Le rouge, ' +
                r +
                ' : ' +
                debutEcrire(r, true) +
                ' Puis coupe-le en deux moitiés, et fais de même pour le vert et le bleu.',
            ]
          }
          if (type === 'texte' && d.diag === 'hexa') {
            const n = parseInt(d.reponse, 16)
            return [
              'Coupe l’octet au milieu : que vaut chaque moitié ?',
              'Calcule chaque moitié avec les poids 8, 4, 2 et 1, puis écris son chiffre : de 10 à 15, a à f.',
              // La moitié de gauche seulement, et à moitié (règle F04).
              'Commence par la moitié de gauche, ' +
                binaire(n).slice(0, 4) +
                '. ' +
                premierPoids(binaire(n).slice(0, 4), [8, 4, 2, 1], 'Cette moitié') +
                ' Écris son chiffre, puis fais de même à droite.',
            ]
          }
          if (type === 'texte' && d.moitie)
            return [
              'Que vaut cette moitié avec les poids 8, 4, 2 et 1 ?',
              'De 0 à 9, le chiffre hexadécimal est le même ; de 10 à 15, on écrit a, b, c, d, e, f.',
              premierPoids(d.moitie, [8, 4, 2, 1], 'Cette moitié') +
                ' Puis cherche le chiffre dans la table.',
            ]
          if (type === 'texte' && d.bits)
            return [
              'Quel nombre écrit cet octet ?',
              'Calcule son nombre avec les poids, puis cherche ce numéro dans la table.',
              premierPoids(d.bits, POIDS, 'Cet octet') + ' Puis cherche ce numéro dans la table.',
            ]
          return []
        }

        // --- Les lampes : affichées (lecture) ou cliquables (écriture).
        function lampesAffichage(bits, avecPoids) {
          const rang = el('div', {
            class: 'lampes',
            role: 'img',
            'aria-label':
              'Lampes de gauche à droite : ' +
              bits +
              (avecPoids ? ', avec sous chacune son poids : 128, 64, 32, 16, 8, 4, 2, 1' : ''),
          })
          ;[...bits].forEach((c, i) => {
            const col = el(
              'span',
              { class: 'lampe-col' },
              el('span', { class: 'lampe', 'data-on': c, text: c }),
            )
            if (avecPoids) col.append(el('span', { class: 'poids', text: POIDS[i] }))
            rang.append(col)
          })
          return rang
        }
        function lampesSaisie(fixe = '', avecPoids = false) {
          const etat = Array(8).fill('0')
          ;[...fixe].forEach((c, i) => {
            etat[i] = c
          })
          const rang = el('div', { class: 'lampes', role: 'group', 'aria-label': 'Octet à écrire' })
          const boutons = etat.map((c, i) => {
            const b = el('button', {
              type: 'button',
              class: 'lampe',
              'aria-label': 'Bit de poids ' + POIDS[i],
            })
            if (i < fixe.length) b.disabled = true
            b.addEventListener('click', () => {
              etat[i] = etat[i] === '1' ? '0' : '1'
              peindre()
            })
            const col = el('span', { class: 'lampe-col' }, b)
            if (avecPoids) col.append(el('span', { class: 'poids', text: POIDS[i] }))
            rang.append(col)
            return b
          })
          function peindre() {
            boutons.forEach((b, i) => {
              b.dataset.on = etat[i]
              b.textContent = etat[i]
              b.setAttribute('aria-pressed', String(etat[i] === '1'))
            })
          }
          peindre()
          return {
            noeud: rang,
            valeur: () => etat.join(''),
            poser(bits) {
              ;[...bits].forEach((c, i) => {
                etat[i] = c
              })
              peindre()
            },
            bloquer() {
              boutons.forEach((b) => {
                b.disabled = true
              })
            },
          }
        }

        // --- Les exercices. Chaque type rend un contrôleur : `solution()`, `remplir(etat, v)` (la
        // réponse posée une fois l'exercice fini), `bloquer()`, et parfois `variante()` (un autre cas,
        // pour refaire sans regarder).
        const dansItem = (ex) => Boolean(ex.closest('.item'))
        /** Dit au gabarit qu'une réponse d'un item de pratique a été vérifiée (fiche:verification). */
        function signaler(ex, juste, aide, plus = {}) {
          if (!dansItem(ex)) return
          ex.dispatchEvent(
            new CustomEvent('fiche:verification', {
              bubbles: true,
              detail: { juste, aide, ...plus },
            }),
          )
        }
        /**
         * Une erreur critique reconnue (ici E4, les poids lus ou rangés à l'envers) part au bilan :
         * `fiche:erreur`, avec l'item ou l'exercice où elle a eu lieu (sa variante du cours :
         * « l7:variante »). La tentative de l'étape 3 n'en signale pas : elle vient avant les
         * règles. Rend faux si le gabarit attend d'abord le bilan.
         */
        function signalerErreur(ex, erreur) {
          if (!erreur || 'essai' in ex.dataset) return true
          const ou =
            ex.closest('.item')?.dataset.item ??
            (ex.dataset.variante
              ? ex.parentElement?.closest('[data-id]')?.dataset.id?.concat(':variante')
              : ex.closest('[data-id]')?.dataset.id)
          if (!ou) return true
          return ex.dispatchEvent(
            new CustomEvent('fiche:erreur', {
              bubbles: true,
              cancelable: true,
              detail: { erreur, ou },
            }),
          )
        }
        const ATTENDRE_BILAN = ' C’est une erreur critique : envoie ton bilan avant de continuer.'
        function retourDe(ex) {
          let r = $(':scope > .retour', ex)
          if (!r) {
            r = el('p', { class: 'retour', 'aria-live': 'polite' })
            ex.append(r)
          }
          return r
        }
        function dire(ex, classe, texte) {
          const r = retourDe(ex)
          r.className = 'retour' + (classe ? ' ' + classe : '')
          r.textContent = fr(texte)
          return r
        }
        const fini = (ex) => ex.dataset.fini === 'oui'

        /**
         * Après une solution montrée, l'apprenant refait sans regarder puis explique (règle F03) : il
         * écrit son explication, et l'IA la juge.
         */
        /** La clé de l'explication d'un exercice, pour la trace du gabarit (`explique:<cle>`). */
        function cleExplication(ex) {
          const item = ex.closest('.item')
          // Une variante du cours n'a pas d'identifiant : elle prend celui de l'exercice qu'elle refait.
          const id = ex.dataset.id ?? ex.parentElement?.closest('.ex[data-id]')?.dataset.id
          const base = item ? item.dataset.item : 'ex:' + (id ?? 'x')
          return (
            base +
            (ex.dataset.variante || (item && montre[item.dataset.item] === 'variante')
              ? ':variante'
              : '')
          )
        }
        function expliquer(ex, solution, consigne, apres) {
          if ($(':scope > .expliquer', ex)) return
          const cle = cleExplication(ex)
          if (apres) {
            const fin = (e) => {
              if (e.detail?.cle !== 'explique:' + cle) return
              ex.removeEventListener('fiche:trace', fin)
              apres()
            }
            ex.addEventListener('fiche:trace', fin)
          }
          ex.dispatchEvent(
            new CustomEvent('fiche:expliquer', {
              bubbles: true,
              detail: {
                cle,
                solution: fr(sansPoint(solution) + '.'),
                consigne: consigne ? fr(consigne) : undefined,
              },
            }),
          )
        }

        /** Un exercice fini : la réponse posée, les champs bloqués, le message, puis la suite de l'écran. */
        function appliquer(ex, c, etat, v, message) {
          ex.dataset.fini = 'oui'
          c.echelle?.maj()
          ex.classList.toggle('ok', etat !== 'vu')
          ex.classList.toggle('vu', etat === 'vu')
          c.remplir(etat, v)
          c.bloquer()
          const texte =
            message ??
            (etat === 'vu'
              ? c.marque
                ? 'La bonne réponse est marquée.'
                : 'Réponse : ' + sansPoint(c.solution()) + '.'
              : 'Juste.')
          dire(ex, etat === 'vu' ? '' : 'bon', texte)
          const explication = ex.dataset.explication
          if (explication && !$(':scope > .explication', ex))
            ex.append(el('p', { class: 'explication', text: explication }))
          if (ex.dataset.pastille && !$(':scope > .pastille-reponse', ex))
            ex.append(
              el('span', {
                class: 'pastille pastille-reponse',
                style: 'background: ' + ex.dataset.pastille,
                role: 'img',
                'aria-label': 'La couleur ' + ex.dataset.pastille,
              }),
            )
          devoiler(ex.closest('.ecran, [data-ecran]'))
          const parent = ex.parentElement?.closest('.ex')
          if (parent) libererApresVariante(parent, ex, c, etat)
        }

        /**
         * La variante du cours finie : réussie, elle libère la suite de l'écran, et la trace de
         * l'exercice le dit pour la visite suivante. Si c'est sa solution qui a été vue, rien n'a été
         * réussi sans regarder (règle F04) : l'apprenant explique d'abord cette solution, comme après
         * une solution vue sans autre cas, puis la suite paraît.
         */
        function libererApresVariante(parent, ex, c, etat) {
          if (parent.dataset.reprise !== 'oui') return
          if (etat === 'vu')
            return expliquer(
              ex,
              c.solution(),
              fr('Pour continuer, explique cette solution avec tes mots, en une ou deux phrases :'),
              () => libererReprise(parent),
            )
          if (parent.dataset.id)
            tracer('ex:' + parent.dataset.id, { e: 'vu', v: null, refait: true })
          libererReprise(parent)
        }

        /**
         * Dans le cours, après une solution vue (règles F03 et F04) : la suite de l'écran attend que
         * l'apprenant refasse sur un autre cas, ou, quand il n'y en a pas, qu'il explique la solution
         * avec ses mots. Pas pendant la tentative de l'étape 3, ni dans une variante.
         */
        const avecReprise = (ex) =>
          !dansItem(ex) && !ex.dataset.variante && !('essai' in ex.dataset)
        function apresSolution(ex, c) {
          if (c.variante) return proposerVariante(ex, c)
          expliquer(
            ex,
            c.solution(),
            fr('Pour continuer, explique cette solution avec tes mots, en une ou deux phrases :'),
            () => libererReprise(ex),
          )
        }
        function libererReprise(ex) {
          if (ex.dataset.reprise !== 'oui') return
          delete ex.dataset.reprise
          devoiler(ex.closest('.ecran, [data-ecran]'))
        }

        /**
         * Ce que fait une réponse. Dans le cours, l'exercice fini garde sa trace (fiche:trace). Dans un
         * item de pratique, chaque réponse vérifiée part au gabarit, avec l'aide reçue : une réussite
         * qui suit une réponse fausse compte avec l'aide 1 au moins, le retour de l'erreur a orienté
         * (règle P03).
         */
        /**
         * Une réponse à la tentative de l'étape 3 (règles C03 et M01) : elle part au gabarit, qui la garde
         * sans verdict et corrige toute la série à la fin. L'outil ne dit rien ; l'exercice est fini, la
         * suite de l'écran paraît. « Je ne sais pas » (fiche:essai-passe) est une réponse vide.
         */
        /**
         * L'attendu d'un essai, en mots de l'essai : sa solution écrite, sinon le nombre seul. La
         * solution du cours (« 2 puissance 3 = 8 valeurs ») parle de ce que l'étape suivante enseigne.
         */
        function attenduDeLEssai(ex, c) {
          if (ex.dataset.solution) return sansPoint(ex.dataset.solution)
          if (ex.dataset.widget === 'nombre' && ex.dataset.reponse)
            return milliers(Number(ex.dataset.reponse))
          return typeof c.solution === 'function' ? sansPoint(c.solution()) : ''
        }

        function essayer(ex, c, res) {
          ex.dataset.fini = 'oui'
          c.bloquer?.()
          const reponse = res.r ?? res.v
          ex.dispatchEvent(
            new CustomEvent('fiche:essai', {
              bubbles: true,
              detail: {
                cle: ex.dataset.id,
                reponse: reponse === undefined || reponse === null ? null : String(reponse),
                juste: Boolean(res.ok),
                attendu: attenduDeLEssai(ex, c),
                // Après coup, un indice pour réessayer n'a plus d'objet : ce qui cause l'erreur, ou pourquoi.
                retour: res.ok
                  ? (ex.dataset.explication ?? '')
                  : res.d?.m || ex.dataset.explication || '',
              },
            }),
          )
          devoiler(ex.closest('.ecran, [data-ecran]'))
        }

        function repondre(ex, c, res) {
          if (fini(ex)) return
          if ('essai' in ex.dataset) return essayer(ex, c, res)
          const fautes = Number(ex.dataset.fautes || 0)
          const cran = c.echelle ? c.echelle.cran() : 0
          if (res.ok) {
            const aide = Math.min(4, fautes > 0 ? Math.max(cran, 1) : cran)
            signaler(ex, true, aide)
            const etat = fautes === 0 && cran === 0 ? 'ok1' : 'ok'
            if (!dansItem(ex) && ex.dataset.id && !ex.dataset.variante)
              tracer('ex:' + ex.dataset.id, { e: etat, v: res.v ?? null })
            appliquer(
              ex,
              c,
              etat,
              res.v,
              (res.m || 'Juste.') + (ex.dataset.succes ? ' ' + ex.dataset.succes : ''),
            )
            if (ex.closest('[data-solution-vue]') || ex.dataset.variante || cran === 3)
              expliquer(ex, c.solution())
            else if (ex.dataset.justifier) {
              // Deux explications qui ne sont pas Solides : la solution, puis l'item sur sa variante.
              ex.addEventListener(
                'fiche:explication-ratee',
                (e) => montrerSolution(ex, c, e.detail?.message),
                { once: true },
              )
              expliquer(ex, c.solution(), fr(ex.dataset.justifier))
            }
            return
          }
          ex.dataset.fautes = String(fautes + 1)
          signaler(ex, false, cran)
          const libre = signalerErreur(ex, res.d?.e)
          const m =
            (res.d && res.d.m ? res.d.m : (ex.dataset.sinon ?? 'Pas encore. Réessaie.')) +
            (libre ? '' : ATTENDRE_BILAN)
          if (c.marque) {
            dire(ex, 'faux', m)
            // Tant que plusieurs options restent, l'échelle aide (règle F03). L'option qui reste ne se
            // choisit pas : c'est une solution vue, qui se refait ou s'explique (règle F04).
            if (c.restantes() > 1) return c.echelle?.tentative()
            return montrerSolution(ex, c, m)
          }
          dire(ex, 'faux', m)
          c.echelle?.tentative()
        }

        /** La solution montrée, en bout d'échelle. */
        function montrerSolution(ex, c, avant) {
          const solution = sansPoint(c.solution()) + '.'
          if (dansItem(ex)) {
            // Le gabarit note « solution vue » tout de suite ; l'item se redessine sur « je refais ».
            signaler(ex, false, 4, { garder: true })
            ex.dataset.fini = 'oui'
            if (c.marque) c.remplir('vu')
            c.bloquer()
            dire(ex, '', (avant ? avant + ' ' : '') + 'Solution : ' + solution)
            ex.append(
              el(
                'div',
                { class: 'actions' },
                el('button', {
                  type: 'button',
                  class: 'bouton',
                  text: 'J’ai compris, je refais sans regarder',
                  onclick: null,
                }),
              ),
            )
            $(':scope > .actions:last-child .bouton', ex).addEventListener('click', () => {
              // L'item se redessine pendant l'événement : on choisit d'abord le cas à refaire.
              const id = ex.closest('.item').dataset.item
              prochain[id] = montre[id] === 'variante' ? 'origine' : 'variante'
              ex.dispatchEvent(new CustomEvent('fiche:refaire', { bubbles: true }))
            })
            return
          }
          if (ex.dataset.id && !ex.dataset.variante)
            tracer('ex:' + ex.dataset.id, { e: 'vu', v: null })
          const reprise = avecReprise(ex)
          if (reprise) ex.dataset.reprise = 'oui'
          const suite =
            reprise && c.variante
              ? ' Pour continuer, refais-le sur un autre cas, sans regarder.'
              : ''
          appliquer(
            ex,
            c,
            'vu',
            null,
            (avant ? avant + ' ' : '') + 'Solution : ' + solution + suite,
          )
          if (reprise) apresSolution(ex, c)
          else proposerVariante(ex, c)
        }

        /** Dans le cours, après une solution : refaire sans regarder, sur un autre cas tiré au hasard. */
        function proposerVariante(ex, c) {
          if (!c.variante || $(':scope > .refaire', ex)) return
          const bouton = el('button', {
            type: 'button',
            class: 'bouton secondaire petit',
            text: 'Je refais sans regarder, sur un autre cas',
          })
          const zone = el('div', { class: 'refaire' }, bouton)
          bouton.addEventListener('click', () => {
            const nouveau = c.variante()
            if (!nouveau) return
            nouveau.dataset.variante = 'oui'
            zone.replaceChildren(nouveau)
            monterEx(nouveau)
          })
          ex.append(zone)
        }

        function ligneSaisie(ex, mode, large) {
          const input = el('input', {
            type: 'text',
            inputmode: mode === 'texte' ? 'text' : 'numeric',
            autocomplete: 'off',
            autocapitalize: 'off',
            spellcheck: 'false',
            'aria-label': 'Ta réponse',
            id: 'champ-' + (ex.dataset.id || 'x') + '-' + Math.random().toString(36).slice(2, 7),
          })
          if (large) input.classList.add('large')
          const bouton = el('button', { type: 'button', class: 'bouton', text: 'Vérifier' })
          const ligne = el('div', { class: 'saisie' }, input, bouton)
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') bouton.click()
          })
          return { ligne, input, bouton }
        }
        /** Un octet écrit en chiffres : exactement 8 chiffres, des 0 et des 1 (espaces ignorés). */
        function lireBits(s) {
          const b = s.replace(/\s/g, '')
          if (b === '') return { format: 'Écris ta réponse dans la case.' }
          if (!/^[01]{8}$/.test(b))
            return {
              format:
                'Un octet s’écrit avec exactement 8 chiffres, des 0 et des 1. Complète avec des 0 à gauche si besoin.',
            }
          return { b }
        }
        /** Un nouvel exercice du même type, pour la variante du cours. */
        function nouvelEx(widget, donnees, question, avant) {
          const ex = el('div', { class: 'ex', 'data-widget': widget })
          for (const [cle, val] of Object.entries(donnees)) ex.dataset[cle] = String(val)
          ex.append(el('p', { class: 'q', text: question }))
          if (avant) ex.append(avant)
          return ex
        }
        const avecLampes = (ex) =>
          Boolean(
            $(':scope > .lampes[role="img"]', ex) ||
            $('.lampes[role="img"]', ex.closest('.ecran, [data-ecran]') ?? ex),
          )

        const TYPES = {
          nombre(ex) {
            const d = ex.dataset
            const rep = Number(d.reponse)
            const { ligne, input, bouton } = ligneSaisie(ex, 'nombre', rep >= 100000)
            ex.append(ligne)
            const c = {
              solution() {
                if (d.diag === 'lire') return solLire(d.bits)
                if (d.diag === 'hexa16') return solHexa16(d.hex)
                if (d.diag === 'programme') return solProgramme(octetsDe(ex))
                if (d.diag === 'pixels')
                  return (
                    milliers(Number(d.largeur)) +
                    ' × ' +
                    milliers(Number(d.hauteur)) +
                    ' = ' +
                    milliers(Number(d.largeur) * Number(d.hauteur)) +
                    ' pixels, × 3 octets = ' +
                    milliers(rep) +
                    ' octets'

                if (d.diag === 'valeurs' && d.n) return '2 puissance ' + d.n + ' = ' + milliers(rep)
                if (d.diag === 'max' && d.n)
                  return (
                    '2 puissance ' +
                    d.n +
                    ' = ' +
                    milliers(rep + 1) +
                    ' valeurs, de 0 à ' +
                    milliers(rep)
                  )
                if (d.diag === 'bitsmin')
                  return (
                    '2 puissance ' +
                    (rep - 1) +
                    ' = ' +
                    milliers(2 ** (rep - 1)) +
                    ' ne suffit pas ; 2 puissance ' +
                    rep +
                    ' = ' +
                    milliers(2 ** rep) +
                    ' suffit : ' +
                    rep +
                    ' bits'
                  )
                return milliers(rep)
              },
              remplir() {
                input.value = milliers(rep)
              },
              bloquer() {
                input.disabled = bouton.disabled = true
              },
            }
            if (d.diag === 'lire')
              c.variante = () => {
                let n
                do n = auHasard(1, 254)
                while (n === rep)
                const bits = binaire(n)
                return nouvelEx(
                  'nombre',
                  { reponse: n, bits, diag: 'lire' },
                  'Que vaut cet octet ?',
                  avecLampes(ex)
                    ? lampesAffichage(bits, false)
                    : el('p', { class: 'octet-texte', text: bits }),

              }
            if ((d.diag === 'valeurs' || d.diag === 'max') && d.n)
              c.variante = () => {
                let k
                do k = auHasard(2, 12)
                while (k === Number(d.n))
                return d.diag === 'valeurs'
                  ? nouvelEx(
                      'nombre',

                  : nouvelEx(

              }
            if (d.diag === 'programme')
              c.variante = () => {
                let a, b
                do {
                  a = auHasard(2, 40)
                  b = auHasard(2, 40)
                } while (a + b === rep)
                const o = [1, a, 2, b, 3, 0]
                return nouvelEx(
                  'nombre',
                  { reponse: a + b, diag: 'programme', octets: o.join(' ') },
                  'Lis ce programme avec le jeu d’instructions. Qu’affichera l’écran ?',
                  el('p', { class: 'octet-texte', text: o.map(binaire).join(' ') }),
                )
              }
            if (d.diag === 'pixels')
              c.variante = () => {
                const tailles = [
                  [800, 600],
                  [1024, 768],
                  [1280, 720],
                  [1920, 1080],
                  [2000, 1500],
                  [3000, 2000],
                ].filter(([w]) => w !== Number(d.largeur))
                const [w, h] = tailles[auHasard(0, tailles.length - 1)]
                return nouvelEx(
                  'nombre',
                  { reponse: w * h * 3, diag: 'pixels', largeur: w, hauteur: h },
                  'Une photo fait ' +
                    milliers(w) +
                    ' × ' +
                    milliers(h) +
                    ' pixels. Combien d’octets pour ses pixels, sans compression ?',
                )
              }
            if (d.diag === 'hexa16')
              c.variante = () => {
                let n
                do n = auHasard(17, 254)
                while (n === rep)
                return nouvelEx(
                  'nombre',
                  { reponse: n, hex: hex2(n), diag: 'hexa16' },
                  'Que vaut ' + hex2(n) + ', de 0 à 255 ?',
                )
              }
            if (d.diag === 'bitsmin')
              c.variante = () => {
                const cas = [50, 200, 500, 700, 2000, 3000, 5000].filter(
                  (v) => v !== Number(d.valeurs),
                )
                const v = cas[auHasard(0, cas.length - 1)]
                return nouvelEx(
                  'nombre',
                  { reponse: Math.ceil(Math.log2(v)), diag: 'bitsmin', valeurs: v },
                  'Pour ' + milliers(v) + ' valeurs, combien faut-il de bits ?',
                )
              }
            bouton.addEventListener('click', () => {
              const r = entier(input.value)
              if (input.value.trim() === '')
                return void dire(ex, '', 'Écris ta réponse dans la case.')
              if (Number.isNaN(r)) return void dire(ex, '', 'Écris un nombre entier.')
              if (r === rep) return repondre(ex, c, { ok: true, v: input.value })
              let diag = null
              if (d.diag === 'lire') diag = diagLire(d.bits, r)
              else if (DIAG[d.diag]) diag = DIAG[d.diag](rep, r, ex)
              if (!diag && !d.sinon && DEFAUT[d.diag]) diag = { m: DEFAUT[d.diag] }
              repondre(ex, c, { ok: false, d: diag, v: input.value })
            })
            return c
          },
          poids(ex) {
            const rep = ex.dataset.reponse
              .split(' ')
              .map(Number)
              .sort((a, b) => b - a)
            const bits = ex.dataset.bits
            // Le clavier complet : le pavé numérique d'un téléphone n'a pas toujours d'espace.
            const { ligne, input, bouton } = ligneSaisie(ex, 'texte')
            ex.append(ligne)
            const c = {
              solution: () => 'les bits à 1 sont sous les poids ' + rep.join(', '),
              remplir() {
                input.value = rep.join(' ')
              },
              bloquer() {
                input.disabled = bouton.disabled = true
              },
            }
            bouton.addEventListener('click', () => {
              const r = (input.value.match(/\d+/g) || []).map(Number).sort((a, b) => b - a)
              if (!r.length) return void dire(ex, '', 'Écris les poids, séparés par des espaces.')
              if (r.join() === rep.join()) return repondre(ex, c, { ok: true, v: input.value })
              const inv = POIDS.filter((w, i) => envers(bits)[i] === '1')
              let diag
              if (r.join() === inv.join())
                diag = {
                  e: 'E4',
                  m: 'Ce sont les poids lus à l’envers. Le poids 128 est sous le bit de gauche.',
                }
              else if (r.some((x) => !POIDS.includes(x)))
                diag = { m: 'Les poids possibles sont 128, 64, 32, 16, 8, 4, 2 et 1.' }
              else diag = { m: 'Regarde chaque bit à 1 et lis le poids écrit juste en dessous.' }
              repondre(ex, c, { ok: false, d: diag, v: input.value })
            })
            return c
          },
          texte(ex) {
            const d = ex.dataset
            const rep = d.reponse
            const souple = d.casse === 'non'
            const norm = (s) => (souple ? s.trim().toLowerCase().replace(/\s+/g, '') : s.trim())
            const { ligne, input, bouton } = ligneSaisie(ex, 'texte')
            ex.append(ligne)
            const c = {
              solution() {
                if (d.diag === 'css') return solCss(rep)
                if (d.diag === 'hexa') {
                  const n = parseInt(rep, 16)
                  return moities(n) + ', soit ' + (n >> 4) + ' et ' + (n & 15) + ', donc ' + rep
                }
                if (d.moitie) return d.moitie + ' vaut ' + parseInt(d.moitie, 2) + ', soit ' + rep
                if (d.bits) return solLire(d.bits) + ', soit ' + rep + ' dans la table'
                return rep
              },
              remplir() {
                input.value = rep
              },
              bloquer() {
                input.disabled = bouton.disabled = true
              },
            }
            if (d.diag === 'css')
              c.variante = () => {
                const v = [
                  auHasard(0, 15) * 16 + auHasard(0, 15),
                  auHasard(0, 255),
                  auHasard(0, 15) * 17,
                ]
                return nouvelEx(
                  'texte',
                  { reponse: '#' + v.map(hex2).join(''), casse: 'non', diag: 'css' },
                  'Écris ' + rgb(...v) + ' en hexadécimal, avec le # devant.',
                )
              }
            if (d.diag === 'hexa')
              c.variante = () => {
                let n
                do n = auHasard(17, 254)
                while (hex2(n) === rep)
                return nouvelEx(
                  'texte',
                  { reponse: hex2(n), casse: 'non', diag: 'hexa' },
                  n + ' s’écrit ' + binaire(n) + '. Écris-le en hexadécimal, avec deux chiffres.',
                )
              }
            if (d.moitie)
              c.variante = () => {
                let n
                do n = auHasard(1, 15)
                while (n.toString(16) === rep)
                const m = n.toString(2).padStart(4, '0')
                return nouvelEx(
                  'texte',
                  { reponse: n.toString(16), casse: 'non', moitie: m },
                  'Quel chiffre hexadécimal écrit ' + m + ' ?',
                )
              }
            bouton.addEventListener('click', () => {
              const r = input.value
              if (!r.trim()) return void dire(ex, '', 'Écris ta réponse dans la case.')
              if (d.diag === 'css' && !norm(r).startsWith('#'))
                return void dire(ex, '', 'Ajoute le # devant, comme dans le CSS.')
              if (norm(r) === norm(rep)) return repondre(ex, c, { ok: true, v: r })
              repondre(ex, c, { ok: false, d: diagTexte(ex, r), v: r })
            })
            return c
          },
          octet(ex) {
            const n = Number(ex.dataset.reponse)
            const c = { solution: () => solEcrire(n) }
            c.variante = () => {
              let m
              do m = auHasard(1, 254)
              while (m === n)
              return nouvelEx(
                'octet',
                {
                  reponse: m,
                  ...(ex.dataset.saisie ? { saisie: ex.dataset.saisie } : {}),
                  ...(ex.hasAttribute('data-poids') ? { poids: '' } : {}),
                },
                'Écris ' + m + ' en binaire.',

            }
            if (ex.dataset.saisie === 'texte') {
              const { ligne, input, bouton } = ligneSaisie(ex, 'nombre')
              input.classList.add('octet')
              input.setAttribute('aria-label', 'Ton octet, en 8 chiffres')
              ex.append(ligne)
              c.remplir = () => {
                input.value = binaire(n)
              }
              c.bloquer = () => {
                input.disabled = bouton.disabled = true
              }
              bouton.addEventListener('click', () => {
                const f = lireBits(input.value)
                if (f.format) return void dire(ex, '', f.format)
                const diag = diagEcrire(n, f.b)
                repondre(
                  ex,
                  c,
                  diag
                    ? { ok: false, d: diag, v: f.b }
                    : { ok: true, v: f.b, m: 'Juste : ' + n + ' = ' + f.b + '.' },
                )
              })
              return c
            }
            const saisie = lampesSaisie(ex.dataset.fixe || '', ex.hasAttribute('data-poids'))
            const bouton = el('button', { type: 'button', class: 'bouton', text: 'Vérifier' })
            ex.append(saisie.noeud, el('div', { class: 'saisie' }, bouton))
            c.remplir = () => saisie.poser(binaire(n))
            c.bloquer = () => {
              saisie.bloquer()
              bouton.disabled = true
            }
            bouton.addEventListener('click', () => {
              const b = saisie.valeur()
              const diag = diagEcrire(n, b)
              repondre(

                c,
                diag
                  ? { ok: false, d: diag, v: b }
                  : { ok: true, v: b, m: 'Juste : ' + n + ' = ' + b + '.' },

            })

          },
          octets(ex) {
            const reps = ex.dataset.reponse.split(',').map(Number)
            const noms = (ex.dataset.noms || '').split(',')
            const nom = (i) => noms[i] || 'Octet ' + (i + 1)
            const texte = ex.dataset.saisie === 'texte'
            const bouton = el('button', { type: 'button', class: 'bouton', text: 'Vérifier' })
            let champs
            if (texte) {
              const zone = el('div', { class: 'saisie-octets' })
              champs = reps.map((n, i) => {
                const input = el('input', {

                  inputmode: 'numeric',

              remplir() {

                .map((n, i) => ({ i, d: diagEcrire(n, lus[i]) }))

              const x = erreurs[0]

          choix(ex) {

            const c = {

          tableconv(ex) {
            const n = Number(ex.dataset.n)
            const corps = $('tbody', ex)
            let reste = n
            let ligne = 0
            const c = {
              solution: () => solEcrire(n),
              remplir() {
                while (ligne < 8) valider(ligne, (n & POIDS[ligne]) !== 0, true)
              },
              bloquer() {},
            }
            const lignes = POIDS.map((w, i) => {
              const oui = el('button', {
                type: 'button',
                class: 'bouton secondaire petit',
                text: 'Oui',
              })
              const non = el('button', {
                type: 'button',
                class: 'bouton secondaire petit',
                text: 'Non',
              })
              const tr = el(
                'tr',
                {},
                el('td', { text: w }),
                el('td', {}, el('span', { class: 'choix-conv' }, oui, non)),
                el('td', { class: 'bit' }),
                el('td', { class: 'reste' }),
              )
              corps.append(tr)
              const choisir = (dit) => {
                if (i !== ligne || fini(ex)) return
                const rentre = w <= reste
                if (dit !== rentre) {
                  ex.dataset.fautes = String(Number(ex.dataset.fautes || 0) + 1)
                  dire(
                    ex,
                    'faux',
                    rentre
                      ? w + ' rentre dans ' + reste + ' : ' + w + ' est plus petit ou égal.'
                      : w + ' ne rentre pas dans ' + reste + ' : ' + w + ' est plus grand.',
                  )
                  return
                }
                dire(ex, '', '')
                valider(i, rentre)
              }
              oui.addEventListener('click', () => choisir(true))
              non.addEventListener('click', () => choisir(false))
              return { tr, oui, non, w }
            })
            function valider(i, rentre, silence) {
              const L = lignes[i]
              ;(rentre ? L.oui : L.non).setAttribute('aria-pressed', 'true')
              if (rentre) reste -= L.w
              $('.bit', L.tr).textContent = rentre ? '1' : '0'
              $('.reste', L.tr).textContent = rentre
                ? reste + L.w + ' − ' + L.w + ' = ' + reste
                : String(reste)
              L.oui.disabled = L.non.disabled = true
              L.tr.classList.remove('active')
              ligne = i + 1
              if (ligne < 8) lignes[ligne].tr.classList.add('active')
              else if (!silence)
                repondre(ex, c, { ok: true, m: 'Juste : ' + n + ' s’écrit ' + binaire(n) + '.' })
            }
            lignes[0].tr.classList.add('active')
            c.sansEchelle = true
            return c
          },
          programme(ex) {
            const cible = Number(ex.dataset.reponse)
            const grille = el('div', { class: 'ecrit-prog' })
            grille.append(
              el('span'),
              el('span', { class: 'discret', text: 'Quoi faire' }),
              el('span', { class: 'discret', text: 'Nombre' }),
            )
            const champs = []
            const bouton = el('button', { type: 'button', class: 'bouton', text: 'Vérifier' })
            for (let k = 0; k < 3; k++) {
              grille.append(el('span', { text: 'Instruction ' + (k + 1) }))
              for (let j = 0; j < 2; j++) {
                const input = el('input', {
                  type: 'text',
                  inputmode: 'numeric',
                  autocomplete: 'off',
                  'aria-label':
                    'Instruction ' + (k + 1) + ', ' + (j === 0 ? 'premier' : 'second') + ' octet',
                })
                input.addEventListener('keydown', (e) => {
                  if (e.key === 'Enter') bouton.click()
                })
                champs.push(input)
                grille.append(input)
              }
            }
            ex.append(grille, el('div', { class: 'saisie' }, bouton))
            const SOL = [1, 5, 2, 7, 3, 0]
            let dernier = null
            const c = {
              solution: () =>
                'par exemple 1 5, 2 7, 3 0 : il range 5, ajoute 7, puis affiche ' + cible,
              remplir(etat) {
                const vs = etat === 'vu' || !dernier ? SOL : dernier
                champs.forEach((x, i) => {
                  x.value = vs[i] ?? ''
                })
              },
              bloquer() {
                champs.forEach((x) => {
                  x.disabled = true
                })
                bouton.disabled = true
              },
            }
            bouton.addEventListener('click', () => {
              if (champs.some((x) => x.value.trim() === ''))
                return void dire(ex, '', 'Remplis les six cases : deux octets par instruction.')
              const o = champs.map((x) => entier(x.value))
              if (o.some((n) => Number.isNaN(n) || n > 255))
                return void dire(ex, '', 'Dans chaque case, écris un nombre entier de 0 à 255.')
              const x = executer(o)
              dernier = o
              const stop = x.pas.find((p) => p.arret)
              if (stop)
                return repondre(ex, c, {
                  ok: false,
                  d: {
                    m:
                      'L’instruction ' +
                      (stop.i / 2 + 1) +
                      ' commence par ' +
                      stop.op +
                      ', qui n’est pas dans la table : le processeur s’arrête là. Chaque instruction commence par 1, 2 ou 3.',
                  },
                })
              if (x.ecran === null)
                return repondre(ex, c, {
                  ok: false,
                  d: {
                    m: 'Ton programme n’affiche rien : il faut une instruction 3 pour montrer le registre.',
                  },
                })
              if (x.ecran !== cible)
                return repondre(ex, c, {
                  ok: false,
                  d: { m: 'Ton programme affiche ' + x.ecran + ', pas ' + cible + '.' },
                })
              repondre(ex, c, { ok: true, m: 'Juste. ' + x.pas.map((p) => p.m).join(' ') })
            })
            return c
          },
          schema(ex) {
            // Le schéma refait de mémoire, jugé par l'IA (règle C08) : l'éditeur et le modèle caché
            // sont ceux du gabarit. Solide, il est réussi ; sinon, après deux essais, le modèle paraît.
            const schema = window.JanusGabarit.schema(ex)
            const cle = 'ex:' + ex.dataset.id
            const c = {
              sansEchelle: true,
              solution: () => schema.attendu,
              remplir() {
                schema.montrer()
              },
              bloquer() {
                schema.bloquer()
              },
            }
            ex.addEventListener('fiche:trace', (e) => {
              const trace = e.detail?.valeur
              if (e.detail?.cle !== 'explique:' + cle || typeof trace?.fin !== 'string') return
              if (fini(ex)) return
              const derniere = trace.essais?.[trace.essais.length - 1]?.correction
              const solide = derniere?.niveau === 'solide'
              const etat = trace.fin === 'simulee' || solide ? 'ok' : 'vu'
              tracer(cle, { e: etat, v: null })
              appliquer(
                ex,
                c,
                etat,
                null,
                solide
                  ? 'Ton schéma est Solide. Voici celui du cours, pour comparer.'
                  : 'Voici le schéma du cours\u00a0: compare-le au tien, boîte par boîte, flèche par flèche.',
              )
            })
            queueMicrotask(() =>
              ex.dispatchEvent(
                new CustomEvent('fiche:expliquer', {
                  bubbles: true,
                  detail: {
                    cle,
                    solution: schema.attendu,
                    consigne: 'Ton schéma, de mémoire\u00a0:',
                    question: schema.question,
                    saisie: schema.saisie,
                    essais: 2,
                    envoyer: 'Faire juger mon schéma',
                  },
                }),
              ),
            )
            return c
          },
        }

        /** Monte un exercice : son contrôleur, son échelle d'aide, et l'état gardé d'une visite précédente. */
        function monterEx(ex) {
          const fabrique = TYPES[ex.dataset.widget]
          if (!fabrique) return
          const c = fabrique(ex)
          if (ex.dataset.solution) c.solution = () => ex.dataset.solution
          retourDe(ex)
          if ('essai' in ex.dataset) return monterEssai(ex, c)
          if (!c.sansEchelle) {
            c.echelle = window.JanusGabarit.echelle(ex, {
              crans: cransCalcules(ex).map(fr),
              fini: () => fini(ex),
              surSolution: () => montrerSolution(ex, c),
            })
            ex.append(c.echelle.zone)
          }
          if (dansItem(ex) || ex.dataset.variante) return
          const garde = traces['ex:' + ex.dataset.id]
          if (garde && typeof garde === 'object' && garde.e) {
            // Une solution vue, ni refaite ni expliquée à la visite d'avant : la suite de l'écran
            // attend encore (règle F04).
            const cle = 'explique:ex:' + ex.dataset.id
            const reprise =
              garde.e === 'vu' &&
              avecReprise(ex) &&
              !garde.refait &&
              !traces[cle] &&
              !traces[cle + ':variante']
            if (reprise) ex.dataset.reprise = 'oui'
            appliquer(ex, c, garde.e, garde.v)
            if (reprise) apresSolution(ex, c)
            else if (garde.e === 'vu') proposerVariante(ex, c)
          }
        }

        /**
         * Un essai de l'étape 3 : pas d'échelle d'aide (rien ne s'aide avant l'explication). Déjà répondu,
         * il reste fini ; « Je ne sais pas », que le gabarit ajoute, arrive ici en fiche:essai-passe.
         */
        function monterEssai(ex, c) {
          if (traces['essai:' + ex.dataset.id]) {
            ex.dataset.fini = 'oui'
            c.bloquer?.()
            return
          }
          ex.addEventListener('fiche:essai-passe', () => {
            if (!fini(ex)) essayer(ex, c, { ok: false })
          })
        }

        /**
         * Pas à pas : dans un écran, ce qui suit un exercice pas encore fini attend qu'il le soit (une
         * question à la fois, règle I01). Un groupe d'exercices compte pour une question.
         */
        function devoiler(ecran) {
          if (!ecran) return
          let attendre = false
          for (const enfant of Array.from(ecran.children)) {
            if (attendre) {
              enfant.dataset.attente = ''
              continue
            }
            delete enfant.dataset.attente
            const exercices = enfant.matches('.ex[data-id]') ? [enfant] : $$('.ex[data-id]', enfant)
            if (exercices.some((ex) => !fini(ex) || ex.dataset.reprise === 'oui')) attendre = true
          }
        }

        /** Le compteur à lampes : de 1 à 4 lampes, +1, remise à 0. Au-delà, l'apprenant prédit (étape 3). */
        function compteur(n) {
          let nb = 3
          let v = 0
          const tailles = el(
            'div',

            })
            b.addEventListener('click', () => {

              peindre('')
            })
            tailles.append(b)

          function peindre(texte) {
            lampes.replaceChildren(

            )
            afficheur.textContent = String(v)
            message.textContent = fr(texte)
          }
          plus.addEventListener('click', () => {
            v += 1
            if (v >= 2 ** nb) {
              v = 0
              peindre(
                'Le compteur est repassé à 0 : avec ' +
                  nb +
                  ' lampe' +
                  (nb > 1 ? 's' : '') +
                  ', il ne peut pas aller plus loin.',

            } else peindre('')
          })
          zero.addEventListener('click', () => {

          n.append(

            el('div', { class: 'rangee' }, el('span', { text: 'Compteur :' }), afficheur),
            el('div', { class: 'rangee' }, plus, zero),

          peindre('')

        /** Le processeur pas à pas, sur le programme de l'exercice ou sur le fichier du début. */
        function processeur(n) {
          const progs = {
            'Le programme ci-dessus': [1, 5, 2, 3, 3, 0],
            'Le fichier du début': FICHIER,
          }
          let octets = []
          let trace = null
          let pas = 0
          const choix = el('div', {
            class: 'rangee',
            role: 'group',
            'aria-label': 'Octets donnés au processeur',
          })
          const zoneOctets = el('div', { class: 'programme' })
          const registre = el('span', { class: 'mono' })
          const ecran = el('span', { class: 'mono' })
          const message = el('p', { class: 'message-outil', 'aria-live': 'polite' })
          const suivant = el('button', {
            type: 'button',
            class: 'bouton',
            text: 'Instruction suivante',
          })
          const recommencer = el('button', {
            type: 'button',
            class: 'bouton secondaire',
            text: 'Recommencer',
          })
          function peindre() {
            const courant = trace.pas[pas - 1]
            zoneOctets.replaceChildren(
              ...octets.map((x, i) => {
                const s = el('span', {}, el('b', { text: binaire(x) }), el('small', { text: x }))
                if (courant && (i === courant.i || i === courant.i + 1)) s.classList.add('actif')
                return s
              }),
            )
            registre.textContent = courant ? String(courant.reg) : '0'
            ecran.textContent = courant && courant.ecran !== null ? String(courant.ecran) : 'rien'
            const termine = pas >= trace.pas.length
            let m = 'Clique sur « Instruction suivante » pour lancer le processeur.'
            if (courant)
              m =
                courant.m +
                (courant.arret
                  ? ' Pour lui, ces octets ne veulent rien dire.'
                  : termine
                    ? ' Fin du programme.'
                    : '')
            message.textContent = fr(m)
            suivant.disabled = termine
          }
          function charger(nom) {
            octets = progs[nom]
            trace = executer(octets)
            pas = 0
            $$('button', choix).forEach((b) =>
              b.setAttribute('aria-pressed', String(b.dataset.nom === nom)),
            )
            peindre()
          }
          for (const nom of Object.keys(progs)) {
            const b = el('button', {
              type: 'button',
              class: 'bouton secondaire petit',
              'data-nom': nom,
              text: nom,
            })
            b.addEventListener('click', () => charger(nom))
            choix.append(b)
          }
          suivant.addEventListener('click', () => {
            if (pas < trace.pas.length) {
              pas += 1
              peindre()
            }
          })
          recommencer.addEventListener('click', () => {
            pas = 0
            peindre()
          })
          n.append(
            choix,
            zoneOctets,
            el(
              'p',
              { class: 'jauge' },
              el('span', {}, 'Registre : ', registre),
              el('span', {}, 'Écran : ', ecran),
            ),
            message,
            el('div', { class: 'rangee' }, suivant, recommencer),
          )
          charger(Object.keys(progs)[0])
        }

          temps.slice(8) +
          '-7' +

      // Sur #contenu, qui porte tous les exercices de la page.
      $('contenu').addEventListener('fiche:expliquer', (evenement) => {
        const {
          cle,
          solution,
          consigne,
          question,
          saisie,
          essais: permis,
          envoyer,
        } = evenement.detail ?? {}
        const exercice = evenement.target
        if (!(exercice instanceof HTMLElement) || typeof cle !== 'string' || cle === '') return
        if (exercice.querySelector(':scope > .expliquer')) return
        const declaree = explicationDeclaree(cle)
        // Une explication déclarée a deux essais ; une autre, un seul, sauf si l'outil en permet plus.
        const maximum = declaree
          ? ESSAIS_D_EXPLICATION
          : Number.isInteger(permis) && permis > 0
            ? permis
            : 1
        // La page montre la consigne de l'outil ; le correcteur lit la question du manifeste, qui se
        // comprend sans l'écran.
        const intitule =
          typeof consigne === 'string' && consigne !== ''
            ? consigne
            : 'Explique pourquoi c’est juste, en une ou deux phrases\u00a0:'
        const ancienne = etat.traces?.['explique:' + cle]
        const essais = Array.isArray(ancienne?.essais) ? ancienne.essais : []
        const zone = creer('div', { className: 'expliquer' })
        zone.setAttribute('aria-live', 'polite')
        const lue = (essai) => [
          creer('p', { className: 'explication-envoyee', textContent: essai.texte }),
          bulleCorrection(essai.correction),
          ...accordSur(essai.correction),
        ]
        /** L'explication est finie : la trace part, l'outil et l'item lisent la suite. */
        const finir = (fin) => {
          if (declaree && (fin === 'solide' || fin === 'simulee')) {
            etat.pratique[declaree.item] = {
              ...(etat.pratique[declaree.item] ?? {}),
              explique: true,
            }
          }
          exercice.dispatchEvent(
            new CustomEvent('fiche:trace', {
              bubbles: true,
              detail: { cle: 'explique:' + cle, valeur: { essais, fin, le: aujourdhui() } },
            }),
          )
          exercice.dispatchEvent(new CustomEvent('fiche:explique', { bubbles: true }))
        }
        const formulaire = (rang) => {
          const id = 'explique-' + cle.replace(/[^\w-]/g, '_') + '-' + rang
          // L'outil peut donner sa saisie (un schéma à refaire) : la page la lit en texte.
          const champ = saisie
            ? saisie.element
            : creer('textarea', {
                id,
                rows: 3,
                value: rang === 0 && typeof ancienne?.texte === 'string' ? ancienne.texte : '',
              })
          const lireChamp = () => (saisie ? saisie.lire() : champ.value)
          let colle = false
          champ.addEventListener('paste', () => {
            colle = true
          })
          const radios = [
            ['sur', 'Sûr'],
            ['hesitant', 'Hésitant'],
            ['hasard', 'Au hasard'],
          ].map(([valeur, libelle]) => ({
            libelle,
            entree: creer('input', { type: 'radio', name: 'conf-' + id, value: valeur }),
          }))
          const confiance = creer(
            'fieldset',
            { className: 'choix', dataset: { lecture: '' } },
            creer('legend', { textContent: 'Ta confiance' }),
            ...radios.map(({ libelle, entree }) => creer('label', {}, entree, libelle)),
          )
          const message = creer('p', { className: 'erreur', role: 'alert' })
          const bouton = creer('button', {
            type: 'button',
            className: 'bouton secondaire petit',
            textContent:
              typeof envoyer === 'string' && envoyer !== '' ? envoyer : 'Envoyer mon explication',
          })
          const bloc = creer(
            'div',
            { className: 'expliquer-essai' },
            creer(saisie ? 'p' : 'label', {
              ...(saisie ? {} : { htmlFor: id }),
              textContent:
                rang === 0
                  ? intitule
                  : saisie
                    ? 'Reprends-le, d’après la correction\u00a0:'
                    : 'Reprends ton explication, d’après la correction\u00a0:',
            }),
            champ,
            confiance,
            creer('div', { className: 'actions' }, bouton),
            message,
          )
          bouton.addEventListener('click', async () => {
            const choisie = confiance.querySelector('input:checked')
            const manque = saisie ? saisie.manque() : ''
            if (manque) return void (message.textContent = manque)
            if (lireChamp().trim() === '')
              return void (message.textContent = 'Écris d’abord ton explication.')
            if (!choisie)
              return void (message.textContent = 'Choisis ta confiance avant d’envoyer.')
            message.textContent = ''
            bouton.disabled = true
            try {
              const correction = await pont.demanderCorrection({
                serie: 'explication',
                question: cle,
                reponse: lireChamp(),
                confiance: choisie.value,
                relance: '',
                support: { colle, retour_cours: etat.retourCours },
                ...(declaree
                  ? {}
                  : {
                      libre: {
                        question:
                          typeof question === 'string' && question !== '' ? question : intitule,
                        attendu: String(solution ?? ''),
                      },
                    }),
              })
              noterReperees('explique:' + cle, correction.erreurs_critiques)
              essais.push({ texte: lireChamp(), correction: resumeCorrection(correction) })
              const fin =
                mode === 'autonome'
                  ? 'simulee'
                  : !declaree
                    ? correction.niveau === 'solide' || essais.length >= maximum
                      ? 'jugee'
                      : null
                    : correction.niveau === 'solide' && correction.compte
                      ? 'solide'
                      : essais.length >= maximum
                        ? 'ratee'
                        : null
              if (fin === null) {
                etat.traces = {
                  ...(etat.traces ?? {}),
                  ['explique:' + cle]: { essais, fin, le: aujourdhui() },
                }
                enregistrer()
              } else finir(fin)
              // La correction affichée est celle que la trace garde : l'avis demandé s'y enregistre.
              const gardees = etat.traces['explique:' + cle].essais
              bloc.replaceWith(...lue(gardees[gardees.length - 1]))
              if (fin === null) zone.append(formulaire(rang + 1))
              if (fin === 'ratee') {
                const raison =
                  'Ton explication n’est pas encore Solide\u00a0: voici la solution de l’item, puis tu le refais sur un autre cas.'
                zone.append(creer('p', { className: 'discret', textContent: raison }))
                exercice.dispatchEvent(
                  new CustomEvent('fiche:explication-ratee', {
                    bubbles: true,
                    detail: { message: raison },
                  }),
                )
              }
            } catch (erreur) {
              message.textContent =
                'Correction impossible\u00a0: ' +
                (erreur && erreur.detail ? erreur.detail : erreur.message) +
                ' Ton explication attend\u00a0: renvoie-la.'
              bouton.disabled = false
            }
          })
          return bloc
        }
        if (essais.length > 0) zone.append(creer('p', { textContent: intitule }))
        for (const essai of essais) zone.append(...lue(essai))
        if (ancienne?.fin === undefined || ancienne.fin === null)
          zone.append(formulaire(essais.length))
        exercice.append(zone)
        // De retour sur la page, l'outil qui attend la fin de l'explication la relit.
        if (typeof ancienne?.fin === 'string' && ancienne.fin !== 'ratee') {
          exercice.dispatchEvent(
            new CustomEvent('fiche:trace', {
              bubbles: true,
              detail: { cle: 'explique:' + cle, valeur: ancienne },
            }),
          )
        }
      })
      /*
       * La tentative avant l'explication (règles C03 et M01) : dans une étape `pretest`, chaque exercice
       * `data-essai` (avec son `data-id`) émet `fiche:essai`, avec `detail: { cle, reponse, juste,
       * attendu, retour }`. La page garde la première réponse (trace `essai:<cle>`), l'envoie une fois à
       * l'appli (`pretest.reponse`), ne dit ni juste ni faux, et corrige toute la série à la fin de
       * l'étape, sous « Tes essais ». « Je ne sais pas » est une réponse : la page émet
       * `fiche:essai-passe` sur l'exercice, et l'outil y répond par `fiche:essai`, sa réponse attendue
       * avec ; sans outil qui réponde, la page lit l'attendu dans les attributs de l'exercice.
       */
      document.addEventListener('fiche:essai', (evenement) => {
        const { cle, reponse, juste, attendu, retour } = evenement.detail ?? {}
        if (typeof cle !== 'string' || cle === '' || etat.traces?.['essai:' + cle]) return
        noterEssai(cle, {
          reponse: typeof reponse === 'string' && reponse.trim() !== '' ? reponse.trim() : null,
          juste: juste === true,
          attendu: typeof attendu === 'string' ? attendu : '',
          retour: typeof retour === 'string' ? retour : '',
        })
      })
      function noterEssai(cle, essai) {
        etat.traces = { ...(etat.traces ?? {}), ['essai:' + cle]: { ...essai, le: aujourdhui() } }
        pont.envoyer('pretest.reponse', {
          question: cle,
          reponse: (essai.reponse ?? 'Je ne sais pas').slice(0, 2000),
        })
        enregistrer()
        majEssais()
        rappelerEssais($('contenu'))
      }
      /**
       * Une explication qui part des essais (règle C03) : `data-essai-rappel="c2"` affiche la réponse
       * notée à l'essai c2 (son texte reste tant qu'il n'y en a pas) ; `data-si-essai="c2:faux"` ne
       * montre l'élément que si l'essai c2 est dans cet état : `juste`, `faux`, `passe` (« Je ne sais
       * pas ») ou `absent` (pas encore fait), plusieurs séparés par `|`.
       */
      function rappelerEssais(racine) {
        for (const el of racine.querySelectorAll('[data-essai-rappel]')) {
          const essai = etat.traces?.['essai:' + el.dataset.essaiRappel]
          if (essai?.reponse) el.textContent = entreGuillemets(essai.reponse)
        }
        for (const el of racine.querySelectorAll('[data-si-essai]')) {
          const [cle, etats = ''] = el.dataset.siEssai.split(':')
          const essai = etat.traces?.['essai:' + cle]
          const etatEssai = !essai
            ? 'absent'
            : essai.reponse === null
              ? 'passe'
              : essai.juste
                ? 'juste'
                : 'faux'
          el.hidden = !etats.split('|').includes(etatEssai)
        }
      }
      /** Ce qu'un exercice attend, quand aucun outil ne le dit : l'option juste, la solution, la réponse. */
      function attenduEcrit(ex) {
        const juste = ex.dataset.reponse
        const option = juste
          ? Array.from(ex.querySelectorAll('[data-option]')).find((o) => o.dataset.option === juste)
          : undefined
        return (option?.textContent ?? ex.dataset.solution ?? juste ?? '')
          .replace(/\s+/g, ' ')
          .trim()
      }
      /** Une réponse citée : sans point final, et sans doubler des guillemets qu'elle porte déjà. */
      function entreGuillemets(texte) {
        const t = texte.replace(/[.;\s]+$/, '')
        return /^«.*»$/.test(t) ? t : '« ' + t + ' »'
      }
      /** L'énoncé d'un essai, avec la question de son groupe quand il en fait partie (« 1 lampe »). */
      function enonceEssai(ex) {
        const propre = ex.querySelector('.q')?.textContent ?? ''
        const groupe = ex.closest('.groupe')?.querySelector(':scope > .q')?.textContent
        return ((groupe ? groupe + ' ' : '') + propre).replace(/\s+/g, ' ').trim()
      }
      function essaisDe(section) {
        const exercices = Array.from(section.querySelectorAll('[data-essai][data-id]'))
        const essais = exercices.map((ex) => etat.traces?.['essai:' + ex.dataset.id])
        exercices.forEach((ex, k) => {
          const essai = essais[k]
          const passer = ex.querySelector(':scope > .essai-passe')
          if (!essai) {
            if (passer) return
            const bouton = creer('button', {
              type: 'button',
              className: 'bouton secondaire petit',
              textContent: 'Je ne sais pas',
              onclick: () => {
                const cle = ex.dataset.id
                ex.dispatchEvent(new CustomEvent('fiche:essai-passe'))
                if (!etat.traces?.['essai:' + cle])
                  noterEssai(cle, {
                    reponse: null,
                    juste: false,
                    attendu: attenduEcrit(ex),
                    retour: ex.dataset.explication ?? '',
                  })
              },
            })
            ex.append(creer('div', { className: 'actions essai-passe' }, bouton))
            return
          }
          passer?.remove()
          for (const champ of ex.querySelectorAll('input, button, select, textarea'))
            champ.disabled = true
          const note =
            ex.querySelector(':scope > .essai-note') ??
            ex.appendChild(creer('p', { className: 'discret essai-note', 'aria-live': 'polite' }))
          note.textContent =
            (essai.reponse === null
              ? 'Noté : tu ne sais pas encore.'
              : 'Noté : ' + entreGuillemets(essai.reponse) + '.') +
            ' La correction vient à la fin de l’étape.'
        })
        const ecrans = section.querySelectorAll('.ecran')
        const bilan =
          section.querySelector('.essais-bilan') ??
          (ecrans[ecrans.length - 1] ?? section).appendChild(
            creer('div', { className: 'essais-bilan', hidden: true }),
          )
        const fini = exercices.length > 0 && essais.every(Boolean)
        bilan.hidden = !fini
        if (fini)
          bilan.replaceChildren(
            creer('h3', { textContent: 'Tes essais' }),
            creer('p', {
              textContent:
                'Voici ce que tu as répondu, et ce qui était attendu. L’étape suivante explique pourquoi, à partir de tes réponses.',
            }),
            creer(
              'ol',
              {},
              ...exercices.map((ex, k) => {
                const essai = essais[k]
                const fin = (texte) => String(texte).replace(/[.;\s]+$/, '') + '.'
                return creer(
                  'li',
                  {},
                  creer('p', {}, creer('strong', { textContent: enonceEssai(ex) })),
                  // Sans réponse, pas de solution à garder sans l'avoir comprise (règle F04) :
                  // l'étape suivante l'explique, à partir des réponses de la série.
                  ...(essai.reponse === null
                    ? [
                        creer('p', {
                          textContent: 'Tu ne savais pas : l’étape suivante te l’apprend.',
                        }),
                      ]
                    : [
                        creer('p', {
                          textContent:
                            'Ta réponse : ' + fin(essai.reponse) + (essai.juste ? ' Juste.' : ''),
                        }),
                        ...(essai.juste || essai.attendu === ''
                          ? []
                          : [creer('p', { textContent: 'Attendu : ' + fin(essai.attendu) })]),
                        ...(essai.retour
                          ? [creer('p', { className: 'discret', textContent: essai.retour })]
                          : []),
                      ]),
                )
              }),
            ),
          )
        majPied()
      }
      /**
       * Une erreur critique repérée, par le correcteur dans une réponse ou par un outil : elle reste
       * connue après un rechargement, et le bilan suivant la coche d'office (`aCocher`) sans que
       * l'apprenant puisse la décocher (règle V01). `cle` dit où : l'identifiant de la question, ou
       * « outil: » suivi de l'endroit que l'outil nomme.
       */
      function noterReperees(cle, ids) {
        if (ids.length === 0) return
        const deja = etat.erreurs?.[cle] ?? []
        etat.erreurs = { ...(etat.erreurs ?? {}), [cle]: [...new Set([...deja, ...ids])] }
        etat.aCocher = [...new Set([...(etat.aCocher ?? []), ...ids])]
        enregistrer()
      }
      /**
       * Une réponse nouvelle à une question remplace ce que la précédente avait fait repérer : ces
       * erreurs ne sont plus cochées d'office, sauf si une autre réponse ou un outil les a aussi
       * repérées. Sans cela, une erreur refermée par la nouvelle réponse resterait cochée et
       * verrouillée dans le bilan, et l'envoyer la rouvrirait.
       */
      function remplacerReperees(question) {
        etat.erreurs = { ...(etat.erreurs ?? {}), [question]: [] }
        const encore = new Set(Object.values(etat.erreurs).flat())
        etat.aCocher = (etat.aCocher ?? []).filter((id) => encore.has(id))
      }
      /**
       * Amine a rejeté une erreur que le correcteur avait repérée dans la réponse à une question : le
       * bilan ne la coche plus d'office, sauf si une autre réponse ou un outil l'a aussi repérée.
       */
      function retirerReperee(question, erreur) {
        const deja = etat.erreurs?.[question] ?? []
        if (!deja.includes(erreur)) return false
        etat.erreurs = { ...etat.erreurs, [question]: deja.filter((id) => id !== erreur) }
        if (!Object.values(etat.erreurs).some((ids) => ids.includes(erreur)))
          etat.aCocher = (etat.aCocher ?? []).filter((id) => id !== erreur)
        enregistrer()
        return true
      }
      /**
       * Un outil qui reconnaît une erreur critique dans une réponse (des bits lus à l'envers, un départ
       * de 256) émet sur son élément `fiche:erreur` (`bubbles: true`, `cancelable: true`, `detail:
       * { erreur, ou }`). Une fois la restitution faite, l'erreur attend le bilan : le gabarit annule
       * l'événement, et l'outil dit d'envoyer le bilan avant de continuer.
       */
      $('contenu').addEventListener('fiche:erreur', (evenement) => {
        const { erreur, ou } = evenement.detail ?? {}
        if (typeof ou !== 'string' || ou === '') return
        if (!manifeste.erreurs_critiques.some((e) => e.id === erreur)) return
        noterReperees('outil:' + ou, [erreur])
        if (bilanAttendu()) evenement.preventDefault()
      })
      function aller(id) {
        etat.etape = id
        pont.envoyer('etape.vue', { etape: id })
        enregistrer()
        afficher()
        remonter($('contenu'))
      }
      /**
       * Nouvel écran ou nouvelle étape : son haut revient à l'écran. Dans l'appli, la fiche ne défile
       * pas seule (l'iframe a la hauteur du contenu) : c'est l'appli qui remonte, si besoin.
       */
      function remonter(element) {
        if (mode === 'appli') pont.envoyer('page.haut', {})
        else element.scrollIntoView({ block: 'start' })
      }
      const pluriel = (nombre, singulier, plusieurs) =>
        nombre + ' ' + (nombre > 1 ? plusieurs : singulier)
      /** Le jour sur cet appareil, AAAA-MM-JJ : une solution vue ne compte plus le lendemain. */
      function aujourdhui() {
        const date = new Date()
        const deux = (nombre) => String(nombre).padStart(2, '0')
        return date.getFullYear() + '-' + deux(date.getMonth() + 1) + '-' + deux(date.getDate())
      }

      const questions = (serie) => (serie === 'restitution' ? manifeste.restitution : [])
      const reponsesFinies = (serie) => questions(serie).filter((q) => etat.envoyees[q.id]).length
      /**
       * Ce qui retient dans une étape : les questions d'une série ouverte qui n'ont pas encore leur
       * réponse finale. On ne quitte pas une restitution à moitié faite.
       */
      function resteAFaire(etape) {
        // La pratique : chaque item réussi, avec ou sans aide (sans aide, il ne compte qu'un autre
        // jour, et l'apprenant resterait bloqué jusque-là). Une solution vue n'est pas réussie.
        if (etape.type === 'pratique') {
          const items = manifeste.pratique.flatMap((exercice) => exercice.items)
