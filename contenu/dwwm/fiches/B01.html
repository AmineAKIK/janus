                      paris[q.dataset.cle] +
                      '.',
                  }),
                ),
              ),
              el('button', {
                type: 'button',
                className: 'bouton secondaire',
                textContent: 'Changer mes paris',
                onclick: () => {
                  for (const q of questions) oublierPari(q.dataset.cle)
                  montrer()
                },
              }),
            )
          }
          for (const q of questions) {
            const champ = el('input', {
              type: 'text',
              inputMode: 'numeric',
              autocomplete: 'off',
              id: identifiant('p'),
            })
            const avis = el('p', { className: 'discret' })
            vivant(avis)
            const texte = el('span', { className: 'pari-texte' })
            texte.append(...q.childNodes)
            const valider = () => {
              const saisie = champ.value.trim()
              if (!/^\d+$/.test(saisie))
                return void (avis.textContent = 'Écris un nombre, même au hasard : c’est un pari.')
              noterPari(q.dataset.cle, Number(saisie))
              montrer()
            }
            champ.addEventListener('keydown', (e) => e.key === 'Enter' && valider())
            q.append(
              el('label', { htmlFor: champ.id }, texte),
              el(
                'div',
                { className: 'actions' },
                champ,
                el('button', {
                  type: 'button',
                  className: 'bouton secondaire',
                  textContent: 'Parier',
                  onclick: valider,
                }),
              ),
              avis,
            )
          }
          n.append(recap)
          montrer()
        }

        /**
         * Les paris de l'essai, repris par l'explication : ce que l'apprenant a parié, à côté de la
         * réponse. `data-cles`, `data-vrais` et `data-libelles` vont ensemble ; un retour prévu
         * (`data-si="cle=valeur"`, `data-retour`) nomme l'erreur quand le pari la contient.
         */
        function rappelParis(n) {
          const cles = (n.dataset.cles ?? '').split(',')
          const vrais = (n.dataset.vrais ?? '').split(',')
          const libelles = (n.dataset.libelles ?? '').split('|')
          const notes = cles.filter((c) => paris[c] !== undefined)
          if (notes.length === 0) {
            n.append(
              el('p', {
                className: 'discret',
                textContent: 'Tu n’as pas noté de pari ici : compare avec ce que tu pensais.',
              }),
            )
            return
          }
          n.append(
            el(
              'table',
              { className: 'paris' },
              el(
                'thead',
                {},
                el(
                  'tr',
                  {},
                  ...['', 'Ton pari', 'La réponse'].map((t) =>
                    el('th', { scope: 'col', textContent: t }),
                  ),
                ),
              ),
              el(
                'tbody',
                {},
                ...cles.map((c, i) =>
                  el(
                    'tr',
                    { dataset: { juste: String(paris[c]) === vrais[i] ? 'oui' : 'non' } },
                    el('th', { scope: 'row', textContent: libelles[i] ?? c }),
                    el('td', {
                      textContent: paris[c] === undefined ? 'pas de pari' : String(paris[c]),
                    }),
                    el('td', { textContent: vrais[i] ?? '' }),
                  ),
                ),
              ),
            ),
          )
          const [cle, valeur] = (n.dataset.si ?? '').split('=')
          // Des paris qui montent toujours du même pas (2, 3, 4, 5 ou 2, 4, 6, 8) : on a ajouté, pas doublé.
          const valeurs = cles.map((c) => Number(paris[c]))
          const pas = valeurs.slice(1).map((v, i) => v - (valeurs[i] ?? 0))
          const ajoute =
            cles.length >= 3 &&
            valeurs.every(Number.isFinite) &&
            pas.every((d) => d > 0 && d === pas[0]) &&
            valeurs.some((v, i) => String(v) !== vrais[i])
          let message = ''
          if (cle && String(paris[cle]) === valeur) message = n.dataset.retour ?? ''
          else if (ajoute && n.dataset.retourAjoute) message = n.dataset.retourAjoute
          else if (cles.every((c, i) => String(paris[c]) === vrais[i]))
            message = 'Tous tes paris étaient justes.'
          if (message) n.append(el('p', { className: 'retour', textContent: message }))
        }

        /** Un compteur de 8 bits : on ajoute 1, la valeur et son rang avancent, puis il n'y a plus de place. */
        function compteur(n) {
          let valeur = Number(n.dataset.depart ?? 250)
          const rangee = el('div', { className: 'lampes' })
          const sortie = el('p', { className: 'octet-sortie' })
          vivant(sortie)
          const plus = el('button', {
            type: 'button',
            className: 'bouton secondaire',
            textContent: 'Ajouter 1',
          })
          const maj = (deborde = false) => {
            rangee.replaceChildren(
              ...Array.from(huitChiffres(valeur), (bit) =>
                el('span', { className: 'lampe', textContent: bit, dataset: { on: bit } }),
              ),
            )
            sortie.textContent = deborde
              ? 'Plus de place : les 8 bits étaient tous à 1. Ajouter 1 fait tout repasser à 00000000. Il n’y a pas de 257e valeur.'
              : 'Valeur ' +
                valeur +
                ' : c’est la ' +
                (valeur + 1) +
                (valeur === 0 ? 're' : 'e') +
                ' valeur, parce que la première est 0.'
          }
          plus.addEventListener('click', () => {
            if (valeur === 255) {
              valeur = 0
              maj(true)
              return
            }
            valeur += 1
            maj()
          })
          n.append(
            rangee,
            el(
              'div',
              { className: 'actions' },
              plus,
              el('button', {
                type: 'button',
                className: 'bouton secondaire',
                textContent: 'Revenir à ' + (n.dataset.depart ?? 250),
                onclick: () => {
                  valeur = Number(n.dataset.depart ?? 250)
                  maj()
                },
              }),
            ),
            sortie,
          )
          maj()
        }

        /**
         * Une démonstration qui fait anticiper : les lignes du tableau sont cachées ; avant chacune,
         * l'apprenant répond à sa question (`data-question` sur la ligne), puis la ligne s'affiche avec
         * sa raison (`data-explication`). La bonne réponse est `data-reponse`, « oui » ou « non » ; les
         * boutons disent `data-oui` et `data-non` (posés sur l'outil).
         */
        function demonstration(n) {
          const lignes = Array.from(n.querySelectorAll('tbody tr'))
          const apres = Array.from(n.querySelectorAll('[data-apres]'))
          const question = el('p', { className: 'demo-question' })
          const avis = el('p', { className: 'retour' })
          vivant(avis)
          const oui = el('button', {
            type: 'button',
            className: 'bouton secondaire',
            textContent: n.dataset.oui ?? 'Oui',
          })
          const non = el('button', {
            type: 'button',
            className: 'bouton secondaire',
            textContent: n.dataset.non ?? 'Non',
          })
          const zone = el(
            'div',
            { className: 'demo-zone' },
            question,
            el('div', { className: 'actions' }, oui, non),
            avis,
          )
          let k = 0
          let justes = 0
          const finir = () => {
            tracerModele(n, { demonstration: 'finie', justes, lignes: lignes.length })
            lignes.forEach((l) => (l.hidden = false))
            apres.forEach((p) => (p.hidden = false))
            // La dernière raison reste lisible : seuls la question et ses boutons s'en vont.
            question.hidden = true
            zone.querySelector('.actions').hidden = true
          }
          const poser = () => {
            if (k >= lignes.length) return finir()
            question.textContent = lignes[k].dataset.question ?? ''
          }
          const repondre = (reponse) => {
            const ligne = lignes[k]
            const juste = reponse === ligne.dataset.reponse
            if (juste) justes += 1
            avis.dataset.juste = juste ? 'oui' : 'non'
            avis.textContent =
              (juste ? 'Juste. ' : 'Pas tout à fait. ') + (ligne.dataset.explication ?? '')
            ligne.hidden = false
            k += 1
            poser()
          }
          oui.addEventListener('click', () => repondre('oui'))
          non.addEventListener('click', () => repondre('non'))
          lignes.forEach((l) => (l.hidden = true))
          apres.forEach((p) => (p.hidden = true))
          n.querySelector('table')?.before(zone)
          poser()
        }

        /**
         * Une conversion à faire à la main, vérifiée par la fiche, avec ses coups de pouce et les retours
         * écrits pour les erreurs critiques (poids à l'envers, nombre de valeurs au lieu du maximum).
         * `data-reponse` est la réponse attendue : un nombre (`data-sens="bin-dec"`), ou ses huit bits
         * (`dec-bin`). `data-variante` (hors pratique) : après la solution, on refait sur ce nombre-là.
         */
        function convertir(n) {
          const versDecimal = n.dataset.sens === 'bin-dec'
          let valeur = versDecimal
            ? Number(n.dataset.reponse)
            : parseInt(n.dataset.reponse ?? '', 2)
          const enPratique = Boolean(n.closest('.item'))
          const champ = el('input', {
            type: 'text',
            inputMode: 'numeric',
            autocomplete: 'off',
            id: identifiant('c'),
            value: n.dataset.debut ?? '',
          })
          const retour = el('p', { className: 'retour' })
          vivant(retour)
          // Après la variante (hors pratique), les textes écrits pour le premier nombre ne valent plus :
          // on reprend ceux que l'outil calcule.
          let surLaVariante = false
          let fautes = 0
          const ecrit = (nom) => (surLaVariante ? undefined : n.dataset[nom])
          const crans = () => {
            const bits = huitChiffres(valeur)
            if (versDecimal) {
              const allumes = POIDS.filter((_, i) => bits[i] === '1')
              return [
                ecrit('aide1') ?? 'Quels bits sont à 1, et quel est le poids de chacun ?',
                ecrit('aide2') ??
                  'Les poids, de gauche à droite : 128, 64, 32, 16, 8, 4, 2, 1. Additionne ceux des bits à 1, et seulement ceux-là.',
                ecrit('aide3') ??
                  'Ici, les bits à 1 ont pour poids : ' + (allumes.join(', ') || 'aucun') + '.',
                'Solution : ' +
                  (ecrit('solution') ??
                    bits + ' vaut ' + (allumes.join(' + ') || '0') + ' = ' + valeur + '.'),
              ]
            }
            const pas = pasDeLaConversion(valeur)
            return [
              ecrit('aide1') ?? 'Quel est le plus grand poids qui tient dans ' + valeur + ' ?',
              ecrit('aide2') ??
                'Parcours les poids de 128 à 1 : si le poids tient dans ce qui reste, écris 1 et retire-le ; sinon, écris 0.',
              ecrit('aide3') ?? 'Les quatre premiers poids : ' + pas.slice(0, 4).join(' ; ') + '.',
              'Solution : ' +
                (ecrit('solution') ?? pas.join(' ; ') + '. ' + valeur + ' s’écrit ' + bits + '.'),
            ]
          }
          let pouce
          const montree = () => {
            if (enPratique) signaler(n, false, 4, { garder: true })
          }
          const refaire = () => {
            if (enPratique) return refaireLItem(n)
            // Hors pratique : on refait sur un autre nombre, sans la solution sous les yeux.
            if (n.dataset.variante === undefined) return
            surLaVariante = true
            fautes = 0
            valeur = Number(n.dataset.variante)
            const consigne = n.querySelector('label')
            if (consigne)
              consigne.textContent = versDecimal
                ? 'Refais sans regarder : quelle est la valeur de ' + huitChiffres(valeur) + ' ?'
                : 'Refais sans regarder, avec ' + valeur + ' : écris-le en binaire, sur 8 chiffres.'
            champ.value = ''
            retour.textContent = ''
            delete retour.dataset.juste
            const neuf = coupDePouce(crans(), refaire, montree)
            pouce.zone.replaceWith(neuf.zone)
            pouce = neuf
            champ.focus()
          }
          pouce = coupDePouce(crans(), refaire, montree)
          const verifier = () => {
            const saisie = champ.value.replace(/\s/g, '')
            let bon
            let message
            let erreur
            if (versDecimal) {
              if (saisie === '') return void (retour.textContent = 'Écris une réponse.')
              if (!/^\d+$/.test(saisie)) return void (retour.textContent = 'Écris un nombre.')
              const lu = Number(saisie)
              const bits = huitChiffres(valeur)
              bon = lu === valeur
              const aLEnvers = parseInt(envers(bits), 2)
              const prevu = surLaVariante ? null : retourPrevu(n, String(lu))
              if (bon) message = '✓ Juste : ' + (ecrit('succes') ?? bits + ' vaut ' + valeur + '.')
              else if (prevu) {
                message = prevu
                erreur = erreurPrevue(n, String(lu))
              } else if (lu === aLEnvers && aLEnvers !== valeur) {
                message =
                  ecrit('retourE4') ??
                  'Tu as lu les poids de droite à gauche. Le plus lourd, 128, est à gauche : refais la somme dans ce sens.'
                erreur = 'E4'
              } else if (lu === Array.from(bits).filter((b) => b === '1').length) {
                message =
                  'Tu as compté les bits à 1, pas leurs poids. Additionne les poids des bits à 1.'
                erreur = 'E5'
              } else
                message = 'Pas encore. Additionne les poids des bits à 1, et seulement ceux-là.'
            } else {
              const lu = lireOctet(saisie)
              if (lu.message !== undefined) {
                retour.textContent = lu.message
                delete retour.dataset.juste
                return
              }
              bon = lu.valeur === valeur
              const prevu = surLaVariante ? null : retourPrevu(n, saisie)
              if (bon)
                message = '✓ Juste : ' + (ecrit('succes') ?? valeur + ' s’écrit ' + saisie + '.')
              else if (prevu) {
                message = prevu
                erreur = erreurPrevue(n, saisie)
              } else if (saisie === envers(huitChiffres(valeur))) {
                message =
                  ecrit('retourE4') ??
                  'Tes bits sont dans le bon ordre de calcul, mais écrits à l’envers : le poids le plus lourd, 128, est le chiffre de gauche.'
                erreur = 'E4'
              } else
                message =
                  'Ta suite vaut ' +
                  lu.valeur +
                  ', pas ' +
                  valeur +
                  '. Reprends les poids de gauche à droite.'
            }
            retour.textContent = message
            retour.dataset.juste = bon ? 'oui' : 'non'
            if (!bon) {
              fautes += 1
              pouce.tentative()
              if (enPratique)
                retour.textContent += signalerErreur(n, erreur, itemDe(n))?.texte ?? ''
            }
            noterVerification(n, bon, pouce.aide(), fautes)
            const explication = crans()
              .at(-1)
              .replace(/^Solution : /, '')
            if (bon && (surLaVariante || apresUneSolution(n))) expliquer(n, explication)
            else if (bon && pouce.aide() >= 3) expliquer(n, explication, APRES_L_ETAPE)
          }
          champ.addEventListener('keydown', (e) => e.key === 'Enter' && verifier())
          const etiquette = etiquetter(n, champ)
          n.append(
            etiquette,
            el(
              'div',
              { className: 'actions' },
              champ,
              el('button', {
                type: 'button',
                className: 'bouton secondaire',
                textContent: 'Vérifier',
                onclick: verifier,
              }),
            ),
            retour,
            pouce.zone,
          )
        }

        /**
         * Une question à réponse courte (un nombre ; une lettre pour `data-widget="lettre"` ; des octets
         * pour `data-widget="octets"`, comme les trois d'une couleur), avec ses coups de pouce
         * (`data-aide1` à `data-aide3`, puis `data-solution`) et ses retours prévus ; `data-sinon` répond à
         * toute autre réponse fausse.
         */
        function reponseCourte(n, sorte) {
          const lettre = sorte === 'lettre'
          const octets = sorte === 'octets'
          const forme = (texte) => (lettre ? texte.toUpperCase() : texte)
          // Le cas d'origine, puis, hors pratique, sa variante (`data-variante-enonce`,
          // `data-variante-reponse`, `data-variante-solution`, `data-variante-aide1`…, et ses retours
          // `data-variante-si-e1`, `data-variante-sinon`, `data-variante-succes`) : après une solution,
          // on refait sur l'autre cas, jamais sur celui dont on vient de lire la solution.
          const cas = [
            {
              reponse: forme(n.dataset.reponse),
              aides: [n.dataset.aide1, n.dataset.aide2, n.dataset.aide3],
              solution: n.dataset.solution ?? forme(n.dataset.reponse) + '.',
              ecrits: true,
            },
            ...(n.dataset.varianteReponse === undefined
              ? []
              : [
                  {
                    enonce: n.dataset.varianteEnonce,
                    reponse: forme(n.dataset.varianteReponse),
                    aides: [
                      n.dataset.varianteAide1,
                      n.dataset.varianteAide2,
                      n.dataset.varianteAide3,
                    ],
                    solution: n.dataset.varianteSolution ?? forme(n.dataset.varianteReponse) + '.',
                    ecrits: false,
                  },
                ]),
          ]
          let courant = 0
          let attendu = cas[0].reponse
          const combien = attendu.split(' ').length
          const enPratique = Boolean(n.closest('.item'))
          const champ = el('input', {
            type: 'text',
            inputMode: lettre || octets ? 'text' : 'numeric',
            autocomplete: 'off',
            id: identifiant('n'),
          })
          if (lettre) champ.maxLength = 1
          const retour = el('p', { className: 'retour' })
          vivant(retour)
          const cransDe = (c) =>
            c.aides.filter((t) => t !== undefined).concat('Solution : ' + c.solution)
          let crans = cransDe(cas[0])
          let refait = false
          let fautes = 0
          let etiquette
          let original = []
          const montree = () => {
            if (enPratique) signaler(n, false, 4, { garder: true })
          }
          const refaire = () => {
            if (enPratique) return refaireLItem(n)
            // Hors pratique : on refait sans la solution sous les yeux, sur l'autre cas s'il y en a un.
            refait = true
            fautes = 0
            champ.value = ''
            retour.textContent = ''
            delete retour.dataset.juste
            if (cas.length > 1) {
              courant = (courant + 1) % cas.length
              attendu = cas[courant].reponse
              crans = cransDe(cas[courant])
              if (courant === 0)
                etiquette.replaceChildren(...original.map((x) => x.cloneNode(true)))
              else
                etiquette.textContent =
                  'Refais sans regarder, sur un autre cas : ' + cas[courant].enonce
              const neuf = coupDePouce(crans, refaire, montree)
              pouce.zone.replaceWith(neuf.zone)
              pouce = neuf
            } else pouce.zone.hidden = true
            champ.focus()
          }
          let pouce = coupDePouce(crans, refaire, montree)
          // Des octets se comparent écrits à la suite, un espace entre deux : « 00000000 10100000 ».
          const lireOctets = (saisie) => {
            const chiffres = saisie.replace(/\s+/g, '')
            if (!/^[01]+$/.test(chiffres)) return { message: 'Utilise seulement des 0 et des 1.' }
            if (chiffres.length !== combien * 8)
              return {
                message:
                  'Écris ' +
                  combien +
                  ' octets de 8 chiffres, même les 0 de gauche, séparés par un espace.',
              }
            return { normale: chiffres.match(/[01]{8}/g).join(' ') }
          }
          const verifier = () => {
            const saisie = champ.value.trim()
            if (saisie === '')
              return void (retour.textContent = lettre
                ? 'Écris une lettre.'
                : octets
                  ? 'Écris une réponse.'
                  : 'Écris un nombre.')
            let normale
            if (octets) {
              const lu = lireOctets(saisie)
              if (lu.message !== undefined) return void (retour.textContent = lu.message)
              normale = lu.normale
            } else {
              const forme = lettre ? /^[A-Za-z]$/ : /^\d+$/
              if (!forme.test(saisie))
                return void (retour.textContent = lettre
                  ? 'Écris une seule lettre.'
                  : 'Écris un nombre.')
              normale = lettre ? saisie.toUpperCase() : String(Number(saisie))
            }
            const bon = lettre || octets ? normale === attendu : Number(saisie) === Number(attendu)
            // Chaque cas a ses retours écrits : ceux de la variante portent `data-variante-`.
            const ecrits = cas[courant].ecrits
            retour.dataset.juste = bon ? 'oui' : 'non'
            retour.textContent = bon
              ? '✓ ' +
                ((ecrits ? n.dataset.succes : n.dataset.varianteSucces) ??
                  'Juste : ' + cas[courant].solution)
              : (retourPrevu(n, normale, !ecrits) ??
                (ecrits ? n.dataset.sinon : n.dataset.varianteSinon) ??
                'Pas encore. Relis ta méthode, ou demande un coup de pouce.')
            if (!bon) {
              fautes += 1
              pouce.tentative()
              if (enPratique)
                retour.textContent +=
                  signalerErreur(n, erreurPrevue(n, normale, !ecrits), itemDe(n))?.texte ?? ''
            }
            noterVerification(n, bon, pouce.aide(), fautes)
            if (bon && (refait || apresUneSolution(n))) expliquer(n, cas[courant].solution)
            else if (bon && pouce.aide() >= 3) expliquer(n, cas[courant].solution, APRES_L_ETAPE)
          }
          champ.addEventListener('keydown', (e) => e.key === 'Enter' && verifier())
          etiquette = etiquetter(n, champ)
          original = Array.from(etiquette.childNodes, (x) => x.cloneNode(true))
          n.append(
            etiquette,
            el(
              'div',
              { className: 'actions' },
              champ,
              el('button', {
                type: 'button',
                className: 'bouton secondaire',
                textContent: 'Vérifier',
                onclick: verifier,
              }),
            ),
            retour,
            pouce.zone,
          )
        }

        /**
         * Une question à choix : les options sont les `li[data-option]` du template, la bonne est
         * `data-reponse`. Chaque option essayée est une tentative : une option fausse se grise, montre son
         * retour (`data-retour`, qui nomme l'élément du modèle en cause quand l'option est une erreur
         * critique, `data-erreur`, sans désigner la bonne option) et monte d'un cran l'échelle d'aide :
         * la question qui oriente (`data-aide1`), puis l'indice (`data-aide2`), puis l'étape détaillée
         * (`data-aide3`). Une réussite qui vient ensuite compte avec le cran atteint ; après l'étape
         * détaillée, elle se fait expliquer. Quand il ne reste qu'une option, la choisir ne serait plus
         * une vraie tentative : l'apprenant explique pourquoi c'est elle, et chaque explication écrite
         * ouvre le cran suivant, jusqu'à la solution (aide 4), après quoi il refait sur la variante (règle
         * F03). Avec `data-justifier` (la consigne), une bonne réponse se justifie, puis se compare à la
         * solution.
         */
        function choix(n) {
          const options = Array.from(n.querySelectorAll('li[data-option]'))
          const enonce = el('p', { id: identifiant('q') })
          for (const noeud of Array.from(n.childNodes))
            if (noeud.nodeName !== 'UL') enonce.append(noeud)
          const retour = el('p', { className: 'retour' })
          vivant(retour)
          const crans = [
            ['Pour t’orienter : ', n.dataset.aide1],
            ['Un indice : ', n.dataset.aide2],
            ['L’étape détaillée : ', n.dataset.aide3],
          ].filter(([, texte]) => texte)
          const cran = ([libelle, texte]) =>
            el('li', {}, el('strong', { textContent: libelle }), texte)
          const oriente = el('ol', { className: 'crans' })
          oriente.hidden = true
          /** Les crans ouverts : un par vraie tentative, option fausse ou explication écrite. */
          let ouverts = 0
          const ouvrir = (k) => {
            ouverts = Math.min(k, crans.length)
            oriente.replaceChildren(...crans.slice(0, ouverts).map(cran))
            oriente.hidden = ouverts === 0
          }
          const solution = el('div', { className: 'coup-de-pouce' })
          solution.hidden = true
          const enPratique = Boolean(n.closest('.item'))
          const essayees = new Set()
          let fini = false
          const groupe = el('div', { className: 'options', role: 'group' })
          groupe.setAttribute('aria-labelledby', enonce.id)
          // Au bout des options : l'explication écrite remplace le choix qui ne prouverait rien.
          const champ = el('textarea', { id: identifiant('x'), rows: 3 })
          const avisExplication = el('p', { className: 'discret' })
          vivant(avisExplication)
          const envoyerExplication = el('button', {
            type: 'button',
            className: 'bouton secondaire',
            textContent: 'Envoyer mon explication',
          })
          const explication = el(
            'div',
            { className: 'expliquer' },
            el('label', {
              htmlFor: champ.id,
              textContent:
                'Il ne reste qu’une option : la choisir ne prouverait rien. Explique plutôt pourquoi c’est elle, en une ou deux phrases. Chaque explication ouvre le cran suivant, jusqu’à la solution.',
            }),
            champ,
            el('div', { className: 'actions' }, envoyerExplication),
            avisExplication,
          )
          explication.hidden = true
          const voirLaSolution = () => {
            champ.disabled = true
            envoyerExplication.disabled = true
            avisExplication.textContent = ''
            solution.replaceChildren(
              el('p', {
                className: 'solution',
                textContent: 'La solution : ' + (n.dataset.solution ?? ''),
              }),
              ...(enPratique
                ? [
                    el('button', {
                      type: 'button',
                      className: 'bouton',
                      textContent: 'J’ai compris, je refais sans regarder',
                      onclick: () => refaireLItem(n),
                    }),
                  ]
                : []),
            )
            solution.hidden = false
            if (enPratique) signaler(n, false, 4, { garder: true })
            else expliquer(n, n.dataset.solution ?? '')
          }
          let explications = 0
          let derniereExplication = ''
          envoyerExplication.addEventListener('click', () => {
            const mots = champ.value
              .trim()
              .split(/\s+/)
              .filter((mot) => mot !== '')
            if (mots.length < 3)
              return void (avisExplication.textContent =
                'Écris ton explication, en une phrase au moins.')
            if (mots.join(' ') === derniereExplication)
              return void (avisExplication.textContent =
                'C’est la même explication qu’avant : réécris-la d’après ce cran pour ouvrir le suivant.')
            derniereExplication = mots.join(' ')
            explications += 1
            const suivant = essayees.size + explications
            if (suivant > crans.length) return voirLaSolution()
            ouvrir(suivant)
            avisExplication.textContent =
              'Compare ton explication avec ce cran, puis réécris-la : chaque nouvelle explication ouvre le cran suivant.'
            signaler(n, false, Math.min(suivant, 3))
          })
          const boutons = options.map((li) => {
            const bouton = el('button', {
              type: 'button',
              className: 'bouton secondaire option',
              textContent: li.textContent.trim(),
            })
            bouton.addEventListener('click', () => {
              if (fini || essayees.has(li.dataset.option)) return
              essayees.add(li.dataset.option)
              for (const b of boutons) b.setAttribute('aria-pressed', String(b === bouton))
              if (li.dataset.option === n.dataset.reponse) {
                fini = true
                for (const b of boutons) b.disabled = true
                retour.dataset.juste = 'oui'
                retour.textContent = '✓ ' + (n.dataset.succes ?? 'Juste.')
                // Après une option fausse, son retour et son cran ont aidé : la réussite compte avec le cran.
                const aide = Math.min(essayees.size - 1, 3)
                signaler(n, true, aide)
                if (n.dataset.justifier !== undefined && n.dataset.solution)
                  expliquer(n, n.dataset.solution, n.dataset.justifier)
                else if (apresUneSolution(n) && n.dataset.solution) expliquer(n, n.dataset.solution)
                else if (aide >= 3 && n.dataset.solution)
                  expliquer(n, n.dataset.solution, APRES_L_ETAPE)
                return
              }
              bouton.disabled = true
              retour.dataset.juste = 'non'
              retour.textContent = 'Pas encore. ' + (li.dataset.retour ?? '')
              if (enPratique)
                retour.textContent += signalerErreur(n, li.dataset.erreur, itemDe(n))?.texte ?? ''
              const fautes = essayees.size
              ouvrir(fautes)
              if (options.length - essayees.size > 1) {
                signaler(n, false, Math.min(fautes, 3))
                return
              }
              // Il ne reste qu'une option : la choisir ne prouverait rien. L'apprenant explique, et
              // chaque explication ouvre le cran suivant, jusqu'à la solution.
              fini = true
              for (const b of boutons) b.disabled = true
              signaler(n, false, Math.min(fautes, 3))
              explication.hidden = false
              if (fautes >= crans.length)
                avisExplication.textContent = 'Après ton explication, la solution.'
            })
            return bouton
          })
          groupe.append(...boutons)
          n.replaceChildren(enonce, groupe, retour, oriente, explication, solution)
        }

        /** Un même octet, trois lectures : la convention décide. */
        function lectures(n) {
          const bits = n.dataset.bits ?? '01001101'
          const valeur = parseInt(bits, 2)
          const POIDS_ALLUMES = POIDS.filter((_, i) => bits[i] === '1').join(' + ')
          const textes = {
            nombre: 'Lu comme un nombre : ' + POIDS_ALLUMES + ' = ' + valeur + '.',
            lettre:
              'Lu comme une lettre, avec la table ASCII : ' +
              valeur +
              ' est la lettre ' +
              String.fromCharCode(valeur) +
              '.',
            couleur:
              'Lu comme l’intensité du rouge d’une couleur : ' +
              valeur +
              ' sur 255, un rouge faible.',
          }
          const sortie = el('p', {
            className: 'octet-sortie',
            textContent: 'Choisis une convention de lecture.',
          })
          vivant(sortie)
          const groupe = el(
            'div',
            { className: 'actions', role: 'group' },
            ...[
              ['nombre', 'Un nombre'],
              ['lettre', 'Une lettre'],
              ['couleur', 'Une couleur'],
            ].map(([cle, libelle]) =>
              el('button', {
                type: 'button',
                className: 'bouton secondaire',
                textContent: libelle,
                onclick: (e) => {
                  sortie.textContent = textes[cle]
                  for (const b of groupe.children)
                    b.setAttribute('aria-pressed', String(b === e.currentTarget))
                },
              }),
            ),
          )
          n.append(el('p', { className: 'octet-bits', textContent: bits }), groupe, sortie)
        }

        /** Trois curseurs, rouge, vert et bleu : la couleur et ses trois octets changent ensemble. */
        function reglage(n) {
          const intensites = (n.dataset.rgb ?? '64,200,250').split(',').map(Number)
          const noms = ['Rouge', 'Vert', 'Bleu']
          const pastille = el('div', { className: 'pastille' })
          pastille.setAttribute('role', 'img')
          const ecrite = el('p', { className: 'code-octet' })
          vivant(ecrite)
          const lignes = noms.map((nom, i) => {
            const curseur = el('input', {
              type: 'range',
              min: '0',
              max: '255',
              value: String(intensites[i]),
              id: identifiant('r'),
            })
            const nombre = el('span', { className: 'reglage-valeur' })
            const octetEcrit = el('span', { className: 'code-octet' })
            curseur.addEventListener('input', () => {
              intensites[i] = Number(curseur.value)
              maj()
            })
            return {
              ligne: el(
                'div',
                { className: 'reglage-ligne' },
                el('label', { htmlFor: curseur.id, textContent: nom }),
                curseur,
                nombre,
                octetEcrit,
              ),
              nombre,
              octetEcrit,
            }
          })
          const maj = () => {
            const texte = 'rgb(' + intensites.join(', ') + ')'
            pastille.style.background = texte
            pastille.setAttribute('aria-label', 'La couleur ' + texte)
            lignes.forEach(({ nombre, octetEcrit }, i) => {
              nombre.textContent = String(intensites[i])
              octetEcrit.textContent = huitChiffres(intensites[i])
            })
            ecrite.textContent = texte + ' : ' + intensites.map(huitChiffres).join(' ')
          }
          n.append(pastille, ...lignes.map((l) => l.ligne), ecrite)
          maj()
        }

        /**
         * Le schéma du bloc, boîte par boîte : chacune s'allume quand on l'a lue, avec le lien qui y mène.
         * Tout allumé, il dit `data-fin`.
         */
        function schema(n) {
          const morceaux = Array.from(n.querySelectorAll('[data-boite], .lien'))
          const boites = morceaux.filter((m) => m.hasAttribute('data-boite'))
          let allumees = 0
          let trace = false
          const suivante = el('button', {
            type: 'button',
            className: 'bouton',
            textContent: 'Allumer la première boîte',
          })
          const toutes = el('button', {
            type: 'button',
            className: 'bouton secondaire',
            textContent: 'Tout allumer',
          })
          const avis = el('p', { className: 'discret' })
          vivant(avis)
          const maj = () => {
            const derniere = boites[allumees - 1]
            const rang = derniere ? morceaux.indexOf(derniere) : -1
            morceaux.forEach((m, i) => (m.dataset.allume = i <= rang ? 'oui' : 'non'))
            suivante.textContent =
              allumees === 0 ? 'Allumer la première boîte' : 'Allumer la boîte suivante'
            suivante.disabled = allumees >= boites.length
            toutes.disabled = allumees >= boites.length
            if (allumees >= boites.length && !trace) {
              trace = true
              tracerModele(n, { schema: 'allume' })
            }
            avis.textContent =
              allumees >= boites.length
                ? (n.dataset.fin ?? 'Tout est allumé.')
                : derniere
                  ? derniere.querySelector('h4')?.textContent.trim() + ' : allumée.'
                  : ''
          }
          suivante.addEventListener('click', () => {
            allumees += 1
            maj()
            boites[allumees - 1]?.scrollIntoView({
              block: 'nearest',
              behavior: mouvementReduit() ? 'auto' : 'smooth',
            })
          })
          toutes.addEventListener('click', () => {
            allumees = boites.length
            maj()
          })
          n.append(el('div', { className: 'actions' }, suivante, toutes), avis)
          maj()
        }

        /** Une réponse écrite, comparée sans la casse, les accents, les articles ni la ponctuation. */
        const normaliser = (texte) =>
          texte
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .replace(/[’'`]/g, ' ')
            .replace(/[.,;:!?()«»"-]/g, ' ')
            .split(/\s+/)
            .filter(
              (mot) =>
                mot !== '' &&
                !['le', 'la', 'les', 'l', 'un', 'une', 'des', 'du', 'de', 'd'].includes(mot),
            )
            .join(' ')

        /** Les mots qui nient un lien, une fois la réponse normalisée (« n’est » devient « n est »). */
        const NEGATIONS = [
          'ne',
          'n',
          'pas',
          'jamais',
          'aucun',
          'aucune',
          'rien',
          'sans',
          'ni',
          'non',
        ]

        /**
         * Le schéma à refaire de mémoire : chaque case `[data-case]` devient un champ à remplir sans
         * liste (`data-accepte` : les réponses acceptées, séparées par `|`), chaque lien `[data-lien]`
         * un champ où écrire, avec ses mots, ce qui relie deux cases : il est juste s'il dit chaque
         * idée de `data-mots` (des groupes séparés par `;`, chacun une liste de mots ou de débuts de
         * mots séparés par `|`, dont un au moins doit commencer un mot de la réponse), sans négation.
         * Ce contrôle par les mots n'est pas sûr : la réussite le dit, et montre les liens du schéma à
         * côté de ceux de l'apprenant, pour qu'il compare (règle Q02).
         * L'aide va élément par élément (règle F03) : chaque nouvelle réponse fausse à un élément ouvre
         * son cran suivant, la question qui oriente (`data-aide1`), l'indice (`data-aide2`), l'étape
         * détaillée (`data-aide3`), puis sa réponse. Un champ vide, ou la même réponse fausse qu'avant,
         * n'est pas une tentative : rien ne s'ouvre. Une réponse montrée se cache avant d'être réécrite
         * de mémoire. La réussite dit d'où elle vient : de mémoire sans aide, avec de l'aide, ou après
         * des réponses vues (règle P03) ; après l'étape détaillée ou une réponse vue, l'apprenant
         * explique le schéma et compare avec `data-explication`. Chaque vérification laisse sa trace
         * (`schema-memoire`), avec le cran le plus haut atteint.
         * Le schéma ouvre son étape, et ce qui le suit attend sa fin (`apres-le-schema`, règle P02). Il
         * se fait en une fois : aller sur une autre étape entre la première saisie et la fin
         * l'interrompt, puisqu'elle a pu le souffler ; un rechargement de la page aussi, après une
         * vérification, puisque l'aide déjà vue ne se compterait plus (avant, rien n'a été montré : il
         * repart de zéro). Fini, passé (« Passer le schéma pour aujourd'hui ») ou interrompu, il attend
         * le jour suivant : la trace garde le jour, l'étape et où il en est (`etat` : en cours, fini,
         * passe, interrompu, avec `raison` : etape ou rechargement).
         */
        function schemaMemoire(n) {
          const avis = el('div', { className: 'retour' })
          vivant(avis)
          let verifications = 0
          const section = n.closest('section')
          const jour = aujourdhui()
          const precedent = traces['schema-memoire']
          let etat = 'a faire'
          let mesure = { verifications: 0, justes: 0, total: 0, aide: 0, vus: 0 }
          const etape = etapeAffichee
          const garder = () => tracer('schema-memoire', { jour, etape, etat, ...mesure })
          // Les écrans d'après (apres-le-schema) écoutent sur la section : ils s'ouvrent quand le schéma
          // est fini, passé ou interrompu.
          const annoncer = () => {
            n.dataset.etat = etat
            section?.dispatchEvent(new CustomEvent('b01:schema'))
          }
          const element = (c, nom, champ, juste, reponse) => {
            champ.addEventListener('input', () => {
              delete c.dataset.juste
              champ.removeAttribute('aria-invalid')
            })
            return {
              c,
              nom,
              champ,
              juste,
              reponse,
              vide: () => champ.value.trim() === '',
              aides: [c.dataset.aide1, c.dataset.aide2, c.dataset.aide3],
              cran: 0,
              derniere: null,
              vu: false,
            }
          }
          const cases = Array.from(n.querySelectorAll('[data-case]')).map((c) => {
            const nom = c.textContent.trim()
            const champ = el('input', { type: 'text', autocomplete: 'off', id: identifiant('s') })
            champ.setAttribute('aria-label', nom)
            c.replaceChildren(el('span', { className: 'case-nom', textContent: nom }), champ)
            const acceptees = (c.dataset.accepte ?? c.dataset.case).split('|').map(normaliser)
            return element(
              c,
              nom,
              champ,
              () => acceptees.includes(normaliser(champ.value)),
              c.dataset.case,
            )
          })
          const liens = Array.from(n.querySelectorAll('[data-lien]')).map((c) => {
            const nom = c.textContent.trim()
            const champ = el('input', { type: 'text', autocomplete: 'off', id: identifiant('l') })
            champ.setAttribute('aria-label', nom + ', avec tes mots')
            c.replaceChildren(champ)
            const groupes = (c.dataset.mots ?? '')
              .split(';')
              .filter((g) => g.trim() !== '')
              .map((g) => g.split('|').map(normaliser))
            const juste = () => {
              const ecrit = normaliser(champ.value)
              if (ecrit === normaliser(c.dataset.lien)) return true
              const mots = ecrit.split(' ')
              // Un lien nié dit le contraire de la relation : « n’est pas lu par » n’est pas « lu par ».
              if (mots.some((mot) => NEGATIONS.includes(mot))) return false
              return (
                groupes.length > 0 &&
                groupes.every((g) => g.some((debut) => mots.some((mot) => mot.startsWith(debut))))
              )
            }
            return element(c, nom, champ, juste, c.dataset.lien)
          })
          const tout = [...cases, ...liens]
          const LIBELLES = ['Pour t’orienter : ', 'Un indice : ', 'L’étape détaillée : ']
          const NOMS = ['', 'une question qui oriente', 'un indice', 'l’étape détaillée']
          const aideDe = (t) =>
            t.cran >= 4
              ? 'la réponse est « ' + t.reponse + ' ».'
              : LIBELLES[t.cran - 1] + (t.aides[t.cran - 1] ?? '')
          const verifier = () => {
            if (tout.every((t) => t.vide())) {
              avis.replaceChildren(
                el('p', {
                  textContent:
                    'Écris d’abord ce dont tu te souviens : l’aide vient après une tentative.',
                }),
              )
              return
            }
            verifications += 1
            const lignes = []
            const montrees = []
            for (const t of tout) {
              if (t.champ.disabled) {
                lignes.push(t.nom + ' : ' + aideDe(t) + ' Cache-la, puis réécris-la de mémoire.')
                continue
              }
              if (t.vide()) {
                delete t.c.dataset.juste
                lignes.push(
                  t.nom + ' : vide. Essaie de le retrouver, l’aide vient après une tentative.',
                )
                continue
              }
              if (!/[a-z0-9]{2}/.test(normaliser(t.champ.value))) {
                delete t.c.dataset.juste
                lignes.push(
                  t.nom + ' : écris au moins un mot. Une lettre seule n’est pas une tentative.',
                )
                continue
              }
              const ok = t.juste()
              t.c.dataset.juste = ok ? 'oui' : 'non'
              if (ok) {
                t.champ.removeAttribute('aria-invalid')
                continue
              }
              t.champ.setAttribute('aria-invalid', 'true')
              const ecrit = normaliser(t.champ.value)
              // Une nouvelle réponse fausse est une tentative : elle ouvre le cran suivant de cet élément.
              if (ecrit === t.derniere) {
                lignes.push(
                  t.nom +
                    ' : la même réponse qu’avant. Change-la pour avoir l’aide suivante. ' +
                    aideDe(t),
                )
                continue
              }
              t.derniere = ecrit
              t.cran = Math.min(t.cran + 1, 4)
              // Au bout de l'échelle, la réponse montrée se cache avant d'être réécrite, à chaque fois.
              if (t.cran === 4) {
                t.vu = true
                montrees.push(t)
              }
              lignes.push(t.nom + ' : ' + aideDe(t))
            }
            const reste = tout.filter((t) => t.champ.disabled || t.vide() || !t.juste())
            const aide = Math.max(0, ...tout.map((t) => t.cran))
            const vus = tout.filter((t) => t.vu).length
            mesure = {
              verifications,
              justes: tout.length - reste.length,
              total: tout.length,
              aide,
              vus,
            }
            if (reste.length === 0) etat = 'fini'
            else if (etat === 'a faire') etat = 'en cours'
            garder()
            annoncer()
            avis.dataset.juste = reste.length === 0 ? 'oui' : 'non'
            if (reste.length === 0) {
              const comparer = (t) =>
                t.nom +
                ' : tu as écrit « ' +
                t.champ.value.trim() +
                ' » ; le schéma dit « ' +
                t.reponse +
                ' ».'
              const titre =
                aide === 0
                  ? '✓ Tes cases sont justes, de mémoire, sans aide.'
                  : vus > 0
                    ? 'Tes cases sont justes, mais pas de mémoire : tu as vu la réponse de ' +
                      (vus > 1 ? vus + ' éléments' : 'un élément') +
                      '. Refais le schéma un autre jour, sans aide.'
                    : '✓ Tes cases sont justes, avec de l’aide, jusqu’à ' +
                      NOMS[aide] +
                      '. Refais le schéma un autre jour, sans aide, pour qu’il vienne de mémoire.'
              avis.replaceChildren(
                el('p', {
                  textContent:
                    titre +
                    ' Tes liens ont les mots des bonnes relations, mais des mots ne prouvent pas tout : compare-les avec ceux du schéma.',
                }),
                el('ul', {}, ...liens.map((t) => el('li', { textContent: comparer(t) }))),
              )
              if (aide >= 3)
                expliquer(
                  n,
                  n.dataset.explication ?? '',
                  'Explique maintenant le schéma, sans le regarder, en deux ou trois phrases : du bit jusqu’au sens.',
                )
              return
            }
            const cacher = el('button', {
              type: 'button',
              className: 'bouton secondaire',
              textContent: 'C’est vu : je cache les réponses et je refais',
            })
            cacher.addEventListener('click', () => {
              avis.replaceChildren(
                el('p', {
                  textContent: 'Écris de mémoire ce que tu viens de lire, puis vérifie encore.',
                }),
              )
              const caches = tout.filter((t) => t.champ.disabled)
              for (const t of caches) {
                t.champ.disabled = false
                t.derniere = null
              }
              caches[0]?.champ.focus()
            })
            // Une réponse montrée ne se recopie pas : son champ se vide, et s'ouvre une fois la réponse cachée.
            for (const t of montrees) {
              t.champ.value = ''
              t.champ.disabled = true
            }
            avis.replaceChildren(
              el('p', {
                textContent:
                  (reste.length > 1 ? reste.length + ' éléments à revoir' : 'Un élément à revoir') +
                  ' : corrige, puis vérifie encore. Chaque nouvelle réponse fausse ajoute l’aide suivante de cet élément.',
              }),
              el('ul', {}, ...lignes.map((ligne) => el('li', { textContent: ligne }))),
              ...(tout.some((t) => t.champ.disabled)
                ? [el('div', { className: 'actions' }, cacher)]
                : []),
            )
          }
          const verification = el('button', {
            type: 'button',
            className: 'bouton',
            textContent: 'Vérifier',
            onclick: verifier,
          })
          n.append(el('div', { className: 'actions' }, verification), avis)
          mesure = { ...mesure, total: tout.length }
          /** Le schéma attend le jour suivant : ses champs se vident et se grisent, avec la raison. */
          const attendreUnAutreJour = (raison) => {
            for (const t of tout) {
              t.champ.value = ''
              t.champ.disabled = true
              delete t.c.dataset.juste
            }
            verification.disabled = true
            delete avis.dataset.juste
            avis.replaceChildren(el('p', { textContent: raison }))
          }
          const INTERROMPU = {
            etape:
              'Ton schéma d’aujourd’hui a été interrompu : une autre étape a été affichée avant sa fin, et elle a pu le souffler. Refais-le un autre jour, sans quitter l’étape. Les écrans d’après sont ouverts.',
            rechargement:
              'Ton schéma d’aujourd’hui a été interrompu : la page s’est rechargée après une vérification, et l’aide que tu avais vue ne peut plus être comptée. Refais-le un autre jour. Les écrans d’après sont ouverts.',
          }
          const PASSE =
            'Tu as passé le schéma aujourd’hui : refais-le un autre jour. Les écrans d’après sont ouverts.'
          const FAIT = (avant) =>
            (avant.aide ?? 0) === 0
              ? 'Tu as fait le schéma aujourd’hui, de mémoire, sans aide. Refais-le un autre jour, pour qu’il reste.'
              : (avant.vus ?? 0) > 0
                ? 'Tu as fait le schéma aujourd’hui, mais pas de mémoire : tu avais vu des réponses. Refais-le un autre jour, sans aide.'
                : 'Tu as fait le schéma aujourd’hui, avec de l’aide. Refais-le un autre jour, sans aide, pour qu’il vienne de mémoire.'
          // Le même jour : un schéma laissé en cours sur cette étape, c'est la page rechargée. Sans
          // vérification, rien n'a été montré, et il repart de zéro, sa trace aussi ; après, il est
          // interrompu.
          // (Une autre étape affichée entre-temps l'a déjà marqué interrompu : voir fiche:rendu.)
          const rechargee = precedent?.etat === 'en cours' && (precedent.verifications ?? 0) > 0
          if (
            precedent?.jour === jour &&
            (rechargee || ['fini', 'passe', 'interrompu'].includes(precedent.etat))
          ) {
            const { verifications = 0, justes = 0, aide = 0, vus = 0 } = precedent
            mesure = { verifications, justes, total: tout.length, aide, vus }
            etat = rechargee ? 'interrompu' : precedent.etat
            const raison = rechargee
              ? 'rechargement'
              : precedent.raison === 'rechargement'
                ? 'rechargement'
                : 'etape'
            if (rechargee) tracer('schema-memoire', { ...precedent, etat, raison })
            attendreUnAutreJour(
              etat === 'fini' ? FAIT(precedent) : etat === 'passe' ? PASSE : INTERROMPU[raison],
            )
          } else if (precedent?.jour === jour && precedent.etat === 'en cours') garder()
          // La première saisie commence le schéma : à partir d'elle, quitter l'étape l'interrompt.
          n.addEventListener('input', () => {
            if (etat !== 'a faire') return
            etat = 'en cours'
            garder()
            annoncer()
          })
          n.addEventListener('b01:schema-passer', () => {
            if (etat !== 'a faire' && etat !== 'en cours') return
            etat = 'passe'
            garder()
            attendreUnAutreJour(PASSE)
            annoncer()
          })
          annoncer()
        }

        /** Ce que dit l'écran qui attend la fin du schéma, et son bouton. */
        const ATTENTE_DU_SCHEMA =
          'Cet écran attend la fin du schéma, à l’écran « Le schéma, de mémoire » : il en redit des morceaux.'
        const PASSER_LE_SCHEMA = 'Passer le schéma pour aujourd’hui'
        /**
         * Ce qui suit le schéma de mémoire dans son étape, et en redit des morceaux (le pari repris et sa
         * correction, ce qui s'en servira, ce qui reste à explorer) : caché tant que le schéma n'est ni
         * fini, ni passé, ni interrompu (règle P02). « Écouter » ne lit que ce qui est montré. Passer le
         * schéma l'ouvre, et le schéma attend alors un autre jour.
         */
        function apresLeSchema(n) {
          const section = n.closest('section')
          const schema = section?.querySelector('[data-widget="schema-memoire"]')
          const ecran = n.closest('[data-ecran]')
          const contenu = el('div')
          contenu.append(...Array.from(n.childNodes))
          const passer = el('button', {
            type: 'button',
            className: 'bouton secondaire',
            textContent: PASSER_LE_SCHEMA,
          })
          passer.addEventListener('click', () =>
            schema?.dispatchEvent(new CustomEvent('b01:schema-passer')),
          )
          const attente = el(
            'div',
            {},
            el('p', { textContent: ATTENTE_DU_SCHEMA }),
            el('p', {
              className: 'discret',
              textContent: 'Passé, le schéma attendra un autre jour.',
            }),
            el('div', { className: 'actions' }, passer),
          )
          n.append(attente, contenu)
          const lu = () =>
            Array.from(contenu.querySelectorAll(':scope > h3, :scope > p, :scope > ul > li'))
              .map((p) => p.textContent.replace(/\s+/g, ' ').trim())
              .join(' ')
          const maj = () => {
            const ouvert = !schema || ['fini', 'passe', 'interrompu'].includes(schema.dataset.etat)
            contenu.hidden = !ouvert
            attente.hidden = ouvert
            if (ecran) ecran.dataset.lecture = ouvert ? lu() : ATTENTE_DU_SCHEMA
          }
          section?.addEventListener('b01:schema', maj)
          maj()
        }

        /**
         * Le pari du début, repris : la page rappelle le choix d'alors, l'apprenant choisit à nouveau,
         * puis la correction (`[data-apres]`) s'affiche avec ce qui lui manquait. En fin de bloc, un choix
         * faux qui porte `data-erreur` est une erreur critique : il part au gabarit (règle V01).
         */
        function reprise(n) {
          const cle = n.dataset.cle ?? 'debut'
          const options = Array.from(n.querySelectorAll('li[data-option]'))
          const apres = Array.from(n.parentElement?.querySelectorAll('[data-apres]') ?? [])
          // Le choix d'alors se rappelle dans les mots du pari du début (`data-avant`), même quand
          // l'option dit maintenant les termes du bloc.
          const texteDe = (code) => {
            const li = options.find((o) => o.dataset.option === code)
            return li?.dataset.avant ?? li?.textContent.trim()
          }
          const avant = paris[cle]
          const rappel = el('p', {
            className: 'accroche',
            textContent:
              avant === undefined
                ? 'Tu n’avais pas noté de pari au début. Choisis maintenant.'
                : 'Au début, tu avais choisi : « ' +
                  texteDe(String(avant)) +
                  ' » Choisis à nouveau, maintenant que tu sais.',
          })
          const avis = el('p', { className: 'retour' })
          vivant(avis)
          const groupe = el('div', { className: 'options', role: 'group' })
          for (const li of options) {
            const bouton = el('button', {
              type: 'button',
              className: 'bouton secondaire option',
              textContent: li.textContent.trim(),
            })
            bouton.addEventListener('click', () => {
              for (const b of groupe.children) b.setAttribute('aria-pressed', String(b === bouton))
              const bon = li.dataset.option === n.dataset.reponse
              tracer('reprise:' + cle, {
                avant: avant ?? null,
                choix: li.dataset.option,
                juste: bon,
              })
              const changement =
                avant !== undefined && String(avant) !== n.dataset.reponse
                  ? ' Tu as corrigé ton pari du début. Compare avec la correction ci-dessous.'
                  : ''
              avis.dataset.juste = bon ? 'oui' : 'non'
              const repere = bon ? null : signalerErreur(n, li.dataset.erreur, 'reprise:' + cle)
              avis.textContent = bon
                ? '✓ C’est ça.' + changement
                : 'Pas encore : ' +
                  (li.dataset.retour ?? '') +
                  ' Lis la correction ci-dessous.' +
                  (repere?.texte ?? '')
              apres.forEach((p) => (p.hidden = false))
            })
            groupe.append(bouton)
          }
          apres.forEach((p) => (p.hidden = true))
          n.querySelector('ul')?.replaceWith(groupe)
          n.prepend(rappel)
          n.append(avis)
        }

        /** Série d'aisance : conversions au hasard, chronométrées ; chaque essai part au pont. */
        function aisance(n) {
          const duree = Number(n.dataset.duree ?? 30)
          const serieLongueur = Number(n.dataset.serie ?? 3)
          const zone = el('div', { className: 'outil-zone' })
          n.append(zone)
          function accueil(message, avant = []) {
            zone.replaceChildren(
              ...avant,
              ...(message ? [el('p', { textContent: message })] : []),
              el('button', {
                type: 'button',
                className: 'bouton',
                textContent: 'Commencer une série de ' + serieLongueur,
                onclick: () => essai(0, 0),
              }),
            )
          }
          function essai(i, reussis) {
            const valeur = Math.floor(Math.random() * 256)
            const versDecimal = Math.random() < 0.5
            const attendu = versDecimal ? String(valeur) : huitChiffres(valeur)
            const debut = performance.now()
            const consigne = versDecimal
              ? 'Valeur de ' + huitChiffres(valeur) + ' ?'
              : 'Écris ' + valeur + ' en binaire, sur 8 chiffres'
            const compte = el('p', { className: 'chrono' })
            const champ = el('input', {
              type: 'text',
              inputMode: 'numeric',
              autocomplete: 'off',
              id: 'a-' + i,
            })
            const avis = el('p', { className: 'retour' })
            vivant(avis)
            let fini = false
            const minuteur = setInterval(() => {
              if (!n.isConnected) return clearInterval(minuteur)
              const reste = duree - (performance.now() - debut) / 1000
              compte.textContent =
                reste > 0
                  ? 'Il te reste ' + Math.ceil(reste) + ' s'
                  : 'Temps écoulé, tu peux encore valider.'
            }, 250)
            const terminer = () => {
              if (fini) return
              const saisie = champ.value.replace(/\s/g, '')
              // Ce qui n'est pas encore une réponse ne compte pas : le chrono continue.
              let juste
              if (versDecimal) {
                if (saisie === '') return void (avis.textContent = 'Écris une réponse.')
                if (!/^\d+$/.test(saisie)) return void (avis.textContent = 'Écris un nombre.')
                juste = Number(saisie) === valeur
              } else {
                const lu = lireOctet(saisie)
                if (lu.message !== undefined) return void (avis.textContent = lu.message)
                juste = lu.valeur === valeur
              }
              fini = true
              clearInterval(minuteur)
              const secondes = (performance.now() - debut) / 1000
              const reussi = juste && secondes <= duree
              window.JanusPont?.envoyer('aisance.resultat', {
                reussi,
                duree_s: Math.round(secondes * 10) / 10,
              })
              // Retour rapide sur l'erreur : la bonne réponse, et l'élément du modèle en cause (règle C07).
              const bits = huitChiffres(valeur)
              const lu = Number(saisie)
              const unsDe = Array.from(bits).filter((b) => b === '1').length
              let cause
              let erreur
              if (!versDecimal) {
                cause =
                  saisie === envers(bits)
                    ? 'Tes bits étaient à l’envers : le poids le plus lourd, 128, est le chiffre de gauche.'
                    : 'Parcours les poids de 128 à 1 : écris 1 quand le poids tient dans ce qui reste.'
                if (saisie === envers(bits)) erreur = 'E4'
              } else if (lu === parseInt(envers(bits), 2)) {
                cause =
                  'Tu as lu les poids à l’envers : le plus lourd, 128, est le chiffre de gauche.'
                erreur = 'E4'
              } else if (lu === valeur + 1 && unsDe >= 5) {
                cause =
                  'Tu es parti de 256, le nombre de valeurs. Le maximum, tous les bits à 1, est 255 : pars de 255.'
                erreur = 'E1'
              } else if (lu === unsDe) {
                cause = 'Tu as compté les bits à 1. La valeur est la somme de leurs poids.'
                erreur = 'E5'
              } else cause = 'La valeur est la somme des poids des bits à 1.'
              // Une erreur critique repérée va au bilan ; la restitution faite, l'aisance s'arrête jusqu'à son envoi.
              const repere = juste ? null : signalerErreur(n, erreur, 'aisance')
              const bilan = reussi
                ? '✓ Juste en ' + secondes.toFixed(1) + ' s.'
                : juste
                  ? 'Juste, mais en ' + secondes.toFixed(1) + ' s (limite ' + duree + ' s).'
                  : 'Faux : la réponse était ' + attendu + '. ' + cause + (repere?.texte ?? '')
              const total = reussis + (reussi ? 1 : 0)
              const rappel = [
                el('p', { textContent: 'Conversion ' + (i + 1) + ' sur ' + serieLongueur }),
                el('p', {}, el('strong', { textContent: consigne })),
                el('p', { textContent: 'Ta réponse : ' + saisie + '.' }),
                el('p', { className: 'retour', textContent: bilan }),
              ]
              if (repere?.attendre) {
                zone.replaceChildren(...rappel)
                return
              }
              if (i + 1 < serieLongueur) {
                zone.replaceChildren(
                  ...rappel,
                  el('button', {
                    type: 'button',
                    className: 'bouton',
                    textContent: 'Suivante',
                    onclick: () => essai(i + 1, total),
                  }),
                )
              } else {
                accueil(
                  'Série terminée : ' +
                    total +
                    ' sur ' +
                    serieLongueur +
                    '. Reviens un autre jour pour que ça compte vraiment.',
                  rappel,
                )
              }
            }
            champ.addEventListener('keydown', (e) => e.key === 'Enter' && terminer())
            zone.replaceChildren(
              el('p', { textContent: 'Conversion ' + (i + 1) + ' sur ' + serieLongueur }),
              el('label', { htmlFor: champ.id }, el('strong', { textContent: consigne })),
              compte,
              el(
                'div',
                { className: 'actions' },
                champ,
                el('button', {
                  type: 'button',
                  className: 'bouton',
                  textContent: 'Valider',
                  onclick: terminer,
                }),
              ),
              avis,
            )
            champ.focus()
          }
          accueil('')
        }

        const outils = {
          octet,
          perception,
          pari,
          serie,
          'rappel-paris': rappelParis,
          compteur,
          demonstration,
          convertir,
          nombre: (n) => reponseCourte(n, 'nombre'),
          lettre: (n) => reponseCourte(n, 'lettre'),
          octets: (n) => reponseCourte(n, 'octets'),
          choix,
          lectures,
          reglage,
          schema,
          'schema-memoire': schemaMemoire,
          'apres-le-schema': apresLeSchema,
          reprise,
          aisance,
        }

        /**
         * Après une solution montrée, l'item revient avec `data-solution-vue` sur sa boîte : on le refait
         * sur sa variante (`<template data-variante="PR1-1">`), puis sur l'énoncé d'origine, en alternant,
         * pour ne jamais refaire le cas dont on vient de voir la solution.
         */
        const tours = {}
        function poserLaVariante() {
          for (const enonce of document.querySelectorAll(
            '#contenu .item[data-solution-vue] .enonce',
          )) {
            const cle = enonce.querySelector('[data-cle]')?.dataset.cle
            if (!cle) continue
            const variante = document.querySelector('template[data-variante="' + cle + '"]')
            tours[cle] = (tours[cle] ?? 0) + 1
            if (variante && tours[cle] % 2 === 1)
              enonce.replaceChildren(variante.content.cloneNode(true))
          }
        }

        document.addEventListener('fiche:rendu', (evenement) => {
          reprendreTraces(evenement.detail?.traces)
          etapeAffichee = evenement.detail?.etape?.id ?? null
          // Un schéma de mémoire laissé en cours pour une autre étape est interrompu : elle a pu le
          // souffler (règle P02).
          const schema = traces['schema-memoire']
          if (
            schema?.etat === 'en cours' &&
            schema.jour === aujourdhui() &&
            schema.etape !== etapeAffichee
          )
            tracer('schema-memoire', { ...schema, etat: 'interrompu', raison: 'etape' })
          poserLaVariante()
          for (const n of document.querySelectorAll('#contenu [data-widget]')) {
            if (montes.has(n)) continue
            montes.add(n)
            outils[n.dataset.widget]?.(n)
          }
        })
      })()
    </script>

    <script id="plomberie">
      'use strict'
      const manifeste = JSON.parse(document.getElementById('bloc-manifest').textContent)
      const CLE_ETAT = 'janus.fiche.' + manifeste.bloc + '.etat'
      /*
       * Les quatre moments du cycle de la méthode (percevoir, tenter, modéliser, faire, recevoir un
       * retour, ajuster), dans l'ordre du fil, avec les types d'étape de chacun. `ensemble`, c'est
       * ajuster : en fin de bloc, après la pratique, le pari du début repris puis le schéma refait de
       * mémoire (règle C08). `perception`, `pretest` et `ensemble` se dessinent comme une explication
       * (afficherLibre).
       */
      const MOMENTS = [
        { nom: 'Découvrir', types: ['carte', 'perception'] },
        { nom: 'Comprendre', types: ['pretest', 'explication'] },
        { nom: 'S’entraîner', types: ['pratique', 'atelier', 'aisance', 'ensemble'] },
        { nom: 'Prouver', types: ['restitution', 'consolidation', 'bilan'] },
      ]
      const momentDe = (etape) => MOMENTS.find((moment) => moment.types.includes(etape.type))
      /** Les types d'étape que le gabarit sait dessiner : chacun a son moment. */
      const ETAPES_FICHE = MOMENTS.flatMap((moment) => moment.types)
      /** Les étapes à lire, dessinées depuis leur `<template data-etape>`. */
      const ETAPES_LIBRES = ['perception', 'pretest', 'explication', 'ensemble', 'aisance']
      const LIBELLES_STATUT = {
        non_commence: 'Non commencé',
        en_cours: 'En cours',
        vu: 'Vu',
        acquis_provisoirement: 'Acquis provisoirement',
        acquis: 'Acquis',
        maitrise: 'Maîtrisé',
        a_reprendre: 'À reprendre',
      }
      const etapes = manifeste.etapes.filter((etape) => ETAPES_FICHE.includes(etape.type))
      const $ = (id) => document.getElementById(id)
      $('titre').textContent = manifeste.titre
      document.title = manifeste.titre

      // --- Mode autonome : correction simulée et localStorage (sur claude.ai : Claude et localStorage) ---
      /** Un UUID v7, comme l'exige le schéma d'une correction. */
      function uuidV7() {
        const temps = Date.now().toString(16).padStart(12, '0')
        const h = Array.from(crypto.getRandomValues(new Uint8Array(12)), (o) =>
          o.toString(16).padStart(2, '0'),
        ).join('')
        const variante = (8 + (parseInt(h[3], 16) & 3)).toString(16)
        return (
          temps.slice(0, 8) +
          '-' +
          temps.slice(8) +
          '-7' +
          h.slice(0, 3) +
          '-' +
          variante +
          h.slice(4, 7) +
          '-' +
          h.slice(7, 19)
        )
      }
      const mots = (texte) => texte.toLowerCase().match(/[a-zà-ÿ]+/g) ?? []
      function corrigerLocalement(demande) {
        const question = [...manifeste.restitution, ...manifeste.consolidation].find(
          (q) => q.id === demande.question,
        )
        const reponse = demande.reponse.trim()
        const base = {
          id: uuidV7(),
          echantillon: false,
          question: demande.question,
          tour: demande.relance === '' ? 1 : 2,
          erreurs_critiques: [],
          source: 'deduit',
          ref: 'autonome',
          certitude: 'non_verifie',
          compte: true,
        }
        const message = (texte, niveau) => ({
          ...base,
          niveau,
          message: 'Correction simulée (mode autonome)\u00a0: ' + texte,
        })
        if (reponse.toLowerCase() === 'je ne sais pas')
          return message('pas encore. Indice\u00a0: relis la carte du bloc.', 'pas_encore')
        if (reponse.length < 40) return message('réponse trop courte, développe.', 'fragile')
        const attendus = mots(question ? question.attendu : '').filter((mot) => mot.length > 4)
        const presents = attendus.filter((mot) => mots(reponse).includes(mot))
        return presents.length * 2 >= attendus.length
          ? message('solide.', 'solide')
          : message('partiel, il manque des éléments.', 'partiel')
      }
      const autonome = {
        ask: (demande) =>
          new Promise((resoudre) => setTimeout(() => resoudre(corrigerLocalement(demande)), 800)),
        sauver: (etat) => {
          try {
            localStorage.setItem(CLE_ETAT, JSON.stringify(etat))
          } catch {
            /* stockage indisponible */
          }
        },
        charger: () => {
          try {
            return JSON.parse(localStorage.getItem(CLE_ETAT) ?? 'null')
          } catch {
            return null
          }
        },
      }

      // --- État de la page ---
      let mode = 'autonome'
      let serieOuverte = { restitution: true, consolidation: true }
      let etat = { etape: etapes[0].id, envoyees: {}, retourCours: false, pratique: {} }
      const pont = window.JanusPont
      if (window.parent !== window) document.documentElement.dataset.integree = ''
      /** Le dernier statut reçu de l'appli : `manque` dit, entre autres, les erreurs encore ouvertes. */
      let dernierStatut = null
      /** Remet à jour le bouton « Étape suivante » de l'étape affichée (après une réponse envoyée). */
      let majPied = () => {}
      /** Remet à jour le bilan affiché quand un statut arrive. */
      let majBilan = () => {}
      /** Remet à jour l'heure d'ouverture de la consolidation affichée quand un statut arrive. */
      let majQuand = () => {}
      /** Le dernier bilan envoyé depuis cette page : son identifiant, pour reconnaître un refus. */
      let bilanEnvoye = null

      function enregistrer() {
        pont.sauver(etat)
      }
      /**
       * Les traces de la fiche : un outil émet `fiche:trace` (`detail: { cle, valeur }`) pour garder ce
       * que l'apprenant a fait sans note (un pari, une reprise, un schéma refait). Elles vont dans l'état
       * de la page, que l'appli enregistre, et reviennent à l'outil dans `fiche:rendu` (`detail.traces`).
       */
      document.addEventListener('fiche:trace', (evenement) => {
        const { cle, valeur } = evenement.detail ?? {}
        if (typeof cle !== 'string' || cle === '' || valeur === undefined) return
        etat.traces = { ...(etat.traces ?? {}), [cle]: JSON.parse(JSON.stringify(valeur)) }
        enregistrer()
      })
      /**
       * Une erreur critique repérée, par le correcteur dans une réponse ou par un outil : elle reste
       * connue après un rechargement, et le bilan suivant la coche d'office (`aCocher`) sans que
       * l'apprenant puisse la décocher (règle V01). `cle` dit où : l'identifiant de la question, ou
       * « outil: » suivi de l'endroit que l'outil nomme.
       */
      function noterReperees(cle, ids) {
        if (ids.length === 0) return
        const deja = etat.erreurs?.[cle] ?? []
        etat.erreurs = { ...(etat.erreurs ?? {}), [cle]: [...new Set([...deja, ...ids])] }
        etat.aCocher = [...new Set([...(etat.aCocher ?? []), ...ids])]
        enregistrer()
      }
      /**
       * Un outil qui reconnaît une erreur critique dans une réponse (des bits lus à l'envers, un départ
       * de 256) émet sur son élément `fiche:erreur` (`bubbles: true`, `cancelable: true`, `detail:
       * { erreur, ou }`). Une fois la restitution faite, l'erreur attend le bilan : le gabarit annule
       * l'événement, et l'outil dit d'envoyer le bilan avant de continuer.
       */
      $('contenu').addEventListener('fiche:erreur', (evenement) => {
        const { erreur, ou } = evenement.detail ?? {}
        if (typeof ou !== 'string' || ou === '') return
        if (!manifeste.erreurs_critiques.some((e) => e.id === erreur)) return
        noterReperees('outil:' + ou, [erreur])
        if (bilanAttendu()) evenement.preventDefault()
      })
      function aller(id) {
        etat.etape = id
        pont.envoyer('etape.vue', { etape: id })
        enregistrer()
        afficher()
        remonter($('contenu'))
      }
      /**
       * Nouvel écran ou nouvelle étape : son haut revient à l'écran. Dans l'appli, la fiche ne défile
       * pas seule (l'iframe a la hauteur du contenu) : c'est l'appli qui remonte, si besoin.
       */
      function remonter(element) {
        if (mode === 'appli') pont.envoyer('page.haut', {})
        else element.scrollIntoView({ block: 'start' })
      }
      const pluriel = (nombre, singulier, plusieurs) =>
        nombre + ' ' + (nombre > 1 ? plusieurs : singulier)
      /** Le jour sur cet appareil, AAAA-MM-JJ : une solution vue ne compte plus le lendemain. */
      function aujourdhui() {
        const date = new Date()
        const deux = (nombre) => String(nombre).padStart(2, '0')
        return date.getFullYear() + '-' + deux(date.getMonth() + 1) + '-' + deux(date.getDate())
      }

      const questions = (serie) =>
        serie === 'restitution' ? manifeste.restitution : manifeste.consolidation
      const reponsesFinies = (serie) => questions(serie).filter((q) => etat.envoyees[q.id]).length
      /**
       * Ce qui retient dans une étape : les questions d'une série ouverte qui n'ont pas encore leur
       * réponse finale. On ne quitte pas une restitution ou une consolidation à moitié faite.
       */
      function resteAFaire(etape) {
        if (etape.type !== 'restitution' && etape.type !== 'consolidation') return ''
        if (!serieOuverte[etape.type]) return ''
        const total = questions(etape.type).length
        const finies = reponsesFinies(etape.type)
        if (finies === total) return ''
        return (
          'Termine les ' +
          total +
          ' questions avant de passer à la suite\u00a0: ' +
          finies +
          ' sur\u00a0' +
          total +
          ' pour l’instant.'
        )
      }
      /** Les questions d'une série ouverte qui attendent une réponse : pas encore répondues, ou à reprendre. */
      const aPoserDans = (serie) =>
        serieOuverte[serie]
          ? questions(serie).filter((q) => !etat.envoyees[q.id] || aRefaire(serie).includes(q))
          : []
      /** La série commencée (bouton « Commencer ») qui a encore des questions à poser, s'il y en a une. */
      const serieEnCours = () =>
        ['restitution', 'consolidation'].find(
          (serie) => etat.enCours?.[serie] && aPoserDans(serie).length > 0,
        )
      /**
       * Restitution et consolidation sans support : de « Commencer » à la dernière réponse, tout le reste
       * de la fiche est masqué, sauf retour au cours. Le cours, mais aussi la carte, la pratique,
       * l'atelier, l'aisance, le bilan (la liste des erreurs critiques soufflerait des réponses) et
       * l'autre série, avec ses corrections.
       */
      const coursMasque = () => serieEnCours() !== undefined && !etat.retourCours
