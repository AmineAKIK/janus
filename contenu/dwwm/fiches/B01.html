<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>L’information en bits</title>
    <link rel="icon" href="data:," />
    <style>
      /* Tokens copiés de l'appli (packages/ui/src/tokens.css) : la fiche n'y a pas accès. */
      :root {
        color-scheme: light dark;
        --couleur-fond: light-dark(#ffffff, #14171a);
        --couleur-surface: light-dark(#f7f8f9, #1a1e22);
        --couleur-surface-elevee: light-dark(#ffffff, #21262b);
        --couleur-surface-douce: light-dark(#eff1f3, #272d33);
        --couleur-ligne: light-dark(#e5e7ea, #2a3036);
        --couleur-encre: light-dark(#1b1f24, #e8eaed);
        --couleur-texte-secondaire: light-dark(#5b626b, #a3a9b0);
        --couleur-texte-discret: light-dark(#666d76, #8b929a);
        --couleur-accent: light-dark(#2c5d92, #8fb6e4);
        --couleur-accent-douce: light-dark(#e8eff8, #1f2b3a);
        --couleur-accent-sur-fond: light-dark(#ffffff, #0f1a28);
        --couleur-succes: light-dark(#276f50, #5dc196);
        --couleur-alerte: light-dark(#95620a, #e0ac4a);
        --couleur-erreur: light-dark(#ae3846, #ee8591);
        --couleur-focus: light-dark(#2b6cb0, #8bb9f5);
        --focus-anneau: 0 0 0 2px var(--couleur-fond), 0 0 0 4px var(--couleur-focus);
        --effet-ombre-carte: light-dark(#1b1f24, #000000);
        --ombre-carte:
          0 1px 2px light-dark(rgb(27 31 36 / 5%), rgb(255 255 255 / 3.5%)),
          0 10px 28px light-dark(rgb(27 31 36 / 8%), rgb(0 0 0 / 38%));
        --rayon-champ: 0.625rem;
        --rayon-carte: 0.875rem;
        --hauteur-bouton: 48px;
        font-family: 'Inter', system-ui, sans-serif;
      }
      /* Le thème choisi dans l'appli (message etat.init) l'emporte sur le réglage du téléphone. */
      :root[data-theme='clair'] {
        color-scheme: light;
      }
      :root[data-theme='sombre'] {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--couleur-surface);
        color: var(--couleur-encre);
        line-height: 1.5;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 1.5rem 1rem 3rem;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.5rem;
        line-height: 1.3;
      }
      h2 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 0.75rem;
      }
      .discret {
        color: var(--couleur-texte-secondaire);
        font-size: 0.875rem;
      }
      .mode {
        display: inline-block;
        padding: 0.125rem 0.625rem;
        border-radius: 999px;
        background: var(--couleur-surface-douce);
        font-size: 0.875rem;
      }
      /* Dans l'appli, le fil d'étapes est celui de la page : la fiche n'en montre pas un second. */
      html[data-integree] nav,
      html[data-integree] header {
        display: none;
      }
      html[data-integree] main {
        padding-top: 1rem;
      }
      html[data-integree] section > h2 {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /* Le défilement reste, la barre n'est pas dessinée : elle prend de la place et enlaidit. */
      html[data-integree] {
        scrollbar-width: none;
      }
      html[data-integree]::-webkit-scrollbar {
        display: none;
      }
      nav ol {
        margin: 1rem 0;
        padding: 0;
        list-style: none;
      }
      .stepper {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .stepper select {
        order: -1;
        flex: 1 1 100%;
        min-width: 0;
        min-height: 44px;
        padding: 0 0.75rem;
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface);
        color: inherit;
        font: inherit;
        font-size: 0.9375rem;
      }
      .stepper .bouton {
        flex: 1 1 0;
        padding: 0 0.75rem;
      }
      @media (min-width: 640px) {
        .stepper select {
          order: 0;
          flex: 1 1 auto;
        }
        .stepper .bouton {
          flex: none;
        }
      }
      .avance {
        flex: 1 0 100%;
        height: 4px;
        border-radius: 999px;
        background: var(--couleur-surface-douce);
        overflow: hidden;
      }
      .avance > span {
        display: block;
        height: 100%;
        background: var(--couleur-accent);
      }
      section {
        padding: 1.25rem;
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-carte);
        background: var(--couleur-surface-elevee);
        box-shadow: var(--ombre-carte);
      }
      button,
      textarea {
        font: inherit;
      }
      .bouton {
        min-height: var(--hauteur-bouton);
        padding: 0 1rem;
        border: 1px solid var(--couleur-accent);
        border-radius: var(--rayon-champ);
        background: var(--couleur-accent);
        color: var(--couleur-accent-sur-fond);
        font-weight: 600;
        cursor: pointer;
      }
      .bouton.secondaire {
        background: transparent;
        color: var(--couleur-accent);
      }
      .bouton:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button:focus-visible,
      textarea:focus-visible,
      input:focus-visible {
        outline: none;
        box-shadow: var(--focus-anneau);
      }
      textarea {
        width: 100%;
        min-height: 7rem;
        padding: 0.75rem;
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
        color: inherit;
      }
      fieldset {
        margin: 0.75rem 0;
        padding: 0;
        border: 0;
      }
      legend {
        margin-bottom: 0.25rem;
        font-weight: 600;
        font-size: 0.875rem;
      }
      .choix label {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-height: 44px;
        margin-right: 1rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }
      .correction {
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border-left: 4px solid var(--couleur-accent);
        background: var(--couleur-surface-douce);
        border-radius: var(--rayon-champ);
      }
      .correction[data-niveau='solide'] {
        border-color: var(--couleur-succes);
      }
      .correction[data-niveau='fragile'],
      .correction[data-niveau='pas_encore'] {
        border-color: var(--couleur-erreur);
      }
      .correction[data-niveau='partiel'] {
        border-color: var(--couleur-alerte);
      }
      .erreur {
        color: var(--couleur-erreur);
        font-size: 0.875rem;
      }
      ul.plain {
        margin: 0 0 0.75rem;
        padding-left: 1.25rem;
      }
      .item {
        margin: 0.75rem 0;
        padding: 0.75rem;
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
      }
      .item[data-fait='oui'] {
        border-color: var(--couleur-succes);
      }
      /* Écrans : une idée à la fois */
      .ecran-barre {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0 0 1rem;
      }
      .ecran-titre {
        margin: 0;
        font-weight: 600;
        color: var(--couleur-accent);
      }
      .ecran-compte {
        color: var(--couleur-texte-secondaire);
        font-size: 0.875rem;
        white-space: nowrap;
      }
      .ecran-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: space-between;
        margin-top: 1.25rem;
        padding-top: 1rem;
        border-top: 1px solid var(--couleur-ligne);
      }
      .ecran-nav .bouton {
        flex: 1 1 8rem;
      }
      .ecran h3 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
      }
      .ecran p {
        max-width: 62ch;
      }
      .ecran .accroche {
        font-size: 1.1875rem;
        line-height: 1.45;
      }
      details {
        margin: 0.75rem 0;
        padding: 0.5rem 0.875rem;
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface);
      }
      summary {
        min-height: 44px;
        display: flex;
        align-items: center;
        font-weight: 600;
        cursor: pointer;
      }
      details[open] > summary {
        margin-bottom: 0.5rem;
      }
      .ecouter {
        min-height: 44px;
        padding: 0 0.75rem;
        font-size: 0.875rem;
        white-space: nowrap;
        flex: none;
      }
      /* Pratique en cartes */
      .exo-titre {
        margin: 1.25rem 0 0.25rem;
        font-size: 1.0625rem;
      }
      .item-tete {
        display: flex;
        align-items: center;
        gap: 0.625rem;
        margin-bottom: 0.5rem;
      }
      .item-num {
        display: inline-grid;
        place-items: center;
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 999px;
        background: var(--couleur-surface-douce);
        font-weight: 600;
        font-size: 0.875rem;
      }
      .item[data-fait='oui'] .item-num {
        background: var(--couleur-succes);
        color: var(--couleur-accent-sur-fond);
      }
      .item-etat {
        margin-left: auto;
        font-size: 0.875rem;
        color: var(--couleur-texte-secondaire);
      }
      .points {
        display: flex;
        flex-wrap: wrap;
        gap: 0.375rem;
        margin: 0.5rem 0 0.75rem;
      }
      .point {
        min-width: 44px;
        min-height: 44px;
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface);
        color: inherit;
        font: inherit;
        font-size: 0.9375rem;
        cursor: pointer;
      }
      .point[data-etat='fait'] {
        border-color: var(--couleur-succes);
        color: var(--couleur-succes);
      }
      .point[data-courant='oui'] {
        border-color: var(--couleur-accent);
        background: var(--couleur-accent-douce);
        font-weight: 600;
      }
      .aide {
        margin: 0.5rem 0;
        padding: 0.25rem 0.75rem;
      }
      .aide .actions {
        margin: 0 0 0.5rem;
      }
      .aide button[aria-pressed='true'] {
        background: var(--couleur-accent);
        color: var(--couleur-accent-sur-fond);
      }
      /* Outils de la fiche B01 */
      :root {
        --couleur-allume: light-dark(#f0a500, #f5b83d);
        --couleur-allume-encre: #2b1d00;
      }
      .octet-rangee {
        display: flex;
        gap: 0.25rem;
        margin: 0.75rem 0;
      }
      .octet-case {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.25rem;
      }
      .octet-poids {
        font-size: 0.875rem;
        color: var(--couleur-texte-secondaire);
      }
      .interrupteur {
        width: 100%;
        max-width: 44px;
        min-height: 44px;
        padding: 0;
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface-douce);
        color: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      /* Les bits sont des lampes : ambre allumée = 1, éteinte = 0. */
      .interrupteur[aria-pressed='true'] {
        border-color: var(--couleur-allume);
        background: var(--couleur-allume);
        color: var(--couleur-allume-encre);
        box-shadow: 0 0 0.75rem color-mix(in srgb, var(--couleur-allume) 60%, transparent);
      }
      .octet-sortie[data-juste='oui'],
      .retour[data-juste='oui'] {
        color: var(--couleur-succes);
      }
      .retour[data-juste='non'] {
        color: var(--couleur-alerte);
      }
      .octet-bits {
        font-family: ui-monospace, monospace;
        font-size: 1.5rem;
        letter-spacing: 0.15em;
      }
      .pastille {
        width: 100%;
        max-width: 16rem;
        height: 4rem;
        margin: 0.75rem 0;
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
      }
      .chrono {
        color: var(--couleur-texte-secondaire);
      }
      input[type='text'] {
        min-height: 44px;
        padding: 0 0.75rem;
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
        color: inherit;
        font: inherit;
        font-family: ui-monospace, monospace;
      }
      table {
        border-collapse: collapse;
        margin: 0.75rem 0;
        font-size: 0.875rem;
      }
      th,
      td {
        padding: 0.25rem 0.5rem;
        border: 1px solid var(--couleur-ligne);
        text-align: left;
      }
      .note {
        margin: 0.75rem 0;
        padding: 0.75rem;
        border-left: 3px solid var(--couleur-alerte);
        background: var(--couleur-surface-douce);
        border-radius: var(--rayon-champ);
      }

      /* Carte du bloc */
      .hero-bits {
        display: flex;
        gap: 0.25rem;
        margin: 0.5rem 0 0.25rem;
      }
      .lampe-case {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.25rem;
      }
      .lampe-poids {
        font-size: 0.75rem;
        color: var(--couleur-texte-discret);
      }
      .lampe {
        display: grid;
        place-items: center;
        width: 100%;
        max-width: 44px;
        aspect-ratio: 1;
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface-douce);
        font-family: ui-monospace, monospace;
        font-weight: 600;
        color: var(--couleur-texte-secondaire);
      }
      .lampe[data-on='1'] {
        border-color: var(--couleur-allume);
        background: var(--couleur-allume);
        color: var(--couleur-allume-encre);
        box-shadow: 0 0 0.75rem color-mix(in srgb, var(--couleur-allume) 60%, transparent);
      }
      .hero-legende {
        margin: 0 0 1rem;
        color: var(--couleur-texte-discret);
        font-size: 0.875rem;
      }
      .trio {
        display: grid;
        gap: 0.75rem;
        margin: 1rem 0;
      }
      @media (min-width: 640px) {
        .trio {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      .trio article {
        padding: 0.875rem;
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface);
      }
      .trio h3 {
        margin: 0.375rem 0 0.25rem;
        font-size: 1rem;
      }
      .trio p {
        margin: 0 0 0.375rem;
        font-size: 0.9375rem;
      }
      .trio .lieu {
        margin: 0;
        color: var(--couleur-accent);
        font-size: 0.8125rem;
        font-weight: 600;
      }
      .pastille-num {
        display: inline-grid;
        place-items: center;
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 999px;
        background: var(--couleur-accent-douce);
        color: var(--couleur-accent);
        font-weight: 600;
        font-size: 0.875rem;
      }
      .retenir {
        margin: 1rem 0;
        padding: 0.875rem 1rem;
        border-left: 3px solid var(--couleur-accent);
        border-radius: var(--rayon-champ);
        background: var(--couleur-accent-douce);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 id="titre"></h1>
        <p class="discret">
          <span id="mode" class="mode" role="status">Connexion à l’appli…</span>
          <span id="statut"></span>
        </p>
      </header>
      <nav aria-label="Étapes de la fiche"><ol id="etapes"></ol></nav>
      <div id="contenu"></div>
    </main>

    <template data-etape="ET1">
      <div
        class="hero-bits"
        role="img"
        aria-label="La suite de bits 01001101, qui vaut 77 : 64 plus 8 plus 4 plus 1"
      >
        <span class="lampe-case"
          ><span class="lampe-poids">128</span><span class="lampe" data-on="0">0</span></span
        ><span class="lampe-case"
          ><span class="lampe-poids">64</span><span class="lampe" data-on="1">1</span></span
        ><span class="lampe-case"
          ><span class="lampe-poids">32</span><span class="lampe" data-on="0">0</span></span
        ><span class="lampe-case"
          ><span class="lampe-poids">16</span><span class="lampe" data-on="0">0</span></span
        ><span class="lampe-case"
          ><span class="lampe-poids">8</span><span class="lampe" data-on="1">1</span></span
        ><span class="lampe-case"
          ><span class="lampe-poids">4</span><span class="lampe" data-on="1">1</span></span
        ><span class="lampe-case"
          ><span class="lampe-poids">2</span><span class="lampe" data-on="0">0</span></span
        ><span class="lampe-case"
          ><span class="lampe-poids">1</span><span class="lampe" data-on="1">1</span></span
        >
      </div>
      <p class="hero-legende">Ces huit lampes sont le nombre 77 : 64 + 8 + 4 + 1.</p>
      <p class="accroche">
        Une machine n’a que des interrupteurs, allumés ou éteints. Tout le reste (nombres, lettres,
        couleurs) est une façon de lire des suites d’interrupteurs.
      </p>
      <div class="trio">
        <article>
          <span class="pastille-num">1</span>
          <h3>Le mécanisme</h3>
          <p>
            Huit interrupteurs, chacun avec un poids. La valeur, c’est la somme des poids allumés.
          </p>
          <p class="lieu">Étapes 2 et 3</p>
        </article>
        <article>
          <span class="pastille-num">2</span>
          <h3>Le geste</h3>
          <p>Convertir à la main entre décimal et binaire, juste puis vite.</p>
          <p class="lieu">Étapes 5 et 6</p>
        </article>
        <article>
          <span class="pastille-num">3</span>
          <h3>La convention</h3>
          <p>La même suite de bits peut être un nombre, une lettre ou une couleur.</p>
          <p class="lieu">Étape 4</p>
        </article>
      </div>
      <p class="retenir">
        <strong>Si tu ne retiens qu’une chose :</strong> une suite de bits ne veut rien dire sans
        convention de lecture.
      </p>
      <p class="discret">
        Tu commences par essayer, avant toute explication : tu sais déjà lire 345 comme 3 centaines,
        4 dizaines et 5 unités, et c’est presque tout ce qu’il faut.
      </p>
    </template>

    <template data-etape="ET2">
      <div data-ecran="Les interrupteurs">
        <p class="accroche">
          Un interrupteur n’a que deux états : éteint (0) ou allumé (1). Joue avec ces quatre-là.
        </p>
        <div data-widget="octet" data-bits="4"></div>
        <p class="discret">
          Avant que je t’explique quoi que ce soit, tu vas prédire. Te tromper ici est utile : ça
          fait partie de la découverte.
        </p>
      </div>
      <div data-ecran="Tes prédictions">
        <div
          data-widget="nombre"
          data-reponse="2"
          data-succes="Un interrupteur, deux états : 0 ou 1."
        >
          Avec <strong>1</strong> interrupteur, combien de valeurs différentes peut-on écrire ?
        </div>
        <div data-widget="nombre" data-reponse="4" data-succes="00, 01, 10, 11.">
          Avec <strong>2</strong> interrupteurs, combien de valeurs différentes ?
        </div>
        <div
          data-widget="nombre"
          data-reponse="8"
          data-succes="Chaque interrupteur ajouté double le nombre de valeurs."
        >
          Avec <strong>3</strong> interrupteurs, combien de valeurs différentes ?
        </div>
        <div data-widget="nombre" data-reponse="16" data-succes="8 × 2 = 16.">
          Avec <strong>4</strong> interrupteurs, combien de valeurs différentes ?
        </div>
        <div
          data-widget="nombre"
          data-reponse="7"
          data-succes="Avec 6 interrupteurs on a 64 valeurs, avec 7 on en a 128 : de 0 à 127, ça couvre 100."
        >
          Combien d’interrupteurs faut-il, au minimum, pour pouvoir compter jusqu’à
          <strong>100</strong> ?
        </div>
      </div>
      <div data-ecran="Ce que tu as trouvé">
        <p class="accroche">
          <strong>Chaque interrupteur ajouté double le nombre de valeurs.</strong>
        </p>
        <p>
          Avec n interrupteurs, on obtient 2 × 2 × … × 2 (n fois) valeurs. Avec 8 interrupteurs, un
          octet, ça fait 256 valeurs. La suite explique comment s’en servir pour écrire des nombres.
        </p>
      </div>
    </template>

    <template data-etape="ET3">
      <div data-ecran="Les poids">
        <p class="accroche">
          Dans 345, chaque position a un poids : 100, 10, 1. En binaire, les poids doublent à chaque
          pas vers la gauche : 1, 2, 4, 8, 16, 32, 64, 128.
        </p>
        <div data-widget="octet"></div>
        <p>
          La valeur d’une suite de bits est
          <strong>la somme des poids des interrupteurs allumés</strong>. Essaie : allume 128, 8 et
          1, tu obtiens 137.
        </p>
        <p>
          <strong>Le poids le plus grand est à gauche</strong>, comme les centaines dans 345. Lire
          une suite de droite à gauche donne une autre valeur.
        </p>
      </div>
      <div data-ecran="256 valeurs, maximum 255">
        <p class="accroche">
          Tout allumé : 128 + 64 + 32 + 16 + 8 + 4 + 2 + 1 = <strong>255</strong>. Tout éteint : 0.
        </p>
        <p>
          De 0 à 255, il y a <strong>256 valeurs</strong>, parce que le 0 compte comme une valeur.
          Le nombre de valeurs (256) et le maximum (255) sont deux choses différentes.
        </p>
      </div>
      <div data-ecran="Décimal vers binaire">
        <p class="accroche">
          On retire les poids : de gauche à droite, si le poids tient dans ce qui reste, on
          l’allume.
        </p>
        <details open>
          <summary>Exemple avec 77, étape par étape</summary>
          <p class="discret">
            « Reste » : ce qu’il reste à écrire avant ce poids. « Après » : ce qu’il reste ensuite.
          </p>
          <table>
            <thead>
              <tr>
                <th scope="col">Poids</th>
                <th scope="col">Reste</th>
                <th scope="col">Tient ?</th>
                <th scope="col">Bit</th>
                <th scope="col">Après</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>128</td>
                <td>77</td>
                <td>non</td>
                <td>0</td>
                <td>77</td>
              </tr>
              <tr>
                <td>64</td>
                <td>77</td>
                <td>oui</td>
                <td>1</td>
                <td>13</td>
              </tr>
              <tr>
                <td>32</td>
                <td>13</td>
                <td>non</td>
                <td>0</td>
                <td>13</td>
              </tr>
              <tr>
                <td>16</td>
                <td>13</td>
                <td>non</td>
                <td>0</td>
                <td>13</td>
              </tr>
              <tr>
                <td>8</td>
                <td>13</td>
                <td>oui</td>
                <td>1</td>
                <td>5</td>
              </tr>
              <tr>
                <td>4</td>
                <td>5</td>
                <td>oui</td>
                <td>1</td>
                <td>1</td>
              </tr>
              <tr>
                <td>2</td>
                <td>1</td>
                <td>non</td>
                <td>0</td>
                <td>1</td>
              </tr>
              <tr>
                <td>1</td>
                <td>1</td>
                <td>oui</td>
                <td>1</td>
                <td>0</td>
              </tr>
            </tbody>
          </table>
        </details>
        <p>77 s’écrit donc <strong>01001101</strong>. Vérification : 64 + 8 + 4 + 1 = 77.</p>
      </div>
      <div data-ecran="Binaire vers décimal">
        <p class="accroche">On additionne les poids des bits allumés.</p>
        <p>Exemple avec 10110010 : 128 + 32 + 16 + 2 = <strong>178</strong>.</p>
      </div>
      <div data-ecran="À toi de compléter">
        <p class="accroche">
          Même méthode avec 150. Règle les interrupteurs jusqu’à ce que la machine dise « C’est
          exactement 150 ».
        </p>
        <div data-widget="octet" data-cible="150"></div>
        <details>
          <summary>Un coup de pouce</summary>
          <p>150 − 128 = 22, puis 22 − 16 = 6, puis 6 − 4 = 2, puis 2 − 2 = 0.</p>
        </details>
        <details>
          <summary>Ce que Studi écrit et qui est incomplet</summary>
          <p>
            Le cours donne le principe (« chaque position est une puissance de 2 ») mais ne montre
            jamais une conversion. Ici, tu la fais.
          </p>
        </details>
      </div>
    </template>

    <template data-etape="ET4">
      <div data-ecran="Rien sans convention">
        <p class="accroche">
          La suite 01000001 peut être un nombre, une lettre ou une quantité de rouge. Essaie les
          trois lectures.
        </p>
        <div data-widget="lectures"></div>
        <p>
          Pour les lettres, la convention s’appelle la <strong>table ASCII</strong> : elle associe
          un nombre à chaque caractère (A vaut 65). Sans connaître la convention, impossible de
          savoir ce que veulent dire les bits. C’est le point le plus important du bloc.
        </p>
      </div>
      <div data-ecran="Le binaire n’est pas un langage">
        <p class="accroche">
          <strong>Le binaire n’est pas un langage de programmation.</strong>
        </p>
        <p>
          C’est une façon d’écrire les nombres avec deux chiffres. PHP ou JavaScript sont des
          langages qu’on écrit avec des lettres, et qu’il faut ensuite traduire.
        </p>
        <details>
          <summary>Ce que Studi écrit et qui est trompeur</summary>
          <p>
            Le cours dit que « chaque combinaison de ces interrupteurs donne une instruction
            différente ». Faux en général : la plupart des suites de bits sont des données (nombres,
            lettres, couleurs). Certaines suites sont des instructions pour le processeur, on y
            revient en P1.4.
          </p>
        </details>
      </div>
      <div data-ecran="Lire une couleur">
        <p class="accroche">
          Une couleur d’écran, ce sont trois octets : rouge, vert, bleu, chacun de 0 à 255.
        </p>
        <p>
          Les développeurs les écrivent en hexadécimal, avec
          <strong>deux chiffres par octet</strong>. Un chiffre hexadécimal représente
          <strong>4 bits</strong> : de 0 à 9 puis A (10), B, C, D, E, F (15). F vaut donc 1111 et 8
          vaut 1000. Pas besoin d’en savoir plus ici.
        </p>
        <div data-widget="couleur" data-code="FF8800"></div>
        <p>
          #FF8800 est donc un rouge au maximum (255), un vert à peu près à moitié (136), pas de bleu
          (0) : de l’orange.
        </p>
      </div>

        <p class="accroche">
          Une photo est une grille de points, chaque point est une couleur, donc quelques octets.
        </p>
        <p>Rien de nouveau, juste beaucoup de points. On s’arrête là pour ce bloc.</p>
      </div>

          const etat = poids.map(() => 0)
          const sortie = el('p', { className: 'octet-sortie' })
          sortie.setAttribute('aria-live', 'polite')
          const boutons = poids.map((p, i) => {
            const b = el('button', { type: 'button', className: 'interrupteur' })
            b.addEventListener('click', () => {
              etat[i] = etat[i] ? 0 : 1
              maj()
            })
            return b
          })
          const rangee = el(
            'div',
            { className: 'octet-rangee' },
            ...poids.map((p, i) =>
              el(
                'div',
                { className: 'octet-case' },
                el('span', { className: 'octet-poids', textContent: String(p) }),
                boutons[i],
              ),
            ),
          )
          function maj() {
            const valeur = etat.reduce((s, v, i) => s + v * poids[i], 0)
            boutons.forEach((b, i) => {
              b.textContent = String(etat[i])
              b.setAttribute('aria-pressed', etat[i] ? 'true' : 'false')
              b.setAttribute(
                'aria-label',
                'Poids ' + poids[i] + ', ' + (etat[i] ? 'allumé' : 'éteint'),
              )
            })
            let texte = 'Suite de bits : ' + etat.join('') + '. Valeur : ' + valeur + '.'
            if (cible !== null) {
              if (valeur === cible) texte += ' C’est exactement ' + cible + '.'
              else if (valeur < cible)
                texte += ' Objectif ' + cible + ' : il manque ' + (cible - valeur) + '.'
              else texte += ' Objectif ' + cible + ' : tu dépasses de ' + (valeur - cible) + '.'
            }
            sortie.textContent = texte
            sortie.dataset.juste = cible !== null && valeur === cible ? 'oui' : 'non'
          }
          n.append(rangee, sortie)
          maj()
        }

        /** Une conversion à faire à la main, vérifiée par la machine. */
        function convertir(n) {
          const sens = n.dataset.sens
          const valeur = Number(n.dataset.valeur)
          const binaire = sens === 'bin-dec'
          const question = binaire
            ? 'Quelle est la valeur de ' + valeur.toString(2).padStart(8, '0') + ' ?'
            : 'Écris ' + valeur + ' en binaire (jusqu’à 8 chiffres).'
          const champ = el('input', {
            type: 'text',
            inputMode: 'numeric',
            autocomplete: 'off',
            id: 'c-' + Math.random().toString(36).slice(2),
          })
          const retour = el('p', { className: 'retour' })
          retour.setAttribute('aria-live', 'polite')
          const verifier = () => {
            const saisie = champ.value.replace(/\s/g, '')
            if (saisie === '') return void (retour.textContent = 'Écris une réponse.')
            if (binaire) {
              const bon = /^\d+$/.test(saisie) && Number(saisie) === valeur
              retour.textContent = bon
                ? '✓ Juste. Tu peux cliquer sur « J’ai réussi ».'
                : 'Pas encore. Additionne les poids des bits à 1.'
              retour.dataset.juste = bon ? 'oui' : 'non'
              return
            }
            if (!/^[01]{1,8}$/.test(saisie)) {
              retour.textContent = 'Utilise seulement des 0 et des 1 (8 au plus).'
              retour.dataset.juste = 'non'
              return
            }
            const lu = parseInt(saisie, 2)
            const bon = lu === valeur
            retour.textContent = bon
              ? '✓ Juste. Tu peux cliquer sur « J’ai réussi ».'
              : 'Ta suite vaut ' +
                lu +
                ', pas ' +
                valeur +
                '. Reprends les poids de gauche à droite.'
            retour.dataset.juste = bon ? 'oui' : 'non'
          }
          champ.addEventListener('keydown', (e) => e.key === 'Enter' && verifier())
          n.append(
            el('label', { htmlFor: champ.id }, el('strong', { textContent: question })),
            el(
              'div',
              { className: 'actions' },
              champ,
              el('button', {
                type: 'button',
                className: 'bouton secondaire',
                textContent: 'Vérifier',
                onclick: verifier,
              }),
            ),
            retour,
          )
        }

        /** Une question à réponse numérique, avec la possibilité de voir la réponse. */
        function nombre(n) {
          const attendu = Number(n.dataset.reponse)
          const champ = el('input', {
            type: 'text',
            inputMode: 'numeric',
            autocomplete: 'off',
            id: 'n-' + Math.random().toString(36).slice(2),
          })
          const retour = el('p', { className: 'retour' })
          retour.setAttribute('aria-live', 'polite')
          const verifier = () => {
            const saisie = champ.value.trim()
            if (saisie === '') return void (retour.textContent = 'Écris un nombre.')
            const bon = /^\d+$/.test(saisie) && Number(saisie) === attendu
            retour.dataset.juste = bon ? 'oui' : 'non'
            retour.textContent = bon
              ? '✓ ' + (n.dataset.succes ?? 'Juste.')
              : 'Pas encore. Essaie encore ou regarde la réponse.'
          }
          champ.addEventListener('keydown', (e) => e.key === 'Enter' && verifier())
          const actions = el(
            'div',
            { className: 'actions' },
            champ,
            el('button', {
              type: 'button',
              className: 'bouton secondaire',
              textContent: 'Vérifier',
              onclick: verifier,
            }),
          )
          if (n.dataset.reponseVisible !== 'non')
            actions.append(
              el('button', {
                type: 'button',
                className: 'bouton secondaire',
                textContent: 'Voir la réponse',
                onclick: () => {
                  retour.dataset.juste = 'non'
                  retour.textContent = 'Réponse : ' + attendu + '. ' + (n.dataset.succes ?? '')
                },
              }),
            )
          const etiquette = el('label', { htmlFor: champ.id })
          etiquette.append(...n.childNodes)
          n.append(etiquette, actions, retour)
        }

        /** Un même octet, trois lectures : la convention décide. */
        function lectures(n) {
          const bits = '01000001'
          const valeur = parseInt(bits, 2)
          const lectures = {
            nombre: 'Lu comme un nombre : ' + valeur + '.',
            texte: 'Lu comme un caractère (table ASCII) : « ' + String.fromCharCode(valeur) + ' ».',
            couleur:
              'Lu comme la quantité de rouge d’un pixel : ' +
              valeur +
              ' sur 255, soit un rouge faible (environ ' +
              Math.round((valeur / 255) * 100) +
              ' %).',
          }
          const sortie = el('p', {
            className: 'octet-sortie',
            textContent: 'Choisis une convention de lecture.',
          })
          sortie.setAttribute('aria-live', 'polite')
          const choix = el(
            'div',
            { className: 'actions' },
            ...[
              ['nombre', 'Un nombre'],
              ['texte', 'Du texte'],
              ['couleur', 'Une couleur'],
            ].map(([cle, libelle]) =>
              el('button', {
                type: 'button',
                className: 'bouton secondaire',
                textContent: libelle,
                onclick: () => {
                  sortie.textContent = lectures[cle]
                },
              }),
            ),
          )
          n.append(
            el('p', { className: 'octet-bits', textContent: bits }),
            el('p', { textContent: 'Même suite de bits, selon la convention :' }),
            choix,
            sortie,
          )
        }

        /** Une couleur écrite en hexadécimal, décodée en trois octets. */
        function couleur(n) {
          const code = n.dataset.code
          const paires = [code.slice(0, 2), code.slice(2, 4), code.slice(4, 6)]
          const noms = ['rouge', 'vert', 'bleu']
          const pastille = el('div', { className: 'pastille' })
          pastille.style.background = '#' + code
          pastille.setAttribute('role', 'img')
          pastille.setAttribute('aria-label', 'Couleur #' + code)
          const lignes = paires.map((p, i) =>
            el(
              'tr',
              {},
              el('td', { textContent: noms[i] }),
              el('td', { textContent: p }),
              el('td', {
                textContent: [...p]
                  .map((c) => parseInt(c, 16).toString(2).padStart(4, '0'))
                  .join(' '),
              }),
              el('td', { textContent: String(parseInt(p, 16)) }),
            ),
          )
          n.append(
            pastille,
            el(
              'table',
              {},
              el(
                'thead',
                {},
                el(
                  'tr',
                  {},
                  ...['Couleur', 'Deux chiffres', 'Bits (4 par chiffre)', 'Valeur'].map((t) =>
                    el('th', { scope: 'col', textContent: t }),
                  ),
                ),
              ),
              el('tbody', {}, ...lignes),
            ),
          )
        }

        /** Série d'aisance : conversions au hasard, chronométrées ; chaque essai part au pont. */
        function aisance(n) {
          const duree = Number(n.dataset.duree ?? 30)
          const serie = Number(n.dataset.serie ?? 3)
          const zone = el('div', {})
          n.append(zone)
          function accueil(message) {
            zone.replaceChildren(
              ...(message ? [el('p', { textContent: message })] : []),
              el('button', {
                type: 'button',
                className: 'bouton',
                textContent: 'Commencer une série de ' + serie,
                onclick: () => essai(0, 0),
              }),
            )
          }
          function essai(i, reussis) {
            const valeur = Math.floor(Math.random() * 256)
            const binaire = Math.random() < 0.5
            const attendu = binaire ? valeur : valeur.toString(2).padStart(8, '0')
            const debut = performance.now()
            const consigne = binaire
              ? 'Valeur de ' + valeur.toString(2).padStart(8, '0') + ' ?'
              : 'Écris ' + valeur + ' en binaire'
            const compte = el('p', { className: 'chrono' })
            const champ = el('input', {
              type: 'text',
              inputMode: 'numeric',
              autocomplete: 'off',
              id: 'a-' + i,
            })
            let fini = false
            const minuteur = setInterval(() => {
              if (!n.isConnected) return clearInterval(minuteur)
              const reste = duree - (performance.now() - debut) / 1000
              compte.textContent =
                reste > 0
                  ? 'Il te reste ' + Math.ceil(reste) + ' s'
                  : 'Temps écoulé, tu peux encore valider.'
            }, 250)
            const terminer = () => {
              if (fini) return
              fini = true
              clearInterval(minuteur)
              const secondes = (performance.now() - debut) / 1000
              const saisie = champ.value.replace(/\s/g, '')
              const juste = binaire
                ? saisie !== '' && /^\d+$/.test(saisie) && Number(saisie) === attendu
                : /^[01]{1,8}$/.test(saisie) && parseInt(saisie, 2) === valeur
              const reussi = juste && secondes <= duree
              window.JanusPont?.envoyer('aisance.resultat', {
                reussi,
                duree_s: Math.round(secondes * 10) / 10,
              })
              const bilan = reussi
                ? '✓ Juste en ' + secondes.toFixed(1) + ' s.'
                : juste
                  ? 'Juste, mais en ' + secondes.toFixed(1) + ' s (limite ' + duree + ' s).'
                  : 'Faux : la réponse était ' + attendu + '.'
              const total = reussis + (reussi ? 1 : 0)
              if (i + 1 < serie) {
                zone.replaceChildren(
                  el('p', { className: 'retour', textContent: bilan }),
                  el('button', {
                    type: 'button',
                    className: 'bouton',
                    textContent: 'Suivante',
                    onclick: () => essai(i + 1, total),
                  }),
                )
              } else {
                accueil(
                  bilan +
                    ' Série terminée : ' +
                    total +
                    ' sur ' +
                    serie +
                    '. Reviens un autre jour pour que ça compte vraiment.',
                )
              }
            }
            champ.addEventListener('keydown', (e) => e.key === 'Enter' && terminer())
            zone.replaceChildren(
              el('p', { textContent: 'Conversion ' + (i + 1) + ' sur ' + serie }),
              el('label', { htmlFor: champ.id }, el('strong', { textContent: consigne })),
              compte,
              el(
                'div',
                { className: 'actions' },
                champ,
                el('button', {
                  type: 'button',
                  className: 'bouton',
                  textContent: 'Valider',
                  onclick: terminer,
                }),
              ),
            )
            champ.focus()
          }
          accueil('')
        }

        const outils = { octet, convertir, nombre, lectures, couleur, aisance }
        document.addEventListener('fiche:rendu', () => {
          for (const n of document.querySelectorAll('#contenu [data-widget]')) {
            if (montes.has(n)) continue
            montes.add(n)
            outils[n.dataset.widget]?.(n)
          }
        })
      })()
    </script>

    <script>
      'use strict'
      const manifeste = JSON.parse(document.getElementById('bloc-manifest').textContent)
      const CLE_ETAT = 'janus.fiche.' + manifeste.bloc + '.etat'
      const ETAPES_FICHE = [
        'carte',
        'explication',
        'pratique',
        'atelier',
        'aisance',
        'restitution',
        'consolidation',
        'bilan',
      ]
      const LIBELLES_STATUT = {
        non_commence: 'Non commencé',
        en_cours: 'En cours',
        vu: 'Vu',
        acquis_provisoirement: 'Acquis provisoirement',
        acquis: 'Acquis',
        maitrise: 'Maîtrisé',
        a_reprendre: 'À reprendre',
      }
      const etapes = manifeste.etapes.filter((etape) => ETAPES_FICHE.includes(etape.type))
      const $ = (id) => document.getElementById(id)
      $('titre').textContent = manifeste.titre
      document.title = manifeste.titre

      // --- Mode autonome : correction simulée et localStorage (sur claude.ai : Claude et localStorage) ---
      /** Un UUID v7, comme l'exige le schéma d'une correction. */
      function uuidV7() {
        const temps = Date.now().toString(16).padStart(12, '0')
        const h = Array.from(crypto.getRandomValues(new Uint8Array(12)), (o) =>
          o.toString(16).padStart(2, '0'),
        ).join('')
        const variante = (8 + (parseInt(h[3], 16) & 3)).toString(16)
        return (
          temps.slice(0, 8) +
          '-' +
          temps.slice(8) +
          '-7' +
          h.slice(0, 3) +
          '-' +
          variante +
          h.slice(4, 7) +
          '-' +
          h.slice(7, 19)
        )
      }
      const mots = (texte) => texte.toLowerCase().match(/[a-zà-ÿ]+/g) ?? []
      function corrigerLocalement(demande) {
        const question = [...manifeste.restitution, ...manifeste.consolidation].find(
          (q) => q.id === demande.question,
        )
        const reponse = demande.reponse.trim()
        const base = {
          id: uuidV7(),
          echantillon: false,
          question: demande.question,
          tour: demande.relance === '' ? 1 : 2,
          erreurs_critiques: [],
          source: 'deduit',
          ref: 'autonome',
          certitude: 'non_verifie',
          compte: true,
        }
        const message = (texte, niveau) => ({
          ...base,
          niveau,
          message: 'Correction simulée (mode autonome) : ' + texte,
        })
        if (reponse.toLowerCase() === 'je ne sais pas')
          return message('pas encore. Indice : relis la carte du bloc.', 'pas_encore')
        if (reponse.length < 40) return message('réponse trop courte, développe.', 'fragile')
        const attendus = mots(question ? question.attendu : '').filter((mot) => mot.length > 4)
        const presents = attendus.filter((mot) => mots(reponse).includes(mot))
        return presents.length * 2 >= attendus.length
          ? message('solide.', 'solide')
          : message('partiel, il manque des éléments.', 'partiel')
      }
      const autonome = {
        ask: (demande) =>
          new Promise((resoudre) => setTimeout(() => resoudre(corrigerLocalement(demande)), 800)),
        sauver: (etat) => {
          try {
            localStorage.setItem(CLE_ETAT, JSON.stringify(etat))
          } catch {
            /* stockage indisponible */
          }
        },
        charger: () => {
          try {
            return JSON.parse(localStorage.getItem(CLE_ETAT) ?? 'null')
          } catch {
            return null
          }
        },
      }

      // --- État de la page ---
      let mode = 'autonome'
      let serieOuverte = { restitution: true, consolidation: true }
      let etat = { etape: etapes[0].id, envoyees: {}, retourCours: false, pratique: {} }
      const corrections = {}
      const pont = window.JanusPont
      if (window.parent !== window) document.documentElement.dataset.integree = ''

      function enregistrer() {
        pont.sauver(etat)
      }
      function aller(id) {
        etat.etape = id
        pont.envoyer('etape.vue', { etape: id })
        enregistrer()
        afficher()
      }

      const questions = (serie) =>
        serie === 'restitution' ? manifeste.restitution : manifeste.consolidation
      const restitutionTerminee = () => manifeste.restitution.every((q) => etat.envoyees[q.id])
      /** Restitution sans support : dès la première réponse, le cours est masqué jusqu'à la dernière, sauf retour au cours. */
      const coursMasque = () =>
        serieOuverte.restitution &&
        Object.keys(etat.envoyees).length > 0 &&
        !restitutionTerminee() &&
        !etat.retourCours

      function creer(balise, { dataset = {}, ...proprietes } = {}, ...enfants) {
        const element = Object.assign(document.createElement(balise), proprietes)
        Object.assign(element.dataset, dataset)
        element.append(...enfants)
        return element
      }

      function afficherEtapes() {
        const trouvee = etapes.findIndex((etape) => etape.id === etat.etape)
        const courant = trouvee < 0 ? 0 : trouvee
        const choix = creer(
          'select',
          {},
          ...etapes.map((etape, k) =>
            creer('option', {
              value: etape.id,
              textContent: k + 1 + '. ' + etape.titre,
              selected: k === courant,
            }),
          ),
        )
        choix.setAttribute('aria-label', 'Étape de la fiche')
        choix.addEventListener('change', () => aller(choix.value))
        const bouton = (texte, nom, cible) => {
          const b = creer('button', {
            type: 'button',
            className: 'bouton secondaire',
            textContent: texte,
            disabled: cible === undefined,
          })
          b.setAttribute('aria-label', nom)
          if (cible !== undefined) b.addEventListener('click', () => aller(cible.id))
          return b
        }
        const barre = creer('span', { className: 'avance' }, creer('span'))
        barre.firstChild.style.width = Math.round(((courant + 1) / etapes.length) * 100) + '%'
        $('etapes').replaceChildren(
          creer(
            'li',
            { className: 'stepper' },
            bouton('Précédent', 'Étape précédente', etapes[courant - 1]),
            choix,
            bouton('Suivant', 'Étape suivante', etapes[courant + 1]),
            barre,
          ),
        )
      }

      /**
       * La carte : l'objectif, puis le `<template data-etape="ET1">` de la page s'il existe (sinon la
       * liste des étapes). `contexte_ia` est destiné au correcteur : il n'est jamais affiché.
       */
      function afficherCarte() {
        const section = creer(
          'section',
          {},
          creer('h2', { textContent: 'Carte du bloc' }),
          creer('p', { textContent: manifeste.objectif }),
        )
        const modele = document.querySelector('template[data-etape="' + etapes[0].id + '"]')
        if (modele) {
          section.append(modele.content.cloneNode(true))
          activerLiens(section)
        } else
          section.append(
            creer(
              'ul',
              { className: 'plain' },
              ...etapes.map((etape) => creer('li', { textContent: etape.titre })),
            ),
          )
        return section
      }

      /**
       * Le contenu libre d'une étape : le `<template data-etape="ETx">` de la page, cloné tel quel.
       * Tout ce qui est dans le gabarit (pont, masquage du cours, confiance, aide, messages) est fixe ;
       * ce que dit le bloc et comment il le dit ne l'est pas.
       */
      function afficherLibre(etape) {
        const modele = document.querySelector('template[data-etape="' + etape.id + '"]')
        const section = creer('section', {}, creer('h2', { textContent: etape.titre }))
        if (!modele) {
          section.append(
            creer('p', { className: 'discret', textContent: 'Rien à lire dans cette étape.' }),
          )
          return section
        }
        const contenu = modele.content.cloneNode(true)
        const ecrans = Array.from(contenu.children).filter((n) => n.hasAttribute('data-ecran'))
        if (ecrans.length < 2) {
          section.append(contenu)
          activerLiens(section)
          return section
        }
        // Plusieurs écrans : un seul visible à la fois, les autres restent dans la page (outils déjà montés).
        const suivante = etapes[etapes.findIndex((e) => e.id === etape.id) + 1]
        const titre = creer('p', { className: 'ecran-titre' })
        const compte = creer('span', { className: 'ecran-compte' })
        const ecouter = creer('button', { type: 'button', className: 'bouton secondaire ecouter' })
        const precedent = creer('button', {
          type: 'button',
          className: 'bouton secondaire',
          textContent: 'Retour',
        })
        const avancer = creer('button', { type: 'button', className: 'bouton' })
        let courant = Math.min(etat.ecrans?.[etape.id] ?? 0, ecrans.length - 1)
        const voix = () => {
          const fr = (window.speechSynthesis?.getVoices() ?? []).filter((v) =>
            v.lang.toLowerCase().startsWith('fr'),
          )
          return (
            fr.find((v) => /charline|denise|eloise|vivienne|hortense|julie/i.test(v.name)) ?? fr[0]
          )
        }
        const texteLu = (ecran) =>
          ecran.dataset.lecture ??
          Array.from(ecran.querySelectorAll(':scope > h3, :scope > p, :scope > ul > li'))
            .map((n) => n.textContent.replace(/\s+/g, ' ').trim())
            .join(' ')
        const arreter = () => {
          window.speechSynthesis?.cancel()
          ecouter.textContent = 'Écouter'
          ecouter.dataset.actif = 'non'
        }
        ecouter.addEventListener('click', () => {
          if (!window.speechSynthesis) return void (ecouter.textContent = 'Lecture indisponible')
          if (ecouter.dataset.actif === 'oui') return arreter()
          const parole = new SpeechSynthesisUtterance(texteLu(ecrans[courant]))
          parole.lang = 'fr-FR'
          const choisie = voix()
          if (choisie) parole.voice = choisie
          parole.onend = arreter
          window.speechSynthesis.speak(parole)
          ecouter.dataset.actif = 'oui'
          ecouter.textContent = 'Arrêter'
        })
        const montrer = (k) => {
          arreter()
          courant = k
          etat.ecrans = { ...(etat.ecrans ?? {}), [etape.id]: k }
          enregistrer()
          ecrans.forEach((e, j) => {
            e.hidden = j !== k
          })
          titre.textContent = ecrans[k].dataset.ecran
          compte.textContent = k + 1 + ' / ' + ecrans.length
          precedent.disabled = k === 0
          avancer.textContent =
            k < ecrans.length - 1 ? 'Suivant' : suivante ? 'Étape suivante' : 'Terminé'
          avancer.disabled = k === ecrans.length - 1 && !suivante
        }
        precedent.addEventListener('click', () => {
          montrer(courant - 1)
          section.scrollIntoView({ block: 'start' })
        })
        avancer.addEventListener('click', () => {
          if (courant < ecrans.length - 1) {
            montrer(courant + 1)
            section.scrollIntoView({ block: 'start' })
          } else if (suivante) aller(suivante.id)
        })
        for (const e of ecrans) e.classList.add('ecran')
        section.append(
          creer('div', { className: 'ecran-barre' }, titre, ecouter, compte),
          ...ecrans,
          creer('div', { className: 'ecran-nav' }, precedent, avancer),
        )
        activerLiens(section)
        montrer(courant)
        return section
      }

      /**
       * Un lien externe : `<a data-lien="https://…">texte</a>`. Dans l'appli, c'est elle qui ouvre
       * l'adresse (message du pont) ; hors de l'appli, la page l'ouvre. L'adresse reste écrite à côté,
       * au cas où le navigateur bloquerait l'ouverture.
       */
      function activerLiens(racine) {
        for (const lien of racine.querySelectorAll('a[data-lien]')) {
          const url = lien.dataset.lien
          lien.setAttribute('href', url)
          lien.addEventListener('click', (evenement) => {
            evenement.preventDefault()
            if (mode === 'appli') pont.envoyer('lien.ouvrir', { url })
            else window.open(url, '_blank', 'noopener,noreferrer')
          })
          lien.after(creer('span', { className: 'discret', textContent: ' (' + url + ')' }))
        }
      }

      function afficherPratique() {
        const liste = manifeste.pratique.flatMap((exercice) =>
          exercice.items.map((item, rang) => ({ exercice, item, rang })),
        )
        const reussi = (entree) => Boolean(etat.pratique[entree.item.id]?.reussi)
        const premierRestant = liste.findIndex((entree) => !reussi(entree))
        const index = Math.min(
          Math.max(etat.itemCourant ?? (premierRestant < 0 ? 0 : premierRestant), 0),
          liste.length - 1,
        )
        const { exercice, item, rang } = liste[index]
        const nbReussis = liste.filter(reussi).length
        const fait = etat.pratique[item.id]
        let aide = 0
        const aller_a = (k) => {
          etat.itemCourant = Math.min(Math.max(k, 0), liste.length - 1)
          enregistrer()
          afficher()
        }
        const points = creer(
          'div',
          { className: 'points', role: 'group' },
          ...liste.map((entree, k) => {
            const p = creer('button', {
              type: 'button',
              className: 'point',
              textContent: String(k + 1),
              dataset: {
                etat: reussi(entree) ? 'fait' : 'a-faire',
                courant: k === index ? 'oui' : 'non',
              },
            })
            p.setAttribute(
              'aria-label',
              'Item ' + (k + 1) + ' sur ' + liste.length + (reussi(entree) ? ', réussi' : ''),
            )
            if (k === index) p.setAttribute('aria-current', 'step')
            p.addEventListener('click', () => aller_a(k))
            return p
          }),
        )
        const resultat = creer('p', {
          className: 'discret',
          textContent: fait
            ? 'Envoyé : ' + (fait.reussi ? 'réussi' : 'non réussi') + ', aide ' + fait.aide
            : '',
        })
        const envoyer = (ok) => {
          const essais = (fait?.essais ?? 0) + 1
          pont.envoyer('pratique.resultat', {
            exercice: exercice.id,
            item: item.id,
            reussi: ok,
            aide,
            essais,
          })
          etat.pratique[item.id] = { reussi: ok, aide, essais }
          const suivant = liste.findIndex((entree, k) => k > index && !reussi(entree))
          if (ok && suivant >= 0) etat.itemCourant = suivant
          enregistrer()
          afficher()
        }
        const aides = [1, 2, 3, 4].map((cran) => {
          const b = creer('button', {
            type: 'button',
            className: 'bouton secondaire',
            textContent: 'Aide ' + cran,
          })
          b.setAttribute('aria-pressed', 'false')
          b.addEventListener('click', () => {
            aide = aide === cran ? 0 : cran
            aides.forEach((autre, k) => autre.setAttribute('aria-pressed', String(aide === k + 1)))
          })
          return b
        })
        // L'énoncé de l'item : <template data-item="PR1-1"> dans la page.
        const enonce = document.querySelector('template[data-item="' + item.id + '"]')
        const consigne = creer('div', {})
        if (enonce) consigne.append(enonce.content.cloneNode(true))
        activerLiens(consigne)
        return creer(
          'section',
          {},
          creer('h2', { textContent: 'Pratique guidée' }),
          creer('p', {
            className: 'discret',
            textContent:
              nbReussis + ' réussi' + (nbReussis > 1 ? 's' : '') + ' sur ' + liste.length + '.',
          }),
          points,
          creer(
            'div',
            { className: 'item', dataset: { fait: fait?.reussi ? 'oui' : 'non' } },
            creer(
              'div',
              { className: 'item-tete' },
              creer('span', { className: 'item-num', textContent: String(index + 1) }),
              creer('strong', { textContent: exercice.titre }),
              creer('span', {
                className: 'item-etat',
                textContent: fait ? (fait.reussi ? 'Réussi' : 'À refaire') : '',
              }),
            ),
            consigne,
            creer(
              'details',
              { className: 'aide' },
              creer('summary', { textContent: 'J’ai eu besoin d’aide' }),
              creer('p', {
                className: 'discret',
                textContent:
                  'Niveau d’aide utilisé : 1 = une question qui t’oriente, 2 = un indice, 3 = l’étape détaillée, 4 = la solution complète.',
              }),
              creer('div', { className: 'actions' }, ...aides),
            ),
            creer(
              'div',
              { className: 'actions' },
              creer('button', {
                type: 'button',
                className: 'bouton',
                textContent: 'J’ai réussi',
                onclick: () => envoyer(true),
              }),
              creer('button', {
                type: 'button',
                className: 'bouton secondaire',
                textContent: 'Pas réussi',
                onclick: () => envoyer(false),
              }),
            ),
            resultat,
          ),
          creer(
            'div',
            { className: 'ecran-nav' },
            creer('button', {
              type: 'button',
              className: 'bouton secondaire',
              textContent: 'Item précédent',
              disabled: index === 0,
              onclick: () => aller_a(index - 1),
            }),
            creer('button', {
              type: 'button',
              className: 'bouton secondaire',
              textContent: 'Item suivant',
              disabled: index === liste.length - 1,
              onclick: () => aller_a(index + 1),
            }),
          ),
        )
      }

      function afficherAtelier() {
        const section = creer(
          'section',
          {},
          creer('h2', { textContent: 'Atelier' }),
          creer('p', {
            className: 'discret',
            textContent: 'Dis si tu as réussi l’atelier, sans aide ou avec le cran d’aide utilisé.',
          }),
        )
        const resultat = creer('p', {
          className: 'discret',
          textContent: etat.atelier
            ? 'Envoyé : ' +
              (etat.atelier.reussi ? 'réussi' : 'non réussi') +
              ', aide ' +
              etat.atelier.aide
            : '',
        })
        const envoyer = (reussi, aide) => {
          pont.envoyer('atelier.resultat', { reussi, predictions_justes: reussi ? 3 : 0, aide })
          etat.atelier = { reussi, aide }
          enregistrer()
          resultat.textContent = 'Envoyé : ' + (reussi ? 'réussi' : 'non réussi') + ', aide ' + aide
        }
        section.append(
          creer(
            'div',
            { className: 'actions' },
            creer('button', {
              type: 'button',
              className: 'bouton',
              textContent: 'Atelier réussi sans aide',
              onclick: () => envoyer(true, 0),
            }),
            creer('button', {
              type: 'button',
              className: 'bouton secondaire',
              textContent: 'Atelier pas réussi',
              onclick: () => envoyer(false, 0),
            }),
          ),
          resultat,
        )
        return section
      }

      function afficherSerie(serie, titre) {
        if (!serieOuverte[serie])
          return creer(
            'section',
            {},
            creer('h2', { textContent: titre }),
            creer('p', {
              textContent:
                serie === 'consolidation'
                  ? 'La consolidation n’est pas encore ouverte : reviens plus tard.'
                  : 'Cette série n’est pas ouverte.',
            }),
          )
        const section = creer('section', {}, creer('h2', { textContent: titre }))
        for (const question of questions(serie)) section.append(afficherQuestion(serie, question))
        return section
      }

      function afficherQuestion(serie, question) {
        const envoyee = etat.envoyees[question.id]
        const zone = creer('textarea', {
          id: 'rep-' + question.id,
          value: envoyee ? envoyee.reponse : '',
          disabled: Boolean(envoyee),
        })
        let colle = false
        zone.addEventListener('paste', () => {
          colle = true
        })
        const confiance = creer(
          'fieldset',
          { className: 'choix' },
          creer('legend', { textContent: 'Ta confiance' }),
          ...[
            ['sur', 'Sûr'],
            ['hesitant', 'Hésitant'],
            ['hasard', 'Au hasard'],
          ].map(([valeur, libelle]) =>
            creer(
              'label',
              {},
              creer('input', {
                type: 'radio',
                name: 'conf-' + question.id,
                value: valeur,
                disabled: Boolean(envoyee),
                checked: envoyee?.confiance === valeur,
              }),
              libelle,
            ),
          ),
        )
        const message = creer('p', { className: 'erreur', role: 'alert' })
        const sortie = creer('div', { 'aria-live': 'polite' })
        const bouton = creer('button', {
          type: 'button',
          className: 'bouton',
          textContent: 'Envoyer',
          disabled: Boolean(envoyee),
        })
        bouton.addEventListener('click', async () => {
          const choisie = confiance.querySelector('input:checked')
          if (zone.value.trim() === '')
            return void (message.textContent = 'Écris une réponse avant d’envoyer.')
          if (!choisie) return void (message.textContent = 'Choisis ta confiance avant d’envoyer.')
          message.textContent = ''
          bouton.disabled = true
          const precedente = corrections[question.id]
          try {
            const correction = await pont.demanderCorrection({
              serie,
              question: question.id,
              reponse: zone.value,
              confiance: choisie.value,
              relance: precedente && precedente.niveau !== 'solide' ? precedente.message : '',
              support: { colle, retour_cours: etat.retourCours },
            })
            corrections[question.id] = correction
            sortie.replaceChildren(
              creer(
                'div',
                { className: 'correction', dataset: { niveau: correction.niveau } },
                creer('strong', { textContent: 'Niveau : ' + correction.niveau }),
                creer('p', { textContent: correction.message }),
              ),
            )
            if (correction.echantillon)
              sortie.append(
                creer(
                  'p',
                  {},
                  "D'accord avec ce niveau ? ",
                  ...[
                    [true, 'Oui'],
                    [false, 'Non'],
                  ].map(([accord, libelle]) =>
                    creer('button', {
                      type: 'button',
                      className: 'bouton secondaire',
                      textContent: libelle,
                      onclick: () => {
                        pont.envoyer('correction.accord', { correction: correction.id, accord })
                        sortie.lastChild.remove()
                      },
                    }),
                  ),
                ),
              )
            if (correction.niveau === 'solide' || correction.tour >= 2) {
              etat.envoyees[question.id] = { reponse: zone.value, confiance: choisie.value }
              enregistrer()
              if (serie === 'restitution' && restitutionTerminee())
                setTimeout(() => {
                  // Redessiner rouvre le cours : seulement si on est encore à la restitution.
                  if (etapes.find((e) => e.id === etat.etape)?.type === 'restitution') afficher()
                }, 1200)
            } else {
              bouton.disabled = false
              bouton.textContent = 'Répondre à la relance'
            }
          } catch (erreur) {
            message.textContent =
              'Correction impossible : ' +
              (erreur && erreur.detail ? erreur.detail : erreur.message)
            bouton.disabled = false
          }
        })
        return creer(
          'div',
          { className: 'item' },
          creer('label', { htmlFor: zone.id }, creer('strong', { textContent: question.question })),
          zone,
          confiance,
          creer('div', { className: 'actions' }, bouton),
          message,
          sortie,
        )
      }

      function afficherBilan() {
        const ids = [...new Set(Object.values(corrections).flatMap((c) => c.erreurs_critiques))]
        const section = creer(
          'section',
          {},
          creer('h2', { textContent: 'Bilan' }),
          creer('p', {
            textContent:
              ids.length === 0 ? 'Aucune erreur critique relevée.' : 'Erreurs critiques à revoir :',
          }),
          creer(
            'ul',
            { className: 'plain' },
            ...ids.map((id) =>
              creer('li', {
                textContent: (
                  manifeste.erreurs_critiques.find((e) => e.id === id) ?? { libelle: id }
                ).libelle,
              }),
            ),
          ),
          creer('button', {
            type: 'button',
            className: 'bouton',
            textContent: 'Envoyer le bilan',
            onclick: () => pont.envoyer('bilan.erreurs', { ids }),
          }),
        )
        return section
      }

      function afficher() {
        afficherEtapes()
        const etape = etapes.find((e) => e.id === etat.etape) ?? etapes[0]
        const cours = etape.type === 'explication' || etape.type === 'pratique'
        let vue
        if (cours && coursMasque()) {
          vue = creer(
            'section',
            {},
            creer('h2', { textContent: etape.titre }),
            creer('p', {
              textContent:
                'Masqué : la restitution se fait sans le cours. Il s’ouvrira après ta dernière réponse.',
            }),
            creer('button', {
              type: 'button',
              className: 'bouton secondaire',
              textContent: 'Revenir au cours',
              onclick: () => {
                etat.retourCours = true
                enregistrer()
                afficher()
              },
            }),
            creer('p', {
              className: 'discret',
              textContent: 'Tes prochaines réponses seront alors marquées « retour au cours ».',
            }),
          )
        } else
          vue =
            {
              carte: afficherCarte,
              explication: () => afficherLibre(etape),
              pratique: afficherPratique,
              atelier: afficherAtelier,
              aisance: () => afficherLibre(etape),
              restitution: () => afficherSerie('restitution', 'Restitution'),
              consolidation: () => afficherSerie('consolidation', 'Consolidation'),
              bilan: afficherBilan,
            }[etape.type]?.() ??
            creer('p', {
              className: 'discret',
              textContent: 'Cette étape n’est pas dans cette fiche.',
            })
        $('contenu').replaceChildren(vue)
        // Point d'accroche des fiches : le HTML libre de l'étape est en place, son script peut l'animer.
        document.dispatchEvent(new CustomEvent('fiche:rendu', { detail: { etape } }))
      }

      async function demarrer() {
        if (!pont) {
          $('mode').textContent = 'Pont indisponible'
          return
        }
        pont.surStatut(({ statut }) => {
          $('statut').textContent = 'Statut : ' + (LIBELLES_STATUT[statut] ?? statut)
        })
        pont.surErreur((erreur) => {
          $('statut').textContent = 'Erreur : ' + erreur.detail
        })
        pont.surEtape((id) => {
          if (etapes.some((e) => e.id === id)) aller(id)
        })
        const depart = await pont.demarrer({
          manifeste: { bloc: manifeste.bloc, version: manifeste.version },
          autonome,
        })
        mode = depart.mode
        if (depart.init?.theme) document.documentElement.dataset.theme = depart.init.theme
        // Hors de l'appli (aperçu dans une page), le fil d'étapes de la fiche est le seul : on le rend.
        if (mode !== 'appli') delete document.documentElement.dataset.integree
        $('mode').textContent = mode === 'appli' ? 'Dans l’appli' : 'Mode autonome'
        if (depart.init) {
          serieOuverte = depart.init.serie_ouverte
          $('statut').textContent =
            'Statut : ' + (LIBELLES_STATUT[depart.init.statut] ?? depart.init.statut)
        }
        pont.surInit((init) => {
          const consolidationChangee =
            serieOuverte.consolidation !== init.serie_ouverte.consolidation
          serieOuverte = init.serie_ouverte
          // Redessiner efface les corrections affichées : seulement quand la consolidation s'ouvre.
          if (consolidationChangee) afficher()
        })
        if (depart.etat && typeof depart.etat === 'object') etat = { ...etat, ...depart.etat }
        afficher()
      }
      void demarrer()
    </script>
  </body>
</html>
