        --couleur-accent-sur-fond: light-dark(#ffffff, #0f1a28);
        --couleur-accent-douce: light-dark(#e8eff8, #1f2b3a);
        --couleur-succes: light-dark(#276f50, #5dc196);
        --couleur-alerte: light-dark(#95620a, #e0ac4a);
        --couleur-erreur: light-dark(#ae3846, #ee8591);
        --couleur-focus: light-dark(#2b6cb0, #8bb9f5);
        --effet-ombre-carte: light-dark(#1b1f24, #000000);
        --espacement-4: 0.25rem;
        --espacement-8: 0.5rem;
        --espacement-12: 0.75rem;
        --espacement-16: 1rem;
        --espacement-20: 1.25rem;
        --espacement-24: 1.5rem;
        --espacement-32: 2rem;
        --espacement-48: 3rem;
        --rayon-champ: 0.625rem;
        --rayon-carte: 0.875rem;
        --rayon-option: 0.375rem;
        --duree-transition: 160ms;
        --focus-anneau: 0 0 0 2px var(--couleur-fond), 0 0 0 4px var(--couleur-focus);
        --ombre-option: 0 2px 6px color-mix(in srgb, var(--effet-ombre-carte) 8%, transparent);
        --hauteur-champ: 48px;
        --hauteur-bouton: 48px;
        --cible-tactile-min: 44px;
        --largeur-lecture: 62ch;
        --police-texte: 'Inter', system-ui, sans-serif;
        --police-code: 'JetBrains Mono', ui-monospace, monospace;
      }
      /* Le thème choisi dans l'appli (message etat.init) l'emporte sur le réglage du téléphone. */
      :root[data-theme='clair'] {
        color-scheme: light;
      }
      :root[data-theme='sombre'] {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: var(--couleur-fond);
        color: var(--couleur-encre);
        font-family: var(--police-texte);
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5rem;
      }
      button,
      summary,
      label {
        touch-action: manipulation;
      }

      /* Barre et fil d'étapes : montrés seulement hors de l'appli (aperçu), qui a les siens. */
      .barre {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8) var(--espacement-12);
        min-height: 56px;
        padding: var(--espacement-8) var(--espacement-16);
        background: var(--couleur-surface);
        border-block-end: 1px solid var(--couleur-ligne);
      }
      .barre h1 {
        flex: 1 1 140px;
        min-width: 0;
        margin: 0;
        font-size: 1rem;
        font-weight: 500;
        line-height: 1.5rem;
      }
      .barre p {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8);
        margin: 0;
      }
      .mode {
        padding: 2px var(--espacement-8);
        border-radius: var(--rayon-option);
        background: var(--couleur-surface-douce);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .fil {
        background: var(--couleur-surface);
        border-block-end: 1px solid var(--couleur-ligne);
      }
      .bascule {
        display: none;
      }
      .etapes,
      .moment > ol {
        display: flex;
        flex-wrap: wrap;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .etapes {
        gap: var(--espacement-4) var(--espacement-16);
        justify-content: center;
        padding: 0 var(--espacement-12);
      }
      /* Un moment du cycle : son nom, puis ses étapes ; celui de l'étape courante prend l'accent. */
      .moment {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0 var(--espacement-4);
      }
      .moment > ol {
        gap: 0 var(--espacement-4);
      }
      .moment-nom {
        padding: 0 var(--espacement-8);
        color: var(--couleur-texte-discret);
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .moment[data-courant='oui'] > .moment-nom {
        color: var(--couleur-accent);
      }
      .onglet {
        position: relative;
        min-height: 44px;
        padding: 0 var(--espacement-12);
        border: 0;
        background: transparent;
        color: var(--couleur-texte-secondaire);
        font: inherit;
        font-size: 0.875rem;
        line-height: 1.25rem;
        white-space: nowrap;
        cursor: pointer;
      }
      .onglet:hover {
        color: var(--couleur-encre);
      }
      .onglet:focus-visible {
        outline: none;
        border-radius: var(--rayon-champ);
        box-shadow: var(--focus-anneau);
      }
      .onglet[aria-current='step'] {
        color: var(--couleur-accent);
        font-weight: 500;
      }
      .onglet[aria-current='step']::after {
        position: absolute;
        inset-block-end: 0;
        inset-inline: var(--espacement-12);
        block-size: 2px;
        background: var(--couleur-accent);
        content: '';
      }
      @media (max-width: 40rem) {
        .bascule {
          display: flex;
          align-items: center;
          justify-content: space-between;
          inline-size: 100%;
          min-height: 48px;
          padding: 0 var(--espacement-16);
          border: 0;
          background: transparent;
          color: var(--couleur-accent);
          font: inherit;
          font-size: 0.875rem;
          font-weight: 500;
          line-height: 1.25rem;
          cursor: pointer;
        }
        .fil[data-ouvert='false'] .etapes {
          display: none;
        }
        .etapes {
          flex-direction: column;
          gap: var(--espacement-4);
          justify-content: flex-start;
          padding-block-end: var(--espacement-8);
        }
        .moment,
        .moment > ol {
          flex-direction: column;
          align-items: stretch;
        }
        .moment-nom {
          padding: var(--espacement-8) var(--espacement-12) 0;
        }
        .onglet {
          inline-size: 100%;
          text-align: start;
        }
        .onglet[aria-current='step']::after {
          display: none;
        }
      }
      /* Dans l'appli, la barre et le fil d'étapes sont ceux de la page : la fiche n'en montre pas un second. */
      html[data-integree] .barre,
      html[data-integree] .fil {
        display: none;
      }
      html[data-integree] section > h2 {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /*
       * Dans l'appli, l'iframe prend la hauteur du contenu (message page.taille) : la fiche ne défile
       * pas seule. Elle se pose sur le fond de la page, ses cartes ont la largeur de celle du haut.
       */
      html[data-integree] {
        scrollbar-width: none;
      }
      html[data-integree]::-webkit-scrollbar {
        display: none;
      }
      html[data-integree] body {
        background: transparent;
      }
      html[data-integree] main {
        max-width: none;
        padding: 0;
      }

      /* Page : une colonne, des cartes séparées par le même intervalle que dans l'appli. */
      main {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-16);
        max-width: 760px;
        margin: 0 auto;
        padding: var(--espacement-16) var(--espacement-16) var(--espacement-48);
      }
      /* Une erreur de l'appli : la barre est cachée dans l'appli, l'avis passe au-dessus de l'étape. */
      .avis {
        margin: 0;
        padding: var(--espacement-12) var(--espacement-16);
        border: 1px solid var(--couleur-erreur);
        border-radius: var(--rayon-champ);
        background: var(--couleur-surface);
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      #contenu {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-16);
        min-width: 0;
      }
      section {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
        padding: var(--espacement-20);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-carte);
        background: var(--couleur-surface);
      }
      /* Les blocs d'une carte s'espacent par le gap, jamais par des marges qui se cumulent. */
      section :is(h2, h3, h4, p, ul, ol, dl, figure, blockquote, pre, fieldset) {
        margin: 0;
      }
      .ecran,
      .enonce {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
      }
      .ecran[hidden],
      .bouton[hidden] {
        display: none;
      }
      h2 {
        font-size: 1.375rem;
        font-weight: 600;
        line-height: 1.75rem;
        text-wrap: balance;
      }
      h3 {
        font-size: 1.125rem;
        font-weight: 600;
        line-height: 1.625rem;
        text-wrap: balance;
      }
      h4 {
        font-size: 1rem;
        font-weight: 600;
      }
      p,
      li {
        overflow-wrap: break-word;
      }
      .ecran p,
      .ecran li {
        max-width: var(--largeur-lecture);
      }
      .ecran .accroche {
        font-size: 1.125rem;
        line-height: 1.75rem;
      }
      ul,
      ol {
        padding-inline-start: var(--espacement-20);
      }
      /* Seulement les listes du contenu : le fil d'étapes et les autres listes d'interface ont leur propre gap. */
      section :is(ul, ol) > li + li {
        margin-top: var(--espacement-8);
      }
      ul.plain {
        padding-inline-start: var(--espacement-20);
      }
      .discret {
        color: var(--couleur-texte-secondaire);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      a {
        color: var(--couleur-encre);
        font-weight: 500;
        text-decoration: none;
        transition: color var(--duree-transition);
      }
      a:hover {
        color: var(--couleur-accent);
      }
      code,
      kbd {
        font-family: var(--police-code);
        font-size: 0.875em;
        font-variant-ligatures: none;
      }
      code {
        padding: 1px var(--espacement-4);
        border-radius: var(--rayon-option);
        background: var(--couleur-surface-douce);
      }
      pre {
        overflow-x: auto;
        padding: var(--espacement-12);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      pre code {
        padding: 0;
        background: none;
      }

      /* Boutons : Bouton.module.css (principal, secondaire). */
      button {
        font: inherit;
      }
      .bouton {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--espacement-8);
        min-height: var(--hauteur-bouton);
        min-width: var(--cible-tactile-min);
        padding: 0 var(--espacement-16);
        border: 1px solid transparent;
        border-radius: var(--rayon-champ);
        background: var(--couleur-accent);
        color: var(--couleur-accent-sur-fond);
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color var(--duree-transition) ease,
          border-color var(--duree-transition) ease,
          transform var(--duree-transition) ease;
      }
      .bouton:hover:not(:disabled) {
        background: color-mix(in srgb, var(--couleur-accent) 88%, var(--couleur-encre));
      }
      .bouton:active:not(:disabled) {
        background: color-mix(in srgb, var(--couleur-accent) 75%, var(--couleur-encre));
        transform: translateY(1px);
      }
      .bouton.secondaire {
        border-color: var(--couleur-controle);
        background: transparent;
        color: var(--couleur-encre);
      }
      .bouton.secondaire:hover:not(:disabled) {
        background: var(--couleur-surface-douce);
      }
      .bouton.secondaire:active:not(:disabled) {
        border-color: var(--couleur-accent);
        background: var(--couleur-surface-douce);
      }
      .bouton:focus-visible {
        outline: none;
        box-shadow: var(--focus-anneau);
      }
      .bouton:disabled {
        border-color: transparent;
        background: var(--couleur-surface-douce);
        color: var(--couleur-encre);
        opacity: 0.55;
        cursor: not-allowed;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-8);
      }
      @media (prefers-reduced-motion: reduce) {
        .bouton,
        a {
          transition: none;
        }
        .bouton:active:not(:disabled) {
          transform: none;
        }
      }

      /* Champs : ChampTexte, ZoneDeTexte, Selecteur. */
      textarea,
      input[type='text'],
      select {
        width: 100%;
        min-height: var(--hauteur-champ);
        padding: 0 var(--espacement-12);
        border: 1px solid var(--couleur-controle);
        border-radius: var(--rayon-champ);
        background-color: var(--couleur-fond);
        color: var(--couleur-encre);
        font: inherit;
        transition: border-color var(--duree-transition) ease;
      }
      input[type='text'] {
        width: auto;
        font-family: var(--police-code);
        font-variant-ligatures: none;
      }
      textarea {
        min-height: 7rem;
        padding: var(--espacement-12);
        resize: vertical;
        field-sizing: content;
      }
      .reponse-envoyee {
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      textarea:disabled,
      input:disabled {
        background-color: var(--couleur-surface-douce);
        opacity: 0.65;
      }
      textarea:focus-visible,
      input[type='text']:focus-visible,
      select:focus-visible {
        outline: none;
        border-color: var(--couleur-accent);
        box-shadow: var(--focus-anneau);
      }
      select {
        padding-inline-end: var(--espacement-32);
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, currentcolor 50%),
          linear-gradient(135deg, currentcolor 50%, transparent 50%);
        background-position:
          calc(100% - 1.125rem) 50%,
          calc(100% - 0.8125rem) 50%;
        background-repeat: no-repeat;
        background-size:
          0.3125rem 0.3125rem,
          0.3125rem 0.3125rem;
      }
      /* Une question : sa carte propre, sur le fond de la carte de l'étape. */
      .item {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
        padding: var(--espacement-16);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      .item > label,
      .relance > label {
        font-weight: 500;
      }
      /* Le complément d'une réponse, après sa correction, dans la carte de la question. */
      .relance {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        min-width: 0;
      }
      .item[data-fait='oui'] {
        border-color: var(--couleur-succes);
      }
      /* Une question à reprendre : la couleur du statut « À reprendre » de l'appli. */
      .item[data-fait='reprise'] {
        border-color: var(--couleur-erreur);
      }
      .item-reprise {
        margin: 0;
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1.25rem;
      }
      .erreur {
        margin: 0;
        color: var(--couleur-erreur);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .erreur:empty {
        display: none;
      }

      /* Confiance : GroupeSegmente. */
      fieldset {
        display: flex;
        flex-wrap: wrap;
        gap: var(--espacement-8);
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }
      legend {
        float: left;
        width: 100%;
        padding: 0;
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1.25rem;
        color: var(--couleur-texte-secondaire);
      }
      .choix label {
        position: relative;
        display: flex;
        flex: 1 0 auto;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding-inline: var(--espacement-8);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-option);
        background: var(--couleur-fond);
        white-space: nowrap;
        cursor: pointer;
      }
      /* La vraie radio couvre l'option et déborde du cadre : la zone tactile fait au moins 44 px. */
      .choix input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .choix label:has(input:checked) {
        border-color: var(--couleur-accent);
        background: var(--couleur-accent);
        box-shadow: var(--ombre-option);
        color: var(--couleur-accent-sur-fond);
        font-weight: 600;
      }
      .choix label:has(input:focus-visible) {
        box-shadow: var(--focus-anneau);
      }
      .choix label:has(input:disabled) {
        opacity: 0.65;
        cursor: not-allowed;
      }

      /* Correction : BulleCorrection. */
      .correction {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
        padding: var(--espacement-20);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-carte);
        background: var(--couleur-surface);
      }
      .correction > strong {
        display: flex;
        align-items: center;
        gap: var(--espacement-8);
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.25rem;
        color: var(--couleur-texte-secondaire);
      }
      .correction > strong::before {
        flex: none;
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: currentcolor;
        content: '';
      }
      .correction[data-niveau='solide'] > strong {
        color: var(--couleur-succes);
      }
      .correction[data-niveau='partiel'] > strong {
        color: var(--couleur-alerte);
      }
      .correction[data-niveau='fragile'] > strong {
        color: var(--couleur-erreur);
      }
      .correction p {
        margin: 0;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      /* Sous la question : la correction, puis l'accord sur le niveau quand elle est tirée au sort. */
      .sortie {
        display: flex;
        flex-direction: column;
        gap: var(--espacement-12);
      }
      .sortie:empty {
        display: none;
      }
      .accord {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--espacement-8) var(--espacement-12);
      }
      /* BadgeNeComptePas de l'appli : une réponse qui ne compte pas pour le statut, et pourquoi. */
      .badge-compte {
        display: inline-flex;
        align-items: center;
        align-self: flex-start;
        min-height: 1.75rem;
        padding: 0 var(--espacement-12);
        border: 1px solid var(--couleur-ligne);
        border-radius: 999px;
        background: var(--couleur-surface-douce);
        color: var(--couleur-texte-secondaire);
        font-size: 0.75rem;
        font-weight: 500;
        line-height: 1rem;
        white-space: nowrap;
      }

      /* Détails repliables ; l'objectif d'examen replié (carte, pratique) en est un. */
      details {
        padding: 0 var(--espacement-16);
        border: 1px solid var(--couleur-ligne);
        border-radius: var(--rayon-champ);
        background: var(--couleur-fond);
      }
      details[open] {
        padding-block-end: var(--espacement-12);
      }
      details > :not(summary) {
        margin-block-start: var(--espacement-12);
      }
      details > summary + * {
        margin-block-start: var(--espacement-4);
      }
      summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--espacement-12);
        min-height: 48px;
        font-weight: 500;
        list-style: none;
        cursor: pointer;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::after {
        flex: none;
        width: 0.5rem;
        height: 0.5rem;
        border-inline-end: 2px solid var(--couleur-texte-secondaire);
        border-block-end: 2px solid var(--couleur-texte-secondaire);
        transform: rotate(45deg) translate(-2px, -2px);
        transition: transform var(--duree-transition) ease;
        content: '';
      }
      details[open] > summary::after {
        transform: rotate(-135deg) translate(-2px, -2px);
      }
      summary:focus-visible {
        outline: none;
        border-radius: var(--rayon-champ);
        box-shadow: var(--focus-anneau);
      }

      /* Écrans : une idée à la fois, avec une barre de progression comme BarreProgression. */
      .ecran-barre {
        display: flex;
        align-items: center;
        gap: var(--espacement-12);
        min-width: 0;
      }
      .ecran-titre {
        flex: 1 1 auto;
        min-width: 0;
        margin: 0;
        color: var(--couleur-accent);
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.25rem;
      }
      .ecran-compte {
        flex: none;
        color: var(--couleur-texte-secondaire);
        font-size: 0.875rem;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .ecouter {
        flex: none;
        min-height: var(--cible-tactile-min);
        padding: 0 var(--espacement-12);
        font-size: 0.875rem;
        white-space: nowrap;
      }
      /* Un seul écran : la barre ne porte que « Écouter », à droite. */
      .ecran-barre > .ecouter:only-child {
        margin-inline-start: auto;
      }
      .ecran-progres {
        height: 0.5rem;
        border-radius: 0.25rem;
        background: var(--couleur-ligne);
        overflow: hidden;
      }
      .ecran-progres > span {
        display: block;
        height: 100%;
        border-radius: 0.25rem;
        background: var(--couleur-accent);

        gap: var(--espacement-8);
      }
      .mots th[scope='row'] {

      }
    </style>
  </head>

    <!-- ET1, perception : la photo regardée de près, puis le pari du début. -->
    <template data-etape="ET1">
      <div data-ecran="Regarde">
        <p class="accroche">
          Avant toute explication, regarde une photo de très près. Tu n’as rien à faire : lance
          l’animation et regarde-la jusqu’au bout.
        </p>
        <div data-widget="perception">
          <ol class="scenes">
            <li>
              Une photo de paysage, comme celles de ton téléphone : un ciel, un soleil, une colline.
            </li>
            <li>
              De près, la photo est une grille de petits carrés de couleur, les pixels. Regarde le
              carré orange cerné de blanc.
            </li>
            <li>
              Ce carré mélange trois lumières : beaucoup de rouge, un peu de vert, très peu de bleu.
            </li>
            <li>
              Chaque lumière est réglée par huit lampes, allumées ou éteintes : huit pour le rouge,
              huit pour le vert, huit pour le bleu.
            </li>
            <li>
              Le fichier de la photo, c’est ça : des rangées de huit lampes, les unes après les
              autres.
            </li>
            <li>
              Le même fichier, ouvert dans un éditeur de texte comme le Bloc-notes, affiche des
              lettres et des signes sans suite.
            </li>
            <li>Côte à côte : la photo, et le même fichier dans l’éditeur de texte.</li>
          </ol>
        </div>
      </div>
      <div data-ecran="Ton pari">
        <div
          data-widget="pari"
          data-cle="debut"
          data-apres="C’est noté, sans note. Tu reprendras ce pari à la fin du bloc, pour le corriger."
        >
          <p>
            La photo s’affiche bien dans un logiciel de photos. Le même fichier, ouvert dans un
            éditeur de texte, donne des signes sans suite. À ton avis, pourquoi ?
          </p>
          <ul>
            <li data-option="abime">
              Le fichier est abîmé : l’éditeur de texte n’arrive pas à le lire.
            </li>
            <li data-option="regle">Chaque programme lit le fichier avec sa propre règle.</li>
            <li data-option="deux">
              Le fichier contient deux parties : une pour la photo, une pour le texte.
            </li>
          </ul>
        </div>
      </div>
    </template>

    <!-- ET2, carte : où tu es, à quoi ça sert, ce que tu sauras faire. -->
    <template data-etape="ET2">
      <p class="accroche">
        Une machine range tout en <strong>bits</strong> : des 0 et des 1, comme les lampes éteintes
        ou allumées de l’animation. Huit bits à la suite, comme une rangée de huit lampes, font un
        <strong>octet</strong>. Ce bloc t’apprend à lire ces bits.
      </p>
      <h3>Où tu es</h3>
      <p>Ce bloc ouvre la partie La machine, qui tient en quatre idées reliées :</p>
      <ul class="carte-partie">
        <li class="ici">
          <strong>L’information en bits</strong> : tout ce que la machine traite est une suite de
          bits. Tu es ici.
        </li>
        <li>
          <strong>Décider : ET, OU, NON, SI/SINON</strong> : la machine décide avec de la logique
          sur ces bits.
        </li>
        <li>
          <strong>L’ordinateur et ses composants</strong> : des composants rangent, transportent et
          calculent ces bits.
        </li>
        <li>
          <strong>Du langage machine aux langages de haut niveau</strong> : un programme, écrit dans
          un langage, devient des instructions que ces composants exécutent.
        </li>
      </ul>
      <p>Les trois blocs suivants reposent sur celui-ci.</p>
      <h3>À quoi ça sert</h3>
      <p>
        Comme développeur web, tu t’en serviras pour écrire une couleur rgb() dans une page, estimer
        la taille d’une image avant compression (son nombre d’octets), comprendre pourquoi un texte
        affiche « Ã© » au lieu de « é ».
      </p>
      <h3>Ce que tu sauras faire</h3>
      <ul>
        <li>Convertir un nombre entre décimal et binaire, à la main, juste puis vite.</li>
        <li>
          Dire combien de valeurs un octet peut écrire, quel est son plus grand nombre, et pourquoi.
        </li>
        <li>
          Lire un même octet comme un nombre, une lettre ou une couleur, et dire ce qui décide.
        </li>
      </ul>
      <p class="discret">
        Tu sais déjà lire 345 comme 3 centaines, 4 dizaines et 5 unités : c’est l’écriture décimale,
        celle de tous les jours, avec les chiffres 0 à 9. C’est presque tout ce qu’il faut pour
        commencer.
      </p>
    </template>

    <!-- ET3, pré-test : des paris sans note, corrigés à la fin de la série par l'explication. -->
    <template data-etape="ET3">
      <div data-ecran="Des lampes">
        <p class="accroche">
          Une lampe n’a que deux états : éteinte ou allumée. Pour une machine, chaque lampe est un
          <strong>bit</strong> : on note 0 pour éteinte et 1 pour allumée. Noter 1 pour allumé est
          une convention : on aurait pu choisir l’inverse.
        </p>
        <p>Joue avec ces quatre lampes : chaque réglage s’écrit comme une suite de 0 et de 1.</p>
        <div data-widget="octet" data-bits="4" data-sans-poids></div>
        <p class="discret">
          Avant toute explication, tu vas parier. Rien n’est noté : te tromper ici est utile,
          l’explication partira de tes paris.
        </p>
      </div>
      <div data-ecran="Compter les réglages">
        <p class="discret">
          Pour compter, écris tous les réglages possibles, un par ligne, puis regarde comment leur
          nombre grandit d’une lampe à l’autre.
        </p>
        <div data-widget="serie" data-fin="Tes paris sont notés. Le cours les reprendra un par un.">
          <div data-cle="compter1">
            Avec <strong>1</strong> lampe, combien de réglages différents ?
          </div>
          <div data-cle="compter2">
            Avec <strong>2</strong> lampes, combien de réglages différents ?
          </div>
          <div data-cle="compter3">
            Avec <strong>3</strong> lampes, combien de réglages différents ?
          </div>
          <div data-cle="compter4">
            Avec <strong>4</strong> lampes, combien de réglages différents ?
          </div>
        </div>
      </div>
      <div data-ecran="Donner un poids">
        <p class="accroche">
          Dans 345, chaque chiffre a un poids : 3 centaines, 4 dizaines, 5 unités, donc 300 + 40 +
          5. Donne maintenant un poids à chaque lampe : 8, 4, 2 et 1, de gauche à droite.
        </p>
        <div
          class="lampes-poids"
          role="img"
          aria-label="Quatre lampes de poids 8, 4, 2 et 1 : allumée, éteinte, allumée, éteinte"
        >
          <span class="lampe-case"
            ><span class="lampe-poids">8</span><span class="lampe" data-on="1">1</span></span
          ><span class="lampe-case"
            ><span class="lampe-poids">4</span><span class="lampe" data-on="0">0</span></span
          ><span class="lampe-case"
            ><span class="lampe-poids">2</span><span class="lampe" data-on="1">1</span></span
          ><span class="lampe-case"
            ><span class="lampe-poids">1</span><span class="lampe" data-on="0">0</span></span
          >
        </div>
        <div data-widget="serie" data-fin="Ton pari est noté.">
          <div data-cle="peser">Avec ces poids, que vaut le réglage 1010 ?</div>
        </div>
      </div>
      <div data-ecran="Avec six lampes">
        <div
          data-widget="serie"
          data-fin="Tes paris sont notés. L’étape Lire un nombre les reprend un par un."
        >
          <div data-cle="six_reglages">
            Avec <strong>6</strong> lampes, combien de réglages différents ?
          </div>
          <div data-cle="six_max">
            Chaque réglage écrit un nombre, avec des poids comme à l’écran précédent : 32, 16, 8, 4,
            2 et 1. Avec 6 lampes, quel est le plus grand nombre qu’on peut écrire ?
          </div>
        </div>
      </div>
    </template>

    <!-- ET4, le schéma : le modèle du bloc, boîte par boîte, puis la relation centrale et ses limites. -->
    <template data-etape="ET4">
      <div
        data-ecran="Le schéma du bloc"
        data-lecture="Tout le bloc tient dans une chaîne de cinq boîtes. Un bit : un état à deux valeurs, 0 ou 1. Huit bits à la suite font un octet. L’octet est lu par ce qui lit : un programme, ou le processeur. Ce qui lit applique sa convention de lecture, la règle qui dit comment lire les bits. Elle donne le sens : un nombre, une lettre, une intensité de couleur, une instruction ou une partie d’instruction."
      >
        <p class="accroche">
          Tout le bloc tient dans une chaîne de cinq boîtes. Allume-les une à une, en lisant
          chacune.
        </p>
        <div data-widget="schema" class="schema">
          <div class="boite" data-boite>
            <h4>Bit</h4>
            <p>Un état à deux valeurs : 0 ou 1, comme une lampe éteinte ou allumée.</p>
          </div>
          <p class="lien">8 bits à la suite font un</p>
          <div class="boite" data-boite>
            <h4>Octet</h4>
            <p>Huit bits, par exemple 01001101.</p>
          </div>
          <p class="lien">qui est lu par</p>
          <div class="boite" data-boite>
            <h4>Ce qui lit</h4>
            <p>
              Un programme, comme un éditeur de texte, ou le processeur, le composant qui exécute
              les instructions des programmes.
            </p>
          </div>
          <p class="lien">qui applique sa</p>
          <div class="boite" data-boite>
            <h4>Convention de lecture</h4>
            <p>La règle qui dit comment lire les bits. On dit aussi un codage.</p>
          </div>
          <p class="lien">qui donne</p>
          <div class="boite" data-boite>
            <h4>Le sens</h4>
            <p>
              Ce que l’octet veut dire : un nombre, une lettre, une intensité de couleur, une
              instruction ou une partie d’instruction.
            </p>
          </div>
        </div>
      </div>
      <div data-ecran="Quatre conventions">
        <p class="accroche">
          Ce bloc montre quatre conventions de lecture. Le même octet peut passer par l’une ou
          l’autre : chaque programme applique celle pour laquelle il a été écrit.
        </p>
        <ul>
          <li>
            <strong>Un nombre</strong>, avec la <strong>numération binaire</strong> : chaque bit
            compte pour une valeur fixée d’avance, et on additionne. Étape Lire un nombre.
          </li>
          <li>
            <strong>Une lettre</strong> : on calcule d’abord le nombre, puis une table dit quelle
            lettre porte ce numéro. Étape Lire une lettre.
          </li>
          <li>
            <strong>Une couleur</strong> : trois octets à la suite, chacun calculé comme un nombre,
            règlent trois lumières. Étape Lire une couleur et une photo.
          </li>
          <li>
            <strong>Une instruction</strong>, un ordre simple que le processeur exécute : il lit les
            octets avec sa propre table. Ce bloc ne te la donne pas : tu sauras qu’elle existe, sans
            la lire. Étape Lire une instruction.
          </li>
        </ul>
        <p>
          Les deuxième et troisième passent donc par la première : la lettre et la couleur partent
          du nombre. La quatrième, non : le processeur lit les bits dans sa table, sans calculer de
          nombre.
        </p>
      </div>
      <div data-ecran="La relation centrale">
        <p class="accroche">
          <strong
            >Une suite de bits n’a de sens qu’avec une convention de lecture, fixée d’avance et
            partagée par ce qui l’écrit et ce qui la lit.</strong
          >
        </p>
        <p>
          Pourquoi ? Rien, dans un bit à 1, ne dit s’il compte pour un nombre, une lettre ou une
          couleur. Les bits seuls ne disent rien : il faut les bits et la convention.
        </p>
        <p>
          Qui écrit ? Le programme qui a enregistré le fichier, par exemple celui de l’appareil
          photo. Qui l’applique ? Ce qui lit. Un programme applique la sienne : un éditeur de texte
          lit les octets comme des lettres, un logiciel de photos ou de dessin comme les intensités
          des couleurs. Le processeur applique la sienne, sa table d’instructions, fixée quand il a
          été conçu.
        </p>
        <p>
          Relue avec une autre convention que celle qui l’a écrite, la même suite de bits prend un
          autre sens, souvent absurde.
        </p>
        <p class="retenir">
          <strong>Si tu ne retiens qu’une chose :</strong> une suite de bits ne veut rien dire sans
          convention de lecture. Tu reprendras ton pari du début à la fin du bloc.
        </p>
      </div>
      <div data-ecran="La lampe est une image">
        <p class="accroche">
          La lampe est une image. Dans la machine, il n’y a pas de lampe : un bit, c’est n’importe
          quoi qui a deux états, comme une tension électrique haute ou basse, ou un point aimanté
          dans un sens ou dans l’autre.
        </p>
        <p>
          Le mot bit vient de l’anglais <em>binary digit</em>, « chiffre binaire ». Le nom vient des
          nombres, mais un bit n’est pas toujours le chiffre d’un nombre : c’est la convention de
          lecture qui dit ce qu’il représente.
        </p>
        <p>À partir d’ici, la fiche dit bit, et plus lampe.</p>
      </div>
      <div data-ecran="Ce que ce bloc ne dit pas">
        <p class="accroche">Ce bloc lit les bits. Il ne dit pas :</p>
        <ul>
          <li>
            comment la machine décide avec eux : c’est le bloc Décider : ET, OU, NON, SI/SINON ;
          </li>
          <li>
            où les composants les rangent, les transportent et calculent avec eux : c’est le bloc
            L’ordinateur et ses composants ;
          </li>
          <li>
            comment le texte d’un programme devient ce que le processeur exécute : c’est le bloc Du
            langage machine aux langages de haut niveau.
          </li>
        </ul>
      </div>
    </template>

    <!-- ET5, lire un nombre : la numération binaire, à partir des paris de l'essai. -->
    <template data-etape="ET5">
      <div data-ecran="Chaque bit double">
        <p class="accroche">
          Tes paris de l’essai, à côté des réponses. Chaque lampe était un bit, et chaque réglage
          une valeur :
        </p>
        <div
          data-widget="rappel-paris"
          data-cles="compter1,compter2,compter3,compter4"
          data-vrais="2,4,8,16"
          data-libelles="1 bit|2 bits|3 bits|4 bits"
          data-retour-ajoute="Tes paris montent toujours du même pas : tu as ajouté des valeurs à chaque bit. Or chaque bit ajouté les double."
        ></div>
        <p>
          <strong>Chaque bit ajouté double le nombre de valeurs.</strong> Pourquoi ? On reprend
          toutes les valeurs d’avant deux fois : une fois avec le nouveau bit à 0, une fois avec lui
          à 1.
        </p>
        <p>
          Avec n bits, on obtient 2 × 2 × … × 2, avec n fois le chiffre 2. On l’écrit
          <strong>2ⁿ</strong> et on lit « 2 puissance n » : 2⁴ = 2 × 2 × 2 × 2 = 16. Pour le
          calculer, on part de 2 et on double à chaque bit ajouté.
        </p>
        <p>
          Pour un octet, huit bits : 2, 4, 8, 16, 32, 64, 128, 256. Un octet donne 2⁸ =
          <strong>256</strong> valeurs différentes : chaque suite de huit bits en est une.
        </p>
      </div>
      <div data-ecran="256 valeurs, 255 au plus">
        <div
          data-widget="rappel-paris"
          data-cles="six_reglages,six_max"
          data-vrais="64,63"
          data-libelles="Valeurs avec 6 bits|Plus grand nombre"
          data-si="six_max=64"
          data-retour="Tu as donné 64 comme plus grand nombre : c’est le nombre de valeurs. C’est l’erreur la plus courante du bloc, lis la suite."
        ></div>
        <p class="accroche">
          On compte à partir de 0 : la suite où tous les bits sont à 0 écrit 0. Avec 2 bits : 00,
          01, 10 et 11, soit 4 valeurs, de 0 à 3.
        </p>
        <p>
          Avec 6 bits, 64 valeurs, de 0 à 63 : 111111 vaut 32 + 16 + 8 + 4 + 2 + 1 = 63. Avec un
          octet, ajoute 1 à partir de 250, jusqu’à ce que les huit bits soient à 1, puis une fois de
          plus.
        </p>
        <div data-widget="compteur" data-depart="250"></div>
        <p>
          La première valeur est 0, donc la 256e est 255. Ajouter 1 à 255 ne tient plus sur huit
          bits. C’est comme 999 + 1 en décimal, qui donne 1000, avec un chiffre de plus : 256
          s’écrit 100000000, avec neuf chiffres. La comparaison s’arrête là : sur le papier, on
          ajoute un chiffre, mais le compteur n’a que huit cases. Il ne garde que les huit chiffres
          de droite, 00000000 : il repasse à 0. Pour écrire 256, il faudrait un neuvième bit.
          <strong
            >Le nombre de valeurs et le maximum sont deux nombres différents : le maximum a un de
            moins, parce que le 0 compte.</strong
          >
        </p>
        <p>
          Avec n bits : 2ⁿ valeurs, de 0 à 2ⁿ − 1. Le maximum s’écrit toujours avec tous les bits à
          1. Un nombre plus grand que le maximum ne tient pas : il demande plus de bits.
        </p>
        <div
          data-widget="nombre"
          data-reponse="15"
          data-aide1="Par quelle valeur commence-t-on à compter ?"
          data-aide2="Le nombre de valeurs et le maximum ne sont pas le même nombre : le 0 compte comme une valeur."
          data-aide3="Les 16 valeurs commencent à 0 : écris les premières, 0, 1, 2, et compte jusqu’à la seizième."
          data-solution="16 valeurs, de 0 à 15 : le maximum est 15."
          data-si-e1="16"
          data-retour-e1="16, c’est le nombre de valeurs avec 4 bits. On compte à partir de 0 : la dernière valeur a un de moins."
          data-sinon="Pas encore. Le maximum s’écrit avec les 4 bits à 1 : 1111."
          data-succes="Seize valeurs, de 0 à 15 : le maximum a un de moins."
          data-variante-enonce="avec 3 bits, il y a 8 valeurs. Quel est le plus grand nombre qu’on peut écrire ?"
          data-variante-reponse="7"
          data-variante-aide1="Par quelle valeur commence-t-on à compter ?"
          data-variante-aide2="Le nombre de valeurs et le maximum ne sont pas le même nombre : le 0 compte comme une valeur."
          data-variante-aide3="Les 8 valeurs commencent à 0 : écris les premières, 0, 1, 2, et compte jusqu’à la huitième."
          data-variante-solution="8 valeurs, de 0 à 7 : le maximum est 7."
          data-variante-si-e1="8"
          data-variante-retour-e1="8, c’est le nombre de valeurs avec 3 bits. On compte à partir de 0 : la dernière valeur a un de moins."
          data-variante-sinon="Pas encore. Le maximum s’écrit avec les 3 bits à 1 : 111."
          data-variante-succes="Huit valeurs, de 0 à 7 : le maximum a un de moins."
        >
          Avec 4 bits, il y a 16 valeurs. Quel est le plus grand nombre qu’on peut écrire ?
        </div>
      </div>
      <div data-ecran="Les poids et la somme">
        <div
          data-widget="rappel-paris"
          data-cles="peser"
          data-vrais="10"
          data-libelles="1010 avec les poids 8, 4, 2, 1"
          data-si="peser=2"
          data-retour="Tu as compté les bits à 1. Chacun compte pour son poids : 8 + 2 = 10."
        ></div>
        <p class="accroche">
          Dans 345, chaque chiffre a un poids : 100, 10 et 1, donc 345 = 3 × 100 + 4 × 10 + 5 × 1.
          Dans un octet, chaque bit a un poids aussi. Le mot est une image : un bit ne pèse rien,
          son poids est ce qu’il compte quand il vaut 1.
        </p>
        <p>
          Le réglage 1010 de l’essai vaut donc 8 + 2 = <strong>10</strong> : chaque bit à 1 compte
          pour son poids.
        </p>
        <p>
          Dans un octet, les huit poids sont, de gauche à droite, 128, 64, 32, 16, 8, 4, 2 et 1 : de
          droite à gauche, chacun double.
        </p>
        <p>
          <strong>La valeur d’un octet est la somme des poids des bits à 1.</strong> Cette lecture
          s’appelle la <strong>numération binaire</strong>. Essaie : mets à 1 les bits de poids 128,
          8 et 1, tu obtiens 137.
        </p>
        <div data-widget="octet"></div>
        <p class="retenir">
          <strong>À retenir, les huit poids d’un octet, de gauche à droite :</strong> 128, 64, 32,
          16, 8, 4, 2, 1. Toutes les conversions s’en servent.
        </p>
      </div>
      <div data-ecran="Pourquoi les poids doublent">
        <p class="accroche">
          Pourquoi doubler ? Les bits à droite d’un bit écrivent déjà tous les nombres de 0 jusqu’à
          un de moins que son poids : avec 4, 2 et 1, de 0 à 7. Mettre à 1 le bit de poids 8 donne
          ensuite 8 à 15. Aucun nombre ne manque, aucun n’est écrit deux fois. Avec un poids de 7 à
          la place de 8, le nombre 7 s’écrirait de deux façons ; avec un poids de 9, le nombre 8 ne
          s’écrirait pas.
        </p>
        <p>Sur n bits, le bit de gauche pèse 2ⁿ⁻¹, la moitié de 2ⁿ : sur un octet, 2⁷ = 128.</p>
        <p>
          Le poids le plus lourd est à gauche, comme les centaines dans 345 : c’est une convention
          d’écriture, la même qu’en décimal. Lire à l’envers change la valeur : 00000011 vaut 2 + 1
          = 3, mais 11000000 vaut 128 + 64 = 192.
        </p>
      </div>
      <div data-ecran="Le binaire, une convention">
        <p class="accroche">
          Lire les bits comme un nombre, avec ces poids, c’est la
          <strong>numération binaire</strong> : la première convention du schéma.
        </p>
        <p>
          Une convention, c’est une règle fixée d’avance et partagée. La numération binaire en
          réunit deux que tu connais déjà : la valeur est la somme des poids des bits à 1, et le
          poids le plus lourd est à gauche.
        </p>
        <p>
          On écrit les nombres avec deux chiffres, 0 et 1, et des poids 1, 2, 4, 8 : le binaire est
          la
          <strong>base 2</strong>. Le décimal, avec ses dix chiffres de 0 à 9 et ses poids 1, 10,
          100, est la <strong>base 10</strong>. 137 en base 10 et 10001001 en base 2 sont le même
          nombre, écrit deux fois.
        </p>
        <p>
          La comparaison avec 345 a une limite. En décimal, un chiffre va de 0 à 9 et les poids sont
          multipliés par 10 à chaque pas. En binaire, un bit vaut 0 ou 1 : chaque poids compte une

        <p class="accroche">
          Le <strong>processeur</strong>, déjà croisé dans le schéma, est le composant qui exécute

          la nomme.
        </p>
      </div>
      <div data-ecran="Le code machine">
        <p class="accroche">
          Le processeur n’exécute que des instructions écrites en bits, avec sa convention à lui, sa
          table d’instructions, fixée quand il a été conçu : c’est le <strong>code machine</strong>,
          qu’on appelle aussi langage machine. C’est la quatrième convention du schéma.
        </p>
        <p>
          Le mot nomme à la fois la convention et ce qu’elle écrit : on dit d’un programme dont les
          instructions sont écrites ainsi, en bits, qu’il est « en code machine ».
        </p>
        <p>
          Des bits ne deviennent une instruction que quand le processeur les lit avec sa table. Une
          instruction tient souvent sur plusieurs octets : un octet seul n’en est parfois qu’une
          partie.
        </p>
        <p>
          Le logiciel de photos est lui-même un programme : le processeur exécute ses instructions
          avec sa table, et ces instructions appliquent aux octets de la photo la convention des
          couleurs. Deux conventions, chacune sur ses propres octets.
        </p>
        <p>

    <template data-conception>
      <h3>Les coups de pouce</h3>
      <ul>
        <li>
          Dans les outils convertir, nombre, lettre et octets, le bouton « Un coup de pouce » reste
          grisé, avec « Essaie d’abord : le coup de pouce vient après une tentative. », tant
          qu’aucune réponse fausse n’a été vérifiée. Après chaque cran, il faut une nouvelle réponse
          fausse pour ouvrir le suivant.
        </li>
        <li>
          Une bonne réponse qui vient après une réponse fausse compte avec l’aide 1 au moins, même
          sans coup de pouce ouvert : le retour de l’erreur a orienté. Seule une réussite du premier
          coup compte sans aide.
        </li>
        <li>
          Les crans, dans l’ordre : data-aide1 (une question qui oriente), data-aide2 (un indice sur
          la notion), data-aide3 (l’étape détaillée), puis la solution, toujours en dernier, suivie
          du bouton « J’ai compris, je refais sans regarder ». Sans data-aide, l’outil convertir
          écrit ses propres crans à partir du nombre ; sans data-solution, il écrit la solution pas
          à pas.
        </li>
        <li>
          En pratique, dès que la solution s’affiche, l’outil le dit au gabarit (aide 4, à noter
          tout de suite) : l’item est « Solution vue », même si l’apprenant quitte la page sans rien
          refaire. « J’ai compris, je refais sans regarder » fait redessiner l’item sur sa variante
          (le template data-variante de même clé), puis sur l’énoncé d’origine, en alternance : on
          ne refait jamais le cas dont on vient de voir la solution.
        </li>
        <li>
          Dans le cours (étapes 5 à 7), chaque outil à coup de pouce a aussi une variante, posée
          après la solution. L’outil convertir passe au nombre de data-variante, avec des crans
          recalculés (« Refais sans regarder : quelle est la valeur de … ? », « Refais sans
          regarder, avec … : écris-le en binaire, sur 8 chiffres. »). Les outils nombre, lettre et
          octets passent à data-variante-enonce (« Refais sans regarder, sur un autre cas : … »),
          avec ses propres crans (data-variante-aide1 à data-variante-aide3, data-variante-solution)
          et ses propres retours.
        </li>
        <li>
          Une bonne réponse qui suit une solution vue ouvre « Tu as refait sans regarder. Explique
          maintenant pourquoi c’est juste, en une ou deux phrases : ». « Comparer avec la fiche » ne
          s’ouvre qu’avec une explication écrite, puis montre la solution écrite et « Ce qui manque
          à ton explication, c’est ce qu’il te reste à retenir. »
        </li>
        <li>
          Une bonne réponse qui vient après l’étape détaillée (aide 3) se fait aussi expliquer : «
          Tu as trouvé avec l’étape détaillée. Explique maintenant pourquoi c’est juste, en une ou
          deux phrases : », puis « Comparer avec la fiche ». Une réponse trouvée en suivant l’étape
          n’est jamais acceptée sans être expliquée.
        </li>
        <li>
          L’étape détaillée montre le chemin sur le cas posé, sans faire l’opération finale avec ses
          nombres ni laisser lire la réponse. Pour lire un octet : la place des bits à 1 (« le
          deuxième, le troisième et le cinquième en partant de la gauche »), pas leurs poids ; pour
          écrire un nombre : les premiers poids parcourus et ce qui reste, puis « Continue jusqu’au
          poids 1 » ; pour une lettre : l’addition à faire et où chercher, pas la valeur ; pour un
          compte de valeurs ou un maximum : la façon de compter (doubler à partir d’un bit, écrire
          les poids), pas le résultat.
        </li>
        <li>
          Un choix qui porte data-justifier (PR6) ouvre ce champ après toute bonne réponse, avec la
          consigne de data-justifier à la place de la phrase ci-dessus.
        </li>
      </ul>
      <h3>Le choix</h3>
      <ul>
        <li>
          Chaque item à choix a ses trois crans : data-aide1 (une question qui oriente), data-aide2
          (un indice), data-aide3 (l’étape détaillée), puis data-solution.
        </li>
        <li>
          Chaque option fausse est une tentative, et une seule : elle se grise, affiche « Pas
          encore. » suivi de son data-retour, et ouvre un cran de plus de l’échelle. La première
          ouvre « Pour t’orienter : » (data-aide1), la deuxième « Un indice : » (data-aide2). Une
          bonne réponse qui vient après N options fausses compte avec l’aide N (3 au plus), pas
          comme une réussite sans aide ; après l’étape détaillée, elle se fait expliquer (voir plus
          haut).
        </li>
        <li>
          Quand il ne reste qu’une option, la choisir ne prouverait rien : les boutons se grisent,
          et un champ s’ouvre, « Il ne reste qu’une option : la choisir ne prouverait rien. Explique
          plutôt pourquoi c’est elle, en une ou deux phrases. Chaque explication ouvre le cran
          suivant, jusqu’à la solution. ». Une explication d’au moins trois mots est la tentative

          pour ouvrir le suivant. »). Après le dernier cran, l’explication suivante ouvre la
          solution, et l’item compte « Solution vue » (aide 4). Sur un choix à trois options : deux
          options fausses ouvrent deux crans, une explication l’étape détaillée, une autre la

      <h3>Les retours</h3>

        <li>

          : « Écris une réponse. », « Écris un nombre. », « Écris une seule lettre. », « Utilise
          seulement des 0 et des 1. », « Écris les 8 chiffres de l’octet, même les 0 de gauche. », «
          Écris N octets de 8 chiffres, même les 0 de gauche, séparés par un espace. ».
        </li>
        <li>

          data-retour-e4 ; un nombre égal au nombre de bits à 1 donne « Tu as compté les bits à 1,
          pas leurs poids. Additionne les poids des bits à 1. » ; tout autre nombre faux, « Pas
          encore. Additionne les poids des bits à 1, et seulement ceux-là. ». Du décimal vers le
          binaire : des bits à l’envers donnent data-retour-e4 ; toute autre suite fausse, « Ta
          suite vaut N, pas M. Reprends les poids de gauche à droite. ». Les retours data-si-…
          passent avant ceux-là.
        </li>
        <li>

          réponse fausse donne data-sinon, ou à défaut « Pas encore. Relis ta méthode, ou demande un
          coup de pouce. ». Sur la variante d’un outil du cours, ce sont data-variante-si-…,
          data-variante-sinon et data-variante-succes.
        </li>

          c’est lui qui compte l’item. Dans le cours, hors item, elle laisse aussi sa trace (voir
          plus bas).
        </li>
        <li>

          erreur critique reconnue part aussi au gabarit (fiche:erreur, avec l’erreur et l’item, «
          aisance » ou « reprise:debut ») : des bits lus ou écrits à l’envers (E4), une réponse
          prévue par data-si-e1 ou un départ de 256 (E1), le nombre de bits à 1 donné pour la valeur
          (E5), une option qui porte data-erreur (E2, E3). Le retour ajoute « C’est une erreur
          critique du bloc : elle ira dans ton bilan, cochée d’office. ». Le gabarit la garde dans
          l’état de la page ; au bilan, elle est cochée d’office, et seule une réponse solide à une
          question qui la touche la referme. Une fois la restitution faite, tant que le bilan n’est
          pas envoyé, la consolidation ne commence pas et l’aisance s’arrête ; le retour dit alors «
          C’est une erreur critique du bloc : envoie ton bilan avant de continuer, elle y est cochée
          d’office. ». Dans le cours (étapes 5 à 7), l’erreur fait partie de l’apprentissage : son

          l’animation de l’écran précédent jusqu’au bout : le pari vient après. ». Après le choix,
          il affiche son data-apres.
        </li>
        <li>
          La série de paris (étape 3) ne corrige rien non plus. Elle pose une question à la fois,
          refuse ce qui n’est pas un nombre (« Écris un nombre, même au hasard : c’est un pari. »),
          puis récapitule les paris avec « Changer mes paris », qui les efface pour parier à
          nouveau.
        </li>
        <li>

          d’éléments justes, sur combien). Le travail du cours, de l’étape 4 à l’étape 8, laisse
          aussi la sienne, sous le nom de son écran (modele:…, par exemple modele:Binaire vers

          sur combien), le schéma tout allumé, et chaque vérification d’un outil du cours (juste ou
          faux, avec son aide). Le gabarit les range dans l’état de la page, que l’appli garde, et
          les rend à chaque étape dessinée, à la visite suivante aussi.
        </li>
        <li>

          data-retour quand le pari vaut data-si, data-retour-ajoute quand des paris montent
          toujours du même pas, « Tous tes paris étaient justes. » quand ils le sont, ou « Tu n’as
          pas noté de pari ici : compare avec ce que tu pensais. » sans pari.
        </li>
        <li>

          début dans les mots du pari d’alors (data-avant) : « Au début, tu avais choisi : « … »

          début était autre ; un mauvais choix donne « Pas encore : », son data-retour, puis « Lis
          la correction ci-dessous. » ; s’il porte data-erreur, c’est une erreur critique, qui part
          au gabarit (voir Les retours). La correction s’affiche après le choix, pas avant.
        </li>
      </ul>
      <h3>Les démonstrations et les schémas</h3>
      <ul>
        <li>
          La démonstration cache les lignes de son tableau. Avant chaque ligne, elle pose
          data-question avec deux boutons (data-oui, data-non), puis montre la ligne avec « Juste. »
          ou « Pas tout à fait. » et data-explication. Le texte qui suit (data-apres) n’apparaît
          qu’après la dernière ligne : rien ne permet de tout montrer sans répondre.
        </li>
        <li>
          Le schéma allume ses boîtes une à une (« Allumer la première boîte », « Allumer la boîte
          suivante », « Tout allumer »), chaque lien avec la boîte qui le suit ; tout allumé, il
          affiche data-fin.
        </li>
        <li>

          fin l’interrompt, puisqu’elle a pu le souffler. Recharger la page l’interrompt aussi après
          une vérification, puisque l’aide vue ne peut plus être comptée ; avant toute vérification,
          rien n’a été montré, et il repart de zéro. Fini, passé ou interrompu, il attend le jour
          suivant : ses champs sont vides et grisés, avec la raison (« Ton schéma d’aujourd’hui a
          été interrompu : une autre étape a été affichée avant sa fin, et elle a pu le souffler.
          Refais-le un autre jour, sans quitter l’étape. », ou « … la page s’est rechargée après une
          vérification, et l’aide que tu avais vue ne peut plus être comptée. Refais-le un autre
          jour. », « Tu as passé le schéma aujourd’hui : refais-le un autre jour. », ou « Tu as fait
          le schéma aujourd’hui, … »).
        </li>
        <li>
          Le schéma de mémoire remplace chaque case et chaque lien par un champ vide, à remplir sans
          liste : la case avec son nom, le lien avec ses mots. Une case est juste si sa réponse,
          sans casse, accents, ponctuation ni articles, est l’une de data-accepte. Un lien est juste

          doit commencer un mot de la réponse. Un lien qui contient une négation (ne, n’, pas,
          jamais, aucun, rien, sans, ni, non) est faux, quels que soient ses mots.
        </li>
        <li>
          Chaque élément a son échelle, montée d’un cran par vraie tentative sur cet élément :
          data-aide1 (« Pour t’orienter : », une question), data-aide2 (« Un indice : »), data-aide3

          aucun message lu pendant le schéma ne contient la réponse d’un élément : une aide nomme
          les autres éléments par leur case (« la case 2 »), jamais par leur contenu. Un champ vide
          n’est pas une tentative (« vide. Essaie de le retrouver, l’aide vient après une tentative.

          tentative. ») ; la même réponse fausse qu’avant non plus (« la même réponse qu’avant.

          Écris d’abord ce dont tu te souviens : l’aide vient après une tentative. ».
        </li>
        <li>
          Une réponse montrée ne se recopie pas : son champ se vide et se grise, avec « C’est vu :
          je cache les réponses et je refais », qui le rouvre vide pour l’écrire de mémoire. Tant
          qu’il est grisé, l’élément reste à revoir (« Cache-la, puis réécris-la de mémoire. »).
          Réécrit faux, il remontre sa réponse, et son champ se vide et se grise de nouveau.
        </li>
        <li>

          mémoire, sans aide. ». Avec des crans, sans réponse vue : « ✓ Tes cases sont justes, avec

          pour qu’il vienne de mémoire. ». Après une réponse vue : « Tes cases sont justes, mais pas
          de mémoire : tu as vu la réponse de N éléments. Refais le schéma un autre jour, sans aide.

          Tes liens ont les mots des bonnes relations, mais des mots ne prouvent pas tout :
          compare-les avec ceux du schéma. », puis, pour chaque lien, « Lien … : tu as écrit « … » ;
          le schéma dit « … ». ».
        </li>
        <li>
          À partir de l’étape détaillée, une fois tout juste, l’outil demande « Explique maintenant
          le schéma, sans le regarder, en deux ou trois phrases : du bit jusqu’au sens. », puis «

          étaient tous à 1. Ajouter 1 fait tout repasser à 00000000. Il n’y a pas de 257e valeur. ».
        </li>
        <li>
          L’outil octet, à l’étape 5, met des bits à 1 ou à 0 (« Bit de poids 8, à 1 ») et affiche «
          Suite de bits : … Valeur : … » ; un bit à 1 y est marqué sans la lueur des lampes. À
          l’étape 3, il porte data-sans-poids : ni poids ni valeur, seulement le réglage écrit,
          comme « Réglage : 1010. ». Les paris sur le nombre de réglages et sur la valeur de 1010 ne
          s’y lisent donc pas.

        <li>
          Lectures (étape 6) montre le même octet comme un nombre, une lettre ou l’intensité du
          rouge, au choix ; réglage (étape 7) montre une couleur et ses trois octets, qui changent
          avec trois curseurs ; perception (étape 1) déroule sept scènes, avec la voix si on la
          garde. « Passer à la fin » n’y apparaît qu’une fois l’animation vue jusqu’au bout.
        </li>

      <h3>L’aisance</h3>
      <ul>
        <li>
          Chaque série tire 3 nombres de 0 à 255 au hasard, chacun dans un sens tiré au hasard, avec
          un chronomètre de 30 secondes (« Il te reste N s »). Après chaque réponse : « ✓ Juste en N
          s. », « Juste, mais en N s (limite 30 s). » ou « Faux : la réponse était … », suivi de ce
          qui a coincé. Vers le binaire : « Tes bits étaient à l’envers : le poids le plus lourd,
          128, est le chiffre de gauche. », sinon « Parcours les poids de 128 à 1 : écris 1 quand le
          poids tient dans ce qui reste. ». Vers le décimal : un nombre égal aux bits lus à l’envers
          donne « Tu as lu les poids à l’envers : le plus lourd, 128, est le chiffre de gauche. » ;
          un de plus que la valeur, sur un octet d’au moins cinq bits à 1, « Tu es parti de 256, le
          nombre de valeurs. Le maximum, tous les bits à 1, est 255 : pars de 255. » ; le nombre de
          bits à 1, « Tu as compté les bits à 1. La valeur est la somme de leurs poids. » ; sinon «

          dans l’autre (E4), le départ de 256 (E1) et les bits à 1 comptés (E5) sont des erreurs
          critiques : elles partent au gabarit, comme en pratique (voir Les retours). Quand le bilan
          est attendu, la série s’arrête sur ce retour, sans « Suivante ».

          Chaque réponse part à l’appli (aisance.resultat, juste ou non, et sa durée) ; c’est
          l’appli qui compte les 9 réussites en moins de 30 secondes sur 3 jours. En fin de série :
          « Série terminée : N sur 3. Reviens un autre jour pour que ça compte vraiment. ».
        </li>
      </ul>

                ...(sansPoids

                  : [el('span', { className: 'octet-poids', textContent: String(p) })]),
                boutons[i],
              ),
            ),
          )
          function maj() {
            const valeur = etat.reduce((s, v, i) => s + v * poids[i], 0)
            boutons.forEach((b, i) => {
              b.textContent = String(etat[i])
              b.setAttribute('aria-pressed', etat[i] ? 'true' : 'false')
              // Avec les poids, la fiche dit bit, et plus lampe : un bit est à 1 ou à 0.
              b.setAttribute(
                'aria-label',
                sansPoids
                  ? 'Lampe ' + (i + 1) + ', ' + (etat[i] ? 'allumée' : 'éteinte')
                  : 'Bit de poids ' + poids[i] + ', à ' + etat[i],
              )
            })
            if (sansPoids) {
              sortie.textContent = 'Réglage : ' + etat.join('') + '.'
              return
            }
            let texte = 'Suite de bits : ' + etat.join('') + '. Valeur : ' + valeur + '.'
            if (cible !== null) {
              if (valeur === cible) texte += ' C’est exactement ' + cible + '.'
              else if (valeur < cible)
                texte += ' Objectif ' + cible + ' : il manque ' + (cible - valeur) + '.'
              else texte += ' Objectif ' + cible + ' : tu dépasses de ' + (valeur - cible) + '.'
            }
            sortie.textContent = texte
            sortie.dataset.juste = cible !== null && valeur === cible ? 'oui' : 'non'
          }
          n.append(rangee, sortie)
          maj()
        }

        /**
         * La photo du début, en 24 × 16 pixels : un ciel, un soleil orange, une colline. Ses couleurs
         * sont aussi ses octets, que l'éditeur de texte relit comme des lettres.
         */
        const LARGEUR_PHOTO = 24
        const HAUTEUR_PHOTO = 16
        const PIXEL_CHOISI = { x: 17, y: 4 }
        function couleurDuPixel(x, y) {
          const soleil = Math.hypot(x - 17, y - 4)
          const colline = y > 10 + Math.round(2 * Math.sin(x / 3.5))
          if (colline) return [40 + ((x * 7 + y * 3) % 30), 120 + ((x * 5) % 40), 60]
          if (soleil < 1.5) return [250, 170, 60]
          if (soleil < 3) return [230, 120, 30]
          return [110 + y * 6, 160 + y * 3, 230 - y * 4]
        }
        const OCTETS_PHOTO = (() => {
          const octets = []
          for (let y = 0; y < HAUTEUR_PHOTO; y += 1)
            for (let x = 0; x < LARGEUR_PHOTO; x += 1) octets.push(...couleurDuPixel(x, y))
          return octets
        })()
        /** Les octets lus comme du texte, un caractère par octet : des signes sans suite. */
        const CHARABIA = OCTETS_PHOTO.slice(0, 96)
          .map((o) => (o < 32 || (o > 126 && o < 160) ? '·' : String.fromCharCode(o)))
          .join('')

        function dessinerPhoto(toile, zoom) {
          const contexte = toile.getContext('2d')
          if (!contexte) return
          const echelle = window.devicePixelRatio || 1
          const largeur = toile.clientWidth || 320
          const hauteur = Math.round((largeur * HAUTEUR_PHOTO) / LARGEUR_PHOTO)
          toile.width = Math.round(largeur * echelle)
          toile.height = Math.round(hauteur * echelle)
          toile.style.height = hauteur + 'px'
          const petite = document.createElement('canvas')
          petite.width = LARGEUR_PHOTO
          petite.height = HAUTEUR_PHOTO
          const c = petite.getContext('2d')
          if (!c) return
          const image = c.createImageData(LARGEUR_PHOTO, HAUTEUR_PHOTO)
          for (let i = 0; i < LARGEUR_PHOTO * HAUTEUR_PHOTO; i += 1) {
            image.data.set([...OCTETS_PHOTO.slice(i * 3, i * 3 + 3), 255], i * 4)
          }
          c.putImageData(image, 0, 0)
          contexte.imageSmoothingEnabled = !zoom
          if (!zoom) {
            contexte.drawImage(petite, 0, 0, toile.width, toile.height)
            return
          }
          // De près : 8 pixels sur 5 autour du pixel choisi, en carrés, le choisi cerné.
          const x0 = PIXEL_CHOISI.x - 4
          const y0 = PIXEL_CHOISI.y - 2
          const cote = toile.width / 8
          contexte.drawImage(petite, x0, y0, 8, 5, 0, 0, toile.width, cote * 5)
          contexte.strokeStyle = 'rgba(0, 0, 0, 0.35)'
          contexte.lineWidth = Math.max(1, echelle)
          for (let i = 1; i < 8; i += 1) {
            contexte.beginPath()
            contexte.moveTo(i * cote, 0)
            contexte.lineTo(i * cote, cote * 5)
            contexte.stroke()
          }
          for (let j = 1; j < 5; j += 1) {
            contexte.beginPath()
            contexte.moveTo(0, j * cote)
            contexte.lineTo(toile.width, j * cote)
            contexte.stroke()
          }
          contexte.strokeStyle = '#ffffff'
          contexte.lineWidth = 3 * echelle
          contexte.strokeRect(4 * cote, 2 * cote, cote, cote)
        }

        /** Une rangée de huit lampes, allumées selon les bits d'un octet. */
        const rangeeDeLampes = (octetValeur, libelle) =>
          el(
            'div',
            { className: 'lampes-ligne' },
            ...(libelle ? [el('span', { className: 'lampes-nom', textContent: libelle })] : []),
            el(
              'span',
              { className: 'lampes' },
              ...Array.from(huitChiffres(octetValeur), (b) =>
                el('span', { className: 'lampe petite', textContent: b }),
              ),
            ),
          )
        function allumer(rangee) {
          for (const lampe of rangee.querySelectorAll('.lampe'))
            lampe.dataset.on = lampe.textContent === '1' ? '1' : '0'
          return rangee
        }

        /**
         * La perception : une photo regardée de plus en plus près, jusqu'aux lampes, puis relue comme
         * du texte. Chaque scène a sa légende (les `li` du template, lisibles sans l'animation) ; la
         * voix les lit si on la garde. Rien à produire : on regarde jusqu'au bout.
         */
        function perception(n) {
          const legendes = Array.from(n.querySelectorAll('ol.scenes > li'))
          const [r, v, b] = couleurDuPixel(PIXEL_CHOISI.x, PIXEL_CHOISI.y)
          const scene = el('div', { className: 'scene' })
          scene.setAttribute('role', 'img')
          vivant(scene)
          const toile = el('canvas', { className: 'photo' })
          const editeur = (texte) =>
            el(
              'div',
              { className: 'editeur' },
              el('span', {
                className: 'editeur-titre',
                textContent: 'photo.bmp, dans un éditeur de texte',
              }),
              el('code', { textContent: texte }),
            )
          const scenes = [
            () => [toile],
            () => [toile],
            () => [
              el(
                'div',
                { className: 'pixel-lumieres' },
                (() => {
                  const carre = el('span', { className: 'pixel-grand' })
                  carre.style.background = 'rgb(' + [r, v, b].join(', ') + ')'
                  return carre
                })(),
                ...[
                  ['rouge', r, '#e5484d'],
                  ['vert', v, '#30a46c'],
                  ['bleu', b, '#3e63dd'],
                ].map(([nom, force, teinte]) =>
                  el(
                    'span',
                    { className: 'lumiere' },
                    (() => {
                      const barre = el('span', { className: 'lumiere-barre' })
                      barre.style.height = Math.round((force / 255) * 100) + '%'
                      barre.style.background = teinte
                      return barre
                    })(),
                    el('span', { className: 'lumiere-nom', textContent: nom }),
                  ),
                ),
              ),
            ],
            () => [
              allumer(rangeeDeLampes(r, 'rouge')),
              allumer(rangeeDeLampes(v, 'vert')),
              allumer(rangeeDeLampes(b, 'bleu')),
            ],
            () => [
              el(
                'div',
                { className: 'fichier' },
                ...OCTETS_PHOTO.slice(0, 6).map((o) => allumer(rangeeDeLampes(o, ''))),
                el('span', {
                  className: 'discret',
                  textContent: 'et ainsi de suite, octet après octet',
                }),
              ),
            ],
            () => [editeur(CHARABIA)],
            () => [
              el(
                'div',
                { className: 'les-deux' },
                el('div', { className: 'les-deux-photo' }, toile),
                editeur(CHARABIA.slice(0, 36)),
              ),
            ],
          ]
          const DESCRIPTIONS = [
            'Une photo : un ciel, un soleil orange, une colline verte.',
            'La photo de près : une grille de carrés de couleur ; un carré orange est cerné.',
            'Le carré orange et ses trois lumières : beaucoup de rouge, un peu de vert, très peu de bleu.',
            'Trois rangées de huit lampes, allumées ou éteintes : le rouge, le vert et le bleu du carré.',
            'Des rangées de huit lampes, les unes après les autres : le fichier de la photo.',
            'Le même fichier dans un éditeur de texte : des lettres et des signes sans suite.',
            'Côte à côte : la photo, et le même fichier lu comme du texte.',
          ]
          let courant = -1
          let minuteur = 0
          let parole = null
          const voix = el('input', { type: 'checkbox', id: identifiant('voix') })
          voix.checked = typeof window.speechSynthesis !== 'undefined'
          voix.disabled = !voix.checked
          const lancer = el('button', {
            type: 'button',
            className: 'bouton',
            textContent: 'Lancer',
          })
          const passer = el('button', {
            type: 'button',
            className: 'bouton secondaire',
            textContent: 'Passer à la fin',
          })
          const fin = el('p', { className: 'discret' })
          vivant(fin)
          // Regardée une fois jusqu'au bout, elle peut se passer : avant, « Passer à la fin » n'est pas là.
          const dejaVue = () => traces['perception:vue'] === true
          passer.disabled = true
          passer.hidden = !dejaVue()
          const arreter = () => {
            clearTimeout(minuteur)
            if (parole) window.speechSynthesis?.cancel()
            parole = null
          }
          function montrer(k) {
            courant = k
            scene.replaceChildren(...scenes[k]())
            scene.setAttribute('aria-label', DESCRIPTIONS[k])
            scene.dataset.scene = String(k)
            if (k <= 1 || k === 6) requestAnimationFrame(() => dessinerPhoto(toile, k === 1))
            legendes.forEach((li, j) => {
              li.hidden = j > k
              if (j === k) li.setAttribute('aria-current', 'step')
              else li.removeAttribute('aria-current')
            })
          }
          function lire(texte, ensuite) {
            const synthese = window.speechSynthesis
            if (!voix.checked || !synthese) return void ensuite()
            const choisie = synthese
              .getVoices()
              .filter((x) => x.lang.toLowerCase().startsWith('fr'))
              .sort(
                (a, c) =>
                  Number(/charline|denise|natural|neural|google/i.test(c.name)) -
                  Number(/charline|denise|natural|neural|google/i.test(a.name)),
              )[0]
            parole = new SpeechSynthesisUtterance(texte)
            parole.lang = choisie?.lang ?? 'fr-FR'
            if (choisie) parole.voice = choisie
            parole.onend = ensuite
            parole.onerror = ensuite
            synthese.speak(parole)
          }
          function jouer(k) {
            if (!n.isConnected) return arreter()
            montrer(k)
            const texte = legendes[k]?.textContent.trim() ?? ''
            const duree = Math.max(4000, texte.length * 60)
            let lu = !voix.checked
            let ecoule = false
            const suite = () => {
              if (!lu || !ecoule || !n.isConnected) return
              if (k + 1 < scenes.length) jouer(k + 1)
              else terminer(true)
            }
            lire(texte, () => {
              lu = true
              suite()
            })
            minuteur = setTimeout(() => {
              ecoule = true
              suite()
            }, duree)
          }
          /** La fin de l'animation ; `entiere` : regardée jusqu'au bout, pas passée. */
          function terminer(entiere) {
            arreter()
            montrer(scenes.length - 1)
            legendes.forEach((li) => (li.hidden = false))
            lancer.textContent = 'Revoir'
            lancer.disabled = false
            if (entiere && !dejaVue()) {
              tracer('perception:vue', true)
              document.dispatchEvent(new CustomEvent('b01:perception-vue'))
            }
            passer.disabled = true
            passer.hidden = !dejaVue()
            fin.textContent = 'Tu as tout vu. L’écran suivant te demande ton pari.'
          }
          lancer.addEventListener('click', () => {
            arreter()
            fin.textContent = ''
            lancer.disabled = true
            passer.disabled = false
            jouer(0)
          })
          passer.addEventListener('click', () => terminer(false))
          legendes.forEach((li, j) => (li.hidden = j > 0))
          n.prepend(
            scene,
            el(
              'div',
              { className: 'actions' },
              lancer,
              passer,
              el('label', { className: 'voix', htmlFor: voix.id }, voix, ' Avec la voix'),
            ),
            fin,
          )
          montrer(0)
          legendes[0]?.removeAttribute('aria-current')
        }

        /** Un pari entre quelques réponses : rien n'est noté, le choix est gardé pour plus tard. */
        function pari(n) {
          const cle = n.dataset.cle ?? 'pari'
          const options = Array.from(n.querySelectorAll('li[data-option]'))
          const apres = el('p', { className: 'retour' })
          vivant(apres)
          const groupe = el('div', { className: 'options', role: 'group' })
          const boutons = options.map((li) => {
            const bouton = el('button', {
              type: 'button',
              className: 'bouton secondaire option',
              textContent: li.textContent.trim(),
            })
            bouton.dataset.option = li.dataset.option
            bouton.addEventListener('click', () => {
              noterPari(cle, li.dataset.option)
              maj()
            })
            return bouton
          })
          const maj = () => {
            const choisi = paris[cle]
            boutons.forEach((b) =>
              b.setAttribute('aria-pressed', String(b.dataset.option === choisi)),
            )
            apres.textContent =
              choisi === undefined
                ? ''
                : (n.dataset.apres ?? 'C’est noté. Tu reprendras ce pari à la fin du cours.')
          }
          groupe.append(...boutons)
          n.querySelector('ul')?.replaceWith(groupe)
          n.append(apres)
          maj()
          // Le pari finit la perception (règle C02) : tant que l'animation de l'étape n'a pas été vue
          // une fois jusqu'au bout, ses options restent cachées.
          const perception = document.querySelector('#contenu [data-widget="perception"]')
          if (perception && traces['perception:vue'] !== true && paris[cle] === undefined) {
            const attente = el('p', {
              className: 'discret',
              textContent:
                'Regarde d’abord l’animation de l’écran précédent jusqu’au bout : le pari vient après.',
            })
            groupe.hidden = true
            groupe.before(attente)
            document.addEventListener(
              'b01:perception-vue',
              () => {
                attente.remove()
                groupe.hidden = false
              },
              { once: true },
            )
          }
        }

        /**
         * Une série de paris, une question à la fois : chaque réponse est gardée, sans être corrigée
         * (l'explication y revient). Chaque question est un enfant `[data-cle]` du template.
         */
        function serie(n) {
          const questions = Array.from(n.querySelectorAll(':scope > [data-cle]'))
          const recap = el('div', { className: 'recap' })
          vivant(recap)
          const montrer = () => {
            const k = questions.findIndex((q) => paris[q.dataset.cle] === undefined)
            questions.forEach((q, j) => (q.hidden = j !== k))
            if (k >= 0) {
              recap.replaceChildren()
              questions[k].querySelector('input')?.focus({ preventScroll: true })
              return
            }
            recap.replaceChildren(
              el('p', { textContent: n.dataset.fin ?? 'Tes paris sont notés.' }),
              el(
                'ul',
                {},
                ...questions.map((q) =>
                  el('li', {
                    textContent:
                      q.querySelector('.pari-texte')?.textContent.trim() +
                      ' Ton pari : ' +
