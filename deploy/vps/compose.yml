name: janus

x-journaux: &journaux
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  web:
    image: janus-web:${JANUS_SHA:?JANUS_SHA requis}
    restart: unless-stopped
    ports:
      - '127.0.0.1:3300:8080'
    volumes:
      - fiches:/fiches:ro
    environment:
      # L'origine du suivi d'erreurs, autorisee par la politique de securite du front (vide : aucune).
      SENTRY_ORIGINE: ${SENTRY_ORIGINE:-}
    depends_on:
      api:
        condition: service_healthy
    networks: [janus]
    logging: *journaux
  api:
    image: janus-api:${JANUS_SHA:?JANUS_SHA requis}
    init: true
    restart: unless-stopped
    # L'API s'arrete en 9 s au plus (demarrer.ts) : Docker la laisse finir avant de la tuer.
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      SENTRY_DSN: ${SENTRY_DSN:-}
      DATABASE_URL: postgres://janus_app:${JANUS_APP_MOT_DE_PASSE:?}@postgres:5432/janus
      DATABASE_URL_PROPRIETAIRE: postgres://janus:${POSTGRES_PASSWORD:?}@postgres:5432/janus
      ORIGINE_APPLI: https://janus.akiksystems.fr
      FICHES_URL: https://fiches.janus.akiksystems.fr
      FICHES_DIR: /fiches
      COOKIE_SECURE: 'true'
      CORRECTEUR: ${CORRECTEUR:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Cle DeepSeek requise}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?}
      VAPID_SUJET: ${VAPID_SUJET:?}
    volumes:
      - fiches:/fiches
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/sante').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [janus]
    logging: *journaux
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: janus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: janus
    volumes:
      - donnees:/var/lib/postgresql/data
    healthcheck:
      # Par TCP, comme l'API : au premier demarrage, le serveur temporaire d'initialisation de l'image
      # n'ecoute que sur sa socket et repond deja a pg_isready, jusqu'a 0,4 s avant le vrai serveur.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U janus -d janus']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [janus]
    logging: *journaux

volumes:
  donnees:
  fiches:
networks:
  janus:
