name: janus

x-journaux: &journaux
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  web:
    image: janus-web:${JANUS_SHA:?JANUS_SHA requis}
    restart: unless-stopped
    ports:
      - '127.0.0.1:3300:8080'
    volumes:
      - /etc/janus/Caddyfile:/etc/caddy/Caddyfile:ro
      - fiches:/fiches:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [janus]
    logging: *journaux
  api:
    image: janus-api:${JANUS_SHA:?JANUS_SHA requis}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://janus_app:${JANUS_APP_MOT_DE_PASSE:?}@postgres:5432/janus
      DATABASE_URL_PROPRIETAIRE: postgres://janus:${POSTGRES_PASSWORD:?}@postgres:5432/janus
      ORIGINE_APPLI: https://janus.akiksystems.fr
      FICHES_URL: https://fiches.janus.akiksystems.fr
      FICHES_DIR: /fiches
      COOKIE_SECURE: 'true'
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Cle DeepSeek requise}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?}
      VAPID_SUJET: ${VAPID_SUJET:?}
    volumes:
      - fiches:/fiches
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/sante').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [janus]
    logging: *journaux
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: janus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: janus
    volumes:
      - donnees:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U janus -d janus']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [janus]
    logging: *journaux

volumes:
  donnees:
  fiches:
networks:
  janus:
