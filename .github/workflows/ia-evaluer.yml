name: Évaluer la correction IA

# Lancé à la main seulement : jamais à chaque commit, il appelle le vrai service et coûte de l'argent.
on:
  workflow_dispatch:
    inputs:
      jeu:
        description: Le jeu de test à passer
        default: prompts/correction/jeu-de-test/exemple.json
        required: true

permissions:
  contents: read

jobs:
  evaluer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ia:evaluer "$JEU"
        env:
          JEU: ${{ inputs.jeu }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # Le rapport s'affiche dans le résumé de l'exécution.
      - run: cat prompts/correction/rapports/*.md >> "$GITHUB_STEP_SUMMARY"
