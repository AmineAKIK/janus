name: Évaluer la correction IA

# Lancé à la main seulement : jamais à chaque commit, il appelle le vrai service et coûte de l'argent.
on:
  workflow_dispatch:
    inputs:
      jeu:
        description: Le jeu de test à passer
        default: prompts/correction/jeu-de-test/exemple.json
        required: true
      correcteur:
        description: Le fournisseur à évaluer
        type: choice
        options: [deepseek, claude]
        default: claude
        required: true

permissions:
  contents: read

jobs:
  evaluer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ia:evaluer "$JEU"
        env:
          JEU: ${{ inputs.jeu }}
          CORRECTEUR: ${{ inputs.correcteur }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Le rapport s'affiche dans le résumé de l'exécution.
      - run: cat prompts/correction/rapports/*.md >> "$GITHUB_STEP_SUMMARY"
      # Ses lignes de synthèse, les cas refusés et les cas en désaccord remontent aussi en annotation du job, et les
      # messages rendus pour les cas en désaccord dans une seconde : l'API des check-runs les rend lisibles sans ouvrir le résumé.
      - run: |
          set -- prompts/correction/rapports/*.md
          synthese=$(sed '/^## Messages$/q' "$1" | grep -E '^- |refusé \(|\| [1-9] \|$' | sed 's/%/%25/g' | sed -z 's/\n/%0A/g')
          echo "::notice title=Évaluation::$synthese"
          messages=$(awk '/^## Messages$/ { dedans = 1; next } dedans && /^### / { garde = ($0 !~ /, écart 0$/) } dedans && garde' "$1" | sed 's/%/%25/g' | sed -z 's/\n/%0A/g')
          echo "::notice title=Messages des cas en désaccord::$messages"
