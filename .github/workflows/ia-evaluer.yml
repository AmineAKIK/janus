name: Évaluer la correction IA

# Lancé à la main seulement : jamais à chaque commit, il appelle le vrai service et coûte de l'argent.
on:
  workflow_dispatch:
    inputs:
      jeu:
        description: Le jeu de test à passer
        default: prompts/correction/jeu-de-test/exemple.json
        required: true
      fiche:
        description: "Épreuve 1 d'une fiche, au lieu du jeu : « <formation> <bloc> <reponses.md> » (vide pour le jeu)"
        default: ''
        required: false
      correcteur:
        description: Le fournisseur à évaluer
        type: choice
        options: [deepseek, claude]
        default: claude
        required: true

permissions:
  contents: read

jobs:
  evaluer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Le jeu, ou l'épreuve 1 d'une fiche : ses trois mots (formation, bloc, réponses) deviennent trois arguments.
      - run: |
          if [ -n "$FICHE" ]; then
            read -r formation bloc reponses <<< "$FICHE"
            pnpm ia:evaluer --fiche "$formation" "$bloc" "$reponses"
          else
            pnpm ia:evaluer "$JEU"
          fi
        env:
          JEU: ${{ inputs.jeu }}
          FICHE: ${{ inputs.fiche }}
          CORRECTEUR: ${{ inputs.correcteur }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Le rapport s'affiche dans le résumé de l'exécution.
      # Même quand une réponse de l'épreuve ne sort pas Solide (la commande échoue) : le rapport dit laquelle.
      - if: always()
        run: cat prompts/correction/rapports/*.md >> "$GITHUB_STEP_SUMMARY"
      # Ses lignes de synthèse, les cas refusés et les cas en désaccord remontent aussi en annotation du job, et les
      # messages rendus pour les cas en désaccord dans les suivantes : l'API des check-runs les rend lisibles sans ouvrir
      # le résumé. Une annotation est coupée au-delà de 4 000 caractères environ : les messages sont groupés par paquets
      # de 3 500 caractères au plus, un paquet par annotation (dix annotations au plus par étape).
      - if: always()
        run: |
          set -- prompts/correction/rapports/*.md
          echapper() { sed 's/%/%25/g' | sed -z 's/\n/%0A/g'; }
          synthese=$(sed '/^## Messages$/q' "$1" | grep -E '^- |refusé \(|\| [1-9] \|$' | echapper)
          echo "::notice title=Évaluation::$synthese"
          paquet=""
          numero=1
          publier() {
            [ -n "$paquet" ] || return 0
            echo "::notice title=Messages des cas en désaccord ($numero)::$(printf '%s' "$paquet" | echapper)"
            numero=$((numero + 1))
            paquet=""
          }
          # Un cas par enregistrement (séparés par un caractère nul), les cas à écart 0 écartés.
          while IFS= read -r -d '' cas || [ -n "$cas" ]; do
            if [ -n "$paquet" ] && [ $(( ${#paquet} + ${#cas} )) -gt 3500 ]; then publier; fi
            paquet="$paquet$cas"
          done < <(awk '/^## Messages$/ { dedans = 1; next } dedans && /^### / { if (garde) printf "%c", 0; garde = ($0 !~ /, écart 0$/) } dedans && garde { print }' "$1"; printf '\0')
          publier
