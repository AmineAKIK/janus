name: Deployer VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: janus-production
  cancel-in-progress: false

jobs:
  deployer:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deployer le SHA valide
        env:
          CLE: ${{ secrets.VPS_CLE_SSH }}
          HOTE: ${{ vars.VPS_HOTE }}
          PORT: ${{ vars.VPS_PORT }}
          UTILISATEUR: ${{ vars.VPS_UTILISATEUR }}
          HOTE_CONNU: ${{ vars.VPS_KNOWN_HOSTS }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]]
          [[ -n "$CLE" && -n "$HOTE" && -n "$UTILISATEUR" && -n "$HOTE_CONNU" ]]
          umask 077
          dossier=$(mktemp -d)
          trap 'rm -f "$dossier/cle" "$dossier/known_hosts"; rmdir "$dossier"' EXIT
          printf '%s\n' "$CLE" > "$dossier/cle"
          printf '%s\n' "$HOTE_CONNU" > "$dossier/known_hosts"
          ssh -i "$dossier/cle" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dossier/known_hosts" \
            -o ConnectTimeout=15 "$UTILISATEUR@$HOTE" "deploy $SHA"
