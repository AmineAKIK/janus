name: Pages

on:
  push:
    branches: [main]

# Un seul déploiement à la fois sur gh-pages, sans annuler celui en cours.
concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Construire l'appli
        run: |
          VITE_COMMIT="$(git rev-parse --short=7 HEAD)"
          export VITE_COMMIT
          pnpm --filter @janus/web build
        env:
          VITE_BASE: /janus/
      # `clean-exclude` garde les aperçus des PR ouvertes.
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: apps/web/dist
          clean-exclude: pr-preview/
          commit-message: 'chore: publication ${{ github.sha }}'
