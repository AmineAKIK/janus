name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lancé par aides-pr.yml après un commit poussé avec le jeton du workflow,
  # qui ne déclenche pas la CI tout seul.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    # L'API se prouve contre un vrai PostgreSQL, comme en production.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: janus
          POSTGRES_PASSWORD: janus
          POSTGRES_DB: janus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U janus -d janus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
        env:
          DATABASE_URL: postgres://janus:janus@localhost:5432/janus_test
      # L'API réelle, sur PostgreSQL et avec le faux correcteur, rejoue la suite de contrat écrite pour
      # la démo, puis les trois parcours critiques dans un navigateur (PR-089).
      - name: Contre l'API réelle (suite de contrat et parcours)
        env:
          DATABASE_URL: postgres://janus:janus@localhost:5432/janus_banc
          DATABASE_URL_PROPRIETAIRE: postgres://janus:janus@localhost:5432/janus_banc
          JANUS_BANC_URL: http://127.0.0.1:3100
        run: |
          psql postgres://janus:janus@localhost:5432/janus_test -c 'CREATE DATABASE janus_banc'
          pnpm --filter @janus/pont build
          pnpm --filter @janus/api migrer
          pnpm --filter @janus/api banc > banc.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fs "$JANUS_BANC_URL/api/sante" > /dev/null && break
            sleep 1
          done
          curl -fs "$JANUS_BANC_URL/api/sante" || { cat banc.log; exit 1; }
          pnpm --filter @janus/web exec vitest run src/api/contratHttp.test.ts
          pnpm --filter @janus/web exec playwright install --with-deps chromium
          pnpm --filter @janus/web e2e:api
      - run: pnpm build
      # GitHub Pages reste en démo (build ci-dessus). Le VPS est en http, avec des chemins propres.
      - name: Build du VPS (http, historique par chemins)
        run: pnpm --filter @janus/web exec vite build --outDir dist-vps
        env:
          VITE_BASE: /
          VITE_TRANSPORT: http
          VITE_HISTORIQUE: chemins
          VITE_API: /api

  # Tout l'hébergement démarre sur une machine vide avec un `.env` de test (PR-090).
  hebergement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Démarre les services (compose)
        working-directory: infra
        run: |
          {
            echo DOMAINE=localhost
            echo POSTGRES_PASSWORD=essai0postgres
            echo JANUS_APP_MOT_DE_PASSE=essai0application
            echo DEEPSEEK_API_KEY=essai
            echo VAPID_PUBLIC_KEY=essai
            echo VAPID_PRIVATE_KEY=essai
            echo VAPID_SUJET=mailto:essai@exemple.fr
            echo RESTIC_REPOSITORY=/depot-essai
            echo RESTIC_PASSWORD=essai0restic
          } > .env
          docker compose up -d --build --wait
      - name: /api/sante répond 200 par Caddy
        run: curl -fsk https://app.localhost/api/sante
      - name: Sauvegarde puis restauration dans une base vide
        working-directory: infra
        run: |
          docker compose exec -T sauvegarde sauvegarder.sh
          docker compose exec -T sauvegarde essai-restauration.sh
      - name: Journaux en cas d'échec
        if: failure()
        working-directory: infra
        run: docker compose logs --no-color

  # Les workflows eux-mêmes sont validés (PR-091).
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/depot" -w /depot rhysd/actionlint:1.7.7 -color .github/workflows/ci.yml .github/workflows/deployer.yml
