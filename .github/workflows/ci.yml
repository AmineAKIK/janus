name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lancé par aides-pr.yml après un commit poussé avec le jeton du workflow,
  # qui ne déclenche pas la CI tout seul.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    # L'API se prouve contre un vrai PostgreSQL, comme en production.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: janus
          POSTGRES_PASSWORD: janus
          POSTGRES_DB: janus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U janus -d janus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
        env:
          DATABASE_URL: postgres://janus:janus@localhost:5432/janus_test
      # La suite de contrat écrite pour la démo, rejouée contre l'API réelle sur PostgreSQL (PR-089).
      - name: Suite de contrat contre l'API réelle
        env:
          DATABASE_URL: postgres://janus:janus@localhost:5432/janus_banc
          DATABASE_URL_PROPRIETAIRE: postgres://janus:janus@localhost:5432/janus_banc
          JANUS_BANC_URL: http://127.0.0.1:3100
        run: |
          psql postgres://janus:janus@localhost:5432/janus_test -c 'CREATE DATABASE janus_banc'
          pnpm --filter @janus/api migrer
          pnpm --filter @janus/api banc > banc.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs "$JANUS_BANC_URL/api/sante" > /dev/null && break
            sleep 1
          done
          curl -fs "$JANUS_BANC_URL/api/sante" || { cat banc.log; exit 1; }
          pnpm --filter @janus/web exec vitest run src/api/contratHttp.test.ts
      - run: pnpm build
