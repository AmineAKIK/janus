name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lancé par aides-pr.yml après un commit poussé avec le jeton du workflow,
  # qui ne déclenche pas la CI tout seul.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Les trois contrôles de l'ancien job unique tournent en parallèle : ils ne dépendent pas les uns
  # des autres et ne partagent aucun état. Le job `verifier` plus bas les rassemble sous l'ancien nom.
  statique:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Deux commits : le parent permet de comparer les fiches à celles de la branche de base.
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Une fiche refusée au démarrage arrêterait l'API en production : on la refuse avant la fusion.
      # Le pont embarqué dans chaque fiche est comparé au pont construit, d'où la construction.
      - run: pnpm --filter @janus/pont build
      - run: pnpm fiches:verifier --base HEAD^1

  tests:
    runs-on: ubuntu-latest
    # L'API se prouve contre un vrai PostgreSQL, comme en production.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: janus
          POSTGRES_PASSWORD: janus
          POSTGRES_DB: janus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U janus -d janus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Sans préfixe de paquet devant chaque ligne : les annotations « ::error » que Vitest émet sous
      # GitHub Actions (test en échec, fichier, message) sont alors lues par le job, donc lisibles
      # depuis l'API des check-runs sans ouvrir le journal.
      - run: pnpm -r --if-present --reporter=append-only --reporter-hide-prefix test
        env:
          DATABASE_URL: postgres://janus:janus@localhost:5432/janus_test

  parcours:
    runs-on: ubuntu-latest
    # L'API se prouve contre un vrai PostgreSQL, comme en production.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: janus
          POSTGRES_PASSWORD: janus
          POSTGRES_DB: janus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U janus -d janus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # L'API réelle, sur PostgreSQL et avec le faux correcteur, rejoue la suite de contrat écrite pour
      # la démo, puis les trois parcours critiques dans un navigateur (PR-089).
      - name: Contre l'API réelle (suite de contrat et parcours)
        env:
          DATABASE_URL: postgres://janus:janus@localhost:5432/janus_banc
          DATABASE_URL_PROPRIETAIRE: postgres://janus:janus@localhost:5432/janus_banc
          JANUS_BANC_URL: http://127.0.0.1:3100
        run: |
          psql postgres://janus:janus@localhost:5432/janus_test -c 'CREATE DATABASE janus_banc'
          pnpm --filter @janus/pont build
          pnpm --filter @janus/api migrer
          pnpm --filter @janus/api banc > banc.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fs "$JANUS_BANC_URL/api/sante" > /dev/null && break
            sleep 1
          done
          curl -fs "$JANUS_BANC_URL/api/sante" || { cat banc.log; exit 1; }
          pnpm --filter @janus/web exec vitest run src/api/contratHttp.test.ts
          pnpm --filter @janus/web exec playwright install --with-deps chromium
          pnpm --filter @janus/web e2e:api
      # Un parcours rouge garde sa trace : console de l'appli, texte de la fiche, journal du banc.
      - if: failure()
        run: |
          cp banc.log apps/web/captures/traces-api/ 2>/dev/null || true
          # La console de l'appli et le texte de la fiche, lisibles dans le journal du job.
          for diagnostic in apps/web/captures/traces-api/*/diagnostic.txt; do
            [ -f "$diagnostic" ] || continue
            echo "::group::$diagnostic"
            head -c 20000 "$diagnostic"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: traces-parcours
          path: apps/web/captures/traces-api/
          if-no-files-found: ignore
      - run: pnpm build
      # GitHub Pages reste en démo (build ci-dessus). Le VPS est en http, avec des chemins propres.
      - name: Build du VPS (http, historique par chemins)
        run: pnpm --filter @janus/web exec vite build --outDir dist-vps
        env:
          VITE_BASE: /
          VITE_TRANSPORT: http
          VITE_HISTORIQUE: chemins
          VITE_API: /api
      # Le paquet de production ne porte ni la démo, ni son mot de passe.
      - name: Le build du VPS ne contient pas la démo
        run: |
          if grep -rlE "demo-janus|graine-B01" apps/web/dist-vps; then
            echo "Le code de démo est dans le build de production." >&2
            exit 1
          fi

  # Le point de passage unique : son nom, `verifier`, est celui qu'une protection de branche attend.
  # Il échoue si l'un des trois jobs échoue, est annulé ou ne s'est pas exécuté.
  verifier:
    runs-on: ubuntu-latest
    needs: [statique, tests, parcours]
    if: ${{ always() }}
    steps:
      - name: Les trois contrôles sont passés
        env:
          RESULTATS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats : $RESULTATS"
          for resultat in $RESULTATS; do
            [ "$resultat" = success ] || exit 1
          done

  # L'hébergement du VPS, tel qu'il tourne : les mêmes fichiers et scripts, sur une machine vide
  # (démarrage, en-têtes, sauvegarde, rétention, restauration).
  hebergement:
    runs-on: ubuntu-latest
    env:
      SHA: '0000000000000000000000000000000000000001'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck des scripts du VPS
        run: shellcheck deploy/vps/*.sh
      - name: Essai de deployer.sh (déploiement, retour arrière, migration, refus)
        run: sudo bash deploy/vps/essai-deployer.sh
      - name: Construit les images
        run: |
          docker build -f apps/api/Dockerfile -t "janus-api:$SHA" .
          docker build -f infra/caddy/Dockerfile -t "janus-web:$SHA" .
      - name: La configuration de Caddy est valide
        run: docker run --rm --entrypoint caddy "janus-web:$SHA" validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Essai de l'hébergement (démarrage, en-têtes, sauvegarde, restauration)
        run: sudo env "PATH=$PATH" bash deploy/vps/essai-hebergement.sh "$SHA"
      - name: Journaux en cas d'échec
        if: failure()
        run: sudo env "JANUS_SHA=$JANUS_SHA" docker compose -p janus -f /etc/janus/compose.yml --env-file /etc/janus/janus.env logs --no-color --timestamps
        env:
          JANUS_SHA: '0000000000000000000000000000000000000001'

  # Les workflows eux-mêmes sont validés (PR-091).
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          # Tous les workflows : syntaxe et expressions. Les deux qui déploient : aussi shellcheck.
          docker run --rm -v "$PWD:/depot" -w /depot rhysd/actionlint:1.7.7 -color -shellcheck= .github/workflows/*.yml
          docker run --rm -v "$PWD:/depot" -w /depot rhysd/actionlint:1.7.7 -color .github/workflows/ci.yml .github/workflows/deployer.yml
