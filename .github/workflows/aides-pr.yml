name: Aides pour PR

# Pour un agent qui ne peut pas lancer de commande : une étiquette sur la PR
# met à jour le lockfile ou le formatage et pousse le résultat sur la branche.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: aides-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  DEPOT: ${{ github.repository }}
  BRANCHE: ${{ github.event.pull_request.head.ref }}
  NUMERO: ${{ github.event.pull_request.number }}

jobs:
  maj-lockfile:
    if: github.event.label.name == 'maj-lockfile' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Aucun paquet installé, aucun script lancé : seul le lockfile est recalculé.
      - run: pnpm install --lockfile-only --ignore-scripts
      - name: Pousser le lockfile s'il a changé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain pnpm-lock.yaml)" ]; then
            gh pr comment "$NUMERO" --repo "$DEPOT" --body 'Aides PR : `pnpm-lock.yaml` est déjà à jour, rien n’a été poussé.'
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: mise à jour du lockfile"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${DEPOT}.git" "HEAD:${BRANCHE}"
            gh workflow run ci.yml --repo "$DEPOT" --ref "$BRANCHE"
            gh pr comment "$NUMERO" --repo "$DEPOT" --body 'Aides PR : `pnpm-lock.yaml` mis à jour et poussé (`chore: mise à jour du lockfile`). La CI est relancée.'
          fi
      - name: Retirer l'étiquette
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "$NUMERO" --remove-label maj-lockfile --repo "$DEPOT"

  corriger-format:
    if: github.event.label.name == 'corriger-format' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format
      # Le lint peut échouer sur des erreurs non corrigeables : la CI le dira.
      - run: pnpm lint --fix
        continue-on-error: true
      - name: Pousser le formatage s'il a changé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            gh pr comment "$NUMERO" --repo "$DEPOT" --body 'Aides PR : rien à reformater, rien n’a été poussé.'
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: formatage automatique"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${DEPOT}.git" "HEAD:${BRANCHE}"
            gh workflow run ci.yml --repo "$DEPOT" --ref "$BRANCHE"
            gh pr comment "$NUMERO" --repo "$DEPOT" --body 'Aides PR : formatage poussé (`chore: formatage automatique`). La CI est relancée.'
          fi
      - name: Retirer l'étiquette
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "$NUMERO" --remove-label corriger-format --repo "$DEPOT"
