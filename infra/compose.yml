# Tout l'hébergement de Janus. Depuis ce dossier : `docker compose up -d --build`.
# Les variables viennent de `.env` (modèle : `.env.exemple`).

x-journaux: &journaux
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  caddy:
    build:
      context: ..
      dockerfile: infra/caddy/Dockerfile
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAINE: ${DOMAINE:?DOMAINE manquant dans .env}
    volumes:
      - fiches:/fiches:ro
      - caddy_donnees:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [interne]
    logging: *journaux

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://janus_app:${JANUS_APP_MOT_DE_PASSE:?JANUS_APP_MOT_DE_PASSE manquant dans .env}@postgres:5432/janus
      DATABASE_URL_PROPRIETAIRE: postgres://janus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}@postgres:5432/janus
      ORIGINE_APPLI: https://app.${DOMAINE}
      FICHES_URL: https://fiches.${DOMAINE}
      FICHES_DIR: /fiches
      COOKIE_SECURE: 'true'
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY manquant dans .env}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY manquant dans .env}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY manquant dans .env}
      VAPID_SUJET: ${VAPID_SUJET:?VAPID_SUJET manquant dans .env}
    volumes:
      - fiches:/fiches
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/sante').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interne]
    logging: *journaux

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: janus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: janus
    volumes:
      - donnees:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U janus -d janus']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [interne]
    logging: *journaux

volumes:
  donnees:
  fiches:
  caddy_donnees:
  caddy_config:

networks:
  interne:
