<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; worker-src blob:"
    />
    <title>Exécuteur</title>
  </head>
  <body>
    <script>
      // Ce document tourne dans une iframe `sandbox="allow-scripts"` : son origine est opaque, il ne
      // voit ni les cookies ni le stockage de l'appli, et la politique ci-dessus coupe le réseau.
      // Le code testé ne tourne jamais ici mais dans un Web Worker, qu'on arrête au bout du délai.
      function travailleur() {
        self.onmessage = (evenement) => {
          const { code, entree } = evenement.data
          try {
            const declaration = /\bfunction\s*\*?\s*([A-Za-z_$][\w$]*)\s*\(/.exec(code)
            if (declaration === null) {
              self.postMessage({ ok: false, erreur: 'Aucune fonction déclarée.' })
              return
            }
            const fonction = new Function(code + '\n;return ' + declaration[1] + ';')()
            Promise.resolve(fonction(...entree)).then(
              (sortie) => {
                const json = JSON.stringify(sortie)
                self.postMessage({ ok: true, sortie: json === undefined ? null : JSON.parse(json) })
              },
              (erreur) => {
                self.postMessage({ ok: false, erreur: String(erreur) })
              },
            )
          } catch (erreur) {
            self.postMessage({ ok: false, erreur: String(erreur) })
          }
        }
      }

      const SOURCE = URL.createObjectURL(new Blob(['(' + travailleur.toString() + ')()']))

      function lancer(code, entree, delaiMs) {
        return new Promise((resoudre) => {
          const ouvrier = new Worker(SOURCE)
          const fin = (resultat) => {
            clearTimeout(minuteur)
            ouvrier.terminate()
            resoudre(resultat)
          }
          const minuteur = setTimeout(() => {
            fin({ ok: false, erreur: 'temps_depasse' })
          }, delaiMs)
          ouvrier.onmessage = (evenement) => {
            fin(evenement.data)
          }
          ouvrier.onerror = (evenement) => {
            fin({ ok: false, erreur: String(evenement.message) })
          }
          ouvrier.postMessage({ code, entree })
        })
      }

      addEventListener('message', async (evenement) => {
        if (evenement.source !== parent) return
        const demande = evenement.data
        if (typeof demande !== 'object' || demande === null || demande.type !== 'executer') return
        const resultats = []
        for (const cas of demande.cas) {
          resultats.push(await lancer(demande.code, cas.entree, demande.delaiMs))
        }
        parent.postMessage({ type: 'resultat', id: demande.id, resultats }, '*')
      })
      parent.postMessage({ type: 'pret' }, '*')
    </script>
  </body>
</html>
